      1. **k-obarvitelnost**, **chromatické číslo** $\chi(G)$; obarvení = rozklad na nezávislé množiny.
      2. Odhady: $\omega(G) \le \chi(G) \le \Delta(G) + 1$; **Brooks**: $\chi \le \Delta$ mimo úplné grafy a liché kružnice; $\chi \cdot \alpha \ge n$.
      3. $\chi(G) \le 2$ ⇔ graf nemá lichou kružnici (bipartitní) – polynomiální.
      4. **3-COL je NP-úplná** (věta 7.4) – i pro rovinné grafy; věta o čtyřech barvách.
      5. **Hranové barvení**, chromatický index, Vizing: $\Delta \le \chi' \le \Delta + 1$.
    algorithms: |
      - Test 2-obarvitelnosti (bipartitnosti): BFS, $O(n+m)$.
      - **Sekvenční (hladové) barvení**: $O(n+m)$, nejvýše $\Delta+1$ barev, výsledek závisí na pořadí (může být libovolně špatný).
      - Přesné $\chi(G)$: backtracking – exponenciální; rozhodnout 3-obarvitelnost je NP-úplné.
      - Rovinné grafy: 5-obarvení polynomiálně, 4-obarvení polynomiálně (ale složitě), test 3-obarvitelnosti NP-úplný.
    example_tasks: |
      - Určete chromatické číslo daného grafu (dolní odhad klikou / lichou kružnicí, horní obarvením).
