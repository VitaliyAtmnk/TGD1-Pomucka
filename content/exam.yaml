    outline: |
      1. **Nezávislá množina**, nezávislost $\alpha(G)$; rozdíl **maximální** (nerozšiřitelná) × **největší**.
      2. **Pokrytí**, $\beta(G)$; $A$ nezávislá ⇔ $U \setminus A$ pokrytí, tedy $\alpha + \beta = n$.
      3. **Klika**, klikovost $\omega(G)$, doplněk: $\alpha(G) = \omega(\bar G)$.
      4. **Dominantní množina**, $\gamma(G)$; maximální nezávislá množina je minimální dominantní, $\gamma \le \alpha$.
      5. **Jádro** (nezávislá + dominantní) – v neorientovaném grafu existuje vždy (každá maximální nezávislá množina).
      6. Souvislost s hamiltonovskostí (Chvátal–Erdős: $\alpha \le k$ pro $k$-souvislý ⇒ hamiltonovský).
    algorithms: |
      - **Maximální** nezávislá množina (a tedy jádro): hladově, $O(n+m)$.
      - **Největší** nezávislá množina: hrubou silou $O(2^n \cdot n^2)$, větvení; rozhodovací verze IND je **NP-úplná**.
      - Totéž pro klikovost (CLIQUE) a pokrytí (COV) – vzájemně převoditelné přes doplněk.
      - Pro pevné $k$ je INDₖ v P ($O(n^k)$ podmnožin), FPT pro pokrytí.
    example_tasks: |
      - Určete $\alpha, \beta, \omega, \gamma$ daného grafu a najděte jádro.
      - Ukažte graf, kde maximální nezávislá množina není největší.
      - Ukažte, že minimální dominantní množina nemusí být nezávislá.

