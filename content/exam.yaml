# Otázky k ústní zkoušce KMA/TGD1 (podle otazky.pdf, rok 2023).
# Ústní část: 2 otázky – jedna z 1.–10. (group 1) a jedna z 11.–20. (group 2), náhodný výběr.
# U všech otázek je hlavní důraz na algoritmické aspekty (algoritmy řešení a jejich složitost).
questions:
  - number: 1
    title: Homomorfismus a isomorfismus grafů; souvislost, stromy, kostry, minimální kostra
    group: 1
    chapters: [zaklady]
    items:
      - def-graf
      - def-homomorfismus
      - def-indukovane-zobrazeni
      - def-druhy-homomorfismu
      - prop-isomorfismus-vlastnosti
      - def-souvisly-graf
      - def-komponenta
      - def-strom
      - thm-charakterizace-stromu
      - def-kostra
      - prop-existence-kostry
      - def-minimalni-kostra
      - thm-minimalni-souvisly-faktor
      - lemma-mst-rez
      - alg-mst-odstranovani-kruznic
      - alg-jarnik-prim
      - alg-kruskal
    outline: |
      1. **Graf**, homomorfismus $f: G \to G'$ (zachovává hrany), indukované zobrazení $f^*$ na hranách.
      2. Druhy homomorfismů (uzlový/hranový mono- a epimorfismus), **isomorfismus** = $f$ i $f^*$ bijekce; $\simeq$ je ekvivalence.
         Invarianty isomorfismu (počet uzlů a hran, skóre, počet komponent…), ale shodné invarianty isomorfismus nezaručují.
      3. **Souvislost**, komponenty jako třídy ekvivalence „existuje cesta“.
      4. **Strom** – charakterizace (souvislý bez kružnic ⇔ mezi každými dvěma uzly právě jedna cesta ⇔ souvislý s $n-1$ hranami ⇔ …).
      5. **Kostra** – existuje právě v souvislém grafu; **minimální kostra** ohodnoceného grafu.
      6. Algoritmy minimální kostry a proč fungují (řezová vlastnost: nejlehčí hrana řezu leží v nějaké minimální kostře).
    algorithms: |
      - **Kruskal** (hladový): setřídění hran $O(m \log m)$, test kružnice přes komponenty (union–find) – celkem $O(m \log m)$.
      - **Jarník (Prim)**: roste jediný strom, $O(n^2)$ s polem, $O(m \log n)$ s haldou.
      - **Algoritmus 1 z přednášky** – odstraňování nejtěžší hrany kružnice (opak Kruskala).
      - Test souvislosti / nalezení kostry prohledáváním: $O(n+m)$.
      - Isomorfismus: zkoušení všech bijekcí je $n!$ – polynomiální algoritmus obecně není znám.
    example_tasks: |
      - Rozhodněte, které z daných grafů jsou isomorfní (najděte invariant, který je rozliší, nebo bijekci).
      - Najděte minimální kostru daného grafu Kruskalovým i Jarníkovým algoritmem. Je jednoznačná?
      - Proč hladový postup u minimální kostry dává optimum (a kde by selhal – např. u TSP)?

  - number: 2
    title: Metrika grafu, minimální cesta, distanční matice grafu
    group: 1
    chapters: [metrika-orientovane, grafy-matice]
    items:
      - def-vzdalenost
      - thm-metrika-grafu
      - def-w-delka-vzdalenost
      - thm-w-metrika
      - def-w-vzdalenost-orientovana
      - alg-dijkstra
      - def-matice-sousednosti-orientovaneho
      - thm-mocniny-matice-sousednosti
      - cor-distancni-matice-mocniny
      - thm-minplus-mocniny-cenove-matice
      - def-w-distancni-matice
      - alg-floyd
      - thm-floyd
      - rem-floyd-dijkstra
      - rem-floyd-rekonstrukce-cest
    outline: |
      1. **Vzdálenost** $d_G(u,v)$ – délka nejkratší cesty; je to **metrika** (nezápornost, symetrie, trojúhelníková nerovnost) na souvislém grafu.
      2. Ohodnocený graf, **w-délka** cesty a **w-vzdálenost**; v orientovaném grafu obecně není symetrická.
      3. **Minimální cesta** z jednoho uzlu – Dijkstrův algoritmus (předpoklad nezáporných vah).
      4. **Distanční matice** $\mathbf D^w(\vec G)$: výpočet mocninami matice sousednosti / (min,+) násobením, a Floydovým algoritmem.
      5. Myšlenka důkazu Floyda: $d^k_{ij}$ = délka minimální cesty s vnitřními uzly z $\{1,\dots,k\}$ (indukce podle $k$).
    algorithms: |
      - **Dijkstra**: $O(n^2)$ (s haldou $O((n+m)\log n)$), jen nezáporné váhy.
      - **Floyd**: $O(n^3)$, $n$ matic $\mathbf D_1,\dots,\mathbf D_n$, každý prvek v konstantním čase.
      - (min,+) mocniny cenové matice: $O(n^4)$ (opakovaným umocňováním $O(n^3 \log n)$).
      - Dijkstra spuštěný z každého uzlu: také $O(n^3)$.
      - Neohodnocený graf: vzdálenosti z jednoho uzlu prohledáváním do šířky v $O(n+m)$.
    example_tasks: |
      - Spočtěte Floydovým algoritmem matice $\mathbf D_0, \dots, \mathbf D_n$ pro daný orientovaný graf.
      - Proč Dijkstra selže při záporných vahách? Ukažte protipříklad.
      - Jak z Floydova algoritmu zrekonstruovat samotné minimální cesty?

  - number: 3
    title: Silná souvislost, kvazikomponenty, kondenzace, acyklické grafy, kritická cesta
    group: 1
    chapters: [metrika-orientovane]
    items:
      - def-polostupne
      - def-slaba-souvislost
      - def-silna-souvislost
      - prop-silna-souvislost-cesta
      - thm-silna-souvislost-cykly
      - def-kvazikomponenta
      - prop-kvazikomponenty-rozklad
      - alg-kvazikomponenty
      - def-kondenzace
      - thm-kondenzace
      - def-acyklicky-graf
      - def-vstupni-vystupni-uzel
      - prop-acyklicky-vstupni-vystupni
      - thm-acyklicke-grafy
      - alg-topologicke-cislovani
      - def-kriticka-cesta
      - alg-kriticka-cesta
    outline: |
      1. Orientovaný graf, polostupně, **slabá** a **silná souvislost**; silná souvislost ⇔ každá hrana leží na cyklu (pro souvislý graf).
      2. **Kvazikomponenty** = třídy ekvivalence „vzájemná dosažitelnost“, rozklad uzlů.
      3. **Kondenzace** – graf kvazikomponent; je vždy **acyklický**.
      4. **Acyklické grafy**: existuje vstupní i výstupní uzel; ekvivalentní charakterizace – lze očíslovat uzly tak, že hrany vedou od menších k větším (topologické uspořádání).
      5. **Kritická cesta** v acyklickém ohodnoceném grafu (síťový graf projektu) – nejdelší cesta, výpočet po topologickém pořadí.
    algorithms: |
      - **Test acykličnosti / topologické číslování**: opakované odebírání vstupního uzlu, $O(n+m)$.
      - **Kvazikomponenty**: přes dosažitelnost tam a zpět $O(n(n+m))$; Tarjan / Kosaraju (dvojí DFS) $O(n+m)$.
      - **Kritická cesta**: dynamické programování v topologickém pořadí $t(v) = \max\{t(u) + w(uv)\}$, $O(n+m)$.
      - Pozor: nejdelší cesta v obecném grafu je NP-těžká – acykličnost je klíčová.
    example_tasks: |
      - Najděte kvazikomponenty a kondenzaci daného grafu.
      - Vypočtěte kritickou cestu, nejdřívější a nejpozdější možné začátky činností.
      - Proč je kondenzace acyklická?

  - number: 4
    title: Rozložitelnost a slabá rozložitelnost matic
    group: 1
    chapters: [grafy-matice]
    items:
      - def-rozlozitelna-matice
      - rem-simultanni-permutace
      - def-diagram-matice
      - thm-rozlozitelnost-silna-souvislost
      - cor-nerozlozitelnost-diagram
      - alg-test-rozlozitelnosti
      - def-slabe-rozlozitelna
      - rem-slaba-rozlozitelnost
      - def-bigraf
      - def-bigraf-matice
      - def-stabilni-mnozina
      - thm-slaba-rozlozitelnost-stabilni-mnozina
      - def-kvazikomponenta
      - def-kondenzace
    outline: |
      1. **Rozložitelná matice**: simultánní permutací řádků a sloupců ($\mathbf{PAP}^T$) lze dostat blokově horní trojúhelníkový tvar s nulovým blokem.
      2. **Diagram matice** $\vec G(\mathbf A)$; simultánní permutace = přečíslování uzlů.
      3. **Věta 3.2**: silně souvislý ⇒ nerozložitelná; kvazikomponenty v pořadí kondenzace dávají blokově trojúhelníkový tvar s nerozložitelnými diagonálními bloky.
         **Důsledek**: $\mathbf A$ je nerozložitelná ⇔ diagram je silně souvislý.
      4. **Slabá rozložitelnost**: nezávislé permutace řádků a sloupců ($\mathbf{PAQ}$). Každá rozložitelná je slabě rozložitelná, ne naopak.
      5. **Bigraf matice**, **stabilní množina**; Věta 3.3: slabě rozložitelná ⇔ bigraf má stabilní množinu.
    algorithms: |
      - Test rozložitelnosti = test silné souvislosti diagramu: $O(n^2)$ pro matici $n \times n$ (graf má až $n^2$ hran), kvazikomponenty v lineárním čase vůči velikosti grafu.
      - Převod na blokový tvar: kvazikomponenty + topologické uspořádání kondenzace.
      - Naivně (všechny permutace) $n!$ – proto převod na grafovou úlohu.
      - Úplná nerozložitelnost lze testovat polynomiálně přes párování (Hall) – doplňkově.
    example_tasks: |
      - Převeďte danou matici simultánními permutacemi na horní blokově trojúhelníkový tvar.
      - Rozhodněte, zda je matice rozložitelná, slabě rozložitelná, nebo úplně nerozložitelná.

  - number: 5
    title: Generická hodnost matice
    group: 1
    chapters: [grafy-matice]
    items:
      - def-linearni-bigraf
      - def-parovani
      - thm-regularni-matice-parovani
      - rem-skoro-vsechny-hodnoty
      - def-strukturalni-matice
      - prop-dichotomie-strukturalni-matice
      - def-genericky-regularni
      - thm-genericka-regularita-parovani
      - def-genericka-hodnost
      - def-parovaci-cislo
      - thm-genericka-hodnost-parovaci-cislo
      - alg-parovani-max-tok
      - prop-parovani-a-tok
    outline: |
      1. Lineární bigraf, **párování**, **perfektní párování** v bigrafu.
      2. **Věta 3.4**: regulární matice ⇒ bigraf má perfektní párování (nenulový člen determinantu); opačně jen „existuje regulární matice s tímto bigrafem“ (volba $\varepsilon$). Ekvivalence obecně neplatí (protipříklad).
      3. **Strukturální matice** – nenulové prvky jako nezávislé parametry; regularita pro „skoro všechny“ hodnoty.
      4. **Generická regularita** ⇔ perfektní párování; **generická hodnost** = **párovací číslo** bigrafu (Věta 3.6).
      5. Význam: vlastnost závislá jen na rozmístění nul (aplikace v teorii řízení – strukturální řiditelnost).
    algorithms: |
      - **Párovací číslo** (maximální párování v bigrafu) převodem na **maximální tok**: zdroj → řádky → sloupce → stok, jednotkové propustnosti; Ford–Fulkerson $O(nm)$ (tok ≤ n zlepšení po $O(m)$).
      - Hopcroft–Karp $O(m\sqrt n)$ (doplňkově).
      - Generickou hodnost tak lze spočítat polynomiálně, i když numerická hodnost závisí na hodnotách.
    example_tasks: |
      - Určete generickou hodnost dané strukturální matice (najděte maximální párování).
      - Ukažte matici, jejíž bigraf má perfektní párování, a přesto je singulární.

  - number: 6
    title: Síť, tok, existence toku v síti
    group: 1
    chapters: [toky]
    items:
      - def-sit
      - def-tok
      - def-intenzita-propustnost
      - def-rez
      - def-oznaceni-souctu
      - prop-bilance-mnoziny
      - thm-existence-toku
      - rem-fiktivni-zdroj-stok
    outline: |
      1. **Síť** – orientovaný graf s propustnostmi hran $r_{ij} > 0$ a intenzitami uzlů $a_i$ (zdroje, stoky, neutrální uzly).
      2. **Tok**: zákon zachování $\sum_j x_{ij} - \sum_j x_{ji} = a_i$ a omezení $0 \le x_{ij} \le r_{ij}$. Motivace dopravní úlohou.
      3. **Řez** $(A, \bar A)$, značení $f(A)$, $g(A,\bar A)$; Tvrzení 2.1: $a(A) = x(A,\bar A) - x(\bar A, A)$.
      4. **Věta 2.1** (existence toku): tok existuje ⇔ $a(U) = 0$ a $a(A) \le r(A, \bar A)$ pro každou $A$.
         Nutnost přímo z tvrzení 2.1; postačitelnost převodem na síť s jedním zdrojem a stokem (fiktivní $z$, $s$) a Ford–Fulkersonovou větou.
    algorithms: |
      - Existenci toku testujeme algoritmicky: přidáme fiktivní zdroj a stok, najdeme **maximální tok** (Ford–Fulkerson / Edmonds–Karp $O(nm^2)$) a ověříme, zda nasytí všechny hrany ze zdroje.
      - Přímé ověření podmínky přes všechny množiny $A$ by bylo exponenciální ($2^n$ řezů).
    example_tasks: |
      - Rozhodněte, zda v dané síti existuje tok (najděte ho, nebo množinu $A$ porušující podmínku).
      - Proč v sítích z příkladu ve skriptech tok neexistuje?

  - number: 7
    title: Maximální tok v síti, Ford–Fulkersonova věta
    group: 1
    chapters: [toky]
    items:
      - def-velikost-toku
      - def-maximalni-tok
      - def-minimalni-rez
      - prop-tok-a-rez
      - rem-naivni-orientovane-cesty
      - def-polocesta
      - def-rezervni-polocesta
      - prop-rezervni-polocesta
      - thm-ford-fulkerson
      - cor-charakterizace-max-toku
      - alg-ford-fulkerson
      - prop-konecnost-ff
      - rem-ff-zavislost-na-propustnostech
      - alg-edmonds-karp
      - thm-edmonds-karp-slozitost
    outline: |
      1. Síť s jedním zdrojem a stokem, **velikost toku**, **maximální tok**, propustnost řezu, **minimální řez**.
      2. Tvrzení 2.2: $|x| = x(A,\bar A) - x(\bar A,A) \le r(A,\bar A)$ pro řez oddělující $z$ a $s$.
      3. Proč nestačí hledat orientované cesty (protipříklad) → **polocesta**, **rezerva**, **rezervní polocesta**.
      4. **Ford–Fulkersonova věta**: max. tok = min. řez. Důkaz: $R$ = uzly dosažitelné ze $z$ po rezervních polocestách; hrany z $R$ nasycené, do $R$ nulové.
      5. Algoritmus a jeho konečnost (celočíselné propustnosti), patologie (závislost na propustnostech, iracionální čísla).
    algorithms: |
      - **Ford–Fulkerson**: každé zlepšení $O(m)$, počet zlepšení až $|x^*|$ (závisí na propustnostech – příklad s $2Q$ kroky); pro iracionální propustnosti nemusí skončit.
      - **Edmonds–Karp**: nejkratší rezervní polocesta (BFS) ⇒ nejvýše $O(nm)$ zlepšení, celkem $O(nm^2)$, nezávisle na propustnostech.
      - Minimální řez se získá zdarma z posledního prohledávání (množina $R$).
    example_tasks: |
      - Najděte maximální tok a minimální řez v dané síti.
      - Ukažte, proč je zlepšení podél nesouhlasné hrany nutné.
      - Kolik kroků potřebuje Ford–Fulkerson v síti s propustnostmi $Q$ při nešťastné volbě?

  - number: 8
    title: Míry souvislosti grafu
    group: 1
    chapters: [miry-souvislosti]
    items:
      - def-most
      - thm-most-liche-stupne
      - def-artikulace
      - def-blok
      - thm-bloky-hranove-disjunktni
      - def-blokovy-graf
      - thm-blokovy-graf-strom
      - def-hranovy-rez
      - def-hranovy-stupen-mezi-uzly
      - def-uzlovy-rez
      - def-uzlovy-stupen-mezi-uzly
      - def-stupen-souvislosti-grafu
      - thm-u-h-delta
      - thm-h-odhad-hran
      - thm-ford-fulkerson-hranova-souvislost
      - thm-menger
      - cor-whitney-globalni
    outline: |
      1. **Most**, **artikulace**, **blok**; bloky sdílejí nejvýše jeden uzel (artikulaci), **blokový graf** je strom.
      2. Hranový / uzlový řez mezi $x$ a $y$, **hranový stupeň souvislosti** $h(G)$, **uzlový stupeň souvislosti** $u(G)$, $k$-souvislost.
      3. Věta 4.4: $u(G) \le h(G) \le \delta(G)$; odhad počtu hran $k$-souvislého grafu.
      4. **Charakterizační věty**: hranová verze (Ford–Fulkerson) – $k$ hranově disjunktních cest ⇔ hranově $k$-souvislý mezi $x,y$; **Menger** – uzlově disjunktní cesty; Whitneyho globální verze.
      5. Spojení s toky: jednotkové propustnosti, půlení uzlů pro uzlovou souvislost.
    algorithms: |
      - Mosty, artikulace a bloky: jedno prohledávání do hloubky (Tarjan, dolní čísla) – $O(n+m)$.
      - $h(x,y)$ = maximální tok s jednotkovými propustnostmi; $h(G)$ stačí $n-1$ toků z pevného uzlu.
      - $u(x,y)$ přes půlení uzlů ($x' \to x''$ propustnost 1) a maximální tok; $u(G)$ přes všechny dvojice (resp. chytřejší výběr).
      - Vše polynomiální (vs. např. hamiltonovskost).
    example_tasks: |
      - Najděte mosty, artikulace, bloky a blokový graf daného grafu.
      - Určete $u(G)$ a $h(G)$ a najděte příslušné disjunktní cesty / minimální řezy.
      - Ukažte graf s $u(G) < h(G) < \delta(G)$.

