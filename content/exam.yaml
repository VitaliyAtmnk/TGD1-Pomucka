    outline: |
      1. **Eulerovský graf** (uzavřený tah přes všechny hrany); věta: souvislý a všechny stupně sudé. Problém EUL je v P.
      2. **Hamiltonovský graf** (kružnice přes všechny uzly) – kontrast: žádná jednoduchá charakterizace, problém je NP-úplný.
      3. Postačující podmínky: **Dirac** ($\delta \ge n/2$), **Ore** ($d(u)+d(v) \ge n$ pro nesousední), **uzávěr** a **Bondy–Chvátal** ($G$ hamiltonovský ⇔ $cl(G)$ hamiltonovský).
      4. **Backtracking** pro generování hamiltonovských cest a kružnic; **heuristiky** (Pósova rotace).
      5. Úloha obchodního cestujícího (TSP) jako optimalizační verze.
    algorithms: |
      - Test eulerovskosti: stupně + souvislost $O(n+m)$; nalezení eulerovského tahu (Hierholzer / Fleury) $O(n+m)$ (Fleury $O(m^2)$).
      - Hamiltonovská kružnice: backtracking – v nejhorším exponenciálně (řádově $n!$); problém je **NP-úplný**.
      - Uzávěr grafu: polynomiálně ($O(n^4)$ přímočaře); je-li uzávěr úplný, je graf hamiltonovský a kružnici lze zpětně zkonstruovat.
      - Heuristiky: polynomiální, ale nezaručují nalezení kružnice.
    example_tasks: |
      - Rozhodněte, zda je graf eulerovský / hamiltonovský, a najděte příslušný tah / kružnici.
      - Sestrojte uzávěr grafu a použijte Bondy–Chvátalovu větu.
      - Proč je EUL v P, zatímco HAM je NP-úplný?

