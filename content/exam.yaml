    outline: |
      1. Motivace: NP-úplné problémy bývají „snadné“, je-li nějaký **parametr** $k$ malý. **Parametrizovaný problém** $(x, k)$.
      2. Třída **FPT**: čas $f(k) \cdot n^{O(1)}$; třída **XP**: $n^{f(k)}$. FPT ⊆ XP.
      3. **k-COV** (vrcholové pokrytí velikosti ≤ k): **omezený strom hledání** – pro hranu $uv$ musí být $u$ nebo $v$ v pokrytí → větvení, hloubka ≤ k.
      4. **Kernelizace** (Bussova pravidla): uzel stupně > k musí být v pokrytí; po redukci zbude ≤ $k^2$ hran. Problém je FPT ⇔ má jádro.
      5. Kontrast: $IND_k$ / CLIQUE parametrizované $k$ jsou W[1]-těžké (pravděpodobně nejsou FPT).
      *Pozn.: téma není ve skriptech ani foliích, které má portál k dispozici – doplněno ze standardní literatury.*
    algorithms: |
      - k-COV stromem hledání: $O(2^k (n+m))$; vylepšené větvení podle stupně $O(1{,}4656^k \cdot n^{O(1)})$; nejlepší známé ≈ $O(1{,}2738^k + kn)$.
      - Bussova kernelizace: $O(n+m)$, jádro s $O(k^2)$ hranami, pak hrubá síla na jádru.
      - Naivně $\binom{n}{k}$ podmnožin = $O(n^k)$ – jen XP.
    example_tasks: |
      - Proveďte algoritmus omezeného stromu hledání pro malý graf a $k = 2$ nebo $3$.
      - Aplikujte Bussova pravidla a odhadněte velikost jádra.
      - Proč je $2^k n$ „lepší“ než $n^k$, i když jsou obě pro pevné $k$ polynomiální?
