  - id: def-tsp
    kind: definition
    label: TSP
    section: "1.3"
    title: Problém obchodního cestujícího (TSP)
    terms: [TSP, problém obchodního cestujícího, obchodní cestující, travelling salesman, rozhodovací strom, hrubá síla]
    statement: |
      **TSP** (problém obchodního cestujícího)

      - **Vstup:** ohodnocený graf $G$,
      - **Úkol:** najít v $G$ hamiltonovskou kružnici $C$ s minimální hodnotou $\sum_{h \in H(C)} w(h)$,
      - **Výstup:** kružnice $C$.
    intuition: |
      Obchodní cestující má navštívit všechna města a vrátit se domů s co nejmenšími náklady. Přímočaré
      řešení prochází **rozhodovací strom**: z výchozího uzlu postupně volíme dalšího dosud nenavštíveného
      souseda; každá větev, která dojde do všech uzlů a může se vrátit, je hamiltonovská kružnice. Počet
      větví ale roste až jako $(n-1)!$, takže pro větší $n$ je to nepoužitelné (viz
      [tabulku růstu funkcí](#rem-polynomialni-vs-exponencialni)).

      TSP je NP-těžký: už samotné rozhodnutí, zda hamiltonovská kružnice existuje, je NP-úplné.
      Systematické prohledávání rozhodovacího stromu se nazývá backtracking (kapitola o prohledávání).
    examples:
      - title: TSP rozhodovacím stromem
        body: |
          Graf na obrázku má 8 uzlů. Rozhodovací strom z uzlu $A$ (větvení podle dalšího navštíveného souseda,
          větev končí, když nelze pokračovat) najde jen čtyři úplné větve, které se vrátí do $A$. Jsou to dvě
          hamiltonovské kružnice, každá prošlá v obou směrech:

          - $A, F, E, D, C, H, G, B, A$ s hodnotou $8 + 14 + 6 + 8 + 5 + 7 + 7 + 5 = 60$,
          - $A, F, G, H, E, D, C, B, A$ s hodnotou $8 + 6 + 7 + 5 + 6 + 8 + 9 + 5 = 54$.

          Optimální okružní cesta je tedy $A, F, G, H, E, D, C, B, A$ s hodnotou **54**.
          Většina větví stromu přitom skončí „slepě" – to je cena za hrubou sílu.
        graph:
          directed: false
          nodes:
            - { id: A, x: 0, y: 5 }
            - { id: F, x: 2, y: 2 }
            - { id: B, x: 2, y: 8 }
            - { id: G, x: 4, y: 5 }
            - { id: H, x: 6, y: 5 }
            - { id: E, x: 8, y: 2 }
            - { id: C, x: 8, y: 8 }
            - { id: D, x: 10, y: 5 }
          edges:
            - { from: A, to: F, w: 8 }
            - { from: A, to: B, w: 5 }
            - { from: F, to: G, w: 6 }
            - { from: F, to: E, w: 14 }
            - { from: B, to: G, w: 7 }
            - { from: B, to: C, w: 9 }
            - { from: G, to: H, w: 7 }
            - { from: H, to: E, w: 5 }
            - { from: H, to: D, w: 5 }
            - { from: H, to: C, w: 5 }
            - { from: E, to: D, w: 6 }
            - { from: D, to: C, w: 8 }
    visualization: hamilton-backtracking
    related: [def-hamiltonovsky-graf, rem-polynomialni-vs-exponencialni]
    source: "přednáška 2, folie 5–6"
    supplemented: false

  - id: rem-polynomialni-vs-exponencialni
    kind: remark
    label: Poznámka
    section: "1.3"
    title: Polynomiální versus exponenciální algoritmy
    terms: [časová složitost, polynomiální algoritmus, exponenciální algoritmus, růst funkcí, zrychlení počítače]
    statement: |
      Předpokládejme, že jedna operace trvá $1\,\mu s$. Algoritmus s $f(n)$ operacemi zpracuje vstup velikosti $n$ za:

      | $n$ | $n^2$ | $n^3$ | $2^n$ | $n!$ |
      |---|---|---|---|---|
      | 20 | 0,4 ms | 8 ms | ≈ 1 s | ≈ 77 000 let |
      | 60 | 3,6 ms | 0,2 s | ≈ 36 600 let | – |
      | 1000 | 1 s | ≈ 17 min | – | – |

      Zrychlíme-li počítač $1000\times$, vzroste velikost úlohy zvládnutelné ve stejném čase (z původních $n = 100$)
      u $n^2$ na $\approx 3162$, u $n^3$ na $1000$, ale u $2^n$ jen na $\approx 109$ a u $n!$ na $101$.
    intuition: |
      Polynomiální algoritmy (Dijkstra, Jarník, test eulerovskosti, topologické uspořádání…) jsou „použitelné":
      rychlejší počítač násobně zvětší řešitelné úlohy. U exponenciálních algoritmů (hrubá síla pro TSP, HAM)
      zrychlení skoro nepomůže – $2^n$ se zrychlením $1000\times$ posune jen o $\log_2 1000 \approx 10$.
      Proto je otázka „existuje polynomiální algoritmus?" (třídy P a NP) ústředním tématem předmětu.
    related: [cor-eul-polynomialni, def-tsp, cor-acyc-polynomialni]
    source: "přednáška 2, folie 7–8"
    supplemented: false

  # ------------------------------------------------------------------ 1.4
  - id: def-specialni-orientovane-grafy
    kind: definition
    label: Orientované grafy
    section: "1.4"
    title: Speciální orientované grafy (úplný graf, orientovaná cesta, cyklus)
    terms: [orientovaný úplný graf, orientovaná cesta, cyklus, smyčka, cyklus délky 1]
    statement: |
      - **Orientovaný úplný graf:** $\vec{K}_n = (\langle 1,n\rangle, \langle 1,n\rangle \times \langle 1,n\rangle)$.
      - **Orientovaná cesta délky $n \ge 0$:** $\vec{P}_n = (\langle 0,n\rangle, \{(i,i+1) \mid i \in \langle 0,n-1\rangle\})$.
      - **Cyklus délky $n \ge 1$:** $\vec{C}_n = (\langle 1,n\rangle, \{(i,i+1) \mid i \in \langle 1,n-1\rangle\} \cup \{(n,1)\})$
        pro $n \ge 2$; pro $n = 1$ dodefinujeme $\vec{C}_1 = (\{1\}, \{(1,1)\})$.
    intuition: |
      Rozdíly oproti neorientovanému případu: $\vec{K}_n$ obsahuje **všechny** uspořádané dvojice včetně smyček $(i,i)$;
      cyklus může mít délku 2 (dvojice protisměrných hran) i 1 (smyčka). Smyčka je tedy cyklus, a graf se smyčkou
      není acyklický.
    related: [def-graf, def-orientovany-sled-tah-cesta, def-uzavreny-orientovany-sled-cyklus]
    source: "přednáška 2, folie 9"
    supplemented: false

  - id: def-polostupne
    kind: definition
    label: Definice
    section: "1.4"
    title: Výstupní a vstupní (polo)stupeň
    terms: [výstupní stupeň, vstupní stupeň, polostupeň, výstupní polostupeň, vstupní polostupeň, outdegree, indegree]
    statement: |
      Nechť $\vec{G}$ je orientovaný graf, $u \in U(\vec{G})$.

      - **Výstupní (polo)stupeň** uzlu $u$ v grafu $\vec{G}$ je číslo
        $d^-_{\vec{G}}(u) = |\{(u,x) \mid x \in U(\vec{G})\} \cap H(\vec{G})|$.
      - **Vstupní (polo)stupeň** uzlu $u$ v grafu $\vec{G}$ je číslo
        $d^+_{\vec{G}}(u) = |\{(x,u) \mid x \in U(\vec{G})\} \cap H(\vec{G})|$.
    intuition: |
      **Pozor na značení:** v TGD1 je $d^-$ **výstupní** (počet hran, které z uzlu vycházejí) a $d^+$ **vstupní**
      (počet hran, které do uzlu vcházejí). V jiné literatuře bývá konvence opačná – při zkoušce se držte té ze skript.
      Pomůcka: hrana z uzlu „odchází", uzel o ni „přichází" ($-$), do uzlu hrana „přibude" ($+$).

      Smyčka $(u,u)$ přispívá jedničkou k oběma polostupňům.
    related: [thm-soucet-polostupnu, def-vstupni-vystupni-uzel, def-stupen-uzlu]
    source: "přednáška 2, folie 9"
    supplemented: false

  - id: thm-soucet-polostupnu
    kind: theorem
    label: Věta
    section: "1.4"
    title: Součet polostupňů
    terms: [součet polostupňů, orientovaný princip sudosti]
    statement: |
      Pro každý orientovaný graf $\vec{G}$ platí
      $$
      \sum_{u \in U(\vec{G})} d^-_{\vec{G}}(u) = \sum_{u \in U(\vec{G})} d^+_{\vec{G}}(u) = |H(\vec{G})|.
      $$
    intuition: |
      Každá hrana $(x,y)$ má právě jeden počátek (přispěje k výstupnímu stupni uzlu $x$) a právě jeden konec
      (přispěje ke vstupnímu stupni uzlu $y$). Orientovaná obdoba věty $\sum d = 2m$.
    proof: |
      *Důkaz není ve foliích, doplněno.*

      Množinu hran rozdělíme podle počátečního uzlu: hrany s počátkem $u$ jsou právě prvky množiny
      $\{(u,x) \mid x \in U\} \cap H(\vec{G})$, jejíž velikost je $d^-_{\vec{G}}(u)$. Tyto množiny jsou pro různá $u$
      disjunktní a jejich sjednocení je celé $H(\vec{G})$, takže $\sum_u d^-_{\vec{G}}(u) = |H(\vec{G})|$.
      Stejně rozdělením podle koncového uzlu dostaneme $\sum_u d^+_{\vec{G}}(u) = |H(\vec{G})|$. $\square$
    proof_steps:
      - Hrany rozdělíme podle jejich počátečního uzlu; třída uzlu u má právě d^-(u) prvků.
      - Třídy jsou disjunktní a pokrývají všechny hrany, proto je součet výstupních stupňů roven |H|.
      - Stejným rozdělením podle koncového uzlu dostaneme, že i součet vstupních stupňů je |H|.
    related: [def-polostupne, thm-soucet-stupnu]
    source: "přednáška 2, folie 9"
    supplemented: false

  - id: def-orientovany-sled-tah-cesta
    kind: definition
    label: Definice
    section: "1.4"
    title: Orientovaný sled, tah a cesta
    terms: [orientovaný sled, orientovaný tah, orientovaná cesta, dosažitelnost]
    statement: |
      1. Buď $\vec{G}$ graf, $u, v \in U(\vec{G})$, a nechť $f : \vec{P}_k \to \vec{G}$ je homomorfismus takový, že
         $f(0) = u$ a $f(k) = v$. Pak se graf $f(\vec{P}_k)$ nazývá **orientovaný sled délky $k$ z uzlu $u$ do uzlu $v$**
         v grafu $\vec{G}$.
      2. Je-li navíc $f$ hranový monomorfismus, pak se $f(\vec{P}_k)$ nazývá **orientovaný tah** (délky $k$ z $u$ do $v$ v $\vec{G}$).
      3. Je-li navíc $f$ uzlový monomorfismus, pak se $f(\vec{P}_k)$ nazývá **orientovaná cesta** (délky $k$ z $u$ do $v$ v $\vec{G}$).
    intuition: |
      Totéž jako v neorientovaném případě, jen se smí chodit **pouze ve směru šipek**. Existuje-li orientovaný sled
      z $u$ do $v$, říkáme, že $v$ je **dosažitelný** z $u$. Dosažitelnost není symetrická.
    related: [def-sled-tah-cesta, def-silna-souvislost, def-uzavreny-orientovany-sled-cyklus]
    source: "přednáška 2, folie 10"
    supplemented: false

  - id: def-uzavreny-orientovany-sled-cyklus
    kind: definition
    label: Definice
    section: "1.4"
    title: Uzavřený orientovaný sled, uzavřený orientovaný tah, cyklus
    terms: [uzavřený orientovaný sled, uzavřený orientovaný tah, cyklus, orientovaná kružnice, délka cyklu]
    statement: |
      1. Nechť $\vec{G}$ je graf a $f : \vec{C}_k \to \vec{G}$ je homomorfismus. Pak se graf $f(\vec{C}_k)$ nazývá
         **uzavřený orientovaný sled délky $k$** v grafu $\vec{G}$.
      2. Je-li navíc $f$ hranový monomorfismus, pak se $f(\vec{C}_k)$ nazývá **uzavřený orientovaný tah** (délky $k$ v $\vec{G}$).
      3. Je-li navíc $f$ uzlový monomorfismus, pak se $f(\vec{C}_k)$ nazývá **cyklus** (délky $k$ v $\vec{G}$).
    intuition: |
      Cyklus je orientovaná obdoba kružnice; může mít délku 1 (smyčka) nebo 2 (hrany $(x,y)$ a $(y,x)$).
      Užitečné pozorování: **každý uzavřený orientovaný sled kladné délky obsahuje cyklus** – nejkratší uzavřený
      orientovaný sled kladné délky v daném grafu je cyklus (jinak by šel zkrátit u opakujícího se uzlu).
    related: [def-specialni-orientovane-grafy, def-acyklicky-graf, thm-silna-souvislost-cykly]
    source: "přednáška 2, folie 10"
    supplemented: false

  - id: def-slaba-souvislost
    kind: definition
    label: Definice
    section: "1.4"
    title: (Slabá) souvislost orientovaného grafu
    terms: [slabá souvislost, slabě souvislý graf, souvislý orientovaný graf, symetrizace]
    statement: |
      Řekneme, že orientovaný graf $\vec{G}$ je **(slabě) souvislý**, jestliže jeho symetrizace je souvislý
      neorientovaný graf.

      (**Symetrizací** grafu $\vec{G}$ rozumíme neorientovaný graf $G$ s $U(G) = U(\vec{G})$ a
      $H(G) = \{\{x,y\} \mid x \ne y,\ (x,y) \in H(\vec{G})\}$ – zapomeneme orientaci, smyčky vynecháme a
      protisměrné hrany splynou.)
    intuition: |
      Slabá souvislost = graf je „v jednom kuse", pokud se nedíváme na šipky. Nic neříká o tom, zda se lze
      z každého uzlu dostat do každého po směru hran – to je silná souvislost.
    related: [def-silna-souvislost, def-souvisly-graf]
    source: "přednáška 2, folie 10 (pojem symetrizace doplněn)"
    supplemented: false

  - id: def-silna-souvislost
    kind: definition
    label: Definice
    section: "1.4"
    title: Silně souvislý graf
    terms: [silná souvislost, silně souvislý graf, strongly connected]
    statement: |
      Řekneme, že orientovaný graf $\vec{G}$ je **silně souvislý**, jestliže pro každou dvojici uzlů
      $u, v \in U(\vec{G})$ existuje v $\vec{G}$ orientovaný sled z $u$ do $v$.
    intuition: |
      Z každého uzlu se lze po šipkách dostat do každého (silniční síť jednosměrek, kde nikde neuvízneme).
      Silně souvislý ⇒ slabě souvislý, ne naopak: orientovaná cesta $\vec{P}_2$ je slabě, ale ne silně souvislá.
      Silnou souvislost lze otestovat dvěma prohledáváními (z uzlu $u$ v $\vec{G}$ a v grafu s obrácenými hranami)
      v čase $O(n + m)$.
    illustrations:
      - title: Otočení jediné hrany
        property: strongly-connected
        graph:
          directed: true
          nodes:
            - { id: a, x: 1, y: 1 }
            - { id: b, x: 9, y: 1 }
            - { id: c, x: 9, y: 9 }
            - { id: d, x: 1, y: 9 }
          edges:
            - { from: a, to: b }
            - { from: b, to: c }
            - { from: c, to: d }
            - { from: d, to: a }
            - { from: a, to: c }
        steps:
          - caption: |
              Po šipkách obejdeme cyklus $a \to b \to c \to d \to a$, takže z každého uzlu se dostaneme do každého – graf je silně souvislý.
          - caption: |
              Otočíme hranu $b \to c$. Z uzlu $b$ teď nevede žádná hrana, takže z něj nedojdeme nikam. Graf je dál slabě souvislý, ale silně souvislý není – $\{b\}$ je samostatná kvazikomponenta.
            remove: [[b, c]]
            add: [[c, b]]
          - caption: |
              Hrana $b \to d$ otevře z $b$ cestu ven ($b \to d \to a$) a graf je znovu silně souvislý. Silná souvislost závisí na směru hran, slabá ne.
            add: [[b, d]]
    related: [prop-silna-souvislost-cesta, thm-silna-souvislost-cykly, def-kvazikomponenta, def-slaba-souvislost]
    source: "přednáška 2, folie 10"
    supplemented: false

  - id: prop-silna-souvislost-cesta
    kind: proposition
    label: Větička
    section: "1.4"
    title: Silná souvislost pomocí orientovaných cest
    terms: [silná souvislost, orientovaná cesta, nejkratší orientovaný sled]
    statement: |
      Graf $\vec{G}$ je silně souvislý, právě když pro každé $u, v \in U(\vec{G})$ existuje v $\vec{G}$
      orientovaná cesta z $u$ do $v$.
    intuition: |
      Stejně jako v neorientovaném případě: z orientovaného sledu lze vystřihnout uzavřené úseky
      a zbude orientovaná cesta se stejnými konci.
    proof: |
      *Důkaz není ve foliích, doplněno.*

      **(⇐)** Orientovaná cesta je orientovaný sled.

      **(⇒)** Mezi orientovanými sledy z $u$ do $v$ zvolme sled $u = x_0, x_1, \dots, x_k = v$ nejmenší délky.
      Kdyby $x_i = x_j$ pro $i < j$, pak $x_0, \dots, x_i, x_{j+1}, \dots, x_k$ je orientovaný sled z $u$ do $v$
      (hrana $(x_j, x_{j+1}) = (x_i, x_{j+1})$ existuje) kratší o $j - i$ – spor. Uzly jsou tedy navzájem různé
      a sled je orientovaná cesta. $\square$
    proof_steps:
      - Směr zprava doleva je triviální, protože orientovaná cesta je orientovaný sled.
      - Pro opačný směr vezmeme nejkratší orientovaný sled z u do v.
      - Kdyby se v něm opakoval uzel, vynecháním úseku mezi výskyty by vznikl kratší orientovaný sled se stejnými konci.
      - Nejkratší sled proto nemá opakované uzly a je orientovanou cestou.
    related: [def-silna-souvislost, prop-souvislost-cesta]
    source: "přednáška 2, folie 10"
    supplemented: false

  - id: thm-silna-souvislost-cykly
    kind: theorem
    label: Věta
    section: "1.4"
    title: Silná souvislost a cykly
    terms: [silná souvislost, každá hrana v cyklu, cykly]
    statement: |
      Souvislý orientovaný graf $\vec{G}$ s alespoň 2 uzly je silně souvislý, právě když každá jeho hrana leží
      v alespoň jednom cyklu.
    intuition: |
      Leží-li hrana $(x,y)$ na cyklu, lze se po zbytku cyklu vrátit z $y$ do $x$ – hrana je „obousměrně průchodná".
      Jsou-li takové všechny hrany a graf je slabě souvislý, lze každou neorientovanou cestu symetrizace projít
      i v orientovaném grafu. Předpoklad souvislosti je nutný: dva disjunktní cykly mají každou hranu v cyklu,
      ale silně souvislé nejsou.
    proof: |
      *Důkaz není ve foliích, doplněno.*

      **(⇒)** Nechť $\vec{G}$ je silně souvislý a $(x,y) \in H(\vec{G})$. Je-li $x = y$, je hrana smyčkou, tj. cyklem
      $\vec{C}_1$. Jinak podle [větičky](#prop-silna-souvislost-cesta) existuje orientovaná cesta $Q$ z $y$ do $x$;
      ta neobsahuje hranu $(x,y)$ (uzel $x$ je na $Q$ až poslední). Spojením hrany $(x,y)$ a cesty $Q$ dostaneme
      cyklus obsahující $(x,y)$.

      **(⇐)** Nechť každá hrana leží na cyklu. Pro hranu $(x,y)$ pak existuje orientovaný sled z $x$ do $y$ (hrana sama)
      i z $y$ do $x$ (zbytek cyklu). Buďte $u, v$ libovolné uzly. Protože $\vec{G}$ je slabě souvislý, existuje
      v symetrizaci cesta $u = z_0, z_1, \dots, z_r = v$. Každá její hrana $\{z_{t}, z_{t+1}\}$ pochází z orientované
      hrany $(z_t, z_{t+1})$ nebo $(z_{t+1}, z_t)$, a v obou případech existuje orientovaný sled z $z_t$ do $z_{t+1}$.
      Složením těchto sledů vznikne orientovaný sled z $u$ do $v$. Tedy $\vec{G}$ je silně souvislý. $\square$
    proof_steps:
      - "(⇒) Pro hranu (x, y) existuje ze silné souvislosti orientovaná cesta z y zpět do x (smyčka je cyklem sama o sobě)."
      - "(⇒) Hrana (x, y) spolu s touto cestou tvoří cyklus."
      - "(⇐) Leží-li hrana na cyklu, lze ji projít v obou směrech – dopředu přímo, dozadu po zbytku cyklu."
      - "(⇐) Ze slabé souvislosti vede mezi u a v cesta v symetrizaci a každý její krok lze realizovat orientovaným sledem."
      - "(⇐) Složením těchto sledů dostaneme orientovaný sled z u do v, takže graf je silně souvislý."
    illustrations:
      - title: Hrana mimo cyklus brání silné souvislosti
        property: strongly-connected
        graph:
          directed: true
          nodes:
            - { id: a, x: 0.5, y: 1 }
            - { id: b, x: 0.5, y: 9 }
            - { id: c, x: 3.5, y: 5 }
            - { id: d, x: 6.5, y: 5 }
            - { id: e, x: 9.5, y: 1 }
            - { id: f, x: 9.5, y: 9 }
          edges:
            - { from: a, to: b }
            - { from: b, to: c }
            - { from: c, to: a }
            - { from: d, to: e }
            - { from: e, to: f }
            - { from: f, to: d }
        steps:
          - caption: |
              Každá hrana leží na cyklu, ale graf není ani slabě souvislý. Proto věta souvislost předpokládá.
          - caption: |
              Hrana $c \to d$ graf (slabě) spojí, ale sama na žádném cyklu neleží: z $d$ se do $c$ vrátit nelze. Graf proto silně souvislý není.
            add: [[c, d]]
          - caption: |
              Hrana $f \to b$ uzavře cyklus $c \to d \to e \to f \to b \to c$. Teď leží na cyklu každá hrana a graf je silně souvislý.
            add: [[f, b]]
          - caption: |
              Myšlenka důkazu: hranu $c \to d$ lze „projít pozpátku“ po zbytku cyklu $d \to e \to f \to b \to c$. Každý krok neorientované cesty tak nahradíme orientovaným sledem.
            nodes: { d: source, c: sink }
            edges: { c-d: active, d-e: path, e-f: path, f-b: path, b-c: path }
    related: [def-silna-souvislost, def-slaba-souvislost, def-uzavreny-orientovany-sled-cyklus]
    source: "přednáška 2, folie 11"
    supplemented: false

  - id: def-kvazikomponenta
    kind: definition
    label: Definice
    section: "1.4"
    title: Kvazikomponenta (silná komponenta)
    terms: [kvazikomponenta, silná komponenta, silně souvislá komponenta, komponenta silné souvislosti, SCC, strongly connected component]
    statement: |
      Buď $\vec{G}' \subset \vec{G}$. Řekneme, že graf $\vec{G}'$ je **kvazikomponenta** (silná komponenta)
      grafu $\vec{G}$, jestliže

      1. $\vec{G}'$ je silně souvislý graf,
      2. je-li $\vec{G}' \subset \vec{G}'' \subset \vec{G}$ a $\vec{G}''$ je silně souvislý, pak $\vec{G}' = \vec{G}''$.

      (Tedy: kvazikomponenty grafu $\vec{G}$ jsou jeho maximální silně souvislé podgrafy.)
    intuition: |
      Kvazikomponenta je maximální skupina uzlů, které jsou navzájem dosažitelné (spolu se všemi hranami mezi nimi).
      Na rozdíl od komponent neorientovaného grafu **nemusí každá hrana ležet v nějaké kvazikomponentě**:
      hrany mezi různými kvazikomponentami nepatří žádné z nich – právě ty tvoří [kondenzaci](#def-kondenzace).

      Každý uzel leží v právě jedné kvazikomponentě (i izolovaný uzel nebo uzel, který neleží na žádném cyklu,
      tvoří jednoprvkovou kvazikomponentu).
    examples:
      - title: Kvazikomponenty grafu se 7 uzly
        body: |
          V grafu na obrázku jsou tři kvazikomponenty: $\{1,2,3\}$ (cyklus $1 \to 2 \to 3 \to 1$), $\{4,5\}$
          (hrany $4 \to 5 \to 4$) a $\{6,7\}$ (hrany $6 \to 7 \to 6$). Hrany $3 \to 4$, $2 \to 6$ a $5 \to 7$
          neleží v žádné kvazikomponentě – vedou „jen jedním směrem" mezi skupinami.
        graph:
          directed: true
          nodes:
            - { id: "1", x: 0, y: 1 }
            - { id: "2", x: 3, y: 0 }
            - { id: "3", x: 1.5, y: 3 }
            - { id: "4", x: 4, y: 6 }
            - { id: "5", x: 7, y: 7 }
            - { id: "6", x: 6, y: 1 }
            - { id: "7", x: 9, y: 2 }
          edges:
            - { from: "1", to: "2" }
            - { from: "2", to: "3" }
            - { from: "3", to: "1" }
            - { from: "3", to: "4" }
            - { from: "4", to: "5" }
            - { from: "5", to: "4" }
            - { from: "2", to: "6" }
            - { from: "6", to: "7" }
            - { from: "7", to: "6" }
            - { from: "5", to: "7" }
    visualization: scc
    illustrations:
      - title: Kvazikomponenty se slévají
        property: strongly-connected
        graph:
          directed: true
          nodes:
            - { id: a, x: 0.5, y: 1 }
            - { id: b, x: 3.5, y: 0.5 }
            - { id: c, x: 2, y: 4 }
            - { id: d, x: 4, y: 7.5 }
            - { id: e, x: 7.5, y: 8 }
            - { id: f, x: 6.5, y: 1 }
            - { id: g, x: 9.5, y: 3 }
          edges:
            - { from: a, to: b }
            - { from: b, to: c }
            - { from: c, to: a }
            - { from: c, to: d }
            - { from: d, to: e }
            - { from: e, to: d }
            - { from: b, to: f }
            - { from: f, to: g }
            - { from: g, to: f }
            - { from: e, to: g }
        steps:
          - caption: |
              Tři kvazikomponenty (barevně): $\{a, b, c\}$, $\{d, e\}$ a $\{f, g\}$. Hrany $c \to d$, $b \to f$ a $e \to g$ nepatří žádné z nich – vedou mezi skupinami jen jedním směrem.
          - caption: |
              Přidáme $g \to e$. Z $e$ se teď dá dojít do $g$ i zpět, takže $\{d, e\}$ a $\{f, g\}$ splynou v jednu kvazikomponentu. Kvazikomponenty jsou právě třídy vzájemné dosažitelnosti.
            add: [[g, e]]
          - caption: |
              Hrana $d \to c$ dovolí vrátit se z dolní skupiny do $\{a, b, c\}$. Všechny uzly jsou navzájem dosažitelné, celý graf tvoří jedinou kvazikomponentu – je silně souvislý.
            add: [[d, c]]
    related: [prop-kvazikomponenty-rozklad, alg-kvazikomponenty, def-kondenzace, def-komponenta, def-silna-souvislost]
