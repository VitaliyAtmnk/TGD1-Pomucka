id: metrika-orientovane
number: 1
title: Metrika, eulerovské a hamiltonovské grafy, orientované grafy
source: "Přednáška 2 (TGD1-02-folie, str. 1–12); přednáška 3 (TGD1-03-folie, str. 1–8)"
exam_questions: [2, 3, 10]
summary: |
  Kapitola zavádí vzdálenost v grafu a ukazuje, že má vlastnosti metriky (i ve váženém případě),
  a řeší úlohu **minimální cesty** Dijkstrovým algoritmem. Dále charakterizuje eulerovské grafy
  (polynomiálně rozhodnutelné) a uvádí postačující podmínku hamiltonovskosti (Dirac) spolu
  s motivací výpočetní složitosti (TSP, rozhodovací strom). Druhá polovina se věnuje orientovaným
  grafům: silné souvislosti, kvazikomponentám, kondenzaci, acyklickým grafům a jejich
  topologickému očíslování, mocninám matice sousednosti a nakonec metodě **kritické cesty**.
sections:
  - number: "1.1"
    title: Vzdálenost a metrika grafu
  - number: "1.2"
    title: Ohodnocené grafy, w-vzdálenost a minimální cesta
  - number: "1.3"
    title: Eulerovské a hamiltonovské grafy, složitost
  - number: "1.4"
    title: Orientované grafy, silná souvislost a kvazikomponenty
  - number: "1.5"
    title: Acyklické grafy a kondenzace
  - number: "1.6"
    title: Ohodnocené orientované grafy, matice a minimální cesty
  - number: "1.7"
    title: Kritická cesta
items:
  # ------------------------------------------------------------------ 1.1
  - id: def-vzdalenost
    kind: definition
    label: Definice
    section: "1.1"
    title: Vzdálenost uzlů v grafu
    terms: [vzdálenost, vzdálenost uzlů, d_G(u,v), nejkratší cesta, metrika grafu]
    statement: |
      Nechť $G$ je graf, $u, v \in U(G)$. **Vzdáleností** uzlů $u, v$ v grafu $G$ (značíme $d_G(u,v)$)
      rozumíme nejmenší délku cesty z uzlu $u$ do uzlu $v$ v grafu $G$. Neexistuje-li v $G$ cesta
      z $u$ do $v$, klademe $d_G(u,v) = \infty$.
    intuition: |
      Vzdálenost = nejmenší počet hran, přes které je nutné přejít. Cesta nejmenší délky se nazývá
      **nejkratší cesta**. V neohodnoceném grafu ji (i všechny vzdálenosti z jednoho uzlu) najde
      prohledávání do šířky (BFS) v čase $O(n + m)$.

      Pozor na kolizi značení: $d_G(u)$ (jeden argument) je stupeň uzlu, $d_G(u,v)$ (dva argumenty) vzdálenost.
    related: [thm-metrika-grafu, def-w-delka-vzdalenost, prop-souvislost-cesta]
    source: "přednáška 2, folie 1"
    supplemented: false

  - id: thm-metrika-grafu
    kind: theorem
    label: Věta
    section: "1.1"
    title: Vlastnosti vzdálenosti (metrika grafu)
    terms: [metrika grafu, vlastnosti vzdálenosti, trojúhelníková nerovnost, symetrie vzdálenosti]
    statement: |
      Nechť $G$ je graf, $x, y, z \in U(G)$. Pak platí:

      - (i) $d_G(x,y)$ je celé číslo nebo $\infty$,
      - (ii) $d_G(x,y) \ge 0$ a $d_G(x,y) = 0 \iff x = y$,
      - (iii) $d_G(x,y) = d_G(y,x)$,
      - (iv) $d_G(x,y) + d_G(y,z) \ge d_G(x,z)$,
      - (v) je-li $d_G(x,z) > 1$, pak existuje uzel $y \in U(G)$ tak, že $x \ne y \ne z$ a
         $d_G(x,y) + d_G(y,z) = d_G(x,z)$.
    intuition: |
      Body (ii)–(iv) jsou axiomy metriky: vzdálenost je nezáporná, nulová jen pro tentýž uzel, symetrická
      a splňuje trojúhelníkovou nerovnost. Body (i) a (v) jsou navíc typické pro **grafovou** metriku:
      hodnoty jsou celočíselné a „mezi" dvěma vzdálenými uzly vždy leží nějaký uzel přesně na nejkratší
      trase (metrika nemá „díry"). Naopak každá metrika s vlastnostmi (i) a (v) je metrikou nějakého grafu.
    proof: |
      *Důkaz není ve foliích, doplněno.*

      **(i)** Délka cesty je počet hran, tedy nezáporné celé číslo; minimum z konečně mnoha celých čísel
      je celé číslo, a neexistuje-li cesta, je hodnota $\infty$.

      **(ii)** Délky jsou nezáporné. Cesta délky 0 je jediný uzel, takže $d_G(x,y) = 0$ právě když $x = y$.

      **(iii)** Projdeme-li cestu z $x$ do $y$ pozpátku, dostaneme cestu z $y$ do $x$ stejné délky
      (neorientovaný graf), takže množiny délek jsou stejné.

      **(iv)** Je-li některý sčítanec $\infty$, nerovnost platí. Jinak spojíme nejkratší cestu z $x$ do $y$
      a nejkratší cestu z $y$ do $z$ – dostaneme sled z $x$ do $z$ délky $d_G(x,y) + d_G(y,z)$. Z něj lze
      vynecháním opakujících se úseků získat cestu z $x$ do $z$, která není delší
      (viz [větička o sledech a cestách](#prop-souvislost-cesta)). Proto $d_G(x,z) \le d_G(x,y) + d_G(y,z)$.

      **(v)** Nechť $d_G(x,z) = k$, $1 < k < \infty$, a $x = v_0, v_1, \dots, v_k = z$ je nejkratší cesta.
      Položme $y = v_1$; jistě $y \ne x$ a $y \ne z$ (protože $k \ge 2$). Platí $d_G(x,y) = 1$ a úsek
      $v_1, \dots, v_k$ dává $d_G(y,z) \le k - 1$; z (iv) zároveň $d_G(y,z) \ge d_G(x,z) - d_G(x,y) = k - 1$.
      Tedy $d_G(x,y) + d_G(y,z) = 1 + (k-1) = k$.
      (Pro $d_G(x,z) = \infty$ vyhovuje libovolný třetí uzel $y$, existuje-li: $x$ a $z$ leží v různých
      komponentách, takže alespoň jedna ze vzdáleností $d_G(x,y)$, $d_G(y,z)$ je nekonečná.) $\square$
    proof_steps:
      - Délky cest jsou nezáporná celá čísla a cesta délky 0 je jen jediný uzel, odtud (i) a (ii).
      - Obrácením cesty z x do y vznikne cesta z y do x stejné délky, odtud symetrie (iii).
      - Spojením nejkratších cest x→y a y→z dostaneme sled z x do z, který obsahuje cestu nejvýše stejné délky, odtud trojúhelníková nerovnost (iv).
      - Pro (v) vezmeme nejkratší cestu x = v_0, …, v_k = z s k ≥ 2 a zvolíme y = v_1.
      - Platí d(x,y) = 1, úsek cesty dává d(y,z) ≤ k − 1 a trojúhelníková nerovnost d(y,z) ≥ k − 1, tedy součet je přesně k.
    illustrations:
      - title: Vzdálenosti z uzlu x
        graph:
          directed: false
          nodes:
            - { id: x, x: 0.5, y: 5 }
            - { id: a, x: 3.5, y: 2 }
            - { id: b, x: 3.5, y: 8 }
            - { id: c, x: 6.5, y: 2 }
            - { id: d, x: 6.5, y: 8 }
            - { id: z, x: 9.5, y: 5 }
            - { id: y, x: 9.5, y: 0.5 }
          edges:
            - { from: x, to: a }
            - { from: x, to: b }
            - { from: a, to: c }
            - { from: b, to: d }
            - { from: c, to: d }
            - { from: c, to: z }
            - { from: d, to: z }
            - { from: c, to: y }
        steps:
          - caption: |
              Popisky jsou vzdálenosti $d_G(x, \cdot)$ – nejmenší počet hran z $x$. Jsou to celá čísla a nulu má jen $x$ sám (body (i), (ii)).
            labels: { x: "0", a: "1", b: "1", c: "2", d: "2", z: "3", y: "3" }
            nodes: { x: source }
          - caption: |
              Trojúhelníková nerovnost: $d(x,y) + d(y,z) = 3 + 2 = 5 \ge 3 = d(x,z)$. Spojením nejkratších cest $x \to y$ a $y \to z$ vznikne sled délky 5; vystřižením úseku $c, y, c$ z něj dostaneme cestu $x, a, c, z$ délky 3.
            labels: { y: "d(x,y)=3", z: "d(x,z)=3" }
            nodes: { x: source, y: active, z: active }
            edges: { x-a: path, a-c: path, c-y: path, c-z: path }
          - caption: |
              Bod (v): $d(x,z) = 3 > 1$, takže na nejkratší cestě $x, a, c, z$ leží uzel $a \ne x, z$ s $d(x,a) + d(a,z) = 1 + 2 = 3$. Mezi vzdálenými uzly vždy leží uzel „přesně na trase“.
            labels: { a: "1 + 2" }
