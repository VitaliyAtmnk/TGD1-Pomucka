  - id: cor-eul-polynomialni
    kind: corollary
    label: Důsledek
    section: "1.3"
    title: Úloha EUL je polynomiální
    terms: [EUL, problém EUL, eulerovskost, polynomiální algoritmus, rozhodovací problém]
    statement: |
      Uvažujme úlohu **EUL**:

      - **Vstup:** graf $G$,
      - **Úkol:** je graf $G$ eulerovský?
      - **Výstup:** ANO / NE.

      Úloha EUL je řešitelná v polynomiálním čase.
    intuition: |
      Díky Eulerově větě nemusíme tah hledat (to by mohlo vypadat jako prohledávání exponenciálně mnoha možností) –
      stačí zkontrolovat dvě snadno ověřitelné vlastnosti. Konkrétně jde o čas $O(n + m)$.
      Pro srovnání: analogická úloha pro hamiltonovské grafy (HAM) je NP-úplná a polynomiální algoritmus
      pro ni není znám.
    proof: |
      *Důkaz není ve foliích, doplněno.*

      Podle [Eulerovy věty](#thm-euler) stačí ověřit, že (a) všechny uzly mají sudý stupeň a (b) graf je souvislý.

      - (a) Stupně spočteme jedním průchodem seznamu hran (nebo řádků matice sousednosti) v čase $O(n + m)$,
        resp. $O(n^2)$, a zkontrolujeme jejich paritu v čase $O(n)$.
      - (b) Souvislost ověříme prohledáním grafu (BFS/DFS) z libovolného uzlu v čase $O(n + m)$: graf je souvislý,
        právě když prohledávání navštíví všech $n$ uzlů.

      Celkem $O(n + m)$, resp. $O(n^2)$, což je polynomiální v délce vstupu. $\square$
    proof_steps:
      - Podle Eulerovy věty stačí ověřit sudost všech stupňů a souvislost grafu.
      - Stupně spočítáme jedním průchodem hran v čase O(n + m) a zkontrolujeme jejich paritu.
      - Souvislost ověříme prohledáním grafu z jednoho uzlu v čase O(n + m) – musí navštívit všech n uzlů.
      - Obě kontroly jsou polynomiální, tedy i celé rozhodnutí úlohy EUL.
    complexity: "$O(n + m)$"
    related: [thm-euler, alg-eulerovsky-tah, rem-polynomialni-vs-exponencialni]
    source: "přednáška 2, folie 4"
    supplemented: false

  - id: alg-eulerovsky-tah
    kind: algorithm
    section: "1.3"
    title: Nalezení eulerovského tahu (Hierholzerův algoritmus)
    terms: [eulerovský tah, Hierholzerův algoritmus, Fleuryho algoritmus, konstrukce eulerovského tahu, spojování tahů]
    statement: |
      Vstup: souvislý graf $G$, jehož všechny uzly mají sudý stupeň. Výstup: uzavřený tah délky $m$.
      Algoritmus vytváří uzavřené tahy z dosud nepoužitých hran a „vplétá" je do již nalezeného tahu.
    pseudocode: |
      1. Zvol uzel $v_0$ a z něj jdi po dosud nepoužitých hranách (každou použitou hranu označ), dokud to jde.
         Protože jsou stupně sudé, uvízneš jen ve $v_0$ – vznikne uzavřený tah $T$.
      2. Obsahuje-li $T$ všechny hrany, skonči: $T$ je eulerovský tah.
      3. Jinak najdi na $T$ uzel $x$, z něhož vede nepoužitá hrana, a stejně jako v kroku 1 z něj vytvoř
         uzavřený tah $T'$ z nepoužitých hran.
      4. Vlož $T'$ do $T$ v místě uzlu $x$ (projdi $T$ do $x$, pak celé $T'$, pak zbytek $T$) a pokračuj krokem 2.
    complexity: "$O(n + m)$"
    intuition: |
      Algoritmus kopíruje důkaz Eulerovy věty: uzavřené tahy se dají sloučit, kdykoli mají společný uzel.
      Proč v kroku 1 a 3 uvízneme jen ve výchozím uzlu: v ostatních uzlech jsme po každém příchodu použili
      lichý počet hran, a protože je stupeň sudý, vždy zbývá hrana k odchodu. Odebráním hran uzavřeného tahu
      zůstanou stupně sudé, takže argument funguje opakovaně.

      Při implementaci se seznamy sousedů a ukazatelem na „první nepoužitou hranu" u každého uzlu se každá
      hrana zpracuje konstantně-krát, takže čas je $O(n + m)$. Alternativou je Fleuryho algoritmus
      („nepřecházej most, pokud nemusíš"), který je jednodušší na ruční použití, ale pomalejší.
    proof: |
      *Algoritmus není ve foliích (folie uvádějí jen větu a polynomialitu EUL), doplněno.*

      **Uvíznutí jen ve výchozím uzlu:** v grafu nepoužitých hran mají všechny uzly sudý stupeň (na začátku
      podle předpokladu, po odebrání uzavřeného tahu se stupně zmenší o sudá čísla). Vstoupíme-li během
      vytváření tahu do uzlu $y \ne$ výchozí, použili jsme u něj lichý počet hran, zbývá tedy aspoň jedna.
      Proto tah skončí jen ve výchozím uzlu a je uzavřený.

      **Existence uzlu $x$ v kroku 3:** zbývá-li nepoužitá hrana, ze souvislosti $G$ existuje nepoužitá hrana
      s koncem na $T$ (stejný argument jako v důkazu [Eulerovy věty](#thm-euler)).

      **Konečnost a výsledek:** každé opakování použije alespoň jednu novou hranu, takže algoritmus skončí,
      a to s uzavřeným tahem obsahujícím všech $m$ hran. $\square$
    proof_steps:
      - V grafu dosud nepoužitých hran mají všechny uzly sudý stupeň.
      - Při vytváření tahu má každý navštívený uzel různý od výchozího po příchodu ještě volnou hranu, takže tah skončí jen ve výchozím uzlu.
      - Zbývá-li nepoužitá hrana, existuje ze souvislosti grafu nepoužitá hrana s koncem na již nalezeném tahu.
      - Nový uzavřený tah lze do starého vložit v jejich společném uzlu.
      - Každé opakování spotřebuje nové hrany, takže algoritmus skončí s tahem přes všech m hran.
    examples:
      - title: Spojení dvou uzavřených tahů
        body: |
          V motýlku (příklad u Eulerovy věty) vyjdeme z $a$: $a, b, c, a$ – uvízli jsme v $a$, ale u $c$ zbývají
          nepoužité hrany. Z $c$ vytvoříme $c, d, e, c$ a vložíme jej místo uzlu $c$:
          $a, b, \underline{c, d, e, c}, a$. Všech 6 hran je použito.
    visualization: euler
    related: [thm-euler, cor-eul-polynomialni, def-eulerovsky-graf]
    source: "doplněno (standardní algoritmus)"
    supplemented: true

  - id: def-hamiltonovsky-graf
    kind: definition
    label: Definice
    section: "1.3"
    title: Hamiltonovský graf
    terms: [hamiltonovský graf, hamiltonovská kružnice, hamiltonovská cesta, HAM]
    statement: |
      Buď $G$ graf, $n = |U(G)|$. Řekneme, že $G$ je **hamiltonovský**, jestliže v $G$ existuje kružnice délky $n$.
    intuition: |
      Kružnice délky $n$ projde **každým uzlem právě jednou** (hamiltonovská kružnice). Zatímco eulerovskost
      se týká hran a má jednoduchou charakterizaci, hamiltonovskost se týká uzlů a rozhodnout ji je
      NP-úplný problém. Máme jen postačující podmínky (Dirac, Ore, uzávěr grafu) a nutné podmínky
      (souvislost, žádná artikulace, …), žádná z nich ale není zároveň nutná i postačující.
    illustrations:
      - title: Eulerovský, a přece ne hamiltonovský
        property: hamiltonian
        graph:
          directed: false
          nodes:
            - { id: a, x: 0.5, y: 1 }
            - { id: b, x: 0.5, y: 9 }
            - { id: c, x: 5, y: 5 }
            - { id: d, x: 9.5, y: 1 }
            - { id: e, x: 9.5, y: 9 }
          edges:
            - { from: a, to: b }
            - { from: b, to: c }
            - { from: c, to: a }
            - { from: c, to: d }
            - { from: d, to: e }
            - { from: e, to: c }
        steps:
          - caption: |
              Motýlek je eulerovský, ale **ne** hamiltonovský: kružnice přes všechny uzly by musela projít uzlem $c$ dvakrát – jednou při přechodu z levého trojúhelníku do pravého a podruhé při návratu.
          - caption: |
              Stačí přidat hranu $be$ mezi trojúhelníky a hamiltonovská kružnice existuje: projde každým uzlem právě jednou a uzel $c$ už nemusí být „mostem“.
            add: [[b, e]]
          - caption: |
              Bez hrany $ca$ má uzel $a$ stupeň 1. Uzel na kružnici potřebuje dva sousedy, takže graf hamiltonovský není.
            remove: [[c, a]]
    related: [thm-dirac, def-tsp, def-eulerovsky-graf, def-uzavreny-sled-kruznice]
    source: "přednáška 2, folie 5"
    supplemented: false

  - id: thm-dirac
    kind: theorem
    label: Věta (Dirac)
    section: "1.3"
    title: Diracova věta
    terms: [Diracova věta, Dirac, hamiltonovskost, minimální stupeň, postačující podmínka hamiltonovskosti]
    statement: |
      Nechť $G$ je graf s $n = |U(G)| \ge 3$ a
      $$
      \delta(G) \ge \frac{n}{2}.
      $$
      Pak je $G$ hamiltonovský.
    intuition: |
      Má-li každý uzel alespoň polovinu ostatních za sousedy, je graf tak „hustý", že hamiltonovská kružnice
      musí existovat. Podmínka je **postačující, ne nutná**: kružnice $C_n$ je hamiltonovská, a přitom
      $\delta = 2$.

      Mez $n/2$ nelze zlepšit: $K_{k,k+1}$ má $n = 2k+1$, $\delta = k < n/2$ a hamiltonovský není (kružnice
      v bipartitním grafu střídá partity, takže by obě musely být stejně velké). Předpoklad $n \ge 3$ vylučuje
      $K_2$ (má $\delta = 1 = n/2$, ale kružnici nemá).

      Obecnější je Oreho věta: stačí $d(x) + d(y) \ge n$ pro každé dva nesousední uzly (viz kapitola o
      hamiltonovských grafech a uzávěru grafu).
    proof: |
      *Důkaz není ve foliích, doplněno.*

      Podle [větičky](#prop-souvislost-min-stupen) je $G$ souvislý. Protože $n \ge 3$, je $\delta(G) \ge 3/2$,
      tedy $\delta(G) \ge 2$.

      Nechť $P: v_1, v_2, \dots, v_k$ je cesta v $G$ s **maximálním počtem uzlů**. Z maximality leží všichni
      sousedé uzlů $v_1$ a $v_k$ na $P$ (jinak bychom cestu prodloužili); speciálně $k \ge \delta + 1 \ge 3$.

      *Krok 1: na uzlech cesty $P$ leží kružnice délky $k$.* Položme
      $$
      S = \{ i \in \{1, \dots, k-1\} \mid \{v_1, v_{i+1}\} \in H(G) \}, \qquad
      T = \{ i \in \{1, \dots, k-1\} \mid \{v_i, v_k\} \in H(G) \}.
      $$
      Platí $|S| = d(v_1) \ge n/2$ a $|T| = d(v_k) \ge n/2$, přičemž $S, T \subset \{1, \dots, k-1\}$ a
      $k - 1 \le n - 1 < n \le |S| + |T|$. Proto existuje $i \in S \cap T$, tj. $v_1 v_{i+1}$ i $v_i v_k$ jsou hrany.
      Pak
      $$
      C:\ v_1, v_2, \dots, v_i, v_k, v_{k-1}, \dots, v_{i+1}, v_1
      $$
      je kružnice obsahující všech $k$ uzlů cesty $P$ (pro $i = 1$ jde o $v_1, \dots, v_k, v_1$).

      *Krok 2: $k = n$.* Kdyby $k < n$, existuje uzel mimo $C$, a protože $G$ je souvislý, existuje hrana
      $\{x, v_j\}$ s $x \notin C$ a $v_j$ na $C$. Začneme-li v $x$, přejdeme do $v_j$ a obejdeme kružnici $C$
      až k sousedovi $v_j$ na $C$, dostaneme cestu s $k + 1$ uzly – spor s maximalitou $P$.

      Tedy $C$ je kružnice délky $n$ a $G$ je hamiltonovský. $\square$
    proof_steps:
      - Graf je souvislý (δ ≥ n/2) a vezmeme v něm cestu P = v_1, …, v_k s maximálním počtem uzlů; všichni sousedé v_1 a v_k leží na P.
      - Definujeme množiny indexů S (v_1 sousedí s v_{i+1}) a T (v_i sousedí s v_k); obě jsou podmnožinami {1, …, k−1} a mají aspoň n/2 prvků.
      - Protože k − 1 < n ≤ |S| + |T|, existuje společný index i.
      - Hrany v_1v_{i+1} a v_iv_k umožní uzavřít cestu P do kružnice C délky k.
      - Kdyby k < n, ze souvislosti by z C vedla hrana k uzlu mimo C a rozpojením C bychom dostali delší cestu – spor.
      - Proto k = n a C je hamiltonovská kružnice.
    illustrations:
      - title: Postačující, ale ne nutná podmínka
        property: hamiltonian
        graph:
          directed: false
          nodes:
            - { id: a, x: 1.5, y: 0.5 }
            - { id: b, x: 8.5, y: 0.5 }
            - { id: c, x: 0.5, y: 9 }
            - { id: d, x: 5, y: 6 }
            - { id: e, x: 9.5, y: 9 }
          edges:
            - { from: a, to: c }
            - { from: a, to: d }
            - { from: a, to: e }
            - { from: b, to: c }
            - { from: b, to: d }
            - { from: b, to: e }
        steps:
          - caption: |
              $K_{2,3}$ má $n = 5$ a $\delta = 2 < n/2$. Hamiltonovská kružnice by střídala uzly z $\{a, b\}$ a z $\{c, d, e\}$, takže by obě skupiny musely být stejně velké – graf hamiltonovský není. Mez $n/2$ proto nejde zmenšit.
            labels: { a: "3", b: "3", c: "2", d: "2", e: "2" }
          - caption: |
              Po přidání $cd$ je graf hamiltonovský, přestože uzel $e$ má stále stupeň $2 < n/2$. Diracova podmínka je postačující, ne nutná.
            add: [[c, d]]
            labels: { a: "3", b: "3", c: "3", d: "3", e: "2" }
          - caption: |
              S hranami $ce$ a $de$ má každý uzel stupeň aspoň $3 \ge n/2$ – teď hamiltonovskost zaručuje přímo Diracova věta.
            add: [[c, e], [d, e]]
            labels: { a: "3", b: "3", c: "4", d: "4", e: "4" }
      - title: Uzavření nejdelší cesty do kružnice
        for: proof
        property: hamiltonian
        graph:
          directed: false
          nodes:
            - { id: v1, x: 0.5, y: 8 }
            - { id: v2, x: 2.5, y: 2 }
            - { id: v3, x: 5, y: 0.5 }
            - { id: v4, x: 7.5, y: 2 }
            - { id: v5, x: 9.5, y: 8 }
          edges:
            - { from: v1, to: v2 }
            - { from: v2, to: v3 }
            - { from: v3, to: v4 }
            - { from: v4, to: v5 }
            - { from: v1, to: v3 }
            - { from: v1, to: v4 }
            - { from: v2, to: v4 }
            - { from: v2, to: v5 }
            - { from: v3, to: v5 }
