  - id: alg-kriticka-cesta
    kind: algorithm
    label: Algoritmus
    section: "1.7"
    title: Algoritmus kritické cesty
    terms: [algoritmus kritické cesty, CPM, minimální časové ohodnocení, maximální časové ohodnocení, nejdříve možný začátek, nejpozději přípustný konec, časová rezerva]
    statement: |
      Vstup: acyklický ohodnocený orientovaný graf $\vec{G}$, v němž je $u$ jediný vstupní a $v$ jediný výstupní uzel.
      Výstup: $w$-délka kritické cesty z $u$ do $v$ a všechny uzly a hrany ležící na kritických cestách.

      - $t(i)$ – **minimální časové ohodnocení**: nejmenší doba, za kterou lze dosáhnout stavu $i$,
      - $T(i)$ – **maximální časové ohodnocení**: čas, kdy je nutno stav $i$ opustit, aby nedošlo ke zpoždění projektu.
    pseudocode: |
      1. Očísluj uzly grafu $\vec{G}$ podle věty o acyklických grafech (tím se zároveň ověří acykličnost); $u$ dostane 1, $v$ číslo $n$.
      2. Konstrukce minimálního časového ohodnocení $t(i)$:
         1. uzlu 1 (tj. $u$) přiřaď $t(1) = 0$,
         2. pro $i = 2, \dots, n$ uzlu $i$ přiřaď $t(i) = \max\{t(j) + w((j,i)) \mid (j,i) \in H(\vec{G})\}$,
         3. $t(n)$ je $w$-délka kritické cesty.
      3. Konstrukce maximálního časového ohodnocení $T(i)$:
         1. uzlu $n$ (tj. $v$) přiřaď $T(n) = t(n)$,
         2. pro $i = n-1, \dots, 1$ uzlu $i$ přiřaď $T(i) = \min\{T(j) - w((i,j)) \mid (i,j) \in H(\vec{G})\}$.
      4. Kritická cesta prochází těmi uzly $i$, pro něž $T(i) = t(i)$, a hranami $(i,j)$, pro něž $w((i,j)) = t(j) - t(i)$.
    complexity: "$O(n + m)$"
    intuition: |
      Dopředný průchod (krok 2) počítá „nejdříve možné" časy: stav $i$ nastane, až skončí **všechny** činnosti do něj
      vedoucí, proto maximum. Zpětný průchod (krok 3) počítá „nejpozději přípustné" časy: stav $i$ musí nastat tak, aby
      **každá** navazující činnost stihla svůj termín, proto minimum. Rozdíl $T(i) - t(i)$ je **časová rezerva** stavu;
      kritické uzly mají rezervu 0.

      Topologické očíslování zaručuje, že při výpočtu $t(i)$ jsou hodnoty všech předchůdců už známé (předchůdci mají menší
      čísla), a při výpočtu $T(i)$ hodnoty všech následníků.

      **Složitost:** očíslování $O(n + m)$, každý z průchodů projde každou hranu jednou – celkem $O(n + m)$
      (při zadání maticí $O(n^2)$). Je to vlastně „Dijkstra s maximem" – v acyklickém grafu funguje díky
      topologickému pořadí a nevadí mu ani nulové váhy.
    proof: |
      *Důkaz správnosti není ve foliích, doplněno.* Označme $L(i,j)$ maximální $w$-délku orientované cesty z $i$ do $j$.
      Protože $u = 1$ je jediný vstupní uzel, je každý uzel z $u$ dosažitelný (půjdeme-li z uzlu proti šipkám, v acyklickém
      grafu musíme skončit ve vstupním uzlu, tj. v $u$); symetricky z každého uzlu je dosažitelný $v = n$.

      **$t(i) = L(1,i)$:** indukcí podle $i$. $t(1) = 0 = L(1,1)$. Pro $i \ge 2$ končí každá cesta z 1 do $i$ hranou $(j,i)$,
      kde $j < i$ (topologické očíslování), a její $w$-délka je nejvýše $L(1,j) + w((j,i)) = t(j) + w((j,i))$; naopak
      prodloužením nejdelší cesty do $j$ o hranu $(j,i)$ dostaneme cestu (acykličnost vylučuje opakování uzlu) délky
      $t(j) + w((j,i))$. Tedy $t(i) = L(1,i)$; speciálně $t(n)$ je délka kritické cesty.

      **$T(i) = t(n) - L(i,n)$:** symetricky indukcí od $i = n$ dolů.

      **Kritické uzly a hrany:** uzel $i$ leží na nějaké kritické cestě, právě když $L(1,i) + L(i,n) = t(n)$, tj.
      $t(i) = T(i)$. Hrana $(i,j)$ mezi kritickými uzly leží na kritické cestě, právě když
      $L(1,i) + w((i,j)) + L(j,n) = t(n)$, tj. $w((i,j)) = t(j) - t(i)$. Cesta z 1 do $n$ složená z takových hran má
      délku $\sum (t(j) - t(i)) = t(n) - t(1) = t(n)$ (teleskopický součet), je tedy kritická. $\square$
    proof_steps:
      - Díky jedinému vstupnímu a výstupnímu uzlu je každý uzel dosažitelný z u a z každého uzlu je dosažitelný v.
      - Indukcí podle topologického očíslování dokážeme, že t(i) je maximální w-délka cesty z u do i, protože všichni předchůdci uzlu i mají menší čísla.
      - Symetricky zpětnou indukcí dokážeme, že T(i) = t(n) − (maximální w-délka cesty z i do v).
      - Uzel i leží na kritické cestě, právě když součet nejdelších cest u→i a i→v je t(n), tj. T(i) = t(i).
      - Hrana (i,j) mezi kritickými uzly je kritická, právě když w(i,j) = t(j) − t(i); cesta z takových hran má teleskopicky délku t(n).
    examples:
      - title: Výpočet kritické cesty pro projekt s deseti činnostmi
        body: |
          Uzly grafu z [příkladu](#def-kriticka-cesta) jsou už očíslovány topologicky.

          **Dopředný průchod:** $t(1) = 0$, $t(2) = 4$, $t(3) = 1$,
          $t(4) = \max\{0+2,\ 4+0,\ 1+0\} = 4$, $t(5) = \max\{4+2,\ 1+4\} = 6$,
          $t(6) = \max\{4+6,\ 4+1,\ 6+0\} = 10$, $t(7) = \max\{4+7,\ 10+2,\ 6+8\} = 14$.

          **Zpětný průchod:** $T(7) = 14$, $T(6) = 14 - 2 = 12$, $T(5) = \min\{14-8,\ 12-0\} = 6$,
          $T(4) = \min\{12-1,\ 6-2\} = 4$, $T(3) = \min\{4-0,\ 6-4\} = 2$,
          $T(2) = \min\{4-0,\ 12-6,\ 14-7\} = 4$, $T(1) = \min\{4-4,\ 4-2,\ 2-1\} = 0$.

          | uzel | 1 | 2 | 3 | 4 | 5 | 6 | 7 |
          |---|---|---|---|---|---|---|---|
          | $t(i)$ | 0 | 4 | 1 | 4 | 6 | 10 | 14 |
          | $T(i)$ | 0 | 4 | 2 | 4 | 6 | 12 | 14 |

          Projekt trvá nejméně **14** jednotek. Kritická cesta: $1, 2, 4, 5, 7$; kritické činnosti **A, G, J**
          (hrana $2 \to 4$ je fiktivní). Stav 3 má rezervu 1 a stav 6 rezervu 2 – činnosti C, H, resp. I lze trochu
          posunout bez ohrožení termínu.
        graph:
          directed: true
          nodes:
            - { id: "1", x: 0, y: 5, t: 0, T: 0 }
            - { id: "2", x: 3, y: 1, t: 4, T: 4 }
