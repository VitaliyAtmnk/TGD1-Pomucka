              Pro $i = 2$ uzavřou hrany $v_1v_3$ a $v_2v_5$ cestu do kružnice $v_1, v_2, v_5, v_4, v_3, v_1$: vynecháme hranu $v_2v_3$ a úsek $v_3, v_4, v_5$ projdeme pozpátku. Kružnice má $k = n$ uzlů, je tedy hamiltonovská.
