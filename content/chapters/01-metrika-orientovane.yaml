              Po přidání hrany $xc$ se vzdálenosti jen zkrátí: $d(x,c)$ klesne na 1 a $d(x,z)$ i $d(x,y)$ na 2. Nové cesty přibudou, žádná nezmizí.
            add: [[x, c]]
            labels: { x: "0", a: "1", b: "1", c: "1", d: "2", z: "2", y: "2" }
