  # ------------------------------------------------------------------ 1.2
  - id: def-w-delka-vzdalenost
    kind: definition
    label: Definice
    section: "1.2"
    title: w-délka cesty, w-vzdálenost, minimální cesta
    terms: [w-délka, w-vzdálenost, vážená vzdálenost, minimální cesta, nejkratší cesta, délka cesty v ohodnoceném grafu]
    statement: |
      Nechť $G$ je graf s ohodnocením $w$. Pro každou cestu $P \subset G$ definujeme **$w$-délku**
      $w(P)$ cesty $P$ předpisem
      $$
      w(P) = \sum_{h \in H(P)} w(h).
      $$
      Nechť $u, v \in U(G)$. **$w$-vzdáleností** uzlů $u, v$ v grafu $G$ (značíme $d^w_G(u,v)$) rozumíme
      nejmenší $w$-délku cesty z uzlu $u$ do uzlu $v$ v grafu $G$. Neexistuje-li v $G$ cesta z $u$ do $v$,
      klademe $d^w_G(u,v) = \infty$.

      Pro $u, v \in U(G)$ se cesta z $u$ do $v$ nejmenší délky nazývá **nejkratší cesta**, cesta z $u$ do $v$
      nejmenší $w$-délky **minimální cesta**.
    intuition: |
      Rozlišujte: *nejkratší* cesta = nejméně hran, *minimální* cesta = nejmenší součet vah. Obecně jsou
      to různé cesty (dlouhá trasa po dálnici může být „levnější" než krátká přes hory).

      (Ve foliích je u $w$-vzdálenosti překlep „$d_G(u,v) = \infty$" místo $d^w_G(u,v) = \infty$.)

      Minimální cestu z daného uzlu hledá [Dijkstrův algoritmus](#alg-dijkstra), $w$-vzdálenosti všech
      dvojic Floydův algoritmus (kapitola Grafy a matice).
    examples:
      - title: Převozník, koza, vlk a zelí
        body: |
          Převozník má převézt kozu (K), vlka (V) a zelí (Z) přes řeku; do loďky se vejde jen s jedním
          z nich. Bez dozoru nesmí zůstat koza s vlkem ani koza se zelím. Jízda trvá 1 h samotnému převozníkovi,
          2 h se zelím, 3 h s kozou a 4 h s vlkem.

          **Model:** uzly = přípustné stavy (kdo je na levém | pravém břehu), hrany = jízdy loďkou, váha = doba jízdy.
          Ptáme se na minimální cestu ze stavu „vše vlevo" do stavu „vše vpravo".

          Graf přípustných stavů je na obrázku. Ze stavu $PVZ \mid K$ (koza je vpravo, převozník se vrátil)
          vedou dvě symetrické větve: převézt nejprve vlka (4 h), vrátit kozu (3 h), převézt zelí (2 h),
          nebo nejprve zelí (2 h), vrátit kozu (3 h), převézt vlka (4 h). Obě větve trvají 9 h.

          **Odpovědi:** převoz je možný; minimální doba je $3 + 1 + 9 + 1 + 3 = 17$ hodin; minimální řešení jsou **dvě**.
        graph:
          directed: false
          nodes:
            - { id: u, x: 0, y: 5, label: "PKVZ | -" }
            - { id: a, x: 1.5, y: 5, label: "VZ | PK" }
            - { id: b, x: 3, y: 5, label: "PVZ | K" }
            - { id: c, x: 4.5, y: 2, label: "Z | PKV" }
            - { id: d, x: 4.5, y: 8, label: "V | PKZ" }
            - { id: e, x: 6, y: 2, label: "PKZ | V" }
            - { id: f, x: 6, y: 8, label: "PKV | Z" }
            - { id: g, x: 7.3, y: 5, label: "K | PVZ" }
            - { id: h, x: 8.6, y: 5, label: "PK | VZ" }
            - { id: v, x: 10, y: 5, label: "- | PKVZ" }
          edges:
            - { from: u, to: a, w: 3 }
            - { from: a, to: b, w: 1 }
            - { from: b, to: c, w: 4 }
            - { from: b, to: d, w: 2 }
            - { from: c, to: e, w: 3 }
            - { from: d, to: f, w: 3 }
            - { from: e, to: g, w: 2 }
            - { from: f, to: g, w: 4 }
            - { from: g, to: h, w: 1 }
            - { from: h, to: v, w: 3 }
    related: [def-vzdalenost, def-ohodnoceny-graf, thm-w-metrika, alg-dijkstra, rem-distancni-matice]
    source: "přednáška 2, folie 1 a 3"
    supplemented: false

  - id: thm-w-metrika
    kind: theorem
    label: Věta
    section: "1.2"
    title: Vlastnosti w-vzdálenosti
    terms: [w-vzdálenost, metrika, trojúhelníková nerovnost, vážená metrika]
    statement: |
      Nechť $G$ je graf s ohodnocením $w$ a nechť $x, y, z \in U(G)$. Pak platí:

      - (i) $d^w_G(x,y) \ge 0$ a $d^w_G(x,y) = 0 \iff x = y$,
      - (ii) $d^w_G(x,y) = d^w_G(y,x)$,
      - (iii) $d^w_G(x,y) + d^w_G(y,z) \ge d^w_G(x,z)$,
      - (iv) je-li $d_G(x,z) > 1$, pak existuje uzel $y \in U(G)$ tak, že $x \ne y \ne z$ a
         $d^w_G(x,y) + d^w_G(y,z) = d^w_G(x,z)$.
    intuition: |
      Funkce $d^w_G$ má také vlastnosti metriky. Body (i) a (iii) využívají, že váhy jsou **kladné**:
      s nulovými vahami by různé uzly mohly mít vzdálenost 0, se zápornými by „nejkratší cesta" nemusela
      dávat smysl.

      Pozor na předpoklad v (iv): je to $d_G(x,z) > 1$ (neohodnocená vzdálenost), tj. $x$ a $z$ nesousedí.
      Pak má každá cesta mezi nimi vnitřní uzel a vnitřní uzel minimální cesty je hledané $y$.
      Pro sousední uzly to platit nemusí – přímá hrana může být nejkratší spojení.

      Ne každá „vzdálenost z praxe" je metrika – viz příklad s jízdenkami.
    proof: |
      *Důkaz není ve foliích, doplněno.*

      **(i)** Váhy jsou kladné, takže $w(P) \ge 0$ a $w(P) = 0$ jen pro cestu bez hran, tj. jediný uzel.
      Tedy $d^w_G(x,y) = 0 \iff x = y$.

      **(ii)** Obrácená cesta má stejné hrany, tedy stejnou $w$-délku.

      **(iii)** Je-li některý sčítanec nekonečný, nerovnost platí. Jinak spojením minimální cesty $x \to y$
      a minimální cesty $y \to z$ vznikne sled $S$ z $x$ do $z$ s $w$-délkou (součtem vah hran počítaných
      s násobností) $d^w_G(x,y) + d^w_G(y,z)$. Vynecháním uzavřených úseků (opakuje-li se uzel) dostaneme
      cestu z $x$ do $z$, jejíž $w$-délka je – díky nezápornosti vah – nejvýše $w$-délka sledu $S$.

      **(iv)** Nechť $d_G(x,z) > 1$. Je-li $d^w_G(x,z) = \infty$, vyhovuje libovolný třetí uzel (pokud
      existuje), protože $x, z$ leží v různých komponentách. Jinak vezmeme minimální cestu
      $P: x = v_0, v_1, \dots, v_k = z$; protože $x, z$ nesousedí, je $k \ge 2$, a položíme $y = v_1$.
      Úseky $P_1 = x \dots y$ a $P_2 = y \dots z$ dávají $d^w(x,y) + d^w(y,z) \le w(P_1) + w(P_2) = w(P) = d^w(x,z)$,
      opačná nerovnost je (iii). $\square$
    proof_steps:
      - Kladnost vah dává w(P) ≥ 0 s rovností jen pro cestu bez hran, odtud (i).
      - Obrácená cesta má stejné hrany a tedy stejnou w-délku, odtud symetrie (ii).
      - Spojením minimálních cest x→y a y→z vznikne sled, z něhož vynecháním uzavřených úseků dostaneme cestu x→z s nejvýše stejnou w-délkou, odtud (iii).
      - Pro (iv) uzly x, z nesousedí, takže minimální cesta mezi nimi má vnitřní uzel y.
      - Úseky minimální cesty dávají d^w(x,y) + d^w(y,z) ≤ d^w(x,z) a opačná nerovnost plyne z (iii).
    examples:
      - title: Cena jízdenky není metrika
        body: |
          Nechť $\rho(x,y)$ je cena obyčejné jízdenky mezi stanicemi a ceník je pásmový: 1–6 km za 10 Kč,
          7–10 km za 16 Kč, 11–15 km za 22 Kč, 16–20 km za 28 Kč. Mezi stanicemi Plzeň hl. n. – Starý Plzenec
          (10 km) – Nezvěstice (dalších 6 km) vychází (P = Plzeň, S = Starý Plzenec, N = Nezvěstice)

          $$
          \rho(P, N) = 28 > 26 = 16 + 10 = \rho(P, S) + \rho(S, N).
          $$

          Trojúhelníková nerovnost neplatí, $\rho$ tedy **není metrika** – vyplatí se koupit dvě jízdenky.
          $w$-vzdálenost v grafu by tento problém neměla: vždy je nejvýše součtem vzdáleností přes mezilehlý uzel.
    related: [def-w-delka-vzdalenost, thm-metrika-grafu]
    source: "přednáška 2, folie 2"
    supplemented: false

  - id: rem-distancni-matice
    kind: remark
    label: Definice / poznámka
    section: "1.2"
    title: Distanční a w-distanční matice (odkaz)
    terms: [distanční matice, w-distanční matice, matice vzdáleností, matice w-vzdáleností, D(G)]
    statement: |
      Nechť $G$ je ohodnocený graf s uzly $1, \dots, n$ a $d^w_{ij} = d^w_G(i,j)$. Matice
      $\mathbf{D}^w(G) = [d^w_{ij}]_{i,j=1}^n$ se nazývá **matice $w$-vzdáleností ($w$-distanční matice)**.
      Neohodnocený graf považujeme za ohodnocený $w_{ij} = 1$; pak dostáváme **distanční matici**
      $\mathbf{D}(G) = [d_{ij}]$, kde $d_{ij} = d_G(i,j)$. Stejně se definují pro orientované grafy
      (přednáška 3, folie 2).

      Podrobně (včetně Floydova algoritmu) viz [w-distanční matice](#def-w-distancni-matice)
      a [Floydův algoritmus](#alg-floyd) v kapitole Grafy a matice.
    intuition: |
      Distanční matice je „tabulka vzdáleností" jako v autoatlasu. Pro neorientovaný graf je symetrická
      s nulami na diagonále. Výpočetní možnosti:

      - $\mathbf{D}(G)$ neohodnoceného grafu: $n$-krát BFS, tj. $O(n(n+m))$, nebo přes mocniny matice
        sousednosti ([důsledek](#cor-distancni-matice-mocniny));
      - $\mathbf{D}^w(G)$: Floydův algoritmus v $O(n^3)$, nebo $n$-krát Dijkstra ($n \cdot O(n^2) = O(n^3)$).
    related: [def-w-distancni-matice, alg-floyd, thm-floyd, alg-dijkstra, cor-distancni-matice-mocniny]
    source: "přednáška 2, folie 4; přednáška 3, folie 2"
    supplemented: false

  # ------------------------------------------------------------------ 1.3
  - id: def-eulerovsky-graf
    kind: definition
    label: Definice
    section: "1.3"
    title: Eulerovský graf
    terms: [eulerovský graf, eulerovský tah, uzavřený eulerovský tah, kreslení jedním tahem]
    statement: |
      Buď $G$ graf, $m = |H(G)|$. Řekneme, že $G$ je **eulerovský**, jestliže v $G$ existuje uzavřený tah délky $m$.
    intuition: |
      Uzavřený tah délky $m$ projde **každou hranou právě jednou** (tah hrany neopakuje a délka $m$ znamená,
      že použije všechny) a vrátí se do výchozího uzlu – „nakreslit graf jedním tahem a skončit tam, kde
      jsme začali". Historicky problém sedmi královeckých mostů (Euler, 1736).

      Je-li požadován jen otevřený tah přes všechny hrany, stačí, aby lichý stupeň měly právě dva uzly
      (tah pak začíná v jednom a končí v druhém) – např. „domeček".
    related: [thm-euler, cor-eul-polynomialni, alg-eulerovsky-tah, def-uzavreny-sled-kruznice]
    source: "přednáška 2, folie 4"
    supplemented: false

  - id: thm-euler
    kind: theorem
    label: Věta
    section: "1.3"
    title: Charakterizace eulerovských grafů
    terms: [Eulerova věta, eulerovský graf, sudé stupně, charakterizace eulerovských grafů]
    statement: |
      Graf $G$ je eulerovský, právě když $G$ je souvislý a všechny jeho uzly jsou sudého stupně.
    intuition: |
      Kdykoli tah do uzlu vstoupí, musí z něj zase vystoupit – hrany u každého uzlu se tedy „párují"
      na vstupy a výstupy, a proto je stupeň sudý (i u výchozího uzlu, protože tah je uzavřený).
      Překvapivé je, že tato zjevně nutná podmínka (spolu se souvislostí) **stačí**.

      Věta implicitně předpokládá graf bez izolovaných uzlů (resp. souvislost se týká části grafu s hranami):
      např. trojúhelník s jedním izolovaným uzlem má uzavřený tah přes všechny hrany, ale souvislý není.

      Dobrá zpráva pro složitost: eulerovskost poznáme **lokálně** (stupně) + souvislost, tj. v lineárním čase.
      Pro hamiltonovské grafy žádná taková charakterizace známa není.
    proof: |
      *Důkaz není ve foliích, doplněno.* Předpokládáme, že $G$ nemá izolované uzly.

      **(⇒)** Nechť $T$ je uzavřený tah délky $m$; obsahuje všechny hrany, a protože žádný uzel není
      izolovaný, i všechny uzly. Libovolné dva uzly jsou tedy spojeny úsekem tahu $T$, takže $G$ je souvislý.
      Při procházení uzavřeného tahu přispívá každý průchod uzlem $v$ dvěma různými hranami (vstupní a výstupní;
      u výchozího uzlu spárujeme první a poslední hranu). Každá hrana je v $T$ právě jednou, takže hrany
      u uzlu $v$ jsou rozděleny do dvojic a $d_G(v)$ je sudé.

      **(⇐)** Nechť $G$ je souvislý se sudými stupni. Zvolme v $G$ tah $T: v_0, v_1, \dots, v_k$
      **maximální délky**.

      1. *$T$ je uzavřený.* Kdyby $v_k \ne v_0$, pak tah $T$ používá u uzlu $v_k$ lichý počet hran
         (každý vnitřní průchod dvě, poslední příchod jednu). Protože $d_G(v_k)$ je sudé, existuje hrana u $v_k$,
         kterou $T$ nepoužívá, a o ni lze $T$ prodloužit – spor s maximalitou.
      2. *$T$ obsahuje všechny hrany.* Kdyby nějaká hrana chyběla, pak – protože $G$ je souvislý – existuje
         hrana $e = \{v_i, y\}$ mimo $T$ s koncem $v_i$ na tahu $T$ (vezmeme cestu z uzlu tahu ke konci
         chybějící hrany a první hranu této cesty, která v $T$ není, příp. chybějící hranu samotnou).
         Uzavřený tah $T$ lze „pootočit" tak, aby začínal a končil ve $v_i$:
         $v_i, v_{i+1}, \dots, v_k = v_0, v_1, \dots, v_i$, a pak jej prodloužit o hranu $e$. Vznikne tah délky
         $k + 1$ – spor s maximalitou.

      Tedy $T$ je uzavřený tah délky $m$ a $G$ je eulerovský. $\square$
    proof_steps:
      - "(⇒) Uzavřený tah přes všechny hrany prochází všemi uzly, takže graf je souvislý."
      - "(⇒) Každý průchod uzlem spotřebuje dvě hrany (vstupní a výstupní) a každá hrana je použita jednou, proto jsou všechny stupně sudé."
      - "(⇐) Zvolíme tah maximální délky."
      - Kdyby tah nebyl uzavřený, měl by jeho koncový uzel lichý počet použitých hran, tedy i nepoužitou hranu, o kterou by šel tah prodloužit.
      - Kdyby uzavřený tah nepokryl všechny hrany, existovala by ze souvislosti nepoužitá hrana s koncem na tahu.
      - Pootočením uzavřeného tahu tak, aby začínal v tomto uzlu, a přidáním nepoužité hrany vznikne delší tah – spor, takže tah pokrývá všechny hrany.
    examples:
      - title: Motýlek ano, domeček ne
        body: |
          **Motýlek** (dva trojúhelníky se společným uzlem $c$): stupně $2,2,4,2,2$, graf je souvislý, tedy
          eulerovský. Eulerovský tah: $a, b, c, d, e, c, a$.

          **Domeček** (čtverec se „střechou" – trojúhelníkem nad horní hranou): dva uzly mají stupeň 3,
          eulerovský tedy není. Lze jej ale nakreslit jedním *otevřeným* tahem, který začne v jednom uzlu
          stupně 3 a skončí ve druhém.
        graph:
          directed: false
          nodes:
            - { id: a, x: 0, y: 1 }
            - { id: b, x: 0, y: 7 }
            - { id: c, x: 4, y: 4 }
            - { id: d, x: 8, y: 1 }
            - { id: e, x: 8, y: 7 }
          edges:
            - { from: a, to: b }
            - { from: b, to: c }
            - { from: c, to: a }
            - { from: c, to: d }
            - { from: d, to: e }
            - { from: e, to: c }
    illustrations:
