quiz:
  - id: q-metrika-01
    question: |
      Jaká je časová složitost Dijkstrova algoritmu v základní implementaci (pole dočasných hodnot, bez haldy)?
    options:
      - "$O(n + m)$"
      - "$O(n^2)$"
      - "$O(n^3)$"
      - "$O(2^n)$"
    correct: 1
    explanation: |
      Nejvýše $n$ iterací, v každé výběr minima z dočasných hodnot v čase $O(n)$; aktualizace přes všechny iterace
      stojí $O(m) \subset O(n^2)$. Celkem $O(n^2)$. S haldou $O((n+m)\log n)$.
    related: [alg-dijkstra]

  - id: q-metrika-02
    question: |
      Proč Dijkstrův algoritmus vyžaduje **nezáporné** (v TGD1 kladné) váhy hran?
    options:
      - Jinak by nešlo uzly očíslovat topologicky.
      - Protože jinak by w-vzdálenost nebyla symetrická.
      - Argument, že uzel s nejmenší dočasnou hodnotou už nelze dosáhnout levněji, předpokládá, že prodloužení cesty její délku nesníží.
      - Se zápornými vahami by algoritmus nikdy neskončil.
    correct: 2
    explanation: |
      Uzel $z$ dostane trvalou hodnotu, protože každá jiná cesta do $z$ opouští trvalou množinu přes uzel s
      $\mathrm{dh} \ge \mathrm{dh}(z)$ a zbytek cesty délku už jen zvětšuje. Se zápornou hranou by se trvalá hodnota
      mohla dodatečně zlepšit, takže výsledek může být chybný (algoritmus ale skončí).
    related: [alg-dijkstra]

  - id: q-metrika-03
    question: |
      Souvislý graf má stupně $4, 4, 3, 3, 2, 2$. Co platí?
    options:
      - Je eulerovský.
      - Není eulerovský, ale lze jej nakreslit jedním otevřeným tahem začínajícím v jednom uzlu stupně 3 a končícím ve druhém.
      - Není eulerovský a nelze jej nakreslit jedním tahem.
      - Je hamiltonovský.
    correct: 1
    explanation: |
      Eulerovský graf musí mít všechny stupně sudé. Mají-li lichý stupeň přesně dva uzly, přidáním pomocné hrany mezi
      nimi vznikne eulerovský graf, a jejím odebráním z uzavřeného tahu dostaneme otevřený tah přes všechny hrany.
      O hamiltonovskosti stupně nic nezaručují.
    related: [thm-euler, def-eulerovsky-graf]

  - id: q-metrika-04
    question: |
      Graf $K_{3,4}$ má $n = 7$ a $\delta = 3$. Co z toho plyne pro Diracovu větu?
    options:
      - "$K_{3,4}$ je hamiltonovský podle Diracovy věty."
      - "Předpoklad $\\delta \\ge n/2$ není splněn a $K_{3,4}$ opravdu hamiltonovský není – mez v Diracově větě nelze snížit."
      - Diracova věta je pro $K_{3,4}$ ve sporu.
      - "$K_{3,4}$ není hamiltonovský, protože není souvislý."
    correct: 1
    explanation: |
      $\delta = 3 < 3{,}5 = n/2$, takže věta nic neříká. Kružnice v bipartitním grafu střídá partity, takže hamiltonovská
      kružnice by vyžadovala stejně velké partity – $K_{3,4}$ hamiltonovský není. Ukazuje to, že podmínku $n/2$ nelze zeslabit.
    related: [thm-dirac]

  - id: q-metrika-05
    question: |
      Ceník jízdného dává Plzeň–Nezvěstice (16 km) 28 Kč, Plzeň–Starý Plzenec (10 km) 16 Kč a Starý Plzenec–Nezvěstice (6 km) 10 Kč. Která vlastnost metriky je porušena?
    options:
      - Nezápornost
      - Symetrie
      - Trojúhelníková nerovnost
      - Nulovost pouze pro stejné body
    correct: 2
    explanation: |
      $28 > 16 + 10$, tedy $\rho(x,z) > \rho(x,y) + \rho(y,z)$. W-vzdálenost v grafu tímto problémem netrpí – spojením
      dvou cest vznikne sled, který obsahuje cestu nejvýše stejné délky.
    related: [thm-w-metrika]

  - id: q-metrika-06
    question: |
      Které tvrzení o kondenzaci $\vec{G}_C$ orientovaného grafu $\vec{G}$ platí vždy?
    options:
      - "$\\vec{G}_C$ je silně souvislý."
      - "$\\vec{G}_C$ je acyklický."
      - "$\\vec{G}_C$ má stejný počet hran jako $\\vec{G}$."
      - "$\\vec{G}_C$ je isomorfní s $\\vec{G}$."
    correct: 1
    explanation: |
      Cyklus v kondenzaci by znamenal, že uzly několika různých kvazikomponent jsou navzájem dosažitelné, takže by
      tvořily jedinou kvazikomponentu – spor. Isomorfní s $\vec{G}$ je kondenzace jen pro acyklické $\vec{G}$.
    related: [thm-kondenzace]

  - id: q-metrika-07
    question: |
      V orientovaném grafu leží hrana $(x,y)$ mezi dvěma různými kvazikomponentami. Co z toho plyne?
    options:
      - V grafu existuje orientovaný sled z $y$ do $x$.
      - Neexistuje orientovaný sled z $y$ do $x$; hrana nepatří žádné kvazikomponentě a neleží na žádném cyklu.
      - Graf je silně souvislý.
      - Hrana je smyčka.
    correct: 1
    explanation: |
      Kdyby šlo dojít z $y$ do $x$, byly by $x$ a $y$ vzájemně dosažitelné a ležely by v téže kvazikomponentě. Proto
      taková hrana neleží na cyklu (jinak by ze silně souvislého grafu s cyklem plynula vzájemná dosažitelnost).
    related: [def-kvazikomponenta, prop-kvazikomponenty-rozklad, thm-silna-souvislost-cykly]

  - id: q-metrika-08
    question: |
      Co je prvek $(i,j)$ matice $(\mathbf{A}(\vec{G}))^3$?
    options:
      - Počet cest délky 3 z $i$ do $j$
      - Počet sledů délky přesně 3 z $i$ do $j$
      - Vzdálenost uzlů $i$ a $j$
      - 1, právě když $d_{\vec{G}}(i,j) \le 3$
    correct: 1
    explanation: |
      Mocniny matice sousednosti počítají **sledy** (uzly i hrany se mohou opakovat) délky přesně $k$. Vzdálenost je
      nejmenší $k$, pro které je $a^{(k)}_{ij} \ne 0$.
    related: [thm-mocniny-matice-sousednosti, cor-distancni-matice-mocniny]

  - id: q-metrika-09
    question: |
      Algoritmus číslování uzlů (opakované odebírání vstupního uzlu) se zastaví dříve, než očísluje všechny uzly. Co to znamená?
    options:
      - Graf je nesouvislý.
      - Graf obsahuje cyklus.
      - Graf má více vstupních uzlů.
      - Graf je strom.
    correct: 1
    explanation: |
      Zbylý neprázdný podgraf nemá vstupní uzel, což podle charakterizace acyklických grafů (bod iii) znamená, že graf
      acyklický není. Více vstupních uzlů ani nesouvislost algoritmu nevadí.
    related: [thm-acyklicke-grafy, alg-topologicke-cislovani, cor-acyc-polynomialni]

  - id: q-metrika-10
    question: |
      V algoritmu kritické cesty má uzel $t(i) = 10$ a $T(i) = 12$. Jak to interpretovat?
    options:
      - Uzel leží na kritické cestě.
      - Stav $i$ lze dosáhnout nejdříve v čase 10 a opustit nejpozději v čase 12 – má rezervu 2 a na kritické cestě neleží.
      - Projekt trvá 22 jednotek.
      - Ve výpočtu je chyba, musí platit $t(i) \ge T(i)$.
    correct: 1
    explanation: |
      $t(i)$ je nejdříve možný čas dosažení stavu, $T(i)$ nejpozději přípustný čas jeho opuštění. Vždy $t(i) \le T(i)$;
      rovnost platí právě pro uzly kritické cesty. Rozdíl je časová rezerva.
    related: [alg-kriticka-cesta]

  - id: q-metrika-11
    question: |
      Proč se při výpočtu $t(i)$ v algoritmu kritické cesty bere **maximum** přes předchůdce?
    options:
      - Protože hledáme minimální cestu.
      - Stav $i$ nastane, až skončí všechny činnosti, které do něj vedou – rozhoduje ta, která skončí nejpozději.
      - Protože váhy mohou být záporné.
      - Protože graf obsahuje cykly.
    correct: 1
    explanation: |
      Kritická cesta je cesta **maximální** w-délky; $t(i)$ je délka nejdelší cesty ze startu do $i$. Díky topologickému
      očíslování jsou hodnoty všech předchůdců v době výpočtu známé.
    related: [alg-kriticka-cesta, def-kriticka-cesta]

  - id: q-metrika-12
    question: |
      Jakou složitost má výpočet $w$-distanční matice opakovaným spuštěním Dijkstrova algoritmu ze všech uzlů (implementace $O(n^2)$)?
    options:
      - "$O(n^2)$"
      - "$O(n^3)$, stejně jako Floydův algoritmus"
      - "$O(n^4)$"
      - "$O(n!)$"
    correct: 1
    explanation: |
      Jeden běh dá jeden řádek matice v $O(n^2)$, $n$ běhů tedy $O(n^3)$ – stejně jako Floydův algoritmus.
    related: [alg-dijkstra, rem-floyd-odkaz, rem-distancni-matice]

  - id: q-metrika-13
    question: |
      V TGD1 značí $d^-_{\vec{G}}(u)$…
    options:
      - vstupní stupeň (počet hran vedoucích do $u$),
      - výstupní stupeň (počet hran vycházejících z $u$),
      - rozdíl vstupního a výstupního stupně,
      - stupeň symetrizace.
    correct: 1
    explanation: |
      Ve skriptech TGD1 je $d^-$ výstupní a $d^+$ vstupní polostupeň (jiná literatura používá opačnou konvenci).
      Výstupní uzel je tedy uzel s $d^-(u) = 0$.
    related: [def-polostupne, def-vstupni-vystupni-uzel]

  - id: q-metrika-14
    question: |
      Proč je rozhodnutí úlohy EUL polynomiální, zatímco pro HAM polynomiální algoritmus znám není?
    options:
      - Protože eulerovských tahů je vždy málo.
      - Eulerovskost má charakterizaci pomocí snadno ověřitelných vlastností (souvislost, sudé stupně); pro hamiltonovskost žádná taková charakterizace známa není.
      - Protože hamiltonovské grafy jsou vždy nesouvislé.
      - EUL se řeší rozhodovacím stromem, HAM ne.
    correct: 1
    explanation: |
      Díky Eulerově větě stačí test v čase $O(n+m)$. Pro HAM máme jen postačující (Dirac) a nutné podmínky; problém je
      NP-úplný a hrubá síla (rozhodovací strom) má až $(n-1)!$ větví.
    related: [cor-eul-polynomialni, thm-dirac, def-tsp]

  - id: q-metrika-15
    question: |
      Kolikrát se zvětší velikost úlohy řešitelné ve stejném čase, zrychlíme-li počítač $1000\times$, u algoritmu se složitostí $2^n$ (původně $n = 100$)?
    options:
      - Na $n \approx 100\,000$
      - Na $n \approx 3162$
      - Na $n \approx 1000$
      - Jen na $n \approx 109$
    correct: 3
    explanation: |
      $2^{n'} = 1000 \cdot 2^{100}$ dává $n' = 100 + \log_2 1000 \approx 109{,}97$, tedy 109. U exponenciálních algoritmů rychlejší hardware
      téměř nepomáhá, u $n^2$ by to bylo $\approx 3162$, u $n^3$ přesně 1000.
    related: [rem-polynomialni-vs-exponencialni]
