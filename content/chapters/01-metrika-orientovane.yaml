              $S = \{i : v_1 \sim v_{i+1}\} = \{1, 2, 3\}$ (hrany z $v_1$) a $T = \{i : v_i \sim v_5\} = \{2, 3, 4\}$ (hrany do $v_5$). Obě leží v $\{1, \dots, 4\}$ a $|S| + |T| = 6 > 4$, takže mají společný prvek, např. $i = 2$.
            nodes: { v1: active, v5: active }
            edges: { v1-v2: considered, v1-v3: considered, v1-v4: considered, v2-v5: active, v3-v5: active, v4-v5: active }
