          - caption: |
              $n = 5$ a $\delta = 3 \ge n/2$. Vezmeme nejdelší cestu $P = v_1, \dots, v_5$. Její konce spolu nesousedí, takže $P$ nejde uzavřít přímo; všichni jejich sousedé ale leží na $P$, jinak by šla prodloužit.
            nodes: { v1: active, v5: active }
            edges: { v1-v2: path, v2-v3: path, v3-v4: path, v4-v5: path }
