            - { from: c, to: a }
            - { from: c, to: d }
            - { from: d, to: e }
            - { from: e, to: c }
        steps:
          - caption: |
              Motýlek má stupně $2, 2, 4, 2, 2$ a je souvislý, takže je eulerovský – např. tah $a, b, c, d, e, c, a$.
          - caption: |
              Přidáme hranu $be$: uzly $b$ a $e$ mají teď lichý stupeň 3. Uzavřený tah přes všechny hrany neexistuje, protože každý průchod uzlem spotřebuje dvě hrany; zbývá jen otevřený tah z $b$ do $e$.
            add: [[b, e]]
          - caption: |
              Po přidání $ad$ mají lichý stupeň čtyři uzly. Takový graf nejde nakreslit jedním tahem vůbec – otevřený tah má lichý stupeň jen ve svých dvou koncích.
            add: [[a, d]]
          - caption: |
              Odebereme svislé hrany $ab$ a $de$: všechny stupně jsou zase sudé a graf je souvislý, tedy opět eulerovský (tah $a, c, b, e, c, d, a$).
            remove: [[a, b], [d, e]]
      - title: Nejdelší tah je uzavřený a pokryje vše
        for: proof
