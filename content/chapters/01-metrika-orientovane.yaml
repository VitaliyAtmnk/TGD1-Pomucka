          | podmiňující | – | – | – | A | A | A,B,C | A,B,C | C | E,F,G,H | G,H |

          Sestrojíme graf, jehož uzly jsou stavy a hrany činnosti; aby šlo vyjádřit, že F a G čekají na A, B i C, ale
          H jen na C, přidáme fiktivní činnosti s nulovou dobou ($2 \to 4$, $3 \to 4$, $5 \to 6$). Výpočet viz
          [algoritmus kritické cesty](#alg-kriticka-cesta).
