  # ------------------------------------------------------------------ 1.7
  - id: def-kriticka-cesta
    kind: definition
    label: Definice
    section: "1.7"
    title: Kritická cesta
    terms: [kritická cesta, CPM, metoda kritické cesty, nejdelší cesta, kritické činnosti, síťový graf projektu]
    statement: |
      Buď $\vec{G}$ acyklický ohodnocený orientovaný graf a $u, v \in U(\vec{G})$. Orientovaná cesta z $u$ do $v$
      **maximální** $w$-délky se nazývá **kritická cesta** (z $u$ do $v$ v $\vec{G}$).
    intuition: |
      Model projektu: **uzly = stavy** (události, milníky), **hrany = činnosti** s dobou trvání jako vahou. Činnost může
      začít, až když skončily všechny činnosti, které ji podmiňují. Nejkratší možná doba projektu je délka **nejdelší**
      cesty ze startu do cíle – to je kritická cesta. Činnosti na ní jsou kritické: jejich zpoždění zpozdí celý projekt.

      Proč acyklický graf: v grafu s cyklem by závislosti byly nesplnitelné (a „nejdelší cesta" je v obecných grafech
      NP-těžká úloha, kdežto v acyklických grafech je lineární). Fiktivní činnosti s dobou 0 se přidávají, aby šly
      vyjádřit závislosti (ve foliích jsou tři; formálně tak připouštíme i nulové váhy).
    examples:
      - title: Projekt s deseti činnostmi
        body: |
          | činnost | A | B | C | D | E | F | G | H | I | J |
          |---|---|---|---|---|---|---|---|---|---|---|
