  - id: prop-kvazikomponenty-rozklad
    kind: proposition
    section: "1.4"
    title: Kvazikomponenty jako třídy vzájemné dosažitelnosti
    terms: [vzájemná dosažitelnost, relace dosažitelnosti, rozklad na kvazikomponenty, kvazikomponenty]
    statement: |
      Na $U(\vec{G})$ definujme relaci $u \sim v$, právě když v $\vec{G}$ existuje orientovaný sled z $u$ do $v$
      i orientovaný sled z $v$ do $u$. Pak $\sim$ je ekvivalence a kvazikomponenty grafu $\vec{G}$ jsou právě
      podgrafy indukované na jejích třídách. Speciálně každý uzel leží v právě jedné kvazikomponentě.
    intuition: |
      Tvrzení dává praktický návod, jak kvazikomponenty hledat: stačí pro uzly zjistit, kam se lze dostat
      a odkud se lze vrátit. Je také základem důkazu, že kondenzace je acyklická.
    proof: |
      *Tvrzení není ve foliích, doplněno.*

      **Ekvivalence:** reflexivita – sled délky 0; symetrie – plyne z definice; tranzitivita – sledy lze skládat.

      **Třída indukuje silně souvislý podgraf:** nechť $u \sim v$ a $S$ je orientovaný sled z $u$ do $v$. Pro libovolný
      uzel $w$ na $S$ vede úsek $S$ z $u$ do $w$ a zbytek $S$ z $w$ do $v$, odkud se lze sledem vrátit do $u$; tedy
      $w \sim u$. Celý sled $S$ tak leží v podgrafu indukovaném na třídě $[u]$, a ten je proto silně souvislý.

      **Maximalita:** je-li $\vec{G}''$ silně souvislý podgraf, jsou všechny jeho uzly navzájem v relaci $\sim$, takže
      leží v jedné třídě $[u]$, a $\vec{G}''$ je podgrafem indukovaného podgrafu na $[u]$. Silně souvislý podgraf
      indukovaný na třídě je tedy maximální (kvazikomponenta), a naopak každá kvazikomponenta je obsažena v takovém
      indukovaném podgrafu, a z maximality je mu rovna. $\square$
    proof_steps:
      - Relace vzájemné dosažitelnosti je reflexivní (sled délky 0), symetrická (z definice) a tranzitivní (skládání sledů).
      - Každý uzel ležící na orientovaném sledu mezi dvěma ekvivalentními uzly je s nimi také ekvivalentní.
      - Proto sledy mezi uzly jedné třídy nevybočí z třídy a indukovaný podgraf na třídě je silně souvislý.
      - Každý silně souvislý podgraf má všechny uzly v jedné třídě, takže je obsažen v indukovaném podgrafu na ní.
      - Indukované podgrafy na třídách jsou tedy právě maximální silně souvislé podgrafy, tj. kvazikomponenty.
    related: [def-kvazikomponenta, alg-kvazikomponenty, thm-kondenzace]
    source: "doplněno (standardní tvrzení)"
    supplemented: true

  - id: alg-kvazikomponenty
    kind: algorithm
    section: "1.4"
    title: Nalezení kvazikomponent pomocí dosažitelnosti
    terms: [hledání kvazikomponent, algoritmus kvazikomponent, Tarjanův algoritmus, Kosarajův algoritmus, dosažitelnost]
    statement: |
      Vstup: orientovaný graf $\vec{G}$. Výstup: rozklad $U(\vec{G})$ na množiny uzlů kvazikomponent.
    pseudocode: |
      1. Polož $R := U(\vec{G})$ (dosud nezařazené uzly).
      2. Dokud $R \ne \emptyset$:
         1. zvol $u \in R$,
         2. prohledáním $\vec{G}$ z $u$ po směru hran urči množinu $D^+(u)$ uzlů dosažitelných z $u$,
         3. prohledáním $\vec{G}$ z $u$ proti směru hran urči množinu $D^-(u)$ uzlů, z nichž je $u$ dosažitelný,
         4. $K := D^+(u) \cap D^-(u)$ je množina uzlů kvazikomponenty obsahující $u$; vydej $K$ a polož $R := R \setminus K$.
      3. Kvazikomponenty jsou podgrafy indukované na vydaných množinách.
    complexity: "$O(n \\cdot (n + m))$; Tarjan/Kosaraju $O(n + m)$"
    intuition: |
      Správnost plyne přímo z [tvrzení o vzájemné dosažitelnosti](#prop-kvazikomponenty-rozklad): $v$ leží
      v kvazikomponentě uzlu $u$, právě když $v \in D^+(u)$ a zároveň $v \in D^-(u)$.

      Každé prohledávání (BFS/DFS) stojí $O(n + m)$ a provede se nejvýše $n$-krát, celkem $O(n(n+m))$.
      Šikovnější algoritmy (Tarjanův – modifikace backtrackingu, nebo Kosarajův – dvě prohledávání do hloubky)
      najdou kvazikomponenty i kondenzaci v lineárním čase $O(n + m)$. Lze je určit i z distanční matice, ale ta
      sama stojí $O(n^3)$.
    visualization: scc
    related: [prop-kvazikomponenty-rozklad, def-kvazikomponenta, def-kondenzace]
    source: "doplněno; skripta kap. 5.2 zmiňují lineární algoritmus"
    supplemented: true

  # ------------------------------------------------------------------ 1.5
  - id: def-acyklicky-graf
    kind: definition
    label: Definice
    section: "1.5"
    title: Acyklický graf
    terms: [acyklický graf, DAG, orientovaný acyklický graf, graf bez cyklů]
    statement: |
      Buď $\vec{G}$ graf. Řekneme, že $\vec{G}$ je **acyklický**, jestliže $\vec{G}$ neobsahuje jako podgraf žádný cyklus.
    intuition: |
      Acyklické grafy modelují závislosti (úloha $B$ smí začít až po $A$), které se nesmějí zacyklit.
      Pozor: acyklický orientovaný graf může mít symetrizaci s kružnicemi (např. hrany $1\to2$, $2\to3$, $1\to3$).
      Smyčka je cyklus délky 1, takže acyklický graf nemá smyčky.
    related: [thm-podgraf-acyklickeho, thm-acyklicke-grafy, prop-acyklicky-vstupni-vystupni, def-uzavreny-orientovany-sled-cyklus]
    illustrations:
      - title: Jedna hrana navíc a acykličnost je pryč
        property: acyclic
        graph:
          directed: true
          nodes:
            - { id: a, x: 0, y: 5 }
            - { id: b, x: 3, y: 1.5 }
            - { id: c, x: 3, y: 8.5 }
            - { id: d, x: 6.5, y: 1.5 }
            - { id: e, x: 6.5, y: 8.5 }
            - { id: f, x: 10, y: 5 }
          edges:
            - { from: a, to: b }
            - { from: a, to: c }
            - { from: b, to: d }
            - { from: c, to: d }
            - { from: c, to: e }
            - { from: d, to: f }
            - { from: e, to: f }
        steps:
          - caption: |
              Všechny hrany vedou „zleva doprava“. Kdo vyjde z libovolného uzlu, už se do něj nevrátí – graf je **acyklický**.
          - caption: |
              Symetrizace tohoto grafu kružnice má (např. $a, b, d, c$), ale orientovaný cyklus to není: hrany $c \to d$ a $b \to d$ míří do stejného uzlu.
            edges: { a-b: active, b-d: active, a-c: active, c-d: active }
            witness: true
          - caption: |
              Přidáme hranu $f \to a$ **proti směru** ostatních. Vznikne cyklus $a \to b \to d \to f \to a$ a graf přestane být acyklický.
            add: [[f, a]]
          - caption: |
              Stačí odebrat jedinou hranu cyklu, třeba $d \to f$, a cyklus zmizí. Zůstane ale cyklus $a \to c \to e \to f \to a$ – hrana $f \to a$ jich uzavírala víc.
            remove: [[d, f]]
          - caption: |
              Teprve odebráním hrany $f \to a$ je graf znovu acyklický. Zkus v režimu *Vyzkoušej sám* přidat jinou hranu, která cyklus vytvoří – a jinou, která ne.
            remove: [[f, a]]
    source: "přednáška 2, folie 11"
    supplemented: false

  - id: thm-podgraf-acyklickeho
    kind: theorem
    label: Věta
    section: "1.5"
    title: Podgraf acyklického grafu je acyklický
    terms: [acyklický graf, podgraf, dědičnost acykličnosti]
    statement: |
      Je-li $\vec{G}$ acyklický a $\vec{G}' \subset \vec{G}$, pak $\vec{G}'$ je acyklický.
    intuition: |
      Acykličnost je „dědičná" vlastnost: odebráním uzlů či hran cyklus vzniknout nemůže. Využívá se v důkazu
      charakterizace acyklických grafů – i po odebrání uzlů máme stále acyklický graf a tedy vstupní/výstupní uzel.
    proof: |
      *Důkaz není ve foliích, doplněno.*

      Kdyby $\vec{G}'$ obsahoval cyklus $\vec{C}$ jako podgraf, pak z $\vec{C} \subset \vec{G}' \subset \vec{G}$
      (relace „být podgrafem" je tranzitivní) plyne, že $\vec{C}$ je podgrafem $\vec{G}$ – spor s acykličností $\vec{G}$. $\square$
    proof_steps:
      - Předpokládáme pro spor, že podgraf G' obsahuje cyklus C.
      - Relace být podgrafem je tranzitivní, takže C je i podgrafem G.
      - To odporuje acykličnosti G, tedy G' je acyklický.
    related: [def-acyklicky-graf, thm-acyklicke-grafy]
    source: "přednáška 2, folie 11"
    supplemented: false

  - id: def-vstupni-vystupni-uzel
    kind: definition
    label: Definice
    section: "1.5"
    title: Vstupní a výstupní uzel
    terms: [vstupní uzel, výstupní uzel, zdroj, stok, source, sink]
    statement: |
      Uzel $u \in U(\vec{G})$ se nazývá

      - (i) **vstupní uzel** grafu $\vec{G}$, jestliže $d^+_{\vec{G}}(u) = 0$,
      - (ii) **výstupní uzel** grafu $\vec{G}$, jestliže $d^-_{\vec{G}}(u) = 0$.
    intuition: |
      Vstupní uzel = žádná hrana do něj nevede (začátek, „zdroj"); výstupní uzel = žádná hrana z něj nevede
      (konec, „stok"). Připomeňme konvenci: $d^+$ je vstupní a $d^-$ výstupní polostupeň.
    related: [def-polostupne, prop-acyklicky-vstupni-vystupni, thm-acyklicke-grafy]
    source: "přednáška 2, folie 11"
    supplemented: false

  - id: prop-acyklicky-vstupni-vystupni
    kind: proposition
    label: Větička
    section: "1.5"
    title: Acyklický graf má vstupní i výstupní uzel
    terms: [acyklický graf, vstupní uzel, výstupní uzel, nejdelší cesta]
    statement: |
      Každý acyklický graf má vstupní a výstupní uzel.
    intuition: |
      Vydáme-li se po šipkách z libovolného uzlu, nemůžeme se nikdy vrátit (to by byl cyklus), a protože uzlů je
      konečně mnoho, musíme uvíznout – v uzlu, ze kterého nic nevede. Obráceně, proti šipkám, najdeme vstupní uzel.
      V grafu s cyklem to platit nemusí: cyklus $\vec{C}_3$ nemá ani vstupní, ani výstupní uzel.
    proof: |
      *Důkaz není ve foliích, doplněno.*

      Nechť $P: v_0, v_1, \dots, v_k$ je orientovaná cesta v $\vec{G}$ maximální délky (existuje, protože cesty mají
      navzájem různé uzly, a je jich tedy konečně mnoho; cesta délky 0 existuje vždy).

      Kdyby z $v_k$ vedla hrana $(v_k, x)$: leží-li $x$ na $P$, tj. $x = v_i$, pak $v_i, v_{i+1}, \dots, v_k, v_i$ je
      cyklus (pro $i = k$ smyčka) – spor s acykličností; neleží-li $x$ na $P$, je $v_0, \dots, v_k, x$ delší cesta –
      spor s maximalitou. Tedy $d^-(v_k) = 0$ a $v_k$ je výstupní uzel.

      Symetricky: hrana $(x, v_0)$ by dala buď cyklus, nebo delší cestu, takže $d^+(v_0) = 0$ a $v_0$ je vstupní uzel. $\square$
    proof_steps:
      - Vezmeme orientovanou cestu P = v_0, …, v_k maximální délky.
      - Kdyby z v_k vedla hrana do uzlu na P, vznikl by cyklus, což odporuje acykličnosti.
      - Kdyby z v_k vedla hrana do uzlu mimo P, šla by P prodloužit, což odporuje maximalitě.
      - Proto je v_k výstupní uzel, a symetrickou úvahou je v_0 vstupní uzel.
    illustrations:
      - title: Kde končí nejdelší cesta
        for: proof
        property: acyclic
        graph:
          directed: true
          nodes:
            - { id: a, x: 0.5, y: 5 }
            - { id: b, x: 3.5, y: 1.5 }
            - { id: c, x: 3.5, y: 8.5 }
            - { id: d, x: 6.5, y: 5 }
            - { id: e, x: 9.5, y: 1.5 }
            - { id: f, x: 9.5, y: 8.5 }
          edges:
            - { from: a, to: b }
            - { from: a, to: c }
            - { from: b, to: d }
            - { from: c, to: d }
            - { from: d, to: e }
            - { from: d, to: f }
        steps:
          - caption: |
              $P = a, b, d, e$ je jedna z nejdelších orientovaných cest. Do jejího začátku $a$ nevede žádná hrana a z konce $e$ žádná nevychází – $a$ je vstupní a $e$ výstupní uzel.
            nodes: { a: source, e: sink }
            edges: { a-b: path, b-d: path, d-e: path }
          - caption: |
              Kdyby z konce $e$ vedla hrana do uzlu na $P$ (zde $e \to b$), uzavřela by cyklus $b \to d \to e \to b$ – v acyklickém grafu to nejde.
            add: [[e, b]]
          - caption: |
              Hrana z $e$ do uzlu mimo $P$ (zde $e \to f$) by zase $P$ prodloužila na $a, b, d, e, f$, takže $P$ by nebyla nejdelší. Konec nejdelší cesty je proto vždy výstupní uzel – teď je to $f$.
            remove: [[e, b]]
            add: [[e, f]]
            nodes: { a: source, f: sink }
            edges: { a-b: path, b-d: path, d-e: path, e-f: path }
    related: [def-vstupni-vystupni-uzel, def-acyklicky-graf, thm-acyklicke-grafy]
    source: "přednáška 2, folie 11"
    supplemented: false

  - id: thm-acyklicke-grafy
    kind: theorem
    label: Věta
    section: "1.5"
    title: Charakterizace acyklických grafů (topologické očíslování)
    terms: [charakterizace acyklických grafů, topologické uspořádání, topologické očíslování, acyklické očíslování, číslování uzlů]
    statement: |
      Buď $\vec{G}$ orientovaný graf a $n = |U(\vec{G})|$. Následující tvrzení jsou ekvivalentní:

      - (i) $\vec{G}$ je acyklický,
      - (ii) každý neprázdný podgraf grafu $\vec{G}$ má výstupní uzel,
      - (iii) každý neprázdný podgraf grafu $\vec{G}$ má vstupní uzel,
      - (iv) existuje takové očíslování uzlů grafu $\vec{G}$ čísly $1, \dots, n$, že
         $(i,j) \in H(\vec{G}) \Rightarrow i < j$.
    intuition: |
      Bod (iv) je **topologické uspořádání**: uzly lze seřadit do řady tak, že všechny šipky míří doprava.
      Je to přesně pořadí, ve kterém lze provádět úlohy se závislostmi. Body (ii)/(iii) dávají návod, jak takové
      očíslování najít: opakovaně odebírej vstupní uzel a přiděl mu nejmenší volné číslo (nebo výstupní uzel a
      nejvyšší číslo). Pokud v nějakém kroku vstupní uzel neexistuje, graf obsahuje cyklus – tak se zároveň
      ověřuje acykličnost.
    proof: |
      *Důkaz není ve foliích, doplněno.* Dokážeme (i) ⇒ (ii) ⇒ (iv) ⇒ (i) a (i) ⇒ (iii) ⇒ (iv).

      **(i) ⇒ (ii), (i) ⇒ (iii).** Neprázdný podgraf acyklického grafu je acyklický
      ([věta](#thm-podgraf-acyklickeho)), a tedy má výstupní i vstupní uzel ([větička](#prop-acyklicky-vstupni-vystupni)).

      **(ii) ⇒ (iv).** Čísla přidělujeme od $n$ dolů. Graf $\vec{G}_n = \vec{G}$ má výstupní uzel; přidělíme mu číslo $n$.
      Obecně, mají-li uzly čísla $n, n-1, \dots, k+1$, je podgraf $\vec{G}_k$ indukovaný na zbylých uzlech neprázdný,
      podle (ii) má výstupní uzel $x$ a ten dostane číslo $k$. Nechť $(x, y)$ je hrana a $x$ dostal číslo $k$. V okamžiku
      číslování byl $x$ výstupním uzlem grafu $\vec{G}_k$, takže $y \notin U(\vec{G}_k)$, tj. $y$ už měl číslo větší než $k$
      (smyčka $(x,x)$ by odporovala tomu, že $x$ je výstupní). Tedy hrany vedou z menšího čísla do většího.

      **(iii) ⇒ (iv).** Symetricky: čísla $1, 2, \dots$ přidělujeme postupně vstupním uzlům podgrafů indukovaných na
      dosud neočíslovaných uzlech; hrana $(y, x)$ do právě číslovaného uzlu $x$ nemůže vést ze zbylých uzlů, vede tedy
      z uzlu s menším číslem.

      **(iv) ⇒ (i).** Kdyby $\vec{G}$ obsahoval cyklus s uzly očíslovanými $i_1, i_2, \dots, i_k$ (v pořadí cyklu),
      plynulo by z (iv) $i_1 < i_2 < \dots < i_k < i_1$ (pro smyčku $i_1 < i_1$) – spor. $\square$
    proof_steps:
      - "(i) ⇒ (ii), (iii): každý neprázdný podgraf acyklického grafu je acyklický, a proto má výstupní i vstupní uzel."
      - "(ii) ⇒ (iv): opakovaně vybíráme výstupní uzel podgrafu indukovaného na neočíslovaných uzlech a přidělujeme čísla od n dolů."
      - V okamžiku očíslování z uzlu nevede hrana do žádného neočíslovaného uzlu, takže všechny jeho hrany vedou do uzlů s větším číslem.
      - "(iii) ⇒ (iv): symetricky přidělujeme čísla od 1 nahoru vstupním uzlům."
      - "(iv) ⇒ (i): cyklus by dával ostře rostoucí posloupnost čísel, která se vrátí na začátek, což je spor."
    examples:
      - title: Topologické očíslování
        body: |
          Graf s uzly $a, b, c, d, e$ a hranami $a \to c$, $b \to c$, $b \to d$, $c \to e$, $d \to e$.
          Vstupní uzly jsou $a, b$: očíslujeme $a = 1$ a odebereme jej. Vstupní je nyní jen $b$: $b = 2$.
          Po odebrání $b$ jsou vstupní $c, d$: $c = 3$, $d = 4$. Zbývá $e = 5$.
          Kontrola: všechny hrany ($1\to3$, $2\to3$, $2\to4$, $3\to5$, $4\to5$) vedou z menšího čísla do většího.
          (Očíslování obecně není jednoznačné – např. $b = 1$, $a = 2$ vyhovuje také.)
        graph:
          directed: true
          nodes:
            - { id: a, x: 0, y: 1 }
            - { id: b, x: 0, y: 7 }
            - { id: c, x: 4, y: 2 }
            - { id: d, x: 4, y: 8 }
            - { id: e, x: 8, y: 5 }
          edges:
            - { from: a, to: c }
            - { from: b, to: c }
            - { from: b, to: d }
            - { from: c, to: e }
            - { from: d, to: e }
    illustrations:
      - title: Číslování odebíráním vstupních uzlů
        for: proof
        property: acyclic
        graph:
          directed: true
          nodes:
            - { id: a, x: 0.5, y: 1 }
            - { id: b, x: 0.5, y: 7 }
            - { id: c, x: 4, y: 2 }
            - { id: d, x: 4, y: 8 }
            - { id: e, x: 8, y: 5 }
          edges:
            - { from: a, to: c }
            - { from: b, to: c }
            - { from: b, to: d }
            - { from: c, to: e }
            - { from: d, to: e }
        steps:
          - caption: |
              Graf je acyklický, takže má vstupní uzly – zde $a$ a $b$ (nevede do nich žádná hrana).
            nodes: { a: source, b: source }
          - caption: |
              Uzlu $a$ přidělíme číslo 1 a „odebereme“ ho. Zbylý podgraf je opět acyklický, a má tedy vstupní uzel – teď jen $b$, protože do $c$ ještě vede hrana z $b$.
            labels: { a: "1" }
            nodes: { a: done, b: source }
          - caption: |
              $b$ dostane číslo 2. Po jeho odebrání jsou vstupní $c$ i $d$; na pořadí mezi nimi nezáleží.
            labels: { a: "1", b: "2" }
            nodes: { a: done, b: done, c: source, d: source }
          - caption: |
              Postupně $c = 3$, $d = 4$, $e = 5$. Každý uzel dostal číslo ve chvíli, kdy do něj už nevedla hrana z neočíslovaného uzlu – proto všechny hrany vedou z menšího čísla do většího.
            labels: { a: "1", b: "2", c: "3", d: "4", e: "5" }
            nodes: { a: done, b: done, c: done, d: done, e: done }
          - caption: |
              Přidáme hranu $e \to b$. Po očíslování $a = 1$ má každý ze zbylých uzlů $b, c, d, e$ hranu dovnitř, vstupní uzel neexistuje a číslování uvízne. Podle věty to znamená cyklus, např. $b \to c \to e \to b$.
            add: [[e, b]]
            labels: { a: "1" }
            nodes: { a: done }
            witness: true
    related: [def-acyklicky-graf, alg-topologicke-cislovani, cor-acyc-polynomialni, prop-acyklicky-vstupni-vystupni, alg-kriticka-cesta]
    source: "přednáška 2, folie 12"
    supplemented: false

  - id: alg-topologicke-cislovani
    kind: algorithm
    section: "1.5"
    title: Algoritmus číslování uzlů (test acykličnosti, topologické uspořádání)
    terms: [algoritmus číslování uzlů, topologické třídění, topological sort, test acykličnosti, acyklické očíslování]
    statement: |
      Vstup: orientovaný graf $\vec{G}$. Výstup: očíslování uzlů $1, \dots, n$ s vlastností
      $(i,j) \in H(\vec{G}) \Rightarrow i < j$, nebo zjištění, že $\vec{G}$ obsahuje cyklus.
    pseudocode: |
      1. Spočti vstupní stupně $d^+(u)$ všech uzlů; všechny uzly s $d^+(u) = 0$ vlož do seznamu $S$; polož $k := 0$.
      2. Dokud $S \ne \emptyset$:
         1. vyjmi z $S$ uzel $x$, polož $k := k + 1$ a přiděl $x$ číslo $k$,
         2. pro každou hranu $(x, y)$ sniž $d^+(y)$ o 1; klesne-li na 0, vlož $y$ do $S$.
      3. Je-li $k = n$, je očíslování hotovo a graf je acyklický; je-li $k < n$, graf **obsahuje cyklus**
         (zbylý podgraf nemá vstupní uzel).
    complexity: "$O(n + m)$"
    intuition: |
      Algoritmus realizuje důkaz implikace (iii) ⇒ (iv): opakovaně odebírá vstupní uzel. Místo skutečného
      mazání si jen pamatujeme, kolik neodebraných předchůdců má každý uzel. Každý uzel se do $S$ vloží nejvýše
      jednou a každá hrana se zpracuje jednou, proto $O(n + m)$ (při zadání maticí sousednosti $O(n^2)$).

      Skončí-li algoritmus dřív, než očísluje všechny uzly, má podgraf indukovaný na zbylých uzlech všechny
      vstupní stupně kladné, tedy nemá vstupní uzel, a podle [věty](#thm-acyklicke-grafy) (iii) graf není acyklický.
    visualization: critical-path
    related: [thm-acyklicke-grafy, cor-acyc-polynomialni, alg-kriticka-cesta]
    source: "doplněno podle důkazu věty o acyklických grafech (algoritmus známý z KMA/DMA)"
    supplemented: true

  - id: cor-acyc-polynomialni
    kind: corollary
    label: Důsledek
    section: "1.5"
    title: Úloha ACYC je polynomiální
    terms: [ACYC, problém ACYC, test acykličnosti, polynomiální algoritmus]
    statement: |
      Uvažujme úlohu **ACYC**:

      - **Vstup:** graf $\vec{G}$,
      - **Úkol:** je graf $\vec{G}$ acyklický?
      - **Výstup:** ANO / NE.

      Úloha ACYC je řešitelná v polynomiálním čase.
    intuition: |
      Cyklů může být exponenciálně mnoho, ale není nutné je procházet: stačí se pokusit o topologické
      očíslování. Podaří-li se, cyklus není; nepodaří-li se, cyklus je.
    proof: |
      *Důkaz není ve foliích, doplněno.*

      Podle [věty o acyklických grafech](#thm-acyklicke-grafy) je $\vec{G}$ acyklický, právě když každý neprázdný
      podgraf má vstupní uzel, což ověří [algoritmus číslování uzlů](#alg-topologicke-cislovani): opakovaně odebírá
      vstupní uzel a buď očísluje všech $n$ uzlů (graf je acyklický), nebo se zastaví na neprázdném podgrafu bez
      vstupního uzlu (graf acyklický není). Algoritmus pracuje v čase $O(n + m)$, resp. $O(n^2)$, tedy polynomiálně. $\square$
    proof_steps:
      - Podle charakterizace je graf acyklický, právě když každý neprázdný podgraf má vstupní uzel.
      - Algoritmus číslování uzlů opakovaně odebírá vstupní uzel podgrafu tvořeného zbylými uzly.
      - Pokud očísluje všechny uzly, je graf acyklický; pokud uvízne, našel podgraf bez vstupního uzlu, a graf tedy obsahuje cyklus.
      - Algoritmus běží v čase O(n + m), takže úloha ACYC je polynomiální.
    complexity: "$O(n + m)$"
    related: [thm-acyklicke-grafy, alg-topologicke-cislovani, rem-polynomialni-vs-exponencialni]
    source: "přednáška 2, folie 12"
    supplemented: false

  - id: def-kondenzace
    kind: definition
    label: Definice
    section: "1.5"
    title: Kondenzace grafu
    terms: [kondenzace, kondenzace grafu, graf kvazikomponent, condensation]
    statement: |
      Buď $\vec{G}$ orientovaný graf, $\vec{G}_1, \dots, \vec{G}_k$ jeho kvazikomponenty. Orientovaný graf $\vec{G}_C$ s
      $$
      U(\vec{G}_C) = \{\vec{G}_1, \dots, \vec{G}_k\}
      $$
      a
      $$
      H(\vec{G}_C) = \{(\vec{G}_i, \vec{G}_j) \mid i \ne j \text{ a existují } x \in U(\vec{G}_i),\ y \in U(\vec{G}_j) \text{ tak, že } (x,y) \in H(\vec{G})\}
      $$
      se nazývá **kondenzace** grafu $\vec{G}$.
    intuition: |
      Každou kvazikomponentu „smrštíme" do jednoho uzlu a mezi dvěma takovými uzly vedeme hranu, vede-li v původním
      grafu aspoň jedna hrana odpovídajícím směrem (násobné hrany splynou, smyčky nevznikají). Kondenzace ukazuje
      **hrubou strukturu** orientovaného grafu: uvnitř kvazikomponent je „vše propojeno", mezi nimi vedou hrany jen
      jedním směrem a tvoří acyklický graf.
    examples:
      - title: Kondenzace grafu se 7 uzly
        body: |
          Pro graf z příkladu u [kvazikomponent](#def-kvazikomponenta) označme $A = \{1,2,3\}$, $B = \{4,5\}$,
          $C = \{6,7\}$. Hrana $3 \to 4$ dává $(A, B)$, hrana $2 \to 6$ dává $(A, C)$ a hrana $5 \to 7$ dává $(B, C)$.
          Kondenzace je acyklický graf s topologickým uspořádáním $A, B, C$.
        graph:
          directed: true
          nodes:
            - { id: A, x: 1, y: 2 }
            - { id: B, x: 5, y: 7 }
            - { id: C, x: 8, y: 2 }
          edges:
            - { from: A, to: B }
            - { from: A, to: C }
            - { from: B, to: C }
    visualization: scc
    related: [def-kvazikomponenta, thm-kondenzace, alg-kvazikomponenty]
    source: "přednáška 2, folie 12"
    supplemented: false

  - id: thm-kondenzace
    kind: theorem
    label: Věta
    section: "1.5"
    title: Vlastnosti kondenzace
    terms: [kondenzace, acykličnost kondenzace, silná souvislost a kondenzace]
    statement: |
      Buď $\vec{G}$ orientovaný graf. Platí:

      - (i) $\vec{G}_C$ je acyklický graf,
      - (ii) $\vec{G}$ je silně souvislý, právě když $\vec{G}_C$ je graf s jediným uzlem,
      - (iii) $\vec{G}$ je acyklický graf, právě když $\vec{G} = \vec{G}_C$.

      (V bodě (iii) se rovností rozumí isomorfismus při ztotožnění uzlu $x$ s kvazikomponentou $(\{x\}, \emptyset)$.)
    intuition: |
      Každý orientovaný graf je „acyklický graf silně souvislých kousků". Bod (i) je důležitý algoritmicky:
      na kondenzaci lze použít topologické uspořádání. Využívá se např. u rozložitelnosti matic (blokově
      trojúhelníkový tvar), u jádra grafu nebo u 2-SAT (kvazikomponenty implikačního grafu).
    proof: |
      *Důkaz není ve foliích, doplněno.* Využijeme, že kvazikomponenty jsou třídy vzájemné dosažitelnosti
      ([tvrzení](#prop-kvazikomponenty-rozklad)).

      **(i)** $\vec{G}_C$ nemá smyčky (hrany jen pro $i \ne j$). Nechť $\vec{G}_{i_1} \to \vec{G}_{i_2} \to \dots \to \vec{G}_{i_r} \to \vec{G}_{i_1}$,
      $r \ge 2$, je cyklus v $\vec{G}_C$. Každá jeho hrana pochází z hrany grafu $\vec{G}$ mezi příslušnými kvazikomponentami
      a uvnitř každé kvazikomponenty se lze dostat z libovolného uzlu do libovolného. Lze tedy sestavit uzavřený
      orientovaný sled, který prochází všemi $\vec{G}_{i_1}, \dots, \vec{G}_{i_r}$; libovolné dva jeho uzly jsou vzájemně
      dosažitelné, takže uzly z $\vec{G}_{i_1}$ a $\vec{G}_{i_2}$ leží v téže kvazikomponentě – spor s tím, že jde o různé
      kvazikomponenty.

      **(ii)** $\vec{G}$ je silně souvislý ⇔ všechny uzly jsou navzájem dosažitelné ⇔ existuje jediná třída vzájemné
      dosažitelnosti ⇔ $\vec{G}$ má jedinou kvazikomponentu ⇔ $\vec{G}_C$ má jediný uzel.

      **(iii) (⇒)** Je-li $\vec{G}$ acyklický a $u \ne v$ leží v téže kvazikomponentě, pak orientované cesty $u \to v$ a
      $v \to u$ tvoří uzavřený orientovaný sled kladné délky, který obsahuje cyklus – spor. Každá kvazikomponenta je tedy
      jediný uzel (bez smyčky), a hrana $(\{x\}, \{y\})$ je v $\vec{G}_C$ právě když $(x,y) \in H(\vec{G})$, tj.
      $x \mapsto (\{x\}, \emptyset)$ je isomorfismus $\vec{G} \to \vec{G}_C$.
      **(⇐)** Je-li $\vec{G} \simeq \vec{G}_C$, je $\vec{G}$ acyklický podle (i). $\square$
    proof_steps:
      - Kondenzace nemá smyčky, protože hrany vedou jen mezi různými kvazikomponentami.
      - Cyklus v kondenzaci by spolu se silnou souvislostí uvnitř kvazikomponent dal uzavřený orientovaný sled přes několik kvazikomponent.
      - Uzly různých kvazikomponent by pak byly vzájemně dosažitelné, což je spor; kondenzace je tedy acyklická.
      - Silná souvislost znamená, že všechny uzly tvoří jedinou třídu vzájemné dosažitelnosti, tj. kondenzace má jediný uzel.
      - V acyklickém grafu jsou všechny kvazikomponenty jednouzlové, takže kondenzace je s ním isomorfní; obráceně plyne acykličnost z (i).
    illustrations:
      - title: Cyklus v kondenzaci by kvazikomponenty slil
        for: proof
        property: strongly-connected
        graph:
          directed: true
          nodes:
            - { id: a, x: 0.5, y: 0.5 }
            - { id: b, x: 2, y: 4 }
            - { id: c, x: 4, y: 7 }
            - { id: d, x: 6, y: 9.5 }
            - { id: e, x: 8, y: 4 }
            - { id: f, x: 9.5, y: 0.5 }
          edges:
            - { from: a, to: b }
            - { from: b, to: a }
            - { from: b, to: c }
            - { from: c, to: d }
            - { from: d, to: c }
            - { from: d, to: e }
            - { from: e, to: f }
            - { from: f, to: e }
        steps:
          - caption: |
              Kvazikomponenty $A = \{a, b\}$, $B = \{c, d\}$, $C = \{e, f\}$. Hrany $b \to c$ a $d \to e$ dávají kondenzaci $A \to B \to C$ – acyklický graf se třemi uzly.
          - caption: |
              Kdyby kondenzace měla cyklus $A \to B \to C \to A$ (přidáme $f \to a$), vznikl by uzavřený sled $a \to b \to c \to d \to e \to f \to a$ a všechny uzly by byly vzájemně dosažitelné. Kvazikomponenty by tedy splynuly v jednu – graf je teď silně souvislý a jeho kondenzace má jediný uzel (bod (ii)).
            add: [[f, a]]
          - caption: |
              Bod (iii): odebereme $f \to a$ i zpětné hrany $b \to a$, $d \to c$, $f \to e$. Graf je acyklický, každý uzel tvoří samostatnou kvazikomponentu a kondenzace je s grafem totožná.
            remove: [[f, a], [b, a], [d, c], [f, e]]
    related: [def-kondenzace, def-kvazikomponenta, prop-kvazikomponenty-rozklad, def-acyklicky-graf]
    source: "přednáška 2, folie 12"
    supplemented: false

  # ------------------------------------------------------------------ 1.6
  - id: def-w-vzdalenost-orientovana
    kind: definition
    label: Definice
    section: "1.6"
    title: Ohodnocený orientovaný graf, w-délka a vzdálenosti v orientovaném grafu
    terms: [ohodnocený orientovaný graf, w-délka orientované cesty, vzdálenost v orientovaném grafu, w-vzdálenost v orientovaném grafu]
    statement: |
      Buď $\vec{G}$ graf. Funkce $w : H(\vec{G}) \to (0, \infty)$ se nazývá **(hranové) ohodnocení** grafu $\vec{G}$;
      graf se zadaným ohodnocením se nazývá **ohodnocený graf**.

      Pro každou orientovanou cestu $\vec{P} \subset \vec{G}$ definujeme **$w$-délku** $w(\vec{P}) = \sum_{h \in H(\vec{P})} w(h)$.

      Nechť $u, v \in U(\vec{G})$. Pak

      - (i) **vzdáleností** uzlů $u, v$ v grafu $\vec{G}$ (značíme $d_{\vec{G}}(u,v)$) rozumíme nejmenší délku orientované
         cesty z uzlu $u$ do uzlu $v$ v grafu $\vec{G}$,
      - (ii) **$w$-vzdáleností** uzlů $u, v$ v grafu $\vec{G}$ (značíme $d^w_{\vec{G}}(u,v)$) rozumíme nejmenší $w$-délku
         orientované cesty z uzlu $u$ do uzlu $v$ v grafu $\vec{G}$.

      Neexistuje-li v $\vec{G}$ cesta z $u$ do $v$, klademe $d_{\vec{G}}(u,v) = d^w_{\vec{G}}(u,v) = \infty$.
    intuition: |
      V orientovaném grafu vzdálenost **není symetrická**: $d_{\vec{G}}(u,v)$ může být 1 a $d_{\vec{G}}(v,u) = \infty$.
      Zůstává ale nezápornost a trojúhelníková nerovnost (tzv. kvazimetrika). Kladné váhy jsou opět podstatné –
      na nich stojí správnost Dijkstrova algoritmu.
    related: [def-w-delka-vzdalenost, alg-dijkstra, def-matice-sousednosti-orientovaneho, rem-distancni-matice]
    source: "přednáška 3, folie 1"
    supplemented: false

  - id: def-matice-sousednosti-orientovaneho
    kind: definition
    label: Definice
    section: "1.6"
    title: Matice sousednosti a vážená matice sousednosti orientovaného grafu
    terms: [matice sousednosti orientovaného grafu, vážená matice sousednosti, A(G), W(G)]
    statement: |
      Nechť $\vec{G}$ je ohodnocený graf s uzly očíslovanými $1, \dots, n$. Položme
      $$
      w_{ij} = \begin{cases} w((i,j)) & \text{jestliže } (i,j) \in H(\vec{G}),\\ 0 & \text{jinak.} \end{cases}
      $$
      Matice $\mathbf{W}(\vec{G}) = [w_{ij}]_{i,j=1}^n$ se nazývá **vážená matice sousednosti** grafu $\vec{G}$.
      Neohodnocený graf považujeme za ohodnocený $w_{ij} = 1$.

      **Matice sousednosti** grafu $\vec{G}$ je $\mathbf{A}(\vec{G}) = [a_{ij}]_{i,j=1}^n$, kde $a_{ij} = 1$, jestliže
      $(i,j) \in H(\vec{G})$, a $a_{ij} = 0$ jinak.

      Matice $w$-vzdáleností $\mathbf{D}^w(\vec{G}) = [d^w_{\vec{G}}(i,j)]$ a distanční matice
      $\mathbf{D}(\vec{G}) = [d_{\vec{G}}(i,j)]$ se definují stejně jako v neorientovaném případě
      (viz [w-distanční matice](#def-w-distancni-matice)).
    intuition: |
      Matice sousednosti orientovaného grafu obecně **není symetrická**: řádek $i$ popisuje hrany z uzlu $i$ ven,
      sloupec $j$ hrany do uzlu $j$. Řádkové součty jsou výstupní stupně $d^-$, sloupcové vstupní stupně $d^+$.
      Smyčka $(i,i)$ dává jedničku na diagonále.
    related: [def-matice-sousednosti, thm-mocniny-matice-sousednosti, def-w-distancni-matice]
    source: "přednáška 3, folie 2"
    supplemented: false

  - id: thm-mocniny-matice-sousednosti
    kind: theorem
    label: Věta
    section: "1.6"
    title: Mocniny matice sousednosti počítají sledy
    terms: [mocniny matice sousednosti, počet sledů, sledy délky k, A^k]
    statement: |
      Nechť $\vec{G}$ je orientovaný graf a $k \ge 0$. Prvek $a^{(k)}_{ij}$ matice $(\mathbf{A}(\vec{G}))^k$ je roven
      počtu sledů délky (přesně) $k$ z uzlu $i$ do uzlu $j$ v $\vec{G}$.
    intuition: |
      Násobení matic přesně odpovídá „prodlužování sledů o jednu hranu": sled délky $k+1$ z $i$ do $j$ je sled délky $k$
      z $i$ do nějakého $l$ následovaný hranou $(l,j)$. Pozor, počítají se **sledy** (s opakováním uzlů), ne cesty.
      Pro neorientovaný graf (symetrická matice) platí totéž.
    proof: |
      *Důkaz není ve foliích, doplněno.* Indukcí podle $k$ (orientovaný sled délky $k$ chápeme jako posloupnost uzlů
      $x_0, \dots, x_k$, kde $(x_{t}, x_{t+1}) \in H(\vec{G})$).

      **$k = 0$:** $\mathbf{A}^0 = \mathbf{E}$ (jednotková matice). Sled délky 0 z $i$ do $j$ existuje jediný pro $i = j$
      a žádný pro $i \ne j$ – souhlasí.

      **$k \to k+1$:** $a^{(k+1)}_{ij} = \sum_{l=1}^n a^{(k)}_{il}\, a_{lj}$. Sledy délky $k+1$ z $i$ do $j$ rozdělíme podle
      předposledního uzlu $l$: každý je jednoznačně tvořen sledem délky $k$ z $i$ do $l$ a hranou $(l,j)$. Pro pevné $l$
      je jejich počet $a^{(k)}_{il}$ (indukční předpoklad) krát $a_{lj}$ (1, je-li hrana, jinak 0). Sečtením přes $l$
      dostaneme právě $a^{(k+1)}_{ij}$. $\square$
    proof_steps:
      - Pro k = 0 je A^0 jednotková matice a sled délky 0 vede jen z uzlu do sebe.
      - Pro indukční krok rozepíšeme a_ij^(k+1) jako součet a_il^(k)·a_lj přes všechny uzly l.
      - Sledy délky k+1 z i do j rozdělíme podle předposledního uzlu l na sled délky k z i do l a hranu (l, j).
      - Pro pevné l je jejich počet a_il^(k)·a_lj, a sečtením přes l dostaneme a_ij^(k+1).
    examples:
      - title: Sledy v orientovaném trojúhelníku
        body: |
          Pro cyklus $\vec{C}_3$: $1 \to 2 \to 3 \to 1$ je $\mathbf{A}$ permutační matice a $\mathbf{A}^3 = \mathbf{E}$:
          z každého uzlu vede právě jeden sled délky 3, a to zpět do sebe. Prvek $a^{(2)}_{13} = 1$ (sled $1,2,3$),
          zatímco $a^{(1)}_{13} = 0$, takže $d_{\vec{G}}(1,3) = 2$.
    related: [def-matice-sousednosti-orientovaneho, cor-distancni-matice-mocniny, def-matice-sousednosti]
    source: "přednáška 3, folie 3"
    supplemented: false

  - id: cor-distancni-matice-mocniny
    kind: corollary
    label: Důsledek
    section: "1.6"
    title: Distanční matice z mocnin matice sousednosti
    terms: [distanční matice, výpočet distanční matice, mocniny matice sousednosti]
    statement: |
      Prvek $d_{ij}$ matice $\mathbf{D}(\vec{G})$ je roven nejmenší mocnině $k$, pro kterou je prvek $a^{(k)}_{ij}$
      matice $(\mathbf{A}(\vec{G}))^k$ nenulový.
    intuition: |
      Vzdálenost = délka nejkratšího sledu (nejkratší sled je cesta). Stačí počítat mocniny $\mathbf{A}^0, \mathbf{A}^1, \dots, \mathbf{A}^{n-1}$:
      cesta má nejvýše $n - 1$ hran, takže je-li $a^{(k)}_{ij} = 0$ pro všechna $k \le n-1$, je $d_{ij} = \infty$.
      Složitost naivně $O(n \cdot n^3) = O(n^4)$ – pro praxi je lepší $n$-krát BFS ($O(n(n+m))$).
    proof: |
      *Důkaz není ve foliích, doplněno.*

      Podle [věty](#thm-mocniny-matice-sousednosti) je $a^{(k)}_{ij} \ne 0$, právě když existuje orientovaný sled délky $k$
      z $i$ do $j$. Nejmenší takové $k$ je délka nejkratšího sledu z $i$ do $j$. Ten je cestou
      ([větička](#prop-silna-souvislost-cesta) – vynechání opakujících se úseků) a každá cesta je sledem, takže délka
      nejkratšího sledu je rovna délce nejkratší cesty, tj. $d_{\vec{G}}(i,j) = d_{ij}$. Neexistuje-li žádný sled
      (všechny mocniny mají na pozici $(i,j)$ nulu), je $d_{ij} = \infty$. $\square$
    proof_steps:
      - Podle věty o mocninách je a_ij^(k) nenulové, právě když existuje sled délky k z i do j.
      - Nejmenší takové k je délka nejkratšího sledu z i do j.
      - Nejkratší sled je cesta a každá cesta je sled, proto se tato délka rovná vzdálenosti d(i,j).
      - Neexistuje-li žádný sled, jsou všechny prvky nulové a vzdálenost je nekonečná.
    related: [thm-mocniny-matice-sousednosti, rem-distancni-matice, def-w-distancni-matice]
    source: "přednáška 3, folie 3"
    supplemented: false

  - id: thm-minplus-mocniny-cenove-matice
    kind: theorem
    label: Věta
    section: "1.6"
    title: w-distanční matice jako (min,+) mocnina cenové matice
    terms: [cenová matice, min-plus násobení, tropické násobení, mocniny cenové matice, C(G), D^(k)]
    statement: |
      Nechť $\vec{G}$ je ohodnocený orientovaný graf. Definujme **cenovou matici** $\mathbf{C}(\vec{G}) = [c_{ij}]_{i,j=1}^n$:
      $$
      c_{ij} = \begin{cases} 0 & \text{jestliže } i = j,\\ \infty & \text{jestliže } i \ne j \text{ a } (i,j) \notin H(\vec{G}),\\ w_{ij} & \text{jestliže } i \ne j \text{ a } (i,j) \in H(\vec{G}). \end{cases}
      $$
      Definujme operace $a \oplus b = \min\{a,b\}$, $a \odot b = a + b$ a $k$-tou mocninu matice $\mathbf{C}(\vec{G})$ při těchto
      operacích označme $\mathbf{D}^{(k)}(\vec{G})$.

      Buď $r$ nejmenší číslo, pro něž platí $\mathbf{D}^{(r)}(\vec{G}) = \mathbf{D}^{(r+1)}(\vec{G})$. Pak
      $\mathbf{D}^{(r)}(\vec{G}) = \mathbf{D}^w(\vec{G})$.
    intuition: |
      V „(min,+) algebře" je součin matic $(\mathbf{X} \odot \mathbf{Y})_{ij} = \min_l (x_{il} + y_{lj})$ – místo sčítání
      počtů sledů hledáme nejlevnější prodloužení. Prvek $d^{(k)}_{ij}$ je nejmenší $w$-délka sledu z $i$ do $j$ s nejvýše
      $k$ hranami (nula na diagonále umožňuje „postát na místě"). Jakmile se mocnina přestane měnit, už se nic nezlepší.
      Protože cesta má nejvýše $n-1$ hran, je $r \le n - 1$, a výpočet stojí $O(n^4)$ (resp. $O(n^3 \log n)$
      opakovaným umocňováním). Floydův algoritmus to zvládne v $O(n^3)$ – viz [Floydův algoritmus](#alg-floyd).
    proof: |
      *Důkaz není ve foliích, doplněno.*

      **Krok 1:** indukcí podle $k \ge 1$ ukážeme, že $d^{(k)}_{ij}$ je nejmenší $w$-délka orientovaného sledu z $i$ do $j$
      s **nejvýše** $k$ hranami (prázdný sled z $i$ do $i$ má délku 0; neexistuje-li sled, je hodnota $\infty$). Pro $k = 1$
      to je přesně definice $\mathbf{C}$. Dále $d^{(k+1)}_{ij} = \min_l \left(d^{(k)}_{il} + c_{lj}\right)$: člen s $l = j$ dává
      $d^{(k)}_{ij}$ (sledy s nejvýše $k$ hranami) a členy s $l \ne j$ sledy, které končí hranou $(l,j)$ a mají nejvýše $k + 1$
      hran. Každý sled s nejvýše $k+1$ hranami je jednoho z těchto typů.

      **Krok 2:** protože váhy jsou kladné, lze z každého sledu vynecháním uzavřených úseků získat cestu se stejnými konci,
      nejvýše stejnou $w$-délkou a menším nebo stejným počtem hran. Proto $d^{(k)}_{ij}$ je i nejmenší $w$-délka **cesty**
      z $i$ do $j$ s nejvýše $k$ hranami. Cesta má nejvýše $n - 1$ hran, takže $\mathbf{D}^{(k)} = \mathbf{D}^w$ pro všechna $k \ge n-1$.

      **Krok 3:** platí $\mathbf{D}^{(k+1)} = \mathbf{D}^{(k)} \odot \mathbf{C}$. Je-li $\mathbf{D}^{(r)} = \mathbf{D}^{(r+1)}$, pak
      indukcí $\mathbf{D}^{(r+s+1)} = \mathbf{D}^{(r+s)} \odot \mathbf{C} = \mathbf{D}^{(r)} \odot \mathbf{C} = \mathbf{D}^{(r)}$ pro
      všechna $s \ge 0$. Speciálně $\mathbf{D}^{(r)} = \mathbf{D}^{(\max(r, n-1))} = \mathbf{D}^w$. $\square$
    proof_steps:
      - Indukcí ukážeme, že d_ij^(k) je nejmenší w-délka sledu z i do j s nejvýše k hranami (nula na diagonále C dovoluje sled neprodlužovat).
      - Kladnost vah umožní ze sledu vynechat uzavřené úseky, takže jde zároveň o nejmenší w-délku cesty s nejvýše k hranami.
      - Cesta má nejvýše n − 1 hran, proto D^(k) = D^w pro všechna k ≥ n − 1.
      - Protože D^(k+1) = D^(k) ⊙ C, jakmile se dvě po sobě jdoucí mocniny rovnají, zůstávají všechny další mocniny stejné.
      - Proto se D^(r) rovná D^(n−1) = D^w.
    related: [def-w-distancni-matice, alg-floyd, thm-floyd, rem-floyd-odkaz]
    source: "přednáška 3, folie 3"
    supplemented: false

  - id: rem-floyd-odkaz
    kind: remark
    label: Algoritmus 3.1 (odkaz)
    section: "1.6"
    title: Floydův algoritmus (stručně)
    terms: [Floydův algoritmus, Floyd-Warshall, všechny dvojice, w-distanční matice]
    statement: |
      Floydův algoritmus vychází z $\mathbf{D}_0 = \mathbf{C}(\vec{G})$ a pro $k = 1, \dots, n$ počítá
      $d^k_{ij} = \min\{d^{k-1}_{ij},\ d^{k-1}_{ik} + d^{k-1}_{kj}\}$; přitom $d^k_{ij}$ je minimální $w$-délka cesty z $i$ do $j$,
      jejíž vnitřní uzly leží v $\{1, \dots, k\}$. Platí $\mathbf{D}_n = \mathbf{D}^w(\vec{G})$ a algoritmus pracuje v čase $O(n^3)$.

      Podrobně viz [Floydův algoritmus](#alg-floyd) a [větu 3.1](#thm-floyd) v kapitole Grafy a matice.
    intuition: |
      Floyd řeší úlohu **všech dvojic** najednou. Pro jediný výchozí uzel je výhodnější Dijkstra ($O(n^2)$);
      opakováním Dijkstry z každého uzlu dostaneme také $O(n^3)$.
    visualization: floyd
    related: [alg-floyd, thm-floyd, def-w-distancni-matice, alg-dijkstra, thm-minplus-mocniny-cenove-matice]
    source: "přednáška 3, folie 4"
    supplemented: false

  - id: alg-dijkstra
    kind: algorithm
    label: Dijkstrův algoritmus
    section: "1.6"
    title: Dijkstrův algoritmus (minimální cesta z u do v)
    terms: [Dijkstrův algoritmus, Dijkstra, minimální cesta, nejkratší cesta v ohodnoceném grafu, trvalá hodnota, dočasná hodnota]
    statement: |
      Vstup: ohodnocený (orientovaný) graf $\vec{G}$ s kladným ohodnocením $w$ a uzly $u, v$.
      Výstup: $w$-délka minimální cesty z $u$ do $v$ (a tato cesta).
      Uzlům se přiřazují dočasné hodnoty $\mathrm{dh}$ (horní odhady vzdálenosti) a trvalé hodnoty $\mathrm{th}$ (už jisté vzdálenosti).
    pseudocode: |
      1. Uzlu $u$ přiřaď trvalou hodnotu $\mathrm{th}(u) = 0$, ostatním uzlům dočasnou hodnotu $\mathrm{dh} = \infty$.
      2. Je-li $x$ poslední uzel, jemuž byla přiřazena trvalá hodnota $\mathrm{th}(x)$, pak všem uzlům $y$, pro něž
         $(x,y) \in H(\vec{G})$ a které ještě nemají trvalou hodnotu, přiřaď novou dočasnou hodnotu
         $\mathrm{dh}(y) := \min\{\mathrm{dh}(y),\ \mathrm{th}(x) + w(x,y)\}$.
      3. Pro uzel $z$ s nejmenší dočasnou hodnotou polož $\mathrm{th}(z) := \mathrm{dh}(z)$.
      4. Má uzel $v$ trvalou hodnotu?
         - **Ne:** vrať se na 2.
         - **Ano:** $\mathrm{th}(v)$ je $w$-délka minimální cesty z $u$ do $v$.

      *Poznámka:* hrany $(x,y)$, na nichž $w(x,y) = \mathrm{th}(y) - \mathrm{th}(x)$, určují minimální cestu z $u$ do $v$
      (stačí jít od $v$ zpět po takových hranách).
    complexity: "$O(n^2)$ (s haldou $O((n+m)\\log n)$)"
    intuition: |
      Dijkstra „rozlévá vodu" z uzlu $u$: uzly dostávají trvalou hodnotu v pořadí podle vzdálenosti od $u$. Klíčový
      argument: uzel $z$ s nejmenší dočasnou hodnotou už nelze dosáhnout levněji, protože jakákoli jiná cesta do $z$
      musí opustit množinu trvalých uzlů přes uzel s dočasnou hodnotou $\ge \mathrm{dh}(z)$ a další hrany už jen přidávají
      (váhy jsou **kladné**).

      **Složitost:** nejvýše $n$ iterací; v každé se hledá minimum z $\le n$ dočasných hodnot ($O(n)$) a aktualizují se
      následníci posledního uzlu (celkem přes všechny iterace $O(m)$). Celkem $O(n^2 + m) = O(n^2)$. S binární haldou
      $O((n + m)\log n)$, což je lepší pro řídké grafy. Pokud algoritmus necháme doběhnout pro všechny uzly, dostaneme
      jeden řádek matice $\mathbf{D}^w$; $n$ běhů dá celou matici v $O(n^3)$.

      **Typické chyby:** použití se zápornými vahami (algoritmus pak může dát špatný výsledek – trvalá hodnota by se
      dodatečně měla zlepšit); záměna s Jarníkovým algoritmem (ten minimalizuje váhu jedné hrany ke stromu, ne délku cesty od $u$).
      Funguje stejně i pro neorientované grafy (každou hranu chápeme jako dvě protisměrné).
    proof: |
      *Důkaz správnosti není ve foliích, doplněno.* Označme $T$ množinu uzlů s trvalou hodnotou.

      **Invariant:** (a) pro každé $z \in T$ je $\mathrm{th}(z) = d^w(u,z)$; (b) pro každé $y \notin T$ je $\mathrm{dh}(y)$
      nejmenší $w$-délka orientované cesty z $u$ do $y$, jejíž všechny uzly kromě $y$ leží v $T$ (nebo $\infty$, žádná-li
      není); (c) trvalé hodnoty jsou přidělovány v neklesajícím pořadí.

      Na začátku $T = \{u\}$, $\mathrm{th}(u) = 0 = d^w(u,u)$, a po prvním kroku 2 jsou dočasné hodnoty přesně váhy hran z $u$.

      **Krok 3 zachovává (a):** nechť $z$ má nejmenší dočasnou hodnotu a $P$ je libovolná orientovaná cesta z $u$ do $z$.
      Nechť $y$ je první uzel cesty $P$ mimo $T$ (existuje, neboť $z \notin T$). Úsek $P$ od $u$ do $y$ má všechny uzly
      kromě $y$ v $T$, takže podle (b) $w(P) \ge w(\text{úsek}) \ge \mathrm{dh}(y) \ge \mathrm{dh}(z)$ (zbytek cesty má
      nezápornou váhu). Hodnota $\mathrm{dh}(z)$ je přitom $w$-délkou skutečné cesty, proto $\mathrm{th}(z) = \mathrm{dh}(z) = d^w(u,z)$.
      Zároveň $\mathrm{dh}(z) \ge$ všechny dříve přidělené trvalé hodnoty, což dává (c).

      **Krok 2 zachovává (b):** po přidání $z$ do $T$ přibudou cesty, jejichž všechny uzly kromě posledního $y$ jsou v $T$
      a které procházejí $z$. Je-li $z$ předposlední, je jejich nejlepší délka $\mathrm{th}(z) + w(z,y)$, což krok 2 započítá.
      Prochází-li $z$ dříve a předposlední je $x \in T$ přidaný před $z$, je úsek do $x$ dlouhý alespoň $\mathrm{th}(z) \ge \mathrm{th}(x)$,
      takže taková cesta není kratší než $\mathrm{th}(x) + w(x,y)$, které už v $\mathrm{dh}(y)$ započteno je.

      **Závěr:** algoritmus skončí nejpozději po $n$ iteracích a podle (a) je $\mathrm{th}(v) = d^w(u,v)$. Je-li $v$ z $u$
      nedosažitelný, dostane trvalou hodnotu $\infty$. $\square$
    proof_steps:
      - Invariant – trvalé hodnoty jsou skutečné w-vzdálenosti od u a dočasná hodnota uzlu y je délka nejlepší cesty do y vedoucí jen přes trvalé uzly.
      - Uvažujme uzel z s nejmenší dočasnou hodnotou a libovolnou cestu z u do z.
      - Tato cesta opouští množinu trvalých uzlů v nějakém uzlu y s dh(y) ≥ dh(z) a zbytek cesty má díky kladným vahám nezápornou délku.
      - Žádná cesta do z tedy není kratší než dh(z), takže přiřazení th(z) := dh(z) je správné.
      - Aktualizace dočasných hodnot přes nový trvalý uzel z udržuje invariant, protože trvalé hodnoty přibývají v neklesajícím pořadí.
      - Po přiřazení trvalé hodnoty uzlu v je th(v) = d^w(u, v).
    examples:
      - title: Dijkstrův algoritmus krok za krokem
        body: |
          Hledáme minimální cestu z $u$ do $v$ v grafu na obrázku (dočasné hodnoty, tučně trvalé):

          | krok | trvalý uzel | $a$ | $b$ | $c$ | $d$ | $v$ |
          |---|---|---|---|---|---|---|
          | 1 | $u$ (0) | 4 | 2 | ∞ | ∞ | ∞ |
          | 2 | $b$ (**2**) | 3 | – | 10 | 12 | ∞ |
