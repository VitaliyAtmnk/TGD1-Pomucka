        property: eulerian
        graph:
          directed: false
          nodes:
            - { id: a, x: 0.5, y: 1 }
            - { id: b, x: 0.5, y: 9 }
            - { id: c, x: 5, y: 5 }
            - { id: d, x: 9.5, y: 1 }
            - { id: e, x: 9.5, y: 9 }
          edges:
            - { from: a, to: b }
