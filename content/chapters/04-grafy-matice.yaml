  - id: thm-floyd
    kind: theorem
    label: "Věta 3.1"
    section: "3.1"
    title: Správnost a složitost Floydova algoritmu
    terms: [věta 3.1, správnost Floydova algoritmu, složitost Floydova algoritmu, O(n^3)]
    statement: |
      Algoritmus 3.1 nalezne w-distanční matici $\mathbf{D}^w(\vec{G})$ grafu $\vec{G}$ v čase $O(n^3)$.
    intuition: |
      Celý důkaz stojí na invariantu „$d^k_{ij}$ = nejkratší cesta s vnitřními uzly jen z
      $\{v_1,\dots,v_k\}$“. Pro $k = n$ už nejsou žádná omezení, takže dostaneme skutečné vzdálenosti.
    proof: |
      Indukcí podle $k$ dokážeme: **$d^k_{ij}$ je rovno minimální w-délce orientované cesty $\vec{P}$
      z $v_i$ do $v_j$ s $U(\vec{P}) \subset \{v_i, v_j\} \cup \{v_1, \dots, v_k\}$** (tj. nejkratší cesty
      „množinou uzlů $\{1,\dots,k\}$“), případně $\infty$, pokud taková cesta neexistuje.

      *$k = 0$:* povolené jsou jen cesty bez vnitřních uzlů, tj. triviální cesta ($i = j$, délka $0$)
      nebo hrana $(v_i, v_j)$ (délka $w_{ij}$). To je přesně $\mathbf{D}_0$.

      *Indukční krok:* nechť tvrzení platí pro $k - 1$ a $\vec{P}$ je nejkratší cesta z $v_i$ do $v_j$
      množinou uzlů $\{v_1, \dots, v_k\}$.
      * Pokud $v_k \notin U(\vec{P})$, je $\vec{P}$ cestou množinou $\{v_1,\dots,v_{k-1}\}$ a její délka je podle
        indukčního předpokladu $d^{k-1}_{ij}$.
      * Pokud $v_k \in U(\vec{P})$, rozdělí jej $v_k$ na úseky $v_i \to v_k$ a $v_k \to v_j$, oba jsou
        cestami množinou $\{v_1,\dots,v_{k-1}\}$ a (jako části nejkratší cesty) nejkratšími takovými; délka
        $\vec{P}$ je tedy $d^{k-1}_{ik} + d^{k-1}_{kj}$.

      Obě čísla ve vzorci $(*)$ jsou naopak w-délky sledů z $v_i$ do $v_j$ množinou $\{v_1,\dots,v_k\}$
      (spojení dvou cest přes $v_k$ může být sled; vypuštěním cyklů vznikne cesta, která není delší).
      Minimum ve $(*)$ je proto rovno délce nejkratší cesty a tvrzení platí pro $k$.

      Pro $k = n$ nejsou vnitřní uzly nijak omezeny, takže $\mathbf{D}_n = \mathbf{D}^w(\vec{G})$.

      *Složitost:* algoritmus počítá $n$ matic $\mathbf{D}_1, \dots, \mathbf{D}_n$ řádu $n$; výpočet každého
      prvku podle $(*)$ trvá konstantní dobu nezávislou na $n$. Celkem $n \cdot n^2$ prvků, tj. $O(n^3)$.
    proof_steps:
      - Formulujeme invariant – $d^k_{ij}$ je délka nejkratší cesty z $v_i$ do $v_j$, jejíž vnitřní uzly leží v $\{v_1, \dots, v_k\}$ – a dokazujeme ho indukcí podle $k$.
      - Pro $k = 0$ jsou povoleny jen triviální cesty a jednotlivé hrany, což přesně popisuje $\mathbf{D}_0$.
      - Neprochází-li nejkratší cesta uzlem $v_k$, má podle indukčního předpokladu délku $d^{k-1}_{ij}$.
      - Prochází-li uzlem $v_k$, rozpadne se na nejkratší cesty $v_i \to v_k$ a $v_k \to v_j$ přes $\{v_1,\dots,v_{k-1}\}$, s délkou $d^{k-1}_{ik} + d^{k-1}_{kj}$.
      - Obě hodnoty ve vzorci jsou délky přípustných sledů, takže jejich minimum je přesně nejkratší cesta; pro $k = n$ dostaneme $\mathbf{D}^w(\vec{G})$.
      - Algoritmus počítá $n$ matic po $n^2$ prvcích, každý v konstantním čase, celkem $O(n^3)$.
    related: [alg-floyd, def-w-distancni-matice, alg-dijkstra]
    source: "skripta str. 12–13; přednáška 3, fólie 4"

  - id: rem-floyd-dijkstra
    kind: remark
    section: "3.1"
    title: Distanční matice pomocí Dijkstrova algoritmu
    terms: [Dijkstrův algoritmus, Dijkstra n-krát, srovnání Floyd Dijkstra]
    statement: |
      Matici $\mathbf{D}^w(\vec{G})$ lze také nalézt v čase $O(n^3)$ pomocí Dijkstrova algoritmu.
      Ten najde vzdálenosti z pevného uzlu do všech ostatních (tj. jeden řádek distanční matice)
      v čase $O(n^2)$; zopakujeme-li jej $n$-krát pro různé výchozí uzly, dostaneme celou matici
      v $O(n^3)$ krocích.
    intuition: |
      Asymptoticky jsou obě cesty stejné. Floydův algoritmus je jednodušší na implementaci i ruční
      výpočet; Dijkstra s haldou je výhodnější pro řídké grafy (*doplněno mimo skripta*:
      $n$-krát Dijkstra s binární haldou trvá $O(nm \log n)$).
    related: [alg-floyd, def-w-distancni-matice, alg-dijkstra]
    source: "skripta str. 13"

  - id: rem-floyd-rekonstrukce-cest
    kind: remark
    section: "3.1"
    title: Rekonstrukce nejkratších cest ve Floydově algoritmu
    terms: [matice předchůdců, rekonstrukce cesty, záporné váhy, záporný cyklus]
    statement: |
      Floydův algoritmus dává jen délky. Chceme-li i samotné cesty, vedeme spolu s $\mathbf{D}_k$ matici
      $\mathbf{N} = [n_{ij}]$, kde $n_{ij}$ je uzel, přes který naposledy došlo ke zlepšení: kdykoli
      ve $(*)$ platí $d^{k-1}_{ik} + d^{k-1}_{kj} < d^{k-1}_{ij}$, položíme $n_{ij} := k$. Cestu z $v_i$
      do $v_j$ pak rekurzivně složíme z cest $v_i \to v_{n_{ij}}$ a $v_{n_{ij}} \to v_j$
      (není-li $n_{ij}$ definováno, jde o přímou hranu). Složitost zůstává $O(n^3)$, paměť $O(n^2)$.

      Algoritmus funguje i se zápornými vahami, pokud graf neobsahuje cyklus záporné délky;
      takový cyklus se projeví zápornou hodnotou na diagonále $\mathbf{D}_n$.
    intuition: |
      Tato poznámka jde nad rámec skript (v TGD1 pracujeme s kladnými vahami), ale u ústní zkoušky
      se často objeví doplňující otázka „a jak najdeš samotnou cestu?“.
    related: [alg-floyd, thm-floyd]
    source: "doplněno (standardní rozšíření Floydova algoritmu)"
    supplemented: true

  # ------------------------------------------------------------------ 3.2
  - id: def-rozlozitelna-matice
    kind: definition
    label: "Definice 3.2"
    section: "3.2"
    title: Rozložitelná a nerozložitelná matice
    terms: [rozložitelná matice, nerozložitelná matice, reducible matrix, irreducible matrix, blokově trojúhelníkový tvar, reducibilita]
    statement: |
      Čtvercová matice $\mathbf{A}$ se nazývá **rozložitelná**, lze-li ji napsat ve tvaru
      $$
      \mathbf{A} = \begin{bmatrix} \mathbf{A}_{11} & \mathbf{A}_{12} \\ \mathbf{0} & \mathbf{A}_{22} \end{bmatrix},
      $$
      kde $\mathbf{A}_{11}$ a $\mathbf{A}_{22}$ jsou čtvercové matice řádu alespoň 1 a $\mathbf{0}$ je
      nulová matice, anebo lze-li ji do tohoto tvaru převést permutací řádků a **stejnou** permutací sloupců.

      Čtvercová matice, která není rozložitelná, se nazývá **nerozložitelná**.
    intuition: |
      Rozložitelnost je užitečná např. při řešení soustavy $\mathbf{A}\mathbf{x} = \mathbf{b}$: z druhého
      blokového řádku spočteme nejprve „spodní“ neznámé jen pomocí $\mathbf{A}_{22}$ a pak zbytek –
      velká úloha se rozpadne na menší. Rozhoduje jen rozmístění nul, ne konkrétní hodnoty.

      Hrubou silou bychom museli zkusit až $n!$ permutací. [Věta 3.2](#thm-rozlozitelnost-silna-souvislost)
      převádí test na hledání kvazikomponent grafu – polynomiálně.
    examples:
      - title: Rozložitelná matice
        body: |
          $$
          \begin{bmatrix} 3 & 10 & 4 & 8\\ 0 & 1 & 0 & 6\\ 2 & 5 & 2 & 1\\ 0 & 3 & 0 & 1 \end{bmatrix}
          \;\longrightarrow\;
          \begin{bmatrix} 3 & 4 & 10 & 8\\ 2 & 2 & 5 & 1\\ 0 & 0 & 1 & 6\\ 0 & 0 & 3 & 1 \end{bmatrix}
          $$
          Prohozením 2. a 3. řádku a zároveň 2. a 3. sloupce vznikne nulový blok $2 \times 2$ vlevo dole.
      - title: Nerozložitelná matice
        body: |
          $$
          \begin{bmatrix} 0 & 0 & 1 & 0\\ 0 & 0 & 0 & 3\\ 0 & 2 & 0 & 0\\ 4 & 0 & 0 & 0 \end{bmatrix}
          $$
          je nerozložitelná. Bez další teorie bychom to museli ověřit probráním všech permutací; pomocí
          [důsledku 3.1](#cor-nerozlozitelnost-diagram) stačí vidět, že její diagram je cyklus
          $1 \to 3 \to 2 \to 4 \to 1$, tedy silně souvislý graf.
    related: [rem-simultanni-permutace, thm-rozlozitelnost-silna-souvislost, cor-nerozlozitelnost-diagram, def-slabe-rozlozitelna]
    source: "skripta str. 13–14; přednáška 5, fólie 1"

  - id: rem-simultanni-permutace
    kind: remark
    section: "3.2"
    title: Simultánní permutace a permutační matice
    terms: [simultánní permutace, permutační matice, PAP^T, přečíslování uzlů]
    statement: |
      1. Ekvivalentně: $\mathbf{A}$ je rozložitelná, jestliže existuje permutační matice $\mathbf{P}$ taková, že
         $$
         \mathbf{P}\mathbf{A}\mathbf{P}^T = \begin{bmatrix} \mathbf{A}_{11} & \mathbf{A}_{12} \\ \mathbf{0} & \mathbf{A}_{22} \end{bmatrix}.
         $$
      2. Provádíme-li v matici permutaci řádků a stejnou permutaci sloupců, hovoříme o
         **simultánních permutacích**.
    intuition: |
      Násobení $\mathbf{P}$ zleva permutuje řádky, $\mathbf{P}^T$ zprava permutuje sloupce stejně.
      Je-li $\mathbf{A}$ matice (vážená matice sousednosti) grafu, simultánní permutace odpovídá jen
      **přečíslování uzlů** – graf zůstává stejný. Proto rozložitelnost je vlastnost grafu.
    related: [def-rozlozitelna-matice, def-slabe-rozlozitelna]
    source: "skripta str. 14; přednáška 5, fólie 1"

  - id: def-diagram-matice
    kind: definition
    section: "3.2"
    title: Diagram matice
    terms: [diagram matice, graf matice, "G(A)", orientovaný graf matice]
    statement: |
      Buď $\mathbf{A} = [a_{ij}]$ čtvercová matice řádu $n$. **Diagram** matice $\mathbf{A}$ je orientovaný
      graf $\vec{G}(\mathbf{A})$ s množinou uzlů $\{1, \dots, n\}$, v němž $(i,j)$ je hranou, právě když
      $a_{ij} \ne 0$ (nenulové diagonální prvky dávají smyčky; ty pro souvislostní vlastnosti nehrají roli).
    intuition: |
      Diagram je opak [vážené matice sousednosti](#def-matice-sousednosti-orientovaneho): z matice uděláme graf.
      Pro graf $\vec{G}$ bez smyček má $\mathbf{W}(\vec{G})$ diagram právě $\vec{G}$. Pojem známe z KMA/DMA;
      skripta jej v důsledku 3.1 používají bez nové definice.
    related: [def-matice-sousednosti-orientovaneho, cor-nerozlozitelnost-diagram, def-bigraf-matice]
    illustrations:
      - title: Nenulové prvky matice jako hrany
        property: strongly-connected
        graph:
          directed: true
          nodes:
            - { id: "1", x: 2, y: 2 }
            - { id: "3", x: 8, y: 2 }
            - { id: "2", x: 8, y: 8 }
            - { id: "4", x: 2, y: 8 }
          edges:
            - { from: "1", to: "3", w: 1 }
            - { from: "3", to: "2", w: 2 }
            - { from: "2", to: "4", w: 3 }
            - { from: "4", to: "1", w: 4 }
        steps:
          - caption: |
              Matice $\begin{bmatrix} 0 & 0 & 1 & 0\\ 0 & 0 & 0 & 3\\ 0 & 2 & 0 & 0\\ 4 & 0 & 0 & 0 \end{bmatrix}$ má nenulové
              prvky $a_{13}, a_{24}, a_{32}, a_{41}$ – každý dává hranu $i \to j$ (u hrany je hodnota prvku). Diagram je cyklus,
              tedy silně souvislý, a matice je **nerozložitelná**.
          - caption: |
              Položíme $a_{41} = 0$ – hrana $4 \to 1$ zmizí. Z uzlu $4$ teď nevede žádná hrana, řádek 4 je mimo diagonálu
              nulový a graf přestane být silně souvislý: matice je **rozložitelná** (uzel 4 dáme na konec).
            remove: [["4", "1"]]
          - caption: |
              Přidáme nenulový prvek $a_{21} = 5$. Vznikne cyklus $1 \to 3 \to 2 \to 1$, ale z uzlu $4$ se pořád nikam
              nedostaneme – dvě kvazikomponenty, matice zůstává rozložitelná.
            add: [["2", "1", 5]]
          - caption: |
              Teprve prvek $a_{42} = 6$ (hrana $4 \to 2$) uzel $4$ „napojí“ zpět. Diagram je silně souvislý a matice je
              opět nerozložitelná. Rozhodují jen polohy nul, ne konkrétní hodnoty.
            add: [["4", "2", 6]]
    source: "skripta str. 15 (pojem z KMA/DMA, zde zopakován)"
    supplemented: true

  - id: thm-rozlozitelnost-silna-souvislost
    kind: theorem
    label: "Věta 3.2"
    section: "3.2"
    title: Rozložitelnost matice a kvazikomponenty grafu
    terms: [věta 3.2, rozložitelnost a silná souvislost, horní blokově trojúhelníkový tvar, Frobeniův normální tvar, kvazikomponenty a matice]
    statement: |
      Buď $\vec{G}$ ohodnocený orientovaný graf. Platí:

      a) Je-li $\vec{G}$ silně souvislý, pak je matice $\mathbf{W}(\vec{G})$ nerozložitelná.

      b) Jsou-li $\vec{G}_1, \dots, \vec{G}_k$ kvazikomponenty grafu $\vec{G}$ očíslované tak, že v kondenzaci
      $\vec{G}_C$ jsou pouze hrany $(\vec{G}_k, \vec{G}_\ell)$ pro $k < \ell$, a očíslujeme-li uzly grafu
      $\vec{G}$ souhlasně s očíslováním kvazikomponent (tj. je-li $i \in \vec{G}_k$, $j \in \vec{G}_\ell$
      a $k < \ell$, pak $i < j$), pak má matice $\mathbf{W}(\vec{G})$ tvar
      $$
      \mathbf{W}(\vec{G}) = \begin{bmatrix}
      \mathbf{W}_{11} & \mathbf{W}_{12} & \mathbf{W}_{13} & \dots & \mathbf{W}_{1k}\\
      \mathbf{0} & \mathbf{W}_{22} & \mathbf{W}_{23} & \dots & \mathbf{W}_{2k}\\
      \mathbf{0} & \mathbf{0} & \mathbf{W}_{33} & \dots & \mathbf{W}_{3k}\\
      \vdots & & & \ddots & \vdots\\
      \mathbf{0} & \mathbf{0} & \mathbf{0} & \dots & \mathbf{W}_{kk}
      \end{bmatrix},
      $$
      kde $\mathbf{W}_{ii} = \mathbf{W}(\vec{G}_i)$, $i = 1, \dots, k$, a tyto matice jsou již nerozložitelné.
    intuition: |
      Nulový blok vlevo dole znamená: z uzlů „dole“ nevede žádná hrana do uzlů „nahoře“. To je přesně
      situace, kdy graf není silně souvislý – z některé části se nedá vrátit. Kvazikomponenty jsou
      maximální silně souvislé části, kondenzace je acyklická, a proto ji lze topologicky uspořádat
      (hrany jen „dopředu“). Toto uspořádání určí permutaci, která matici převede na horní blokově
      trojúhelníkový tvar s nerozložitelnými diagonálními bloky.
    proof: |
      **a)** Dokážeme obměnu: je-li $\mathbf{W}(\vec{G})$ rozložitelná, pak $\vec{G}$ není silně souvislý.
      Nechť má $\mathbf{W}(\vec{G})$ (po simultánní permutaci) tvar
      $\begin{bmatrix} \mathbf{A}_{11} & \mathbf{A}_{12} \\ \mathbf{0} & \mathbf{A}_{22} \end{bmatrix}$.
      Simultánní permutace řádků a sloupců odpovídá jen přečíslování uzlů grafu. Označme $U_1$, resp. $U_2$
      (obě neprázdné) množinu uzlů odpovídajících blokům $\mathbf{A}_{11}$, resp. $\mathbf{A}_{22}$. Nulový blok
      vlevo dole znamená $w_{ij} = 0$ pro $i \in U_2$, $j \in U_1$, tedy z žádného uzlu $U_2$ nevede hrana
      do $U_1$. Pak z $U_2$ nevede do $U_1$ ani žádná orientovaná cesta (cesta by musela někde poprvé
      přejít z $U_2$ do $U_1$, a to po hraně). Graf $\vec{G}$ tedy není silně souvislý.

      **b)** Kondenzace je acyklická, takže kvazikomponenty lze očíslovat požadovaným způsobem a uzly
      přečíslovat souhlasně. Mezi kvazikomponentami $\vec{G}_i$ a $\vec{G}_j$ s $i > j$ pak neexistuje
      hrana z $\vec{G}_i$ do $\vec{G}_j$ (dala by hranu $(\vec{G}_i, \vec{G}_j)$ kondenzace s $i > j$).
      Všechny bloky pod diagonálou jsou tedy nulové:
      $$
      \begin{array}{c|cccc}
       & \text{uzly } \vec{G}_1 & \text{uzly } \vec{G}_2 & \dots & \text{uzly } \vec{G}_k\\ \hline
      \text{uzly } \vec{G}_1 & \mathbf{W}(\vec{G}_1) & \mathbf{W}_{12} & \dots & \mathbf{W}_{1k}\\
      \text{uzly } \vec{G}_2 & \mathbf{0} & \mathbf{W}(\vec{G}_2) & \dots & \mathbf{W}_{2k}\\
      \vdots & \vdots & & \ddots & \vdots\\
      \text{uzly } \vec{G}_k & \mathbf{0} & \mathbf{0} & \dots & \mathbf{W}(\vec{G}_k)
      \end{array}
      $$
      Diagonální blok příslušný $\vec{G}_i$ obsahuje váhy hran mezi uzly $\vec{G}_i$, tj. je to
      $\mathbf{W}(\vec{G}_i)$. Každá kvazikomponenta je silně souvislý graf, a proto jsou podle již
      dokázané části a) všechny matice $\mathbf{W}(\vec{G}_i)$ nerozložitelné.
    proof_steps:
      - Část a) dokazujeme obměnou – z rozložitelného tvaru matice odvodíme, že graf není silně souvislý.
      - Simultánní permutace řádků a sloupců je jen přečíslování uzlů; bloky určují dvě neprázdné množiny uzlů $U_1$, $U_2$.
      - Nulový blok vlevo dole znamená, že z $U_2$ nevede hrana do $U_1$, a tedy ani orientovaná cesta – graf není silně souvislý.
      - Pro část b) očíslujeme kvazikomponenty podle topologického uspořádání acyklické kondenzace a uzly souhlasně s nimi.
      - Hrana z $\vec{G}_i$ do $\vec{G}_j$ s $i > j$ by dala „zpětnou“ hranu kondenzace, proto jsou všechny bloky pod diagonálou nulové.
      - Diagonální bloky jsou matice $\mathbf{W}(\vec{G}_i)$ silně souvislých kvazikomponent, podle a) tedy nerozložitelné.
    related: [def-rozlozitelna-matice, cor-nerozlozitelnost-diagram, alg-test-rozlozitelnosti, def-kvazikomponenta, def-kondenzace, def-silna-souvislost, def-matice-sousednosti-orientovaneho]
    illustrations:
      - title: Kvazikomponenty určují diagonální bloky
        property: strongly-connected
        graph:
          directed: true
          nodes:
            - { id: "1", x: 1, y: 2 }
            - { id: "4", x: 1, y: 8 }
            - { id: "5", x: 4, y: 5 }
            - { id: "3", x: 6, y: 1 }
            - { id: "2", x: 8.5, y: 4 }
            - { id: "6", x: 8.5, y: 8.5 }
          edges:
            - { from: "1", to: "2" }
            - { from: "1", to: "4" }
            - { from: "1", to: "5" }
            - { from: "2", to: "6" }
            - { from: "3", to: "2" }
            - { from: "4", to: "1" }
            - { from: "4", to: "5" }
            - { from: "5", to: "1" }
            - { from: "5", to: "2" }
            - { from: "5", to: "6" }
            - { from: "6", to: "2" }
        steps:
          - caption: |
              Diagram matice $6 \times 6$ z příkladu u testu rozložitelnosti. Má tři kvazikomponenty (barevně):
              $\{1,4,5\}$, $\{2,6\}$ a $\{3\}$. Graf není silně souvislý, matice je tedy rozložitelná.
          - caption: |
              Hrany **mezi** kvazikomponentami (zvýrazněné) vedou jen do $\{2,6\}$, nikdy zpět. V pořadí uzlů
              $4, 1, 5 \mid 3 \mid 2, 6$ proto všechny tyto hrany leží nad diagonálou a bloky pod diagonálou jsou nulové.
            witness: true
            edges: { 1-2: active, 5-2: active, 5-6: active, 3-2: active }
          - caption: |
              Přidáme nenulový prvek $a_{61}$ (hranu $6 \to 1$), který by v tomto pořadí ležel pod diagonálou. Kvazikomponenty
              $\{1,4,5\}$ a $\{2,6\}$ splynou. Do uzlu $3$ ale nic nevede, matice je pořád rozložitelná (dva bloky).
            add: [["6", "1"]]
          - caption: |
              Ještě hrana $2 \to 3$: teď se z každého uzlu dostaneme do každého, diagram je silně souvislý a matice je
              **nerozložitelná** – žádná simultánní permutace nulový blok nevytvoří.
            add: [["2", "3"]]
    source: "skripta str. 14–15; přednáška 5, fólie 2"

  - id: cor-nerozlozitelnost-diagram
    kind: corollary
    label: "Důsledek 3.1"
    section: "3.2"
    title: Nerozložitelnost a silná souvislost diagramu
    terms: [důsledek 3.1, nerozložitelnost a diagram, silně souvislý diagram, test nerozložitelnosti]
    statement: |
      Čtvercová matice $\mathbf{A}$ je nerozložitelná, právě když její diagram $\vec{G}(\mathbf{A})$ je silně souvislý.
    intuition: |
      Toto je pracovní podoba věty 3.2: místo hledání permutace (až $n!$ možností) stačí sestrojit
      diagram a ověřit silnou souvislost, např. dvojím prohledáním grafu – v čase $O(n^2)$.
    proof: |
      *Důkaz ve skriptech není (je uveden jen jako důsledek), doplněno.*

      Rozložitelnost závisí jen na tom, které prvky jsou nulové (permutace přesouvají prvky, ale nemění
      jejich hodnoty). Matice $\mathbf{A}$ má tedy stejné rozmístění nul jako vážená matice sousednosti
      $\mathbf{W}(\vec{G}(\mathbf{A}))$ diagramu (s váhami např. $|a_{ij}|$), a je rozložitelná, právě když je
      rozložitelná $\mathbf{W}(\vec{G}(\mathbf{A}))$. Smyčky (diagonální prvky) silnou souvislost neovlivňují
      a nulový blok mimo diagonálu nikdy neobsahují.

      * Je-li $\vec{G}(\mathbf{A})$ silně souvislý, je matice nerozložitelná podle věty 3.2 a).
      * Není-li $\vec{G}(\mathbf{A})$ silně souvislý, má alespoň dvě kvazikomponenty ($k \ge 2$) a podle
        věty 3.2 b) lze matici simultánní permutací převést na horní blokově trojúhelníkový tvar
        s $k \ge 2$ diagonálními bloky; sloučením bloků $\mathbf{W}_{22}, \dots, \mathbf{W}_{kk}$ do jednoho
        dostaneme tvar z definice rozložitelnosti, matice je tedy rozložitelná.
    proof_steps:
      - Rozložitelnost závisí jen na rozmístění nenulových prvků, takže $\mathbf{A}$ se chová stejně jako vážená matice sousednosti svého diagramu.
      - Je-li diagram silně souvislý, je matice nerozložitelná podle věty 3.2 a).
      - Není-li diagram silně souvislý, má alespoň dvě kvazikomponenty.
      - Podle věty 3.2 b) vznikne blokově trojúhelníkový tvar s alespoň dvěma diagonálními bloky; sloučením bloků dostaneme tvar z definice rozložitelnosti.
    examples:
      - title: Matice s diagramem tvaru cyklu
        body: |
          Diagram matice
          $\begin{bmatrix} 0 & 0 & 1 & 0\\ 0 & 0 & 0 & 3\\ 0 & 2 & 0 & 0\\ 4 & 0 & 0 & 0 \end{bmatrix}$
          má hrany $1 \to 3$, $2 \to 4$, $3 \to 2$, $4 \to 1$ – je to cyklus délky 4, silně souvislý graf.
          Matice je tedy nerozložitelná.
        graph:
          directed: true
          nodes:
            - { id: "1", x: 2, y: 2 }
            - { id: "3", x: 8, y: 2 }
            - { id: "2", x: 8, y: 8 }
            - { id: "4", x: 2, y: 8 }
          edges:
            - { from: "1", to: "3" }
            - { from: "3", to: "2" }
            - { from: "2", to: "4" }
            - { from: "4", to: "1" }
    related: [thm-rozlozitelnost-silna-souvislost, def-diagram-matice, def-rozlozitelna-matice, alg-test-rozlozitelnosti, def-silna-souvislost]
    source: "skripta str. 15; přednáška 5, fólie 2"

  - id: alg-test-rozlozitelnosti
    kind: algorithm
    section: "3.2"
    title: Test rozložitelnosti a převod na blokově trojúhelníkový tvar
    terms: [test rozložitelnosti matice, algoritmus rozložitelnosti, převod na horní blokově trojúhelníkový tvar, simultánní permutace, kvazikomponenty diagramu]
    statement: |
      Vstup: čtvercová matice $\mathbf{A}$ řádu $n$. Výstup: rozhodnutí, zda je $\mathbf{A}$ rozložitelná,
      a v kladném případě simultánní permutace převádějící $\mathbf{A}$ na horní blokově trojúhelníkový tvar
      s nerozložitelnými diagonálními bloky (podle [věty 3.2](#thm-rozlozitelnost-silna-souvislost)).
    pseudocode: |
      1. Sestroj diagram $\vec{G}(\mathbf{A})$: uzly $1, \dots, n$, hrana $(i,j)$ pro každé $a_{ij} \ne 0$, $i \ne j$.
      2. Najdi kvazikomponenty $\vec{G}_1, \dots, \vec{G}_k$ diagramu (např. prohledáváním do hloubky).
      3. Je-li $k = 1$, je diagram silně souvislý a $\mathbf{A}$ je **nerozložitelná** – konec.
      4. Jinak sestroj kondenzaci (acyklickou) a očísluj kvazikomponenty tak, aby všechny hrany kondenzace
         vedly z menšího čísla do většího (topologické uspořádání).
      5. Přečísluj uzly: nejprve uzly $\vec{G}_1$, pak uzly $\vec{G}_2$, …, nakonec uzly $\vec{G}_k$.
      6. Tutéž permutaci proveď na řádcích i sloupcích $\mathbf{A}$; vznikne horní blokově trojúhelníkový tvar
         a $\mathbf{A}$ je **rozložitelná**.
    complexity: |
      $O(n^2)$: sestrojení diagramu projde všech $n^2$ prvků; kvazikomponenty i topologické uspořádání
      kondenzace lze najít v čase $O(n + m) \subseteq O(n^2)$, kde $m \le n^2$ je počet nenulových prvků
      mimo diagonálu. Hrubá síla (zkoušení permutací) by potřebovala až $n!$ kroků.
    intuition: |
      Matice se „rozloží“ přesně podél kvazikomponent jejího diagramu. Počet diagonálních bloků ve
      výsledném tvaru je roven počtu kvazikomponent.
    examples:
      - title: Převod matice 6 × 6 na horní blokově trojúhelníkový tvar
        body: |
          $$
          \mathbf{A} = \begin{bmatrix}
          0 & 1 & 0 & 2 & 3 & 0\\
          0 & 0 & 0 & 0 & 0 & 4\\
          0 & 5 & 6 & 0 & 0 & 0\\
          7 & 0 & 0 & 0 & 8 & 0\\
          9 & 10 & 0 & 0 & 11 & 12\\
          0 & 13 & 0 & 0 & 0 & 14
          \end{bmatrix}
          $$
          Diagram (bez smyček) má hrany $1\to2$, $1\to4$, $1\to5$, $2\to6$, $3\to2$, $4\to1$, $4\to5$,
          $5\to1$, $5\to2$, $5\to6$, $6\to2$. Kvazikomponenty jsou $\{1,4,5\}$ (cykly $1\to4\to1$, $1\to5\to1$),
          $\{2,6\}$ a $\{3\}$. V kondenzaci vedou hrany $\{1,4,5\} \to \{2,6\}$ a $\{3\} \to \{2,6\}$,
          vyhovuje tedy pořadí $\{1,4,5\}, \{3\}, \{2,6\}$. Zvolíme nové pořadí uzlů $4, 1, 5, 3, 2, 6$
          a provedeme simultánní permutaci:
          $$
          \begin{bmatrix}
          0 & 7 & 8 & 0 & 0 & 0\\
          2 & 0 & 3 & 0 & 1 & 0\\
          0 & 9 & 11 & 0 & 10 & 12\\
          0 & 0 & 0 & 6 & 5 & 0\\
          0 & 0 & 0 & 0 & 0 & 4\\
          0 & 0 & 0 & 0 & 13 & 14
          \end{bmatrix}
          $$
          Diagonální bloky $3 \times 3$, $1 \times 1$ a $2 \times 2$ odpovídají kvazikomponentám a jsou nerozložitelné.
        graph:
          directed: true
          nodes:
            - { id: "1", x: 1, y: 2 }
            - { id: "4", x: 1, y: 8 }
            - { id: "5", x: 4, y: 5 }
            - { id: "3", x: 6, y: 1 }
            - { id: "2", x: 8, y: 4 }
            - { id: "6", x: 8, y: 8 }
          edges:
            - { from: "1", to: "2" }
            - { from: "1", to: "4" }
            - { from: "1", to: "5" }
            - { from: "2", to: "6" }
            - { from: "3", to: "2" }
            - { from: "4", to: "1" }
            - { from: "4", to: "5" }
            - { from: "5", to: "1" }
            - { from: "5", to: "2" }
