  - id: prop-parovani-a-tok
    kind: proposition
    section: "3.5"
    title: Celočíselný maximální tok určuje největší párování
    terms: [korektnost převodu párování na tok, párování a celočíselný tok, velikost párování = velikost toku]
    statement: |
      Nechť $\vec{G}$ je síť sestrojená z bigrafu $\vec{B}$ jako v [algoritmu](#alg-parovani-max-tok)
      (zdroj $z$, stok $s$, všechny propustnosti $1$). Pak
      1. každému párování $M$ v $\vec{B}$ odpovídá tok velikosti $|M|$,
      2. pro každý celočíselný tok $x$ tvoří hrany bigrafu s $x_{uv} = 1$ párování velikosti $|x|$.

      Speciálně hrany bigrafu s nenulovým tokem v celočíselném maximálním toku tvoří největší párování a
      $\nu(\vec{B})$ je rovno velikosti maximálního toku.
    intuition: |
      Párování a celočíselné toky jsou „totéž“ – jen jinak zapsané. Celočíselnost je nutná: neceločíselný
      maximální tok může rozdělit jednotku mezi více hran a párování by z něj přímo nevzniklo.
    proof: |
      *Ve skriptech je jen konstatováno, doplněno.*

      **1.** Pro každou hranu $(u,v) \in M$ pošleme jednotku po cestě $z \to u \to v \to s$. Protože hrany $M$
      nemají společné uzly, použije každá hrana sítě nejvýše jednu jednotku a propustnosti $1$ jsou dodrženy;
      v každém vnitřním uzlu je přítok roven odtoku. Vznikne tok velikosti $|M|$.

      **2.** Celočíselný tok s propustnostmi $1$ má na každé hraně hodnotu $0$ nebo $1$. Do uzlu $u \in U_1$
      vede jediná hrana $(z,u)$, takže přítok do $u$ je nejvýše $1$ a podle zákona zachování vychází z $u$
      tok $1$ nejvýše po jedné hraně bigrafu. Symetricky z uzlu $v \in U_2$ vede jediná hrana $(v,s)$, takže
      do $v$ přitéká tok $1$ nejvýše po jedné hraně. Hrany s $x_{uv} = 1$ proto nemají společné uzly – tvoří
      párování $M_x$. Podle [tvrzení 2.2](#prop-tok-a-rez) pro řez s $A = \{z\} \cup U_1$ je
      $|x| = x(A,\bar{A}) - x(\bar{A},A)$; hrany z $A$ do $\bar{A}$ jsou právě hrany bigrafu a z $\bar{A}$ do
      $A$ nevede žádná hrana, takže $|x| = |M_x|$.

      Podle [tvrzení 2.4](#prop-konecnost-ff) a jeho důkazu existuje celočíselný maximální tok a F–F algoritmus
      ho najde. Z 1. a 2. pak plyne, že největší párování má právě tolik hran, kolik je velikost maximálního toku.
    proof_steps:
      - Z párování $M$ sestrojíme tok tak, že po každé hraně $(u,v) \in M$ pošleme jednotku cestou $z \to u \to v \to s$.
      - Celočíselný tok s jednotkovými propustnostmi má na hranách jen hodnoty $0$ a $1$.
      - Do každého uzlu $U_1$ přitéká nejvýše 1 a z každého uzlu $U_2$ odtéká nejvýše 1, proto hrany bigrafu s tokem 1 nemají společné uzly – tvoří párování.
      - Tvrzení 2.2 pro řez $A = \{z\} \cup U_1$ dává, že velikost toku je rovna počtu hran tohoto párování.
      - Celočíselný maximální tok existuje (F–F s celočíselnými propustnostmi), takže maximální tok a největší párování mají stejnou velikost.
    related: [alg-parovani-max-tok, prop-tok-a-rez, prop-konecnost-ff, def-parovaci-cislo]
    source: "skripta str. 22 (konstatováno bez důkazu)"
    supplemented: false

quiz:
  - id: q-grafy-matice-01
    question: |
      Jaká je časová složitost Floydova algoritmu pro graf s $n$ uzly?
    options:
      - '$O(n^2)$'
      - '$O(n^3)$'
      - '$O(n^4)$'
      - '$O(2^n)$'
    correct: 1
    explanation: |
      Počítá se $n$ matic $\mathbf{D}_1, \dots, \mathbf{D}_n$, každá má $n^2$ prvků a každý prvek se spočte v konstantním čase:
      $n \cdot n^2 = n^3$. $O(n^4)$ je metoda opakovaného min-plus násobení cenové matice.
    related: [alg-floyd, thm-floyd]

  - id: q-grafy-matice-02
    question: |
      Co přesně vyjadřuje prvek $d^k_{ij}$ matice $\mathbf{D}_k$ ve Floydově algoritmu?
    options:
      - Délku nejkratší cesty z $v_i$ do $v_j$ s nejvýše $k$ hranami
      - Délku nejkratší cesty z $v_i$ do $v_j$, jejíž vnitřní uzly leží v $\{v_1, \dots, v_k\}$
      - Počet cest délky $k$ z $v_i$ do $v_j$
      - Délku nejkratší cesty z $v_i$ do $v_j$ procházející uzlem $v_k$
    correct: 1
    explanation: |
      To je invariant z důkazu věty 3.1. „Nejvýše $k$ hran“ popisuje min-plus mocninu $\mathbf{D}^{(k)}$, počet sledů délky $k$
      dává $k$-tá mocnina matice sousednosti.
    related: [thm-floyd, thm-minplus-mocniny-cenove-matice, thm-mocniny-matice-sousednosti]

  - id: q-grafy-matice-03
    question: |
      Ve Floydově algoritmu je $d^{k-1}_{ij} = 9$, $d^{k-1}_{ik} = 3$, $d^{k-1}_{kj} = 5$. Kolik je $d^k_{ij}$?
    options:
      - "9"
      - "8"
      - "5"
      - "3"
    correct: 1
    explanation: |
      $d^k_{ij} = \min\{d^{k-1}_{ij},\ d^{k-1}_{ik} + d^{k-1}_{kj}\} = \min\{9,\ 3 + 5\} = 8$ – obchvat přes uzel $v_k$ je kratší.
    related: [alg-floyd]

  - id: q-grafy-matice-04
    question: |
      Proč je ve Floydově algoritmu vnější cyklus přes $k$ (povolený mezilehlý uzel) a ne přes $i$ nebo $j$?
    options:
      - Kvůli úspoře paměti, na výsledku nezáleží
      - Protože invariant „vnitřní uzly z $\{v_1, \dots, v_k\}$“ vyžaduje mít hotovou celou matici $\mathbf{D}_{k-1}$ před výpočtem $\mathbf{D}_k$
      - Protože jinak by složitost byla $O(n^4)$
      - Protože algoritmus pracuje jen s acyklickými grafy
    correct: 1
    explanation: |
      Vzorec pro $d^k_{ij}$ používá hodnoty $d^{k-1}_{ik}$ a $d^{k-1}_{kj}$, které musí už odpovídat cestám přes $v_1, \dots, v_{k-1}$
      pro všechny dvojice. Při jiném pořadí cyklů by algoritmus obecně dával chybné výsledky (složitost by zůstala $O(n^3)$).
    related: [alg-floyd, thm-floyd]

  - id: q-grafy-matice-05
    question: |
      Jak jinak lze v čase $O(n^3)$ získat w-distanční matici grafu s kladnými vahami?
    options:
      - Jedním během prohledávání do šířky
      - $n$-krát spustit Dijkstrův algoritmus (pokaždé z jiného uzlu), každý běh $O(n^2)$
      - Spočítat $n$ min-plus mocnin cenové matice
      - Ford–Fulkersonovým algoritmem
    correct: 1
    explanation: |
      Dijkstra dá jeden řádek distanční matice v $O(n^2)$, $n$ běhů tedy $O(n^3)$. Min-plus mocniny stojí $O(n^4)$;
      BFS dá vzdálenosti jen v neohodnoceném grafu a jen z jednoho uzlu.
    related: [rem-floyd-dijkstra, thm-minplus-mocniny-cenove-matice]

  - id: q-grafy-matice-06
    question: |
      Kdy je čtvercová matice $\mathbf{A}$ nerozložitelná?
    options:
      - Když je regulární
      - Když její diagram $\vec{G}(\mathbf{A})$ je silně souvislý
      - Když její bigraf má perfektní párování
      - Když nemá žádný nulový prvek mimo diagonálu
    correct: 1
    explanation: |
      Důsledek 3.1. Regularita s rozložitelností nesouvisí (rozložitelná matice může být regulární a naopak).
      Perfektní párování v bigrafu souvisí s (generickou) regularitou, ne s rozložitelností.
    related: [cor-nerozlozitelnost-diagram, thm-rozlozitelnost-silna-souvislost]

  - id: q-grafy-matice-07
    question: |
      Diagram matice $\mathbf{A}$ řádu 8 má 3 kvazikomponenty. Kolik diagonálních bloků bude mít horní blokově
      trojúhelníkový tvar podle věty 3.2?
    options:
      - "1"
      - "2"
      - "3"
      - "8"
    correct: 2
    explanation: |
      Každý diagonální blok odpovídá jedné kvazikomponentě a je nerozložitelný. Bloky se uspořádají podle topologického
      uspořádání kondenzace.
    related: [thm-rozlozitelnost-silna-souvislost, alg-test-rozlozitelnosti]

  - id: q-grafy-matice-08
    question: |
      Jakou složitost má test rozložitelnosti matice řádu $n$ založený na větě 3.2?
    options:
      - '$O(n!)$ – je třeba vyzkoušet všechny permutace'
      - '$O(n^2)$ – sestrojení diagramu a nalezení kvazikomponent'
      - '$O(2^n)$ – je třeba projít všechny podmnožiny uzlů'
      - Problém je NP-úplný
    correct: 1
    explanation: |
      Diagram sestrojíme průchodem všech $n^2$ prvků a kvazikomponenty najdeme prohledáváním v $O(n + m) \subseteq O(n^2)$.
      Hrubá síla přes permutace ($n!$) je právě to, čemu věta 3.2 umožňuje se vyhnout.
    related: [alg-test-rozlozitelnosti]

  - id: q-grafy-matice-09
    question: |
      Které tvrzení o rozložitelnosti a slabé rozložitelnosti platí?
    options:
      - Každá slabě rozložitelná matice je rozložitelná
      - Každá rozložitelná matice je slabě rozložitelná, ale ne naopak
      - Pojmy jsou ekvivalentní
      - Pojmy spolu nesouvisí
    correct: 1
    explanation: |
      V definici slabé rozložitelnosti stačí volit $\mathbf{Q} = \mathbf{P}^T$. Protipříklad opaku: permutační matice s diagramem
      tvaru cyklu je nerozložitelná, ale prohozením sloupců vznikne nulový blok.
    related: [rem-slaba-rozlozitelnost, def-slabe-rozlozitelna]

  - id: q-grafy-matice-10
    question: |
      V bigrafu matice řádu 5 má množina řádků $V = \{1, 2, 4\}$ sousedy $W = \{2', 3', 4'\}$. Co z toho plyne?
    options:
      - Matice je rozložitelná
      - Matice je slabě rozložitelná
      - Matice je úplně nerozložitelná
      - Matice je regulární
    correct: 1
    explanation: |
      $|W| = 3 \le 3 = |V|$ a $\emptyset \ne V \ne U_1$, takže $V$ je stabilní množina a podle věty 3.3 je matice slabě rozložitelná.
      Rozložitelnost (simultánní permutace) z toho neplyne – rozhoduje o ní diagram.
    related: [thm-slaba-rozlozitelnost-stabilni-mnozina, def-stabilni-mnozina]

  - id: q-grafy-matice-11
    question: |
      Bigraf reálné matice $\mathbf{A}$ má perfektní párování. Co lze říci o $\mathbf{A}$?
    options:
      - '$\mathbf{A}$ je regulární'
      - '$\mathbf{A}$ je singulární'
      - 'Nic určitého o konkrétní matici – může být regulární i singulární'
      - '$\mathbf{A}$ je nerozložitelná'
    correct: 2
    explanation: |
      Věta 3.4 dává jen implikaci „regulární ⇒ perfektní párování“. Matice $\mathbf{A}_2$ ze skript má perfektní párování
      a je singulární, protože se členy determinantu vyrušily. Platí jen, že nějaká matice se stejným bigrafem je regulární.
    related: [thm-regularni-matice-parovani]

  - id: q-grafy-matice-12
    question: |
      Kdy je strukturální matice genericky regulární?
    options:
      - Když nemá na diagonále nuly
      - Když její bigraf má perfektní párování
      - Když její diagram je silně souvislý
      - Když má alespoň $n$ nenulových prvků
    correct: 1
    explanation: |
      Věta 3.5. Nenulová diagonála je jen speciální případ perfektního párování (identická permutace); $n$ nenulových prvků
      nestačí (mohou být v jednom sloupci). Silná souvislost diagramu odpovídá nerozložitelnosti.
    related: [thm-genericka-regularita-parovani]

  - id: q-grafy-matice-13
    question: |
      Největší párování v bigrafu strukturální matice $\mathbf{A}$ řádu 6 má 5 hran. Čemu se rovná $\operatorname{gh}(\mathbf{A})$
      a co to znamená?
    options:
      - '$\operatorname{gh}(\mathbf{A}) = 6$; matice je genericky regulární'
      - '$\operatorname{gh}(\mathbf{A}) = 5$; při náhodném dosazení má matice s pravděpodobností 1 hodnost 5'
      - '$\operatorname{gh}(\mathbf{A}) = 5$; matice má hodnost 5 pro každou volbu hodnot'
      - '$\operatorname{gh}(\mathbf{A}) = 1$'
    correct: 1
    explanation: |
      Věta 3.6: $\operatorname{gh}(\mathbf{A}) = \nu(\vec{B}(\mathbf{A})) = 5$. Pro speciální hodnoty může být hodnost i menší,
      proto „s pravděpodobností 1“, nikoli „vždy“.
    related: [thm-genericka-hodnost-parovaci-cislo, def-genericka-hodnost]

  - id: q-grafy-matice-14
    question: |
      Při hledání největšího párování převodem na maximální tok mají všechny hrany propustnost 1. Proč musí být
      nalezený maximální tok **celočíselný**?
    options:
      - Jinak by algoritmus neskončil
      - Jen z celočíselného toku (hodnoty 0/1) přímo vyčteme párování; neceločíselný tok může jednotku rozdělit mezi více hran
      - Protože Edmonds–Karpův algoritmus neceločíselné toky nepodporuje
      - Celočíselnost není potřeba
    correct: 1
    explanation: |
      Při hodnotách 0/1 projde každým řádkem i sloupcem nejvýše jedna hrana s tokem 1 – vznikne párování. F–F algoritmus
      s celočíselnými propustnostmi celočíselný maximální tok vždy najde (důkaz tvrzení 2.4).
    related: [prop-parovani-a-tok, alg-parovani-max-tok, prop-konecnost-ff]

  - id: q-grafy-matice-15
    question: |
      Jaká je složitost nalezení největšího párování v bigrafu s $n$ uzly a $m$ hranami převodem na tok
      (Ford–Fulkersonův algoritmus)?
    options:
      - 'Exponenciální, problém je NP-úplný'
      - '$O(n(n+m))$ – nejvýše $n$ iterací po $O(n+m)$'
      - '$O(n!)$ – probrání všech přiřazení'
      - '$O(1)$'
    correct: 1
    explanation: |
      Velikost toku (= velikost párování) je nejvýše $|U_1| \le n$ a každá iterace zvětší tok o 1; nalezení rezervní polocesty
      prohledáním stojí $O(n + m)$. Úloha je tedy polynomiální – na rozdíl např. od hledání hamiltonovské kružnice.
    related: [alg-parovani-max-tok]
