  - id: def-genericka-hodnost
    kind: definition
    section: "3.5"
    title: Generická hodnost
    terms: [generická hodnost, generic rank, "gh(A)", strukturální hodnost, term rank]
    statement: |
      Nechť $\mathbf{A}$ je strukturální matice. Největší přirozené číslo $k$, pro které v matici $\mathbf{A}$
      existuje genericky regulární podmatice řádu $k$, se nazývá **generická hodnost** matice $\mathbf{A}$
      a značí se $\operatorname{gh}(\mathbf{A})$.
    intuition: |
      Z lineární algebry víme, že hodnost reálné matice je rovna řádu její největší regulární (čtvercové)
      podmatice. Generická hodnost přenáší tuto charakterizaci na strukturální matice: je to hodnost,
      kterou matice má s pravděpodobností 1 při náhodném dosazení nenulových prvků.
    related: [def-genericky-regularni, def-parovaci-cislo, thm-genericka-hodnost-parovaci-cislo]
    source: "skripta str. 22; přednáška 5, fólie 7"

  - id: def-parovaci-cislo
    kind: definition
    section: "3.5"
    title: Párovací číslo
    terms: [párovací číslo, matching number, největší párování, maximum matching, "ν(B)", nu]
    statement: |
      Počet hran největšího párování v bigrafu $\vec{B}$ se nazývá **párovací číslo** bigrafu $\vec{B}$
      a značí se $\nu(\vec{B})$.
    intuition: |
      Bigraf má perfektní párování, právě když $\nu(\vec{B}) = |U_1| = |U_2|$. Párovací číslo umíme spočítat
      polynomiálně ([převodem na maximální tok](#alg-parovani-max-tok)).
    related: [def-parovani, thm-genericka-hodnost-parovaci-cislo, alg-parovani-max-tok]
    source: "skripta str. 22; přednáška 5, fólie 7"

  - id: thm-genericka-hodnost-parovaci-cislo
    kind: theorem
    label: "Věta 3.6"
    section: "3.5"
    title: Generická hodnost je rovna párovacímu číslu
    terms: [věta 3.6, generická hodnost a párovací číslo, gh(A) = ν(B(A)), výpočet generické hodnosti]
    statement: |
      Nechť $\mathbf{A}$ je strukturální matice. Pak $\operatorname{gh}(\mathbf{A}) = \nu(\vec{B}(\mathbf{A}))$.
    intuition: |
      Generická hodnost (algebraický pojem) se dá spočítat čistě kombinatoricky – jako velikost největšího
      párování v bigrafu. To je polynomiální úloha, takže generickou hodnost spočteme v polynomiálním čase
      bez symbolického počítání determinantů všech podmatic.
    proof: |
      *Ve skriptech je důkaz jen naznačen („aplikací věty 3.5 na největší genericky regulární podmatici“), doplněno.*

      Podmatice $\mathbf{A}[I,J]$ s řádky $I$ a sloupci $J$ ($|I| = |J| = k$) je opět strukturální matice a její
      bigraf je podbigraf $\vec{B}(\mathbf{A})$ indukovaný množinou uzlů $I \cup J$.

      ($\le$) Nechť $k = \operatorname{gh}(\mathbf{A})$ a $\mathbf{A}[I,J]$ je genericky regulární podmatice
      řádu $k$. Podle [věty 3.5](#thm-genericka-regularita-parovani) má její bigraf perfektní párování, tj. $k$
      hran bez společných uzlů. To je párování v $\vec{B}(\mathbf{A})$ velikosti $k$, tedy
      $\nu(\vec{B}(\mathbf{A})) \ge k$.

      ($\ge$) Nechť $M$ je největší párování v $\vec{B}(\mathbf{A})$ s $\nu$ hranami, $I$ množina jejich
      počátků (řádků) a $J$ množina konců (sloupců), $|I| = |J| = \nu$. Bigraf podmatice $\mathbf{A}[I,J]$
      obsahuje všechny hrany $M$, které v něm tvoří perfektní párování. Podle věty 3.5 je $\mathbf{A}[I,J]$
      genericky regulární, takže $\operatorname{gh}(\mathbf{A}) \ge \nu$.
    proof_steps:
      - Bigraf podmatice $\mathbf{A}[I,J]$ je podbigraf $\vec{B}(\mathbf{A})$ indukovaný řádky $I$ a sloupci $J$.
      - Genericky regulární podmatice řádu $\operatorname{gh}(\mathbf{A})$ má podle věty 3.5 perfektní párování, a to je párování v $\vec{B}(\mathbf{A})$; tedy $\nu \ge \operatorname{gh}$.
      - Z největšího párování vezmeme jeho řádky $I$ a sloupce $J$; podmatice $\mathbf{A}[I,J]$ má v bigrafu perfektní párování.
      - Podle věty 3.5 je tato podmatice genericky regulární, tedy $\operatorname{gh} \ge \nu$, a obě čísla jsou si rovna.
    examples:
      - title: Generická hodnost matice 6 × 6
        body: |
          Pro genericky singulární matici z [příkladu u věty 3.5](#thm-genericka-regularita-parovani) najdeme
          párování velikosti 5, např. $2 \to 1'$, $3 \to 2'$, $4 \to 3'$, $6 \to 4'$, $5 \to 6'$. Větší párování
          neexistuje (perfektní by mělo 6 hran). Tedy $\operatorname{gh}(\mathbf{A}) = \nu(\vec{B}(\mathbf{A})) = 5$:
          při „náhodném“ dosazení nenulových prvků má výsledná reálná matice s pravděpodobností 1 hodnost 5.
    related: [def-genericka-hodnost, def-parovaci-cislo, thm-genericka-regularita-parovani, alg-parovani-max-tok]
    illustrations:
      - title: Největší párování vybere největší regulární podmatici
        for: proof
        property: matching
        graph:
          directed: true
          nodes:
            - { id: r1, x: 2, y: 1 }
            - { id: r2, x: 2, y: 3.7 }
            - { id: r3, x: 2, y: 6.3 }
            - { id: r4, x: 2, y: 9 }
            - { id: s1, x: 8, y: 1 }
            - { id: s2, x: 8, y: 3.7 }
            - { id: s3, x: 8, y: 6.3 }
            - { id: s4, x: 8, y: 9 }
          edges:
            - { from: r1, to: s1 }
            - { from: r1, to: s2 }
            - { from: r2, to: s1 }
            - { from: r3, to: s1 }
            - { from: r3, to: s2 }
            - { from: r4, to: s2 }
            - { from: r4, to: s3 }
            - { from: r4, to: s4 }
        steps:
          - caption: |
              Strukturální matice
              $\begin{bmatrix} \times & \times & 0 & 0\\ \times & 0 & 0 & 0\\ \times & \times & 0 & 0\\ 0 & \times & \times & \times \end{bmatrix}$
              a její největší párování se 3 hranami: $\nu(\vec{B}(\mathbf{A})) = 3$.
            edge_set: [r1-s1, r3-s2, r4-s3]
          - caption: |
              ($\ge$) Řádky $I = \{1, 3, 4\}$ a sloupce $J = \{1, 2, 3\}$ párování (modře) určují podmatici
              $\mathbf{A}[I,J]$ řádu 3. Párování je v jejím bigrafu perfektní, takže je podle věty 3.5 genericky
              regulární: $\operatorname{gh}(\mathbf{A}) \ge 3$.
            edge_set: [r1-s1, r3-s2, r4-s3]
            witness: true
            nodes: { r1: done, r3: done, r4: done, s1: done, s2: done, s3: done }
          - caption: |
              ($\le$) Genericky regulární podmatice řádu 4 by byla celá matice a dala by perfektní párování se 4 hranami.
              Každý pokus selže – $r_1, r_2, r_3$ mají jen dva sloupce. Tedy $\operatorname{gh}(\mathbf{A}) = \nu = 3$.
            edge_set: [r1-s1, r2-s1, r3-s2, r4-s3]
    source: "skripta str. 22; přednáška 5, fólie 7"

  - id: alg-parovani-max-tok
    kind: algorithm
    section: "3.5"
    title: Největší párování v bigrafu převodem na maximální tok
    terms: [největší párování, maximum bipartite matching, párování pomocí toku, převod párování na tok, výpočet párovacího čísla, výpočet generické hodnosti]
    statement: |
      Vstup: bigraf $\vec{B}$ s $U(\vec{B}) = U_1 \cup U_2$. Výstup: největší párování v $\vec{B}$
      (a tedy $\nu(\vec{B})$, resp. generická hodnost strukturální matice).

      K bigrafu sestrojíme síť s jedním zdrojem a jedním stokem a najdeme v ní celočíselný maximální tok;
      hrany bigrafu s nenulovým tokem tvoří největší párování (viz [tvrzení](#prop-parovani-a-tok)).
    pseudocode: |
      1. K $\vec{B}$ přidej nový uzel $z$ (zdroj) a nový uzel $s$ (stok).
      2. Přidej hrany $(z,u)$ pro všechny $u \in U_1$ a hrany $(v,s)$ pro všechny $v \in U_2$.
      3. Propustnosti všech hran (nových i hran bigrafu) polož rovny $1$.
      4. Najdi celočíselný maximální tok $x$ ze $z$ do $s$ (Ford–Fulkersonovým nebo Edmonds–Karpovým
         algoritmem – začínají nulovým tokem a s celočíselnými propustnostmi dávají celočíselný tok).
      5. Hrany bigrafu $\vec{B}$ s $x_{uv} = 1$ tvoří největší párování; $\nu(\vec{B}) = |x|$.
    complexity: |
      Polynomiální. Velikost toku je nejvýše $|U_1| \le n$, takže F–F algoritmus provede nejvýše $n$ iterací,
      každou (hledání rezervní polocesty prohledáváním) v čase $O(n + m)$ – celkem $O(n(n+m))$, kde $n$ je
      počet uzlů a $m$ počet hran bigrafu. (*Doplněno mimo skripta:* Hopcroftův–Karpův algoritmus dosahuje
      $O(\sqrt{n}\, m)$.)
    intuition: |
      Jednotkové propustnosti hran $(z,u)$ zaručí, že každým řádkem proteče nejvýš jedna jednotka, takže
      z něj vede tok nejvýš jednou hranou; jednotkové propustnosti hran $(v,s)$ totéž pro sloupce.
      Celočíselný tok tedy „vybere“ hrany bez společných uzlů. Rezervní polocesty ve F–F algoritmu odpovídají
      tzv. alternujícím cestám – nesouhlasná hrana znamená „přesuň dosavadní dvojici jinam“.
      Konstrukce je stejná jako [přidání fiktivního zdroje a stoku](#rem-fiktivni-zdroj-stok) v důkazu věty 2.1.
    examples:
      - title: Párování v bigrafu matice A₁
        body: |
          Pro bigraf matice $\mathbf{A}_1$ z [příkladu u věty 3.4](#thm-regularni-matice-parovani)
          (hrany $1\to1'$, $2\to1'$, $3\to1'$, $3\to2'$, $3\to3'$) najde algoritmus tok velikosti 2, např. po
          cestách $z\,1\,1'\,s$ a $z\,3\,2'\,s$. Řez $(\{z, 1, 2, 1'\}, \text{zbytek})$ obsahuje hrany $(z,3)$ a
          $(1',s)$ s propustností 2, takže tok je maximální: $\nu = 2 < 3$ a perfektní párování neexistuje.
        graph:
          directed: true
          nodes:
            - { id: z, x: 0, y: 5 }
            - { id: "1", x: 3, y: 2 }
            - { id: "2", x: 3, y: 5 }
            - { id: "3", x: 3, y: 8 }
            - { id: "1'", x: 7, y: 2 }
            - { id: "2'", x: 7, y: 5 }
            - { id: "3'", x: 7, y: 8 }
            - { id: s, x: 10, y: 5 }
          edges:
            - { from: z, to: "1", w: 1, x: 1 }
            - { from: z, to: "2", w: 1, x: 0 }
            - { from: z, to: "3", w: 1, x: 1 }
            - { from: "1", to: "1'", w: 1, x: 1 }
            - { from: "2", to: "1'", w: 1, x: 0 }
            - { from: "3", to: "1'", w: 1, x: 0 }
            - { from: "3", to: "2'", w: 1, x: 1 }
            - { from: "3", to: "3'", w: 1, x: 0 }
            - { from: "1'", to: s, w: 1, x: 1 }
            - { from: "2'", to: s, w: 1, x: 1 }
            - { from: "3'", to: s, w: 1, x: 0 }
    visualization: bipartite-matching
    related: [prop-parovani-a-tok, def-parovaci-cislo, alg-ford-fulkerson, alg-edmonds-karp, prop-konecnost-ff, rem-fiktivni-zdroj-stok, thm-genericka-hodnost-parovaci-cislo]
    illustrations:
