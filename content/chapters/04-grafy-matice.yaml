id: grafy-matice
number: 4
title: Grafy a matice
source: "TGD1 skripta kap. 3 (str. 12–22); přednáška 3 (ohodnocené grafy, Floydův algoritmus) a přednáška 5"
exam_questions: [2, 4, 5]
summary: |
  Kapitola propojuje grafové pojmy s lineární algebrou. Nejprve počítáme w-distanční matici
  orientovaného grafu (min-plus mocniny v $O(n^4)$, Floydův algoritmus v $O(n^3)$). Pak ukazujeme,
  že rozložitelnost matice je totéž co nesouvislost (ve smyslu silné souvislosti) jejího diagramu
  a slabá rozložitelnost totéž co existence stabilní množiny v bigrafu matice. Nakonec spojujeme
  regularitu matice s perfektním párováním v bigrafu: strukturální matice je genericky regulární,
  právě když její bigraf má perfektní párování, a generická hodnost je rovna párovacímu číslu –
  které spočítáme polynomiálně převodem na maximální tok.
sections:
  - number: "3.1"
    title: Distanční matice ohodnoceného orientovaného grafu a Floydův algoritmus
  - number: "3.2"
    title: Rozložitelnost matic a struktura orientovaných grafů
  - number: "3.3"
    title: Slabě rozložitelné matice
  - number: "3.4"
    title: Regulární matice a perfektní párování v bigrafu
  - number: "3.5"
    title: Strukturální matice a generická hodnost
items:
  # ------------------------------------------------------------------ 3.1
  - id: def-w-distancni-matice
    kind: definition
    label: "Definice 3.1"
    section: "3.1"
    title: w-distanční matice, distanční matice
    terms: [distanční matice, w-distanční matice, matice vzdáleností, matice vážených vzdáleností, matice w-vzdáleností, distance matrix, all-pairs shortest paths]
    statement: |
      Nechť $\vec{G}$ je orientovaný ohodnocený graf s množinou uzlů $U(\vec{G}) = \{v_1, \dots, v_n\}$
      a ohodnocením $w : H(\vec{G}) \to (0,\infty)$. Matice
      $\mathbf{D}^w(\vec{G}) = [d^w_{ij}]_{i,j=1}^n$, kde
      $$
      d^w_{ij} = d^w(v_i, v_j), \qquad i,j = 1, \dots, n,
      $$
      se nazývá **w-distanční matice** grafu $\vec{G}$ (v jiných textech „matice vážených vzdáleností“);
      $d^w(v_i, v_j)$ je [w-vzdálenost](#def-w-vzdalenost-orientovana) uzlů $v_i$, $v_j$.
      Analogicky $\mathbf{D}(\vec{G}) = [d_{ij}]$ s $d_{ij} = d_{\vec{G}}(v_i, v_j)$ je **distanční matice**.
    intuition: |
      Distanční matice odpovídá na otázku „jak daleko je to z každého uzlu do každého“
      (*all-pairs shortest paths*). Na diagonále jsou nuly, kde cesta neexistuje, je $\infty$.
      V orientovaném grafu není obecně symetrická (v příkladu u [Floydova algoritmu](#alg-floyd) je
      $d^w(u_1,u_4) = 14$, ale $d^w(u_4,u_1) = 6$).

      Algoritmy a jejich složitost:
      * [mocniny matice sousednosti](#cor-distancni-matice-mocniny) (jen $\mathbf{D}(\vec{G})$) a
        [min-plus mocniny cenové matice](#thm-minplus-mocniny-cenove-matice) – $O(n^4)$,
      * $n$-krát [Dijkstrův algoritmus](#alg-dijkstra) – $O(n^3)$,
      * [Floydův algoritmus](#alg-floyd) – $O(n^3)$, nejjednodušší na implementaci.
    related: [def-w-vzdalenost-orientovana, alg-floyd, thm-floyd, thm-minplus-mocniny-cenove-matice, cor-distancni-matice-mocniny, alg-dijkstra, rem-distancni-matice]
    source: "skripta str. 12; přednáška 3, fólie 2"

  - id: alg-floyd
    kind: algorithm
    label: "Algoritmus 3.1"
    section: "3.1"
    title: Floydův algoritmus
    terms: [Floydův algoritmus, Floyd-Warshall, Floydův–Warshallův algoritmus, výpočet distanční matice, all-pairs shortest paths, nejkratší cesty mezi všemi dvojicemi]
    statement: |
      Vstup: orientovaný graf $\vec{G}$ s uzly $v_1, \dots, v_n$ a ohodnocením $w : H(\vec{G}) \to (0,\infty)$.
      Výstup: w-distanční matice $\mathbf{D}^w(\vec{G})$.

      Algoritmus postupně připouští uzly $v_1, v_2, \dots, v_n$ jako možné vnitřní uzly cest a
      po každém kroku aktualizuje matici vzdáleností.
    pseudocode: |
      1. Polož $\mathbf{D}_0 = [d^0_{ij}]_{i,j=1}^n$ (tj. cenovou matici $\mathbf{C}(\vec{G})$), kde
         $$
         d^0_{ij} = \begin{cases}
           0 & \text{pro } i = j,\\
           w_{ij} & \text{pro } i \ne j,\ (i,j) \in H(\vec{G}),\\
           \infty & \text{pro } i \ne j,\ (i,j) \notin H(\vec{G}).
         \end{cases}
         $$
      2. Pro $k = 1, \dots, n$ postupně vypočti $\mathbf{D}_k = [d^k_{ij}]_{i,j=1}^n$, kde
         $$
         d^k_{ij} = \min\{ d^{k-1}_{ij},\ d^{k-1}_{ik} + d^{k-1}_{kj} \}. \qquad (*)
         $$
      3. $\mathbf{D}_n = \mathbf{D}^w(\vec{G})$.
    complexity: |
      $O(n^3)$: počítáme $n$ matic $\mathbf{D}_1, \dots, \mathbf{D}_n$ řádu $n$, každý prvek podle $(*)$
      v konstantním čase (nezávisle na $n$). Celkem $n \cdot n^2$ elementárních kroků.
      Paměť stačí $O(n^2)$ – matici lze přepisovat na místě, protože řádek a sloupec $k$ se
      v $k$-tém kroku nemění ($d^k_{ik} = d^{k-1}_{ik}$, neboť $d_{kk} = 0$).
    intuition: |
      Invariant: $d^k_{ij}$ je délka nejkratší cesty z $v_i$ do $v_j$, jejíž **vnitřní** uzly leží
      v $\{v_1, \dots, v_k\}$. Při přidání uzlu $v_k$ se buď nejkratší cesta nezmění (neprochází $v_k$),
      nebo prochází $v_k$ – a pak je složena z nejkratší cesty $v_i \to v_k$ a nejkratší cesty
      $v_k \to v_j$, obou jen přes $v_1, \dots, v_{k-1}$. To je princip dynamického programování.

      **Typická chyba:** zaměnit pořadí cyklů – vnější cyklus musí být přes $k$ (povolený mezilehlý uzel),
      vnitřní přes $i, j$.
    examples:
      - title: Floydův algoritmus na grafu s pěti uzly (příklad ze skript)
        body: |
          Hrany a váhy: $(u_1,u_2)$: 4, $(u_2,u_3)$: 3, $(u_2,u_5)$: 8, $(u_3,u_5)$: 4, $(u_4,u_1)$: 7,
          $(u_4,u_5)$: 3, $(u_5,u_1)$: 3, $(u_5,u_2)$: 8, $(u_5,u_4)$: 3.
          $$
          \mathbf{D}_0 = \begin{bmatrix}
          0 & 4 & \infty & \infty & \infty\\
          \infty & 0 & 3 & \infty & 8\\
          \infty & \infty & 0 & \infty & 4\\
          7 & \infty & \infty & 0 & 3\\
          3 & 8 & \infty & 3 & 0
          \end{bmatrix},\qquad
          \mathbf{D}_1 = \begin{bmatrix}
          0 & 4 & \infty & \infty & \infty\\
          \infty & 0 & 3 & \infty & 8\\
          \infty & \infty & 0 & \infty & 4\\
          7 & 11 & \infty & 0 & 3\\
          3 & 7 & \infty & 3 & 0
          \end{bmatrix}
          $$
          ($k = 1$: přes $u_1$ se zkrátí $u_4 \to u_2$ na $7 + 4 = 11$ a $u_5 \to u_2$ na $3 + 4 = 7$.)
          $$
          \mathbf{D}_2 = \begin{bmatrix}
          0 & 4 & 7 & \infty & 12\\
          \infty & 0 & 3 & \infty & 8\\
          \infty & \infty & 0 & \infty & 4\\
          7 & 11 & 14 & 0 & 3\\
          3 & 7 & 10 & 3 & 0
          \end{bmatrix},\qquad
          \mathbf{D}_3 = \begin{bmatrix}
          0 & 4 & 7 & \infty & 11\\
          \infty & 0 & 3 & \infty & 7\\
          \infty & \infty & 0 & \infty & 4\\
          7 & 11 & 14 & 0 & 3\\
          3 & 7 & 10 & 3 & 0
          \end{bmatrix}
          $$
          ($k = 3$: např. $d_{15}$: $\min\{12,\ 7 + 4\} = 11$, $d_{25}$: $\min\{8,\ 3 + 4\} = 7$.)
          Krok $k = 4$ nic nezmění, protože do $u_4$ vede konečná vzdálenost jen z $u_5$ a obchvat přes
          $u_4$ nic nezkrátí: $\mathbf{D}_4 = \mathbf{D}_3$. Konečně
          $$
          \mathbf{D}_5 = \mathbf{D}^w(\vec{G}) = \begin{bmatrix}
          0 & 4 & 7 & 14 & 11\\
          10 & 0 & 3 & 10 & 7\\
          7 & 11 & 0 & 7 & 4\\
          6 & 10 & 13 & 0 & 3\\
          3 & 7 & 10 & 3 & 0
          \end{bmatrix}.
          $$
          ($k = 5$: např. $d_{41} = \min\{7,\ 3 + 3\} = 6$, $d_{14} = \min\{\infty,\ 11 + 3\} = 14$.)
        graph:
          directed: true
          nodes:
            - { id: u1, x: 5, y: 1 }
            - { id: u2, x: 1, y: 4 }
            - { id: u3, x: 3, y: 8 }
            - { id: u4, x: 7, y: 8 }
            - { id: u5, x: 9, y: 4 }
          edges:
            - { from: u1, to: u2, w: 4 }
            - { from: u2, to: u3, w: 3 }
            - { from: u2, to: u5, w: 8 }
            - { from: u3, to: u5, w: 4 }
            - { from: u4, to: u1, w: 7 }
            - { from: u4, to: u5, w: 3 }
            - { from: u5, to: u1, w: 3 }
            - { from: u5, to: u2, w: 8 }
            - { from: u5, to: u4, w: 3 }
    visualization: floyd
    related: [thm-floyd, def-w-distancni-matice, thm-minplus-mocniny-cenove-matice, rem-floyd-dijkstra, rem-floyd-rekonstrukce-cest, rem-floyd-odkaz]
    illustrations:
      - title: Řádek u₄ distanční matice krok za krokem
        graph:
          directed: true
          nodes:
            - { id: u1, x: 5, y: 1 }
            - { id: u2, x: 1, y: 4 }
            - { id: u3, x: 3, y: 8.5 }
            - { id: u4, x: 7, y: 8.5 }
            - { id: u5, x: 9, y: 4 }
          edges:
            - { from: u1, to: u2, w: 4 }
            - { from: u2, to: u3, w: 3 }
            - { from: u2, to: u5, w: 8 }
            - { from: u3, to: u5, w: 4 }
            - { from: u4, to: u1, w: 7 }
            - { from: u4, to: u5, w: 3 }
            - { from: u5, to: u1, w: 3 }
            - { from: u5, to: u2, w: 8 }
            - { from: u5, to: u4, w: 3 }
        steps:
          - caption: |
              Sledujeme řádek $d_{4j}$ (vzdálenosti z $u_4$, pod uzly). V $\mathbf{D}_0$ jsou jen přímé hrany:
              do $u_1$ je to $7$, do $u_5$ je to $3$, jinam $\infty$ – žádný vnitřní uzel zatím není povolen.
            nodes: { u4: source }
            edges: { u4-u1: active, u4-u5: active }
            labels: { u1: "d=7", u2: "d=∞", u3: "d=∞", u4: "d=0", u5: "d=3" }
          - caption: |
              $k = 1$: povolíme $u_1$ jako vnitřní uzel. $d^1_{42} = \min\{\infty,\ d^0_{41} + d^0_{12}\} = 7 + 4 = 11$ –
              cesta $u_4 \to u_1 \to u_2$.
            nodes: { u4: source, u1: active }
            edges: { u4-u1: path, u1-u2: path }
            labels: { u1: "d=7", u2: "d=11", u3: "d=∞", u4: "d=0", u5: "d=3" }
          - caption: |
              $k = 2$: přes $u_2$ se zkrátí $d^2_{43} = d^1_{42} + d^1_{23} = 11 + 3 = 14$. Do $u_5$ přes $u_2$ by to bylo
              $11 + 8 = 19 > 3$, tam se nic nemění.
            nodes: { u4: source, u2: active }
            edges: { u4-u1: path, u1-u2: path, u2-u3: path }
            labels: { u1: "d=7", u2: "d=11", u3: "d=14", u4: "d=0", u5: "d=3" }
          - caption: |
              $k = 3$ a $k = 4$: řádek $u_4$ se nezmění (např. $d_{43} + d_{35} = 14 + 4 = 18 > 3$). Hodnota $d^k_{ij}$
              je délka nejkratší cesty **jen přes** $u_1, \dots, u_k$ – nejkratší cesty přes $u_5$ zatím nevidíme.
            nodes: { u4: source, u3: active }
            labels: { u1: "d=7", u2: "d=11", u3: "d=14", u4: "d=0", u5: "d=3" }
          - caption: |
              $k = 5$: přes $u_5$ se zkrátí všechno ostatní: $d_{41} = \min\{7,\ 3 + 3\} = 6$, $d_{42} = \min\{11,\ 3 + 7\} = 10$,
              $d_{43} = \min\{14,\ 3 + 10\} = 13$. Úsek $u_5 \to u_3$ délky $10$ už je hotový z dřívějších kroků.
