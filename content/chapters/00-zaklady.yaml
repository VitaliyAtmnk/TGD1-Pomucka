  - id: def-souvisly-graf
    kind: definition
    label: Definice
    section: "0.3"
    title: Souvislý graf
    terms: [souvislý graf, souvislost, nesouvislý graf]
    statement: |
      Řekneme, že graf $G$ je **souvislý**, jestliže pro každé $u, v \in U(G)$ existuje v $G$ sled z $u$ do $v$.
    intuition: |
      Z každého uzlu se dá „dojít" do každého. Definice používá sled, protože se s ním snadno
      pracuje (sledy lze skládat za sebou); [větička](#prop-souvislost-cesta) ukazuje, že
      ekvivalentně lze požadovat cestu.
    related: [prop-souvislost-cesta, def-komponenta, prop-souvislost-min-stupen]
    source: "přednáška 1, folie 9"
    supplemented: false

  - id: prop-souvislost-cesta
    kind: proposition
    label: Větička
    section: "0.3"
    title: Souvislost pomocí cest
    terms: [souvislost, sled obsahuje cestu, nejkratší sled]
    statement: |
      Graf $G$ je souvislý, právě když pro každé $u, v \in U(G)$ existuje v $G$ cesta z $u$ do $v$.
    intuition: |
      Klíčové pozorování: **z každého sledu lze „vystřihnout" cestu** se stejnými konci –
      kdykoli se nějaký uzel zopakuje, vynecháme úsek mezi jeho dvěma výskyty (smyčku procházky).
      Nejkratší sled z $u$ do $v$ je proto vždy cesta.
    proof: |
      *Důkaz není ve foliích, doplněno.*

      **(⇐)** Každá cesta je sled, takže existence cest dává existenci sledů.

      **(⇒)** Nechť $u, v \in U(G)$. Ze souvislosti existuje sled z $u$ do $v$; zvolme mezi všemi
      takovými sledy sled $u = x_0, x_1, \dots, x_k = v$ **nejmenší délky** $k$. Kdyby se v něm nějaký uzel
      opakoval, tj. $x_i = x_j$ pro $i < j$, pak $x_0, \dots, x_i, x_{j+1}, \dots, x_k$ je opět sled
      z $u$ do $v$ (sousední uzly sousedí i v místě „slepení", protože $x_i = x_j$ sousedí s $x_{j+1}$),
      a to délky $k - (j - i) < k$ – spor s minimalitou. Uzly nejkratšího sledu jsou tedy navzájem
      různé, takže jde o cestu. $\square$
    proof_steps:
      - Směr zprava doleva je triviální, protože každá cesta je zároveň sled.
      - Pro směr zleva doprava vezmeme mezi všemi sledy z u do v sled nejmenší délky.
      - Kdyby se v něm opakoval uzel x_i = x_j (i < j), vynecháním úseku mezi oběma výskyty dostaneme kratší sled se stejnými konci.
      - To je spor s minimalitou, takže se v nejkratším sledu žádný uzel neopakuje a je to cesta.
    related: [def-souvisly-graf, def-sled-tah-cesta]
    source: "přednáška 1, folie 9"
    supplemented: false

  - id: def-komponenta
    kind: definition
    label: Definice
    section: "0.3"
    title: Komponenta grafu
    terms: [komponenta, komponenta souvislosti, maximální souvislý podgraf]
    statement: |
      Buď $G' \subset G$. Řekneme, že graf $G'$ je **komponenta** grafu $G$, jestliže

      1. $G'$ je souvislý graf,
      2. je-li $G' \subset G'' \subset G$ a $G''$ je souvislý, pak $G' = G''$.

      (Tedy: komponenty grafu $G$ jsou jeho maximální souvislé podgrafy.)
    intuition: |
      Komponenta je „ostrov" grafu: souvislý kus, ke kterému už nelze nic přidat, aniž by se
      porušila souvislost. Komponenty jsou indukované podgrafy na třídách ekvivalence „mezi $u$ a $v$
      existuje sled"; každý uzel leží v právě jedné komponentě. Souvislý graf má právě jednu komponentu.
      Komponenty lze najít prohledáváním (BFS/DFS) v čase $O(n + m)$.
    illustrations:
      - title: Komponenty při odebírání hran
        property: connected
        graph:
          directed: false
          nodes:
            - { id: a, x: 0.5, y: 2 }
            - { id: b, x: 0.5, y: 8 }
            - { id: c, x: 3.5, y: 5 }
            - { id: d, x: 6, y: 5 }
            - { id: e, x: 8, y: 1 }
            - { id: f, x: 9.5, y: 5 }
            - { id: g, x: 8, y: 9 }
          edges:
            - { from: a, to: b }
            - { from: b, to: c }
            - { from: c, to: a }
            - { from: c, to: d }
            - { from: d, to: e }
            - { from: e, to: f }
            - { from: f, to: g }
            - { from: g, to: d }
        steps:
          - caption: |
              Mezi každými dvěma uzly vede cesta, graf je souvislý – má jedinou komponentu, sebe sama.
          - caption: |
              Hrana $cd$ byla jediným spojením obou částí. Po jejím odebrání se graf rozpadne na dvě komponenty – maximální souvislé podgrafy, ke kterým už nejde nic přidat, aniž by se souvislost porušila.
            remove: [[c, d]]
          - caption: |
              Hrana $ef$ leží na kružnici $d, e, f, g$, takže její odebrání nic nerozpojí: z $e$ do $f$ se dostaneme oklikou přes $d, g$. Komponenty jsou pořád dvě.
            remove: [[e, f]]
          - caption: |
              Po odebrání $de$ je $e$ izolovaný uzel – i ten tvoří samostatnou komponentu. Každý uzel leží v právě jedné komponentě.
            remove: [[d, e]]
          - caption: |
              Hrana mezi dvěma komponentami je slije do jedné: po přidání $bg$ zbývají komponenty $\{a, b, c, d, f, g\}$ a $\{e\}$.
            add: [[b, g]]
    related: [def-souvisly-graf, def-podgraf, def-kvazikomponenta]
    source: "přednáška 1, folie 9"
    supplemented: false

  - id: def-min-max-stupen
    kind: definition
    label: Označení
    section: "0.3"
    title: Minimální a maximální stupeň grafu
    terms: [minimální stupeň, maximální stupeň, delta, δ(G), Δ(G), n, m]
    statement: |
      - Minimální stupeň grafu: $\delta(G) = \min\{d_G(u) \mid u \in U(G)\}$.
      - Maximální stupeň grafu: $\Delta(G) = \max\{d_G(u) \mid u \in U(G)\}$.

      Neřekneme-li jinak, vždy značíme $|U(G)| = n$ a $|H(G)| = m$.
    intuition: |
      (Ve foliích je v definici překlep $d_G(U)$ místo $d_G(u)$.) Minimální stupeň je oblíbený
      předpoklad postačujících podmínek – např. $\delta(G) \ge n/2$ zaručuje souvislost a podle
      Diracovy věty dokonce hamiltonovskost.
    related: [def-stupen-uzlu, prop-souvislost-min-stupen, thm-dirac]
    source: "přednáška 1, folie 9"
    supplemented: false

  - id: prop-souvislost-min-stupen
    kind: proposition
    label: Větička
    section: "0.3"
    title: Velký minimální stupeň zaručuje souvislost
    terms: [souvislost, minimální stupeň, δ(G) ≥ n/2]
    statement: |
      Je-li $\delta(G) \ge \frac{n}{2}$, pak je $G$ souvislý.
    intuition: |
      Dva nesousední uzly mají každý alespoň $n/2$ sousedů, ale jen $n - 2$ „ostatních" uzlů,
      kam sousedy umístit – jejich okolí se proto musí protnout. Libovolné dva uzly jsou tak ve
      vzdálenosti nejvýše 2. Mez je těsná: dvě disjunktní kopie $K_k$ mají $n = 2k$ a
      $\delta = k - 1 = n/2 - 1$, a souvislé nejsou.
    proof: |
      *Důkaz není ve foliích, doplněno.*

      Buďte $u \ne v$ dva uzly grafu $G$. Sousedí-li, jsou spojeny cestou délky 1. Nesousedí-li,
      leží všichni sousedé uzlu $u$ i uzlu $v$ v množině $U(G) \setminus \{u, v\}$, která má $n - 2$ prvků.
      Přitom $|N(u)| + |N(v)| = d_G(u) + d_G(v) \ge \frac{n}{2} + \frac{n}{2} = n > n - 2$, takže
      podle Dirichletova principu mají $u$ a $v$ společného souseda $w$. Pak $u, w, v$ je cesta
      z $u$ do $v$. Graf je tedy souvislý. $\square$
    proof_steps:
      - Vezmeme dva různé uzly u, v; sousedí-li, jsou spojeny hranou.
      - Nesousedí-li, leží všichni jejich sousedé mezi zbývajícími n − 2 uzly.
      - Součet jejich stupňů je alespoň n > n − 2, proto mají společného souseda w.
      - Cesta u, w, v ukazuje, že každé dva uzly jsou propojeny, a G je souvislý.
    illustrations:
      - title: Mez n/2 je těsná
        property: connected
        graph:
          directed: false
          nodes:
            - { id: a, x: 0.5, y: 1 }
            - { id: b, x: 0.5, y: 9 }
            - { id: c, x: 3.5, y: 5 }
            - { id: x, x: 9.5, y: 1 }
            - { id: y, x: 9.5, y: 9 }
            - { id: z, x: 6.5, y: 5 }
          edges:
            - { from: a, to: b }
            - { from: b, to: c }
            - { from: c, to: a }
            - { from: x, to: y }
            - { from: y, to: z }
            - { from: z, to: x }
        steps:
          - caption: |
              $n = 6$ a každý uzel má stupeň $2 = n/2 - 1$. Dvě disjunktní kopie $K_3$ souvislé nejsou – předpoklad $\delta(G) \ge n/2$ tedy nejde zeslabit ani o jedničku.
            labels: { a: "2", b: "2", c: "2", x: "2", y: "2", z: "2" }
          - caption: |
              Přidáním hran $ax$, $by$, $cz$ stoupne minimální stupeň na $3 = n/2$ a graf je souvislý, jak větička slibuje.
            add: [[a, x], [b, y], [c, z]]
            labels: { a: "3", b: "3", c: "3", x: "3", y: "3", z: "3" }
          - caption: |
              Proč to funguje: nesousední uzly $a$ a $y$ mají dohromady $3 + 3 = 6$ sousedů, ale k dispozici je jen $n - 2 = 4$ ostatních uzlů. Okolí se musí protnout – společným sousedem je např. $b$, takže $a, b, y$ je cesta.
            nodes: { a: active, y: active, b: path }
            edges: { a-b: path, b-y: path }
    related: [def-souvisly-graf, def-min-max-stupen, thm-dirac]
    source: "přednáška 1, folie 9"
    supplemented: false

  - id: prop-vlastnosti-souvislych
    kind: proposition
    label: Tvrzení
    section: "0.3"
    title: Vlastnosti souvislých grafů
    terms: [souvislý graf, odebrání uzlu, počet hran souvislého grafu, m ≥ n − 1]
    statement: |
      Nechť $G$ je souvislý graf (s $n \ge 2$ uzly). Pak

      1. existuje uzel $u \in U(G)$ tak, že graf $G - u$ je souvislý,
      2. $m \ge n - 1$.
    intuition: |
      Bod 1: souvislý graf lze „rozebírat" po jednom uzlu, aniž by se rozpadl – stačí vždy
      odebrat konec nejdelší cesty (v kostře by to byl list). To umožňuje indukci podle počtu uzlů.
      Bod 2: souvislost něco stojí – na propojení $n$ uzlů je potřeba alespoň $n - 1$ hran;
      grafy, kde nastává rovnost, jsou právě stromy.
    proof: |
      *Důkaz není ve foliích, doplněno.*

      **1.** Zvolme v $G$ cestu $P$ maximální délky a nechť $u$ je její koncový uzel. Všichni
      sousedé uzlu $u$ leží na $P$ (jinak bychom $P$ prodloužili). Ukážeme, že $G - u$ je souvislý.
      Graf $P - u$ je cesta, tedy souvislý (a neprázdný, protože $n \ge 2$ a $G$ souvislý dává délku $P$
      alespoň 1). Buď $x \ne u$ libovolný uzel. V $G$ existuje cesta z $x$ do $u$; její předposlední uzel
      $y$ je soused $u$, tedy leží na $P - u$, a úsek cesty z $x$ do $y$ neobsahuje $u$. Každý uzel $G - u$
      je tak v $G - u$ spojen s cestou $P - u$, a $G - u$ je proto souvislý.

      **2.** Indukcí podle $n$. Pro $n = 1$ je $m \ge 0 = n - 1$. Nechť $n \ge 2$ a tvrzení platí pro
      grafy s $n - 1$ uzly. Podle bodu 1 existuje $u$ s $G - u$ souvislým; ten má $n - 1$ uzlů, tedy podle
      indukčního předpokladu alespoň $n - 2$ hran. Uzel $u$ má v souvislém grafu s $n \ge 2$ uzly stupeň
      alespoň 1 a jeho hrany v $G - u$ nejsou. Proto $m \ge (n - 2) + 1 = n - 1$. $\square$
    proof_steps:
      - Zvolíme nejdelší cestu P v G a za u vezmeme její koncový uzel; všichni sousedé u leží na P, jinak by šla P prodloužit.
      - Každý uzel x ≠ u spojíme s u cestou; její předposlední uzel leží na P − u a úsek do něj se uzlu u vyhne.
      - Protože P − u je souvislá a každý uzel je s ní v G − u spojen, je G − u souvislý.
      - Odhad m ≥ n − 1 dokážeme indukcí podle n; v indukčním kroku odebereme uzel u z bodu 1.
      - Graf G − u má podle indukčního předpokladu alespoň n − 2 hran a u přispívá alespoň jednou hranou, celkem m ≥ n − 1.
    illustrations:
      - title: Konec nejdelší cesty jde odebrat
        for: proof
        property: separating-set
        graph:
          directed: false
          nodes:
            - { id: a, x: 0.5, y: 2 }
            - { id: b, x: 0.5, y: 8 }
            - { id: c, x: 3.5, y: 5 }
            - { id: d, x: 6.5, y: 5 }
            - { id: e, x: 9.5, y: 2 }
            - { id: f, x: 9.5, y: 8 }
          edges:
            - { from: a, to: b }
            - { from: b, to: c }
            - { from: a, to: c }
            - { from: c, to: d }
            - { from: d, to: e }
            - { from: e, to: f }
            - { from: d, to: f }
        steps:
          - caption: |
              $P = b, a, c, d, e, f$ je nejdelší cesta. Všichni sousedé jejího konce $f$ (uzly $e$ a $d$) leží na $P$ – jinak by šla $P$ prodloužit. Proto $G - f$ zůstane souvislý a $f$ **není** uzlový řez.
            set: [f]
            edges: { b-a: path, a-c: path, c-d: path, d-e: path, e-f: path }
            witness: true
          - caption: |
              Pro srovnání vnitřní uzel $c$: jeho odebráním se graf rozpadne na $\{a, b\}$ a $\{d, e, f\}$, je to artikulace. Proto důkaz nebere libovolný uzel, ale konec nejdelší cesty.
            set: [c]
          - caption: |
              Totéž platí pro druhý konec $b$: $G - b$ je souvislý. Odebraný uzel nese aspoň jednu hranu, takže indukcí $m \ge (n - 2) + 1 = n - 1$; zde $m = 7 \ge 5$.
            set: [b]
    related: [def-souvisly-graf, thm-charakterizace-stromu]
    source: "přednáška 1, folie 9"
    supplemented: false

  - id: def-uzavreny-sled-kruznice
    kind: definition
    label: Definice
    section: "0.3"
    title: Uzavřený sled, uzavřený tah, kružnice
    terms: [uzavřený sled, uzavřený tah, kružnice, cyklus v neorientovaném grafu, délka kružnice]
    statement: |
      1. Buď $f : C_k \to G$ homomorfismus. Pak se graf $f(C_k)$ nazývá **uzavřený sled** v grafu $G$.
      2. Je-li navíc $f$ hranový monomorfismus, pak se $f(C_k)$ nazývá **uzavřený tah** v $G$.
      3. Je-li navíc $f$ uzlový monomorfismus, pak se $f(C_k)$ nazývá **kružnice** v $G$.

      Číslo $k$ se nazývá **délka** (uzavřeného sledu, uzavřeného tahu, kružnice).
    intuition: |
      Uzavřené varianty sledu, tahu a cesty – procházka, která skončí tam, kde začala.
      Kružnice má navzájem různé uzly a délku alespoň 3 (protože $C_k$ je definována pro $k \ge 3$).
      Uzavřené tahy jsou základem [eulerovských grafů](#def-eulerovsky-graf), kružnice délky $n$
      [hamiltonovských grafů](#def-hamiltonovsky-graf).
    related: [def-sled-tah-cesta, def-strom, def-eulerovsky-graf, def-hamiltonovsky-graf]
    source: "přednáška 1, folie 10"
    supplemented: false

  # ------------------------------------------------------------------ 0.4
  - id: def-strom
    kind: definition
    label: Definice
    section: "0.4"
    title: Strom
    terms: [strom, acyklický souvislý graf, les, list]
    statement: |
      Souvislý graf, který neobsahuje jako podgraf žádnou kružnici, se nazývá **strom**.
    intuition: |
      Strom je „minimální kostra propojení": vše je spojeno, ale nic navíc. Graf bez kružnic
      (ne nutně souvislý) se nazývá les – jeho komponenty jsou stromy. Každý strom s alespoň dvěma
      uzly má alespoň dva listy (uzly stupně 1) – např. konce nejdelší cesty.
    related: [thm-charakterizace-stromu, def-kostra, def-uzavreny-sled-kruznice]
    source: "přednáška 1, folie 10"
    supplemented: false

  - id: thm-charakterizace-stromu
    kind: theorem
    label: Věta
    section: "0.4"
    title: Charakterizace stromů
    terms: [charakterizace stromů, strom, jediná cesta, m = n − 1, minimálně souvislý graf]
    statement: |
      Následující tvrzení jsou ekvivalentní:

      1. $G$ je strom.
      2. Pro každé $u, v \in U(G)$ existuje v $G$ právě jedna cesta z $u$ do $v$.
      3. $G$ je souvislý a $m = n - 1$.
      4. $G$ je souvislý a nemá žádný souvislý vlastní faktor.
    intuition: |
      Čtyři pohledy na tutéž věc:

      - (2) „mezi každými dvěma uzly vede jediná trasa" – kdyby vedly dvě, vznikla by kružnice;
      - (3) „souvislý s nejmenším možným počtem hran" – srovnej s $m \ge n - 1$ pro souvislé grafy;
      - (4) „minimálně souvislý" – odebráním libovolné hrany se graf rozpadne (každá hrana je most).

      Prakticky nejužitečnější je (3): o souvislém grafu stačí spočítat hrany. Pozor: samotné
      $m = n - 1$ bez souvislosti nestačí (např. trojúhelník plus izolovaný uzel).
    proof: |
      *Důkaz není ve foliích, doplněno.* Dokážeme $1 \Rightarrow 2 \Rightarrow 4 \Rightarrow 1$
      a $1 \Leftrightarrow 3$.

      **1 ⇒ 2.** Strom je souvislý, takže cesta z $u$ do $v$ existuje
      ([větička](#prop-souvislost-cesta)). Nechť existují dvě různé cesty $P \ne Q$ z $u$ do $v$.
      Jdeme po $P$ od $u$; nechť $x$ je poslední společný uzel, po němž se cesty poprvé rozejdou, a $y$
      první další uzel cesty $P$, který opět leží na $Q$. Úsek $P$ z $x$ do $y$ a úsek $Q$ z $y$ zpět do $x$
      nemají kromě $x, y$ společné uzly a dohromady tvoří kružnici – spor.

      **2 ⇒ 4.** $G$ je souvislý, protože cesty existují. Nechť $F$ je souvislý vlastní faktor, tj. chybí
      v něm nějaká hrana $\{x,y\} \in H(G)$. V $F$ existuje cesta z $x$ do $y$, která hranu $\{x,y\}$
      nepoužívá; v $G$ je tak z $x$ do $y$ i cesta $x, y$ (jediná hrana) – dvě různé cesty, spor.

      **4 ⇒ 1.** Kdyby $G$ obsahoval kružnici $C$ a $h$ byla její hrana, je $G - h$ stále souvislý
      (každý sled používající $h$ lze přesměrovat po zbytku kružnice $C - h$). Pak $G - h$ je souvislý
      vlastní faktor – spor. Tedy $G$ je souvislý bez kružnic, tj. strom.

      **1 ⇒ 3.** Indukcí podle $n$; pro $n = 1$ platí $m = 0$. Pro $n \ge 2$ uvažme nejdelší cestu
      v $G$ a její koncový uzel $u$. Ten má stupeň 1: všichni jeho sousedé leží na cestě (maximalita)
      a soused jiný než následující uzel by uzavřel kružnici. Graf $G - u$ je souvislý (list nespojuje
      žádné jiné uzly) a bez kružnic, tedy strom s $n - 1$ uzly a podle indukce s $n - 2$ hranami.
      Proto $m = n - 2 + 1 = n - 1$.

      **3 ⇒ 1.** Nechť $G$ je souvislý s $m = n - 1$, ale obsahuje kružnici. Dokud graf obsahuje kružnici,
      odebírejme hranu ležící na kružnici – souvislost se zachovává (viz 4 ⇒ 1). Skončíme se souvislým
      grafem bez kružnic, tj. stromem s $n$ uzly, který má podle 1 ⇒ 3 právě $n - 1$ hran. Odebrali jsme
      ale alespoň jednu hranu, takže původně bylo $m > n - 1$ – spor. $\square$
    proof_steps:
      - "1 ⇒ 2: dvě různé cesty mezi u a v by v místě, kde se rozejdou a znovu sejdou, vytvořily kružnici."
      - "2 ⇒ 4: chybí-li ve faktoru hrana {x,y}, dávala by cesta ve faktoru spolu s hranou {x,y} dvě různé cesty z x do y."
      - "4 ⇒ 1: hranu ležící na kružnici lze odebrat bez ztráty souvislosti, takže graf s kružnicí má souvislý vlastní faktor."
      - "1 ⇒ 3: konec nejdelší cesty ve stromu je list; jeho odebráním dostaneme menší strom a indukcí m = n − 1."
      - "3 ⇒ 1: odebíráním hran z kružnic bychom dostali strom s n − 1 hranami, tedy původní graf by měl více než n − 1 hran."
    illustrations:
      - title: Hrana navíc dá kružnici, hrana méně rozpojí
        property: tree
        graph:
          directed: false
          nodes:
            - { id: a, x: 0.5, y: 5 }
            - { id: b, x: 3.5, y: 2 }
            - { id: c, x: 3.5, y: 8 }
            - { id: d, x: 6.5, y: 0.5 }
            - { id: e, x: 6.5, y: 4 }
            - { id: f, x: 6.5, y: 9.5 }
            - { id: g, x: 9.5, y: 4 }
          edges:
            - { from: a, to: b }
            - { from: a, to: c }
            - { from: b, to: d }
            - { from: b, to: e }
            - { from: c, to: f }
            - { from: e, to: g }
        steps:
          - caption: |
              Souvislý graf bez kružnic na $n = 7$ uzlech má $m = 6 = n - 1$ hran – je to strom.
          - caption: |
              Mezi $d$ a $f$ vede **jediná** cesta $d, b, a, c, f$. Kdyby existovala jiná, spolu s touto by uzavřela kružnici (bod 2).
            nodes: { d: active, f: active }
            edges: { d-b: path, b-a: path, a-c: path, c-f: path }
          - caption: |
              Přidáme hranu $ef$: z $e$ do $f$ teď vedou dvě cesty ($e, f$ a $e, b, a, c, f$) a dohromady tvoří kružnici. Graf má $m = n$ hran a stromem už není.
            add: [[e, f]]
