  - id: alg-mst-odstranovani-kruznic
    kind: algorithm
    label: Algoritmus 1
    section: "0.6"
    title: Algoritmus 1 – odstraňování nejtěžších hran kružnic
    terms: [algoritmus 1, minimální kostra, odstraňování hran, reverse delete, hladový algoritmus, kružnicová vlastnost]
    statement: |
      Vstup: souvislý ohodnocený graf $G$. Výstup: minimální kostra grafu $G$.
      Algoritmus opakovaně hledá kružnici a odstraňuje z ní hranu s maximálním ohodnocením.
    pseudocode: |
      1. Polož $G_0 = G$, $i := 0$.
      2. Existuje v $G_i$ kružnice $C_i$?
         - **Ano:** v $C_i$ najdi hranu $h_i$ s maximálním ohodnocením, polož
           $G_{i+1} = (U(G_i), H(G_i) \setminus \{h_i\})$, $i := i + 1$ a opakuj krok 2.
         - **Ne:** $G_i$ je hledaná minimální kostra.
    complexity: "$O(m \\cdot (n+m))$"
    intuition: |
      Opačný pohled na problém než Jarník či Kruskal: místo přidávání nejlehčích hran **vyhazujeme
      nejtěžší** – ale jen takové, bez nichž se graf neobejde (leží na kružnici, takže jejich odebrání
      nenaruší souvislost).

      **Složitost:** proběhne přesně $m - n + 1$ odebrání (výsledná kostra má $n - 1$ hran). Kružnici lze
      najít prohledáním do hloubky v čase $O(n + m)$, takže celkem $O(m(n + m))$. Algoritmus je tedy
      polynomiální, ale pomalejší než Jarník ($O(n^2)$) nebo Kruskal ($O(m \log m)$). Varianta
      „projdi hrany od nejtěžší a odeber hranu, jejíž odebrání nenaruší souvislost" je známa jako
      *reverse-delete*.

      Typická chyba: odebrat nejtěžší hranu **celého grafu** – ta může být most a pak musí v kostře zůstat.
    proof: |
      *Důkaz správnosti není ve foliích, doplněno.*

      **Invariant:** každé $G_i$ je souvislý faktor grafu $G$, který obsahuje nějakou minimální kostru grafu $G$.

      - Pro $G_0 = G$ to platí (minimální kostra existuje, koster je konečně mnoho).
      - Nechť platí pro $G_i$ a $T$ je minimální kostra grafu $G$ obsažená v $G_i$. Hrana $h_i$ leží na kružnici,
        takže $G_{i+1} = G_i - h_i$ je stále souvislý. Neleží-li $h_i$ v $T$, je $T \subset G_{i+1}$. Leží-li,
        $T - h_i$ má dvě komponenty a kružnice $C_i$ obsahuje další hranu $e \ne h_i$ mezi nimi; $e \in G_{i+1}$,
        $e \notin T$ a $w(e) \le w(h_i)$, protože $h_i$ je na $C_i$ nejtěžší. $T' = T - h_i + e$ je kostra s
        $w(T') \le w(T)$, tedy minimální, a leží v $G_{i+1}$ (viz [lemma](#lemma-mst-rez), bod 2).

      **Konečnost:** v každém kroku ubude hrana, takže algoritmus skončí po nejvýše $m$ krocích.

      **Výsledek:** po skončení je $G_i$ souvislý bez kružnic, tedy strom, a obsahuje minimální kostru $T$.
      Obě mají $n - 1$ hran a $T \subset G_i$, proto $G_i = T$. $\square$
    proof_steps:
      - Invariant – každé G_i je souvislý faktor grafu G obsahující nějakou minimální kostru.
      - Odebraná hrana leží na kružnici, proto se odebráním neporuší souvislost.
      - Pokud odebraná hrana h_i leží v minimální kostře T, nahradíme ji jinou hranou e kružnice C_i vedoucí mezi komponentami T − h_i; w(e) ≤ w(h_i), takže vznikne opět minimální kostra uvnitř G_{i+1}.
      - Algoritmus skončí, protože v každém kroku ubude jedna hrana.
      - Po skončení je G_i souvislé bez kružnic, tj. kostra, a protože obsahuje minimální kostru se stejným počtem hran, je s ní totožné.
    examples:
      - title: Algoritmus 1 na grafu se 6 uzly
        body: |
          Graf má 9 hran, kostra bude mít 5, odebereme tedy 4 hrany:

          1. kružnice $a, b, d$ (hrany 4, 5, 2): odeber $\{b,d\}$ (5),
          2. kružnice $b, e, f$ (3, 9, 7): odeber $\{e,f\}$ (9),
          3. kružnice $b, c, f$ (6, 1, 7): odeber $\{b,f\}$ (7),
          4. kružnice $a, d, e, b$ (2, 8, 3, 4): odeber $\{d,e\}$ (8).

          Zbude kostra $\{c,f\}, \{a,d\}, \{b,e\}, \{a,b\}, \{b,c\}$ s vahou $1+2+3+4+6 = 16$ – stejná,
          jakou najde Jarníkův i Kruskalův algoritmus. Pořadí, v jakém kružnice vybíráme, výsledek
          nezmění (jsou-li váhy různé, je minimální kostra jediná).
        graph:
          directed: false
          nodes:
            - { id: a, x: 0, y: 2 }
            - { id: b, x: 4, y: 0 }
            - { id: c, x: 8, y: 2 }
            - { id: d, x: 0, y: 7 }
            - { id: e, x: 4, y: 9 }
            - { id: f, x: 8, y: 7 }
          edges:
            - { from: a, to: b, w: 4 }
            - { from: b, to: c, w: 6 }
            - { from: a, to: d, w: 2 }
            - { from: b, to: d, w: 5 }
            - { from: b, to: e, w: 3 }
            - { from: b, to: f, w: 7 }
            - { from: c, to: f, w: 1 }
            - { from: d, to: e, w: 8 }
            - { from: e, to: f, w: 9 }
