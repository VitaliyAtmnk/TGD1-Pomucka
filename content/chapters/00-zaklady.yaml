items:
  # ------------------------------------------------------------------ 0.1
  - id: def-graf
    kind: definition
    label: Definice
    section: "0.1"
    title: Graf
    terms: [graf, uzel, vrchol, hrana, neorientovaný graf, orientovaný graf, množina uzlů, množina hran]
    statement: |
      **Graf** je uspořádaná dvojice $G = (U, H)$, kde $U$ je konečná neprázdná množina
      a $H \subset \binom{U}{2} \cup U^2$.

      Prvky $U = U(G)$ jsou **uzly**, prvky $H = H(G)$ jsou **hrany**. Graf $G = (U,H)$ se nazývá

      - **neorientovaný graf**, jestliže $H \subset \binom{U}{2}$ (hrany jsou dvouprvkové množiny $\{x,y\}$),
      - **orientovaný graf**, jestliže $H \subset U^2$ (hrany jsou uspořádané dvojice $(x,y)$).

      ($\binom{U}{2}$ značí množinu všech dvouprvkových podmnožin $U$; symbol $\subset$ zde znamená „je podmnožinou" včetně rovnosti.)
    intuition: |
      Neorientovaná hrana $\{x,y\}$ je „obousměrná silnice", orientovaná hrana $(x,y)$ je
      „jednosměrka" z $x$ do $y$. Z definice plyne několik věcí, na které se často zapomíná:

      - neorientovaný graf **nemá smyčky** ani násobné hrany ($\{x,x\}$ není dvouprvková množina
        a množina hran nemůže obsahovat tutéž hranu dvakrát) – jde o tzv. prostý graf;
      - orientovaný graf smyčku $(x,x)$ mít **může** (proto se později definuje i cyklus délky 1);
      - množina uzlů je konečná a neprázdná, graf bez uzlů neexistuje.

      Pokud neřekneme jinak, značíme $n = |U(G)|$ a $m = |H(G)|$.
    related: [def-homomorfismus, def-specialni-grafy, def-stupen-uzlu]
    source: "přednáška 1, folie 3"
    supplemented: false

  - id: def-homomorfismus
    kind: definition
    label: Definice
    section: "0.1"
    title: Homomorfismus grafů
    terms: [homomorfismus, zobrazení grafů, homomorfismus grafu]
    statement: |
      Buďte $G$ a $G'$ grafy. Zobrazení $f : U(G) \to U(G')$ se nazývá **homomorfismus grafu $G$
      do grafu $G'$**, jestliže

      $$
      (x,y) \in H(G) \Rightarrow (f(x), f(y)) \in H(G') \quad\text{a}\quad
      \{x,y\} \in H(G) \Rightarrow \{f(x), f(y)\} \in H(G').
      $$

      Značíme $f : G \to G'$.
    intuition: |
      Homomorfismus je zobrazení uzlů, které **zachovává hrany**: kdykoli jsou dva uzly v $G$
      spojeny hranou, jsou jejich obrazy spojeny hranou (stejného typu) v $G'$. Opačná implikace
      se nevyžaduje – obrazy nesousedních uzlů klidně sousedit mohou.

      Pozor: u neorientovaných grafů nesmí homomorfismus „slepit" dva sousední uzly do jednoho,
      protože $\{f(x), f(x)\}$ není hrana. Proto např. homomorfismus $G \to K_k$ existuje právě
      když lze $G$ obarvit $k$ barvami.

      Homomorfismy jsou v TGD1 hlavně jazykem pro elegantní definice: sled, tah, cesta,
      kružnice i isomorfismus se definují jako homomorfismy s jistými vlastnostmi.
    examples:
      - title: Homomorfismus cesty do trojúhelníku
        body: |
          Nechť $P_3$ má uzly $0,1,2,3$ a hrany $\{0,1\},\{1,2\},\{2,3\}$ a nechť $K_3$ má uzly $a,b,c$.
          Zobrazení $f(0)=a,\ f(1)=b,\ f(2)=c,\ f(3)=a$ je homomorfismus: obrazy hran jsou
          $\{a,b\},\{b,c\},\{c,a\}$, vesměs hrany $K_3$. Zobrazení s $f(0)=f(1)=a$ homomorfismem
          není, protože hrana $\{0,1\}$ by se zobrazila na „hranu" $\{a,a\}$, která neexistuje.
    related: [def-indukovane-zobrazeni, def-druhy-homomorfismu, def-sled-tah-cesta]
    source: "přednáška 1, folie 3"
    supplemented: false

  - id: def-indukovane-zobrazeni
    kind: definition
    label: Definice
    section: "0.1"
    title: Zobrazení indukované zobrazením uzlů
    terms: [indukované zobrazení, zobrazení hran, f hvězdička]
    statement: |
      Buďte $G$ a $G'$ grafy a $f : U(G) \to U(G')$ zobrazení. Zobrazení $f^* : H(G) \to H(G')$
      definované vztahy

      $$
      f^*(\{u,v\}) = \{f(u), f(v)\}, \qquad f^*((u,v)) = (f(u), f(v))
      $$

      se nazývá **zobrazení indukované zobrazením $f$**.

      Tedy: $f : U(G) \to U(G')$ je homomorfismus právě když $h \in H(G) \Rightarrow f^*(h) \in H(G')$.
    intuition: |
      $f$ říká, kam jdou uzly; $f^*$ je „důsledek" pro hrany – hrana jde tam, kam jdou její konce.
      Homomorfismus je přesně takové $f$, pro které je $f^*$ dobře definované zobrazení do $H(G')$
      (obraz každé hrany je opravdu hranou). Rozlišení $f$ a $f^*$ je klíčové pro definici
      uzlových a hranových mono-/epimorfismů.
    related: [def-homomorfismus, def-druhy-homomorfismu]
    source: "přednáška 1, folie 3"
    supplemented: false

  - id: def-druhy-homomorfismu
    kind: definition
    label: Definice
    section: "0.1"
    title: Druhy homomorfismů (mono-, epi-, isomorfismus)
    terms: [uzlový monomorfismus, uzlový epimorfismus, hranový monomorfismus, hranový epimorfismus, monomorfismus, epimorfismus, isomorfismus, izomorfismus]
    statement: |
      Buďte $G, G'$ grafy a $f : G \to G'$ homomorfismus. Řekneme, že $f$ je

      - **uzlový monomorfismus**, je-li $f$ prosté,
      - **uzlový epimorfismus**, je-li $f$ na,
      - **hranový monomorfismus**, je-li $f^*$ prosté,
      - **hranový epimorfismus**, je-li $f^*$ na,
      - **monomorfismus**, je-li $f$ i $f^*$ prosté,
      - **epimorfismus**, je-li $f$ i $f^*$ na,
      - **isomorfismus**, je-li $f$ i $f^*$ prosté a na.
    intuition: |
      „Mono" = prosté (nic se neslepí), „epi" = na (všechno se pokryje), přívlastek uzlový/hranový
      říká, zda mluvíme o $f$, nebo o indukovaném $f^*$.

      - Uzlový monomorfismus je automaticky i hranový monomorfismus (různé hrany mají různou
        dvojici konců, a ty se zobrazí na různé dvojice). Opak neplatí: sled, který projde uzlem
        dvakrát, ale žádnou hranou dvakrát, je hranový, ale ne uzlový monomorfismus.
      - Právě tento rozdíl odlišuje **tah** (hranový monomorfismus) od **cesty** (uzlový
        monomorfismus), viz [sled, tah, cesta](#def-sled-tah-cesta).
      - Isomorfismus znamená, že $G$ a $G'$ jsou „tentýž graf, jen jinak pojmenovaný / nakreslený".
    related: [def-homomorfismus, def-indukovane-zobrazeni, prop-isomorfismus-vlastnosti, def-sled-tah-cesta]
    source: "přednáška 1, folie 4"
    supplemented: false

  - id: prop-isomorfismus-vlastnosti
    kind: proposition
    label: Poznámky
    section: "0.1"
    title: Ekvivalentní popis isomorfismu, relace ≃
    terms: [isomorfismus, isomorfní grafy, izomorfní grafy, relace isomorfismu, ekvivalence]
    statement: |
      1. Zobrazení $f : U(G) \to U(G')$ je isomorfismus právě když $f$ je bijekce a platí
         $$
         (x,y) \in H(G) \iff (f(x),f(y)) \in H(G'), \qquad
         \{x,y\} \in H(G) \iff \{f(x),f(y)\} \in H(G').
         $$
      2. Existuje-li isomorfismus $G \to G'$, říkáme, že grafy jsou **isomorfní**, a značíme $G \simeq G'$.
      3. Relace $\simeq$ je ekvivalence (na třídě všech grafů).
    intuition: |
      Isomorfismus zachovává hrany **i nehrany**. Pro důkaz, že dva grafy isomorfní **nejsou**,
      stačí najít vlastnost, kterou isomorfismus zachovává a v níž se grafy liší (počet uzlů a
      hran, soubor stupňů, počet trojúhelníků, existence kružnice dané délky, bipartitnost,
      souvislost…). Pro důkaz isomorfismu je naopak potřeba bijekci explicitně najít.

      Typická chyba: „mají stejný soubor stupňů, tedy jsou isomorfní" – to **neplatí**
      (viz příklad).
    proof: |
      *Důkaz není ve foliích, doplněno.*

      **1. (⇒)** Nechť $f$ je isomorfismus. Pak $f$ je bijekce podle definice. Implikace „⇒"
      ve vztazích plyne z toho, že $f$ je homomorfismus. Implikace „⇐": nechť
      $(f(x),f(y)) \in H(G')$. Protože $f^*$ je na, existuje hrana $(a,b) \in H(G)$ s
      $(f(a),f(b)) = (f(x),f(y))$, tj. $f(a)=f(x)$ a $f(b)=f(y)$. Z prostoty $f$ plyne $a=x$, $b=y$,
      tedy $(x,y) \in H(G)$. Pro neorientované hrany stejně.

      **1. (⇐)** Nechť $f$ je bijekce splňující obě ekvivalence. Implikace „⇒" říká, že $f$ je
      homomorfismus. $f^*$ je prosté: pokud $f^*(h_1) = f^*(h_2)$, mají obě hrany stejné obrazy konců,
      a protože $f$ je prosté, mají stejné konce, tj. $h_1 = h_2$. $f^*$ je na: pro hranu
      $(x',y') \in H(G')$ položme $x = f^{-1}(x')$, $y = f^{-1}(y')$; podle implikace „⇐" je
      $(x,y) \in H(G)$ a $f^*((x,y)) = (x',y')$. Tedy $f$ i $f^*$ jsou bijekce.

      **3.** *Reflexivita:* identita $\mathrm{id}_{U(G)}$ je isomorfismus $G \to G$.
      *Symetrie:* je-li $f$ isomorfismus $G \to G'$, pak $f^{-1}$ je bijekce a podle bodu 1
      (ekvivalence čtené zprava doleva) splňuje obě ekvivalence, je tedy isomorfismus $G' \to G$.
      *Tranzitivita:* složení dvou bijekcí je bijekce a složením ekvivalencí
      $h \in H(G) \iff f^*(h) \in H(G') \iff g^*(f^*(h)) \in H(G'')$ dostaneme, že $g \circ f$
      je isomorfismus $G \to G''$. $\square$
    proof_steps:
      - Je-li f isomorfismus, je f bijekce a implikace „hrana ⇒ hrana obrazů" plyne z toho, že f je homomorfismus.
      - Opačná implikace plyne z toho, že f* je na a f je prosté, takže hrana mezi obrazy musí pocházet právě z hrany mezi vzory.
      - Naopak u bijekce splňující obě ekvivalence je f* prosté (různé hrany mají různé konce) a na (vzor hrany vezmeme přes inverzi f).
      - Reflexivita relace ≃ plyne z identity, symetrie z toho, že inverze isomorfismu je opět isomorfismus.
      - Tranzitivita plyne z toho, že složením dvou bijekcí zachovávajících hrany i nehrany je opět taková bijekce.
    examples:
      - title: Tři kubické grafy na šesti uzlech
        body: |
          Uvažujme tři 3-pravidelné grafy na 6 uzlech (všechny mají soubor stupňů $3,3,3,3,3,3$ a 9 hran):

          1. $K_{3,3}$,
          2. šestiúhelník $C_6$ s uzly $1,\dots,6$ doplněný o tři „dlouhé úhlopříčky" $\{1,4\},\{2,5\},\{3,6\}$,
          3. trojboký hranol (dva trojúhelníky $abc$ a $a'b'c'$ spojené hranami $aa', bb', cc'$).

          Graf 2 je isomorfní s $K_{3,3}$: liché uzly $1,3,5$ tvoří jednu partitu, sudé $2,4,6$ druhou –
          každá hrana šestiúhelníku i každá úhlopříčka spojuje lichý uzel se sudým a každý lichý uzel má
          tři sudé sousedy, tj. všechny. Hranol ale isomorfní **není**: obsahuje trojúhelník, zatímco
          $K_{3,3}$ (bipartitní graf) žádnou lichou kružnici nemá. Stejný soubor stupňů tedy na isomorfismus nestačí.
        graph:
          directed: false
          nodes:
            - { id: "1", x: 3, y: 0 }
            - { id: "2", x: 7, y: 0 }
            - { id: "3", x: 9, y: 4 }
            - { id: "4", x: 7, y: 8 }
            - { id: "5", x: 3, y: 8 }
            - { id: "6", x: 1, y: 4 }
          edges:
            - { from: "1", to: "2" }
            - { from: "2", to: "3" }
            - { from: "3", to: "4" }
            - { from: "4", to: "5" }
            - { from: "5", to: "6" }
            - { from: "6", to: "1" }
            - { from: "1", to: "4" }
            - { from: "2", to: "5" }
            - { from: "3", to: "6" }
    illustrations:
      - title: Stejné stupně, a přesto různé grafy
        property: bipartite
        graph:
          directed: false
          nodes:
            - { id: "1", x: 3, y: 0.5 }
            - { id: "2", x: 7, y: 0.5 }
            - { id: "3", x: 9.5, y: 5 }
            - { id: "4", x: 7, y: 9.5 }
            - { id: "5", x: 3, y: 9.5 }
            - { id: "6", x: 0.5, y: 5 }
          edges:
            - { from: "1", to: "2" }
            - { from: "2", to: "3" }
            - { from: "3", to: "4" }
            - { from: "4", to: "5" }
            - { from: "5", to: "6" }
            - { from: "6", to: "1" }
            - { from: "1", to: "4" }
            - { from: "2", to: "5" }
            - { from: "3", to: "6" }
        steps:
          - caption: |
              Šestiúhelník se třemi dlouhými úhlopříčkami, všechny stupně jsou 3. Každá hrana spojuje lichý uzel se sudým, takže uzly jdou rozdělit do dvou tříd bez hran uvnitř – graf je bipartitní.
          - caption: |
              Bijekce $f$: liché uzly $1, 3, 5 \mapsto a_1, a_2, a_3$, sudé $2, 4, 6 \mapsto b_1, b_2, b_3$. Každý lichý uzel sousedí se **všemi** sudými a žádné dva liché spolu nesousedí, takže $f$ zachovává hrany i nehrany – je to jen jinak nakreslený $K_{3,3}$.
            labels: { "1": "a₁", "3": "a₂", "5": "a₃", "2": "b₁", "4": "b₂", "6": "b₃" }
          - caption: |
              Vyměníme úhlopříčky $\{1,4\}, \{3,6\}$ za $\{1,3\}, \{4,6\}$. Všechny stupně zůstanou 3, ale vznikl trojúhelník $1, 2, 3$ a graf přestal být bipartitní. Isomorfismus trojúhelníky zachovává, takže tento trojboký hranol s $K_{3,3}$ isomorfní **není** – stejný soubor stupňů nestačí.
            remove: [["1", "4"], ["3", "6"]]
            add: [["1", "3"], ["4", "6"]]
    related: [def-druhy-homomorfismu, def-soubor-stupnu, def-specialni-grafy]
    source: "přednáška 1, folie 4–5"
    supplemented: false

  - id: def-specialni-grafy
    kind: definition
    label: Neorientované grafy
    section: "0.1"
    title: Speciální neorientované grafy (K_n, P_n, C_n, K_{p,q})
    terms: [úplný graf, cesta, kružnice, úplný bipartitní graf, úplný sudý graf, bipartitní graf, Kn, Pn, Cn, Kpq]
    statement: |
      - **Úplný graf:** $K_n = \left(\langle 1,n\rangle, \binom{\langle 1,n\rangle}{2}\right)$.
      - **Cesta délky $n \ge 0$:** $P_n = \left(\langle 0,n\rangle, \{\{i,i+1\} \mid i \in \langle 0,n-1\rangle\}\right)$.
      - **Kružnice délky $n \ge 3$:** $C_n = \left(\langle 1,n\rangle, \{\{i,i+1\} \mid i \in \langle 1,n-1\rangle\} \cup \{\{1,n\}\}\right)$.
      - **Úplný sudý (bipartitní) graf:** pro disjunktní množiny $U, U'$ ($U \cap U' = \emptyset$)
        $K_{U,U'} = \left(U \cup U', \{\{x,y\} \mid x \in U,\ y \in U'\}\right)$.
        Speciálně $K_{p,q} = K_{\langle 1,p\rangle, \langle p+1,p+q\rangle}$.

      ($\langle a,b \rangle$ značí množinu celých čísel od $a$ do $b$.)
    intuition: |
      Pozor na indexování: $P_n$ má **$n$ hran a $n+1$ uzlů** (délka = počet hran), $C_n$ má $n$
      uzlů i $n$ hran. $K_n$ má $\binom{n}{2}$ hran, $K_{p,q}$ má $pq$ hran.

      Tyto „vzorové" grafy jsou důležité, protože sled, tah, cesta a kružnice v obecném grafu se
      definují jako homomorfní obrazy $P_k$ a $C_k$.
    related: [def-graf, def-sled-tah-cesta, def-uzavreny-sled-kruznice]
    source: "přednáška 1, folie 6"
    supplemented: false

  # ------------------------------------------------------------------ 0.2
  - id: def-stupen-uzlu
    kind: definition
    label: Definice
    section: "0.2"
    title: Stupeň uzlu
    terms: [stupeň uzlu, stupeň vrcholu, valence, d_G(u)]
    statement: |
      **Stupeň** uzlu $u$ v (neorientovaném) grafu $G$ je počet hran grafu $G$, které obsahují uzel $u$.
      Značíme jej $d_G(u)$.
    intuition: |
      Stupeň je počet sousedů uzlu (v prostém neorientovaném grafu jsou to totéž, protože nejsou
      smyčky ani násobné hrany). Uzel stupně 0 je izolovaný, uzel stupně 1 je list (koncový uzel).
      Pro orientované grafy se zavádějí zvlášť vstupní a výstupní polostupně.
    related: [thm-soucet-stupnu, def-soubor-stupnu, def-min-max-stupen]
    source: "přednáška 1, folie 6"
    supplemented: false

  - id: thm-soucet-stupnu
    kind: theorem
    label: Věta
    section: "0.2"
    title: Součet stupňů (princip sudosti)
    terms: [součet stupňů, princip sudosti, handshaking lemma, lemma o podávání rukou, lichý stupeň]
    statement: |
      Pro každý graf $G$ platí
      $$
      \sum_{u \in U(G)} d_G(u) = 2\,|H(G)|.
      $$
    intuition: |
      Každá hrana má dva konce, a proto přispívá do součtu stupňů přesně dvakrát – jednou u každého
      svého konce. Důležitý důsledek: **počet uzlů lichého stupně je v každém grafu sudý**
      (součet stupňů je sudý). Tím se okamžitě vyřadí mnoho „podezřelých" posloupností:
      např. graf se stupni $3,3,3$ neexistuje.
    proof: |
      *Důkaz není ve foliích, doplněno.*

      Počítejme dvojice $(u, h)$, kde $u \in U(G)$, $h \in H(G)$ a $u \in h$ (uzel leží na hraně),
      dvěma způsoby.

      - Seskupíme-li dvojice podle uzlu $u$, dostaneme pro každý uzel přesně $d_G(u)$ dvojic,
        celkem tedy $\sum_{u} d_G(u)$.
      - Seskupíme-li je podle hrany $h$, dostaneme pro každou hranu přesně 2 dvojice (hrana
        $\{x,y\}$ má právě dva různé konce), celkem $2|H(G)|$.

      Oba výsledky počítají tutéž množinu, jsou tedy rovny. $\square$
    proof_steps:
      - Uvažujeme množinu všech incidujících dvojic (uzel, hrana), kde uzel leží na hraně.
      - Při počítání po uzlech přispívá každý uzel u přesně d_G(u) dvojicemi, celkem tedy součtem stupňů.
      - Při počítání po hranách přispívá každá hrana přesně dvěma dvojicemi, protože má dva různé konce.
      - Oba způsoby počítají tutéž množinu, proto je součet stupňů roven 2|H(G)|.
    illustrations:
