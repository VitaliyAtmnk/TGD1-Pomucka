  - id: def-soubor-stupnu
    kind: definition
    label: Definice
    section: "0.2"
    title: Soubor stupňů (skóre) grafu, grafová posloupnost
    terms: [soubor stupňů, skóre grafu, posloupnost stupňů, grafová posloupnost, grafické skóre]
    statement: |
      Nechť $|U(G)| = n$. Očíslujme uzly grafu $G$ tak, že $d_G(x_1) \ge d_G(x_2) \ge \dots \ge d_G(x_n)$.
      Konečná nerostoucí posloupnost $d_G(x_1), d_G(x_2), \dots, d_G(x_n)$ se nazývá
      **soubor stupňů** (skóre) grafu $G$.

      Nerostoucí posloupnost přirozených čísel se nazývá **grafová**, jestliže je souborem stupňů
      nějakého (neorientovaného) grafu.
    intuition: |
      Soubor stupňů je jednoduchý invariant: isomorfní grafy mají stejný soubor stupňů (ale ne
      naopak). Otázka „je daná posloupnost grafová?" se řeší větou o skóre – opakovaným
      „odebíráním" uzlu největšího stupně.

      Nutné podmínky grafovosti: součet je sudý (věta o součtu stupňů) a $s_1 \le n-1$.
      Nejsou ale postačující – např. $3,3,1,1$ má sudý součet, a přesto grafová není.
    related: [thm-skore, alg-test-grafove-posloupnosti, thm-soucet-stupnu]
    source: "přednáška 1, folie 7"
    supplemented: false

  - id: thm-skore
    kind: theorem
    label: Věta (o skóre)
    section: "0.2"
    title: Věta o skóre (Havel–Hakimi)
    terms: [věta o skóre, Havel-Hakimi, grafová posloupnost, skóre grafu, test grafovosti]
    statement: |
      Nechť $s_1 \ge s_2 \ge \dots \ge s_n$, $n \ge 2$, je posloupnost přirozených čísel. Pak je
      posloupnost $s_1, s_2, \dots, s_n$ grafová, právě když je grafová posloupnost

      $$
      \underbrace{s_2 - 1,\ s_3 - 1,\ \dots,\ s_{s_1+1} - 1}_{s_1},\ s_{s_1+2},\ \dots,\ s_n .
      $$
    intuition: |
      Uzel s největším stupněm $s_1$ „spotřebuje" $s_1$ sousedů. Věta říká, že je vždy bezpečné
      předpokládat, že jeho sousedy jsou **ti s největšími stupni** – pak stačí tento uzel odebrat
      a sousedům snížit stupeň o 1. Posloupnost se tak zkrátí o jeden člen a postup lze opakovat,
      dokud nedojdeme k triviálnímu případu (samé nuly = grafová, záporné číslo nebo $s_1 > n-1$ = negrafová).

      Nově vzniklou posloupnost je před dalším krokem nutné znovu **seřadit nerostoucím způsobem**.
      Implicitně se předpokládá $s_1 \le n-1$ (jinak by posloupnost vpravo nebyla definována
      a $s$ zjevně grafová není – uzel nemůže mít více než $n-1$ sousedů).
    proof: |
      *Důkaz není ve foliích, doplněno.* Předpokládejme $s_1 \le n-1$ (jinak $s$ grafová není
      a pravá strana nedává smysl). Označme $s'$ posloupnost z pravé strany; grafovost nezávisí na
      pořadí členů, proto ji můžeme kdykoli přerovnat.

      **(⇐)** Nechť $s'$ je grafová, tj. existuje graf $G'$ na uzlech $x_2, \dots, x_n$ se stupni
      $d(x_i) = s_i - 1$ pro $2 \le i \le s_1 + 1$ a $d(x_i) = s_i$ pro $i \ge s_1 + 2$. Přidáme nový uzel
      $x_1$ a spojíme jej hranou s uzly $x_2, \dots, x_{s_1+1}$. Uzel $x_1$ má stupeň $s_1$ a stupně
      jeho sousedů vzrostou o 1, takže nový graf má soubor stupňů $s$.

      **(⇒)** Nechť $s$ je grafová. Mezi všemi grafy $G$ na uzlech $x_1, \dots, x_n$ s $d_G(x_i) = s_i$
      vyberme takový, v němž má $x_1$ **co nejvíce** sousedů v množině $M = \{x_2, \dots, x_{s_1+1}\}$.
      Tvrdíme, že $x_1$ sousedí se všemi uzly z $M$.

      Kdyby ne, existuje $x_i \in M$ nesousedící s $x_1$, a protože $d(x_1) = s_1 = |M|$, existuje
      soused $x_j$ uzlu $x_1$ mimo $M$, tj. $j > s_1 + 1$, a tedy $s_i \ge s_j$.
      Ukážeme, že existuje uzel $x_k \ne x_j$, který sousedí s $x_i$, ale ne s $x_j$:

      - je-li $x_i x_j$ hrana, má $N(x_i) \setminus \{x_j\}$ celkem $s_i - 1$ prvků, kdežto
        $N(x_j) \setminus \{x_1, x_i\}$ jen $s_j - 2 < s_i - 1$ prvků;
      - není-li, má $N(x_i)$ celkem $s_i$ prvků a $N(x_j) \setminus \{x_1\}$ jen $s_j - 1 < s_i$ prvků.

      V obou případech takové $x_k$ existuje (a $x_k \ne x_1$, protože $x_1 \notin N(x_i)$).
      Nyní hrany $\{x_1, x_j\}$, $\{x_i, x_k\}$ odebereme a přidáme $\{x_1, x_i\}$, $\{x_j, x_k\}$
      (ty v grafu nebyly). Stupně všech uzlů se nezmění, ale $x_1$ má v $M$ o jednoho souseda víc –
      spor s volbou $G$.

      Tedy $x_1$ sousedí přesně s uzly $x_2, \dots, x_{s_1+1}$ a graf $G - x_1$ má soubor stupňů $s'$
      (až na pořadí), takže $s'$ je grafová. $\square$
    proof_steps:
      - "(⇐) Z grafu realizujícího zkrácenou posloupnost dostaneme graf pro s přidáním nového uzlu spojeného s uzly x_2, …, x_{s_1+1}."
      - "(⇒) Mezi všemi realizacemi posloupnosti s vybereme tu, v níž má x_1 nejvíce sousedů mezi uzly x_2, …, x_{s_1+1}."
      - Pokud x_1 nesousedí s nějakým x_i z této množiny, musí sousedit s nějakým x_j mimo ni, přičemž d(x_i) ≥ d(x_j).
      - Porovnáním okolí najdeme uzel x_k sousedící s x_i, ale nesousedící s x_j.
      - Záměnou hran {x_1,x_j}, {x_i,x_k} za {x_1,x_i}, {x_j,x_k} se stupně nezmění, ale x_1 získá dalšího souseda v množině – spor s volbou grafu.
      - Tedy x_1 sousedí právě s x_2, …, x_{s_1+1} a odebráním x_1 dostaneme realizaci zkrácené posloupnosti.
    examples:
      - title: Grafová a negrafová posloupnost
        body: |
          **$3,3,2,2,2$:** odebereme $3$ a první tři následující členy zmenšíme o 1: $2,1,1,2$,
          seřadíme $2,2,1,1$. Odebereme $2$: $1,0,1$, seřadíme $1,1,0$. Odebereme $1$: $0,0$ –
          to je soubor stupňů grafu se dvěma izolovanými uzly. Posloupnost **je grafová**
          (realizuje ji např. kružnice $C_5$ s jednou přidanou „tětivou").

          **$3,3,3,1$:** součet je sudý ($10$), ale: odebereme $3$: $2,2,0$; odebereme $2$: $1,-1$ –
          záporné číslo, posloupnost **není grafová**.
    illustrations:
      - title: Záměna hran nezmění stupně
        for: proof
        graph:
          directed: false
          nodes:
            - { id: x1, x: 0.5, y: 6 }
            - { id: x2, x: 4.5, y: 2.5 }
            - { id: x3, x: 4.5, y: 9.5 }
            - { id: x4, x: 1.5, y: 0.5 }
            - { id: x5, x: 9.5, y: 3 }
          edges:
            - { from: x1, to: x2 }
            - { from: x1, to: x4 }
            - { from: x2, to: x3 }
            - { from: x3, to: x5 }
        steps:
          - caption: |
              Graf realizuje posloupnost $2, 2, 2, 1, 1$ (uzly $x_1, \dots, x_5$, popisky jsou stupně). Uzel $x_1$ má $s_1 = 2$, takže chceme, aby sousedil s $M = \{x_2, x_3\}$. Jeho soused $x_4$ ale leží mimo $M$.
            labels: { x1: "2", x2: "2", x3: "2", x4: "1", x5: "1" }
            nodes: { x1: active, x2: frontier, x3: frontier }
          - caption: |
              $x_i = x_3 \in M$ s $x_1$ nesousedí, $x_j = x_4 \notin M$ ano. Protože $d(x_3) \ge d(x_4)$, má $x_3$ souseda $x_k = x_5$, který s $x_4$ nesousedí. Hrany $x_1x_4$ a $x_3x_5$ označíme k odebrání.
            labels: { x1: "2", x2: "2", x3: "2", x4: "1", x5: "1" }
            nodes: { x1: active, x3: frontier, x4: rejected, x5: path }
            edges: { x1-x4: rejected, x3-x5: rejected }
          - caption: |
              Nahradíme je hranami $x_1x_3$ a $x_4x_5$. Každý ze čtyř uzlů jednu hranu ztratil a jednu získal, stupně $2, 2, 2, 1, 1$ se tedy nezměnily – ale $x_1$ má v $M$ o souseda víc. To je spor s volbou grafu, kde jich má nejvíc.
            remove: [[x1, x4], [x3, x5]]
            add: [[x1, x3], [x4, x5]]
            labels: { x1: "2", x2: "2", x3: "2", x4: "1", x5: "1" }
            nodes: { x1: active, x2: frontier, x3: frontier }
            edges: { x1-x3: active, x4-x5: active }
          - caption: |
              Teď $x_1$ sousedí přesně s $M$. Odebereme ho i s jeho hranami: stupně $x_2, x_3$ klesnou o 1 a zbylé uzly realizují zkrácenou posloupnost $1, 1, 1, 1$.
            remove: [[x1, x2], [x1, x3]]
            labels: { x2: "1", x3: "1", x4: "1", x5: "1" }
            nodes: { x1: rejected }
    related: [def-soubor-stupnu, alg-test-grafove-posloupnosti, thm-soucet-stupnu]
    source: "přednáška 1, folie 7"
    supplemented: false

  - id: alg-test-grafove-posloupnosti
    kind: algorithm
    section: "0.2"
    title: Test grafovosti posloupnosti (opakované užití věty o skóre)
    terms: [test grafovosti, algoritmus Havel-Hakimi, skóre, grafová posloupnost]
    statement: |
      Vstup: nerostoucí posloupnost přirozených čísel $s_1 \ge \dots \ge s_n$.
      Výstup: ANO, je-li posloupnost grafová (a případně graf, který ji realizuje), jinak NE.
    pseudocode: |
      1. Je-li posloupnost tvořena samými nulami, odpověz **ANO** (graf bez hran).
      2. Je-li $s_1 > n - 1$ nebo se v posloupnosti vyskytuje záporné číslo, odpověz **NE**.
      3. Odeber první člen $s_1$ a o 1 zmenši následujících $s_1$ členů.
      4. Zbylou posloupnost seřaď nerostoucím způsobem a pokračuj krokem 1.
    complexity: "$O(n^2 \\log n)$ (naivně), resp. $O(n^2)$"
    intuition: |
      Správnost plyne přímo z [věty o skóre](#thm-skore): každý krok zachovává odpověď
      (grafová ⇔ grafová) a délka posloupnosti klesá o 1, po nejvýše $n$ krocích tedy skončíme.
      Každý krok stojí $O(n)$ na odečtení a $O(n \log n)$ na seřazení (protože se mění jen
      souvislý úsek, stačí ve skutečnosti $O(n)$ sléváním), celkem $O(n^2 \log n)$, resp. $O(n^2)$.

      Zapamatujeme-li si, které uzly jsme v kroku 3 spojili, dostaneme rovnou i graf s daným skóre.
    related: [thm-skore, def-soubor-stupnu]
    source: "odvozeno z věty o skóre (přednáška 1, folie 7)"
    supplemented: true

  # ------------------------------------------------------------------ 0.3
  - id: def-podgraf
    kind: definition
    label: Definice
    section: "0.3"
    title: Podgraf, faktor, indukovaný podgraf
    terms: [podgraf, faktor, faktor grafu, indukovaný podgraf, spanning subgraph, G1 ⊂ G]
    statement: |
      Buďte $G_1, G$ grafy. Řekneme, že

      - $G_1$ je **podgrafem** grafu $G$, jestliže $U(G_1) \subset U(G)$ a $H(G_1) \subset H(G)$,
      - $G_1$ je **faktorem** grafu $G$, jestliže $U(G_1) = U(G)$ a $H(G_1) \subset H(G)$.

      Buď $X \subset U(G)$. Graf $G_1 = \left(X, H(G) \cap \binom{X}{2}\right)$ se nazývá
      **podgraf grafu $G$ indukovaný na množině $X$**.

      Je-li $G_1$ podgrafem grafu $G$, značíme $G_1 \subset G$.
    intuition: |
      Podgraf vznikne vynecháním některých uzlů a hran (hrana smí zůstat jen tehdy, zůstaly-li
      oba její konce – jinak by $G_1$ nebyl graf). Faktor má **všechny uzly** a jen část hran
      (anglicky *spanning subgraph*). Indukovaný podgraf na $X$ obsahuje z $G$ **všechny** hrany
      mezi uzly z $X$ – je to „největší" podgraf s množinou uzlů $X$.

      Značení: $G - u$ je podgraf indukovaný na $U(G) \setminus \{u\}$ (odebrání uzlu i se všemi
      jeho hranami), $G - h$ je faktor vzniklý odebráním hrany $h$.
    illustrations:
      - title: Podgraf, indukovaný podgraf a faktor
        graph:
          directed: false
          nodes:
            - { id: a, x: 5, y: 0.5 }
            - { id: b, x: 9.5, y: 3.5 }
            - { id: c, x: 8, y: 9 }
            - { id: d, x: 2, y: 9 }
            - { id: e, x: 0.5, y: 3.5 }
          edges:
            - { from: a, to: b }
            - { from: b, to: c }
            - { from: c, to: d }
            - { from: d, to: e }
            - { from: e, to: a }
            - { from: a, to: c }
            - { from: a, to: d }
        steps:
          - caption: |
              Výchozí graf $G$ s pěti uzly a sedmi hranami.
          - caption: |
              **Podgraf** na uzlech $\{a, b, c\}$ s hranami $ab, bc$. Indukovaný **není**: hrana $ac$ vede v $G$ mezi vybranými uzly, ale do podgrafu jsme ji nevzali.
            nodes: { a: active, b: active, c: active }
            edges: { a-b: active, b-c: active, c-d: dim, d-e: dim, e-a: dim, a-c: dim, a-d: dim }
          - caption: |
              **Indukovaný podgraf** na $X = \{a, b, c\}$ obsahuje **všechny** hrany grafu $G$ mezi uzly z $X$, tedy i $ac$. Je to největší podgraf s množinou uzlů $X$.
            nodes: { a: active, b: active, c: active }
            edges: { a-b: active, b-c: active, a-c: active, c-d: dim, d-e: dim, e-a: dim, a-d: dim }
          - caption: |
              **Faktor** má všechny uzly grafu $G$ a jen část hran. Tento faktor je navíc souvislý a bez kružnic, takže je to kostra.
            nodes: { a: active, b: active, c: active, d: active, e: active }
            edges: { a-b: active, a-c: active, c-d: active, d-e: active, b-c: dim, e-a: dim, a-d: dim }
    related: [def-kostra, def-komponenta, def-homomorfni-obraz]
    source: "přednáška 1, folie 8"
    supplemented: false

  - id: def-homomorfni-obraz
    kind: definition
    label: Definice
    section: "0.3"
    title: Homomorfní obraz grafu
    terms: [homomorfní obraz, obraz grafu, obraz při homomorfismu]
    statement: |
      Nechť $f : G_1 \to G$ je homomorfismus. Podgraf $f(G_1) \subset G$ definovaný předpisem

      $$
      f(G_1) = \left(f(U(G_1)),\ f^*(H(G_1))\right)
      $$

      se nazývá **obraz grafu $G_1$ při homomorfismu $f$** („homomorfní obraz").
    intuition: |
      Obraz tvoří ty uzly a hrany grafu $G$, „na které $G_1$ dopadne". Je to opravdu podgraf
      grafu $G$ – díky tomu, že $f$ je homomorfismus, leží obrazy hran v $H(G)$.
      Tímto pojmem se definují sledy, tahy, cesty a kružnice: jsou to obrazy $P_k$ resp. $C_k$.
    related: [def-homomorfismus, def-sled-tah-cesta, def-uzavreny-sled-kruznice]
    source: "přednáška 1, folie 8"
    supplemented: false

  - id: def-sled-tah-cesta
    kind: definition
    label: Definice
    section: "0.3"
    title: Sled, tah, cesta
    terms: [sled, tah, cesta, délka sledu, walk, trail, path, sled z u do v]
    statement: |
      1. Buď $G$ graf, $u, v \in U(G)$, a nechť $f : P_k \to G$ je homomorfismus takový, že
         $f(0) = u$ a $f(k) = v$. Pak se graf $f(P_k)$ nazývá **sled délky $k$ z uzlu $u$ do uzlu $v$** v grafu $G$.
      2. Je-li navíc $f$ hranový monomorfismus, pak se $f(P_k)$ nazývá **tah** (délky $k$ z $u$ do $v$ v $G$).
      3. Je-li navíc $f$ uzlový monomorfismus, pak se $f(P_k)$ nazývá **cesta** (délky $k$ z $u$ do $v$ v $G$).
    intuition: |
      Představte si procházku po grafu $u = f(0), f(1), \dots, f(k) = v$, kde každé dva po sobě
      jdoucí uzly sousedí.

      - **Sled**: uzly i hrany se smějí opakovat.
      - **Tah**: neopakuje se žádná **hrana** (uzly ano).
      - **Cesta**: neopakuje se žádný **uzel** (a tedy ani hrana).

      Každá cesta je tah a každý tah je sled. Délka se měří počtem hran ($k$), ne uzlů.
      Formálně je sled podgraf (obraz), ale při práci si jej představujeme jako posloupnost
      uzlů $f(0), \dots, f(k)$.
    illustrations:
      - title: Cesta, tah a sled v motýlku
        graph:
          directed: false
          nodes:
            - { id: a, x: 0.5, y: 1 }
            - { id: b, x: 0.5, y: 9 }
            - { id: c, x: 5, y: 5 }
            - { id: d, x: 9.5, y: 1 }
            - { id: e, x: 9.5, y: 9 }
          edges:
            - { from: a, to: b }
            - { from: b, to: c }
            - { from: c, to: a }
            - { from: c, to: d }
            - { from: d, to: e }
            - { from: e, to: c }
        steps:
          - caption: |
              **Cesta** $b, a, c, d$ délky 3: žádný uzel se neopakuje. Čísla u hran udávají pořadí kroků.
            nodes: { b: source, d: sink }
            edges: { b-a: path, a-c: path, c-d: path }
            edge_labels: { b-a: "1", a-c: "2", c-d: "3" }
          - caption: |
              **Tah** $b, a, c, d, e, c$ délky 5: uzlem $c$ projdeme dvakrát, ale žádnou hranou dvakrát. Je to tah, ne cesta.
            nodes: { b: source, c: active }
            edges: { b-a: path, a-c: path, c-d: path, d-e: path, e-c: path }
            edge_labels: { b-a: "1", a-c: "2", c-d: "3", d-e: "4", e-c: "5" }
          - caption: |
              **Sled** $a, c, d, c, e$: hranou $cd$ projdeme tam i zpět (kroky 2 a 3), takže to není ani tah. Vystřižením úseku $c, d, c$ dostaneme cestu $a, c, e$ – proto z každého sledu jde vyrobit cestu se stejnými konci.
            nodes: { a: source, e: sink }
            edges: { a-c: path, c-d: rejected, c-e: path }
            edge_labels: { a-c: "1", c-d: "2, 3", c-e: "4" }
    related: [def-homomorfni-obraz, def-druhy-homomorfismu, def-souvisly-graf, def-uzavreny-sled-kruznice]
