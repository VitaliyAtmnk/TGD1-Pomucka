  - id: alg-jarnik-prim
    kind: algorithm
    label: Algoritmus 2
    section: "0.6"
    title: Algoritmus 2 – Jarníkův (Primův) algoritmus
    terms: [algoritmus 2, Jarníkův algoritmus, Primův algoritmus, Jarník-Prim, minimální kostra, růst stromu]
    statement: |
      Vstup: souvislý ohodnocený graf $G$. Výstup: minimální kostra grafu $G$.
      Algoritmus nechává růst strom z jednoho uzlu; v každém kroku k němu připojí nejlehčí hranu
      vedoucí ze stromu ven.
    pseudocode: |
      1. Zvol $u \in U(G)$ a polož $G_0 = (\{u\}, \emptyset)$, $i := 0$.
      2. Je $G_i$ faktor grafu $G$?
         - **Ne:** mezi všemi hranami $\{x,y\}$, pro něž $x \in U(G_i)$ a $y \notin U(G_i)$, najdi tu,
           která má nejmenší ohodnocení, polož
           $G_{i+1} = (U(G_i) \cup \{y\},\ H(G_i) \cup \{\{x,y\}\})$, $i := i + 1$ a opakuj krok 2.
         - **Ano:** $G_i$ je hledaná minimální kostra.
    complexity: "$O(n^2)$ (s haldou $O(m \\log n)$)"
    intuition: |
      Strom roste jako krystal: vždy přibere nejbližší dosud nepřipojený uzel. Proběhne přesně
      $n - 1$ kroků. Uchováváme-li pro každý nepřipojený uzel $y$ hodnotu
      $\lambda(y) = \min\{w(\{x,y\}) \mid x \in U(G_i)\}$, je výběr minima $O(n)$ a aktualizace po připojení
      uzlu $y$ stojí $O(d(y))$, celkem tedy $O(n^2)$ – optimální pro husté grafy zadané maticí. S binární
      haldou dostaneme $O(m \log n)$.

      Algoritmus objevil V. Jarník (1930), později nezávisle R. C. Prim (1957) – proto „Jarníkův" nebo „Primův".
      Je velmi podobný Dijkstrovu algoritmu; rozdíl je v tom, **co** se minimalizuje: Jarník bere vzdálenost
      uzlu od *stromu* (váhu jedné hrany), Dijkstra vzdálenost od *startovního uzlu* (délku celé cesty).
    proof: |
      *Důkaz správnosti není ve foliích, doplněno.*

      **Invariant:** $G_i$ je strom a existuje minimální kostra $T$ grafu $G$ s $G_i \subset T$.

      - Pro $G_0 = (\{u\}, \emptyset)$ platí triviálně.
      - Nechť platí pro $G_i$, $A = U(G_i) \ne U(G)$. Graf $G$ je souvislý, takže nějaká hrana vede z $A$ ven;
        nechť $e = \{x, y\}$ je vybraná nejlehčí z nich. Přidáním listu $y$ zůstane $G_{i+1}$ stromem.
        Žádná hrana $G_i$ nevede mezi $A$ a $U(G) \setminus A$, a podle [řezové vlastnosti](#lemma-mst-rez)
        existuje minimální kostra obsahující $G_i$ i $e$, tedy $G_{i+1}$.

      **Konečnost:** v každém kroku přibude uzel, po $n - 1$ krocích je $G_i$ faktorem.

      **Výsledek:** $G_{n-1}$ je strom a faktor, tj. kostra, obsažená v minimální kostře $T$; obě mají
      $n - 1$ hran, proto $G_{n-1} = T$. $\square$
    proof_steps:
      - Invariant – G_i je strom obsažený v nějaké minimální kostře grafu G.
      - Dokud G_i není faktor, vede ze souvislosti G aspoň jedna hrana z U(G_i) ven a algoritmus vybere nejlehčí z nich.
      - Podle řezové vlastnosti existuje minimální kostra obsahující G_i i vybranou hranu, takže invariant platí i pro G_{i+1}.
      - V každém kroku přibude jeden uzel, takže po n − 1 krocích je G_i faktorem grafu G.
      - Výsledný strom je kostra obsažená v minimální kostře se stejným počtem hran, a je s ní tedy totožný.
    examples:
      - title: Jarníkův algoritmus ze startu v uzlu a
        body: |
          Na grafu z příkladu u Algoritmu 1, start v $a$:

          | krok | uzly stromu | kandidáti (hrana: váha) | vybráno |
          |---|---|---|---|
          | 1 | $a$ | $ab$:4, $ad$:2 | $ad$ (2) |
          | 2 | $a,d$ | $ab$:4, $db$:5, $de$:8 | $ab$ (4) |
          | 3 | $a,d,b$ | $bc$:6, $be$:3, $bf$:7, $de$:8 | $be$ (3) |
          | 4 | $a,d,b,e$ | $bc$:6, $bf$:7, $ef$:9 | $bc$ (6) |
          | 5 | $a,d,b,e,c$ | $cf$:1, $bf$:7, $ef$:9 | $cf$ (1) |

          Minimální kostra má váhu $2+4+3+6+1 = 16$. Všimněte si, že nejlehčí hrana $cf$ přibyla až na konci –
          Jarník ji „vidí", až když se strom přiblíží.
        graph:
          directed: false
          nodes:
            - { id: a, x: 0, y: 2 }
            - { id: b, x: 4, y: 0 }
            - { id: c, x: 8, y: 2 }
            - { id: d, x: 0, y: 7 }
            - { id: e, x: 4, y: 9 }
            - { id: f, x: 8, y: 7 }
          edges:
            - { from: a, to: b, w: 4 }
            - { from: b, to: c, w: 6 }
            - { from: a, to: d, w: 2 }
            - { from: b, to: d, w: 5 }
            - { from: b, to: e, w: 3 }
            - { from: b, to: f, w: 7 }
            - { from: c, to: f, w: 1 }
            - { from: d, to: e, w: 8 }
            - { from: e, to: f, w: 9 }
