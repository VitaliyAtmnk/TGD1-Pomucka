              Odebereme jinou hranu této kružnice, $ab$. Souvislost zůstane – zbytek kružnice ji „jistí“ – a dostaneme **jiný** strom na stejných uzlech.
            remove: [[a, b]]
          - caption: |
              Ve stromu je ale každá hrana most: odebráním $cf$ se graf rozpadne na dvě komponenty. Strom je minimálně souvislý (bod 4).
            remove: [[c, f]]
          - caption: |
              S hranou $bf$ máme opět $m = 6 = n - 1$, ale vznikla kružnice $b, e, f$ a $\{a, c\}$ zůstává odtržená. Samotná rovnost $m = n - 1$ bez souvislosti na strom nestačí.
            add: [[b, f]]
    related: [def-strom, prop-vlastnosti-souvislych, prop-souvislost-cesta, def-kostra]
