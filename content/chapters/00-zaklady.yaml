id: zaklady
number: 0
title: Základní pojmy, souvislost, stromy a kostry
source: "Přednáška 1 (TGD1-01-folie, str. 3–12); navazuje na KMA/DMA"
exam_questions: [1]
summary: |
  Úvodní kapitola zavádí jazyk, kterým se v celém předmětu mluví: graf, homomorfismus
  a isomorfismus, stupně uzlů a skóre grafu, podgrafy, sledy, tahy a cesty, souvislost
  a komponenty. Vrcholem je charakterizace stromů, existence kostry a algoritmy pro
  hledání **minimální kostry** ohodnoceného grafu (Algoritmus 1 – odstraňování
  nejdražších hran kružnic, Algoritmus 2 – Jarníkův/Primův algoritmus, a pro úplnost
  i Kruskalův algoritmus) včetně důkazů správnosti a složitosti.
