  - id: def-kostra
    kind: definition
    label: Definice
    section: "0.4"
    title: Kostra grafu
    terms: [kostra, kostra grafu, spanning tree, faktor strom]
    statement: |
      Buď $G$ souvislý graf. Graf $T \subset G$ se nazývá **kostra** grafu $G$, jestliže

      1. $T$ je strom,
      2. $T$ je faktor grafu $G$.
    intuition: |
      Kostra je „úsporná páteř" grafu: obsahuje všechny uzly a jen tolik hran, aby zůstal graf
      souvislý – přesně $n - 1$. Graf má obvykle mnoho koster (např. $K_n$ jich má $n^{n-2}$, Cayleyho
      vzorec). Kostru lze najít prohledáním grafu (strom BFS/DFS) v čase $O(n + m)$.
    examples:
      - title: Kostra grafu
        body: |
          Ve čtverci s úhlopříčkou (uzly $a,b,c,d$, hrany $ab, bc, cd, da, ac$) je kostrou např.
          $\{ab, bc, cd\}$ nebo $\{ac, ab, ad\}$ – každá má 3 = $n - 1$ hran. Množina $\{ab, bc, ca\}$
          kostrou není (obsahuje kružnici a nepokrývá $d$).
    illustrations:
      - title: Co je a co není kostra
        property: spanning-tree
        graph:
          directed: false
          nodes:
            - { id: a, x: 1, y: 1 }
            - { id: b, x: 7, y: 1 }
            - { id: c, x: 7, y: 6 }
            - { id: d, x: 1, y: 6 }
            - { id: e, x: 4, y: 9.5 }
          edges:
            - { from: a, to: b }
            - { from: b, to: c }
            - { from: c, to: d }
            - { from: d, to: a }
            - { from: a, to: c }
            - { from: c, to: e }
            - { from: d, to: e }
        steps:
          - caption: |
              Hrany $ab, bc, cd, de$ propojí všech 5 uzlů a kružnici netvoří – je to kostra se $4 = n - 1$ hranami.
            edge_set: [a-b, b-c, c-d, d-e]
          - caption: |
              Kostra není jediná: kostrou je i „hvězda“ kolem $a$ doplněná hranou $ce$. Každá kostra má ale stejný počet hran, $n - 1$.
            edge_set: [a-b, a-c, a-d, c-e]
          - caption: |
              Také 4 hrany, ale tvoří kružnici $a, b, c$ a uzel $d$ zůstal nepřipojený. Správný počet hran sám nestačí.
            edge_set: [a-b, b-c, a-c, c-e]
          - caption: |
              Tři hrany jsou málo: vzniknou dvě komponenty $\{a, b\}$ a $\{c, d, e\}$. Kostra musí být souvislá **a** bez kružnic.
            edge_set: [a-b, c-d, d-e]
    related: [def-strom, prop-existence-kostry, def-minimalni-kostra]
    source: "přednáška 1, folie 10"
    supplemented: false

  - id: prop-existence-kostry
    kind: proposition
    label: Větička
    section: "0.4"
    title: Existence kostry
    terms: [existence kostry, kostra]
    statement: |
      V každém souvislém grafu existuje alespoň jedna kostra.
    intuition: |
      Z grafu stačí odebírat hrany ležící na kružnicích, dokud nějaká kružnice zbývá – souvislost
      se tím neporuší a na konci zbude strom. Právě tuto myšlenku (s ohledem na ohodnocení) používá
      Algoritmus 1 pro minimální kostru.
    proof: |
      *Důkaz není ve foliích, doplněno.*

      Buď $G$ souvislý. Množina souvislých faktorů grafu $G$ je neprázdná (obsahuje $G$) a konečná,
      vyberme tedy souvislý faktor $T$ s **nejmenším počtem hran**. Pak $T$ nemá žádný souvislý vlastní
      faktor (ten by byl souvislým faktorem $G$ s menším počtem hran). Podle
      [charakterizace stromů](#thm-charakterizace-stromu) (4 ⇒ 1) je $T$ strom, a protože je faktorem $G$,
      je to kostra. $\square$
    proof_steps:
      - Souvislých faktorů grafu G je konečně mnoho a aspoň jeden existuje (samotné G).
      - Zvolíme souvislý faktor T s nejmenším počtem hran.
      - T nemá souvislý vlastní faktor, jinak bychom našli souvislý faktor G s menším počtem hran.
      - Podle charakterizace stromů (bod 4) je T strom, a tedy kostra grafu G.
    related: [def-kostra, thm-charakterizace-stromu, thm-minimalni-souvisly-faktor]
    source: "přednáška 1, folie 10"
    supplemented: false

  # ------------------------------------------------------------------ 0.5
  - id: def-ohodnoceny-graf
    kind: definition
    label: Definice
    section: "0.5"
    title: Ohodnocený graf, vážená matice sousednosti
    terms: [ohodnocení, hranové ohodnocení, ohodnocený graf, váha hrany, vážená matice sousednosti, W(G)]
    statement: |
      Buď $G$ graf. Funkce $w : H(G) \to (0, \infty)$ se nazývá **(hranové) ohodnocení** grafu $G$;
      graf se zadaným ohodnocením se nazývá **ohodnocený graf**.

      Nechť $G$ je ohodnocený graf s uzly očíslovanými $1, \dots, n$. Pro $1 \le i, j \le n$ položme
      $$
      w_{ij} = \begin{cases} w(\{i,j\}) & \text{jestliže } \{i,j\} \in H(G),\\ 0 & \text{jinak.} \end{cases}
      $$
      Matice $\mathbf{W}(G) = [w_{ij}]_{i,j=1}^n$ se nazývá **vážená matice sousednosti** grafu $G$.

      Neohodnocený graf považujeme za ohodnocený $w_{ij} = 1$ (pro všechny hrany).
    intuition: |
      Váhy jsou délky silnic, ceny, časy… Důležité: v TGD1 jsou váhy **kladné** – na tom stojí
      např. věta o minimálním souvislém faktoru i správnost Dijkstrova algoritmu. Nula v matici
      $\mathbf{W}(G)$ znamená „hrana neexistuje", proto nulové váhy nedávají smysl.
    related: [def-matice-sousednosti, thm-minimalni-souvisly-faktor, def-minimalni-kostra, def-w-delka-vzdalenost]
    source: "přednáška 1, folie 11"
    supplemented: false

  - id: def-matice-sousednosti
    kind: definition
    label: Definice
    section: "0.5"
    title: Matice sousednosti
    terms: [matice sousednosti, adjacency matrix, A(G)]
    statement: |
      **Matice sousednosti** neorientovaného grafu $G$ s uzly $1, \dots, n$ je
      $\mathbf{A}(G) = [a_{ij}]_{i,j=1}^n$, kde
      $$
      a_{ij} = \begin{cases} 1 & \text{jestliže } \{i,j\} \in H(G),\\ 0 & \text{jinak.} \end{cases}
      $$
    intuition: |
      Pro neorientovaný graf je $\mathbf{A}(G)$ symetrická s nulami na diagonále a řádkové součty
      jsou stupně uzlů. Paměť $O(n^2)$ – výhodná pro husté grafy, pro řídké se používají seznamy sousedů
      ($O(n + m)$). Mocniny matice sousednosti počítají sledy dané délky
      (viz [větu o mocninách](#thm-mocniny-matice-sousednosti)).
    related: [def-ohodnoceny-graf, def-matice-incidence, thm-incidence-sousednost, thm-mocniny-matice-sousednosti]
    source: "přednáška 1, folie 11"
    supplemented: false

  - id: def-matice-incidence
    kind: definition
    label: Definice
    section: "0.5"
    title: Matice incidence (uzlo-hranová)
    terms: [matice incidence, incidenční matice, uzlo-hranová matice, I(G)]
    statement: |
      Očíslujme uzly $u_1, \dots, u_n$ a hrany $h_1, \dots, h_m$ grafu $G$. **Matice incidence**
      (uzlo-hranová) je $\mathbf{I}(G) = [b_{ij}]$ typu $n \times m$, kde
      $$
      b_{ij} = \begin{cases} 1 & \text{jestliže } u_i \in h_j,\\ 0 & \text{jinak.} \end{cases}
      $$
    intuition: |
      Řádky odpovídají uzlům, sloupce hranám. V každém sloupci jsou právě dvě jedničky (dva konce hrany),
      součet $i$-tého řádku je stupeň $d_G(u_i)$. Součet všech prvků spočítaný po řádcích a po sloupcích
      dává znovu $\sum d_G(u) = 2m$.
    related: [def-matice-sousednosti, thm-incidence-sousednost, thm-soucet-stupnu]
    source: "přednáška 1, folie 11"
    supplemented: false

  - id: thm-incidence-sousednost
    kind: theorem
    label: Věta
    section: "0.5"
    title: Vztah matice incidence a matice sousednosti
    terms: [matice incidence, matice sousednosti, I I^T, matice stupňů]
    statement: |
      Pro neorientovaný graf $G$ platí
      $$
      \mathbf{I}(G)\,(\mathbf{I}(G))^T = \mathbf{A}(G) + \mathbf{S}(G),
      $$
      kde $\mathbf{S}(G) = \operatorname{diag}(d_G(u_1), \dots, d_G(u_n))$.
    intuition: |
      Prvek $(i,j)$ součinu je skalární součin řádků $i$ a $j$ matice incidence – počítá hrany,
      které obsahují **oba** uzly $u_i$ a $u_j$. Pro $i = j$ jsou to všechny hrany u uzlu (stupeň),
      pro $i \ne j$ nejvýše jedna hrana $\{u_i, u_j\}$ (sousednost).
    proof: |
      *Důkaz není ve foliích, doplněno.*

      Prvek na pozici $(i,j)$ matice $\mathbf{I}\mathbf{I}^T$ je
      $$
      \sum_{k=1}^m b_{ik}\, b_{jk},
      $$
      a součin $b_{ik} b_{jk}$ je roven 1 právě tehdy, když hrana $h_k$ obsahuje oba uzly $u_i$ i $u_j$.
      Součet je tedy počet hran obsahujících zároveň $u_i$ a $u_j$.

      - Pro $i = j$ jde o počet hran obsahujících $u_i$, tj. $d_G(u_i)$ – to je diagonální prvek $\mathbf{S}(G)$
        (a $a_{ii} = 0$).
      - Pro $i \ne j$ obsahuje oba uzly jen hrana $\{u_i, u_j\}$, pokud existuje (hrana má právě dva konce
        a násobné hrany nejsou). Prvek je tedy 1 nebo 0 podle toho, zda $u_i, u_j$ sousedí, tj. $a_{ij}$
        (a mimodiagonální prvky $\mathbf{S}(G)$ jsou nulové). $\square$
    proof_steps:
      - Prvek (i,j) součinu I·I^T je součet součinů b_ik·b_jk přes všechny hrany h_k.
      - Součin b_ik·b_jk je 1 právě tehdy, když hrana h_k obsahuje oba uzly u_i a u_j, takže prvek počítá společné hrany.
      - Na diagonále (i = j) dostaneme počet hran u uzlu u_i, tedy jeho stupeň.
      - Mimo diagonálu (i ≠ j) může oba uzly obsahovat jen hrana {u_i, u_j}, takže dostaneme prvek a_ij matice sousednosti.
    related: [def-matice-incidence, def-matice-sousednosti, def-stupen-uzlu]
    source: "přednáška 1, folie 11"
    supplemented: false

  # ------------------------------------------------------------------ 0.6
  - id: def-minimalni-kostra
    kind: definition
    section: "0.6"
    title: Minimální kostra
    terms: [minimální kostra, minimum spanning tree, MST, nejlevnější kostra, váha kostry]
    statement: |
      Buď $G$ souvislý ohodnocený graf. **Váha** podgrafu $K \subset G$ je
      $w(K) = \sum_{\{i,j\} \in H(K)} w_{ij}$. Kostra grafu $G$ s nejmenší vahou mezi všemi kostrami
      grafu $G$ se nazývá **minimální kostra** grafu $G$.
    intuition: |
      Úloha: propojit všechna města (uzly) sítí (vodovod, elektřina, optika) tak, aby celková cena
      byla co nejmenší. Minimální kostra existuje vždy (koster je konečně mnoho), ale nemusí být
      jediná – jednoznačná je, jsou-li všechny váhy různé.

      Pozor na záměnu s **minimální cestou**: minimální kostra nemusí obsahovat nejkratší cestu mezi
      dvěma danými uzly.
    related: [thm-minimalni-souvisly-faktor, alg-mst-odstranovani-kruznic, alg-jarnik-prim, alg-kruskal, lemma-mst-rez]
    source: "přednáška 1, folie 12 (nadpis Minimální kostra grafu; pojem definován implicitně)"
    supplemented: false

  - id: thm-minimalni-souvisly-faktor
    kind: theorem
    label: Věta
    section: "0.6"
    title: Nejlevnější souvislý faktor je kostra
    terms: [minimální souvislý faktor, minimální kostra, kladné ohodnocení]
    statement: |
      Buď $G$ souvislý ohodnocený graf a $K$ jeho souvislý faktor, pro který číslo
      $\sum_{\{i,j\} \in H(K)} w_{ij}$ nabývá minimální hodnoty. Pak $K$ je kostra grafu $G$.
    intuition: |
      Chceme-li co nejlevněji propojit všechny uzly, nikdy se nevyplatí kružnice – její
      libovolnou hranu lze vynechat, propojení zůstane a ušetříme. Úloha „nejlevnější souvislý faktor"
      je proto totéž co „minimální kostra".

      Podstatné je, že váhy jsou **kladné**. Při nulových vahách by nejlevnější souvislý faktor mohl
      obsahovat kružnici (váha by se odebráním hrany nezměnila), při záporných vahách by se
      kružnice dokonce vyplatily.
    proof: |
      *Důkaz není ve foliích, doplněno.*

      $K$ je souvislý faktor, stačí tedy ukázat, že neobsahuje kružnici. Kdyby $K$ obsahoval kružnici $C$
      a $h$ byla hrana na $C$, pak $K - h$ je stále souvislý faktor grafu $G$: každý sled v $K$ používající
      hranu $h = \{x,y\}$ lze upravit tak, že hranu $h$ nahradíme zbytkem kružnice $C - h$, což je cesta
      z $x$ do $y$. Protože $w(h) > 0$, je
      $$
      w(K - h) = w(K) - w(h) < w(K),
      $$
      což je spor s minimalitou $K$. Tedy $K$ je souvislý bez kružnic, tj. strom, a jako faktor je kostrou $G$. $\square$
    proof_steps:
      - K je souvislý faktor, stačí ukázat, že neobsahuje kružnici.
      - Kdyby K obsahoval kružnici C s hranou h, zůstane K − h souvislý, protože h lze nahradit zbytkem kružnice.
      - Protože w(h) > 0, má K − h menší váhu než K, což je spor s minimalitou.
      - K je tedy souvislý bez kružnic, tj. strom, a jako faktor grafu G je to kostra.
    illustrations:
      - title: Hrana kružnice je zbytečný výdaj
        for: proof
        property: connected
        graph:
          directed: false
          nodes:
            - { id: a, x: 0.5, y: 1 }
            - { id: b, x: 0.5, y: 8.5 }
            - { id: c, x: 5, y: 8.5 }
            - { id: d, x: 5, y: 1 }
            - { id: e, x: 9.5, y: 5 }
          edges:
            - { from: a, to: b, w: 3 }
            - { from: b, to: c, w: 4 }
            - { from: c, to: d, w: 2 }
            - { from: d, to: a, w: 5 }
            - { from: c, to: e, w: 1 }
            - { from: d, to: e, w: 6 }
        steps:
          - caption: |
              Souvislý faktor $K$ s vahou $3 + 4 + 2 + 5 + 1 + 6 = 21$. Obsahuje kružnici $a, b, c, d$ – a ta se při kladných vahách nevyplatí.
            edges: { a-b: path, b-c: path, c-d: path, d-a: path }
          - caption: |
              Odebereme hranu $da$. Graf zůstane souvislý, protože z $d$ do $a$ vede zbytek kružnice $d, c, b, a$, a váha klesne o $w(da) = 5 > 0$ na 16. Faktor s kružnicí proto minimální být nemůže.
            remove: [[d, a]]
            edges: { d-c: path, c-b: path, b-a: path }
          - caption: |
              Stejně u kružnice $c, d, e$: bez hrany $de$ je váha 10 a graf je stále souvislý. Kružnice už žádná nezbyla – máme kostru.
            remove: [[d, e]]
          - caption: |
              Další hranu už odebrat nelze: $bc$ je most a bez ní se graf rozpadne. Nejlevnější souvislý faktor je proto strom, tedy kostra.
            remove: [[b, c]]
    related: [def-minimalni-kostra, prop-existence-kostry, alg-mst-odstranovani-kruznic]
    source: "přednáška 1, folie 12"
    supplemented: false

  - id: lemma-mst-rez
    kind: lemma
    section: "0.6"
    title: Řezová a kružnicová vlastnost minimální kostry
    terms: [řezová vlastnost, kružnicová vlastnost, cut property, cycle property, výměna hran, minimální kostra]
    statement: |
      Buď $G$ souvislý ohodnocený graf.

      1. **(Řez)** Buď $A \subset U(G)$, $\emptyset \ne A \ne U(G)$, a nechť $F$ je les, který je obsažen
         v nějaké minimální kostře grafu $G$ a jehož žádná hrana nevede mezi $A$ a $U(G) \setminus A$.
         Je-li $e$ hrana nejmenší váhy mezi všemi hranami s jedním koncem v $A$ a druhým mimo $A$, pak
         existuje minimální kostra obsahující $F$ i $e$.
      2. **(Kružnice)** Buď $G'$ souvislý faktor grafu $G$, $T$ minimální kostra grafu $G'$ a $h$ hrana
         maximální váhy na nějaké kružnici $C$ v $G'$. Pak existuje minimální kostra grafu $G'$, která
         neobsahuje $h$.
    intuition: |
      Obě vlastnosti stojí na **výměně hran**: přidáním hrany do kostry vznikne právě jedna kružnice
      a odebráním libovolné jiné hrany této kružnice dostaneme opět kostru. Je-li přidaná hrana
      lehčí (nebo stejně těžká) než odebraná, nová kostra není horší.

      Řezová vlastnost zdůvodňuje Jarníkův a Kruskalův algoritmus (bereme nejlehčí hranu přes řez),
      kružnicová vlastnost Algoritmus 1 (vyhazujeme nejtěžší hranu kružnice).
    proof: |
      *Lemma není ve foliích, doplněno jako pomocné tvrzení pro důkazy správnosti algoritmů.*

      **1.** Nechť $e = \{x,y\}$, $x \in A$, $y \notin A$, a $T$ je minimální kostra s $F \subset T$.
      Je-li $e \in H(T)$, jsme hotovi. Jinak v $T$ existuje cesta z $x$ do $y$; ta začíná v $A$ a končí
      mimo $A$, takže obsahuje hranu $f$ vedoucí mezi $A$ a $U(G) \setminus A$. Pak $f \notin F$
      a z volby $e$ plyne $w(e) \le w(f)$. Graf $T' = T - f + e$ je souvislý (cestu přes $f$ lze objet
      přes $e$ a zbytek kružnice v $T + e$) a má $n - 1$ hran, je to tedy kostra
      ([charakterizace stromů](#thm-charakterizace-stromu), bod 3). Platí $w(T') = w(T) - w(f) + w(e) \le w(T)$,
      takže $T'$ je také minimální a obsahuje $F$ i $e$.

      **2.** Je-li $h \notin T$, jsme hotovi. Jinak $T - h$ má dvě komponenty s množinami uzlů $A$
      a $U \setminus A$. Kružnice $C$ přechází mezi $A$ a $U \setminus A$ sudě-krát, a protože ji
      $h$ přechází jednou, obsahuje i jinou hranu $e \ne h$ mezi $A$ a $U \setminus A$; $e \notin T$
      (jediná hrana $T$ přes tento řez je $h$) a $w(e) \le w(h)$. Pak $T - h + e$ je kostra grafu $G'$
      s vahou nejvýše $w(T)$, tedy minimální, a neobsahuje $h$. $\square$
    proof_steps:
      - Je-li hledaná hrana už v minimální kostře T, není co dokazovat.
      - Jinak přidání hrany e do T vytvoří kružnici, která protíná uvažovaný řez ještě v jiné hraně f.
      - Z volby e (nejlehčí přes řez), resp. h (nejtěžší na kružnici), plyne vhodná nerovnost mezi vahami vyměňovaných hran.
      - Výměnou hran vznikne souvislý faktor s n − 1 hranami, tedy kostra.
      - Její váha není větší než váha T, takže je to opět minimální kostra s požadovanou vlastností.
    illustrations:
      - title: Výměna hrany přes řez
        for: proof
        property: spanning-tree
        graph:
          directed: false
          nodes:
            - { id: a, x: 0, y: 2 }
            - { id: b, x: 4, y: 0 }
            - { id: c, x: 8, y: 2 }
