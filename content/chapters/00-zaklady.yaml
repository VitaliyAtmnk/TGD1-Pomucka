    source: "přednáška 1, folie 12"
    supplemented: false

  - id: alg-kruskal
    kind: algorithm
    section: "0.6"
    title: Kruskalův algoritmus (hladový algoritmus)
    terms: [Kruskalův algoritmus, Kruskal, hladový algoritmus, greedy, minimální kostra, union-find]
    statement: |
      Vstup: souvislý ohodnocený graf $G$. Výstup: minimální kostra grafu $G$.
      Hrany se procházejí od nejlehčí a hrana se přidá, pokud s dosud vybranými hranami nevytvoří kružnici.
    pseudocode: |
      1. Seřaď hrany tak, aby $w(h_1) \le w(h_2) \le \dots \le w(h_m)$; polož $F := (U(G), \emptyset)$.
      2. Pro $j = 1, \dots, m$: neobsahuje-li $F + h_j$ kružnici (tj. konce $h_j$ leží v různých komponentách $F$),
         polož $F := F + h_j$.
      3. (Lze skončit, jakmile má $F$ právě $n - 1$ hran.) $F$ je minimální kostra.
    complexity: "$O(m \\log m)$"
    intuition: |
      Hladový přístup v nejčistší podobě: „ber nejlevnější hranu, která neuškodí". Na rozdíl od Jarníka
      roste **les**, ne jeden strom – komponenty se postupně slévají.

      **Složitost:** seřazení hran $O(m \log m)$; test „leží konce v různých komponentách?" se dělá strukturou
      union-find (disjunktní množiny) prakticky v konstantním čase, takže řazení dominuje: $O(m \log m) = O(m \log n)$.
      Bez union-find (test kružnice prohledáním) by to bylo $O(m \cdot n)$.

      Ve foliích přednášky Kruskalův algoritmus explicitně není (Algoritmus 1 je jeho „zrcadlová" varianta
      odebírající hrany), je ale standardní součástí látky o minimálních kostrách.
    proof: |
      *Doplněno (algoritmus není ve foliích).*

      **Invariant:** $F$ je les obsažený v nějaké minimální kostře $T$.

      Nechť algoritmus přidává hranu $h_j = \{x,y\}$, kde $x, y$ leží v různých komponentách lesa $F$.
      Nechť $A$ je množina uzlů komponenty obsahující $x$. Žádná hrana $F$ nevede mezi $A$ a zbytkem.
      Každá hrana opouštějící $A$, která je lehčí než $h_j$, byla zpracována dříve. Kdyby byla přidána,
      ležela by v $F$ a její konce by byly v téže komponentě; kdyby přidána nebyla, ležely její konce
      v téže komponentě už tehdy, a protože se komponenty jen slévají, leží v ní i nyní. Obojí odporuje
      tomu, že hrana opouští komponentu $A$. Tedy $h_j$ je nejlehčí hrana přes řez $(A, U \setminus A)$
      a podle [řezové vlastnosti](#lemma-mst-rez) existuje minimální kostra obsahující $F + h_j$.

      Na konci je $F$ souvislý: kdyby měl alespoň dvě komponenty, nějaká hrana $G$ by mezi nimi vedla
      (G je souvislý) a v okamžiku jejího zpracování by byla přidána. $F$ je tedy kostra obsažená
      v minimální kostře, tudíž s ní totožná. $\square$
    proof_steps:
      - Invariant – vybrané hrany tvoří les obsažený v nějaké minimální kostře.
      - Přidávaná hrana spojuje komponentu A lesa s jinou komponentou; všechny lehčí hrany opouštějící A by už byly přidány, takže je nejlehčí přes řez A.
      - Podle řezové vlastnosti lze invariant zachovat i po přidání této hrany.
      - Na konci je les souvislý, protože hranu mezi dvěma komponentami by algoritmus nezahodil.
      - Výsledkem je kostra obsažená v minimální kostře, tedy minimální kostra.
    examples:
      - title: Kruskalův algoritmus
        body: |
          Na grafu z příkladu u Algoritmu 1 seřadíme hrany: $cf$:1, $ad$:2, $be$:3, $ab$:4, $bd$:5, $bc$:6,
          $bf$:7, $de$:8, $ef$:9.

          - $cf$, $ad$, $be$, $ab$ přidáme (vždy spojují různé komponenty),
          - $bd$ vynecháme ($b$ a $d$ už jsou spojeny přes $a$ – vznikla by kružnice $a,b,d$),
          - $bc$ přidáme – tím máme $5 = n - 1$ hran a můžeme skončit.

          Kostra $\{cf, ad, be, ab, bc\}$ má váhu 16.
    visualization: mst
    related: [def-minimalni-kostra, lemma-mst-rez, alg-mst-odstranovani-kruznic, alg-jarnik-prim]
    source: "doplněno (standardní algoritmus; ve foliích jsou Algoritmus 1 a 2)"
    supplemented: true

quiz:
  - id: q-zaklady-01
    question: |
      Který homomorfismus $f : P_k \to G$ definuje **tah**, který ale obecně **není** cestou?
    options:
      - Uzlový monomorfismus
      - Hranový monomorfismus, který není uzlovým monomorfismem
      - Uzlový epimorfismus
      - Libovolný homomorfismus
    correct: 1
    explanation: |
      Tah = obraz $P_k$ při hranovém monomorfismu (hrany se neopakují). Cesta vyžaduje uzlový monomorfismus
      (neopakují se uzly). Hranový monomorfismus, který není uzlový, prochází některým uzlem vícekrát –
      je to tah, ale ne cesta. Libovolný homomorfismus dává jen sled.
    related: [def-sled-tah-cesta, def-druhy-homomorfismu]

  - id: q-zaklady-02
    question: |
      Dva grafy mají stejný počet uzlů, stejný počet hran a stejný soubor stupňů. Co z toho plyne?
    options:
      - Jsou isomorfní.
      - Nejsou isomorfní.
      - Isomorfní být mohou i nemusí; soubor stupňů je jen nutná podmínka.
      - Jsou isomorfní, pokud jsou oba souvislé.
    correct: 2
    explanation: |
      Isomorfismus zachovává stupně, takže stejný soubor stupňů je nutná, nikoli postačující podmínka.
      Protipříklad: $K_{3,3}$ a trojboký hranol – oba souvislé, 3-pravidelné na 6 uzlech, ale hranol
      obsahuje trojúhelník a $K_{3,3}$ ne.
    related: [prop-isomorfismus-vlastnosti, def-soubor-stupnu]

  - id: q-zaklady-03
    question: |
      Je posloupnost $3, 3, 3, 1$ grafová?
    options:
      - Ano, realizuje ji $K_4$ bez dvou hran.
      - Ne, protože součet stupňů je lichý.
      - Ne – po dvou krocích věty o skóre vyjde záporné číslo.
      - Ano, protože součet je sudý a $s_1 \le n-1$.
    correct: 2
    explanation: |
      Součet je $10$ (sudý) a $s_1 = 3 = n-1$, nutné podmínky jsou tedy splněny. Věta o skóre ale dává
      $3,3,3,1 \to 2,2,0 \to 1,-1$, takže posloupnost grafová není. Sudý součet nestačí.
    related: [thm-skore, thm-soucet-stupnu]

  - id: q-zaklady-04
    question: |
      Kolik uzlů lichého stupně může mít graf se 7 uzly?
    options:
      - Libovolný počet od 0 do 7
      - Jen sudý počet (0, 2, 4 nebo 6)
      - Jen lichý počet
      - Nejvýše 1
    correct: 1
    explanation: |
      Podle věty o součtu stupňů je $\sum d_G(u) = 2m$ sudé číslo, takže uzlů lichého stupně je v každém
      grafu sudý počet.
    related: [thm-soucet-stupnu]

  - id: q-zaklady-05
    question: |
      Graf $G$ má $n$ uzlů a $n - 1$ hran. Které tvrzení platí **vždy**?
    options:
      - $G$ je strom.
      - $G$ je strom, právě když je souvislý.
      - $G$ obsahuje kružnici.
      - $G$ má alespoň jeden izolovaný uzel.
    correct: 1
    explanation: |
      Podle charakterizace stromů (bod 3) je souvislý graf s $m = n-1$ strom. Bez souvislosti to neplatí:
      trojúhelník s izolovaným uzlem má $n = 4$, $m = 3$ a stromem není. Naopak strom je souvislý vždy.
    related: [thm-charakterizace-stromu]

  - id: q-zaklady-06
    question: |
      Proč věta „souvislý faktor s minimální vahou je kostra" potřebuje, aby váhy byly **kladné**?
    options:
      - Jinak by kostra nemusela existovat.
      - Při nulové váze by bylo možné ponechat hranu na kružnici, aniž by se váha zvýšila, takže minimální souvislý faktor by nemusel být strom.
      - Kladné váhy jsou potřeba jen kvůli algoritmu 2.
      - Při záporných vahách by graf nebyl souvislý.
    correct: 1
    explanation: |
      Důkaz odebírá hranu $h$ kružnice a využívá $w(K-h) = w(K) - w(h) < w(K)$. Při $w(h) = 0$ nerovnost
      není ostrá, takže minimální souvislý faktor může kružnici obsahovat; při záporných vahách se kružnice
      dokonce vyplatí.
    related: [thm-minimalni-souvisly-faktor]

  - id: q-zaklady-07
    question: |
      Jakou časovou složitost má Jarníkův (Primův) algoritmus při implementaci s polem hodnot $\lambda(y)$ (bez haldy)?
    options:
      - "$O(n)$"
      - "$O(n^2)$"
      - "$O(n^3)$"
      - "$O(2^n)$"
    correct: 1
    explanation: |
      Provede se $n-1$ kroků, v každém se v čase $O(n)$ vybere uzel s nejmenším $\lambda(y)$ a aktualizují
      se hodnoty jeho sousedů. Celkem $O(n^2)$; s haldou $O(m \log n)$.
    related: [alg-jarnik-prim]

  - id: q-zaklady-08
    question: |
      Student v Algoritmu 1 místo „nejtěžší hrany kružnice" odstraní vždy **nejtěžší hranu celého grafu**. Co se může stát?
    options:
      - Nic, výsledek je stejný.
      - Algoritmus se zacyklí.
      - Může odstranit most a výsledek přestane být souvislý.
      - Výsledkem bude maximální kostra.
    correct: 2
    explanation: |
      Nejtěžší hrana grafu nemusí ležet na žádné kružnici – může to být most, bez něhož se graf rozpadne
      (např. jediná hrana spojující dva „ostrovy"). Algoritmus 1 smí odstraňovat jen hrany na kružnicích;
      kružnicová vlastnost pak zaručuje, že nejtěžší hrana kružnice v nějaké minimální kostře chybí.
    related: [alg-mst-odstranovani-kruznic, lemma-mst-rez]

  - id: q-zaklady-09
    question: |
      Která datová struktura zrychlí Kruskalův algoritmus na $O(m \log m)$ (dominuje řazení)?
    options:
      - Fronta (BFS)
      - Union-find (disjunktní množiny)
      - Matice sousednosti
      - Zásobník
    correct: 1
    explanation: |
      Kruskal potřebuje opakovaně zjišťovat, zda konce hrany leží v různých komponentách lesa, a komponenty
      slévat. Union-find to umí téměř v konstantním čase, takže celková složitost je dána řazením hran.
    related: [alg-kruskal]

  - id: q-zaklady-10
    question: |
      Co je prvek $(i,i)$ matice $\mathbf{I}(G)\,\mathbf{I}(G)^T$?
    options:
      - Vždy 0
      - Vždy 1
      - Stupeň uzlu $u_i$
      - Počet kružnic procházejících $u_i$
    correct: 2
    explanation: |
      $(\mathbf{I}\mathbf{I}^T)_{ii} = \sum_k b_{ik}^2$ počítá hrany obsahující $u_i$, tedy $d_G(u_i)$.
      Mimo diagonálu dostaneme matici sousednosti: $\mathbf{I}\mathbf{I}^T = \mathbf{A} + \mathbf{S}$.
    related: [thm-incidence-sousednost]

  - id: q-zaklady-11
    question: |
      Graf na 10 uzlech má minimální stupeň $\delta(G) = 5$. Co lze o něm s jistotou říci?
    options:
      - Je souvislý a každé dva uzly mají vzdálenost nejvýše 2.
      - Je strom.
      - Může být nesouvislý.
      - Má nejvýše 25 hran.
    correct: 0
    explanation: |
      $\delta(G) \ge n/2$: dva nesousední uzly mají dohromady alespoň $10$ sousedů mezi zbývajícími 8 uzly,
      takže mají společného souseda. Graf je tedy souvislý s vzdálenostmi nejvýše 2. Strom to být nemůže
      (má alespoň $25$ hran), a hran je naopak **alespoň** 25.
    related: [prop-souvislost-min-stupen]

  - id: q-zaklady-12
    question: |
      Které tvrzení o minimální kostře je **nepravdivé**?
    options:
      - Mají-li všechny hrany různé váhy, je minimální kostra jediná.
      - Nejlehčí hrana grafu leží v každé minimální kostře, pokud jsou váhy různé.
      - Minimální kostra vždy obsahuje nejkratší cestu mezi libovolnými dvěma uzly.
      - Jarníkův algoritmus a Kruskalův algoritmus najdou kostru stejné váhy.
    correct: 2
    explanation: |
      Minimální kostra minimalizuje **součet** vah, ne vzdálenosti. Např. v trojúhelníku s vahami 2, 2, 3
      kostra vynechá hranu váhy 3, přestože je to nejkratší spojení jejích konců. Ostatní tvrzení platí
      (nejlehčí hrana je nejlehčí přes každý řez, který ji obsahuje).
    related: [def-minimalni-kostra, lemma-mst-rez]

  - id: q-zaklady-13
    question: |
      Proč má každý strom s $n \ge 2$ uzly list (uzel stupně 1)?
    options:
      - Protože součet stupňů je sudý.
      - Konec nejdelší cesty nemá souseda mimo cestu (maximalita) ani jiného souseda na cestě (vznikla by kružnice).
      - Protože strom má $n-1$ hran a každý uzel má stupeň nejvýše 1.
      - Protože strom je bipartitní.
    correct: 1
    explanation: |
      To je klíčový krok důkazu $m = n-1$: koncový uzel nejdelší cesty má všechny sousedy na cestě, a soused
      jiný než následující uzel by s úsekem cesty vytvořil kružnici. Stupeň je tedy přesně 1 (a konce jsou dva).
    related: [thm-charakterizace-stromu, def-strom]
