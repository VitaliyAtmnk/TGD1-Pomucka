  - id: thm-7-3-bipartitni-grafy
    kind: theorem
    label: "Věta 7.3"
    section: "7.1"
    title: Grafy barevnosti 2 (bipartitní grafy)
    terms: [bipartitní graf, bigraf, 2-obarvitelnost, dvoubarevný graf, kružnice liché délky, Königova věta o bipartitních grafech, bipartite graph]
    statement: |
      Nechť $G$ je graf. Pak $\chi(G) = 2$ právě když $H(G) \ne \emptyset$
      a $G$ neobsahuje kružnici liché délky.
    intuition: |
      Triviální případ: $\chi(G)=1 \iff H(G)=\emptyset$. Grafy barevnosti 2
      tvoří bohatou a důležitou třídu. Lichá kružnice je **jediná překážka**
      dvoubarevnosti: dvě barvy se podél každé cesty musí střídat, takže barva
      uzlu je dána paritou vzdálenosti – a ta je konzistentní právě tehdy,
      když se nikde „nezavře" lichý cyklus. Důkaz je zároveň
      [lineárním algoritmem](#alg-test-bipartitnosti).
    proof: |
      **($\Rightarrow$)** Je-li $\chi(G)=2$, má $G$ hranu (jinak $\chi=1$).
      Kdyby obsahoval kružnici liché délky $v_1v_2\dots v_{2k+1}$, barvy by se
      na ní při dvou barvách musely střídat, takže $v_1$ a $v_{2k+1}$ by měly
      stejnou barvu, přestože sousedí – spor.

      **($\Leftarrow$)** Nechť $G$ má hranu a nemá lichou kružnici. V každé
      komponentě zvolme kořen $r$ a uzlu $v$ dejme barvu podle parity
      vzdálenosti $d(r,v)$ (sudá → 1, lichá → 2). Pro hranu $\{u,v\}$ ve
      stejné komponentě je $|d(r,u)-d(r,v)|\le1$. Kdyby $d(r,u)=d(r,v)=d$,
      daly by nejkratší cesty z $r$ do $u$ a do $v$ spolu s hranou $uv$
      uzavřený sled liché délky $2d+1$, a ten obsahuje kružnici liché délky –
      spor. Konce každé hrany tedy mají různou paritu, obarvení je dobré
      a používá 2 barvy; protože $G$ má hranu, je $\chi(G)=2$.

      (Skripta postupují jinak – indukcí podle počtu kružnic: odebráním hrany
      $\{x,y\}$ ze sudé kružnice $C$ dostaneme 2-obarvitelný graf a $x,y$ jsou
      spojeny cestou $C-xy$ liché délky, takže mají různé barvy a hranu lze
      vrátit.) $\square$
    proof_steps:
      - '(⇒) Při dvou barvách se barvy podél kružnice střídají, takže lichá kružnice by měla dva sousední uzly stejné barvy; navíc graf s χ = 2 má hranu.'
      - '(⇐) V každé komponentě zvolíme kořen r a uzel v obarvíme podle parity vzdálenosti d(r, v).'
      - 'Pro hranu {u, v} je |d(r, u) − d(r, v)| ≤ 1.'
      - 'Kdyby d(r, u) = d(r, v), nejkratší cesty z r a hrana uv by tvořily uzavřený sled liché délky, který obsahuje lichou kružnici – spor.'
      - 'Konce každé hrany mají tedy různé barvy, graf je 2-obarvitelný, a protože má hranu, χ(G) = 2.'
    related: [rem-bipartitni-grafy, alg-test-bipartitnosti, thm-7-4-3col, prop-lichy-cyklus-nema-jadro]
    illustrations:
      - title: Jedna tětiva rozhodne o bipartitnosti
        for: statement
        property: bipartite
        graph:
          directed: false
          nodes:
            - { id: a, x: 5, y: 9.5 }
            - { id: b, x: 9, y: 7.25 }
            - { id: c, x: 9, y: 2.75 }
            - { id: d, x: 5, y: 0.5 }
            - { id: e, x: 1, y: 2.75 }
            - { id: f, x: 1, y: 7.25 }
          edges:
            - { from: a, to: b }
            - { from: b, to: c }
            - { from: c, to: d }
            - { from: d, to: e }
            - { from: e, to: f }
            - { from: f, to: a }
        steps:
          - caption: |
              Sudá kružnice $C_6$: barvy se kolem dokola pravidelně střídají a vyjde to – graf je bipartitní, $\chi = 2$.
          - caption: |
              Tětiva $ac$ spojí dva uzly **stejné** barvy (vzdálenost 2) a uzavře lichou kružnici $a, b, c$. Dvě barvy už nestačí.
            add: [[a, c]]
          - caption: |
              Místo ní přidáme tětivu $ad$ mezi uzly **opačných** barev (vzdálenost 3). Vzniklé kružnice $a, b, c, d$ a $a, d, e, f$ jsou sudé, graf zůstává bipartitní.
            remove: [[a, c]]
            add: [[a, d]]
          - caption: |
              Tětiva $ce$ opět spojí uzly stejné barvy (vzdálenost 2) a vzniknou liché kružnice, např. $c, d, e$. Lichá kružnice je **jediná** překážka dvoubarevnosti.
            add: [[c, e]]
      - title: Barva = parita vzdálenosti od kořene
        for: proof
        property: bipartite
        graph:
          directed: false
          nodes:
            - { id: r, x: 5, y: 9.5 }
            - { id: a, x: 2.5, y: 6.5 }
            - { id: b, x: 7.5, y: 6.5 }
            - { id: c, x: 2.5, y: 3.5 }
            - { id: d, x: 7.5, y: 3.5 }
            - { id: e, x: 2.5, y: 0.5 }
          edges:
            - { from: r, to: a }
            - { from: r, to: b }
            - { from: a, to: c }
            - { from: b, to: d }
            - { from: c, to: e }
        steps:
          - caption: |
              Strom: uzlu dáme barvu podle parity vzdálenosti od kořene $r$. Každá hrana spojuje sousední „vrstvy“, takže její konce mají různou paritu.
            labels: { r: "d=0", a: "d=1", b: "d=1", c: "d=2", d: "d=2", e: "d=3" }
          - caption: |
              Hrana $ad$ spojuje vrstvy 1 a 2 – parity se liší, obarvení zůstává dobré. Vznikla jen sudá kružnice $r, a, d, b$.
            add: [[a, d]]
            labels: { r: "d=0", a: "d=1", b: "d=1", c: "d=2", d: "d=2", e: "d=3" }
          - caption: |
              Místo ní hrana $cd$ **uvnitř** vrstvy 2: nejkratší cesty $r, a, c$ a $r, b, d$ spolu s $cd$ uzavřou kružnici liché délky $2 \cdot 2 + 1 = 5$. Přesně tento případ důkaz vylučuje.
            remove: [[a, d]]
            add: [[c, d]]
            labels: { r: "d=0", a: "d=1", b: "d=1", c: "d=2", d: "d=2", e: "d=3" }
    source: "skripta str. 46, Věta 7.3 s důkazem indukcí (zde hlavní důkaz přes vzdálenosti); folie TGD1-09 s. 2"
    supplemented: false

  - id: rem-bipartitni-grafy
    kind: remark
    section: "7.1"
    title: Bipartitní grafy
    terms: [bipartitní graf, úplný bipartitní graf, "K_{m,n}", partity, bipartite]
    statement: |
      Každý graf barevnosti 2 je podgrafem některého úplného bipartitního
      grafu $K_{m,n}$ (každou monochromatickou třídu uzlů grafu $G$ umístíme do
      jedné partity $K_{m,n}$). Proto se těmto grafům říká **bipartitní**.
      O tom, zda je daný graf bipartitní, lze rozhodnout v polynomiálním čase
      (například hladovým algoritmem).
    intuition: |
      Pro $\chi(G)\ge3$ je situace podstatně horší: už rozhodnout, zda je graf
      3-obarvitelný, je NP-úplné ([Věta 7.4](#thm-7-4-3col)). Mezi „2" a „3"
      tedy leží hranice mezi snadným a (pravděpodobně) těžkým.
    related: [thm-7-3-bipartitni-grafy, alg-test-bipartitnosti, thm-7-4-3col]
    source: "skripta str. 46, poznámka za Větou 7.3"
    supplemented: false

  - id: alg-test-bipartitnosti
    kind: algorithm
    section: "7.1"
    title: Test bipartitnosti (2-obarvení prohledáváním do šířky)
    terms: [test bipartitnosti, 2-obarvení, BFS barvení, rozpoznání bipartitního grafu, bipartiteness test, 2-COL]
    statement: |
      Vstup: graf $G$. Výstup: obarvení dvěma barvami, nebo lichá kružnice
      dokazující, že $G$ bipartitní není.
    pseudocode: |
      1. Všechny uzly označ jako neobarvené.
      2. Pro každý neobarvený uzel $r$: obarvi $r$ barvou 1 a vlož ho do fronty.
      3. Dokud fronta není prázdná: vyjmi $u$; pro každého souseda $v$ uzlu $u$:
         - je-li $v$ neobarvený, dej mu opačnou barvu než $u$ a vlož ho do fronty;
         - má-li $v$ stejnou barvu jako $u$, **skonči**: $G$ není bipartitní
           (cesty stromu BFS do $u$ a $v$ s hranou $uv$ uzavírají lichou kružnici).
      4. Vrať obarvení – $G$ je bipartitní.
    complexity: "$O(n+m)$"
    intuition: |
      Jde o algoritmickou podobu důkazu [Věty 7.3](#thm-7-3-bipartitni-grafy):
      barva = parita vzdálenosti od kořene. Ve 2-obarvení není žádná volba
      (po obarvení kořene je vše vynucené), proto hladový postup nikdy nemusí
      couvat – na rozdíl od 3 barev. Každý uzel a hrana se zpracují $O(1)$-krát.
    examples:
      - title: Krychle je bipartitní, $C_5$ ne
        body: |
          Na krychli $Q_3$ algoritmus z uzlu $o_1$ obarví sousedy $o_2,o_4,i_1$
          barvou 2, jejich sousedy barvou 1 atd. a nenarazí na konflikt (obrázek).
          Na $C_5$ s uzly $1,\dots,5$ z kořene 1: $2,5$ dostanou barvu 2,
          $3,4$ barvu 1 – hrana $\{3,4\}$ spojuje dvě jedničky, nalezená lichá
          kružnice je $1\,2\,3\,4\,5$.
        graph:
          directed: false
          nodes: *krychle-uzly
          edges: *krychle-hrany
    visualization: coloring
    related: [thm-7-3-bipartitni-grafy, rem-bipartitni-grafy]
    source: "skripta str. 46 zmiňuje polynomiální rozhodnutí „hladovým algoritmem“; pseudokód doplněn"
    supplemented: true

  - id: thm-7-4-3col
    kind: theorem
    label: "Věta 7.4"
    section: "7.1"
    title: 3-obarvitelnost je NP-úplná
    terms: [3-COL, 3-obarvitelnost, NP-úplnost barvení, three-colorability NP-complete, k-COL]
    statement: |
      Úloha „určete, zda je daný graf $G$ 3-obarvitelný" je NP-úplná.
    intuition: |
      Zatímco 2-obarvitelnost rozhodneme v lineárním čase, pro 3 barvy už
      nejsou známy polynomiální algoritmy. Odtud plyne, že i výpočet $\chi(G)$
      je NP-těžký (kdo umí $\chi$, umí rozhodnout $\chi\le3$). Prakticky
      používáme heuristiky ([sekvenční barvení](#alg-sekvencni-barveni))
      nebo exponenciální přesné metody ([backtracking](#alg-barveni-backtracking)).
    proof: |
      Větu dokážeme v kapitole 9 – viz [NP-úplnost 3-COL](#thm-3col-npc)
      (redukce z problému 3-SAT). $\square$
    proof_steps:
      - '3-COL patří do NP: navržené obarvení třemi barvami ověříme v polynomiálním čase kontrolou všech hran.'
      - 'Polynomiálně redukujeme na 3-COL známý NP-úplný problém 3-SAT.'
      - 'Konstrukce: trojúhelník „pravda–nepravda–báze", pro každou proměnnou dvojice uzlů x, ¬x a pro každou klauzuli gadget, který je 3-obarvitelný právě když je některý literál pravdivý.'
      - 'Formule je splnitelná právě když je sestrojený graf 3-obarvitelný; podrobnosti viz kapitola 9.'
    related: [thm-3col-npc, thm-7-3-bipartitni-grafy, rem-3col-rovinne-grafy]
    source: "skripta str. 46, Věta 7.4 (důkaz v kap. 9); folie TGD1-09 s. 2"
    supplemented: false

  - id: rem-3col-rovinne-grafy
    kind: remark
    section: "7.1"
    title: 3-obarvitelnost rovinných grafů
    terms: [3-COL rovinné grafy, planar 3-coloring, NP-úplnost rovinné grafy]
    statement: |
      Úloha 3-obarvitelnosti je NP-úplná dokonce i pro rovinné grafy, a dokonce
      i pro rovinné grafy s $\Delta(G)\le4$ (které jsou 4-obarvitelné podle
      Brooksovy věty).
    intuition: |
      Paradox: víme, že rovinné grafy jsou vždy 4-obarvitelné
      ([věta o čtyřech barvách](#thm-ctyri-barvy)), takže otázka „stačí 4?"
      má triviální odpověď ANO – ale otázka „stačí 3?" je i pro ně těžká.
    related: [thm-7-4-3col, thm-ctyri-barvy, thm-brooks, thm-3col-npc]
    source: "skripta str. 46, poznámka za Větou 7.4"
    supplemented: false

  - id: thm-7-5-chi-a-alfa
    kind: theorem
    label: "Věta 7.5"
    section: "7.1"
    title: Chromatické číslo a nezávislost
    terms: [chromatické číslo a nezávislost, chí krát alfa, odhad n lomeno alfa, chi alpha inequality]
    statement: |
      Pro graf $G$ s chromatickým číslem $\chi(G)$ a nezávislostí $\alpha(G)$ platí:

      1. $\chi(G)\,\alpha(G) \ge |U(G)|$,
      2. $\chi(G) + \alpha(G) \le |U(G)| + 1$.
    intuition: |
      Barevné třídy jsou nezávislé, každá má tedy nejvýše $\alpha$ uzlů – proto
      potřebujeme aspoň $n/\alpha$ tříd (dolní odhad $\chi\ge\lceil n/\alpha\rceil$).
      Naopak velká nezávislá množina „ušetří" barvy: dáme jí jednu barvu
      a zbytek obarvíme jakkoli (horní odhad $\chi\le n-\alpha+1$).
    proof: |
      1. V optimálním obarvení grafu $G$ pomocí $\chi(G)$ barev je každá
         monochromatická třída nezávislou množinou, má tedy nejvýše
         $\alpha(G)$ prvků. Třídy pokrývají všech $|U(G)|$ uzlů, proto
         $|U(G)|\le\chi(G)\,\alpha(G)$.
      2. Největší nezávislou množinu obarvíme barvou 1 a každý ze zbylých
         $|U(G)|-\alpha(G)$ uzlů vlastní novou barvou. Jde o dobré obarvení
         s $1+|U(G)|-\alpha(G)$ barvami; optimální obarvení nemůže mít víc,
         tedy $\chi(G)\le|U(G)|-\alpha(G)+1$. $\square$
    proof_steps:
      - 'V optimálním obarvení je každá barevná třída nezávislá, takže má nejvýše α(G) uzlů.'
      - 'χ(G) tříd pokrývá všech |U(G)| uzlů, proto χ(G)·α(G) ≥ |U(G)|.'
      - 'Největší nezávislou množinu obarvíme jednou barvou a ostatní uzly každý jinou novou barvou.'
      - 'Vznikne dobré obarvení s |U(G)| − α(G) + 1 barvami, proto χ(G) + α(G) ≤ |U(G)| + 1.'
    examples:
      - title: Použití odhadu
        body: |
          Graf má 10 uzlů a $\alpha(G)=3$. Pak $\chi(G)\ge\lceil 10/3\rceil=4$
          a $\chi(G)\le 10-3+1=8$. Pro $C_5$: $n=5$, $\alpha=2$ dává
          $\chi\ge\lceil5/2\rceil=3$ – tedy přesně $\chi(C_5)=3$, ačkoli
          $\omega(C_5)=2$.
    related: [rem-barveni-a-nezavisle-mnoziny, def-nezavislost-grafu, alg-barveni-nezavislymi-mnozinami, rem-odhady-chromatickeho-cisla]
    illustrations:
      - title: Barevné třídy jsou nezávislé množiny
        for: proof
        property: independent-set
        graph:
          directed: false
          nodes:
            - { id: a, x: 5, y: 9.5 }
            - { id: b, x: 9.5, y: 6.2 }
            - { id: c, x: 7.8, y: 1 }
            - { id: d, x: 2.2, y: 1 }
            - { id: e, x: 0.5, y: 6.2 }
          edges:
            - { from: a, to: b }
            - { from: b, to: c }
            - { from: c, to: d }
            - { from: d, to: e }
            - { from: e, to: a }
        steps:
          - caption: |
              Obarvení $C_5$ třemi barvami. Třída barvy 1 je $\{a, c\}$ – jako každá barevná třída je to nezávislá množina.
            set: [a, c]
            labels: { a: "1", b: "2", c: "1", d: "2", e: "3" }
          - caption: |
              Třída barvy 2 je $\{b, d\}$, opět nezávislá. V $C_5$ má každá nezávislá množina nejvýše $\alpha = 2$ uzly.
            set: [b, d]
            labels: { a: "1", b: "2", c: "1", d: "2", e: "3" }
          - caption: |
              Třída barvy 3 je $\{e\}$. Dvě třídy by pokryly nejvýše $2 \cdot \alpha = 4 < 5$ uzlů, proto $\chi \ge \lceil n / \alpha \rceil = 3$.
            set: [e]
            labels: { a: "1", b: "2", c: "1", d: "2", e: "3" }
          - caption: |
              Třída se třemi uzly nezávislá být nemůže – třeba $\{a, c, e\}$ obsahuje hranu $ea$. Proto žádné obarvení dvěma barvami neexistuje.
            set: [a, c, e]
      - title: Velká nezávislá množina šetří barvy
        for: proof
        property: proper-coloring
        graph:
          directed: false
          nodes:
            - { id: s, x: 5, y: 5 }
            - { id: a, x: 2, y: 9 }
            - { id: b, x: 8, y: 9 }
            - { id: c, x: 9.5, y: 3 }
            - { id: d, x: 5, y: 0.5 }
            - { id: e, x: 0.5, y: 3 }
          edges:
            - { from: s, to: a }
            - { from: s, to: b }
            - { from: s, to: c }
            - { from: s, to: d }
            - { from: s, to: e }
            - { from: a, to: b }
        steps:
          - caption: |
              Největší nezávislou množinu $\{a, c, d, e\}$ ($\alpha = 4$) obarvíme jedinou barvou. Zbývají $n - \alpha = 2$ uzly.
            colors: { a: 0, c: 0, d: 0, e: 0 }
          - caption: |
              Každý zbylý uzel dostane vlastní novou barvu. Celkem $n - \alpha + 1 = 6 - 4 + 1 = 3$ barvy, tedy $\chi + \alpha \le n + 1$.
            colors: { a: 0, c: 0, d: 0, e: 0, s: 1, b: 2 }
    source: "skripta str. 46, Věta 7.5 s důkazem; folie TGD1-09 s. 2"
    supplemented: false

  - id: alg-barveni-nezavislymi-mnozinami
    kind: algorithm
    section: "7.1"
    title: Heuristika barvení postupným odebíráním nezávislých množin
    terms: [heuristika barvení, barvení nezávislými množinami, RLF, coloring by independent sets]
    statement: |
      Vstup: graf $G$. Výstup: dobré obarvení (ne nutně optimální).
    pseudocode: |
      1. $c := 0$.
      2. Dokud $G$ není prázdný:
         1. hledej v $G$ (velkou) nezávislou množinu $A$ – např.
            [hladovým algoritmem](#alg-maximalni-nezavisla-mnozina);
         2. $c := c+1$, obarvi všechny uzly z $A$ barvou $c$;
         3. vyhoď $A$ z grafu: $G := G - A$.
      3. Vrať obarvení s $c$ barvami.
    complexity: "$O(c\\cdot(n+m))$, kde $c$ je počet použitých barev; nejhůře $O(n(n+m))$"
    intuition: |
      Myšlenka pochází z druhé části důkazu [Věty 7.5](#thm-7-5-chi-a-alfa):
      čím větší nezávislou množinu jednou barvou „spotřebujeme", tím méně
      uzlů zbude. Každá třída je nezávislá, takže obarvení je vždy dobré.
      Heuristika je přes svou jednoduchost používaná a dává slušné výsledky;
      optimum ale zaručit nemůže (nalezení $\chi(G)$ je NP-těžké).
    related: [thm-7-5-chi-a-alfa, alg-maximalni-nezavisla-mnozina, alg-sekvencni-barveni]
    source: "skripta str. 46–47, poznámka za Větou 7.5"
    supplemented: false

  - id: alg-sekvencni-barveni
    kind: algorithm
    section: "7.1"
    title: Sekvenční (hladové) barvení
    terms: [sekvenční barvení, hladové barvení, hladový algoritmus barvení, greedy coloring, first fit, Welsh-Powell, barvení podle stupňů]
    statement: |
      Vstup: graf $G$ a pořadí uzlů $v_1,\dots,v_n$. Výstup: dobré obarvení
      nejvýše $\Delta(G)+1$ barvami.
    pseudocode: |
      1. Uspořádej uzly do posloupnosti $v_1,\dots,v_n$ (náhodně, podle
         klesajících stupňů, …).
      2. Pro $i=1,\dots,n$:
         - označ barvy již obarvených sousedů uzlu $v_i$,
         - přiřaď $v_i$ **nejnižší** barvu, kterou žádný z jeho sousedů nemá.
      3. Vrať obarvení.
    complexity: "$O(n+m)$ pro dané pořadí (řazení podle stupňů přidá $O(n\\log n)$, resp. $O(n)$ přihrádkově)"
    intuition: |
      Algoritmus je založen na myšlence důkazu [Věty 7.1](#thm-7-1-delta-plus-jedna):
      uzel $v_i$ má nejvýše $\deg(v_i)\le\Delta$ obarvených sousedů, takže
      dostane barvu nejvýše $\deg(v_i)+1\le\Delta+1$.

      **Složitost:** pro $v_i$ stačí pole příznaků velikosti $\deg(v_i)+1$,
      takže práce je $O(\deg(v_i)+1)$ a celkem $O(n+m)$.

      **Kvalita závisí na pořadí** (doplněno):

      - vždy existuje pořadí, při kterém algoritmus použije přesně $\chi(G)$
        barev – stačí uzly seřadit podle barevných tříd optimálního obarvení;
      - špatné pořadí může být katastrofální: v grafu $K_{n,n}$ bez perfektního
        párování (uzly $a_i,b_j$ sousedí pro $i\ne j$) při pořadí
        $a_1,b_1,a_2,b_2,\dots$ dostane dvojice $a_i,b_i$ barvu $i$, celkem
        $n$ barev, ačkoli $\chi=2$;
      - varianty: náhodné pořadí, od největších stupňů (Welsh–Powell),
        „smallest last".
    examples:
      - title: Rozvrh hodin hladově
        body: |
          Graf z [rozvrhu hodin](#rem-motivace-barveni), pořadí
          1A, 1B, 1C, 2B, 2A, 2C, 3C:

          - 1A → 1; 1B (soused 1A) → 2; 1C (sousedé 1, 2) → 3;
          - 2B (sousedé 1A = 1, 1B = 2) → 3; 2A (soused 2B = 3) → 1;
          - 2C (sousedé 2A = 1, 2B = 3, 1C = 3) → 2;
          - 3C (sousedé 2A = 1, 2C = 2, 1C = 3) → 4.

          Výsledek: 4 barvy, což je optimum ($\chi=4$).
        graph:
          directed: false
          nodes:
            - { id: 1C, x: 5, y: 9.5, color: 3 }
            - { id: 1B, x: 3, y: 8, color: 2 }
            - { id: 1A, x: 7, y: 8, color: 1 }
            - { id: 2B, x: 5, y: 6, color: 3 }
            - { id: 2A, x: 3.5, y: 4, color: 1 }
            - { id: 2C, x: 7, y: 4, color: 2 }
            - { id: 3C, x: 1, y: 1, color: 4 }
          edges: *rozvrh
    visualization: coloring
    related: [thm-7-1-delta-plus-jedna, thm-brooks, alg-barveni-nezavislymi-mnozinami, alg-barveni-backtracking]
    illustrations:
      - title: Špatné pořadí, zbytečná barva
        for: statement
        property: proper-coloring
        graph:
          directed: false
          nodes:
            - { id: a1, x: 1, y: 8.5 }
            - { id: a2, x: 5, y: 8.5 }
            - { id: a3, x: 9, y: 8.5 }
            - { id: b1, x: 1, y: 1.5 }
            - { id: b2, x: 5, y: 1.5 }
            - { id: b3, x: 9, y: 1.5 }
          edges:
            - { from: a1, to: b2 }
            - { from: a1, to: b3 }
            - { from: a2, to: b1 }
            - { from: a2, to: b3 }
            - { from: a3, to: b1 }
            - { from: a3, to: b2 }
        steps:
          - caption: |
              $K_{3,3}$ bez perfektního párování: $a_i$ a $b_j$ sousedí, právě když $i \ne j$. Barvíme hladově v pořadí $a_1, b_1, a_2, b_2, \dots$ – $a_1$ a $b_1$ nesousedí, oba dostanou barvu 0.
            colors: { a1: 0, b1: 0 }
          - caption: |
              $a_2$ sousedí s $b_1$ (barva 0), dostane 1; $b_2$ sousedí s $a_1$ (barva 0), dostane také 1.
            colors: { a1: 0, b1: 0, a2: 1, b2: 1 }
          - caption: |
              $a_3$ i $b_3$ vidí barvy 0 i 1, dostanou 2. Obarvení je dobré, ale má **3** barvy, ačkoli graf je bipartitní.
            colors: { a1: 0, b1: 0, a2: 1, b2: 1, a3: 2, b3: 2 }
          - caption: |
              Pořadí $a_1, a_2, a_3, b_1, b_2, b_3$ dá 2 barvy. Kvalita hladového barvení závisí na pořadí – pro $K_{n,n}$ bez párování vede špatné pořadí až k $n$ barvám.
            colors: { a1: 0, a2: 0, a3: 0, b1: 1, b2: 1, b3: 1 }
    source: "skripta str. 47 (sekvenční barvení, varianty volby uzlu); složitost a příklady doplněny"
    supplemented: false

  - id: alg-barveni-backtracking
    kind: algorithm
    section: "7.1"
    title: Přesné barvení prohledáváním s návratem (backtracking)
    terms: [backtracking barvení, přesný algoritmus barvení, k-COL algoritmus, exact coloring, prohledávání s návratem]
    statement: |
      Vstup: graf $G$ s uzly $v_1,\dots,v_n$ a číslo $k$. Výstup: obarvení
      $k$ barvami, nebo odpověď „$G$ není $k$-obarvitelný".
      Pro $\chi(G)$ zkoušíme $k$ od dolního odhadu (např. $\omega$) po horní
      odhad (výsledek sekvenčního barvení).
    pseudocode: |
      1. Volej $\mathrm{Barvi}(1)$.
      2. $\mathrm{Barvi}(i)$:
         - je-li $i>n$, vrať nalezené obarvení;
         - pro každou barvu $c\in\{1,\dots,k\}$, kterou nemá žádný již obarvený
           soused $v_i$: přiřaď $v_i$ barvu $c$ a volej $\mathrm{Barvi}(i+1)$;
           uspěje-li, vrať výsledek;
         - zruš barvu $v_i$ a vrať „neúspěch" (návrat o úroveň výš).
      3. Neuspěje-li $\mathrm{Barvi}(1)$, graf není $k$-obarvitelný.
    complexity: "$O(k^n\\cdot(n+m))$ v nejhorším případě – exponenciální"
    intuition: |
      Strom prohledávání má až $k^n$ listů. Prořezávání pomáhá: barvu
      testujeme hned proti obarveným sousedům, uzly řadíme od největších
      stupňů a symetrii barev lámeme tím, že uzel smí dostat nejvýše „první
      dosud nepoužitou" barvu. Polynomiální algoritmus nečekáme, protože
      3-COL je NP-úplná ([Věta 7.4](#thm-7-4-3col)); nejlepší známé přesné
      algoritmy pro $\chi(G)$ mají složitost řádu $2^n\cdot\mathrm{poly}(n)$.
    visualization: coloring
    related: [thm-7-4-3col, alg-sekvencni-barveni, rem-odhady-chromatickeho-cisla]
    source: "doplněno mimo skripta (přesný exponenciální algoritmus k NP-úplné úloze)"
    supplemented: true

  - id: rem-odhady-chromatickeho-cisla
    kind: remark
    section: "7.1"
    title: Přehled odhadů chromatického čísla
    terms: [odhady chromatického čísla, dolní odhad, horní odhad, bounds on chromatic number]
    statement: |
      Pro každý graf $G$ s $n$ uzly platí
      $$
      \max\left\{\omega(G),\ \left\lceil \frac{n}{\alpha(G)} \right\rceil\right\}
      \ \le\ \chi(G)\ \le\ \min\left\{\Delta(G)+1,\ n-\alpha(G)+1\right\},
      $$
      a mimo výjimky Brooksovy věty dokonce $\chi(G)\le\Delta(G)$.
      Dále $\chi(G)=1\iff H(G)=\emptyset$ a $\chi(G)\le2\iff G$ nemá lichou
      kružnici; pro rovinné grafy $\chi(G)\le4$.
    intuition: |
      Dolní odhady dokazují, že méně barev nestačí ([Tvrzení 7.1](#prop-7-1-klika-dolni-odhad),
      [Věta 7.5](#thm-7-5-chi-a-alfa)); horní odhady jsou konstruktivní –
      dává je konkrétní obarvení ([Věta 7.1](#thm-7-1-delta-plus-jedna),
      [Brooks](#thm-brooks), Věta 7.5). Pozor: $\omega$ a $\alpha$ jsou samy
      NP-těžké, takže v praxi se dolní odhad často bere z *nějaké* nalezené
      kliky. Shoduje-li se dolní a horní odhad, známe $\chi$ přesně.
    related: [prop-7-1-klika-dolni-odhad, thm-7-1-delta-plus-jedna, thm-brooks, thm-7-5-chi-a-alfa, thm-7-3-bipartitni-grafy, thm-ctyri-barvy]
    source: "shrnutí výsledků skript str. 45–47"
    supplemented: false

  # ------------------------------------------------------------------ 7.2
  - id: rem-barveni-map
    kind: remark
    section: "7.2"
    title: Barvení map
    terms: [barvení map, politická mapa, duální graf, rovinný graf, map coloring]
    statement: |
      Mapu chceme obarvit tak, aby sousední státy měly různé barvy (sousední =
      sdílejí hranici v nekonečně mnoha bodech, nestačí dotyk v bodě), a to co
      nejmenším počtem barev. Úlohu převedeme na barvení (duálního) rovinného
      grafu: každému státu přiřadíme uzel a sousední státy spojíme hranou, kterou
      lze nakreslit přes jejich společnou hranici. Vzniklý graf lze nakreslit
      do roviny bez křížení hran.
    intuition: |
      Na příkladu mapy ze skript jsou potřeba 4 barvy. Že 4 barvy stačí
      *vždy*, tvrdí [věta o čtyřech barvách](#thm-ctyri-barvy). Rovinnost
      zatím chápeme intuitivně, přesná definice přijde později.
    related: [thm-ctyri-barvy, thm-heawood]
    source: "skripta str. 47, příklad; folie TGD1-09 s. 3–4"
    supplemented: false

  - id: thm-ctyri-barvy
    kind: theorem
    label: "Věta 7.6 (Haken, Appel)"
    section: "7.2"
    title: Věta o čtyřech barvách
    terms: [věta o čtyřech barvách, problém čtyř barev, Haken, Appel, four color theorem, rovinný graf 4-obarvitelný]
    statement: |
      Každý rovinný graf je 4-obarvitelný.
    intuition: |
      Řešení jednoho z nejproslulejších problémů celé historie teorie grafů –
      tzv. *problému čtyř barev* (formulován 1852). Mez je těsná: $K_4$ je
      rovinný a potřebuje 4 barvy. V rovině tedy stačí 4 barvy; jak je tomu
      na plochách vyšších rodů, říká [Heawoodův vzorec](#thm-heawood).
    proof: |
      *Důkaz přesahuje rámec předmětu – ve skriptech ani na foliích není.*
      Poznámka k historii a myšlence (doplněno): Appel a Haken (1976) větu
      dokázali s rozsáhlou pomocí počítače. Uvažuje se minimální protipříklad
      (lze předpokládat, že jde o triangulaci). Pomocí Eulerovy formule se
      ukáže, že každá rovinná triangulace obsahuje některou konfiguraci
      z pevné *nevyhnutelné množiny* (téměř dvou tisíc konfigurací),
      a počítačem se ověří, že každá z nich je *redukovatelná* – minimální
      protipříklad ji obsahovat nemůže. Robertson, Sanders, Seymour a Thomas
      (1997) důkaz zjednodušili (633 konfigurací), Gonthier (2005) jej formálně
      ověřil v systému Coq.

      Snadné je dokázat slabší tvrzení „každý rovinný graf je 6-obarvitelný":
      z Eulerovy formule plyne $m\le3n-6$, takže rovinný graf má uzel stupně
      nejvýše 5; ten odebereme, zbytek obarvíme indukcí a uzlu zbude jedna
      ze 6 barev. S Kempeho řetězci (záměna dvou barev na souvislé části)
      se tento postup vylepší na 5 barev (Heawood, 1890). $\square$
    proof_steps:
      - 'Uvažujeme minimální rovinný graf, který není 4-obarvitelný (lze předpokládat triangulaci).'
      - 'Z Eulerovy formule plyne, že každá triangulace obsahuje některou konfiguraci z nevyhnutelné množiny.'
      - 'Počítačem se ověří, že každá konfigurace je redukovatelná – minimální protipříklad ji obsahovat nemůže.'
      - 'Spor ukazuje, že protipříklad neexistuje; každý rovinný graf je 4-obarvitelný.'
    related: [rem-barveni-map, thm-heawood, rem-3col-rovinne-grafy]
    source: "skripta str. 47, Věta 7.6; folie TGD1-09 s. 4 (jména Haken, Appel); historické poznámky doplněny"
    supplemented: false

  - id: thm-heawood
    kind: theorem
    label: "Věta 7.7 (Heawoodův vzorec)"
    section: "7.2"
    title: Heawoodův vzorec
    terms: [Heawood, Heawoodův vzorec, rod plochy, barvení na ploše, toroid, Heawood formula, Ringel-Youngs]
    statement: |
      Je-li $G$ uložitelný na plochu rodu $\gamma$, pak
      $$
      \chi(G) \le \left\lfloor \frac{7+\sqrt{1+48\gamma}}{2} \right\rfloor .
      $$
      (Ve skriptech je celá část zapsána hranatými závorkami.)
    intuition: |
      Plocha rodu $\gamma$ je sféra s $\gamma$ „uchy" (torus má rod 1).
      Čím víc uch, tím složitější grafy se na plochu vejdou a tím víc barev
      může být potřeba. Pro torus vychází $\lfloor(7+7)/2\rfloor=7$ – a $K_7$
      na torus nakreslit lze. Pro $\gamma=0$ (rovina) dává vzorec 4, což je
      přesně [věta o čtyřech barvách](#thm-ctyri-barvy).

      Vzorec uvedl Heawood už roku 1890; pro $\gamma\ge1$ je horní odhad
      poměrně snadný (viz důkaz), těžké bylo ukázat, že je **dosažen**
      (Ringel a Youngs, 1968). Pro rovinu je to věta o čtyřech barvách (1976).
    proof: |
      *Důkaz ve skriptech není, doplněno – pro $\gamma\ge1$.* Označme
      $h=\left\lfloor\frac{7+\sqrt{1+48\gamma}}{2}\right\rfloor$; pro $\gamma\ge1$
      je $h\ge7$.

      Předpokládejme sporem, že nějaký graf na ploše rodu $\gamma$ má
      $\chi>h$, a vezměme jeho minimální podgraf $G'$ s $\chi(G')>h$
      (tzv. kritický podgraf). Každý uzel $G'$ má stupeň aspoň $h$ (jinak bychom
      ho odebrali, zbytek obarvili $h$ barvami a uzlu by barva zbyla), takže
      $G'$ má $n\ge h+1$ uzlů a $2m\ge hn$ (je souvislý).

      Pro graf uložený na plochu rodu $\gamma$ dává Eulerova formule
      $n-m+f\ge2-2\gamma$ a každá stěna je omezena aspoň třemi hranami
      ($3f\le2m$); odtud $m\le3n-6+6\gamma$. Spolu s $hn\le2m$:
      $$
      (h-6)\,n\le12(\gamma-1).
      $$
      Protože $h\ge7$ a $n\ge h+1$, je $(h-6)(h+1)\le12(\gamma-1)$, neboli
      $h^2-5h+6\le12\gamma$.

      Z definice dolní celé části ale $h+1>\frac{7+\sqrt{1+48\gamma}}{2}$, tj.
      $2h-5>\sqrt{1+48\gamma}$, a umocněním $4h^2-20h+25>1+48\gamma$, tedy
      $h^2-5h+6>12\gamma$ – spor. $\square$
    proof_steps:
      - 'Sporem vezmeme minimální graf G'' na ploše rodu γ ≥ 1 s χ(G'') > h; každý jeho uzel má stupeň aspoň h a uzlů je aspoň h + 1.'
      - 'Eulerova formule pro plochu rodu γ a odhad 3f ≤ 2m dávají m ≤ 3n − 6 + 6γ.'
      - 'Spojením s 2m ≥ hn dostaneme (h − 6)n ≤ 12(γ − 1), a protože n ≥ h + 1, platí h² − 5h + 6 ≤ 12γ.'
      - 'Z definice h jako dolní celé části plyne 2h − 5 > √(1 + 48γ), tedy h² − 5h + 6 > 12γ – spor.'
    examples:
      - title: Hodnoty vzorce
        body: |
          | rod $\gamma$ | 0 | 1 | 2 | 3 |
          |---|---|---|---|---|
          | mez | 4 | 7 | 8 | 9 |
    related: [thm-ctyri-barvy, rem-barveni-map]
    source: "skripta str. 47, Věta 7.7 (bez důkazu)"
    supplemented: false

  - id: rem-rozklad-na-rovinne-vrstvy
    kind: remark
    section: "7.2"
    title: "Aplikace: rozklad grafu na vrstvy rovinných grafů"
    terms: [rozklad na rovinné vrstvy, tloušťka grafu, plošné spoje, graf křížení, thickness, conflict graph]
    statement: |
      Je dán graf $G$ a jeho nakreslení v rovině, v němž se některé hrany
      křižují mimo uzly (např. vodiče na plošném spoji). Hrany $G$ očíslujeme
      a sestrojíme graf $G'$: uzly $G'$ jsou hrany $G$ a dva uzly $G'$ jsou
      sousední právě když se odpovídající hrany $G$ v nakreslení protínají.
      Každá barevná třída dobrého obarvení $G'$ je množina navzájem se
      nekřížících hran, tj. rovinný podgraf. Tím je $H(G)$ rozložena na
      $\chi(G')$ rovinných „vrstev".
    intuition: |
      Barvy = vrstvy desky, konflikt = křížení. Výsledek závisí na nakreslení
      – v praxi se nejprve snažíme nakreslit $G$ s co nejméně průsečíky
      a teprve pak konstruujeme $G'$. Při vhodném nakreslení lze $K_{3,3}$
      (dokonce i $K_6$ nebo $K_{4,4}$) rozložit jen na dvě vrstvy.
    examples:
      - title: Graf křížení pro $K_{3,3}$
        body: |
          $K_{3,3}$ nakreslíme s horními uzly $T_1,T_2,T_3$ a dolními
          $B_1,B_2,B_3$ v řadě; hrana $T_aB_b$ má číslo $3(a-1)+b$. Dvě hrany
          $T_aB_b$, $T_cB_d$ s $a<c$ se kříží právě když $b>d$. Graf $G'$ má
          hrany $2\text{–}4$, $2\text{–}7$, $3\text{–}4$, $3\text{–}5$,
          $3\text{–}7$, $3\text{–}8$, $5\text{–}7$, $6\text{–}7$, $6\text{–}8$;
          uzly 1 a 9 jsou izolované.

          Obarvení na obrázku má 3 barvy (trojúhelník $3,5,7$ ukazuje, že méně
          nejde): vrstvy $\{1,4,7\}$, $\{2,5,8\}$, $\{3,6,9\}$ – každá je
          „hvězda" hran do jednoho dolního uzlu. Při tomto nakreslení tedy
          potřebujeme 3 vrstvy; lepší nakreslení vystačí se dvěma.
        graph:
