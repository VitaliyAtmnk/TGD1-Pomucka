  - id: cor-7-1-brooks-souvisly
    kind: corollary
    label: "Důsledek 7.1"
    section: "7.1"
    title: Brooks pro souvislé grafy
    terms: [důsledek Brooksovy věty, souvislý graf chromatické číslo]
    statement: |
      Je-li $G$ souvislý graf, který není úplným grafem ani kružnicí liché
      délky, pak $\chi(G) \le \Delta(G)$.
    intuition: |
      Pro souvislý graf jsou obě výjimky Brooksovy věty totéž co „$G$ je úplný"
      nebo „$G$ je lichá kružnice". Odhad $\chi\le\Delta$ ale může být hodně
      hrubý: krychle $Q_3$ má $\Delta=3$ a $\chi=2$. Jindy je těsný –
      ve skriptech je příklad grafu s $\chi=\Delta=4$.
    proof: |
      *Důkaz ve skriptech není, doplněno.* Podle [Brooksovy věty](#thm-brooks)
      platí $\chi(G)\le\Delta(G)$, pokud nenastane některá výjimka. Graf $G$ je
      souvislý, má tedy jedinou komponentu – sebe sama. Výjimka I by znamenala
      $G=K_{\Delta(G)+1}$, tj. $G$ je úplný; výjimka II by znamenala, že $G$
      je kružnice liché délky. Obojí je předpokladem vyloučeno. $\square$
    proof_steps:
      - 'Souvislý graf má jedinou komponentu, a to sebe sama.'
      - 'Výjimka I Brooksovy věty by znamenala, že G je úplný graf K_{Δ+1}.'
      - 'Výjimka II by znamenala, že G je lichá kružnice.'
      - 'Obě výjimky jsou vyloučeny předpokladem, proto χ(G) ≤ Δ(G).'
    examples:
      - title: Krychle $Q_3$ – χ = 2, Δ = 3
        body: |
          Krychle je bipartitní (obarvení na obrázku), takže $\chi=2$, ačkoli
          $\Delta=3$. Důsledek 7.1 dává jen $\chi\le3$.
