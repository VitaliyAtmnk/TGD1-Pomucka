  # ------------------------------------------------------------------ 7.3
  - id: def-hranove-obarveni
    kind: definition
    label: "Definice 7.3"
    section: "7.3"
    title: Hranové obarvení
    terms: [hranové obarvení, dobré hranové obarvení, přípustné hranové obarvení, hranově k-obarvitelný, edge coloring, proper edge coloring]
    statement: |
      **Hranové obarvení** grafu $G$ je zobrazení $H(G)\to\mathbb N$.
      **Dobré hranové obarvení** grafu $G$ je takové hranové obarvení, při němž
      žádné dvě hrany téže barvy nemají společný uzel. Graf $G$ je
      **hranově $k$-obarvitelný**, jestliže existuje jeho dobré hranové
      obarvení $k$ barvami.
    intuition: |
      Hranová analogie uzlového barvení: konflikt tvoří hrany se společným
      koncem. Každá barevná třída je tedy **párování** (množina hran bez
      společných uzlů). Někdy se místo „dobré" říká „přípustné hranové
      obarvení" (angl. *proper edge coloring*). Hranové barvení grafu $G$
      je totéž co uzlové barvení jeho hranového grafu $L(G)$ (doplněno).

      Aplikace: rozvrh zápasů turnaje (hrana = zápas, barva = kolo; hráč hraje
      v jednom kole nejvýše jednou).
    related: [def-chromaticky-index, thm-vizing, def-k-obarvitelnost]
    illustrations:
      - title: Každá barva hran je párování
        for: statement
        property: matching
        graph:
          directed: false
          nodes:
            - { id: a, x: 1, y: 9 }
            - { id: b, x: 9, y: 9 }
            - { id: c, x: 9, y: 1 }
            - { id: d, x: 1, y: 1 }
          edges:
            - { from: a, to: b }
            - { from: c, to: d }
            - { from: a, to: c }
            - { from: b, to: d }
            - { from: a, to: d }
            - { from: b, to: c }
        steps:
          - caption: |
              Hrany $K_4$ obarvíme barvami 1–3 (čísla u hran). Třída barvy 1, $\{ab, cd\}$: žádné dvě hrany nemají společný uzel – je to párování.
            edge_set: [a-b, c-d]
            edge_labels: { a-b: "1", c-d: "1", a-c: "2", b-d: "2", a-d: "3", b-c: "3" }
          - caption: |
              Třída barvy 2, $\{ac, bd\}$, je také párování (dokonce perfektní).
            edge_set: [a-c, b-d]
            edge_labels: { a-b: "1", c-d: "1", a-c: "2", b-d: "2", a-d: "3", b-c: "3" }
          - caption: |
              Třída barvy 3, $\{ad, bc\}$. Tři barvy pro $\Delta = 3$ – méně nejde, protože tři hrany v každém uzlu se navzájem dotýkají.
            edge_set: [a-d, b-c]
            edge_labels: { a-b: "1", c-d: "1", a-c: "2", b-d: "2", a-d: "3", b-c: "3" }
          - caption: |
              Kdyby $ab$ a $ac$ měly stejnou barvu, sdílely by uzel $a$ – taková třída párováním **není** a obarvení by nebylo dobré.
            edge_set: [a-b, a-c]
    source: "skripta str. 48, Definice 7.3 + poznámka"
    supplemented: false

  - id: def-chromaticky-index
    kind: definition
    label: "Definice 7.3"
    section: "7.3"
    title: Chromatický index
    terms: [chromatický index, hranová barevnost, "χ'(G)", chromatic index, edge chromatic number]
    statement: |
      **Chromatický index** $\chi'(G)$ grafu $G$ je nejmenší číslo $k$, pro
      něž je graf $G$ hranově $k$-obarvitelný.
    intuition: |
      Všechny hrany v uzlu maximálního stupně se navzájem dotýkají, proto
      vždy $\chi'(G)\ge\Delta(G)$; podle [Vizingovy věty](#thm-vizing) je
      $\chi'(G)$ buď $\Delta$, nebo $\Delta+1$.
    examples:
      - title: "$\\chi'(K_4)=3$"
        body: |
          $K_4$ má $\Delta=3$ a jeho 6 hran se rozpadne na 3 perfektní párování
          $\{ab,cd\}$, $\{ac,bd\}$, $\{ad,bc\}$ (atribut `color` u hran).
        graph:
          directed: false
          nodes:
            - { id: a, x: 1, y: 9 }
            - { id: b, x: 9, y: 9 }
            - { id: c, x: 9, y: 1 }
            - { id: d, x: 1, y: 1 }
          edges:
            - { from: a, to: b, color: 1 }
            - { from: c, to: d, color: 1 }
            - { from: a, to: c, color: 2 }
            - { from: b, to: d, color: 2 }
            - { from: a, to: d, color: 3 }
            - { from: b, to: c, color: 3 }
    related: [def-hranove-obarveni, thm-vizing, thm-7-9-chromaticky-index-kn]
