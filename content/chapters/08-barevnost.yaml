              Třída $M_0 = \{p_1p_4,\ p_2p_3\}$ (součet indexů $\equiv 0 \pmod 5$) je párování. Uzel $p_0$ v ní „stojí“ – v $K_6$ by hrál s uzlem $\infty$.
            edge_set: [p1-p4, p2-p3]
