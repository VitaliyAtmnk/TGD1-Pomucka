  - id: thm-vizing
    kind: theorem
    label: "Věta 7.8 (Vizing)"
    section: "7.3"
    title: Vizingova věta
    terms: [Vizing, Vizingova věta, chromatický index a maximální stupeň, Vizing theorem, třída 1, třída 2]
    statement: |
      Pro každý graf $G$ platí
      $$
      \Delta(G) \le \chi'(G) \le \Delta(G) + 1.
      $$
    intuition: |
      Pro *uzlové* barvení neexistuje dolní mez jako funkce $\Delta$:
      $K_{n,n}$ má $\Delta=n$, ale $\chi=2$. U hranového barvení je situace
      úplně jiná – $\chi'$ je určeno až na jedničku. Grafy s $\chi'=\Delta$
      se nazývají *třídy 1*, s $\chi'=\Delta+1$ *třídy 2* (doplněno); rozhodnout,
      do které třídy graf patří, je ovšem NP-úplné (Holyer, 1981 – doplněno).
      Příklad třídy 2: $K_3$ ($\Delta=2$, $\chi'=3$), obecně $K_{2n-1}$
      ([Věta 7.9](#thm-7-9-chromaticky-index-kn)).
    proof: |
      **Dolní odhad** je zřejmý: všech $\Delta(G)$ hran incidentních s uzlem
      maximálního stupně má společný uzel, musí mít tedy různé barvy.

      **Horní odhad** skripta nedokazují; myšlenka (doplněno): indukcí podle
      počtu hran. Odebereme hranu $uv$ a zbytek obarvíme $\Delta+1$ barvami.
      Každý uzel má nejvýše $\Delta$ hran, takže mu aspoň jedna z $\Delta+1$
      barev „chybí". Chybí-li $u$ i $v$ stejná barva, obarvíme jí $uv$.
      Jinak sestrojíme tzv. *Vizingův vějíř* – posloupnost sousedů $u$, v níž
      každá další hrana z $u$ má barvu chybějící u předchozího souseda – a
      postupným „posouváním" barev ve vějíři a záměnou dvou barev na
      střídavé cestě (Kempeho řetězci) uvolníme pro $uv$ volnou barvu.
      Důkaz dává i polynomiální algoritmus (např. Misra–Gries, $O(nm)$). $\square$
    proof_steps:
      - 'Dolní odhad: hrany v uzlu maximálního stupně mají společný konec, takže potřebují Δ(G) různých barev.'
      - 'Horní odhad indukcí podle počtu hran: odebereme hranu uv a zbytek obarvíme Δ + 1 barvami.'
      - 'Každému uzlu chybí aspoň jedna z Δ + 1 barev; chybí-li u i v táž barva, obarvíme jí uv.'
      - 'Jinak pomocí Vizingova vějíře a záměny barev na střídavé cestě dvou barev upravíme obarvení tak, aby se pro uv uvolnila barva.'
    related: [def-chromaticky-index, thm-7-9-chromaticky-index-kn, rem-konig-hranove-barveni, thm-brooks]
    source: "skripta str. 48–49, Věta 7.8 (důkaz jen dolní nerovnosti) + příklad $K_{n,n}$"
    supplemented: false

  - id: rem-konig-hranove-barveni
    kind: remark
    section: "7.3"
    title: Kőnigova věta o hranovém barvení bipartitních grafů
    terms: [Kőnig, Königova věta, Kőnigova věta o hranovém barvení, bipartitní graf chromatický index, Konig edge coloring theorem]
    statement: |
      Pro každý bipartitní graf $G$ platí $\chi'(G)=\Delta(G)$.
    intuition: |
      *Doplněno mimo skripta.* Bipartitní grafy jsou tedy vždy „třídy 1".
      Myšlenka: indukcí podle počtu hran; po odebrání hrany $uv$ obarvíme
      zbytek $\Delta$ barvami. Uzlu $u$ chybí barva $a$, uzlu $v$ barva $b$.
      Je-li $a\ne b$, uvažujeme střídavou cestu barev $a,b$ začínající v $v$.
      V bipartitním grafu nemůže skončit v $u$ (měla by špatnou paritu délky),
      proto na ní barvy $a,b$ prohodíme a hranu $uv$ obarvíme barvou $a$.
      Důsledek: $\chi'(K_{n,n})=n$; ekvivalentně každý $\Delta$-regulární
      bipartitní graf se rozkládá na $\Delta$ perfektních párování.
    related: [thm-vizing, def-chromaticky-index, thm-7-3-bipartitni-grafy]
    source: "doplněno mimo materiály TGD1 (klasický výsledek k hranovému barvení)"
    supplemented: true

  - id: thm-7-9-chromaticky-index-kn
    kind: theorem
    label: "Věta 7.9"
    section: "7.3"
    title: Chromatický index úplných grafů
    terms: [chromatický index úplného grafu, hranové barvení K_n, rozpis turnaje, round robin, 1-faktorizace]
    statement: |
      $\chi'(K_{2n-1}) = \chi'(K_{2n}) = 2n-1$.
    intuition: |
      Úplný graf se sudým počtem uzlů $2n$ lze rozepsat jako turnaj „každý
      s každým" na $2n-1$ kol, v každém kole hraje každý (perfektní párování).
      Při lichém počtu $2n-1$ hráčů jeden v každém kole stojí, a proto nestačí
      $\Delta=2n-2$ kol: každé kolo pojme nejvýše $n-1$ zápasů a zápasů je
      příliš mnoho. $K_{2n}$ je tedy třídy 1, $K_{2n-1}$ třídy 2.
    proof: |
      **a) $K_{2n}$.** Uzly označíme prvky $\mathbb Z_{2n-1}=\{0,\dots,2n-2\}$
      a symbolem $\infty$. Pro $t\in\mathbb Z_{2n-1}$ definujme třídu
      $$
      M_t=\{\{t,\infty\}\}\cup\{\{t+i,\ t-i\};\ i=1,\dots,n-1\}\quad(\text{mod }2n-1).
      $$
      Protože $2n-1$ je liché, jsou čísla $t\pm i$ ($1\le i\le n-1$) navzájem
      různá a různá od $t$ ($t+i\equiv t-j$ by vyžadovalo $i+j\equiv0$, ale
      $2\le i+j\le2n-2$), takže $M_t$ je perfektní párování. Každá hrana
      $\{a,b\}$ s $a,b$ konečnými leží v právě jedné třídě – té s
      $2t\equiv a+b$ (dvojka je modulo liché číslo invertibilní) – a hrana
      $\{a,\infty\}$ v třídě $M_a$. Třídy $M_0,\dots,M_{2n-2}$ tedy dávají
      dobré hranové obarvení $2n-1$ barvami. Podle Vizingovy věty je
      $\chi'(K_{2n})\ge\Delta=2n-1$, tedy rovnost.

      **b) $K_{2n-1}$.** Vynecháním uzlu $\infty$ z obarvení v a) dostaneme
      dobré obarvení $K_{2n-1}$ pomocí $2n-1$ barev, tedy
      $\chi'(K_{2n-1})\le2n-1$. Zbývá ukázat, že $\Delta=2n-2$ barev nestačí.
      Kdyby ano, rozpadla by se $H(K_{2n-1})$ na $2n-2$ monochromatických
      tříd; každá je párování na $2n-1$ uzlech, má tedy nejvýše $n-1$ hran.
      Pak by $|H(K_{2n-1})|\le(2n-2)(n-1)$, ale
      $$
      |H(K_{2n-1})|=\binom{2n-1}{2}=(2n-1)(n-1)>(2n-2)(n-1),
      $$
      spor. $\square$
    proof_steps:
      - 'Uzly K_{2n} označíme prvky Z_{2n−1} a symbolem ∞.'
      - 'Pro každé t tvoří hrany {t, ∞} a {t + i, t − i}, i = 1, …, n − 1, perfektní párování M_t.'
      - 'Každá hrana {a, b} leží v právě jedné třídě (té s 2t ≡ a + b), hrana {a, ∞} v M_a; máme tedy obarvení 2n − 1 barvami, a s Vizingovou dolní mezí χ''(K_{2n}) = 2n − 1.'
      - 'Vynecháním uzlu ∞ dostaneme obarvení K_{2n−1} pomocí 2n − 1 barev.'
      - 'Při 2n − 2 barvách by každá třída (párování na 2n − 1 uzlech) měla nejvýše n − 1 hran, celkem nejvýše (2n − 2)(n − 1) hran.'
      - 'Ale K_{2n−1} má (2n − 1)(n − 1) hran, což je víc – spor, tedy χ''(K_{2n−1}) = 2n − 1.'
    examples:
      - title: "$\\chi'(K_8)=7$ – dvě konstrukce"
        body: |
          Podle Vizingovy věty je $\chi'(K_8)\ge\Delta(K_8)=7$; ukážeme obarvení
          7 barvami.

          *Geometricky:* uzly $1,\dots,7$ rozmístíme do pravidelného sedmiúhelníku
          a uzel 8 doprostřed. Jedna barevná třída: hrana $1\text{–}8$ a tři
          hrany kolmé na ni ($7\text{–}2$, $6\text{–}3$, $5\text{–}4$). Obrázek
          sedmkrát pootočíme, při každém otočení dáme hranám další barvu.
          Každá třída je perfektní párování.

          *Algebraicky (modulo 7, uzly $0,\dots,6,\infty$):*

          | třída | hrany |
          |---|---|
          | 1 | $\{1,\infty\},\{2,0\},\{3,6\},\{4,5\}$ |
          | 2 | $\{2,\infty\},\{3,1\},\{4,0\},\{5,6\}$ |
          | 3 | $\{3,\infty\},\{4,2\},\{5,1\},\{6,0\}$ |
          | 4 | $\{4,\infty\},\{5,3\},\{6,2\},\{0,1\}$ |
          | 5 | $\{5,\infty\},\{6,4\},\{0,3\},\{1,2\}$ |
          | 6 | $\{6,\infty\},\{0,5\},\{1,4\},\{2,3\}$ |
          | 7 | $\{0,\infty\},\{1,6\},\{2,5\},\{3,4\}$ |

          Další třída vzniká z předchozí přičtením jedničky. Definujeme-li
          *délku hrany* $\{i,j\}$ jako $\min\{i-j,\ j-i\}\pmod 7$ (a délku hrany
          s $\infty$ jako $\infty$), obsahuje každá třída po jedné hraně délek
          $1,2,3,\infty$ – to je klíč k zobecnění na $K_{2n}$.
    related: [thm-vizing, rem-1-faktorizace, thm-7-10-rozklad-k2n, def-chromaticky-index]
    illustrations:
      - title: "$\\chi'(K_5) = 5$: barevné třídy jsou příliš malé"
        for: proof
        property: matching
        graph:
          directed: false
