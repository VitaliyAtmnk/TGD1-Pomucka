            - { id: i2, x: 6.5, y: 6.5, color: 1 }
            - { id: i3, x: 6.5, y: 3.5, color: 2 }
            - { id: i4, x: 3.5, y: 3.5, color: 1 }
          edges: &krychle-hrany
            - { from: o1, to: o2 }
            - { from: o2, to: o3 }
            - { from: o3, to: o4 }
            - { from: o4, to: o1 }
            - { from: i1, to: i2 }
            - { from: i2, to: i3 }
            - { from: i3, to: i4 }
            - { from: i4, to: i1 }
            - { from: o1, to: i1 }
            - { from: o2, to: i2 }
            - { from: o3, to: i3 }
            - { from: o4, to: i4 }
    related: [thm-brooks]
    illustrations:
