  - id: rem-1-faktorizace
    kind: remark
    section: "7.3"
    title: Rozklad K₂ₙ na 1-faktory
    terms: [1-faktor, perfektní párování, 1-faktorizace, rozklad úplného grafu, one-factorization, perfect matching]
    statement: |
      Je-li graf $K_{2n}$ hranově obarven $2n-1$ barvami, je každá
      monochromatická třída hran **1-faktorem** (perfektním párováním – faktorem,
      v němž má každý uzel stupeň 1). Dostáváme tak **rozklad grafu $K_{2n}$
      na $2n-1$ 1-faktorů**. Tuto konstrukci rozkladu $K_{2n}$ na izomorfní
      grafy lze dále zobecnit (Věta 7.10).
    intuition: |
      $K_{2n}$ má $n(2n-1)$ hran a každý 1-faktor má $n$ hran – počet tříd
      $2n-1$ přesně sedí. Rozklad na izomorfní kopie jednoho grafu je obecná
      otázka; 1-faktor je nejjednodušší případ.
    related: [thm-7-9-chromaticky-index-kn, thm-7-10-rozklad-k2n, thm-7-11-rozklad-4-pravidelneho]
    source: "skripta str. 49, odstavec za Větou 7.9"
    supplemented: false

  - id: thm-7-10-rozklad-k2n
    kind: theorem
    label: "Věta 7.10"
    section: "7.3"
    title: Rozklad K₂ₙ na kopie grafu s „půvabným" ohodnocením
    terms: [rozklad úplného grafu na izomorfní kopie, rozklad K_2n, cyklický rozklad, graph decomposition, délka hrany]
    statement: |
      Buď $G$ graf o $n$ hranách. Existuje-li (prosté) ohodnocení uzlů grafu
      $G$ čísly $0,1,\dots,n-1,\infty$ takové, že

      (i) pro každé dvě různé hrany $h_1,h_2\in H(G)$ je $\ell(h_1)\ne\ell(h_2)$,

      (ii) $\{\ell(h_1),\dots,\ell(h_n)\}=\{1,\dots,n-1,\infty\}$,

      pak existuje rozklad grafu $K_{2n}$ na $2n-1$ kopií grafu $G$.
      (Zde $\ell(h)$ je délka hrany: pro hranu $\{i,j\}$ s konečnými čísly
      $\ell=|i-j|$, pro hranu s uzlem $\infty$ je $\ell=\infty$.)
    intuition: |
      Stejný trik jako u $\chi'(K_8)$: graf $G$ „položíme" do $K_{2n}$
      (uzly $\mathbb Z_{2n-1}\cup\{\infty\}$) a otáčíme ho přičítáním
      $t=0,1,\dots,2n-2$. Otáčení zachovává délky hran a hran každé délky je
      v $K_{2n}$ přesně $2n-1$ – každou délku $G$ obsahuje právě jednou,
      takže $2n-1$ otočení pokryje každou hranu právě jednou.
    proof: |
      *Ve skriptech je jen myšlenka (z příkladu), doplněno.* Uzly $K_{2n}$
      označme $\mathbb Z_{2n-1}\cup\{\infty\}$ a délku hrany $\{a,b\}$ s
      konečnými konci definujme $\min\{a-b,\ b-a\}\bmod(2n-1)\in\{1,\dots,n-1\}$.
      Protože ohodnocení používá čísla $0,\dots,n-1$ a $n-1<\frac{2n-1}{2}$,
      shoduje se pro hrany $G$ tato délka s $|i-j|$; ohodnocení je prosté,
      takže $G$ je podgrafem $K_{2n}$ (kopie $G_0$).

      Pro $t\in\mathbb Z_{2n-1}$ nechť $G_t$ vznikne z $G_0$ posunutím
      $x\mapsto x+t$ ($\infty+t=\infty$). Posunutí je izomorfismus a délky hran
      zachovává.

      Pevně zvolme délku $d\in\{1,\dots,n-1\}$. V $K_{2n}$ je přesně $2n-1$ hran
      délky $d$, totiž $\{a,a+d\}$, $a\in\mathbb Z_{2n-1}$ (jsou různé, protože
      $2d\not\equiv0$ modulo liché číslo). $G_0$ obsahuje podle (i), (ii)
      právě jednu hranu $\{a_0,a_0+d\}$ délky $d$ a jejími posunutími vznikne
      všech $2n-1$ hran délky $d$, každá právě jednou. Totéž platí pro délku
      $\infty$: jediná hrana $\{a_0,\infty\}$ v $G_0$ se posune na všech
      $2n-1$ hran $\{a,\infty\}$.

      Každá hrana $K_{2n}$ tedy leží v právě jedné kopii $G_t$ (kontrola:
      $(2n-1)\cdot n=\binom{2n}{2}$). Kopie $G_0,\dots,G_{2n-2}$ tvoří
      rozklad $K_{2n}$. $\square$
    proof_steps:
      - 'Uzly K_{2n} označíme Z_{2n−1} ∪ {∞}; díky ohodnocení je G podgrafem K_{2n} a délky jeho hran jsou navzájem různé a tvoří {1, …, n − 1, ∞}.'
      - 'Posunutím x ↦ x + t (∞ zůstává) vzniknou kopie G_0, …, G_{2n−2}; posunutí zachovává délky hran.'
      - 'V K_{2n} je pro každou délku d ∈ {1, …, n − 1, ∞} přesně 2n − 1 hran této délky.'
      - 'Jediná hrana délky d v G_0 se posunutími zobrazí právě na všech 2n − 1 hran délky d.'
      - 'Každá hrana K_{2n} tedy leží v právě jedné kopii, kopie tvoří rozklad (kontrola: (2n − 1)·n hran).'
    examples:
      - title: "Rozklad $K_8$ na 7 kopií cesty $P_4$"
        body: |
          Cesta se 4 hranami a ohodnocením uzlů $3,0,2,1,\infty$ (v tomto
          pořadí) má délky hran $3,2,1,\infty$ – každou z množiny
          $\{1,2,3,\infty\}$ právě jednou. Přičítáním $t=0,\dots,6$ (mod 7)
          dostaneme 7 kopií, které rozkládají $K_8$.
        graph:
          directed: false
          nodes:
            - { id: "3", x: 1, y: 5 }
            - { id: "0", x: 3, y: 5 }
            - { id: "2", x: 5, y: 5 }
            - { id: "1", x: 7, y: 5 }
            - { id: inf, x: 9, y: 5 }
          edges:
            - { from: "3", to: "0", w: 3 }
            - { from: "0", to: "2", w: 2 }
            - { from: "2", to: "1", w: 1 }
            - { from: "1", to: inf, w: "∞" }
    related: [rem-graceful-labelling, thm-7-9-chromaticky-index-kn, rem-1-faktorizace]
    source: "skripta str. 50, příklad ($K_8$ na 7 kopií $P_4$) a Věta 7.10 (bez důkazu)"
    supplemented: false

  - id: rem-graceful-labelling
    kind: remark
    section: "7.3"
    title: Půvabné ohodnocení (graceful labelling)
    terms: [graceful labelling, půvabné ohodnocení, graceful tree conjecture, Ringel-Kotzigova hypotéza, hypotéza o půvabných stromech]
    statement: |
      Uzlové ohodnocení s vlastnostmi z [Věty 7.10](#thm-7-10-rozklad-k2n) se
      ve skriptech nazývá *graceful labelling* (česky snad „půvabné
      ohodnocení"). Jedna ze známých a dosud otevřených hypotéz říká, že
      **každý strom má půvabné ohodnocení**.
    intuition: |
      Upřesnění (doplněno): v literatuře se termín *graceful labelling* obvykle
      používá pro prosté ohodnocení uzlů grafu s $m$ hranami čísly
      $0,\dots,m$, při němž rozdíly $|f(u)-f(v)|$ na hranách dávají přesně
      $1,\dots,m$ (Rosa, 1967); takové ohodnocení stromu vede k rozkladu
      $K_{2m+1}$ na kopie stromu. Ohodnocení s bodem $\infty$ z Věty 7.10 je
      jeho variantou pro $K_{2n}$. Hypotéza o půvabných stromech
      (Ringel–Kotzig) zůstává otevřená.
    related: [thm-7-10-rozklad-k2n]
    source: "skripta str. 50, poznámka za Větou 7.10"
    supplemented: false

  - id: thm-7-11-rozklad-4-pravidelneho
    kind: theorem
    label: "Věta 7.11"
    section: "7.3"
    title: Rozklad 4-pravidelného grafu na dva 2-faktory
    terms: [kvadratický faktor, 2-faktor, rozklad pravidelného grafu, 4-regular graph decomposition, Petersenova věta o 2-faktorech, eulerovský tah]
    statement: |
      Každý pravidelný graf 4. stupně se dá rozložit na dva kvadratické
      (= pravidelné 2. stupně) faktory.
    intuition: |
      Faktor = podgraf obsahující všechny uzly. Kvadratický faktor je
      disjunktní sjednocení kružnic pokrývajících všechny uzly. Graf
      4. stupně je eulerovský (všechny stupně sudé), a když jeho uzavřený
      eulerovský tah „obarvujeme" střídavě 1, 2, každý průchod uzlem spotřebuje
      jednu hranu každé barvy. Obecněji (Petersen, 1891 – doplněno): každý
      $2k$-pravidelný graf se rozkládá na $k$ kvadratických faktorů.
    proof: |
      Ve skriptech je důkaz jednou větou; rozepíšeme ho. Stačí uvažovat každou
      komponentu zvlášť, nechť je tedy $G$ souvislý 4-pravidelný s $n$ uzly.

      Všechny stupně jsou sudé a $G$ je souvislý, je tedy eulerovský – má
      uzavřený eulerovský tah $T=(e_1,e_2,\dots,e_m)$. Počet hran je
      $m=\frac{4n}{2}=2n$, tedy sudý. Hrany očíslujeme podle pořadí v tahu
      střídavě $1,2,1,2,\dots$ ($e_i$ dostane 1 pro lichá $i$, 2 pro sudá).

      Každý průchod tahu uzlem $v$ použije dvě po sobě jdoucí hrany
      $e_i,e_{i+1}$, které mají různá čísla. Totéž platí pro „přechod" přes
      počáteční uzel: $e_m$ má číslo 2 (protože $m$ je sudé) a $e_1$ číslo 1.
      Uzlem stupně 4 projde tah dvakrát, takže v každém uzlu jsou přesně dvě
      hrany s číslem 1 a dvě s číslem 2. Hrany s číslem 1 tvoří kvadratický
      faktor, hrany s číslem 2 také. $\square$
    proof_steps:
      - 'Stačí uvažovat souvislou komponentu; graf se všemi stupni sudými je eulerovský, vezmeme uzavřený eulerovský tah.'
      - 'Počet hran je 4n/2 = 2n, tedy sudý.'
      - 'Hrany tahu očíslujeme střídavě 1, 2, 1, 2, …; první hrana má 1 a poslední 2.'
      - 'Každý průchod uzlem (i přechod přes počátek) použije dvě po sobě jdoucí hrany s různými čísly.'
      - 'Každým uzlem projde tah dvakrát, takže v něm jsou dvě hrany čísla 1 a dvě čísla 2 – obě třídy jsou kvadratické faktory.'
    examples:
      - title: Osmistěn
        body: |
          Osmistěn (vnější trojúhelník $A,B,C$, vnitřní trojúhelník $P,Q,R$,
          hrany $AP,AQ,BP,BR,CQ,CR$) je 4-pravidelný. Jeden kvadratický faktor
          je hamiltonovská kružnice $A\,P\,B\,R\,C\,Q\,A$ (barva 1), druhý
          tvoří dva trojúhelníky $ABC$ a $PQR$ (barva 2). Skripta uvádějí jiný
          rozklad – rozklad není jednoznačný.
        graph:
          directed: false
          nodes:
            - { id: A, x: 5, y: 9.5 }
            - { id: B, x: 0.5, y: 1 }
            - { id: C, x: 9.5, y: 1 }
            - { id: P, x: 4, y: 5 }
            - { id: Q, x: 6, y: 5 }
            - { id: R, x: 5, y: 3 }
          edges:
            - { from: A, to: P, color: 1 }
            - { from: P, to: B, color: 1 }
            - { from: B, to: R, color: 1 }
            - { from: R, to: C, color: 1 }
            - { from: C, to: Q, color: 1 }
            - { from: Q, to: A, color: 1 }
            - { from: A, to: B, color: 2 }
            - { from: B, to: C, color: 2 }
            - { from: C, to: A, color: 2 }
            - { from: P, to: Q, color: 2 }
            - { from: Q, to: R, color: 2 }
            - { from: R, to: P, color: 2 }
    related: [rem-1-faktorizace, rem-instant-insanity]
    source: "skripta str. 50, příklad (osmistěn) a Věta 7.11 s důkazem (rozepsán)"
    supplemented: false

  - id: rem-instant-insanity
    kind: remark
    section: "7.3"
    title: "Aplikace: hlavolam se čtyřmi kostkami"
    terms: [hlavolam se kostkami, Instant Insanity, kostky čtyři barvy, aplikace rozkladu grafu]
    statement: |
      Máme 4 kostky se stěnami obarvenými čtyřmi barvami (žlutá, modrá,
      červená, zelená). Úkolem je postavit je do sloupečku tak, aby na žádné
      ze čtyř bočních stran sloupečku nebyly dvě stěny stejné barvy (každá
      barva tedy bude na každé straně právě jednou).

      Pro každou kostku nakreslíme graf na uzlech = barvách, v němž jsou dvě
      barvy spojeny hranou, jsou-li na protilehlých stěnách (3 hrany, mohou
      vzniknout smyčky). Grafy sloučíme do jednoho multigrafu a hrany označíme
      číslem kostky. Hledáme **dva hranově disjunktní podgrafy, pravidelné
      2. stupně, z nichž každý obsahuje právě jednu hranu od každé kostky**.
      Jeden určí barvy přední a zadní strany, druhý levé a pravé.
    intuition: |
      Hrana kostky $i$ mezi barvami $x,y$ v prvním podgrafu znamená „kostku $i$
      otočím tak, aby $x$ byla vpředu a $y$ vzadu". Stupeň 2 v každém uzlu
      zaručí, že každá barva je vpředu i vzadu dohromady právě dvakrát –
      jednou vpředu a jednou vzadu (při vhodném směru oběhu kružnic).
      Ve skriptech má úloha řešení: podgraf s hranami
      ž–m (kostka 4), m–z (3), z–č (1), č–ž (2) a podgraf
      ž–m (2), m–z (1), z–č (4), č–ž (3) – obě jsou kružnice ž, m, z, č.
      Název *Instant Insanity* (doplněno) je obchodní název hlavolamu.
    related: [thm-7-11-rozklad-4-pravidelneho]
    source: "skripta str. 50–51, příklad (hlavolam se čtyřmi kostkami)"
    supplemented: false

quiz:
  - id: q-barevnost-01
    question: |
      Jaké je chromatické číslo kružnice $C_9$?
    options:
      - '2'
      - '3'
      - '4'
      - '9'
    correct: 1
    explanation: |
      Kružnice liché délky není bipartitní (Věta 7.3), takže $\chi\ge3$,
      a třemi barvami ji obarvíme snadno. Sudé kružnice mají $\chi=2$.
    related: [def-chromaticke-cislo, thm-7-3-bipartitni-grafy]

  - id: q-barevnost-02
    question: |
      Petersenův graf je souvislý, 3-pravidelný, není úplný a obsahuje $C_5$.
      Co plyne z Brooksovy věty a dalších znalostí?
    options:
      - '$\chi=4$'
      - '$\chi=3$'
      - '$\chi=2$'
      - 'Brooksova věta na něj nelze použít.'
    correct: 1
    explanation: |
      Není úplný ani lichá kružnice, tedy $\chi\le\Delta=3$. Obsahuje lichou
      kružnici, tedy $\chi\ge3$. Celkem $\chi=3$.
    related: [thm-brooks, cor-7-1-brooks-souvisly]

  - id: q-barevnost-03
    question: |
      Co zaručuje sekvenční (hladové) barvení pro libovolné pořadí uzlů?
    options:
      - 'Použije přesně χ(G) barev v čase O(n + m).'
      - 'Použije nejvýše Δ(G) + 1 barev v čase O(n + m).'
      - 'Použije nejvýše Δ(G) barev v čase O(n²).'
      - 'Použije nejvýše ω(G) barev v exponenciálním čase.'
    correct: 1
    explanation: |
      Každý uzel má nejvýše $\Delta$ obarvených sousedů, takže dostane barvu
      nejvýše $\Delta+1$; s polem příznaků je práce na uzel $O(\deg+1)$.
      Optimum nezaručuje – při špatném pořadí může být výsledek mnohem horší
      než $\chi$.
    related: [alg-sekvencni-barveni, thm-7-1-delta-plus-jedna]

  - id: q-barevnost-04
    question: |
      Které tvrzení o složitosti barvení je správné?
    options:
      - 'Rozhodnout 2-obarvitelnost je NP-úplné, 3-obarvitelnost polynomiální.'
      - 'Obojí je polynomiální.'
      - '2-obarvitelnost lze rozhodnout v O(n + m), 3-obarvitelnost je NP-úplná.'
      - 'Obojí je NP-úplné.'
    correct: 2
    explanation: |
      2-obarvitelnost = bipartitnost, test prohledáváním do šířky v lineárním
      čase. 3-COL je NP-úplná (Věta 7.4, důkaz v kap. 9), dokonce i pro
      rovinné grafy.
    related: [alg-test-bipartitnosti, thm-7-4-3col]

  - id: q-barevnost-05
    question: |
      Graf má 20 uzlů a největší nezávislá množina má 6 uzlů. Jaký dolní odhad
      chromatického čísla plyne z Věty 7.5?
    options:
      - '$\chi\ge3$'
      - '$\chi\ge4$'
      - '$\chi\ge6$'
      - '$\chi\ge15$'
    correct: 1
    explanation: |
      $\chi\cdot\alpha\ge n$, tedy $\chi\ge20/6\approx3{,}33$, a protože je
      $\chi$ celé, $\chi\ge4$. Druhá část věty dává horní odhad
      $\chi\le20-6+1=15$.
    related: [thm-7-5-chi-a-alfa]

  - id: q-barevnost-06
    question: |
      Platí vždy $\chi(G)=\omega(G)$?
    options:
      - 'Ano, z Tvrzení 7.1.'
      - 'Ano, pro souvislé grafy.'
      - 'Ne, například C_5 má ω = 2, ale χ = 3.'
      - 'Ne, vždy platí χ(G) < ω(G).'
    correct: 2
    explanation: |
      Tvrzení 7.1 dává jen $\chi\ge\omega$. Nerovnost může být ostrá – $C_5$
      nebo graf z rozvrhu hodin (bez $K_4$, ale $\chi=4$).
    related: [prop-7-1-klika-dolni-odhad]

  - id: q-barevnost-07
    question: |
      Graf má maximální stupeň 5. Jaké hodnoty může nabývat jeho chromatický index?
    options:
      - 'Libovolné od 2 do 6.'
      - 'Jen 5 nebo 6.'
      - 'Jen 6.'
      - 'Libovolné od 5 do 10.'
    correct: 1
    explanation: |
      Vizingova věta: $\Delta\le\chi'\le\Delta+1$. Na rozdíl od uzlového
      barvení je hranové barvení určeno maximálním stupněm až na jedničku.
    related: [thm-vizing]

  - id: q-barevnost-08
    question: |
      Kolik je $\chi'(K_7)$?
    options:
      - '6'
      - '7'
      - '8'
      - '3'
    correct: 1
    explanation: |
      $K_7=K_{2n-1}$ pro $n=4$, podle Věty 7.9 je $\chi'=2n-1=7$, ačkoli
      $\Delta=6$. Každá barevná třída má nejvýše 3 hrany a hran je 21 > 6·3.
    related: [thm-7-9-chromaticky-index-kn]

  - id: q-barevnost-09
    question: |
      Proč nelze hrany $K_{2n-1}$ obarvit $2n-2$ barvami?
    options:
      - 'Protože K_{2n−1} obsahuje lichou kružnici.'
      - 'Protože každá barevná třída je párování s nejvýše n − 1 hranami a hran je (2n − 1)(n − 1).'
      - 'Protože maximální stupeň je 2n − 1.'
      - 'Protože K_{2n−1} není rovinný.'
    correct: 1
    explanation: |
      Párování na lichém počtu $2n-1$ uzlů má nejvýše $n-1$ hran, takže
      $2n-2$ tříd pokryje nejvýše $(2n-2)(n-1)<(2n-1)(n-1)$ hran. Maximální
      stupeň $K_{2n-1}$ je jen $2n-2$.
    related: [thm-7-9-chromaticky-index-kn]

  - id: q-barevnost-10
    question: |
      Jak se v důkazu Věty 7.11 rozloží 4-pravidelný graf na dva kvadratické faktory?
    options:
      - 'Najdeme perfektní párování a jeho doplněk.'
      - 'Hrany uzavřeného eulerovského tahu očíslujeme střídavě 1 a 2.'
      - 'Uzly obarvíme dvěma barvami a hrany rozdělíme podle barev konců.'
      - 'Použijeme hladové hranové barvení.'
    correct: 1
    explanation: |
      Graf je eulerovský a má sudý počet hran $2n$. Při střídavém číslování
      každý průchod uzlem spotřebuje jednu hranu každého čísla, takže v každém
      uzlu jsou dvě hrany čísla 1 a dvě čísla 2.
    related: [thm-7-11-rozklad-4-pravidelneho]

  - id: q-barevnost-11
    question: |
      Které tvrzení o rovinných grafech je pravdivé?
    options:
      - 'Každý rovinný graf je 3-obarvitelný.'
      - 'Rozhodnout 3-obarvitelnost rovinného grafu je polynomiální, protože všechny jsou 4-obarvitelné.'
      - 'Každý rovinný graf je 4-obarvitelný, ale rozhodnout jeho 3-obarvitelnost je NP-úplné.'
      - 'Existují rovinné grafy s χ = 5.'
    correct: 2
    explanation: |
      Věta o čtyřech barvách (Haken, Appel) zaručuje $\chi\le4$ ($K_4$ ukazuje,
      že 3 nestačí vždy). Otázka „stačí 3?" zůstává NP-úplná i pro rovinné
      grafy s $\Delta\le4$.
    related: [thm-ctyri-barvy, rem-3col-rovinne-grafy]

  - id: q-barevnost-12
    question: |
      Jakou horní mez chromatického čísla dává Heawoodův vzorec pro grafy
      uložitelné na torus (rod $\gamma=1$)?
    options:
      - '4'
      - '5'
      - '6'
      - '7'
    correct: 3
    explanation: |
      $\left\lfloor\frac{7+\sqrt{1+48}}{2}\right\rfloor=\left\lfloor\frac{7+7}{2}\right\rfloor=7$.
      Mez je dosažena – $K_7$ lze na torus nakreslit.
    related: [thm-heawood]

  - id: q-barevnost-13
    question: |
      Graf $K_{n,n}$ má $\Delta=n$. Co to vypovídá o vztahu $\chi$ a $\Delta$?
    options:
      - 'Že χ ≥ Δ pro každý graf.'
      - 'Že pro uzlové barvení neexistuje dolní mez χ jako funkce Δ, protože χ(K_{n,n}) = 2.'
      - 'Že K_{n,n} je výjimkou Brooksovy věty.'
      - 'Že χ''(K_{n,n}) = 2.'
    correct: 1
    explanation: |
      $K_{n,n}$ je bipartitní, takže $\chi=2$ při libovolně velkém $\Delta$.
      U hranového barvení naopak vždy $\chi'\ge\Delta$ (a pro bipartitní grafy
      podle Kőniga $\chi'=\Delta$, tedy $\chi'(K_{n,n})=n$).
    related: [thm-vizing, rem-konig-hranove-barveni]

  - id: q-barevnost-14
    question: |
      Které tvrzení o sekvenčním barvení je pravdivé?
    options:
      - 'Pro každé pořadí uzlů dá optimální obarvení.'
      - 'Existuje pořadí uzlů, při kterém dá optimální obarvení, ale nalézt ho je obecně stejně těžké jako najít χ.'
      - 'Řazení uzlů podle klesajících stupňů vždy dá optimum.'
      - 'Výsledek nikdy nepřekročí 2χ(G).'
    correct: 1
    explanation: |
      Seřadíme-li uzly podle tříd optimálního obarvení, hladový algoritmus
      použije $\chi$ barev. Pro jiná pořadí může být libovolně špatný – např.
      $K_{n,n}$ bez perfektního párování s pořadím $a_1,b_1,a_2,b_2,\dots$
      dostane $n$ barev místo 2.
    related: [alg-sekvencni-barveni]

  - id: q-barevnost-15
    question: |
      Kdy je $\chi(G)=1$?
    options:
      - 'Když G je strom.'
      - 'Když G nemá žádnou hranu.'
      - 'Když G nemá lichou kružnici.'
      - 'Když G má jediný uzel.'
    correct: 1
    explanation: |
      Jedna barva stačí, právě když žádné dva uzly nesousedí, tj.
      $H(G)=\emptyset$ (počet uzlů nehraje roli). Strom s hranou má $\chi=2$.
    related: [thm-7-3-bipartitni-grafy, def-chromaticke-cislo]
