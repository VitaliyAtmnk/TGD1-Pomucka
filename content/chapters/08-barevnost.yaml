id: barevnost
number: 8
title: Barevnost grafu
source: "TGD1 skripta kap. 7 (str. 44–51); přednáška TGD1-09 (folie 1–4, část o barevnosti)"
exam_questions: [13]
summary: |
  Barvení grafu přiřazuje uzlům barvy tak, aby sousední uzly měly různé barvy;
  nejmenší potřebný počet barev je chromatické číslo $\chi(G)$. Modeluje úlohy
  jako rozvrh hodin nebo přidělování kanálů vysílačům. Kapitola dává dolní
  odhady ($\chi\ge\omega$, $\chi\ge n/\alpha$), horní odhady ($\chi\le\Delta+1$,
  Brooksova věta), charakterizaci 2-obarvitelných (bipartitních) grafů,
  NP-úplnost 3-obarvitelnosti, heuristiky (sekvenční barvení), větu o čtyřech
  barvách a Heawoodův vzorec. Závěr patří hranovému barvení (Vizingova věta,
  $\chi'(K_n)$) a rozkladům grafů na faktory.
sections:
  - number: "7.1"
    title: k-obarvitelnost a chromatické číslo grafu
  - number: "7.2"
    title: Barvení map
  - number: "7.3"
    title: Hranové barvení a rozklady grafů
items:
  # ------------------------------------------------------------------ 7.1
  - id: rem-motivace-barveni
    kind: remark
    section: "7.1"
    title: "Motivace: rozvrh hodin a síť vysílačů"
    terms: [rozvrh hodin, síť vysílačů, přidělování kanálů, aplikace barvení, scheduling, frequency assignment]
    statement: |
      **Rozvrh hodin.** Kurz obsahuje několik přednášek, z nichž některé nemohou
      probíhat současně (stejný učitel, stejní studenti, stejná speciální
      učebna…). Přednáškám přiřadíme uzly grafu, konfliktním dvojicím hrany.
      Vyučovací hodiny přidělíme tak, aby sousední uzly nedostaly stejné číslo –
      nejkratší rozvrh odpovídá nejmenšímu počtu barev.

      **Síť vysílačů.** Uzly jsou TV vysílače, hrany spojují dvojice, které se
      navzájem ruší. Hledáme minimální počet kanálů, aby rušící se vysílače
      nevysílaly na stejném kanálu.
    intuition: |
      Barva = časový slot / kanál / zdroj. Hrana = „tyto dva nesmí dostat
      totéž". Úloha nalézt co nejmenší počet barev je přesně výpočet
      [chromatického čísla](#def-chromaticke-cislo).
    examples:
      - title: Rozvrh, který se nevejde do 3 hodin
        body: |
          Předměty A, B, C, třídy 1, 2, 3, učitelé U, V, W; předmět C vyžaduje
          speciální učebnu. Výuky: 1A (U), 1B (U), 1C (W), 2A (V), 2B (U),
          2C (V), 3C (V). Konflikty: stejný učitel (U: 1A, 1B, 2B; V: 2A, 2C, 3C),
          stejná třída (1A, 1B, 1C; 2A, 2B, 2C) a stejná učebna (1C, 2C, 3C).

          Zkusme 3 barvy: trojúhelník 1A, 1B, 1C dostane barvy $a,b,c$. Uzel 2B
          sousedí s 1A, 1B, tedy má barvu $c$. Uzly 2A, 2C sousedí s 2B a spolu,
          takže mají barvy $a,b$. Uzel 3C sousedí s 2A, 2C, musí mít barvu $c$ –
          ale sousedí i s 1C, který má barvu $c$. Spor: **3 hodiny nestačí**,
          potřebujeme 4 (obarvení na obrázku). Přitom graf neobsahuje $K_4$.
        graph:
          directed: false
          nodes:
            - { id: 1C, x: 5, y: 9.5, color: 3 }
            - { id: 1B, x: 3, y: 8, color: 2 }
            - { id: 1A, x: 7, y: 8, color: 1 }
            - { id: 2B, x: 5, y: 6, color: 3 }
            - { id: 2A, x: 3.5, y: 4, color: 1 }
            - { id: 2C, x: 7, y: 4, color: 2 }
            - { id: 3C, x: 1, y: 1, color: 4 }
          edges: &rozvrh
            - { from: 1A, to: 1B }
            - { from: 1A, to: 1C }
            - { from: 1B, to: 1C }
            - { from: 1A, to: 2B }
            - { from: 1B, to: 2B }
            - { from: 2A, to: 2B }
            - { from: 2B, to: 2C }
            - { from: 2A, to: 2C }
            - { from: 2A, to: 3C }
            - { from: 2C, to: 3C }
            - { from: 1C, to: 2C }
            - { from: 1C, to: 3C }
    related: [def-k-obarvitelnost, def-chromaticke-cislo, prop-7-1-klika-dolni-odhad]
    illustrations:
      - title: Proč se rozvrh nevejde do 3 hodin
        for: statement
        property: proper-coloring
        graph:
          directed: false
          nodes:
            - { id: 1C, x: 5, y: 9.5 }
            - { id: 1B, x: 3, y: 8 }
            - { id: 1A, x: 7, y: 8 }
            - { id: 2B, x: 5, y: 6 }
            - { id: 2A, x: 3.5, y: 4 }
            - { id: 2C, x: 7, y: 4 }
            - { id: 3C, x: 1, y: 1 }
          edges: *rozvrh
        steps:
          - caption: |
              Trojúhelník $1A, 1B, 1C$ (stejná třída) potřebuje tři různé hodiny. Ostatní výuky zatím nemají přidělený čas.
            colors: { 1A: 0, 1B: 1, 1C: 2 }
          - caption: |
              $2B$ sousedí s $1A$ a $1B$, při třech barvách tedy **musí** mít barvu uzlu $1C$. $2A$ a $2C$ sousedí s $2B$ i spolu, dostanou zbylé dvě barvy. Zbývá $3C$.
            colors: { 1A: 0, 1B: 1, 1C: 2, 2B: 2, 2A: 0, 2C: 1 }
          - caption: |
              $3C$ sousedí s $2A$ a $2C$, takže by musel dostat třetí barvu – tu ale má i soused $1C$ (stejná učebna). Tři hodiny **nestačí**.
            colors: { 1A: 0, 1B: 1, 1C: 2, 2B: 2, 2A: 0, 2C: 1, 3C: 2 }
          - caption: |
              Se čtvrtou hodinou pro $3C$ je rozvrh v pořádku, $\chi = 4$ – a to přesto, že graf neobsahuje $K_4$.
            colors: { 1A: 0, 1B: 1, 1C: 2, 2B: 2, 2A: 0, 2C: 1, 3C: 3 }
    source: "skripta str. 44, příklady (rozvrh hodin, síť vysílačů)"
    supplemented: false

  - id: def-k-obarvitelnost
    kind: definition
    label: "Definice 7.1"
    section: "7.1"
    title: k-obarvitelný graf
    terms: [k-obarvitelnost, k-obarvitelný graf, obarvení grafu, barvení grafu, dobré obarvení, k-colorable, proper coloring, vertex coloring, uzlové barvení]
    statement: |
      Graf $G$ se nazývá **$k$-obarvitelný**, jestliže každému jeho uzlu lze
      přiřadit jednu z „barev" $1,\dots,k$ tak, že žádné dva sousední uzly
      nemají stejnou barvu.
    intuition: |
      Barvy jsou jen jména (čísla); záleží pouze na tom, že konce každé hrany
      dostanou různé barvy. Každý graf je $|U(G)|$-obarvitelný (každý uzel
      jinou barvou) a $k$-obarvitelný graf je i $(k+1)$-obarvitelný. Graf se
      smyčkou obarvit nelze – v TGD1 pracujeme s grafy bez smyček.

      Množina uzlů jedné barvy (*monochromatická třída*) je vždy
      [nezávislá množina](#def-nezavisla-mnozina).
    related: [def-chromaticke-cislo, rem-barveni-a-nezavisle-mnoziny, def-nezavisla-mnozina]
    illustrations:
      - title: Dobré a špatné obarvení domečku
        for: statement
        property: proper-coloring
        graph:
          directed: false
          nodes:
            - { id: t, x: 5, y: 9.5 }
            - { id: a, x: 2, y: 6.5 }
            - { id: b, x: 8, y: 6.5 }
            - { id: c, x: 2, y: 1 }
            - { id: d, x: 8, y: 1 }
          edges:
            - { from: t, to: a }
            - { from: t, to: b }
            - { from: a, to: b }
            - { from: a, to: c }
            - { from: b, to: d }
            - { from: c, to: d }
        steps:
          - caption: |
              Konce každé hrany mají různé barvy – domeček je **3-obarvitelný**. Barvy jsou jen jména, záleží jen na tom, aby se sousedé lišili.
            colors: { t: 0, a: 1, b: 2, c: 2, d: 1 }
          - caption: |
              Stačí jediná hrana se stejně barevnými konci ($c$ a $d$) a obarvení **není** dobré.
            colors: { t: 0, a: 1, b: 2, c: 0, d: 0 }
          - caption: |
              Dvěma barvami to nepůjde: trojúhelník $t, a, b$ potřebuje tři různé barvy, takže některá hrana trojúhelníku má vždy shodné konce.
            colors: { t: 0, a: 1, b: 0, c: 0, d: 1 }
          - caption: |
              Odebereme hranu $tb$. Trojúhelník zmizí, zůstane sudá kružnice $a, b, d, c$ s „přívěskem“ $t$ – a ta je **2-obarvitelná**.
            remove: [[t, b]]
            colors: { t: 1, a: 0, b: 1, c: 1, d: 0 }
    source: "skripta str. 44, Definice 7.1 + poznámka; folie TGD1-09 s. 1"
    supplemented: false

  - id: def-chromaticke-cislo
    kind: definition
    label: "Definice 7.2"
    section: "7.1"
    title: Chromatické číslo (barevnost)
    terms: [chromatické číslo, barevnost grafu, "χ(G)", chí, chromatic number]
    statement: |
      Nejmenší přirozené číslo $k$, pro které je graf $G$ $k$-obarvitelný, se
      nazývá **chromatické číslo** (**barevnost**) grafu $G$ a značí se $\chi(G)$.
    intuition: |
      Abychom ukázali $\chi(G)=k$, potřebujeme dvě věci: **obarvení $k$ barvami**
      (horní odhad) a **důkaz, že $k-1$ barev nestačí** (dolní odhad – např.
      klika $K_k$, lichá kružnice nebo argument $n/\alpha$).
    examples:
      - title: Základní hodnoty
        body: |
          - Kružnice sudé délky: $\chi=2$ (barvy se střídají).
          - Kružnice liché délky: $\chi=3$ (střídání se „nezavře").
          - Strom (s aspoň jednou hranou): $\chi=2$ (barvíme podle parity
            vzdálenosti od kořene).
          - Úplný graf $K_n$: $\chi=n$ (každé dva uzly sousedí).
          - Graf z [rozvrhu hodin](#rem-motivace-barveni): $\chi=4$.
    related: [def-k-obarvitelnost, prop-7-1-klika-dolni-odhad, thm-7-1-delta-plus-jedna, thm-brooks, rem-odhady-chromatickeho-cisla]
    illustrations:
      - title: "$\\chi(C_5) = 3$: horní a dolní odhad"
        for: statement
        property: proper-coloring
        graph:
          directed: false
          nodes:
            - { id: a, x: 5, y: 9.5 }
            - { id: b, x: 9.5, y: 6.2 }
            - { id: c, x: 7.8, y: 1 }
            - { id: d, x: 2.2, y: 1 }
            - { id: e, x: 0.5, y: 6.2 }
          edges:
            - { from: a, to: b }
            - { from: b, to: c }
            - { from: c, to: d }
            - { from: d, to: e }
            - { from: e, to: a }
        steps:
          - caption: |
              Každý uzel jinou barvou – to jde vždy, takže triviálně $\chi(C_5) \le 5$. Otázka je, kolik barev **stačí**.
            colors: { a: 0, b: 1, c: 2, d: 3, e: 4 }
          - caption: |
              Se dvěma barvami se barvy podél kružnice musí střídat. Na liché délce se střídání „nezavře“ – $e$ a $a$ dostanou stejnou barvu. Proto $\chi \ge 3$.
            colors: { a: 0, b: 1, c: 0, d: 1, e: 0 }
          - caption: |
              Stačí ale změnit barvu jedinému uzlu na třetí: tři barvy stačí, $\chi \le 3$. Spolu s dolním odhadem $\chi(C_5) = 3$.
            colors: { a: 0, b: 1, c: 0, d: 1, e: 2 }
          - caption: |
              Přidáme tětivu $ac$: vznikne trojúhelník $a, b, c$ (další důvod pro $\chi \ge 3$), ale tři barvy po přebarvení stále stačí.
            add: [[a, c]]
            colors: { a: 0, b: 1, c: 2, d: 0, e: 1 }
    source: "skripta str. 44–45, Definice 7.2 + příklady; folie TGD1-09 s. 1"
    supplemented: false

  - id: rem-barveni-a-nezavisle-mnoziny
    kind: remark
    section: "7.1"
    title: Barvení = rozklad na nezávislé množiny
    terms: [rozklad na nezávislé množiny, monochromatická třída, barevná třída, color class]
    statement: |
      Úloha nalézt chromatické číslo grafu je ekvivalentní s úlohou rozložit
      množinu uzlů grafu na minimální počet nezávislých podmnožin.
    intuition: |
      Z obarvení dostaneme rozklad: třídy uzlů stejné barvy jsou nezávislé.
      Z rozkladu na nezávislé množiny $A_1,\dots,A_k$ dostaneme obarvení:
      uzlům z $A_i$ dáme barvu $i$. Tento pohled vede k
      [Větě 7.5](#thm-7-5-chi-a-alfa) a k heuristice
      [barvení nezávislými množinami](#alg-barveni-nezavislymi-mnozinami).
    related: [def-chromaticke-cislo, def-nezavisla-mnozina, thm-7-5-chi-a-alfa]
    source: "skripta str. 45 a 46, poznámky"
    supplemented: false

  - id: prop-7-1-klika-dolni-odhad
    kind: proposition
    label: "Tvrzení 7.1"
    section: "7.1"
    title: Úplný podgraf dává dolní odhad
    terms: [dolní odhad chromatického čísla, klika a barevnost, chí větší než omega, clique lower bound]
    statement: |
      Nechť $G$ obsahuje jako podgraf úplný graf $K_k$. Pak $\chi(G) \ge k$.
      Speciálně $\chi(G)\ge\omega(G)$.
    intuition: |
      Uzly úplného podgrafu se navzájem všechny „vidí", každý potřebuje
      vlastní barvu. Pozor, nerovnost může být ostrá: graf z
      [rozvrhu hodin](#rem-motivace-barveni) neobsahuje $K_4$, a přesto
      $\chi=4$; ještě jednodušší je $C_5$ s $\omega=2$ a $\chi=3$. Existují
      dokonce grafy bez trojúhelníků s libovolně velkým chromatickým číslem
      (Mycielského konstrukce – doplněno).
    proof: |
      Každé dobré obarvení grafu $G$ zúžené na uzly podgrafu $K_k$ je dobrým
      obarvením $K_k$. V $K_k$ jsou každé dva uzly sousední, takže všech $k$
      uzlů musí mít různé barvy – obarvení tedy používá aspoň $k$ barev.
      Proto $\chi(G)\ge\chi(K_k)=k$. Volbou největší kliky dostaneme
      $\chi(G)\ge\omega(G)$. $\square$
    proof_steps:
      - 'Vezmeme libovolné dobré obarvení grafu G.'
      - 'Jeho zúžení na uzly podgrafu K_k je dobrým obarvením K_k.'
      - 'V K_k jsou každé dva uzly sousední, takže potřebují k různých barev.'
      - 'Obarvení G tedy má aspoň k barev, tj. χ(G) ≥ k; pro největší kliku χ(G) ≥ ω(G).'
    related: [def-klikovost, def-chromaticke-cislo, rem-odhady-chromatickeho-cisla]
    illustrations:
      - title: Klika $K_4$ vynutí čtyři barvy
        for: proof
        property: proper-coloring
        graph:
          directed: false
          nodes:
            - { id: a, x: 1, y: 8 }
            - { id: b, x: 1, y: 2 }
            - { id: c, x: 4.5, y: 8 }
            - { id: d, x: 4.5, y: 2 }
            - { id: e, x: 7, y: 5 }
            - { id: f, x: 9.5, y: 5 }
          edges:
            - { from: a, to: b }
            - { from: a, to: c }
            - { from: a, to: d }
            - { from: b, to: c }
            - { from: b, to: d }
            - { from: c, to: d }
            - { from: c, to: e }
            - { from: d, to: e }
            - { from: e, to: f }
        steps:
          - caption: |
              Uzly $a, b, c, d$ tvoří $K_4$ – každé dva sousedí, takže každý potřebuje vlastní barvu. Zbytek grafu barvy jen „recykluje“: dobré obarvení čtyřmi barvami.
            colors: { a: 0, b: 1, c: 2, d: 3, e: 0, f: 1 }
          - caption: |
              Se třemi barvami musí dva uzly kliky sdílet barvu (zde $a$ a $d$) – a ty spolu sousedí. Proto $\chi(G) \ge 4 = \omega(G)$.
            colors: { a: 0, b: 1, c: 2, d: 0, e: 1, f: 0 }
          - caption: |
              Odebereme hranu $ad$: největší úplný podgraf je už jen $K_3$ a $a$, $d$ smějí mít stejnou barvu. Tři barvy teď stačí.
            remove: [[a, d]]
            colors: { a: 0, b: 1, c: 2, d: 0, e: 1, f: 0 }
    source: "skripta str. 45, Tvrzení 7.1 s důkazem + poznámka; folie TGD1-09 s. 1"
    supplemented: false

  - id: thm-7-1-delta-plus-jedna
    kind: theorem
    label: "Věta 7.1"
    section: "7.1"
    title: "χ(G) ≤ Δ(G) + 1"
    terms: [horní odhad chromatického čísla, maximální stupeň, delta plus jedna, upper bound chromatic number]
    statement: |
      Pro každý graf $G$ platí $\chi(G) \le \Delta(G) + 1$, kde $\Delta(G)$ je
      maximální stupeň grafu $G$.
    intuition: |
      Uzel má nejvýše $\Delta$ sousedů, ti „zablokují" nejvýše $\Delta$ barev,
      takže z $\Delta+1$ barev vždy jedna zbude. Důkaz je přímo
      [sekvenční (hladové) barvení](#alg-sekvencni-barveni) zapsané indukcí.
      Rovnost nastává pro úplné grafy a liché kružnice – a podle
      [Brooksovy věty](#thm-brooks) jen tehdy.
    proof: |
      Indukcí podle $n=|U(G)|$.

      1. Pro $n=1$ je $\Delta(G)=0$ a $\chi(G)=1$.
      2. Nechť tvrzení platí pro všechny grafy s $n-1$ uzly a $G$ má $n$ uzlů.
         Odstraněním libovolného uzlu $u$ vznikne graf $G'=G-u$ s $n-1$ uzly
         a maximálním stupněm $\Delta(G')\le\Delta(G)$. Podle indukčního
         předpokladu lze $G'$ obarvit $\Delta(G')+1\le\Delta(G)+1$ barvami.
         Uzel $u$ má nejvýše $\Delta(G)$ sousedů, ti používají nejvýše
         $\Delta(G)$ různých barev, takže mezi $\Delta(G)+1$ barvami je aspoň
         jedna, kterou žádný soused $u$ nemá – tou obarvíme $u$. $\square$
    proof_steps:
      - 'Indukce podle počtu uzlů; pro n = 1 je Δ = 0 a χ = 1.'
      - 'Odstraníme libovolný uzel u; graf G − u má maximální stupeň nejvýše Δ(G).'
      - 'Podle indukčního předpokladu obarvíme G − u nejvýše Δ(G) + 1 barvami.'
      - 'Sousedé u (nejvýše Δ(G)) používají nejvýše Δ(G) barev, takže jedna z Δ(G) + 1 barev zbývá a obarvíme jí u.'
    related: [thm-brooks, alg-sekvencni-barveni, rem-odhady-chromatickeho-cisla]
    illustrations:
      - title: Hladově nikdy víc než $\Delta + 1$ barev
        for: proof
        property: proper-coloring
        graph:
          directed: false
          nodes:
            - { id: a, x: 5, y: 9.5 }
            - { id: b, x: 1, y: 1.5 }
            - { id: c, x: 9, y: 1.5 }
            - { id: d, x: 5, y: 6.5 }
            - { id: e, x: 3.3, y: 3.3 }
            - { id: f, x: 6.7, y: 3.3 }
          edges:
            - { from: a, to: b }
            - { from: b, to: c }
            - { from: c, to: a }
            - { from: d, to: e }
            - { from: e, to: f }
            - { from: f, to: d }
            - { from: a, to: d }
            - { from: b, to: e }
            - { from: c, to: f }
        steps:
          - caption: |
              Hranol má $\Delta = 3$, k dispozici jsou tedy barvy $0$–$3$. Barvíme v pořadí $a, b, c, d, e, f$ vždy nejnižší volnou barvou: vnější trojúhelník dostane $0, 1, 2$.
            colors: { a: 0, b: 1, c: 2 }
          - caption: |
              $d$ má obarveného jen souseda $a$ (barva 0), dostane $1$. Uzel $e$ vidí barvy $1$ ($b$) a $1$ ($d$), dostane $0$. Zbývá $f$.
            colors: { a: 0, b: 1, c: 2, d: 1, e: 0 }
          - caption: |
              Sousedé $f$ blokují barvy $2, 1, 0$. Má ale jen $\Delta = 3$ sousedy, takže čtvrtá barva $3$ zbude **vždy** – proto $\chi \le \Delta + 1$.
            colors: { a: 0, b: 1, c: 2, d: 1, e: 0, f: 3 }
          - caption: |
              Odhad je jen horní mez: při pořadí $a, b, c, f, e, d$ vyjdou hladově 3 barvy, což je optimum (graf obsahuje trojúhelník).
            colors: { a: 0, b: 1, c: 2, f: 0, e: 2, d: 1 }
    source: "skripta str. 45, Věta 7.1 s důkazem; folie TGD1-09 s. 1"
    supplemented: false

  - id: thm-brooks
    kind: theorem
    label: "Věta 7.2 (Brooks)"
    section: "7.1"
    title: Brooksova věta
    terms: [Brooks, Brooksova věta, Brooks theorem, chí menší nebo rovno delta]
    statement: |
      Pro každý graf $G$ platí $\chi(G) \le \Delta(G)$ až na tyto dvě výjimky:

      I. $G$ má komponentu $K_{\Delta(G)+1}$,

      II. $\Delta(G)=2$ a $G$ má za komponentu kružnici liché délky.
    intuition: |
      Odhad $\Delta+1$ z [Věty 7.1](#thm-7-1-delta-plus-jedna) je skoro vždy
      o jedna horší, než je nutné. Barva navíc je potřeba jen tehdy, když je
      graf „zamčený" úplně – úplný graf, kde všichni sousedé každého uzlu
      sousedí i mezi sebou, nebo lichá kružnice. Ve všech ostatních případech
      lze uzly uspořádat tak, aby každý (kromě posledního) měl při barvení
      volný aspoň jeden „později barvený" soused, a poslednímu uzlu se dvě
      barvy sousedů „slijí" do jedné.
    proof: |
      *Důkaz ve skriptech není, doplněno – uvádíme jen myšlenku (podle
      Lovásze); úplný důkaz přesahuje rámec předmětu.*

      Komponenty barvíme zvlášť, stačí tedy uvažovat souvislý graf $G$, který
      není úplný ani lichá kružnice, a ukázat $\chi(G)\le\Delta$.
      Pro $\Delta\le2$ je $G$ cesta nebo sudá kružnice, stačí 2 barvy.
      Nechť $\Delta\ge3$.

      - *$G$ není $\Delta$-regulární.* Zvolíme uzel $r$ se stupněm $<\Delta$
        a uzly uspořádáme podle klesající vzdálenosti od $r$ ($r$ poslední).
        Při sekvenčním barvení má každý uzel $x\ne r$ souseda bližšího
        k $r$, který ještě obarven není, takže barvy blokuje nejvýše
        $\Delta-1$ sousedů; $r$ má méně než $\Delta$ sousedů. Stačí $\Delta$ barev.
      - *$G$ je $\Delta$-regulární a má artikulaci.* Každý blok obsahuje
        artikulaci se stupněm (v bloku) menším než $\Delta$, takže ho podle
        předchozího případu obarvíme $\Delta$ barvami; barvy v blocích pak
        permutujeme tak, aby souhlasily v artikulacích.
      - *$G$ je $\Delta$-regulární a 2-souvislý.* Protože $G$ není úplný, lze
        najít uzel $v$ se dvěma nesousedními sousedy $a,b$ tak, že $G-\{a,b\}$
        je souvislý. Uzly $a,b$ obarvíme barvou 1, zbytek uspořádáme podle
        klesající vzdálenosti od $v$ v $G-\{a,b\}$ ($v$ poslední) a barvíme
        sekvenčně. Každý uzel $\ne v$ má později barveného souseda; uzel $v$
        má $\Delta$ sousedů, ale $a,b$ mají stejnou barvu, takže sousedé
        používají nejvýše $\Delta-1$ barev a pro $v$ barva zbude. $\square$
    proof_steps:
      - 'Stačí uvažovat souvislý graf, který není úplný ani lichá kružnice; případ Δ ≤ 2 (cesty, sudé kružnice) je triviální.'
      - 'Není-li G regulární, uspořádáme uzly podle klesající vzdálenosti od uzlu r stupně < Δ a barvíme sekvenčně – každý uzel má neobarveného souseda, stačí Δ barev.'
      - 'Má-li regulární G artikulaci, obarvíme bloky zvlášť předchozím postupem a sladíme barvy v artikulacích.'
      - 'Je-li G regulární a 2-souvislý, najdeme uzel v s nesousedními sousedy a, b, pro něž je G − {a, b} souvislý, a obarvíme a, b stejnou barvou.'
      - 'Zbytek barvíme sekvenčně podle klesající vzdálenosti od v; uzlu v se díky shodné barvě a, b uvolní jedna z Δ barev.'
    examples:
      - title: Kdy Brooks pomůže
        body: |
          - Petersenův graf: $\Delta=3$, není úplný ani lichá kružnice, takže
            $\chi\le3$ (a protože obsahuje lichou kružnici $C_5$, je $\chi=3$).
          - $K_4$: $\Delta=3$, ale $\chi=4$ – výjimka I.
          - $C_7$: $\Delta=2$, $\chi=3$ – výjimka II.
    related: [thm-7-1-delta-plus-jedna, cor-7-1-brooks-souvisly, alg-sekvencni-barveni]
    illustrations:
      - title: "Výjimka I: úplný graf"
        for: statement
        property: proper-coloring
        graph:
          directed: false
          nodes:
            - { id: a, x: 1, y: 9 }
            - { id: b, x: 9, y: 9 }
            - { id: c, x: 9, y: 1 }
            - { id: d, x: 1, y: 1 }
          edges:
            - { from: a, to: b }
            - { from: a, to: c }
            - { from: a, to: d }
            - { from: b, to: c }
            - { from: b, to: d }
            - { from: c, to: d }
        steps:
          - caption: |
              $K_4$ má $\Delta = 3$, ale potřebuje 4 barvy: $\chi = \Delta + 1$. To je výjimka I Brooksovy věty.
            colors: { a: 0, b: 1, c: 2, d: 3 }
          - caption: |
              Se třemi barvami by dva uzly sdílely barvu – v úplném grafu ale sousedí každé dva.
            colors: { a: 0, b: 1, c: 2, d: 0 }
          - caption: |
              Odebereme hranu $ad$. Graf už není úplný, $\Delta$ zůstává $3$ (uzly $b$, $c$) a podle Brookse stačí $\Delta = 3$ barvy – $a$ a $d$ smějí sdílet barvu.
            remove: [[a, d]]
            colors: { a: 0, b: 1, c: 2, d: 0 }
      - title: "Výjimka II: lichá kružnice"
        for: statement
        property: proper-coloring
        graph:
          directed: false
          nodes:
            - { id: a, x: 4.5, y: 9 }
            - { id: b, x: 8.3, y: 6.2 }
            - { id: c, x: 6.9, y: 1.5 }
            - { id: d, x: 2.1, y: 1.5 }
            - { id: e, x: 0.7, y: 6.2 }
            - { id: f, x: 9.5, y: 9.5 }
          edges:
            - { from: a, to: b }
            - { from: b, to: c }
            - { from: c, to: d }
            - { from: d, to: e }
            - { from: e, to: a }
        steps:
          - caption: |
              Komponenta $C_5$ má $\Delta = 2$, ale dvě barvy nestačí – střídání se na liché kružnici nezavře.
            colors: { a: 0, b: 1, c: 0, d: 1, e: 0, f: 0 }
          - caption: |
              Je potřeba třetí barva, $\chi = 3 = \Delta + 1$. To je výjimka II.
            colors: { a: 0, b: 1, c: 0, d: 1, e: 2, f: 0 }
          - caption: |
              Připojíme uzel $f$ hranou k $a$: $\Delta = 3$ a graf už není kružnice ani úplný. Brooks dává $\chi \le 3$ – a tři barvy opravdu stačí. Výjimka je „křehká“.
            add: [[f, a]]
            colors: { a: 0, b: 1, c: 0, d: 1, e: 2, f: 1 }
    source: "skripta str. 45, Věta 7.2 (bez důkazu); folie TGD1-09 s. 2"
