  - id: thm-2sat-p
    kind: theorem
    label: "Věta 9.2"
    section: "9.3"
    title: 2-SAT je polynomiální
    terms: [2-SAT ∈ P, polynomialita 2-SAT, 2-SAT v lineárním čase]
    statement: |
      $\text{2-SAT} \in \mathrm{P}$.
    intuition: |
      U 2-SAT každé rozhodnutí *vynucuje* další (z nepravdivého literálu plyne pravdivost
      druhého literálu klauzule), takže se nic nemusí „zkoušet" – stačí analyzovat
      dosažitelnost v implikačním grafu. U 3-SAT nepravdivost jednoho literálu jen zúží
      klauzuli na „$b$ nebo $c$" a vznikají skutečné volby, které se kombinatoricky
      násobí – proto 3-SAT polynomiální algoritmus (pravděpodobně) nemá.
    proof: |
      Pro formuli $f$ s $n$ proměnnými a $m$ klauzulemi sestrojíme
      [implikační graf](#def-implikacni-graf) $\vec{G}_f$. Má $|U(\vec{G}_f)| = 2n$ uzlů a
      $|H(\vec{G}_f)| = 2m$ hran, jeho velikost je tedy polynomiální (lineární) funkcí
      velikosti formule a sestrojíme ho v čase $O(n + m)$.

      Kvazikomponenty, kondenzaci a acyklické očíslování kondenzace lze nalézt v
      polynomiálním čase (dokonce v čase $O(n+m)$, např. Tarjanovým algoritmem). Podle
      [Lemmatu 9.4](#lemma-2sat-splnitelnost) je $f$ splnitelná právě když žádná
      kvazikomponenta neobsahuje dvojici $x_i, \bar x_i$, což ověříme v čase $O(n)$.
      Dostáváme tak polynomiální algoritmus pro 2-SAT, tj. $\text{2-SAT} \in \mathrm{P}$.
      Důkaz Lemmatu 9.4 navíc dává i konstrukci splňujícího přiřazení. $\square$
    proof_steps:
      - "Z formule sestrojíme implikační graf $\\vec{G}_f$ se $2n$ uzly a $2m$ hranami: klauzule $(a \\vee b)$ dává hrany $(\\bar a, b)$ a $(\\bar b, a)$."
      - "Dokážeme pomocná lemmata: symetrie sledů (9.1), cesta přenáší pravdivost (9.2), kvazikomponenta má jednotnou hodnotu (9.3)."
      - "Lemma 9.4: $f$ je splnitelná právě když žádná kvazikomponenta neobsahuje proměnnou i její negaci; přiřazení se získá z acyklického očíslování kondenzace."
      - "Kvazikomponenty, kondenzaci a acyklické očíslování nalezneme v polynomiálním (lineárním) čase."
      - "Test podmínky z Lemmatu 9.4 je tedy polynomiální algoritmus pro 2-SAT, a proto 2-SAT ∈ P."
    related: [def-2-sat, def-implikacni-graf, lemma-2sat-splnitelnost, alg-2sat, def-trida-p, thm-3sat-npc]
    source: "skripta str. 58–59; folie 11, str. 3–4"

  - id: alg-2sat
    kind: algorithm
    section: "9.3"
    title: Algoritmus pro 2-SAT přes implikační graf
    terms: [algoritmus 2-SAT, implikační graf, kvazikomponenty, silně souvislé komponenty, Tarjanův algoritmus, Aspvall–Plass–Tarjan]
    statement: |
      **Vstup:** formule $f = (a_1 \vee b_1) \wedge \dots \wedge (a_m \vee b_m)$ v proměnných
      $x_1, \dots, x_n$.
      **Výstup:** NE, nebo splňující přiřazení $t$.
    intuition: |
      Sestrojíme graf vynucených implikací, sbalíme ho na kvazikomponenty (literály, které
      musí mít stejnou hodnotu) a ověříme, že žádná proměnná není ekvivalentní své negaci.
      Pak dáváme pravdu literálům „nejvíc po proudu" – z pravdivého literálu vedou hrany
      jen do pravdivých.
    pseudocode: |
      1. Sestroj $\vec{G}_f$: uzly $x_1, \dots, x_n, \bar x_1, \dots, \bar x_n$; pro každou
         klauzuli $(a \vee b)$ přidej hrany $(\bar a, b)$ a $(\bar b, a)$.
      2. Najdi kvazikomponenty $\vec{G}_f$ (např. Tarjanovým nebo Kosarajuovým algoritmem).
      3. Pokud pro některé $i$ leží $x_i$ a $\bar x_i$ v téže kvazikomponentě, vrať **NE**
         (formule není splnitelná).
      4. Kondenzaci očísluj acyklicky: $\vec{G}_1, \dots, \vec{G}_s$, hrany vedou jen z
         $\vec{G}_i$ do $\vec{G}_j$ pro $i < j$. Pro literál $a$ nechť $\iota(a)$ je index
         jeho kvazikomponenty.
      5. Pro $i = 1, \dots, n$ polož $x_i := 1$, je-li $\iota(x_i) > \iota(\bar x_i)$, jinak
         $x_i := 0$.
      6. Vrať přiřazení $t = (x_1, \dots, x_n)$.
    complexity: |
      $O(n + m)$ – graf má $2n$ uzlů a $2m$ hran, kvazikomponenty i acyklické očíslování
      kondenzace se najdou lineárním průchodem do hloubky (Tarjanův algoritmus vydává
      kvazikomponenty dokonce rovnou v obráceném acyklickém pořadí) a kroky 3 a 5 stojí
      $O(n)$. Ve skriptech stačí tvrzení „polynomiální".
    examples:
      - title: Splnitelná formule s acyklickým grafem
        body: |
          $f(x_1,x_2,x_3) = (\bar x_1 \vee \bar x_3) \wedge (x_2 \vee \bar x_3) \wedge (\bar x_1 \vee x_3) \wedge (x_2 \vee x_3)$.

          Hrany: $(x_1,\bar x_3), (x_3,\bar x_1)$; $(\bar x_2,\bar x_3), (x_3, x_2)$;
          $(x_1, x_3), (\bar x_3, \bar x_1)$; $(\bar x_2, x_3), (\bar x_3, x_2)$.
          Graf je acyklický, každá kvazikomponenta je jediný uzel. Acyklické očíslování:

          | uzel | $x_1$ | $x_2$ | $x_3$ | $\bar x_1$ | $\bar x_2$ | $\bar x_3$ |
          |---|---|---|---|---|---|---|
          | $\iota$ | 1 | 5 | 4 | 6 | 2 | 3 |

          $\iota(\bar x_1) = 6 > 1$ … $x_1 = 0$; $\iota(x_2) = 5 > 2$ … $x_2 = 1$;
          $\iota(x_3) = 4 > 3$ … $x_3 = 1$. Splňující přiřazení $t = (0,1,1)$ – ověření:
          $(1 \vee 0)(1 \vee 0)(1 \vee 1)(1 \vee 1) = 1$.
        graph:
          directed: true
          nodes:
            - { id: nx1, x: 0, y: 0, label: "¬x1" }
            - { id: nx2, x: 4, y: 0, label: "¬x2" }
            - { id: nx3, x: 8, y: 0, label: "¬x3" }
            - { id: x1, x: 0, y: 4, label: "x1" }
            - { id: x2, x: 4, y: 4, label: "x2" }
            - { id: x3, x: 8, y: 4, label: "x3" }
          edges:
            - { from: x1, to: nx3 }
            - { from: x3, to: nx1 }
            - { from: nx2, to: nx3 }
            - { from: x3, to: x2 }
            - { from: x1, to: x3 }
            - { from: nx3, to: nx1 }
            - { from: nx2, to: x3 }
            - { from: nx3, to: x2 }
      - title: Nesplnitelná formule – graf je silně souvislý
        body: |
          $f(x_1,x_2,x_3) = (x_1 \vee x_2) \wedge (\bar x_1 \vee x_2) \wedge (\bar x_2 \vee x_3) \wedge (\bar x_2 \vee \bar x_3)$.

          Hrany: $(\bar x_1, x_2), (\bar x_2, x_1), (x_1, x_2), (\bar x_2, \bar x_1), (x_2, x_3), (\bar x_3, \bar x_2), (x_2, \bar x_3), (x_3, \bar x_2)$.
          Např. $x_2 \to x_3 \to \bar x_2 \to x_1 \to x_2$, takže $x_2$ a $\bar x_2$ jsou v téže
          kvazikomponentě (graf je dokonce silně souvislý) – formule **není splnitelná**.
          (Intuitivně: první dvě klauzule vynucují $x_2 = 1$ a poslední dvě pak $x_3 = 1$ i
          $x_3 = 0$.)
        graph:
          directed: true
          nodes:
            - { id: nx1, x: 0, y: 0, label: "¬x1" }
            - { id: nx2, x: 4, y: 0, label: "¬x2" }
            - { id: nx3, x: 8, y: 0, label: "¬x3" }
            - { id: x1, x: 0, y: 4, label: "x1" }
            - { id: x2, x: 4, y: 4, label: "x2" }
            - { id: x3, x: 8, y: 4, label: "x3" }
          edges:
            - { from: nx1, to: x2 }
            - { from: nx2, to: x1 }
            - { from: x1, to: x2 }
            - { from: nx2, to: nx1 }
            - { from: x2, to: x3 }
            - { from: nx3, to: nx2 }
            - { from: x2, to: nx3 }
            - { from: x3, to: nx2 }
      - title: Netriviální kvazikomponenty (vlastní příklad)
        body: |
          $f = (\bar x_1 \vee x_2) \wedge (x_1 \vee \bar x_2) \wedge (x_1 \vee x_3) \wedge (\bar x_2 \vee \bar x_3)$.

          Hrany: $(x_1, x_2), (\bar x_2, \bar x_1), (x_2, x_1), (\bar x_1, \bar x_2), (\bar x_1, x_3), (\bar x_3, x_1), (x_2, \bar x_3), (x_3, \bar x_2)$.
          Kvazikomponenty jsou dvě: $K = \{\bar x_1, \bar x_2, x_3\}$ a
          $K' = \{x_1, x_2, \bar x_3\}$ (všimněte si symetrie – $K'$ obsahuje přesně negace
          literálů z $K$). Žádná neobsahuje proměnnou i její negaci, formule je splnitelná.
          Mezi $K$ a $K'$ nevede žádná hrana, zvolíme třeba $\iota(K) = 1$, $\iota(K') = 2$;
          pravdivé jsou literály z $K'$: $t = (1, 1, 0)$. Ověření:
          $(0 \vee 1)(1 \vee 0)(1 \vee 0)(0 \vee 1) = 1$.
        graph:
          directed: true
          nodes:
            - { id: nx1, x: 0, y: 0, label: "¬x1" }
            - { id: nx2, x: 4, y: 0, label: "¬x2" }
            - { id: nx3, x: 8, y: 0, label: "¬x3" }
            - { id: x1, x: 0, y: 4, label: "x1" }
            - { id: x2, x: 4, y: 4, label: "x2" }
            - { id: x3, x: 8, y: 4, label: "x3" }
          edges:
            - { from: x1, to: x2 }
            - { from: nx2, to: nx1 }
            - { from: x2, to: x1 }
            - { from: nx1, to: nx2 }
            - { from: nx1, to: x3 }
            - { from: nx3, to: x1 }
            - { from: x2, to: nx3 }
            - { from: x3, to: nx2 }
