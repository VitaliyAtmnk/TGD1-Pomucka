  - id: rem-dalsi-npc-problemy
    kind: remark
    label: "Poznámka (za Větou 9.11)"
    section: "9.8"
    title: Další NP-úplné problémy
    terms: [k-COL pro k > 3, HAM je NP-úplný, chromatický index, Vizingova věta, NP-úplné problémy]
    statement: |
      1. NP-úplnost problému $k$-obarvitelnosti pro $k > 3$ se dokáže analogicky, ale důkaz
         je složitější (základní konstrukce je obdobná, ale grafy používané jako „stavební
         kameny" jsou komplikovanější).
      2. Mezi základní NP-úplné problémy patří také problém **HAM** (existence
         hamiltonovské kružnice). Příslušnost do NP jsme ukázali
         [nedeterministickým algoritmem](#alg-ham-nedeterministicky); NP-úplnost dokazovat
         nebudeme.
      3. Rozhodnutí, zda pro daný neorientovaný graf $G$ platí $\chi'(G) = \Delta(G)$ nebo
         $\chi'(G) = \Delta(G) + 1$ (viz Vizingova věta – Věta 7.8), je také NP-úplný problém.
    intuition: |
      *Doplněno:* $k$-COL pro $k > 3$ lze také snadno redukovat z 3-COL – stačí přidat
      $k - 3$ nových uzlů spojených navzájem i se všemi původními uzly. Bod 3 je zajímavý
      tím, že odpověď je vždy jedna ze dvou sousedních hodnot (Vizing), a přesto je
      rozhodnout, která z nich, NP-úplné (Holyer, 1981).
    related: [thm-3col-npc, alg-ham-nedeterministicky, def-k-col, def-chromaticke-cislo]
    source: "skripta str. 72"

quiz:
  - id: q-np-01
    question: |
      Problém $X$ je NP-úplný a pro problém $Y$ jsme ukázali $Y \triangleleft X$. Co z toho plyne?
    options:
      - $Y$ je NP-úplný.
      - $Y \in \mathrm{NP}$, ale o NP-úplnosti $Y$ nevíme nic.
      - $Y \notin \mathrm{P}$.
      - $X \triangleleft Y$.
    correct: 1
    explanation: |
      Podle Věty 9.4 (bod 2) z $Y \triangleleft X$ a $X \in \mathrm{NP}$ plyne $Y \in \mathrm{NP}$.
      Redukce *na* těžký problém ale o obtížnosti $Y$ nic neříká – $Y$ může být i triviální.
      Pro NP-úplnost $Y$ bychom potřebovali opačný směr $X \triangleleft Y$.
    related: [thm-vlastnosti-redukce, def-np-uplny]
  - id: q-np-02
    question: |
      Chceme dokázat, že nový problém $Z \in \mathrm{NP}$ je NP-úplný. Co stačí ukázat?
    options:
      - $Z \triangleleft \text{SAT}$
      - $Z \triangleleft K$ pro nějaký $K \in \mathrm{NPC}$
      - $K \triangleleft Z$ pro nějaký $K \in \mathrm{NPC}$
      - že $Z$ nemá polynomiální algoritmus hrubou silou
    correct: 2
    explanation: |
      Podle poznámky za Cookovou větou: je-li $Z \in \mathrm{NP}$, stačí redukovat **známý**
      NP-úplný problém $K$ **na** $Z$. Každý $J \in \mathrm{NP}$ pak splňuje $J \triangleleft K \triangleleft Z$ a
      z tranzitivity $J \triangleleft Z$. Redukce $Z \triangleleft \text{SAT}$ platí pro každý problém z NP
      (Cookova věta), takže nic nedokazuje.
    related: [rem-po-cookove-vete, def-np-uplny, thm-vlastnosti-redukce]
  - id: q-np-03
    question: |
      Formule 2-SAT má implikační graf $\vec{G}_f$. Kdy je $f$ **nesplnitelná**?
    options:
      - Když $\vec{G}_f$ obsahuje orientovaný cyklus.
      - Když existuje cesta z $x_i$ do $\bar x_i$ pro nějaké $i$.
      - Když $\vec{G}_f$ není silně souvislý.
      - Když nějaká kvazikomponenta obsahuje současně $x_i$ i $\bar x_i$.
    correct: 3
    explanation: |
      Lemma 9.4. Cyklus sám o sobě nevadí (jen sjednotí hodnoty literálů). Cesta z $x_i$ do
      $\bar x_i$ jen vynucuje $x_i = 0$ – spor nastane, až když vede i cesta zpět, tj. oba
      literály jsou v téže kvazikomponentě.
    related: [lemma-2sat-splnitelnost, alg-2sat]
  - id: q-np-04
    question: |
      Jaká je časová složitost algoritmu pro 2-SAT přes implikační graf (formule s $n$
      proměnnými a $m$ klauzulemi)?
    options:
      - $O(n + m)$
      - $O(2^n \cdot m)$
      - $O(n^3)$, protože je nutné spočítat tranzitivní uzávěr
      - $O(m \log m)$
    correct: 0
    explanation: |
      Graf má $2n$ uzlů a $2m$ hran; kvazikomponenty i acyklické očíslování kondenzace
      najdeme lineárním průchodem do hloubky (Tarjan). Tranzitivní uzávěr není potřeba.
    related: [alg-2sat, thm-2sat-p]
  - id: q-np-05
    question: |
      Proč nelze algoritmus pro 2-SAT jednoduše zobecnit na 3-SAT?
    options:
      - Protože 3-SAT má více proměnných.
      - Protože klauzuli $(a \vee b \vee c)$ nelze zapsat jako implikace mezi dvojicemi literálů – nepravdivost $a$ vynutí jen „$b$ nebo $c$", ne konkrétní literál.
      - Protože u 3-SAT implikační graf není orientovaný.
      - Lze – 3-SAT je také v P.
    correct: 1
    explanation: |
      U 2-SAT z $\bar a$ plyne přímo $b$, takže rozhodnutí se šíří jednoznačně po hranách
      grafu. U 3 literálů vzniká skutečná volba a 3-SAT je NP-úplný (Věta 9.7); polynomiální
      algoritmus by znamenal $\mathrm{P} = \mathrm{NP}$.
    related: [thm-2sat-p, thm-3sat-npc]
  - id: q-np-06
    question: |
      Které tvrzení o třídě NP je **pravdivé**?
    options:
      - NP je třída problémů, které nejsou řešitelné v polynomiálním čase.
      - Do NP patří i optimalizační úlohy, např. určení $\alpha(G)$.
      - Každý problém z P patří do NP.
      - Do NP patří každý rozhodnutelný problém.
    correct: 2
    explanation: |
      Věta 9.3: $\mathrm{P} \subseteq \mathrm{NP}$. „N" znamená nedeterministický, ne
      „nepolynomiální". NP obsahuje jen rozhodovací problémy a existují i rozhodnutelné
      problémy mimo NP.
    related: [thm-p-podmnozina-np, def-trida-np]
  - id: q-np-07
    question: |
      Nedeterministický přijímací počítač $M$ **odmítá** slovo $w$. Kdy podle Definice 9.7
      zpracuje $w$ v čase nejvýše $t$?
    options:
      - Když každý přípustný výpočet na $w$ skončí po nejvýše $t$ krocích.
      - Když alespoň jeden přípustný výpočet skončí `REJECT` po nejvýše $t$ krocích.
      - Když počet přípustných výpočtů je nejvýše $t$.
      - Když nejkratší přípustný výpočet má nejvýše $t$ kroků.
    correct: 0
    explanation: |
      Při odmítnutí musíme ověřit, že žádný výpočet nekončí `ACCEPT`, tj. počkat na všechny –
      rozhoduje nejdelší z nich. Při přijetí stačí jeden přijímající výpočet délky nejvýše $t$.
    related: [def-cas-nedeterministickeho-vypoctu, def-prijimani-nedeterministickym-pocitacem]
  - id: q-np-08
    question: |
      Kdyby někdo našel polynomiální algoritmus pro 3-COL, co by z toho plynulo?
    options:
      - Jen to, že 3-COL nebyl NP-úplný.
      - Že $\mathrm{P} = \mathrm{NP}$, a tedy i SAT, IND, HAM … by byly v P.
      - Že $\mathrm{P} \ne \mathrm{NP}$.
      - Pouze to, že 4-COL je v P.
    correct: 1
    explanation: |
      3-COL je NP-úplný (Věta 9.11). Podle Věty 9.5 platí buď $\mathrm{P} = \mathrm{NP}$, nebo
      $\mathrm{P} \cap \mathrm{NPC} = \emptyset$; polynomiální algoritmus pro NP-úplný problém
      by tedy znamenal $\mathrm{P} = \mathrm{NP}$.
    related: [thm-p-np-npc, thm-3col-npc]
  - id: q-np-09
    question: |
      Proč je $\text{IND}_k$ (pevné $k$) v P, zatímco IND je NP-úplný?
    options:
      - Protože pro pevné $k$ stačí projít $\binom{n}{k} = O(n^k)$ podmnožin, což je polynom; je-li $k$ součástí vstupu (např. $k = n/2$), počet podmnožin je exponenciální.
      - Protože IND$_k$ hledá množinu velikosti právě $k$, zatímco IND alespoň $k$.
      - Protože IND$_k$ je definován jen pro bipartitní grafy.
      - Protože pro pevné $k$ lze použít algoritmus pro 2-SAT.
    correct: 0
    explanation: |
      Rozdíl „právě/alespoň" je nepodstatný (IND$_=$ je také NP-úplný). Podstatné je, zda je
      $k$ konstanta: $O(n^k)$ je polynom jen pro pevné $k$, pro $k = n/2$ je
      $\binom{n}{n/2} > (\sqrt{2})^n$.
    related: [prop-ind-k-p, rem-hranice-ind-k, prop-ind-rovno-npc]
  - id: q-np-10
    question: |
      V redukci 3-SAT ◁ IND má formule $m$ klauzulí. Jaký graf a jaké $k$ sestrojíme?
    options:
      - Uzel za každou proměnnou, hrany mezi proměnnými ve společné klauzuli, $k = n$.
      - Uzel za každý výskyt literálu, trojúhelník pro každou klauzuli, hrany mezi komplementárními literály, $k = m$.
      - Uzel za každou klauzuli, hrany mezi klauzulemi se společnou proměnnou, $k = m$.
      - Uzel za každý literál $x_i, \bar x_i$, hrany $x_i \bar x_i$, $k = n$.
    correct: 1
    explanation: |
      Trojúhelník zajistí, že z klauzule vybereme nejvýše jeden literál, hrany mezi $x$ a $\bar x$
      zajistí bezespornost. Nezávislá množina velikosti $m$ = jeden pravdivý literál v každé klauzuli.
    related: [thm-ind-npc, rem-redukce-sat-na-ind]
  - id: q-np-11
    question: |
      Graf má $n = 10$ uzlů. Jakou instanci COV dostaneme redukcí z instance $(G, k = 4)$ problému IND?
    options:
      - $(G, 4)$
      - $(\bar G, 4)$
      - $(G, 6)$
      - $(\bar G, 6)$
    correct: 2
    explanation: |
      $M$ je nezávislá právě když $U(G) \setminus M$ je pokrytí. Nezávislá množina velikosti
      alespoň 4 existuje právě když existuje pokrytí velikosti nejvýše $10 - 4 = 6$. Doplněk
      grafu $\bar G$ se používá v redukci IND ◁ CLIQUE.
    related: [thm-cov-npc, thm-clique-npc]
  - id: q-np-12
    question: |
      V redukci 3-SAT ◁ 3-COL je uzel $d$ každého gadgetu $G_2$ spojen s uzlem $u$ (barva 0).
      K čemu to slouží?
    options:
      - Aby literálové uzly měly barvy 0 nebo 1.
      - Aby $x_i$ a $\bar x_i$ měly různé barvy.
      - Aby graf byl souvislý.
      - Aby $d$ nesměl mít barvu 0, což je možné právě když aspoň jeden literál klauzule má barvu 1 (je pravdivý).
    correct: 3
    explanation: |
      Gadget $G_2$ vynutí $d = 0$, jsou-li všechny tři vstupy 0; jinak může být $d$ obarven 1.
      Hrana $du$ tedy zakazuje nepravdivé klauzule. Barvy literálů 0/1 zajišťuje hrana k $w$
      (barva 2), komplementaritu hrana $x_i \bar x_i$.
    related: [thm-3col-npc, lemma-gadgety-3col]
  - id: q-np-13
    question: |
      Proč nemůže být úloha „urči $\chi(G)$" NP-úplná?
    options:
      - Protože je řešitelná v polynomiálním čase.
      - Protože to není rozhodovací problém, a tedy nepatří do NP; je pouze NP-těžká.
      - Protože 3-COL je v P.
      - Protože chromatické číslo lze vždy určit Vizingovou větou.
    correct: 1
    explanation: |
      NP-úplné jsou podle Definice 9.12 jen jazyky z NP, tj. rozhodovací problémy.
      Optimalizační verze NP-úplných problémů ($\alpha(G)$, $\omega(G)$, $\chi(G)$) jsou NP-těžké.
    related: [def-np-tezky, rem-npc-poznamky]
  - id: q-np-14
    question: |
      Co je hlavní myšlenkou důkazu Cookovy věty?
    options:
      - Každý problém z NP lze převést na 2-SAT.
      - SAT lze polynomiálně redukovat na každý problém z NP.
      - Výpočet libovolného nedeterministického polynomiálního přijímacího počítače na slově $w$ lze popsat formulí $f_w$ v KNF polynomiální délky, která je splnitelná právě když počítač $w$ přijme.
      - Pro SAT existuje nedeterministický algoritmus, a proto je NP-úplný.
    correct: 2
    explanation: |
      Proměnné $a_i, b_{it}, c_{ijt}, d_{jt}$ popisují konfigurace v každém kroku a klauzule
      vynucují korektní průběh výpočtu končící `ACCEPT`. Tím je dokázáno $J \triangleleft \text{SAT}$
      pro každý $J \in \mathrm{NP}$. Samotná příslušnost SAT do NP k NP-úplnosti nestačí.
    related: [thm-cook]
  - id: q-np-15
    question: |
      Klauzuli $(x_1 \vee x_2 \vee x_3 \vee x_4)$ převádíme v důkazu Věty 9.7 na klauzule délky 3.
      Který výsledek je správný ($v$ je nová proměnná)?
    options:
      - $(x_1 \vee x_2 \vee v) \wedge (x_3 \vee x_4 \vee \bar v)$
      - $(x_1 \vee x_2 \vee x_3) \wedge (x_2 \vee x_3 \vee x_4)$
      - $(x_1 \vee x_2 \vee v) \wedge (x_3 \vee x_4 \vee v)$
      - $(x_1 \vee x_2) \wedge (x_3 \vee x_4)$
    correct: 0
    explanation: |
      Platí $u_1 \vee \dots \vee u_m = 1 \iff \exists v: (u_1 \vee \dots \vee u_{m-2} \vee v) \wedge (u_{m-1} \vee u_m \vee \bar v) = 1$.
      Bez negace $v$ ve druhé klauzuli by šlo zvolit $v = 1$ a splnit obě klauzule i při
      $x_1 = \dots = x_4 = 0$. Zbylé dvě možnosti (bez nové proměnné) mění množinu
      splňujících přiřazení – např. $x_1 = 1$, ostatní 0 splňuje původní klauzuli, ale ne
      $(x_2 \vee x_3 \vee x_4)$ ani $(x_3 \vee x_4)$.
    related: [thm-3sat-npc, alg-sat-na-3sat]
