          - caption: |
              V původním grafu $G$ tvoří $\{a, c, e\}$ pravý opak kliky – žádné dva z vybraných uzlů nesousedí.
            set: [a, c, e]
          - caption: |
              Sestrojíme doplněk $\bar G$: hrany přesně tam, kde v $G$ nebyly (prohození 0 a 1 mimo diagonálu matice sousednosti, čas $O(n^2)$). Nezávislá množina $\{a, c, e\}$ je teď klika velikosti 3.
