              V grafu $G$ je $\{a, c, e\}$ nezávislá množina velikosti 3 – mezi jejími uzly není žádná hrana.
            set: [a, c, e]
          - caption: |
              Jinak řečeno: všechny tři dvojice $ac$, $ae$, $ce$ jsou *nehrany* grafu $G$. V doplňku $\bar G$ se z nich stanou hrany.
            set: [a, c, e]
            nodes: { a: done, c: done, e: done }
          - caption: |
              Přidáme-li $d$, nezávislost poruší hrana $cd$. Větší nezávislá množina v $G$ neexistuje.
            set: [a, c, d, e]
      - title: Táž množina je klikou v doplňku
        for: proof
        property: clique
        graph:
          directed: false
