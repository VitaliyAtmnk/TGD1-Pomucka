          - caption: |
              Barvu 2 literál mít nemůže – je to barva uzlu $w$, se kterým sousedí. Literály proto nabývají jen „logických“ hodnot 0 a 1.
            colors: { u: 0, v: 1, w: 2, x1: 2, nx1: 0, x2: 0, nx2: 1 }
            labels: { u: "0", v: "1", w: "2", x1: "2", nx1: "0", x2: "0", nx2: "1" }
          - caption: |
              Hrana $x_1 \bar x_1$ zakazuje stejnou barvu: právě jeden z uzlů $x_1$, $\bar x_1$ má barvu 1, takže $\bar x_1$ je opravdu negací $x_1$.
            colors: { u: 0, v: 1, w: 2, x1: 1, nx1: 1, x2: 0, nx2: 1 }
            labels: { u: "0", v: "1", w: "2", x1: "1", nx1: "1", x2: "0", nx2: "1" }
          - caption: |
              Jiné obarvení ($u = 2$, $v = 0$, $w = 1$) je jen přejmenování barev: záměnou $2 \to 0$, $0 \to 1$, $1 \to 2$ dostaneme zpět $u = 0$, $v = 1$, $w = 2$ i původní hodnoty literálů. Proto smíme barvy trojúhelníku zafixovat.
            colors: { u: 2, v: 0, w: 1, x1: 0, nx1: 2, x2: 2, nx2: 0 }
            labels: { u: "2", v: "0", w: "1", x1: "0", nx1: "2", x2: "2", nx2: "0" }
      - title: Gadget G2 jako „OR“ klauzule
        for: proof
        property: proper-coloring
