        steps:
          - caption: |
              Gadget $G_2$ pro klauzuli se vstupy $a, b, c$ (literály; díky sousedství s $w$ mají barvu 0 nebo 1) a výstupem $d$ připojeným k $u$ barvy 0. Pro $a = 1$, $b = c = 0$ vynutí první $G_1$ barvu $e = 0$, ale $a \ne e$, takže $d$ smí dostat barvu 1 – obarvení existuje.
            colors: { a: 1, b: 0, c: 0, p1: 1, q1: 2, e: 0, p2: 0, q2: 2, d: 1, u: 0 }
            labels: { a: "1", b: "0", c: "0", e: "0", d: "1", u: "0" }
          - caption: |
              Pravdivý je jen $c$: vstupy $b \ne c$, takže výstup $e$ prvního $G_1$ je volný – zvolíme $e = 1 \ne a$. Pak je volný i $d$ a opět $d = 1$. Stačí jediný pravdivý literál.
            colors: { a: 0, b: 0, c: 1, p1: 2, q1: 0, e: 1, p2: 2, q2: 0, d: 1, u: 0 }
