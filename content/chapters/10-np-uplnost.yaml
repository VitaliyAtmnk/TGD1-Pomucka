          - caption: |
              Trojúhelník $u, v, w$ má ve 3-obarvení tři různé barvy; přečíslováním lze předpokládat $u = 0$, $v = 1$, $w = 2$. Literálové uzly sousedí s $w$, mají tedy barvu 0 nebo 1 – pravdivostní hodnotu (zde $x_1 = 1$, $x_2 = 0$).
            colors: { u: 0, v: 1, w: 2, x1: 1, nx1: 0, x2: 0, nx2: 1 }
