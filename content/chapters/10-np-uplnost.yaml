  - id: def-k-col
    kind: definition
    section: "9.8"
    title: Problém k-COL (k-obarvitelnost)
    terms: [k-COL, 3-COL, k-obarvitelnost, 3-obarvitelnost, graph coloring, obarvení grafu]
    statement: |
      **$k$-COL**

      **Vstup:** neorientovaný graf $G$ na $n$ uzlech (a přirozené číslo $k \le n$).

      **Úkol:** zjistit, zda je graf $G$ $k$-obarvitelný.

      Pro $k = 1$ a $k = 2$ (1- a 2-obarvitelnost) víme z kapitoly 7, že
      $\text{1-COL} \in \mathrm{P}$ a $\text{2-COL} \in \mathrm{P}$. Pro $k = 3$ je už vše jinak.
    intuition: |
      1-obarvitelný = bez hran, 2-obarvitelný = bipartitní (bez lichých kružnic), obojí
      ověříme BFS v čase $O(n+m)$. Už pro 3 barvy je problém NP-úplný
      ([Věta 9.11](#thm-3col-npc)) – další ostrá hranice podobná 2-SAT vs. 3-SAT.

      *Pozn. ke znění:* ve skriptech je $k$ uvedeno jako součást vstupu, ve folii je vstupem
      jen graf a $k$ je pevné (jako u IND$_k$). U 3-COL je $k = 3$ pevné.
    related: [def-chromaticke-cislo, thm-3col-npc]
    source: "skripta str. 71; přednáška 12, str. 4"

  - id: lemma-gadgety-3col
    kind: lemma
    label: "Pozorování (důkaz Věty 9.11)"
    section: "9.8"
    title: Stavební kameny G1 a G2 pro redukci na 3-COL
    terms: [gadget, stavební kámen, G1, G2, gadget pro klauzuli]
    statement: |
      Barvy značíme $0, 1, 2$.

      **Graf $G_1$:** uzly $a, b$, trojúhelník $p, q, d$ a hrany $ap$, $bq$. V každém
      3-obarvení $G_1$ platí:

      * jsou-li $a, b$ obarveny stejnou barvou, pak $d$ má tutéž barvu;
      * jsou-li $a, b$ obarveny různými barvami, pak $d$ může mít libovolnou barvu (pro
        každou volbu barvy $d$ lze obarvení dokončit).

      **Graf $G_2$:** uzly $a, b, c$; jedna kopie $G_1$ se vstupy $b, c$ a výstupem $e$ a
      druhá kopie $G_1$ se vstupy $a, e$ a výstupem $d$. Pak:

      * jsou-li $a, b, c$ obarveny stejnou barvou, pak $d$ má tutéž barvu;
      * má-li alespoň jeden z uzlů $a, b, c$ jinou barvu než ostatní, pak $d$ může být
        obarven barvou 1 (dokonce libovolnou barvou).
    intuition: |
      $G_1$ se chová jako „hradlo", které propustí barvu, když se vstupy shodují, a jinak
      je volné. $G_2$ složené ze dvou hradel je „hradlo OR" pro klauzuli: výstup $d$ je
      nucen na barvu 0 („nepravda") jen tehdy, když jsou všechny tři literály 0.
    proof: |
      *Ve skriptech „zřejmé"; doplněno.*

      **$G_1$, stejné barvy.** Nechť $a, b$ mají barvu $\alpha$. Pak $p \ne \alpha$ a
      $q \ne \alpha$, a protože $p, q, d$ tvoří trojúhelník, mají $p, q$ obě zbývající barvy a
      na $d$ zbude jen $\alpha$.

      **$G_1$, různé barvy.** Nechť $a$ má barvu $\alpha$, $b$ barvu $\beta \ne \alpha$ a
      $\gamma$ je třetí barva. Chceme $d = \delta$:
      pro $\delta = \alpha$ volíme $p = \beta$, $q = \gamma$;
      pro $\delta = \beta$ volíme $p = \gamma$, $q = \alpha$;
      pro $\delta = \gamma$ volíme $p = \beta$, $q = \alpha$.
      Ve všech případech $p \ne \alpha$, $q \ne \beta$ a $p, q, d$ jsou různé.

      **$G_2$, stejné barvy.** Mají-li $b, c$ barvu $\alpha$, je podle $G_1$ i $e = \alpha$;
      pak $a, e$ mají barvu $\alpha$ a znovu podle $G_1$ je $d = \alpha$.

      **$G_2$, ne všechny stejné.** Je-li $b \ne c$, je $e$ libovolné – zvolíme $e \ne a$, a pak
      je $d$ libovolné. Je-li $b = c$, pak $a \ne b$ (ne všechny jsou stejné), $e = b \ne a$ a
      $d$ je opět libovolné. Speciálně lze $d$ obarvit barvou 1. $\square$
    proof_steps:
      - "$G_1$ se stejnými barvami vstupů: $p$ i $q$ se liší od barvy vstupů, v trojúhelníku zabírají obě zbylé barvy, takže $d$ dostane barvu vstupů."
      - "$G_1$ s různými barvami vstupů: rozborem tří případů pro barvu $d$ ukážeme, že $p$ a $q$ lze vždy obarvit."
      - "$G_2$ se stejnými barvami $a, b, c$: první $G_1$ vynutí $e$ téže barvy, druhý $G_1$ pak i $d$."
      - "$G_2$, kde ne všechny barvy jsou stejné: vždy lze dosáhnout $e \\ne a$, a pak je barva $d$ libovolná, speciálně 1."
    examples:
      - title: Gadget G2
        body: |
          Uzly $a, b, c$ jsou vstupy (v redukci literály klauzule), $d$ výstup.
          Trojúhelník $p_1 q_1 e$ je první $G_1$ (vstupy $b, c$), trojúhelník $p_2 q_2 d$
          druhý $G_1$ (vstupy $a, e$).
        graph:
          directed: false
          nodes:
            - { id: a, x: 0, y: 0 }
            - { id: b, x: 0, y: 3 }
            - { id: c, x: 0, y: 6 }
            - { id: p1, x: 3, y: 3 }
            - { id: q1, x: 3, y: 6 }
            - { id: e, x: 5, y: 4.5 }
            - { id: p2, x: 7, y: 0 }
            - { id: q2, x: 7, y: 3 }
            - { id: d, x: 9, y: 1.5 }
          edges:
            - { from: b, to: p1 }
            - { from: c, to: q1 }
            - { from: p1, to: q1 }
            - { from: p1, to: e }
            - { from: q1, to: e }
            - { from: a, to: p2 }
            - { from: e, to: q2 }
            - { from: p2, to: q2 }
            - { from: p2, to: d }
            - { from: q2, to: d }
    related: [thm-3col-npc]
    illustrations:
      - title: Hradlo G1 – shodné vstupy vynutí výstup
        for: proof
        property: proper-coloring
        graph:
