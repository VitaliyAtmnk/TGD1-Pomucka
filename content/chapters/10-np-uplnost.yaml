            colors: { a: 0, b: 1, p: 1, q: 2, d: 0 }
            labels: { a: "0", b: "1", p: "1", q: "2", d: "0" }
          - caption: |
              …výstup $d = 1$ také ($p = 2$, $q = 0$)…
            colors: { a: 0, b: 1, p: 2, q: 0, d: 1 }
            labels: { a: "0", b: "1", p: "2", q: "0", d: "1" }
          - caption: |
              …i výstup $d = 2$ ($p = 1$, $q = 0$). Při různých vstupech je tedy barva výstupu zcela volná – $G_1$ „propustí“ barvu jen tehdy, když se vstupy shodují.
            colors: { a: 0, b: 1, p: 1, q: 0, d: 2 }
            labels: { a: "0", b: "1", p: "1", q: "0", d: "2" }
    source: "skripta str. 71"

  - id: thm-3col-npc
    kind: theorem
    label: "Věta 9.11"
    section: "9.8"
    title: 3-COL je NP-úplný
    terms: [3-COL ∈ NPC, redukce 3-SAT na 3-COL, 3-obarvitelnost je NP-úplná]
    statement: |
      $\text{3-COL} \in \mathrm{NPC}$.
    intuition: |
      Barvy dostanou význam: trojúhelník $u, v, w$ „kalibruje" barvy (0 = nepravda,
      1 = pravda, 2 = „ani jedno"). Literálové uzly sousedí s $w$, mají tedy barvu 0 nebo 1,
      a hrana $x_i \bar x_i$ zajistí, že právě jeden z nich je pravdivý. Gadget $G_2$ pro
      klauzuli má výstup $d$ spojený s $u$ (barva 0), takže $d$ nesmí být 0 – a to je možné
      právě když klauzule obsahuje pravdivý literál.
    proof: |
      **1. 3-COL ∈ NP.** Nedeterministicky přiřadíme každému uzlu barvu z $\{0, 1, 2\}$ a pro
      každou hranu ověříme, že její konce mají různé barvy – čas $O(n + m)$.

      **2. 3-SAT ◁ 3-COL.** Nechť $f(x_1, \dots, x_n) = (a_1 \vee b_1 \vee c_1) \wedge \dots \wedge (a_k \vee b_k \vee c_k)$.
      Sestrojíme graf $G$, který je 3-obarvitelný právě tehdy, je-li $f$ splnitelná.
      Použijeme [stavební kameny $G_1$, $G_2$](#lemma-gadgety-3col).

      *Konstrukce $G$:*

      * pro každou proměnnou $x_i$ sestrojíme dvojici uzlů $x_i, \bar x_i$ a spojíme ji hranou,
      * přidáme tři uzly $u, v, w$ tvořící trojúhelník,
      * uzel $w$ spojíme se všemi uzly $x_i, \bar x_i$,
      * pro každou klauzuli vytvoříme jednu kopii grafu $G_2$, přičemž uzly $a, b, c$ budou
        totožné s uzly literálů této klauzule a uzel $d$ (označme ho $d_j$ pro $j$-tou
        klauzuli) bude sousední s uzlem $u$.

      *Polynomialita (doplněno):* $G$ má $2n + 3 + 6k$ uzlů a $n + 3 + 2n + 11k$ hran, sestrojí
      se v lineárním čase.

      *Ekvivalence:*

      1. $G$ je 3-obarvitelný $\Leftrightarrow$ $G$ je 3-obarvitelný tak, že $u$ má barvu 0, $v$
         barvu 1 a $w$ barvu 2 (jinak barvy vhodně přečíslujeme – $u, v, w$ tvoří
         trojúhelník, takže mají tři různé barvy).
      2. Uzel $w$ má barvu 2, takže uzly $x_i, \bar x_i$ mají barvy z $\{0, 1\}$, a to navzájem
         různé (jsou spojeny hranou). Lze je tedy interpretovat jako hodnoty logických
         proměnných (barva 1 = pravda) a hodnota $\bar x_i$ je skutečně negací hodnoty $x_i$.
      3. Formule $f$ je 3-splnitelná $\Leftrightarrow$ existuje přiřazení hodnot 0, 1
         proměnným $x_i$ tak, že v každé klauzuli je alespoň jedna jednička
         $\Leftrightarrow$ všechny uzly $d_j$ mohou mít barvu různou od 0 (podle vlastností
         $G_2$: jsou-li všechny tři literály 0, je $d_j$ nuceně 0; jinak lze $d_j$ obarvit
         barvou 1, a vnitřní uzly gadgetu dobarvit) $\Leftrightarrow$ graf $G$ je
         3-obarvitelný (uzel $d_j$ sousedí s $u$ barvy 0; vnitřní uzly různých gadgetů spolu
         nesousedí, takže obarvení gadgetů jsou nezávislá). $\square$
    proof_steps:
      - "3-COL ∈ NP: uhodneme barvu každého uzlu a v lineárním čase ověříme, že každá hrana má konce různých barev."
      - "Konstrukce: pro každou proměnnou hranu $x_i \\bar x_i$, trojúhelník $u, v, w$, hrany z $w$ do všech literálových uzlů a pro každou klauzuli gadget $G_2$ se vstupy = literály klauzule a výstupem $d_j$ spojeným s $u$."
      - "Graf má lineárně mnoho uzlů a hran vzhledem k velikosti formule, konstrukce je polynomiální."
      - "Bez újmy na obecnosti $u = 0$, $v = 1$, $w = 2$; literálové uzly mají pak barvy 0/1, navzájem komplementární – to je pravdivostní ohodnocení."
      - "Směr ⇒: ze splňujícího přiřazení obarvíme literály (pravda = 1); v každé klauzuli je aspoň jedna 1, takže podle vlastnosti $G_2$ lze $d_j$ obarvit 1 ≠ 0 = barva $u$ a gadgety dobarvit."
      - "Směr ⇐: v 3-obarvení má $d_j$ barvu různou od 0 (sousedí s $u$), takže podle $G_2$ nejsou všechny tři literály klauzule obarveny 0 – každá klauzule má pravdivý literál."
      - "Z 3-SAT ∈ NPC a tranzitivity redukcí plyne 3-COL ∈ NPC."
    examples:
      - title: Graf pro formuli s jednou klauzulí
        body: |
          $f = (x_1 \vee x_2 \vee \bar x_3)$. Gadget $G_2$ má vstupy $a = x_1$, $b = x_2$,
          $c = \bar x_3$ a výstup $d$ spojený s $u$.

          Pro splňující přiřazení $x_1 = 1$, $x_2 = 0$, $x_3 = 1$ obarvíme: $u = 0$, $v = 1$,
          $w = 2$; $x_1 = 1$, $\bar x_1 = 0$, $x_2 = 0$, $\bar x_2 = 1$, $x_3 = 1$, $\bar x_3 = 0$.
          V gadgetu: $b = c = 0$ ⇒ $p_1, q_1 \in \{1, 2\}$ (třeba $p_1 = 1$, $q_1 = 2$) a
          $e = 0$; dále $a = 1 \ne e = 0$, takže $d$ může být 1: $d = 1$, $q_2 = 2$, $p_2 = 0$.
          Všechny hrany mají různobarevné konce a $d = 1 \ne 0 = u$.

          Kdyby bylo $x_1 = 0$, $x_2 = 0$, $x_3 = 1$ (klauzule nepravdivá), byly by
          $a = b = c = 0$, gadget by vynutil $d = 0$ a hrana $du$ by byla jednobarevná.

          Skripta ilustrují konstrukci na formuli
          $(x_1 \vee \bar x_2 \vee \bar x_3) \wedge (\bar x_1 \vee x_3 \vee \bar x_4) \wedge (\bar x_2 \vee x_3 \vee x_4)$
          se třemi gadgety.
