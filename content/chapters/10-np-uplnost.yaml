            - { from: p, to: q }
            - { from: p, to: d }
            - { from: q, to: d }
        steps:
          - caption: |
              Vstupy $a$, $b$ mají stejnou barvu 0. Uzly $p$, $q$ s nimi sousedí, musí tedy mít barvy 1 a 2 – a protože $p, q, d$ tvoří trojúhelník, na výstup $d$ zbude jen barva 0.
            colors: { a: 0, b: 0, p: 1, q: 2, d: 0 }
            labels: { a: "0", b: "0", p: "1", q: "2", d: "0" }
          - caption: |
              Zkusme $d = 1$: $p$ se musí lišit od $a = 0$ i od $d = 1$, takže $p = 2$; ze stejného důvodu $q = 2$. Hrana $pq$ je jednobarevná – při shodných vstupech je výstup nucen mít jejich barvu.
            colors: { a: 0, b: 0, p: 2, q: 2, d: 1 }
