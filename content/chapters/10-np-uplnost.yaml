id: np-uplnost
number: 10
title: Teorie NP-úplnosti
source: "TGD1 skripta kap. 9 (str. 55–72); přednášky 10, 11, 12"
exam_questions: [14, 15, 16, 17, 18, 19]
summary: |
  Kapitola buduje teorii NP-úplnosti na modelu počítače s libovolným přístupem.
  Začíná logickými formulemi a problémem splnitelnosti **SAT**, ukazuje, že **2-SAT**
  je polynomiální (implikační graf a kvazikomponenty), zavádí **nedeterministický
  počítač**, třídu **NP**, **polynomiální redukci** a **NP-úplnost**. Vrcholem je
  **Cookova věta** (SAT je NP-úplný) a z ní odvozená NP-úplnost problémů 3-SAT, IND,
  COV, CLIQUE a 3-COL. Znalost těchto redukcí je jádrem ústní zkoušky.
