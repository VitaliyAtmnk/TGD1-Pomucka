          nodes:
            - { id: a, x: 0, y: 1.5 }
            - { id: b, x: 0, y: 8.5 }
            - { id: p, x: 4, y: 1.5 }
            - { id: q, x: 4, y: 8.5 }
            - { id: d, x: 8, y: 5 }
          edges:
            - { from: a, to: p }
