            - { id: x3, x: 4, y: 2, in_set: true }
            - { id: x4, x: 6, y: 2, cover: true }
            - { id: x5, x: 8, y: 2, in_set: true }
          edges:
            - { from: x1, to: x2 }
            - { from: x2, to: x3 }
            - { from: x3, to: x4 }
            - { from: x4, to: x5 }
            - { from: x2, to: x4 }
    related: [def-cov, thm-ind-npc, def-pokryti, def-nezavisla-mnozina]
    illustrations:
      - title: Doplněk nezávislé množiny je pokrytí
        for: proof
        property: vertex-cover
        graph:
          directed: false
          nodes:
            - { id: x1, x: 2.5, y: 0.5 }
            - { id: x2, x: 7.5, y: 0.5 }
            - { id: x3, x: 10, y: 5 }
            - { id: x4, x: 7.5, y: 9.5 }
            - { id: x5, x: 2.5, y: 9.5 }
