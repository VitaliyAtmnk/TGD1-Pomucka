            colors: { a: 0, b: 0, c: 0, p1: 1, q1: 2, e: 0, p2: 1, q2: 2, d: 0, u: 0 }
            labels: { a: "0", b: "0", c: "0", e: "0", d: "0", u: "0" }
          - caption: |
