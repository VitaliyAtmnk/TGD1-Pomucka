  - id: def-clique
    kind: definition
    section: "9.8"
    title: Problém CLIQUE (klika předepsané velikosti)
    terms: [CLIQUE, klika, existence kliky předepsané velikosti, clique problem, "ω(G)"]
    statement: |
      **CLIQUE**

      **Vstup:** neorientovaný graf $G$ na $n$ uzlech a přirozené číslo $k \le n$.

      **Úkol:** zjistit, zda v grafu $G$ existuje klika velikosti alespoň $k$.
    intuition: |
      [Klika](#def-klika) je množina navzájem sousedních uzlů – opak nezávislé množiny.
      V doplňku grafu se kliky a nezávislé množiny prohodí.
    related: [def-klika, thm-clique-npc, def-ind]
    source: "skripta str. 70; přednáška 12, str. 3"

  - id: thm-clique-npc
    kind: theorem
    label: "Věta 9.10"
    section: "9.8"
    title: CLIQUE je NP-úplný
    terms: [CLIQUE ∈ NPC, redukce IND na CLIQUE, doplněk grafu]
    statement: |
      $\text{CLIQUE} \in \mathrm{NPC}$.
    intuition: |
      Doplněk grafu $\bar G$ (hrany právě tam, kde v $G$ nejsou) promění nezávislé množiny v
      kliky. Redukce je tedy jen „přehození hran a nehran".
    proof: |
      **1. CLIQUE ∈ NP.** Uhodneme množinu $X$ alespoň $k$ uzlů a v čase $O(n^2)$ ověříme, že
      každé dva uzly $X$ jsou sousední.

      **2. IND ◁ CLIQUE.** Pro $M \subseteq U(G)$ platí: $M$ je $k$-prvková nezávislá množina v
      $G$ právě když $M$ je $k$-prvková klika v doplňku $\bar G$ (kde
      $U(\bar G) = U(G)$ a $\{u, v\} \in H(\bar G) \Leftrightarrow \{u, v\} \notin H(G)$ pro
      $u \ne v$). Překlad $(G, k) \mapsto (\bar G, k)$ se provede v čase $O(n^2)$ (prohození
      nul a jedniček mimo diagonálu matice sousednosti). Z $\text{IND} \in \mathrm{NPC}$ plyne
      $\text{CLIQUE} \in \mathrm{NPC}$. $\square$
    proof_steps:
      - "CLIQUE ∈ NP: uhodneme alespoň $k$ uzlů a v čase $O(n^2)$ ověříme, že jsou po dvou sousední."
      - "Konstrukce: instanci $(G,k)$ problému IND přeložíme na $(\\bar G, k)$, kde $\\bar G$ je doplněk grafu $G$; to trvá $O(n^2)$."
      - "Směr ⇒: nezávislá množina v $G$ nemá uvnitř žádnou hranu $G$, takže v $\\bar G$ jsou všechny její dvojice spojeny – je to klika."
      - "Směr ⇐: klika v $\\bar G$ nemá uvnitř žádnou hranu $G$, je tedy nezávislá v $G$ (velikost se zachovává)."
      - "Z IND ∈ NPC a tranzitivity redukcí plyne CLIQUE ∈ NPC."
    related: [def-clique, thm-ind-npc, def-klika, def-nezavisla-mnozina]
    illustrations:
      - title: Nezávislá množina v G
        for: proof
        property: independent-set
        graph:
          directed: false
          nodes:
            - { id: a, x: 5, y: 0.5 }
