id: toky
number: 3
title: Toky v sítích
source: "TGD1 skripta kap. 2 (str. 5–11); přednášky 3 (od definice sítě) a 4"
exam_questions: [6, 7]
summary: |
  Síť je orientovaný graf s propustnostmi hran a intenzitami uzlů; tok je hranové ohodnocení,
  které respektuje propustnosti a v každém uzlu „zákon zachování“. Kapitola charakterizuje,
  kdy tok v síti existuje (věta 2.1), a pro síť s jedním zdrojem a jedním stokem dokazuje
  Fordovu–Fulkersonovu větu „maximální tok = minimální řez“. Prakticky nejdůležitější jsou
  algoritmy: Fordův–Fulkersonův (rezervní polocesty) a jeho polynomiální varianta
  Edmonds–Karp (nejkratší polocesty hledané prohledáváním do šířky).
sections:
  - number: "2.1"
    title: Síť, existence toku v síti
  - number: "2.2"
    title: Síť s jedním zdrojem a jedním stokem
  - number: "2.3"
    title: Maximální tok
  - number: "2.4"
    title: Ford–Fulkersonův algoritmus
  - number: "2.5"
    title: Edmonds–Karpův algoritmus
  - number: "2.6"
    title: Dokončení důkazu věty 2.1
items:
  # ------------------------------------------------------------------ 2.1
  - id: def-sit
    kind: definition
    label: "Definice 2.1"
    section: "2.1"
    title: Síť
    terms: [síť, network, dopravní síť, ohodnocení hran, ohodnocení uzlů, flow network]
    statement: |
      **Síť** je orientovaný graf $\vec{G}$ s ohodnocením hran $r : H(\vec{G}) \to (0, \infty)$
      a ohodnocením uzlů $a : U(\vec{G}) \to \mathbb{R}$.

      Značení: uzly očíslujeme $1, \dots, n$ a píšeme krátce $a_i = a(i)$ pro
      $i \in U(\vec{G})$ a $r_{ij} = r((i,j))$ pro $(i,j) \in H(\vec{G})$.
    intuition: |
      Síť je tedy orientovaný graf, jehož hrany mají **kladná** reálná čísla (kolik lze
      maximálně přepravit) a uzly **libovolná** reálná čísla včetně záporných (kolik se v uzlu
      vyrábí, resp. spotřebovává). Představ si potrubí: hrany jsou trubky s danou kapacitou,
      uzly jsou křižovatky, vrty (kladná intenzita) nebo odběratelé (záporná intenzita).
    related: [def-tok, def-intenzita-propustnost]
    source: "skripta str. 5; přednáška 3, fólie 9"

  - id: def-tok
    kind: definition
    label: "Definice 2.2"
    section: "2.1"
    title: Tok v síti
    terms: [tok, flow, zákon zachování, Kirchhoffův zákon, podmínka propustnosti, přípustný tok]
    statement: |
      Buď $\vec{G}$ síť s ohodnocením uzlů $a_i$ a ohodnocením hran $r_{ij}$.
      **Tok** v síti $\vec{G}$ je nezáporné hranové ohodnocení
      $x : H(\vec{G}) \to \langle 0, \infty)$ splňující:

      1. pro každý uzel $i \in U(\vec{G})$ platí (zákon zachování)
      $$
      \sum_{j;\,(i,j) \in H(\vec{G})} x_{ij} \;-\; \sum_{j;\,(j,i) \in H(\vec{G})} x_{ji} \;=\; a_i ,
      $$
      2. pro každou hranu $(i,j) \in H(\vec{G})$ platí $0 \le x_{ij} \le r_{ij}$.
    intuition: |
      Podmínka 1: co z uzlu **vyteče** mínus co do něj **přiteče** se rovná tomu, co v uzlu
      přebývá ($a_i > 0$), resp. chybí ($a_i < 0$). V neutrálním uzlu se nic neztrácí ani
      nevzniká. Podmínka 2: po hraně nelze poslat víc, než je její propustnost, a tok nesmí
      téct „proti směru“ hrany (záporné hodnoty nejsou povoleny).

      **Pozor:** tok je vázán na pevné intenzity uzlů. V obecné síti tok vůbec nemusí
      existovat – viz [příklady](#def-intenzita-propustnost) a [větu 2.1](#thm-existence-toku).
    examples:
      - title: Železniční přeprava (motivace)
        body: |
          Města $1, \dots, n$ jsou spojena železnicí; $(i,j) \in H(\vec{G})$, právě když vede
          trať přímo z $i$ do $j$ (obousměrná trať dává dvojici hran $(i,j)$, $(j,i)$).
          Město $i$ vyrobí $b_i$ a spotřebuje $c_i$ jednotek zboží za jednotku času;
          položíme $a_i = b_i - c_i$. Trať $(i,j)$ unese nejvýše $r_{ij}$ jednotek
          (obecně $r_{ij} \ne r_{ji}$). Je-li $x_{ij}$ skutečně převážené množství z $i$ do $j$,
          musí platit $0 \le x_{ij} \le r_{ij}$ (podmínka 2) a rozdíl vyvezeného a dovezeného
          zboží v městě $i$ musí být roven přebytku $a_i$ (podmínka 1).
    related: [def-sit, def-intenzita-propustnost, thm-existence-toku]
    illustrations:
      - title: Zákon zachování uzel po uzlu
        graph:
          directed: true
          nodes:
            - { id: p, x: 1, y: 2 }
            - { id: q, x: 1, y: 8 }
            - { id: m, x: 5, y: 6 }
            - { id: t, x: 9.5, y: 3 }
          edges:
            - { from: p, to: m, w: 3 }
            - { from: p, to: t, w: 2 }
            - { from: q, to: m, w: 2 }
            - { from: m, to: t, w: 4 }
        steps:
          - caption: |
              Síť: u uzlů jsou intenzity, u hran propustnosti. Uzly $p$, $q$ jsou zdroje ($a_p = 3$, $a_q = 1$),
              $m$ je neutrální a $t$ je stok ($a_t = -4$). Součet intenzit je $0$ – co se vyrobí, to se spotřebuje.
            nodes: { p: source, q: source, t: sink }
            labels: { p: "a=3", q: "a=1", m: "a=0", t: "a=−4" }
          - caption: |
              Tok (u hran $x_{ij}/r_{ij}$). Pod uzly je bilance „odtok − přítok“: v každém uzlu vyjde přesně
              jeho intenzita a na žádné hraně tok nepřekročí propustnost – je to **tok**.
            edge_labels: { p-m: "2/3", p-t: "1/2", q-m: "1/2", m-t: "3/4" }
            labels: { p: "3−0 = 3 ✓", q: "1−0 = 1 ✓", m: "3−3 = 0 ✓", t: "0−4 = −4 ✓" }
          - caption: |
              Neutrální uzel $m$ jen přeposílá: přiteče do něj $2 + 1 = 3$ jednotky a stejně tolik odteče
              po hraně $(m,t)$. Nic se v něm neztrácí ani nevzniká.
            nodes: { m: active }
            edges: { p-m: active, q-m: active, m-t: active }
            edge_labels: { p-m: "2/3", p-t: "1/2", q-m: "1/2", m-t: "3/4" }
            labels: { m: "přítok 3 = odtok 3" }
          - caption: |
              Přesuneme jednotku z hrany $(p,t)$ na $(p,m)$. Uzel $p$ je pořád v pořádku, ale do $m$ teď
              přiteče $4$ a odteče jen $3$, a do $t$ přiteče jen $3$. Zákon zachování je porušen – **není** to tok.
            nodes: { m: rejected, t: rejected }
            edge_labels: { p-m: "3/3", p-t: "0/2", q-m: "1/2", m-t: "3/4" }
            labels: { p: "3−0 = 3 ✓", q: "1−0 = 1 ✓", m: "3−4 = −1 ✗", t: "0−3 = −3 ✗" }
          - caption: |
              Opravíme to zvýšením toku na $(m,t)$ na $4$ (propustnost to dovolí). Zase máme tok – jiný než
              v kroku 2. Tok v síti tedy **nemusí být jednoznačný**.
            edge_labels: { p-m: "3/3", p-t: "0/2", q-m: "1/2", m-t: "4/4" }
            labels: { p: "3−0 = 3 ✓", q: "1−0 = 1 ✓", m: "4−4 = 0 ✓", t: "0−4 = −4 ✓" }
    source: "skripta str. 5; přednáška 3, fólie 9"

  - id: def-intenzita-propustnost
    kind: definition
    label: "Definice 2.3"
    section: "2.1"
    title: Intenzita, propustnost, zdroj, stok
    terms: [intenzita uzlu, propustnost hrany, kapacita hrany, capacity, zdroj, stok, neutrální uzel, source, sink]
    statement: |
      Je-li $i \in U(\vec{G})$, číslo $a_i$ se nazývá **intenzita** uzlu $i$;
      pro $(i,j) \in H(\vec{G})$ se číslo $r_{ij}$ nazývá **propustnost** hrany $(i,j)$.

      Uzel $i$ se nazývá
      * **zdroj**, je-li $a_i > 0$,
      * **stok**, je-li $a_i < 0$,
      * **neutrální uzel**, je-li $a_i = 0$.
    intuition: |
      Zdroj produkuje (tok z něj musí odtékat), stok spotřebovává (tok do něj musí přitékat),
      neutrální uzel jen přeposílá. V angličtině *source*, *sink*, *capacity*.
    examples:
      - title: Sítě, v nichž neexistuje žádný tok
        body: |
          Tři malé sítě (u uzlů intenzity, u hran propustnosti) – v žádné z nich tok neexistuje:

          1. Uzel s intenzitou $2$ (zdroj) nemá žádnou vycházející hranu – jediná hrana vede
             **do** něj ze stoku s intenzitou $-2$. Zdroj nemá kudy svůj přebytek odeslat.
             (Množina $A$ = {zdroj}: $a(A) = 2 > r(A, \bar{A}) = 0$.)
          2. Trojúhelník: levý uzel má intenzitu $3$, horní $0$, pravý $-3$; hrany
             levý→horní ($2$), horní→pravý ($1$), levý→pravý ($1$). Přes horní uzel projde nejvýš
             $1$, přímou hranou nejvýš $1$, celkem $2 < 3$.
             (Pro $A$ = {levý, horní}: $a(A) = 3 > r(A,\bar{A}) = 1 + 1 = 2$.)
          3. Uzly s intenzitami $2$ a $-1$ spojené hranou propustnosti $2$: součet intenzit je
             $1 \ne 0$, přebytek jedné jednotky nemá kam odtéct.

          Graf níže ukazuje síť 2.
        graph:
          directed: true
          nodes:
            - { id: L, x: 1, y: 7, a: 3 }
            - { id: H, x: 5, y: 3, a: 0 }
            - { id: P, x: 9, y: 7, a: -3 }
          edges:
            - { from: L, to: H, w: 2 }
            - { from: H, to: P, w: 1 }
            - { from: L, to: P, w: 1 }
    related: [def-sit, def-tok, thm-existence-toku]
    source: "skripta str. 6; přednáška 3, fólie 9"

  - id: def-rez
    kind: definition
    label: "Definice 2.4"
    section: "2.1"
    title: Řez sítě
    terms: [řez, cut, řez sítě, separace, množina hran mezi A a doplňkem]
    statement: |
      Nechť $\vec{G}$ je síť, $A \subset U(\vec{G})$ množina uzlů a $\bar{A} = U(\vec{G}) \setminus A$.
      Množina hran
      $$
      (A, \bar{A}) = \{ (x,y) \mid x \in A,\ y \in \bar{A} \}
      $$
      se nazývá **řez** sítě $\vec{G}$.

      *Poznámka.* Jde o orientovanou obdobu pojmu separace z KMA/DMA; termín „řez“ se používá,
      protože je v této souvislosti v literatuře obvyklejší. Důležité řezy budou splňovat
      i podmínku minimality.
    intuition: |
      Řez obsahuje jen hrany vedoucí **z** $A$ **do** $\bar{A}$; hrany opačného směru
      $(\bar{A}, A)$ do řezu nepatří. Odebráním řezu přerušíme všechny orientované cesty
      z $A$ do $\bar{A}$ – proto omezuje, kolik toku může z $A$ odtéct.
    related: [def-oznaceni-souctu, prop-bilance-mnoziny, def-minimalni-rez]
    illustrations:
      - title: Řez tvoří jen hrany vedoucí z A ven
        graph:
          directed: true
          nodes:
            - { id: z, x: 0, y: 5 }
            - { id: a, x: 3, y: 2 }
            - { id: b, x: 3, y: 5 }
            - { id: c, x: 3, y: 8 }
            - { id: d, x: 7, y: 3 }
            - { id: e, x: 7, y: 7 }
            - { id: s, x: 10, y: 5 }
          edges:
            - { from: z, to: a, w: 2 }
            - { from: z, to: b, w: 2 }
            - { from: z, to: c, w: 1 }
            - { from: a, to: d, w: 1 }
            - { from: a, to: e, w: 2 }
            - { from: b, to: d, w: 1 }
            - { from: b, to: e, w: 2 }
            - { from: c, to: d, w: 2 }
            - { from: c, to: e, w: 1 }
            - { from: d, to: s, w: 4 }
            - { from: e, to: s, w: 1 }
        steps:
          - caption: |
              $A = \{z\}$: řez $(A, \bar{A})$ tvoří tři hrany vycházející ze $z$ (červeně), jeho propustnost je
              $r(A,\bar{A}) = 2 + 2 + 1 = 5$.
            nodes: { z: visited }
            edges: { z-a: cut, z-b: cut, z-c: cut }
          - caption: |
              $A = \{z, a, b, e\}$: do řezu patří $(a,d)$, $(b,d)$, $(z,c)$ a $(e,s)$, tedy $r(A,\bar{A}) = 4$.
              Hrana $(c,e)$ vede **z $\bar{A}$ do $A$** – do řezu nepatří (patří do $(\bar{A}, A)$).
            nodes: { z: visited, a: visited, b: visited, e: visited }
            edges: { a-d: cut, b-d: cut, z-c: cut, e-s: cut, c-e: back, z-a: dim, z-b: dim, a-e: dim, b-e: dim }
          - caption: |
              Odebereme hrany řezu. Ze $z$ se teď po směru hran dostaneme jen do uzlů množiny $A$ – řez
              přerušil **všechny** orientované cesty z $A$ do $\bar{A}$ (hrana $c \to e$ tomu nevadí, vede dovnitř).
            nodes: { z: visited, a: visited, b: visited, e: visited }
            edges: { a-d: hidden, b-d: hidden, z-c: hidden, e-s: hidden, c-e: back }
    source: "skripta str. 6; přednáška 3, fólie 10"

  - id: def-oznaceni-souctu
    kind: definition
    section: "2.1"
    title: "Označení f(A) a g(A, Ā)"
    terms: [součet přes množinu, a(A), "r(A, Ā)", "x(A, Ā)", propustnost množiny hran]
    statement: |
      Nechť $\vec{G}$ je síť a $A \subset U(\vec{G})$.
      * Je-li $f : U(\vec{G}) \to \mathbb{R}$ funkce na uzlech, označíme $f(A) = \sum_{i \in A} f_i$.
      * Je-li $g : H(\vec{G}) \to \mathbb{R}$ funkce na hranách, označíme
        $g(A, \bar{A}) = \sum_{(i,j) \in (A, \bar{A})} g_{ij}$.

      Typicky: $a(A)$ je součet intenzit uzlů z $A$, $r(A,\bar{A})$ součet propustností hran
      řezu a $x(A,\bar{A})$ tok přes řez ve směru z $A$ do $\bar{A}$.
    related: [def-rez, prop-bilance-mnoziny]
    source: "skripta str. 6; přednáška 3, fólie 10"

  - id: prop-bilance-mnoziny
    kind: proposition
    label: "Tvrzení 2.1"
    section: "2.1"
    title: Bilance toku přes řez
    terms: [tvrzení 2.1, bilance toku, zákon zachování pro množinu, tok přes řez]
    statement: |
      Nechť $\vec{G}$ je síť, $x$ tok v $\vec{G}$ a $A \subset U(\vec{G})$. Pak
      $$
      a(A) = x(A, \bar{A}) - x(\bar{A}, A).
      $$
    intuition: |
      Zákon zachování platí nejen pro jednotlivé uzly, ale pro libovolnou „krabici“ uzlů:
      čistý odtok z množiny $A$ ven je roven jejímu celkovému přebytku. Toky po hranách uvnitř
      $A$ se při sčítání vyruší – každá taková hrana je pro jeden svůj konec odtokem a pro
      druhý přítokem.
    proof: |
      Sečteme podmínku 1 z definice toku přes všechny uzly $i \in A$:
      $$
      a(A) = \sum_{i \in A} a_i
      = \sum_{i \in A} \sum_{j;\,(i,j) \in H(\vec{G})} x_{ij} \;-\; \sum_{i \in A} \sum_{j;\,(j,i) \in H(\vec{G})} x_{ji}.
      $$
      První dvojitá suma sčítá toky na všech hranách, které **vycházejí** z některého uzlu
      množiny $A$. Takové hrany končí buď v $A$, nebo v $\bar{A}$, takže suma je rovna
      $x(A, A) + x(A, \bar{A})$. Druhá dvojitá suma sčítá toky na všech hranách
      **vcházejících** do uzlů z $A$; ty začínají v $A$ nebo v $\bar{A}$, suma je tedy
      $x(A, A) + x(\bar{A}, A)$. Odečtením se člen $x(A,A)$ (hrany uvnitř $A$) vyruší:
      $$
      a(A) = \big(x(A,A) + x(A,\bar{A})\big) - \big(x(A,A) + x(\bar{A},A)\big) = x(A,\bar{A}) - x(\bar{A},A).
      $$
    proof_steps:
      - Sečteme rovnici zákona zachování přes všechny uzly množiny $A$; vlevo vznikne $a(A)$.
      - Suma odtoků z uzlů $A$ se rozdělí podle koncového uzlu hrany na $x(A,A) + x(A,\bar{A})$.
      - Suma přítoků do uzlů $A$ se rozdělí podle počátečního uzlu na $x(A,A) + x(\bar{A},A)$.
      - Člen $x(A,A)$ (hrany uvnitř $A$) se při odečtení vyruší a zbude $a(A) = x(A,\bar{A}) - x(\bar{A},A)$.
    examples:
      - title: Kontrola na konkrétním toku
        body: |
          V síti z [příkladu k Fordovu–Fulkersonovu algoritmu](#alg-ford-fulkerson) s výsledným tokem
          velikosti 4 zvolme $A = \{z, a\}$. Pak $a(A) = a_z + a_a = 4 + 0 = 4$,
          $x(A,\bar{A}) = x_{zb} + x_{zc} + x_{ad} + x_{ae} = 2 + 1 + 1 + 0 = 4$ a
          $x(\bar{A}, A) = 0$ (do $z$ ani $a$ nevede hrana z $\bar{A}$). Skutečně $4 = 4 - 0$.
    related: [def-tok, def-rez, def-oznaceni-souctu, thm-existence-toku, prop-tok-a-rez]
    illustrations:
      - title: Toky uvnitř krabice se vyruší
        graph:
          directed: true
          nodes:
            - { id: z, x: 0, y: 5 }
            - { id: a, x: 3, y: 2 }
            - { id: b, x: 3, y: 5 }
            - { id: c, x: 3, y: 8 }
            - { id: d, x: 7, y: 3 }
            - { id: e, x: 7, y: 7 }
            - { id: s, x: 10, y: 5 }
          edges:
            - { from: z, to: a, w: 2, x: 1 }
            - { from: z, to: b, w: 2, x: 2 }
            - { from: z, to: c, w: 1, x: 1 }
            - { from: a, to: d, w: 1, x: 1 }
            - { from: a, to: e, w: 2, x: 0 }
            - { from: b, to: d, w: 1, x: 1 }
            - { from: b, to: e, w: 2, x: 1 }
            - { from: c, to: d, w: 2, x: 1 }
            - { from: c, to: e, w: 1, x: 0 }
            - { from: d, to: s, w: 4, x: 3 }
            - { from: e, to: s, w: 1, x: 1 }
        steps:
          - caption: |
              Tok velikosti 4 ($a_z = 4$, $a_s = -4$, ostatní uzly neutrální). Pro jediný uzel $A = \{d\}$ je
              tvrzení přímo zákon zachování: odteče $3$ (červeně), přiteče $1 + 1 + 1 = 3$, tedy $a_d = 3 - 3 = 0$.
            nodes: { d: visited }
            edges: { d-s: cut, a-d: back, b-d: back, c-d: back }
            labels: { z: "a=4", s: "a=−4", d: "a=0" }
          - caption: |
              $A = \{a, b, d, e\}$: ven teče $x(A,\bar{A}) = 3 + 1 = 4$, dovnitř $x(\bar{A},A) = 1 + 2 + 1 + 0 = 4$,
              rozdíl je $0 = a(A)$. Šedé hrany uvnitř $A$ se nepočítají: každá je odtokem pro jeden svůj konec
              a přítokem pro druhý, takže se při sčítání bilancí vyruší.
            nodes: { a: visited, b: visited, d: visited, e: visited }
            edges: { d-s: cut, e-s: cut, z-a: back, z-b: back, c-d: back, c-e: back, a-d: dim, a-e: dim, b-d: dim, b-e: dim }
            labels: { z: "a=4", s: "a=−4" }
          - caption: |
              $A = \{z, a, b, e\}$ obsahuje zdroj: ven teče $1 + 1 + 1 + 1 = 4$, dovnitř jen po $(c,e)$, kde je tok $0$.
              Rozdíl $4 - 0 = 4 = a(A) = a_z$ – čistý odtok z množiny je roven jejímu přebytku.
            nodes: { z: visited, a: visited, b: visited, e: visited }
            edges: { z-c: cut, a-d: cut, b-d: cut, e-s: cut, c-e: back, z-a: dim, z-b: dim, a-e: dim, b-e: dim }
            labels: { z: "a=4", s: "a=−4" }
    source: "skripta str. 6–7; přednáška 3, fólie 10"

  - id: thm-existence-toku
    kind: theorem
    label: "Věta 2.1"
    section: "2.1"
    title: Existence toku v síti
    terms: [věta 2.1, existence toku, podmínka existence toku, Galeova věta, přípustný tok]
    statement: |
      V síti $\vec{G}$ existuje tok, právě když $a(U(\vec{G})) = 0$ a pro každou množinu uzlů
      $A \subset U(\vec{G})$ platí $a(A) \le r(A, \bar{A})$.
    intuition: |
      Nutnost je zřejmá: všechno, co zdroje vyrobí, musí stoky spotřebovat (součet intenzit
      je nula), a z žádné množiny uzlů nelze vyvézt víc, než unesou hrany vedoucí ven
      (čistý přebytek $a(A)$ musí projít řezem $(A,\bar{A})$). Překvapivá je postačitelnost:
      jiné překážky neexistují. Ověřovat podmínku pro všech $2^n$ množin $A$ by bylo
      exponenciální – v praxi existenci toku rozhodneme polynomiálně převodem na maximální tok
      (viz [konstrukce fiktivního zdroje a stoku](#rem-fiktivni-zdroj-stok)).
    proof: |
      **1. Nutnost.** Nechť $x$ je tok v $\vec{G}$. Protože $0 \le x_{ij} \le r_{ij}$ pro každou
      hranu, je $x(A,\bar{A}) \le r(A,\bar{A})$ a $x(\bar{A},A) \ge 0$. Podle
      [tvrzení 2.1](#prop-bilance-mnoziny) tedy
      $a(A) = x(A,\bar{A}) - x(\bar{A},A) \le r(A,\bar{A})$. Pro $A = U(\vec{G})$ je
      $\bar{A} = \emptyset$, oba řezy jsou prázdné a dostáváme $a(U(\vec{G})) = 0$.

      **2. Postačitelnost** (skripta odd. 2.6, využívá [Fordovu–Fulkersonovu větu](#thm-ford-fulkerson)).
      Nechť $a(U(\vec{G})) = 0$ a $a(A) \le r(A,\bar{A})$ pro všechna $A$. Označme
      $a^+ = \sum_{i:\,a_i > 0} a_i$ celkovou produkci zdrojů; díky $a(U(\vec{G})) = 0$ je
      také $\sum_{i:\,a_i<0} (-a_i) = a^+$. Je-li $a^+ = 0$, jsou všechny uzly neutrální a
      nulový tok vyhovuje. Nechť tedy $a^+ > 0$.

      Sestrojíme síť $\vec{G}'$ s jedním zdrojem a jedním stokem: přidáme nový uzel $z$ a nový
      uzel $s$; pro každý uzel $i$ s $a_i > 0$ přidáme hranu $(z,i)$ s propustností $a_i$, pro
      každý uzel s $a_i < 0$ hranu $(i,s)$ s propustností $-a_i$; všem původním uzlům dáme
      intenzitu $0$.

      *Řez $(\{z\}, \overline{\{z\}})$ je minimální.* Jeho propustnost je $a^+$. Buď
      $(A', \bar{A}')$ libovolný řez v $\vec{G}'$ oddělující $z$ a $s$ a $A = A' \setminus \{z\}
      \subset U(\vec{G})$. Řez obsahuje hrany $(A,\bar{A})$ původní sítě, hrany $(z,i)$ pro
      zdroje $i \notin A$ a hrany $(i,s)$ pro stoky $i \in A$, takže
      $$
      r'(A',\bar{A}') = r(A,\bar{A}) + \sum_{i \notin A,\, a_i>0} a_i + \sum_{i \in A,\, a_i<0} (-a_i).
      $$
      Z předpokladu $r(A,\bar{A}) \ge a(A) = \sum_{i \in A,\, a_i>0} a_i - \sum_{i \in A,\, a_i<0} (-a_i)$,
      a po dosazení $r'(A',\bar{A}') \ge \sum_{i \in A,\,a_i>0} a_i + \sum_{i \notin A,\,a_i>0} a_i = a^+$.
      (Pro $A = U(\vec{G})$ je $r(A,\bar{A}) = 0 = a(A)$, nerovnost tedy platí také.)

      *Maximální tok nasytí nové hrany.* Podle Fordovy–Fulkersonovy věty má maximální tok
      $x'$ v $\vec{G}'$ velikost $a^+$. Celý tok opouští $z$ po hranách $(z,i)$, jejichž
      propustnosti dávají součet právě $a^+$ – všechny tedy musí být nasycené:
      $x'_{zi} = a_i$. Podobně do $s$ přitéká $a^+$ po hranách $(i,s)$ s celkovou propustností
      $a^+$, takže $x'_{is} = -a_i$.

      *Restrikce je hledaný tok.* Nechť $x$ je zúžení $x'$ na hrany $\vec{G}$. Podmínka
      propustnosti zřejmě platí. Pro zdroj $i$ dává zákon zachování v $\vec{G}'$ (intenzita $0$):
      (odtok v $\vec{G}$) $-$ (přítok v $\vec{G}$) $- x'_{zi} = 0$, tedy odtok $-$ přítok $= a_i$.
      Pro stok $i$: (odtok v $\vec{G}$) $+ x'_{is} -$ (přítok v $\vec{G}$) $= 0$, tedy
      odtok $-$ přítok $= -x'_{is} = a_i$. Neutrální uzly se nezměnily. Tedy $x$ je tok v $\vec{G}$.
    proof_steps:
      - "Nutnost: pro tok $x$ je $x(A,\\bar{A}) \\le r(A,\\bar{A})$ a $x(\\bar{A},A) \\ge 0$, takže z tvrzení 2.1 plyne $a(A) \\le r(A,\\bar{A})$."
      - "Volbou $A = U(\\vec{G})$ (prázdné řezy) dostaneme z tvrzení 2.1 podmínku $a(U(\\vec{G})) = 0$."
      - "Postačitelnost: přidáme fiktivní zdroj $z$ s hranami $(z,i)$ propustnosti $a_i$ ke zdrojům a fiktivní stok $s$ s hranami $(i,s)$ propustnosti $-a_i$ od stoků."
      - "Z podmínky $a(A) \\le r(A,\\bar{A})$ odvodíme, že každý řez oddělující $z$ a $s$ má propustnost alespoň $a^+$, tedy $(\\{z\\}, \\overline{\\{z\\}})$ je minimální řez."
      - "Podle Fordovy–Fulkersonovy věty má maximální tok velikost $a^+$, a proto nasytí všechny nové hrany u $z$ i u $s$."
      - "Zúžení tohoto toku na původní síť splňuje zákon zachování s původními intenzitami $a_i$, je to tedy hledaný tok."
    examples:
      - title: Ověření existence toku převodem na maximální tok
        body: |
          Síť: uzly $1$ ($a_1 = 2$), $2$ ($a_2 = 1$), $3$ ($a_3 = -3$), $4$ ($a_4 = 0$);
          hrany $(1,3)$: $1$, $(1,4)$: $2$, $(2,4)$: $1$, $(4,3)$: $3$. Součet intenzit je $0$.

          Přidáme $z$ s hranami $(z,1)$: $2$, $(z,2)$: $1$ a $s$ s hranou $(3,s)$: $3$; $a^+ = 3$.
          Maximální tok: $z\,1\,3\,s$ (1), $z\,1\,4\,3\,s$ (1), $z\,2\,4\,3\,s$ (1) má velikost
          $3 = a^+$, takže tok v původní síti existuje: $x_{13} = 1$, $x_{14} = 1$, $x_{24} = 1$,
          $x_{43} = 2$. Kontrola v uzlu 4: odtok $2$ − přítok $2$ = $0 = a_4$.
        graph:
          directed: true
          nodes:
            - { id: z, x: 0, y: 5 }
            - { id: "1", x: 3, y: 2, a: 2 }
            - { id: "2", x: 3, y: 8, a: 1 }
            - { id: "4", x: 6, y: 6, a: 0 }
            - { id: "3", x: 8, y: 3, a: -3 }
            - { id: s, x: 10, y: 3 }
          edges:
            - { from: z, to: "1", w: 2, x: 2 }
            - { from: z, to: "2", w: 1, x: 1 }
            - { from: "1", to: "3", w: 1, x: 1 }
            - { from: "1", to: "4", w: 2, x: 1 }
            - { from: "2", to: "4", w: 1, x: 1 }
            - { from: "4", to: "3", w: 3, x: 2 }
            - { from: "3", to: s, w: 3, x: 3 }
    related: [prop-bilance-mnoziny, thm-ford-fulkerson, rem-fiktivni-zdroj-stok, def-tok]
    illustrations:
      - title: Překážkou toku je úzký řez
        graph:
          directed: true
          nodes:
            - { id: L, x: 1, y: 7.5 }
            - { id: H, x: 5, y: 2 }
            - { id: P, x: 9, y: 7.5 }
          edges:
            - { from: L, to: H, w: 2 }
            - { from: H, to: P, w: 1 }
            - { from: L, to: P, w: 1 }
        steps:
          - caption: |
              Zdroj $L$ má intenzitu $3$, stok $P$ intenzitu $-3$, $H$ je neutrální. Součet intenzit je $0$,
              první podmínka věty tedy platí. Existuje tok?
            nodes: { L: source, P: sink }
            labels: { L: "a=3", H: "a=0", P: "a=−3" }
          - caption: |
              $A = \{L\}$: přebytek $a(A) = 3$ musí odtéct řezem $(A,\bar{A}) = \{(L,H), (L,P)\}$ s propustností
              $2 + 1 = 3$. Podmínka $a(A) \le r(A,\bar{A})$ platí – z $L$ samotného se přebytek vyvézt dá.
            nodes: { L: visited }
            edges: { L-H: cut, L-P: cut }
            labels: { L: "a=3", H: "a=0", P: "a=−3" }
          - caption: |
              $A = \{L, H\}$: $a(A) = 3$, ale z $A$ vedou ven jen hrany $(H,P)$ a $(L,P)$ s propustností $1 + 1 = 2$.
              Je $a(A) = 3 > 2 = r(A,\bar{A})$, takže **tok neexistuje** – úzké hrdlo je hrana $(H,P)$.
            nodes: { L: visited, H: visited }
            edges: { H-P: cut, L-P: cut, L-H: dim }
            labels: { L: "a=3", H: "a=0", P: "a=−3" }
          - caption: |
              Malá změna: propustnost hrany $(H,P)$ zvýšíme na $2$. Teď $r(\{L,H\}, \{P\}) = 3 \ge 3$ a podmínku
              splňují i všechny ostatní množiny $A$.
            edges: { H-P: active }
            edge_labels: { H-P: "2" }
            labels: { L: "a=3", H: "a=0", P: "a=−3" }
          - caption: |
              Věta slibuje, že jiná překážka než úzký řez neexistuje – a tok skutečně najdeme:
              $x_{LH} = 2$, $x_{HP} = 2$, $x_{LP} = 1$ (u hran $x/r$). V každém uzlu odtok − přítok = intenzita.
            edge_labels: { L-H: "2/2", H-P: "2/2", L-P: "1/1" }
            labels: { L: "3−0 = 3 ✓", H: "2−2 = 0 ✓", P: "0−3 = −3 ✓" }
      - title: Postačitelnost přes fiktivní zdroj a stok
        for: proof
        graph:
          directed: true
          nodes:
            - { id: z, x: 0, y: 5 }
            - { id: "1", x: 3, y: 2 }
            - { id: "2", x: 3, y: 8 }
            - { id: "4", x: 6, y: 7 }
            - { id: "3", x: 7, y: 2 }
            - { id: s, x: 10, y: 4.5 }
          edges:
            - { from: "1", to: "3", w: 1 }
            - { from: "1", to: "4", w: 2 }
            - { from: "2", to: "4", w: 1 }
            - { from: "4", to: "3", w: 3 }
        steps:
          - caption: |
              Síť s více zdroji ($a_1 = 2$, $a_2 = 1$) a stokem $a_3 = -3$; součet intenzit je $0$ a podmínka
              $a(A) \le r(A,\bar{A})$ platí. Uzly $z$ a $s$ jsou zatím nepřipojené – přidáme je v dalším kroku.
            nodes: { "1": source, "2": source, "3": sink }
            labels: { "1": "a=2", "2": "a=1", "3": "a=−3", "4": "a=0" }
          - caption: |
              Fiktivní zdroj $z$ spojíme se zdroji hranami s propustností $a_i$, stok s fiktivním stokem $s$ hranou
              s propustností $-a_3 = 3$. Původní uzly teď mají intenzitu $0$; celková produkce je $a^+ = 3$.
            add: [[z, "1", 2], [z, "2", 1], ["3", s, 3]]
            nodes: { z: source, s: sink }
            edges: { z-1: active, z-2: active, 3-s: active }
            labels: { "1": "a=0", "2": "a=0", "3": "a=0", "4": "a=0" }
          - caption: |
              Řez $(\{z\}, \overline{\{z\}})$ má propustnost $a^+ = 3$. Z podmínky $a(A) \le r(A,\bar{A})$ plyne,
              že **žádný** řez oddělující $z$ a $s$ není menší – tento řez je minimální.
            nodes: { z: visited }
            edges: { z-1: cut, z-2: cut }
          - caption: |
              Podle Fordovy–Fulkersonovy věty má maximální tok velikost $3$. Hrany ze $z$ mají celkovou propustnost
              právě $3$, takže je maximální tok musí všechny **nasytit** – stejně tak hranu do $s$.
            edges: { z-1: path, z-2: path, 3-s: path }
            edge_labels: { z-1: "2/2", z-2: "1/1", 1-3: "1/1", 1-4: "1/2", 2-4: "1/1", 4-3: "2/3", 3-s: "3/3" }
          - caption: |
              Fiktivní uzly odstraníme. Na zbylých hranách je tok, který splňuje zákon zachování s **původními**
              intenzitami: v uzlu $1$ chyběla jen přitékající hrana ze $z$, a proto teď odtok − přítok $= 2 = a_1$.
            remove: [[z, "1"], [z, "2"], ["3", s]]
            edge_labels: { 1-3: "1/1", 1-4: "1/2", 2-4: "1/1", 4-3: "2/3" }
            labels: { "1": "2−0 = 2 ✓", "2": "1−0 = 1 ✓", "3": "0−3 = −3 ✓", "4": "2−2 = 0 ✓" }
    source: "skripta str. 7 a 11 (odd. 2.6); přednáška 3, fólie 10"

  # ------------------------------------------------------------------ 2.2
  - id: def-velikost-toku
    kind: definition
    section: "2.2"
    title: Síť s jedním zdrojem a jedním stokem, velikost toku
    terms: [síť s jedním zdrojem a jedním stokem, velikost toku, hodnota toku, value of flow, nulový tok, "|x|"]
    statement: |
      Uvažujme síť $\vec{G}$ s jedním zdrojem $z$ a jedním stokem $s$; ostatní uzly jsou neutrální.
      Má-li zdroj intenzitu $a \ge 0$, musí mít stok intenzitu $-a$ (jinak by podle
      [věty 2.1](#thm-existence-toku) žádný tok neexistoval). Číslo $a$ – množství produktu
      přepraveného ze $z$ do $s$ – se pro tok $x$ nazývá **velikost toku** $x$ a značí se $|x|$.

      Intenzitu $a$ zde chápeme jako volnou: porovnáváme toky různých velikostí v síti s danými
      propustnostmi.
    intuition: |
      Pro $a = 0$ je nulový tok ($x_{ij} = 0$ pro všechny hrany) vždy tokem – v každé síti
      s jedním zdrojem a stokem tedy existuje alespoň jeden tok. Smysluplná otázka proto je,
      jak velký tok lze ze $z$ do $s$ nejvýše poslat.
    related: [def-maximalni-tok, def-minimalni-rez, prop-tok-a-rez]
    source: "skripta str. 7; přednáška 4, fólie 1"

  - id: def-maximalni-tok
    kind: definition
    label: "Definice 2.5"
    section: "2.2"
    title: Maximální tok
    terms: [maximální tok, maximum flow, max-flow, největší tok]
    statement: |
      Nechť $\vec{G}$ je síť s jedním zdrojem $z$ a jedním stokem $s$ a $x$ tok v $\vec{G}$.
      Tok $x$ je **maximální tok** v $\vec{G}$, jestliže pro každý tok $x'$ v $\vec{G}$ platí
      $|x'| \le |x|$.
    intuition: |
      Maximální tok nemusí být jediný – jednoznačná je jen jeho velikost. (V příkladu
      k [Edmondsovu–Karpovu algoritmu](#alg-edmonds-karp) vyjde jiný maximální tok než ve skriptech,
      ale stejné velikosti 4.)
    related: [def-velikost-toku, thm-ford-fulkerson, alg-ford-fulkerson]
    source: "skripta str. 7; přednáška 4, fólie 1"

  - id: def-minimalni-rez
    kind: definition
    label: "Definice 2.6"
    section: "2.2"
    title: Propustnost řezu, minimální řez
    terms: [propustnost řezu, kapacita řezu, minimální řez, minimum cut, min-cut, řez oddělující uzly]
    statement: |
      Nechť $\vec{G}$ je síť s jedním zdrojem $z$ a jedním stokem $s$ a $(A, \bar{A})$ řez sítě $\vec{G}$.
      * Číslo $r(A, \bar{A})$ se nazývá **propustnost řezu** $(A,\bar{A})$.
      * Řez $(A,\bar{A})$ je **minimální řez** sítě $\vec{G}$, jestliže pro každý řez
        $(A', \bar{A}')$ sítě $\vec{G}$ platí $r(A,\bar{A}) \le r(A', \bar{A}')$.
      * Jsou-li $u, v \in U(\vec{G})$, řekneme, že řez $(A,\bar{A})$ **odděluje** uzly $u$, $v$,
        jestliže $u \in A$ a $v \in \bar{A}$.
    intuition: |
      Propustnost řezu sčítá jen hrany z $A$ do $\bar{A}$ – hrany opačného směru se nepočítají
      (ani se neodečítají). Ve [Fordově–Fulkersonově větě](#thm-ford-fulkerson) se minimum bere přes
      řezy **oddělující $z$ a $s$**.
    related: [def-rez, prop-tok-a-rez, thm-ford-fulkerson]
    illustrations:
      - title: Které řezy jsou minimální?
        graph:
          directed: true
          nodes:
            - { id: z, x: 0, y: 5 }
            - { id: p, x: 5, y: 1.5 }
            - { id: q, x: 5, y: 8.5 }
            - { id: s, x: 10, y: 5 }
          edges:
            - { from: z, to: p, w: 100 }
            - { from: z, to: q, w: 100 }
            - { from: p, to: q, w: 1 }
            - { from: p, to: s, w: 100 }
            - { from: q, to: s, w: 100 }
        steps:
          - caption: |
              $A = \{z\}$: řez tvoří hrany $(z,p)$ a $(z,q)$, propustnost $100 + 100 = 200$.
            nodes: { z: visited }
            edges: { z-p: cut, z-q: cut }
          - caption: |
              $A = \{z, p\}$: řez je $\{(z,q), (p,q), (p,s)\}$ s propustností $100 + 1 + 100 = 201$. Svislá hrana
              vede z $A$ ven, takže se započítá – tento řez minimální **není**.
            nodes: { z: visited, p: visited }
            edges: { z-q: cut, p-q: cut, p-s: cut, z-p: dim }
          - caption: |
              $A = \{z, q\}$: řez je $\{(z,p), (q,s)\}$, propustnost $200$. Hrana $(p,q)$ teď vede z $\bar{A}$ **do** $A$ –
              do propustnosti řezu se nepočítá, ani se neodečítá.
            nodes: { z: visited, q: visited }
            edges: { z-p: cut, q-s: cut, p-q: back, z-q: dim }
          - caption: |
              $A = \{z, p, q\}$: řez $\{(p,s), (q,s)\}$ má opět propustnost $200$. Minimální řez tedy nemusí být
              jediný; jednoznačná je jen jeho propustnost (zde $200$ = velikost maximálního toku).
            nodes: { z: visited, p: visited, q: visited }
            edges: { p-s: cut, q-s: cut, z-p: dim, z-q: dim, p-q: dim }
    source: "skripta str. 7; přednáška 4, fólie 1"

  - id: prop-tok-a-rez
    kind: proposition
    label: "Tvrzení 2.2"
    section: "2.2"
    title: Velikost toku a propustnost řezu
    terms: [tvrzení 2.2, slabá dualita, tok je nejvýše propustnost řezu, horní odhad toku]
    statement: |
      Nechť $\vec{G}$ je síť s jedním zdrojem $z$ a jedním stokem $s$, $(A,\bar{A})$ řez
      oddělující $z$ a $s$ a $x$ tok v $\vec{G}$. Pak
      1. $|x| = x(A,\bar{A}) - x(\bar{A},A)$,
      2. $|x| \le r(A,\bar{A})$.
    intuition: |
      Každý tok musí řezem „protlačit“ celou svou velikost, a protože řez víc než
      $r(A,\bar{A})$ neunese, je **každý** řez horním odhadem **každého** toku. Najdeme-li tedy
      tok a řez se stejnou hodnotou, jsou oba optimální – na tom stojí důkaz
      [Fordovy–Fulkersonovy věty](#thm-ford-fulkerson) i test optimality v algoritmu.
    proof: |
      (i) Použijeme [tvrzení 2.1](#prop-bilance-mnoziny) na množinu $A$. Ta obsahuje zdroj $z$,
      neobsahuje stok $s$ a ostatní uzly jsou neutrální, takže $a(A) = a_z = |x|$. Tedy
      $|x| = x(A,\bar{A}) - x(\bar{A},A)$.

      (ii) Z podmínky 2 definice toku plyne $x(A,\bar{A}) \le r(A,\bar{A})$ a $x(\bar{A},A) \ge 0$.
      Dosazením do (i) dostaneme $|x| \le r(A,\bar{A}) - 0$.
    proof_steps:
      - Množina $A$ obsahuje $z$, neobsahuje $s$ a ostatní uzly jsou neutrální, proto $a(A) = |x|$.
      - "Tvrzení 2.1 pro množinu $A$ dává $|x| = x(A,\\bar{A}) - x(\\bar{A},A)$."
      - "Z omezení $0 \\le x_{ij} \\le r_{ij}$ je $x(A,\\bar{A}) \\le r(A,\\bar{A})$ a $x(\\bar{A},A) \\ge 0$."
      - "Dosazením do vztahu (i) plyne $|x| \\le r(A,\\bar{A})$."
    examples:
      - title: Dva řezy v síti ze skript
        body: |
          Pro výsledný tok velikosti 4 z [příkladu k F–F algoritmu](#alg-ford-fulkerson):
          * $A = \{z\}$: $r(A,\bar{A}) = r_{za} + r_{zb} + r_{zc} = 2 + 2 + 1 = 5 \ge 4$.
          * $A = \{z, a, b, e\}$: řez tvoří hrany $(a,d), (b,d), (z,c), (e,s)$, propustnost
            $1+1+1+1 = 4$; $x(A,\bar{A}) = 4$ a $x(\bar{A}, A) = x_{ce} = 0$, takže $|x| = 4 - 0$.
            Tento řez je minimální a tok maximální.
    related: [prop-bilance-mnoziny, def-minimalni-rez, thm-ford-fulkerson]
    illustrations:
      - title: Každý řez shora omezuje každý tok
        graph:
          directed: true
          nodes:
            - { id: z, x: 0, y: 5 }
            - { id: a, x: 3, y: 2 }
            - { id: b, x: 3, y: 5 }
            - { id: c, x: 3, y: 8 }
            - { id: d, x: 7, y: 3 }
            - { id: e, x: 7, y: 7 }
            - { id: s, x: 10, y: 5 }
          edges:
            - { from: z, to: a, w: 2, x: 1 }
            - { from: z, to: b, w: 2, x: 1 }
            - { from: z, to: c, w: 1, x: 1 }
            - { from: a, to: d, w: 1, x: 1 }
            - { from: a, to: e, w: 2, x: 0 }
            - { from: b, to: d, w: 1, x: 1 }
            - { from: b, to: e, w: 2, x: 0 }
            - { from: c, to: d, w: 2, x: 0 }
            - { from: c, to: e, w: 1, x: 1 }
            - { from: d, to: s, w: 4, x: 2 }
            - { from: e, to: s, w: 1, x: 1 }
        steps:
          - caption: |
              Tok velikosti $|x| = 3$ (u hran $x/r$). Řez s $A = \{z\}$: ven teče $1 + 1 + 1 = 3$, dovnitř nic,
              takže $|x| = 3 - 0$. Propustnost řezu je $5 \ge 3$.
            nodes: { z: visited }
            edges: { z-a: cut, z-b: cut, z-c: cut }
          - caption: |
              $A = \{z, a, b, e\}$: ven teče $x(A,\bar{A}) = 1 + 1 + 1 + 1 = 4$, ale po $(c,e)$ se $1$ vrací
              dovnitř, takže $|x| = 4 - 1 = 3$. Odhad $|x| \le r(A,\bar{A}) = 4$ platí, ale rovnost ne.
            nodes: { z: visited, a: visited, b: visited, e: visited }
            edges: { z-c: cut, a-d: cut, b-d: cut, e-s: cut, c-e: back }
          - caption: |
              Po zlepšení toku na velikost $4$ je stejný řez **těsný**: hrany ven jsou nasycené a $(c,e)$ je nulová,
              $|x| = 4 - 0 = r(A,\bar{A})$. Žádný tok nemůže být větší než $4$ a žádný řez menší – oba jsou optimální.
            nodes: { z: visited, a: visited, b: visited, e: visited }
            edges: { z-c: cut, a-d: cut, b-d: cut, e-s: cut, c-e: back }
            edge_labels: { z-b: "2/2", b-e: "1/2", c-e: "0/1", c-d: "1/2", d-s: "3/4" }
