  # ------------------------------------------------------------------ 2.4
  - id: alg-ford-fulkerson
    kind: algorithm
    label: "Algoritmus 2.1"
    section: "2.4"
    title: Ford–Fulkersonův algoritmus
    terms: [Ford–Fulkersonův algoritmus, Ford-Fulkerson, algoritmus maximálního toku, metoda zlepšujících cest, augmenting path method, FF]
    statement: |
      Vstup: síť $\vec{G}$ s jedním zdrojem $z$, jedním stokem $s$ a propustnostmi $r_{ij}$.
      Výstup: maximální tok $x$ (a jako vedlejší produkt minimální řez $(R,\bar{R})$).

      Algoritmus opakovaně zvětšuje tok podél libovolné rezervní polocesty ze $z$ do $s$,
      dokud nějaká existuje. Způsob hledání polocesty není předepsán.
    pseudocode: |
      1. Polož $x_{ij} := 0$ pro každou hranu $(i,j) \in H(\vec{G})$ (nulový tok).
      2. Existuje-li v $\vec{G}$ rezervní polocesta $P$ ze $z$ do $s$ (vzhledem k $x$), urči
         $\Theta = \Theta(P)$ a uprav tok:
         $$
         x_{ij} := \begin{cases}
           x_{ij} + \Theta & (i,j) \text{ souhlasná hrana } P,\\
           x_{ij} - \Theta & (i,j) \text{ nesouhlasná hrana } P,\\
           x_{ij} & (i,j) \text{ neleží na } P,
         \end{cases}
         $$
         a pokračuj bodem 2.
      3. Neexistuje-li rezervní polocesta ze $z$ do $s$, je tok $x$ maximální. Množina $R$ uzlů
         dosažitelných ze $z$ po rezervních polocestách určuje minimální řez $(R,\bar{R})$.
    complexity: |
      Pro celočíselné propustnosti: každá iterace zvětší tok alespoň o $1$, takže iterací je nejvýše
      $|x^*|$ (velikost maximálního toku, omezená např. $r(\{z\}, \overline{\{z\}})$). Jedna iterace
      = prohledání grafu při hledání polocesty + úprava toku, tj. $O(n + m)$. Celkem
      $O(m \cdot |x^*|)$ – **pseudopolynomiální**: závisí na velikosti propustností, ne jen
      na $n = |U(\vec{G})|$ a $m = |H(\vec{G})|$ (viz síť s $Q$, kde stačí nešťastná volba a
      potřebujeme $2Q$ iterací). Pro iracionální propustnosti nemusí skončit vůbec.
      Polynomiální je až varianta [Edmonds–Karp](#alg-edmonds-karp), $O(nm^2)$.
    intuition: |
      Algoritmus je přímým přepisem důkazu [Fordovy–Fulkersonovy věty](#thm-ford-fulkerson):
      dokud lze tok zlepšit, zlepšíme ho; když nelze, konstrukce množiny $R$ dokazuje optimalitu.
      Oproti [naivnímu postupu](#rem-naivni-orientovane-cesty) smí polocesty procházet hrany proti
      směru, čímž se opravují dřívější špatná rozhodnutí.

      **Typická chyba:** skončit, když už neexistuje *orientovaná* cesta s volnou kapacitou
      (viz příklad níže – tok 3 vypadá maximálně, ale není).
    examples:
      - title: "Příklad ze skript – zadání"
        body: |
          Najděme maximální tok v síti na obrázku (čísla u hran jsou propustnosti).
        graph:
          directed: true
          nodes:
            - { id: z, x: 0, y: 5 }
            - { id: a, x: 3, y: 2 }
            - { id: b, x: 3, y: 5 }
            - { id: c, x: 3, y: 8 }
            - { id: d, x: 7, y: 3 }
            - { id: e, x: 7, y: 7 }
            - { id: s, x: 10, y: 5 }
          edges:
            - { from: z, to: a, w: 2 }
            - { from: z, to: b, w: 2 }
            - { from: z, to: c, w: 1 }
            - { from: a, to: d, w: 1 }
            - { from: a, to: e, w: 2 }
            - { from: b, to: d, w: 1 }
            - { from: b, to: e, w: 2 }
            - { from: c, to: d, w: 2 }
            - { from: c, to: e, w: 1 }
            - { from: d, to: s, w: 4 }
            - { from: e, to: s, w: 1 }
