  # ------------------------------------------------------------------ 2.5
  - id: alg-edmonds-karp
    kind: algorithm
    section: "2.5"
    title: Edmonds–Karpův algoritmus
    terms: [Edmonds–Karpův algoritmus, Edmonds-Karp, nejkratší rezervní polocesta, prohledávání do šířky, BFS, breadth-first search, polynomiální algoritmus maximálního toku]
    statement: |
      Modifikace [Ford–Fulkersonova algoritmu](#alg-ford-fulkerson): v kroku 2 volíme vždy
      **nejkratší** rezervní polocestu ze $z$ do $s$ (s nejmenším počtem hran). Hledáme ji
      **prohledáváním do šířky** (BFS) z uzlu $z$, kde sousedy uzlu $v$ jsou uzly $w$, pro něž
      $(v,w)$ je nenasycená hrana nebo $(w,v)$ je nenulová hrana.

      Počet opakování kroku 2 pak nezávisí na propustnostech hran – viz
      [větu o složitosti](#thm-edmonds-karp-slozitost).
    pseudocode: |
      1. Polož $x_{ij} := 0$ pro všechny hrany.
      2. Jedna iterace – hledání nejkratší rezervní polocesty pro aktuální tok $x$:
         - (a) $T$ je strom na jediném uzlu $z$; seznam (fronta) $L = (z)$; $z$ je **označený**,
           ostatní uzly **neoznačené**.
         - (b) Je-li $L \ne \emptyset$, nechť $v$ je první uzel seznamu $L$.
           - Je-li $v = s$: jednoznačně určená polocesta ze $z$ do $s$ ve stromu $T$ je hledaná
             nejkratší rezervní polocesta $P$. Uprav podél ní tok jako ve F–F algoritmu
             (o $\Theta(P)$) a začni novou iteraci (krok 2).
           - Jinak označ všechny neoznačené sousedy $w$ uzlu $v$, pro něž $(v,w)$ je nenasycená
             hrana nebo $(w,v)$ je nenulová hrana, připoj je ve stromu $T$ hranou k $v$ a přidej
             je na konec seznamu $L$. Vyřaď $v$ z $L$ a pokračuj bodem (b).
         - (c) Je-li $L = \emptyset$, rezervní polocesta ze $z$ do $s$ neexistuje a tok $x$ je
           maximální; označené uzly tvoří množinu $R$ minimálního řezu $(R,\bar{R})$.
    complexity: |
      $O(n m^2)$, kde $n = |U(\vec{G})|$, $m = |H(\vec{G})|$ (pro souvislou síť, $m \ge n-1$).
      Jedna iterace (BFS + úprava toku) trvá $O(n + m) = O(m)$, protože každou hranu
      prozkoumáme nejvýše dvakrát (z každého konce jednou). Počet iterací je $O(nm)$ a
      **nezávisí na propustnostech** ([věta o složitosti](#thm-edmonds-karp-slozitost)).
      Skripta uvádějí „zhruba $m^2 n$“ jako odhad celkové náročnosti.
    intuition: |
      BFS zpracovává uzly po vrstvách podle vzdálenosti od $z$, takže první nalezená cesta do
      $s$ je nejkratší. Krátké polocesty mají výhodu: v síti s $Q$ by algoritmus okamžitě
      zvolil dvě polocesty délky 2 a nikdy nešel přes svislou hranu. Obecně se vzdálenosti
      od $z$ v „reziduální síti“ nikdy nezmenšují, a to omezí počet iterací polynomem.

      Kdy uzel označit: po hraně $(v,w)$ jdeme **po směru**, pokud na ní ještě zbývá kapacita
      ($x_{vw} < r_{vw}$); po hraně $(w,v)$ jdeme **proti směru**, pokud po ní něco teče
      ($x_{wv} > 0$).
    examples:
      - title: Běh Edmonds–Karpova algoritmu na síti ze skript
        body: |
          Síť jako v [příkladu k F–F](#alg-ford-fulkerson); sousedy procházíme abecedně.

          1. BFS: $z$ označí $a, b, c$; $a$ označí $d, e$; $b$, $c$ nic nového; $d$ označí $s$.
             Polocesta $z\,a\,d\,s$, $\Theta = \min\{2,1,4\} = 1$. Tok 1.
          2. $z$: $a, b, c$; $a$: jen $e$ ($(a,d)$ nasycená); $b$: $d$; $c$: nic; $e$: $s$.
             Polocesta $z\,a\,e\,s$, $\Theta = \min\{1,2,1\} = 1$. Tok 2.
          3. $z$: $b, c$ ($(z,a)$ nasycená); $b$: $d, e$; $c$: nic; $d$: $s$.
             Polocesta $z\,b\,d\,s$, $\Theta = \min\{2,1,3\} = 1$. Tok 3.
          4. $z$: $b, c$; $b$: $e$; $c$: $d$; $e$: proti směru $a$ ($x_{ae} = 1 > 0$); $d$: $s$.
             Polocesta $z\,c\,d\,s$, $\Theta = \min\{1,2,2\} = 1$. Tok 4.
          5. $z$: jen $b$; $b$: $e$; $e$: $a$ (proti směru); $a$: nic ($(a,d)$ nasycená).
             Seznam se vyprázdní, $s$ neoznačen → tok je maximální.

          Výsledek: $x_{za} = 2$, $x_{zb} = 1$, $x_{zc} = 1$, $x_{ad} = 1$, $x_{ae} = 1$,
          $x_{bd} = 1$, $x_{be} = 0$, $x_{cd} = 1$, $x_{ce} = 0$, $x_{ds} = 3$, $x_{es} = 1$,
          velikost 4. Označené uzly $R = \{z, a, b, e\}$ dávají stejný minimální řez
          $\{(a,d), (b,d), (z,c), (e,s)\}$ jako ve skriptech, i když tok je jiný.
          Všechny použité polocesty měly délku 3 (nejkratší možnou).
        graph:
          directed: true
          nodes:
            - { id: z, x: 0, y: 5 }
            - { id: a, x: 3, y: 2 }
            - { id: b, x: 3, y: 5 }
            - { id: c, x: 3, y: 8 }
            - { id: d, x: 7, y: 3 }
            - { id: e, x: 7, y: 7 }
            - { id: s, x: 10, y: 5 }
          edges:
            - { from: z, to: a, w: 2, x: 2 }
            - { from: z, to: b, w: 2, x: 1 }
            - { from: z, to: c, w: 1, x: 1 }
            - { from: a, to: d, w: 1, x: 1 }
            - { from: a, to: e, w: 2, x: 1 }
            - { from: b, to: d, w: 1, x: 1 }
            - { from: b, to: e, w: 2, x: 0 }
            - { from: c, to: d, w: 2, x: 1 }
            - { from: c, to: e, w: 1, x: 0 }
            - { from: d, to: s, w: 4, x: 3 }
            - { from: e, to: s, w: 1, x: 1 }
    visualization: max-flow
    related: [alg-ford-fulkerson, thm-edmonds-karp-slozitost, rem-ff-zavislost-na-propustnostech, def-rezervni-polocesta]
    source: "skripta str. 11; přednáška 4, fólie 4"

  - id: thm-edmonds-karp-slozitost
    kind: theorem
    section: "2.5"
    title: Počet iterací Edmonds–Karpova algoritmu
    terms: [složitost Edmonds–Karpova algoritmu, O(nm^2), počet iterací, kritická hrana, monotonie vzdáleností]
    statement: |
      Volí-li Ford–Fulkersonův algoritmus vždy nejkratší rezervní polocestu ze $z$ do $s$,
      provede nejvýše $nm$ úprav toku (kde $n = |U(\vec{G})|$, $m = |H(\vec{G})|$), a to pro
      libovolné kladné reálné propustnosti. Celková časová složitost je $O(nm^2)$.
    intuition: |
      Ve skriptech je jen konstatováno („dá se ukázat“). Klíčové jsou dvě myšlenky:
      (1) vzdálenost každého uzlu od $z$ po rezervních polocestách během algoritmu nikdy neklesne;
      (2) hrana, která při úpravě „omezí“ rezervu (nasytí se nebo vynuluje), se může stát znovu
      omezující jen tehdy, když se vzdálenost jejího počátku zvětší aspoň o 2. Vzdálenosti jsou
      nejvýš $n-1$, takže každá hrana omezí rezervu nejvýš asi $n/2$-krát.
    proof: |
      *Důkaz ve skriptech není, doplněno.*

      **Reziduální graf.** Pro tok $x$ sestrojme orientovaný graf $\vec{G}_x$ na uzlech sítě:
      pro každou hranu $(i,j)$ s $x_{ij} < r_{ij}$ obsahuje oblouk $i \to j$ a pro každou hranu
      $(i,j)$ s $x_{ij} > 0$ oblouk $j \to i$. Rezervní polocesty ze $z$ odpovídají přesně
      orientovaným cestám v $\vec{G}_x$. Označme $\delta_x(v)$ délku (počet hran) nejkratší cesty
      ze $z$ do $v$ v $\vec{G}_x$ ($\infty$, pokud neexistuje). Na nejkratší cestě $P$ platí pro
      každý její oblouk $u \to v$: $\delta_x(v) = \delta_x(u) + 1$.

      **Lemma 1 (monotonie).** Nechť $x'$ vznikne z $x$ úpravou podél nejkratší polocesty $P$.
      Pak $\delta_{x'}(v) \ge \delta_x(v)$ pro všechny uzly $v$.
      Úprava odstraní z reziduálního grafu aspoň jeden oblouk $P$ (ten, který určil rezervu) a může
      přidat jen oblouky $v \to u$ opačné k obloukům $u \to v$ cesty $P$. Předpokládejme pro spor,
      že existuje uzel s $\delta_{x'}(v) < \delta_x(v)$, a vezměme takový s nejmenším $\delta_{x'}(v)$.
      Nechť $u$ je předchůdce $v$ na nejkratší cestě v $\vec{G}_{x'}$; pak
      $\delta_{x'}(u) = \delta_{x'}(v) - 1$ a z minimality $\delta_{x'}(u) \ge \delta_x(u)$.
      Byl-li oblouk $u \to v$ už v $\vec{G}_x$, je $\delta_x(v) \le \delta_x(u) + 1 \le \delta_{x'}(u) + 1
      = \delta_{x'}(v)$ – spor. Jinak je $u \to v$ nový, tedy $v \to u$ ležel na $P$ a
      $\delta_x(v) = \delta_x(u) - 1 \le \delta_{x'}(u) - 1 = \delta_{x'}(v) - 2$ – opět spor.

      **Lemma 2 (kritické oblouky).** Oblouk $u \to v$ nazveme kritickým při úpravě, pokud jeho
      rezerva určila $\Theta$ (po úpravě z reziduálního grafu zmizí). Tehdy
      $\delta_x(v) = \delta_x(u) + 1$. Aby se $u \to v$ stal znovu kritickým, musí se nejprve
      znovu objevit, tj. musí se upravovat podél nejkratší cesty obsahující $v \to u$; v tom
      okamžiku (tok $y$) je $\delta_y(u) = \delta_y(v) + 1 \ge \delta_x(v) + 1 = \delta_x(u) + 2$
      (Lemma 1). Mezi dvěma kritickými výskyty tedy $\delta(u)$ vzroste aspoň o 2. Protože
      $\delta(u) \le n - 2$ pro uzel $u \ne s$ na cestě do $s$, může být oblouk kritický nejvýše
      $n/2$-krát.

      **Závěr.** Každá úprava má aspoň jeden kritický oblouk a možných oblouků reziduálního
      grafu je nejvýše $2m$ (dva pro každou hranu), takže úprav je nejvýše
      $2m \cdot n/2 = nm$. Jedna iterace (BFS a úprava toku) stojí $O(m)$, celkem $O(nm^2)$.
    proof_steps:
      - Zavedeme reziduální graf $\vec{G}_x$, v němž rezervní polocesty odpovídají orientovaným cestám, a vzdálenosti $\delta_x(v)$ od $z$.
      - Úprava podél nejkratší cesty jen odebírá oblouky cesty a přidává oblouky k nim opačné, které vedou „o vrstvu zpět“.
      - Z toho sporem plyne, že vzdálenost $\delta_x(v)$ žádného uzlu během algoritmu neklesne (Lemma 1).
      - Oblouk, který určil rezervu, zmizí; znovu se objeví jen po úpravě přes opačný oblouk, a tím vzdálenost jeho počátku vzroste alespoň o 2.
      - Protože vzdálenosti jsou nejvýše $n$, je každý z nejvýše $2m$ oblouků kritický nejvýše $n/2$-krát.
      - Každá úprava má kritický oblouk, takže úprav je nejvýše $nm$; s cenou $O(m)$ za BFS dostaneme $O(nm^2)$.
    complexity: "$O(nm^2)$; počet iterací nejvýše $nm$"
    related: [alg-edmonds-karp, alg-ford-fulkerson, rem-ff-zavislost-na-propustnostech]
    source: "skripta str. 11 (tvrzení zmíněno bez důkazu)"
    supplemented: true

  # ------------------------------------------------------------------ 2.6
  - id: rem-fiktivni-zdroj-stok
    kind: remark
    section: "2.6"
    title: Převod sítě s více zdroji a stoky na síť s jedním zdrojem a stokem
    terms: [fiktivní zdroj, fiktivní stok, superzdroj, superstok, super source, super sink, více zdrojů a stoků, rozhodnutí existence toku]
    statement: |
      Je-li $\vec{G}$ síť s více zdroji a stoky, sestrojíme síť $\vec{G}'$ s jedním zdrojem a
      jedním stokem: přidáme nový („fiktivní“) zdroj $z$ a nový stok $s$ a pro
      $i = 1, \dots, |U(\vec{G})|$:
      * je-li $a_i > 0$, přidáme hranu $(z,i)$ s propustností $a_i$ a uzlu $i$ dáme intenzitu $0$,
      * je-li $a_i < 0$, přidáme hranu $(i,s)$ s propustností $-a_i$ a uzlu $i$ dáme intenzitu $0$,
      * je-li $a_i = 0$, neděláme nic.

      V $\vec{G}$ existuje tok, právě když $a(U(\vec{G})) = 0$ a maximální tok v $\vec{G}'$ má velikost
      $\sum_{a_i > 0} a_i$, tj. nasytí všechny nové hrany; restrikce takového toku na $\vec{G}$ je
      hledaný tok.
    intuition: |
      Tento trik dokončuje důkaz [věty 2.1](#thm-existence-toku) a zároveň dává **polynomiální
      algoritmus** pro rozhodnutí existence toku (místo ověřování $2^n$ nerovností
      $a(A) \le r(A,\bar{A})$ stačí jeden běh [Edmonds–Karpova algoritmu](#alg-edmonds-karp)).
      Stejnou konstrukci použijeme pro [největší párování v bigrafu](#alg-parovani-max-tok).
    examples:
      - title: Schéma konstrukce
        body: |
          Fiktivní zdroj $z$ je spojen se všemi zdroji původní sítě, všechny stoky jsou spojeny
          s fiktivním stokem $s$. Na obrázku původní síť se zdroji $u_1, u_2$ a stoky $v_1, v_2$
          (vnitřní hrany sítě vynechány).
        graph:
          directed: true
          nodes:
            - { id: z, x: 0, y: 5 }
            - { id: u1, x: 3, y: 3, a: 2 }
            - { id: u2, x: 3, y: 7, a: 3 }
            - { id: v1, x: 7, y: 3, a: -4 }
            - { id: v2, x: 7, y: 7, a: -1 }
            - { id: s, x: 10, y: 5 }
          edges:
            - { from: z, to: u1, w: 2 }
            - { from: z, to: u2, w: 3 }
            - { from: v1, to: s, w: 4 }
            - { from: v2, to: s, w: 1 }
    related: [thm-existence-toku, thm-ford-fulkerson, alg-edmonds-karp, alg-parovani-max-tok]
    illustrations:
      - title: Když maximální tok nové hrany nenasytí
        graph:
          directed: true
          nodes:
            - { id: z, x: 0, y: 6 }
            - { id: L, x: 2.5, y: 8 }
            - { id: H, x: 5, y: 2 }
            - { id: P, x: 7.5, y: 8 }
            - { id: s, x: 10, y: 6 }
          edges:
            - { from: L, to: H, w: 2 }
            - { from: H, to: P, w: 1 }
            - { from: L, to: P, w: 1 }
        steps:
          - caption: |
              Původní síť: zdroj $L$ ($a = 3$), stok $P$ ($a = -3$), neutrální $H$. Existuje v ní tok? Místo
              zkoušení všech množin $A$ přidáme fiktivní zdroj $z$ a stok $s$ (zatím nepřipojené).
            nodes: { L: source, P: sink }
            labels: { L: "a=3", H: "a=0", P: "a=−3" }
          - caption: |
              Hrana $(z,L)$ dostane propustnost $a_L = 3$, hrana $(P,s)$ propustnost $-a_P = 3$; všechny původní uzly
              mají teď intenzitu $0$. Tok v původní síti existuje, právě když maximální tok má velikost $a^+ = 3$.
            add: [[z, L, 3], [P, s, 3]]
            nodes: { z: source, s: sink }
            edges: { z-L: active, P-s: active }
            labels: { L: "a=0", H: "a=0", P: "a=0" }
          - caption: |
              Maximální tok má ale velikost jen $2$ (u hran $x/r$): hrany $(z,L)$ a $(P,s)$ zůstanou **nenasycené**,
              takže tok v původní síti **neexistuje**.
            edges: { z-L: active, P-s: active }
            edge_labels: { z-L: "2/3", L-H: "1/2", H-P: "1/1", L-P: "1/1", P-s: "2/3" }
          - caption: |
              Minimální řez to vysvětlí: $R = \{z, L, H\}$, řez $\{(H,P), (L,P)\}$ má propustnost $2$. Bez fiktivního
              zdroje je to množina $A = \{L, H\}$ z věty 2.1 s $a(A) = 3 > r(A,\bar{A}) = 2$.
            nodes: { z: visited, L: visited, H: visited }
            edges: { H-P: cut, L-P: cut }
            edge_labels: { z-L: "2/3", L-H: "1/2", H-P: "1/1", L-P: "1/1", P-s: "2/3" }
    source: "skripta str. 11 (odd. 2.6)"

quiz:
  - id: q-toky-01
    question: |
      Která podmínka **není** součástí definice toku v síti?
    options:
      - '$0 \le x_{ij} \le r_{ij}$ pro každou hranu'
      - Zákon zachování v každém uzlu (odtok − přítok = intenzita)
      - '$x_{ij} = x_{ji}$ pro každou dvojici uzlů'
      - Nezápornost toku na hranách
    correct: 2
    explanation: |
      Tok je orientovaný; po $(i,j)$ a $(j,i)$ mohou téct různá množství a hrana $(j,i)$ vůbec nemusí existovat.
      Definice obsahuje jen zákon zachování a podmínku $0 \le x_{ij} \le r_{ij}$ (která zahrnuje nezápornost).
    related: [def-tok]

  - id: q-toky-02
    question: |
      Síť má uzly s intenzitami $3$, $0$, $-2$ a velké propustnosti všech hran. Existuje v ní tok?
    options:
      - Ano, protože propustnosti jsou velké
      - Ne, protože součet intenzit není nulový
      - Ano, pokud je graf silně souvislý
      - Nelze rozhodnout bez znalosti hran
    correct: 1
    explanation: |
      Věta 2.1 vyžaduje $a(U(\vec{G})) = 0$ (plyne z tvrzení 2.1 pro $A = U(\vec{G})$). Zde je součet $1$,
      přebytek jedné jednotky nemá kam odtéct, takže tok neexistuje bez ohledu na hrany.
    related: [thm-existence-toku, prop-bilance-mnoziny]

  - id: q-toky-03
    question: |
      Proč Ford–Fulkersonův algoritmus pracuje s **polocestami**, a ne jen s orientovanými cestami?
    options:
      - Polocesty jsou kratší, takže algoritmus běží rychleji
      - Hledání orientovaných cest je NP-úplné
      - Nesouhlasné hrany umožní snížit tok na dříve nevhodně použité hraně; po orientovaných cestách lze uvíznout v nemaximálním toku
      - Orientované cesty nemusí začínat ve zdroji
    correct: 2
    explanation: |
      V síti se svislou hranou (všechny propustnosti 1) vede nešťastná volba cesty $z\,p\,q\,s$ k toku 1,
      ze kterého už žádná orientovaná cesta s rezervou nevede. Polocesta $z\,q\,p\,s$ projde svislou hranu
      proti směru, tok na ní vynuluje a velikost toku zvýší na maximum 2.
    related: [rem-naivni-orientovane-cesty, def-polocesta]

  - id: q-toky-04
    question: |
      Polocesta ze $z$ do $s$ má souhlasné hrany s $(x_{ij}, r_{ij}) = (1,4)$ a $(0,5)$ a jednu nesouhlasnou hranu
      s tokem $x = 2$ a propustností $3$. Jaká je její rezerva $\Theta$?
    options:
      - "1"
      - "2"
      - "3"
      - "5"
    correct: 1
    explanation: |
      Souhlasné hrany: $4 - 1 = 3$ a $5 - 0 = 5$, tedy $\Theta_s = 3$. Nesouhlasná hrana: lze ubrat
      nejvýše tok $2$ (propustnost zde nehraje roli), $\Theta_n = 2$. $\Theta = \min\{3, 2\} = 2$.
    related: [def-rezervni-polocesta]

  - id: q-toky-05
    question: |
      Jaká je časová složitost Edmonds–Karpova algoritmu ($n$ uzlů, $m$ hran)?
    options:
      - '$O(m \cdot |x^*|)$, kde $|x^*|$ je velikost maximálního toku'
      - '$O(nm^2)$'
      - '$O(2^n)$'
      - '$O(n + m)$'
    correct: 1
    explanation: |
      Iterací je $O(nm)$ (nezávisle na propustnostech) a jedna iterace (BFS + úprava) stojí $O(m)$.
      $O(m \cdot |x^*|)$ je pseudopolynomiální odhad obecného F–F algoritmu s celočíselnými propustnostmi.
    related: [alg-edmonds-karp, thm-edmonds-karp-slozitost]

  - id: q-toky-06
    question: |
      V síti s hranami $(z,p), (z,q), (p,s), (q,s)$ propustnosti $Q$ a hranou $(p,q)$ propustnosti 1 může
      F–F algoritmus potřebovat $2Q$ kroků. Co to říká o jeho složitosti?
    options:
      - Je lineární, protože $2Q$ je lineární funkce
      - Není polynomiální vzhledem k velikosti vstupu, protože $Q$ se zapíše jen pomocí $\log Q$ bitů
      - Je exponenciální v počtu uzlů
      - Nic, protože pro celočíselné propustnosti je vždy konečný
    correct: 1
    explanation: |
      Počet kroků závisí na velikosti čísel, ne jen na velikosti grafu: síť má 4 uzly a 5 hran, ale $2Q$ kroků je
      exponenciálně mnoho vůči délce zápisu $Q$. Algoritmus je pseudopolynomiální; Edmonds–Karp by zde skončil po 2 krocích.
    related: [rem-ff-zavislost-na-propustnostech, alg-edmonds-karp]

  - id: q-toky-07
    question: |
      F–F algoritmus skončil s tokem $x$. Jak najdeme minimální řez?
    options:
      - Vezmeme všechny nasycené hrany
      - "$A$ = množina uzlů dosažitelných ze $z$ po rezervních polocestách; řez je $(A, \\bar{A})$"
      - Vezmeme hrany s nejmenší propustností na každé cestě ze $z$ do $s$
      - "$A = \\{z\\}$, protože řez u zdroje je vždy minimální"
    correct: 1
    explanation: |
      Z důkazu Fordovy–Fulkersonovy věty: hrany z $R$ ven jsou nasycené a hrany dovnitř nulové, takže
      $r(R,\bar{R}) = |x|$. Množina všech nasycených hran obecně řezem být nemusí (nebo není minimální).
    related: [thm-ford-fulkerson, cor-charakterizace-max-toku]

  - id: q-toky-08
    question: |
      Co platí o F–F algoritmu pro **iracionální** propustnosti?
    options:
      - Skončí vždy, ale pomaleji
      - Nemusí skončit po konečném počtu kroků
      - Nelze ho vůbec spustit
      - Skončí vždy po nejvýše $nm$ krocích
    correct: 1
    explanation: |
      Tvrzení 2.4 zaručuje konečnost jen pro celočíselné (a převodem i racionální) propustnosti. Pro reálné existují
      sítě, kde se tok zvětšuje o stále menší kousky donekonečna. Edmonds–Karpova volba nejkratší polocesty
      tento problém odstraňuje.
    related: [rem-ff-zavislost-na-propustnostech, prop-konecnost-ff]

  - id: q-toky-09
    question: |
      Našli jsme tok velikosti 7 a řez oddělující $z$ a $s$ s propustností 7. Co z toho plyne?
    options:
      - Nic, musíme ještě spustit algoritmus
      - Tok je maximální a řez minimální
      - Tok je maximální, ale řez nemusí být minimální
      - Síť obsahuje rezervní polocestu
    correct: 1
    explanation: |
      Podle tvrzení 2.2 (ii) je každý tok $\le$ každý řez. Žádný tok tedy nepřesáhne 7 a žádný řez nebude menší než 7 –
      oba jsou optimální. Řez je „certifikát“ maximality toku.
    related: [prop-tok-a-rez, thm-ford-fulkerson]

  - id: q-toky-10
    question: |
      Proč má v síti s celočíselnými propustnostmi vždy existovat **celočíselný** maximální tok?
    options:
      - Protože každý maximální tok je celočíselný
      - Protože F–F algoritmus začíná nulovým tokem a mění ho vždy o celé číslo $\Theta \ge 1$, a skončí v maximálním toku
      - Protože podle věty 2.1 jsou intenzity celá čísla
      - Neplatí to, celočíselný maximální tok existovat nemusí
    correct: 1
    explanation: |
      Z důkazu tvrzení 2.4: všechny mezivýsledky F–F algoritmu jsou celočíselné a algoritmus končí maximálním tokem.
      Neplatí ale, že každý maximální tok je celočíselný (např. lze tok rozdělit napůl mezi dvě paralelní cesty).
    related: [prop-konecnost-ff, alg-parovani-max-tok]

  - id: q-toky-11
    question: |
      Při BFS v Edmonds–Karpově algoritmu zpracováváme uzel $v$. Kterého souseda $w$ označíme?
    options:
      - Každého souseda, do něhož vede hrana $(v,w)$
      - "Neoznačeného $w$, pro nějž $(v,w)$ je nenasycená hrana nebo $(w,v)$ je nenulová hrana"
      - "Neoznačeného $w$, pro nějž $(v,w)$ je nasycená hrana"
      - Jen souseda s největší propustností hrany
    correct: 1
    explanation: |
      Po směru hrany lze pokračovat, je-li $x_{vw} < r_{vw}$; proti směru, je-li $x_{wv} > 0$. Tak vznikají
      právě rezervní polocesty; strom BFS dává nejkratší z nich.
    related: [alg-edmonds-karp]

  - id: q-toky-12
    question: |
      Pro tok $x$ v síti a množinu $A$ platí $x(A,\bar{A}) = 9$ a $x(\bar{A},A) = 4$. Čemu se rovná $a(A)$?
    options:
      - "13"
      - "9"
      - "5"
      - "−5"
    correct: 2
    explanation: |
      Tvrzení 2.1: $a(A) = x(A,\bar{A}) - x(\bar{A},A) = 9 - 4 = 5$. Čistý přebytek množiny $A$ je roven čistému odtoku z ní.
    related: [prop-bilance-mnoziny]

  - id: q-toky-13
    question: |
      Jak se dokazuje, že podmínky věty 2.1 jsou **postačující** pro existenci toku?
    options:
      - Indukcí podle počtu uzlů
      - Přidáním fiktivního zdroje a stoku a použitím Fordovy–Fulkersonovy věty na minimální řez $(\{z\}, \overline{\{z\}})$
      - Ověřením všech $2^n$ podmnožin uzlů algoritmem
      - Postačitelnost neplatí, podmínky jsou jen nutné
    correct: 1
    explanation: |
      Z $a(A) \le r(A,\bar{A})$ se odvodí, že řez u fiktivního zdroje je minimální; maximální tok proto nasytí
      všechny nové hrany a jeho zúžení na původní síť je hledaný tok (skripta odd. 2.6).
    related: [thm-existence-toku, rem-fiktivni-zdroj-stok]

  - id: q-toky-14
    question: |
      Které tvrzení o maximálním toku a minimálním řezu v síti s jedním zdrojem a stokem je **pravdivé**?
    options:
      - Maximální tok je vždy jednoznačný
      - Minimální řez vždy obsahuje všechny nasycené hrany
      - Velikost maximálního toku je jednoznačná, ale maximálních toků může být více
      - Do propustnosti řezu se odečítají propustnosti hran vedoucích z $\bar{A}$ do $A$
    correct: 2
    explanation: |
      Např. Edmonds–Karp a postup ve skriptech dají na stejné síti různé maximální toky velikosti 4. Propustnost řezu
      sčítá jen hrany z $A$ do $\bar{A}$; hrany opačného směru se v ní neobjevují (jen v toku přes řez se odečítají).
    related: [def-maximalni-tok, def-minimalni-rez, alg-edmonds-karp]
