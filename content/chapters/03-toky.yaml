  - id: thm-ford-fulkerson
    kind: theorem
    label: "Věta 2.2"
    section: "2.3"
    title: Fordova–Fulkersonova věta
    terms: [Fordova–Fulkersonova věta, věta o maximálním toku a minimálním řezu, max-flow min-cut, max flow = min cut, věta 2.2, Ford Fulkerson theorem]
    statement: |
      **[Ford, Fulkerson]** Buď $\vec{G}$ síť s jedním zdrojem $z$ a jedním stokem $s$.
      Velikost maximálního toku v $\vec{G}$ je rovna propustnosti minimálního řezu oddělujícího $z$ a $s$.
    intuition: |
      Z [tvrzení 2.2](#prop-tok-a-rez) víme „$\le$“: žádný tok není větší než žádný řez.
      Věta říká, že mezi nimi není mezera – nejužší místo sítě přesně určuje, kolik jí proteče.
      Důkaz je konstruktivní: z maximálního toku sestrojíme množinu $R$ uzlů dosažitelných
      po rezervních polocestách a řez $(R,\bar{R})$ je minimální. Totéž dává **certifikát
      optimality**: kdo chce ověřit, že tok je maximální, stačí mu ukázat řez stejné propustnosti.
    proof: |
      Nechť $x$ je maximální tok v $\vec{G}$. (Maximální tok existuje: množina všech toků je
      uzavřená a omezená podmnožina $\mathbb{R}^{|H(\vec{G})|}$ a velikost toku je spojitá
      funkce, takže nabývá maxima. Pro celočíselné propustnosti to plyne i z konečnosti
      F–F algoritmu. *Toto zdůvodnění ve skriptech není, doplněno.*)

      Označme $R$ množinu všech uzlů $w$, do nichž existuje ze $z$ rezervní polocesta
      (vzhledem k $x$). Zřejmě $z \in R$ (triviální polocesta) a $s \notin R$, protože jinak by
      podle [tvrzení 2.3](#prop-rezervni-polocesta) tok $x$ nebyl maximální. Řez $(R, \bar{R})$
      tedy odděluje $z$ a $s$.

      * Každá hrana $(i,j) \in (R,\bar{R})$ je **nasycená**: kdyby $x_{ij} < r_{ij}$, prodloužili
        bychom rezervní polocestu ze $z$ do $i$ o souhlasnou hranu $(i,j)$ ($j$ na ní neleží,
        protože $j \notin R$) a dostali rezervní polocestu do $j$, tj. $j \in R$ – spor.
      * Každá hrana $(j,i) \in (\bar{R},R)$ je **nulová**: kdyby $x_{ji} > 0$, prodloužili bychom
        polocestu do $i$ o nesouhlasnou hranu $(j,i)$ a opět dostali $j \in R$ – spor.

      Tedy $x(R,\bar{R}) = r(R,\bar{R})$ a $x(\bar{R},R) = 0$, a podle tvrzení 2.2 (i)
      $$
      |x| = x(R,\bar{R}) - x(\bar{R},R) = r(R,\bar{R}).
      $$
      Pro libovolný řez $(A,\bar{A})$ oddělující $z$ a $s$ je podle tvrzení 2.2 (ii)
      $r(R,\bar{R}) = |x| \le r(A,\bar{A})$, takže $(R,\bar{R})$ je minimální řez oddělující
      $z$ a $s$ a jeho propustnost je rovna velikosti maximálního toku.
    proof_steps:
      - Vezmeme maximální tok $x$ (existuje díky kompaktnosti množiny toků).
      - Definujeme $R$ jako množinu uzlů dosažitelných ze $z$ po rezervních polocestách; $z \in R$ a podle tvrzení 2.3 je $s \notin R$.
      - "Hrany řezu $(R,\\bar{R})$ jsou nasycené, jinak by šlo polocestu prodloužit souhlasnou hranou mimo $R$."
      - "Hrany z $\\bar{R}$ do $R$ jsou nulové, jinak by šlo polocestu prodloužit nesouhlasnou hranou."
      - "Podle tvrzení 2.2 (i) je $|x| = r(R,\\bar{R}) - 0 = r(R,\\bar{R})$."
      - "Podle tvrzení 2.2 (ii) je každý řez oddělující $z$ a $s$ alespoň $|x|$, takže $(R,\\bar{R})$ je minimální a max. tok = min. řez."
    related: [prop-tok-a-rez, prop-rezervni-polocesta, cor-charakterizace-max-toku, alg-ford-fulkerson, thm-existence-toku]
    illustrations:
      - title: Z maximálního toku sestrojíme minimální řez
        for: proof
        graph:
          directed: true
          nodes:
            - { id: z, x: 0, y: 5 }
            - { id: a, x: 3, y: 2 }
            - { id: b, x: 3, y: 5 }
            - { id: c, x: 3, y: 8 }
            - { id: d, x: 7, y: 3 }
            - { id: e, x: 7, y: 7 }
            - { id: s, x: 10, y: 5 }
          edges:
            - { from: z, to: a, w: 2, x: 1 }
            - { from: z, to: b, w: 2, x: 2 }
            - { from: z, to: c, w: 1, x: 1 }
            - { from: a, to: d, w: 1, x: 1 }
            - { from: a, to: e, w: 2, x: 0 }
            - { from: b, to: d, w: 1, x: 1 }
            - { from: b, to: e, w: 2, x: 1 }
            - { from: c, to: d, w: 2, x: 1 }
            - { from: c, to: e, w: 1, x: 0 }
            - { from: d, to: s, w: 4, x: 3 }
            - { from: e, to: s, w: 1, x: 1 }
        steps:
          - caption: |
              Vezmeme maximální tok $x$ (zde velikosti $4$, u hran $x/r$). Chceme najít řez se stejnou propustností.
            nodes: { z: source, s: sink }
          - caption: |
              $R$ = uzly dosažitelné ze $z$ po rezervních polocestách: $(z,a)$ není nasycená → $a$; $(a,e)$ je prázdná
              → $e$; po $(b,e)$ teče $1$, smíme ji projít proti směru → $b$. Dál to nejde: $R = \{z, a, b, e\}$.
              Kdyby $s \in R$, šlo by tok zvětšit – takže $s \notin R$.
            nodes: { z: visited, a: visited, b: visited, e: visited }
            edges: { z-a: path, a-e: path, b-e: back }
          - caption: |
              Každá hrana z $R$ ven je **nasycená**: kdyby třeba $(e,s)$ měla volnou kapacitu, prodloužili bychom
              polocestu do $e$ o tuto hranu a $s$ by patřil do $R$ – spor.
            nodes: { z: visited, a: visited, b: visited, e: visited }
            edges: { z-c: cut, a-d: cut, b-d: cut, e-s: cut }
          - caption: |
              Každá hrana z $\bar{R}$ do $R$ je **nulová**: kdyby po $(c,e)$ něco teklo, prošli bychom ji z $e$ proti
              směru a $c$ by patřil do $R$ – spor.
            nodes: { z: visited, a: visited, b: visited, e: visited }
            edges: { c-e: back }
          - caption: |
              Proto $|x| = x(R,\bar{R}) - x(\bar{R},R) = 4 - 0 = r(R,\bar{R})$. Protože žádný řez není menší než
              žádný tok, je $(R,\bar{R})$ **minimální řez** a maximální tok = minimální řez.
            nodes: { z: visited, a: visited, b: visited, e: visited }
            edges: { z-c: cut, a-d: cut, b-d: cut, e-s: cut, c-e: back }
    source: "skripta str. 9; přednáška 4, fólie 2"

  - id: cor-charakterizace-max-toku
    kind: corollary
    section: "2.3"
    title: Tok je maximální, právě když neexistuje rezervní polocesta
    terms: [charakterizace maximálního toku, test maximality, kritérium optimality toku, certifikát optimality]
    statement: |
      Nechť $\vec{G}$ je síť s jedním zdrojem $z$ a jedním stokem $s$ a $x$ tok v $\vec{G}$.
      Tok $x$ je maximální, právě když v $\vec{G}$ neexistuje rezervní polocesta ze $z$ do $s$
      vzhledem k $x$. V tom případě je $(R,\bar{R})$, kde $R$ je množina uzlů dosažitelných ze $z$
      po rezervních polocestách, minimální řez.
    intuition: |
      Toto je obrácení [tvrzení 2.3](#prop-rezervni-polocesta) a je základem
      [F–F algoritmu](#alg-ford-fulkerson): když už rezervní polocesta neexistuje, můžeme skončit,
      a množina $R$ (označené uzly) rovnou ukáže minimální řez jako důkaz optimality.
    proof: |
      Implikace „maximální ⇒ neexistuje rezervní polocesta“ je [tvrzení 2.3](#prop-rezervni-polocesta)
      (v obměněné podobě).

      Naopak nechť rezervní polocesta ze $z$ do $s$ neexistuje. Definujme $R$ jako v důkazu
      [věty 2.2](#thm-ford-fulkerson); pak $s \notin R$. Stejnou úvahou jako tam jsou hrany
      $(R,\bar{R})$ nasycené a hrany $(\bar{R},R)$ nulové, takže $|x| = r(R,\bar{R})$. Pro každý
      tok $x'$ je podle [tvrzení 2.2](#prop-tok-a-rez) (ii) $|x'| \le r(R,\bar{R}) = |x|$, tedy
      $x$ je maximální. Stejně tak $r(R,\bar{R}) = |x| \le r(A,\bar{A})$ pro každý řez oddělující
      $z$ a $s$, takže $(R,\bar{R})$ je minimální.
    proof_steps:
      - Směr „maximální ⇒ bez rezervní polocesty“ je obměna tvrzení 2.3.
      - Neexistuje-li rezervní polocesta, sestrojíme množinu $R$ dosažitelných uzlů; $s \notin R$.
      - "Hrany z $R$ ven jsou nasycené, hrany dovnitř nulové, proto $|x| = r(R,\\bar{R})$."
      - "Každý jiný tok $x'$ splňuje $|x'| \\le r(R,\\bar{R}) = |x|$, takže $x$ je maximální a řez $(R,\\bar{R})$ minimální."
    related: [prop-rezervni-polocesta, thm-ford-fulkerson, alg-ford-fulkerson]
    illustrations:
      - title: Test maximality pomocí množiny R
        graph:
          directed: true
          nodes:
            - { id: z, x: 0, y: 5 }
            - { id: a, x: 3, y: 2 }
            - { id: b, x: 3, y: 5 }
            - { id: c, x: 3, y: 8 }
            - { id: d, x: 7, y: 3 }
            - { id: e, x: 7, y: 7 }
            - { id: s, x: 10, y: 5 }
          edges:
            - { from: z, to: a, w: 2, x: 1 }
            - { from: z, to: b, w: 2, x: 1 }
            - { from: z, to: c, w: 1, x: 1 }
            - { from: a, to: d, w: 1, x: 1 }
            - { from: a, to: e, w: 2, x: 0 }
            - { from: b, to: d, w: 1, x: 1 }
            - { from: b, to: e, w: 2, x: 0 }
            - { from: c, to: d, w: 2, x: 0 }
            - { from: c, to: e, w: 1, x: 1 }
            - { from: d, to: s, w: 4, x: 2 }
            - { from: e, to: s, w: 1, x: 1 }
        steps:
          - caption: |
              Je tok velikosti $3$ maximální? Orientovaně se do $s$ s volnou kapacitou nedostaneme, ale rozhoduje,
              zda existuje **rezervní polocesta**.
          - caption: |
              Hledáme $R$: ze $z$ do $a$, $b$; z nich do $e$; z $e$ proti směru po $(c,e)$ (teče $1$) do $c$;
              z $c$ do $d$ a z $d$ do $s$. Je $s \in R$ – rezervní polocesta $z, b, e, c, d, s$ existuje, tok **není** maximální.
            nodes: { z: visited, a: visited, b: visited, c: visited, d: visited, e: visited, s: path }
            edges: { z-b: path, b-e: path, c-e: back, c-d: path, d-s: path }
          - caption: |
              Po úpravě o $\Theta = 1$ má tok velikost $4$. Nová množina $R = \{z, a, b, e\}$ už $s$ neobsahuje:
              tok je maximální a hrany $(R,\bar{R})$ (červeně) tvoří minimální řez s propustností $4$ – certifikát optimality.
            nodes: { z: visited, a: visited, b: visited, e: visited }
            edges: { z-c: cut, a-d: cut, b-d: cut, e-s: cut }
            edge_labels: { z-b: "2/2", b-e: "1/2", c-e: "0/1", c-d: "1/2", d-s: "3/4" }
