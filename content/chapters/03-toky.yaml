  # ------------------------------------------------------------------ 2.3
  - id: rem-naivni-orientovane-cesty
    kind: remark
    section: "2.3"
    title: Proč nestačí zvětšovat tok jen po orientovaných cestách
    terms: [naivní algoritmus, hladový algoritmus pro tok, orientované cesty nestačí, zpětná hrana, greedy max flow]
    statement: |
      Naivní postup: začni s nulovým tokem; dokud existuje orientovaná cesta $P$ ze $z$ do $s$,
      jejíž žádná hrana není nasycená, přičti ke všem hranám $P$ největší možné číslo $c$
      (nejmenší volnou kapacitu na $P$). Výsledkem je zase tok, větší o $c$.

      **Tento postup obecně nenajde maximální tok.** V síti na obrázku (všechny propustnosti
      $1$) může být v prvním kroku zvolena cesta $z \to p \to q \to s$ přes svislou hranu.
      Pak už žádná orientovaná cesta s volnou kapacitou neexistuje a postup skončí s tokem
      velikosti $1$, přestože maximální tok (po cestách $z\,p\,s$ a $z\,q\,s$) má velikost $2$.
    intuition: |
      Chybný první krok nejde „vzít zpět“, pokud se smíme pohybovat jen po směru hran. Pro
      každou síť sice existuje šťastné pořadí cest, ale nemáme návod, jak ho poznat. Řešením je
      dovolit i průchod hranou **proti směru**, a tím tok na ní snížit (přesměrovat): to je
      přesně [polocesta](#def-polocesta) s nesouhlasnými hranami. V příkladu polocesta
      $z \to q \leftarrow p \to s$ (svislou hranou proti směru) zvětší tok na 2.
    examples:
      - title: Uvíznutí naivního postupu
        body: |
          Tok po prvním (nešťastném) kroku: $x_{zp} = x_{pq} = x_{qs} = 1$, ostatní $0$.
          Hrany $(z,p)$ a $(q,s)$ jsou nasycené, takže žádná orientovaná cesta ze $z$ do $s$
          s volnou kapacitou neexistuje. Rezervní polocesta $z, q, p, s$ (hrana $(p,q)$ nesouhlasná,
          rezerva $\min\{1, 1, 1\} = 1$) ale existuje.
        graph:
          directed: true
          nodes:
            - { id: z, x: 0, y: 5 }
            - { id: p, x: 5, y: 2 }
            - { id: q, x: 5, y: 8 }
            - { id: s, x: 10, y: 5 }
          edges:
            - { from: z, to: p, w: 1, x: 1 }
            - { from: z, to: q, w: 1, x: 0 }
            - { from: p, to: q, w: 1, x: 1 }
            - { from: p, to: s, w: 1, x: 0 }
            - { from: q, to: s, w: 1, x: 1 }
    related: [def-polocesta, def-rezervni-polocesta, alg-ford-fulkerson]
    illustrations:
      - title: Naivní postup uvízne, polocesta ho zachrání
        graph:
          directed: true
          nodes:
            - { id: z, x: 0, y: 5 }
            - { id: p, x: 5, y: 1.5 }
            - { id: q, x: 5, y: 8.5 }
            - { id: s, x: 10, y: 5 }
          edges:
            - { from: z, to: p, w: 1, x: 0 }
            - { from: z, to: q, w: 1, x: 0 }
            - { from: p, to: q, w: 1, x: 0 }
            - { from: p, to: s, w: 1, x: 0 }
            - { from: q, to: s, w: 1, x: 0 }
        steps:
          - caption: |
              Všechny propustnosti jsou $1$, začínáme nulovým tokem (u hran $x/r$). Maximální tok má zjevně
              velikost $2$ – po cestách $z\,p\,s$ a $z\,q\,s$.
          - caption: |
              Naivní postup si ale může jako první vybrat orientovanou cestu $z \to p \to q \to s$ přes svislou
              hranu a pošle po ní $1$.
            edges: { z-p: path, p-q: path, q-s: path }
            edge_labels: { z-p: "1/1", p-q: "1/1", q-s: "1/1" }
          - caption: |
              Teď je každá orientovaná cesta ze $z$ do $s$ zablokovaná: $z\,p\,s$ i $z\,p\,q\,s$ vedou přes nasycenou
              $(z,p)$, $z\,q\,s$ přes nasycenou $(q,s)$. Naivní postup **skončí s tokem 1**, přestože maximum je $2$.
            edges: { z-p: active, q-s: active }
            edge_labels: { z-p: "1/1", p-q: "1/1", q-s: "1/1" }
          - caption: |
              Polocesta $z \to q \leftarrow p \to s$ projde svislou hranu **proti směru** (modře). Na souhlasných hranách
              je volno $1$, na nesouhlasné teče $1$ – rezerva je $1$, tok jde zvětšit.
            edges: { z-q: path, p-q: back, p-s: path }
            edge_labels: { z-p: "1/1", p-q: "1/1", q-s: "1/1" }
          - caption: |
              Po úpravě: na $(z,q)$ a $(p,s)$ přičteme $1$, na $(p,q)$ odečteme $1$. Jednotka, která tekla z $p$ do $q$,
              byla „přesměrována“ – tok má velikost $2$ a je maximální.
            edge_labels: { z-p: "1/1", z-q: "1/1", p-q: "0/1", p-s: "1/1", q-s: "1/1" }
    source: "skripta str. 8"

  - id: def-polocesta
    kind: definition
    label: "Definice 2.7"
    section: "2.3"
    title: Polocesta
    terms: [polocesta, semipath, souhlasná hrana, nesouhlasná hrana, dopředná hrana, zpětná hrana, triviální polocesta]
    statement: |
      Nechť $u, w \in U(\vec{G})$. **Polocesta** z $u$ do $w$ je posloupnost
      $u = v_0, h_1, v_1, h_2, \dots, h_k, v_k = w$, kde $v_i$ jsou navzájem různé uzly, $h_i$ jsou
      hrany a pro každé $i = 1, \dots, k$ platí buď
      * $h_i = v_{i-1} v_i$ – pak jde o **souhlasnou** hranu polocesty, nebo
      * $h_i = v_i v_{i-1}$ – **nesouhlasná** hrana.

      Speciálně připouštíme i triviální polocestu tvořenou jediným uzlem ($k = 0$).
    intuition: |
      Polocesta je cesta v symetrizaci grafu, u níž si pamatujeme, které hrany procházíme po
      směru (souhlasné) a které proti směru (nesouhlasné). Po souhlasné hraně tok
      zvyšujeme, po nesouhlasné snižujeme – tím „vracíme“ dřívější nevýhodná rozhodnutí.
    related: [def-rezervni-polocesta, rem-naivni-orientovane-cesty]
    source: "skripta str. 8; přednáška 4, fólie 2"

  - id: def-rezervni-polocesta
    kind: definition
    label: "Definice 2.7"
    section: "2.3"
    title: Rezerva polocesty, rezervní polocesta
    terms: [rezerva polocesty, rezervní polocesta, zlepšující cesta, augmenting path, nasycená hrana, nulová hrana, Theta, reziduální kapacita]
    statement: |
      Nechť $x$ je tok v síti $\vec{G}$ a $P$ polocesta. **Rezerva** polocesty $P$ je nezáporné číslo
      $$
      \Theta(P) = \min\{\Theta_s(P),\ \Theta_n(P)\},
      $$
      kde
      $$
      \Theta_s(P) = \min\{ r_{ij} - x_{ij} \mid (i,j) \text{ je souhlasná hrana } P \},\qquad
      \Theta_n(P) = \min\{ x_{ij} \mid (i,j) \text{ je nesouhlasná hrana } P \}.
      $$
      Polocesta $P$ je **rezervní**, jestliže $\Theta(P) > 0$. Triviální polocestu (jediný uzel)
      považujeme také za rezervní.

      Hrana $(i,j)$ je **nasycená**, je-li $x_{ij} = r_{ij}$, a **nulová**, je-li $x_{ij} = 0$.
      Polocesta je tedy rezervní, právě když neobsahuje žádnou souhlasnou nasycenou ani
      nesouhlasnou nulovou hranu.
    intuition: |
      Rezerva říká, o kolik lze tok podél polocesty změnit: na souhlasné hraně můžeme přidat
      nejvýš to, co zbývá do propustnosti, na nesouhlasné ubrat nejvýš to, co po ní teče.
      V anglické literatuře se rezervní polocestě říká *augmenting path* a pracuje se
      s tzv. reziduálním grafem, v němž je rezervní polocesta obyčejnou orientovanou cestou.
    examples:
      - title: Výpočet rezervy
        body: |
          V síti ze skript s tokem velikosti 3 (viz [příklad u F–F](#alg-ford-fulkerson)) uvažujme
          polocestu $z, b, e, c, d, s$:
          * $(z,b)$ souhlasná, $(x,r) = (1,2)$ → rezerva $1$,
          * $(b,e)$ souhlasná, $(0,2)$ → $2$,
          * $(c,e)$ nesouhlasná (procházíme z $e$ do $c$), $x_{ce} = 1$ → $1$,
          * $(c,d)$ souhlasná, $(0,2)$ → $2$,
          * $(d,s)$ souhlasná, $(2,4)$ → $2$.

          $\Theta_s = \min\{1,2,2,2\} = 1$, $\Theta_n = 1$, tedy $\Theta(P) = 1 > 0$ – polocesta je rezervní.
    related: [def-polocesta, prop-rezervni-polocesta, alg-ford-fulkerson]
    illustrations:
      - title: Rezervní a nerezervní polocesty
        graph:
          directed: true
          nodes:
            - { id: z, x: 0, y: 5 }
            - { id: a, x: 3, y: 2 }
            - { id: b, x: 3, y: 5 }
            - { id: c, x: 3, y: 8 }
            - { id: d, x: 7, y: 3 }
            - { id: e, x: 7, y: 7 }
            - { id: s, x: 10, y: 5 }
          edges:
            - { from: z, to: a, w: 2, x: 1 }
            - { from: z, to: b, w: 2, x: 1 }
            - { from: z, to: c, w: 1, x: 1 }
            - { from: a, to: d, w: 1, x: 1 }
            - { from: a, to: e, w: 2, x: 0 }
            - { from: b, to: d, w: 1, x: 1 }
            - { from: b, to: e, w: 2, x: 0 }
            - { from: c, to: d, w: 2, x: 0 }
            - { from: c, to: e, w: 1, x: 1 }
            - { from: d, to: s, w: 4, x: 2 }
            - { from: e, to: s, w: 1, x: 1 }
        steps:
          - caption: |
              Tok velikosti 3 (u hran $x/r$). Hrany $(z,c)$, $(a,d)$, $(b,d)$, $(e,s)$ jsou nasycené, takže žádná
              **orientovaná** cesta ze $z$ do $s$ s volnou kapacitou neexistuje. Tok přesto maximální není.
          - caption: |
              Polocesta $z, b, e, c, d, s$: souhlasné hrany červeně, nesouhlasná $(c,e)$ modře. U hran je
              „↑ kolik lze přidat“ ($r - x$), resp. „↓ kolik lze ubrat“ ($x$). $\Theta = \min\{1, 2, 1, 2, 2\} = 1 > 0$ –
              polocesta je **rezervní**.
            edges: { z-b: path, b-e: path, c-e: back, c-d: path, d-s: path }
            edge_labels: { z-b: "1/2 ↑1", b-e: "0/2 ↑2", c-e: "1/1 ↓1", c-d: "0/2 ↑2", d-s: "2/4 ↑2" }
          - caption: |
              Polocesta $z, a, d, s$ (obyčejná cesta) obsahuje **souhlasnou nasycenou** hranu $(a,d)$:
              $\Theta = \min\{1, 0, 2\} = 0$, polocesta rezervní **není**.
            edges: { z-a: path, a-d: active, d-s: path }
            edge_labels: { z-a: "1/2 ↑1", a-d: "1/1 ↑0", d-s: "2/4 ↑2" }
          - caption: |
              Polocesta $z, b, e, a$ (do uzlu $a$) prochází hranu $(a,e)$ proti směru, ale po ní nic neteče –
              **nesouhlasná nulová** hrana. Ubrat z ní nelze, $\Theta = 0$.
            edges: { z-b: path, b-e: path, a-e: active }
            edge_labels: { z-b: "1/2 ↑1", b-e: "0/2 ↑2", a-e: "0/2 ↓0" }
