  - id: prop-rezervni-polocesta
    kind: proposition
    label: "Tvrzení 2.3"
    section: "2.3"
    title: Rezervní polocesta zvětší tok
    terms: [tvrzení 2.3, zlepšení toku, augmentace, úprava toku podél polocesty]
    statement: |
      Nechť $\vec{G}$ je síť s jedním zdrojem $z$ a jedním stokem $s$ a $x$ tok v $\vec{G}$.
      Existuje-li v $\vec{G}$ rezervní polocesta ze $z$ do $s$ vzhledem k $x$, pak tok $x$ není maximální.
    intuition: |
      Podél rezervní polocesty „protlačíme“ dalších $\Theta$ jednotek: na souhlasných hranách
      přidáme, na nesouhlasných ubereme. V každém vnitřním uzlu se přítok a odtok změní
      o stejnou hodnotu, takže zákon zachování zůstane v platnosti; jen ze zdroje odteče o
      $\Theta$ víc.
    proof: |
      Nechť $P: z = v_0, h_1, v_1, \dots, h_k, v_k = s$ je rezervní polocesta s rezervou
      $\Theta = \Theta(P) > 0$. Definujme
      $$
      x'_{ij} = \begin{cases}
        x_{ij} + \Theta & \text{je-li } (i,j) \text{ souhlasná hrana } P,\\
        x_{ij} - \Theta & \text{je-li } (i,j) \text{ nesouhlasná hrana } P,\\
        x_{ij} & \text{jinak.}
      \end{cases}
      $$
      *Propustnosti:* na souhlasné hraně je $\Theta \le r_{ij} - x_{ij}$, tedy $x'_{ij} \le r_{ij}$;
      na nesouhlasné je $\Theta \le x_{ij}$, tedy $x'_{ij} \ge 0$.

      *Zákon zachování ve vnitřním uzlu* $v_i$ ($0 < i < k$): uzel leží na dvou hranách
      $h_i$, $h_{i+1}$ polocesty (uzly polocesty jsou různé, jiné hrany $P$ se ho netýkají).
      Rozebereme veličinu (odtok $-$ přítok):
      * obě hrany souhlasné: přítok $+\Theta$ (po $h_i$), odtok $+\Theta$ (po $h_{i+1}$) – beze změny;
      * $h_i$ souhlasná, $h_{i+1}$ nesouhlasná: obě hrany vcházejí do $v_i$, jedna $+\Theta$, druhá $-\Theta$;
      * $h_i$ nesouhlasná, $h_{i+1}$ souhlasná: obě vycházejí z $v_i$, jedna $-\Theta$, druhá $+\Theta$;
      * obě nesouhlasné: odtok $-\Theta$ (po $h_i$), přítok $-\Theta$ (po $h_{i+1}$) – beze změny.

      *Zdroj:* týká se ho jen hrana $h_1$; je-li souhlasná, odtok vzroste o $\Theta$, je-li
      nesouhlasná, přítok klesne o $\Theta$ – v obou případech (odtok $-$ přítok) vzroste o $\Theta$.
      Symetricky u stoku klesne o $\Theta$. Tedy $x'$ je tok velikosti $|x'| = |x| + \Theta > |x|$
      a $x$ není maximální.
    proof_steps:
      - Vezmeme rezervní polocestu ze $z$ do $s$ s rezervou $\Theta > 0$.
      - Na souhlasných hranách přičteme $\Theta$, na nesouhlasných odečteme $\Theta$, ostatní hrany necháme.
      - Díky definici rezervy zůstane $0 \le x'_{ij} \le r_{ij}$ na všech hranách.
      - Ve vnitřních uzlech polocesty se rozdíl odtoku a přítoku nezmění (čtyři případy podle orientace dvou sousedních hran).
      - Rozdíl odtoku a přítoku ve zdroji vzroste o $\Theta$, proto $x'$ je tok velikosti $|x| + \Theta$ a $x$ nebyl maximální.
    related: [def-rezervni-polocesta, thm-ford-fulkerson, alg-ford-fulkerson, cor-charakterizace-max-toku]
    illustrations:
      - title: Úprava podél polocesty zachová zákon zachování
        for: proof
        graph:
          directed: true
          nodes:
            - { id: z, x: 0, y: 5 }
            - { id: a, x: 3, y: 2 }
            - { id: b, x: 3, y: 5 }
            - { id: c, x: 3, y: 8 }
            - { id: d, x: 7, y: 3 }
            - { id: e, x: 7, y: 7 }
            - { id: s, x: 10, y: 5 }
          edges:
            - { from: z, to: a, w: 2, x: 1 }
            - { from: z, to: b, w: 2, x: 1 }
            - { from: z, to: c, w: 1, x: 1 }
            - { from: a, to: d, w: 1, x: 1 }
            - { from: a, to: e, w: 2, x: 0 }
            - { from: b, to: d, w: 1, x: 1 }
            - { from: b, to: e, w: 2, x: 0 }
            - { from: c, to: d, w: 2, x: 0 }
            - { from: c, to: e, w: 1, x: 1 }
            - { from: d, to: s, w: 4, x: 2 }
            - { from: e, to: s, w: 1, x: 1 }
        steps:
          - caption: |
              Tok velikosti $3$ a rezervní polocesta $z, b, e, c, d, s$ s rezervou $\Theta = 1$ (souhlasné hrany červeně,
              nesouhlasná $(c,e)$ modře).
            edges: { z-b: path, b-e: path, c-e: back, c-d: path, d-s: path }
            labels: { z: "|x| = 3" }
          - caption: |
              Na souhlasných hranách přičteme $\Theta = 1$, na nesouhlasné odečteme. Díky volbě $\Theta$ zůstane
              $0 \le x_{ij} \le r_{ij}$: přidáváme nejvýš volnou kapacitu, ubíráme nejvýš to, co teče.
            edges: { z-b: path, b-e: path, c-e: back, c-d: path, d-s: path }
            edge_labels: { z-b: "2/2", b-e: "1/2", c-e: "0/1", c-d: "1/2", d-s: "3/4" }
          - caption: |
              Uzel $e$: obě hrany polocesty do něj **vcházejí** – po $(b,e)$ přiteče o $1$ víc, po $(c,e)$ o $1$ méně.
              Přítok se nezmění, bilance zůstane $0$. (U $b$ a $d$ jsou obě hrany souhlasné: přítok i odtok $+1$.)
            nodes: { e: active }
            edges: { b-e: path, c-e: back }
            edge_labels: { z-b: "2/2", b-e: "1/2", c-e: "0/1", c-d: "1/2", d-s: "3/4" }
            labels: { e: "přítok +1 −1" }
          - caption: |
              Uzel $c$: obě hrany z něj **vycházejí** – po $(c,e)$ odteče o $1$ méně, po $(c,d)$ o $1$ víc. Odtok se
              nezmění. Zákon zachování tedy platí ve všech vnitřních uzlech polocesty.
            nodes: { c: active }
            edges: { c-e: back, c-d: path }
            edge_labels: { z-b: "2/2", b-e: "1/2", c-e: "0/1", c-d: "1/2", d-s: "3/4" }
            labels: { c: "odtok −1 +1" }
          - caption: |
              Jen ve zdroji vzroste odtok o $\Theta$ (a ve stoku přítok). Nový tok má velikost $|x| + \Theta = 4$, původní
              tok tedy maximální nebyl.
            nodes: { z: source, s: sink }
