  - id: prop-konecnost-ff
    kind: proposition
    label: "Tvrzení 2.4"
    section: "2.4"
    title: Konečnost F–F algoritmu pro celočíselné propustnosti
    terms: [tvrzení 2.4, konečnost Ford–Fulkersonova algoritmu, celočíselné propustnosti, celočíselný tok, integralita toku]
    statement: |
      Jsou-li v síti $\vec{G}$ propustnosti všech hran celá čísla, pak Ford–Fulkersonův algoritmus
      skončí po konečném počtu kroků.
    intuition: |
      Celá čísla se nemohou zvětšovat „donekonečna po malých kouscích“: každý krok přidá aspoň
      jedničku a strop je dán propustností libovolného řezu.

      Důležitý vedlejší důsledek (**integralita**): v síti s celočíselnými propustnostmi existuje
      maximální tok, který je celočíselný na každé hraně – algoritmus ho najde. Toho se využívá
      např. při hledání [největšího párování](#alg-parovani-max-tok).
    proof: |
      Indukcí podle počtu kroků ukážeme, že tok je po každém kroku na všech hranách celočíselný.
      Výchozí nulový tok celočíselný je. Je-li celočíselný tok $x$, jsou všechna čísla
      $r_{ij} - x_{ij}$ a $x_{ij}$ celá, a tedy i rezerva $\Theta$ (minimum z nich) je celé
      kladné číslo, tj. $\Theta \ge 1$. Po úpravě o $\pm\Theta$ je tok opět celočíselný.

      Velikost toku tak v každém kroku vzroste o $\Theta \ge 1$. Přitom je podle
      [tvrzení 2.2](#prop-tok-a-rez) shora omezena propustností libovolného řezu oddělujícího
      $z$ a $s$, např. $r(\{z\},\overline{\{z\}})$ (součet propustností hran vycházejících ze zdroje),
      tedy i propustností minimálního řezu. Počet kroků je proto nejvýše tato propustnost –
      konečné číslo.
    proof_steps:
      - Výchozí nulový tok je celočíselný.
      - Je-li tok celočíselný, je rezerva $\Theta$ minimem celých kladných čísel, tedy $\Theta \ge 1$, a upravený tok je opět celočíselný.
      - Každý krok tedy zvětší velikost toku alespoň o 1.
      - Velikost toku je shora omezena propustností libovolného řezu oddělujícího $z$ a $s$ (tvrzení 2.2).
      - Počet kroků je proto nejvýše propustnost minimálního řezu – algoritmus je konečný.
    related: [alg-ford-fulkerson, rem-ff-zavislost-na-propustnostech, prop-tok-a-rez]
    source: "skripta str. 9–10; přednáška 4, fólie 3"

  - id: rem-ff-zavislost-na-propustnostech
    kind: remark
    section: "2.4"
    title: Slabiny F–F algoritmu – iracionální propustnosti a síť s Q
    terms: [patologický případ, síť s Q, 2Q kroků, iracionální propustnosti, racionální propustnosti, pseudopolynomiální algoritmus, nekonečný běh]
    statement: |
      1. Algoritmus je konečný i pro **racionální** propustnosti. Pro obecné reálné propustnosti
         však (poněkud překvapivě) existují sítě, v nichž F–F algoritmus konečný není.
         Proto se omezujeme na sítě s celočíselnými propustnostmi.
      2. Doba běhu závisí nejen na počtu uzlů a hran, ale i na **velikosti propustností**.
         V síti na obrázku je $Q$ velké číslo. Volíme-li nešťastně v každém kroku rezervní polocestu
         přes svislou hranu (propustnost 1) – střídavě $z\,p\,q\,s$ a $z\,q\,p\,s$ (s nesouhlasnou
         hranou $(p,q)$) – vzroste tok vždy jen o 1 a potřebujeme $2Q$ kroků. Přitom dvě polocesty
         $z\,p\,s$ a $z\,q\,s$ by stačily.
    intuition: |
      Racionální případ převedeme na celočíselný: vynásobíme všechny propustnosti společným
      jmenovatelem $D$; běh algoritmu se tím jen přeškáluje a rezerva je vždy alespoň $1/D$.
      U iracionálních propustností mohou rezervy tvořit konvergentní řadu, tok se zvětšuje
      o stále menší kousky a může dokonce konvergovat k hodnotě menší, než je maximum
      (známé příklady konstruované se zlatým řezem – *doplněno mimo skripta*).

      Příklad s $Q$ ukazuje, že počet kroků $2Q$ je exponenciální vzhledem k délce zápisu vstupu
      (číslo $Q$ zapíšeme pomocí $\log_2 Q$ bitů). F–F algoritmus tedy **není polynomiální**;
      nápravu přináší [Edmonds–Karp](#alg-edmonds-karp) – nejkratší polocesta by zde měla jen 2 hrany
      a algoritmus by skončil po 2 krocích.
    examples:
      - title: Síť s Q (zde Q = 100)
        body: |
          Propustnosti: $(z,p)$, $(z,q)$, $(p,s)$, $(q,s)$ mají $Q = 100$, svislá hrana $(p,q)$ má $1$.
          Maximální tok má velikost $2Q = 200$. Při střídání polocest přes svislou hranu
          vzroste tok v každém kroku o 1 – celkem 200 kroků.
        graph:
          directed: true
          nodes:
            - { id: z, x: 0, y: 5 }
            - { id: p, x: 5, y: 2 }
            - { id: q, x: 5, y: 8 }
            - { id: s, x: 10, y: 5 }
          edges:
            - { from: z, to: p, w: 100 }
            - { from: z, to: q, w: 100 }
            - { from: p, to: q, w: 1 }
            - { from: p, to: s, w: 100 }
            - { from: q, to: s, w: 100 }
    related: [alg-ford-fulkerson, prop-konecnost-ff, alg-edmonds-karp]
    illustrations:
      - title: Síť s Q – po jednotkách, nebo najednou
        graph:
          directed: true
          nodes:
            - { id: z, x: 0, y: 5 }
            - { id: p, x: 5, y: 1.5 }
            - { id: q, x: 5, y: 8.5 }
            - { id: s, x: 10, y: 5 }
          edges:
            - { from: z, to: p, w: 100, x: 0 }
            - { from: z, to: q, w: 100, x: 0 }
