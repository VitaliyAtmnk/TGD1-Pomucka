  - id: def-jadro-orientovaneho-grafu
    kind: definition
    label: "Definice 6.12"
    section: "6.2"
    title: Jádro orientovaného grafu
    terms: [jádro orientovaného grafu, kernel of a digraph, absorbující množina, stabilní řešení, von Neumann-Morgenstern]
    statement: |
      Buď $\vec G$ orientovaný graf, $C \subset U(\vec G)$. Množina $C$ se
      nazývá **jádro** grafu $\vec G$, jestliže

      (i) $C$ je nezávislá množina,

      (ii) pro každý $x \in U(\vec G) \setminus C$ existuje $y \in C$ tak, že
      $(x,y) \in H(\vec G)$.
    intuition: |
      Názorně: podmínka (ii) říká, že **z každého uzlu mimo jádro vede hrana
      do jádra** (jádro „pohlcuje" ostatní uzly). Podmínka (i) zakazuje hrany
      uvnitř jádra.

      Důležité důsledky:

      - každý uzel bez výstupních hran (*stok*) musí ležet v jádru – z něj
        do jádra hrana vést nemůže;
      - na směru hran záleží; v symetrickém orientovaném grafu (každá hrana
        oběma směry) splývá pojem s [jádrem neorientovaného grafu](#def-jadro-neorientovaneho-grafu),
        a proto symetrická orientace jádro vždy má;
      - jádro nemusí existovat ([lichý cyklus](#prop-lichy-cyklus-nema-jadro))
        a nemusí být jediné.

      Motivace pochází z teorie her – viz [poznámku o hrách](#rem-jadro-a-teorie-her).
    related: [def-nezavisla-mnozina-orientovaneho-grafu, prop-lichy-cyklus-nema-jadro, thm-6-8-acyklicky-graf-ma-jadro, thm-6-9-graf-bez-lichych-cyklu-ma-jadro, rem-kdy-ma-graf-jadro]
    illustrations:
      - title: Z každého uzlu mimo jádro vede hrana do jádra
        for: statement
        property: kernel
        graph:
          directed: true
          nodes:
            - { id: Z, x: 1, y: 5 }
            - { id: c, x: 3, y: 8 }
            - { id: b, x: 3, y: 2 }
            - { id: a, x: 5, y: 5 }
            - { id: d, x: 7, y: 5 }
            - { id: K, x: 9.5, y: 5 }
          edges:
            - { from: Z, to: b }
            - { from: b, to: a }
            - { from: b, to: d }
            - { from: a, to: c }
            - { from: a, to: d }
            - { from: c, to: d }
            - { from: c, to: Z }
            - { from: d, to: K }
        steps:
          - caption: |
              Z uzlu $K$ žádná hrana nevede (stok), takže ho nic jiného „pohltit“ nemůže – v jádru být **musí**. Samo $\{K\}$ ale nestačí: hrana do $K$ vede jen z $d$.
            set: [K]
          - caption: |
              $\{b, c, K\}$ je jádro: mezi jeho uzly nevede hrana a z $Z$, $a$, $d$ vede hrana do jádra ($Z \to b$, $a \to c$, $d \to K$).
            set: [b, c, K]
          - caption: |
              Jádro nemusí být jediné: $\{Z, a, K\}$ je také nezávislé a absorbující ($b \to a$, $c \to Z$, $d \to K$).
            set: [Z, a, K]
          - caption: |
              Na směru záleží. $\{d, Z\}$ je nezávislá a v symetrizaci by dominovala, ale ze stoku $K$ hrana do $\{d, Z\}$ nevede – jádrem **není**.
            set: [d, Z]
    source: "skripta str. 42, Definice 6.12 (folie TGD1-08 s. 5 píší $y\\in U(C)$, správně $y\\in C$)"
    supplemented: false

  - id: prop-lichy-cyklus-nema-jadro
    kind: proposition
    label: "Příklad (skripta str. 42)"
    section: "6.2"
    title: Cyklus liché délky nemá jádro
    terms: [lichý cyklus nemá jádro, graf bez jádra, odd cycle no kernel, sudý cyklus jádro]
    statement: |
      Je-li $\vec G$ (orientovaný) cyklus liché délky, pak $\vec G$ nemá jádro.
      Cyklus sudé délky má právě dvě jádra.
    intuition: |
      V cyklu má každý uzel jediného následníka. Je-li uzel v jádru, jeho
      následník tam být nesmí (nezávislost); není-li uzel v jádru, jeho
      (jediný) následník tam být musí (absorpce). Příslušnost k jádru se tedy
      po cyklu musí pravidelně střídat – a to na liché kružnici nejde,
      „poslední uzel nelze zahrnout do jádra ani nechat mimo".
    proof: |
      Nechť $\vec G$ je cyklus $u_1\to u_2\to\dots\to u_{2k+1}\to u_1$ a nechť
      $C$ je jeho jádro. $C\neq\emptyset$, jinak by podmínka (ii) neplatila
      pro žádný uzel. Díky symetrii cyklu můžeme předpokládat $u_1\in C$.

      Každý uzel $u_i$ má jediného následníka $u_{i+1}$ (indexy modulo $2k+1$).
      Proto:

      - je-li $u_i\in C$, pak $u_{i+1}\notin C$ (hrana $(u_i,u_{i+1})$ a nezávislost),
      - je-li $u_i\notin C$, pak $u_{i+1}\in C$ (z $u_i$ musí vést hrana do $C$
        a jiná hrana z $u_i$ nevede).

      Indukcí odtud $u_i\in C$ právě pro lichá $i$, takže $u_{2k+1}\in C$.
      Pak ale hrana $(u_{2k+1},u_1)$ spojuje dva uzly jádra – spor
      s nezávislostí. Lichý cyklus tedy jádro nemá.

      Pro cyklus sudé délky $2k$ dává stejná úvaha jedinou možnost pro každou
      volbu „$u_1\in C$" či „$u_1\notin C$": jádry jsou právě množina uzlů
      s lichými indexy a množina uzlů se sudými indexy. $\square$
    proof_steps:
      - 'Jádro C lichého cyklu u_1 → … → u_{2k+1} → u_1 je neprázdné; ze symetrie nechť u_1 ∈ C.'
      - 'Každý uzel má jediného následníka: je-li u_i v C, následník v C být nesmí (nezávislost).'
      - 'Není-li u_i v C, jeho jediný následník v C být musí (absorpce).'
      - 'Indukcí leží v C právě uzly s lichým indexem, tedy i u_{2k+1}.'
      - 'Hrana (u_{2k+1}, u_1) pak spojuje dva uzly jádra, což je spor.'
    examples:
      - title: Orientovaný cyklus délky 5
        body: |
          Zkusíme-li $C\ni u_1$, vynutí se $u_2\notin C$, $u_3\in C$,
          $u_4\notin C$, $u_5\in C$ – ale $(u_5,u_1)$ je hrana mezi uzly jádra.
          Jádro neexistuje.
        graph:
          directed: true
          nodes:
            - { id: u1, x: 5, y: 9.5 }
            - { id: u2, x: 9, y: 6.5 }
            - { id: u3, x: 7.5, y: 1.5 }
            - { id: u4, x: 2.5, y: 1.5 }
            - { id: u5, x: 1, y: 6.5 }
          edges:
            - { from: u1, to: u2 }
            - { from: u2, to: u3 }
            - { from: u3, to: u4 }
            - { from: u4, to: u5 }
            - { from: u5, to: u1 }
    related: [def-jadro-orientovaneho-grafu, thm-6-9-graf-bez-lichych-cyklu-ma-jadro, rem-kdy-ma-graf-jadro]
    illustrations:
      - title: Na cyklu délky 5 každý pokus selže
        for: proof
        property: kernel
        graph:
          directed: true
          nodes:
            - { id: u1, x: 5, y: 9.5 }
            - { id: u2, x: 9, y: 6.5 }
            - { id: u3, x: 7.5, y: 1.5 }
            - { id: u4, x: 2.5, y: 1.5 }
            - { id: u5, x: 1, y: 6.5 }
          edges:
            - { from: u1, to: u2 }
            - { from: u2, to: u3 }
            - { from: u3, to: u4 }
            - { from: u4, to: u5 }
            - { from: u5, to: u1 }
        steps:
          - caption: |
              Jádro $C$ by bylo neprázdné; ze symetrie nechť $u_1 \in C$. Samo $\{u_1\}$ nestačí – např. z $u_2$ vede jediná hrana, a to do $u_3 \notin C$.
            set: [u1]
          - caption: |
              $u_2 \notin C$ (hrana $u_1 \to u_2$, nezávislost), takže jeho jediný následník $u_3$ v $C$ být **musí**. Pak $u_4 \notin C$ – a $u_4$ zatím nemá hranu do $C$.
            set: [u1, u3]
          - caption: |
              Absorpce $u_4$ vynutí $u_5 \in C$. Jenže hrana $u_5 \to u_1$ teď spojuje dva uzly $C$ – spor s nezávislostí.
            set: [u1, u3, u5]
          - caption: |
              Bez $u_1$ to nejde také: $\{u_2, u_4\}$ je nezávislá, ale $u_5$ nemá hranu do množiny. Střídání „v jádru / mimo“ se na liché délce nikdy nezavře.
            set: [u2, u4]
          - caption: |
              Odstraníme hranu $u_5 \to u_1$: z cyklu je cesta, $\{u_1, u_3, u_5\}$ už je jádro. Chyba byla opravdu jen v uzavření liché kružnice.
            remove: [[u5, u1]]
            set: [u1, u3, u5]
    source: "skripta str. 42, příklad za Definicí 6.12 (důkaz rozepsán)"
    supplemented: false

  - id: rem-jadro-a-teorie-her
    kind: remark
    section: "6.2"
    title: Jádro a teorie her
    terms: [teorie her, hra se zápalkami, strategie, vyhrávající strategie, graf hry, Nim, kernel game theory]
    statement: |
      Pozicím hry dvou hráčů přiřadíme uzly orientovaného grafu, možným tahům
      hrany. Má-li graf hry jádro, pak hráč, který jako první táhne do jádra,
      má strategii, která zaručuje, že neprohraje: po každém tahu soupeře
      (který z jádra musí vést mimo jádro – vlastnost (i)) může opět táhnout
      do jádra (vlastnost (ii)). Koncové pozice (bez tahů) leží v jádru,
      takže soupeř nikdy nedosáhne koncové pozice jako první. Může ovšem dojít
      k remíze – nekonečnému pohybu v cyklu.
    intuition: |
      Jádro = množina „dobrých" pozic, do kterých chci táhnout. Ze žádné dobré
      pozice nelze táhnout do jiné dobré (soupeř je tedy vždy ve špatné
      pozici) a z každé špatné pozice se lze do dobré vrátit.
    examples:
      - title: Deset zápalek
        body: |
          Na hromádce je 10 zápalek, hráči střídavě berou jednu nebo dvě;
          vyhrává ten, kdo vezme poslední. Uzel $i$ = počet zbylých zápalek,
          hrany $i\to i-1$ a $i\to i-2$. Jádrem je $\{0,3,6,9\}$ (násobky 3):
          žádné dva nejsou spojeny tahem a z každé jiné pozice lze táhnout na
          násobek tří. Začínající hráč vezme jednu zápalku (na 9) a dále vždy
          doplní soupeřův tah na 3 – vyhraje.
