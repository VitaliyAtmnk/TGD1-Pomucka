  - id: alg-jadro-acyklickeho-grafu
    kind: algorithm
    section: "6.2"
    title: Nalezení jádra acyklického grafu (Grundyho funkce)
    terms: [algoritmus jádro acyklického grafu, výpočet Grundyho funkce, kernel DAG algorithm, topologické uspořádání]
    statement: |
      Vstup: acyklický orientovaný graf $\vec G$. Výstup: jeho (jediné) jádro $C$.
    pseudocode: |
      1. Najdi topologické očíslování $u_1,\dots,u_n$ (každá hrana vede
         z menšího indexu do většího), např. postupným odebíráním uzlů bez
         vstupních hran nebo pomocí DFS.
      2. Pro $i = n, n-1, \dots, 1$:
         - označ hodnoty $f(v)$ všech následníků $v$ uzlu $u_i$
           (pomocné pole příznaků velikosti $\deg^+(u_i)+1$),
         - $f(u_i) :=$ nejmenší neoznačené číslo $k\in\{0,1,\dots\}$.
      3. Vrať $C := \{u_i;\ f(u_i)=0\}$.

      *Zjednodušená varianta (stačí pro jádro):* procházej uzly v pořadí
      $u_n,\dots,u_1$ a dej $u_i$ do $C$, právě když žádný jeho následník
      v $C$ není.
    complexity: "$O(n+m)$"
    intuition: |
      Topologické uspořádání trvá $O(n+m)$. Výpočet $f(u_i)$ stojí
      $O(\deg^+(u_i)+1)$ – hodnota $f(u_i)$ je nejvýše $\deg^+(u_i)$, takže
      stačí pole příznaků této velikosti. Součet přes všechny uzly je $O(n+m)$.

      Korektnost plyne z [Věty 6.8](#thm-6-8-acyklicky-graf-ma-jadro).
      Zjednodušená varianta počítá přesně indikátor „$f(u_i)=0$".
    examples:
      - title: Grundyho funkce na grafu se 7 uzly
        body: |
          Uzly jsou očíslovány topologicky $1,\dots,7$, hrany:
          $1\to2$, $1\to3$, $1\to7$, $2\to3$, $2\to5$, $2\to7$, $3\to4$,
          $4\to5$, $4\to6$, $5\to6$, $5\to7$, $6\to7$.

          | uzel | následníci (hodnoty) | $f$ |
          |---|---|---|
          | 7 | – | 0 |
          | 6 | 7 (0) | 1 |
          | 5 | 6 (1), 7 (0) | 2 |
          | 4 | 5 (2), 6 (1) | 0 |
          | 3 | 4 (0) | 1 |
          | 2 | 3 (1), 5 (2), 7 (0) | 3 |
          | 1 | 2 (3), 3 (1), 7 (0) | 2 |

          Jádro $C=\{4,7\}$: mezi 4 a 7 hrana nevede a z uzlů $1,2,3,5,6$ vede
          hrana do 4 nebo 7. (Atribut `grundy` udává hodnotu $f$.)
        graph:
          directed: true
          nodes:
            - { id: "1", x: 1, y: 1, grundy: 2 }
            - { id: "2", x: 4, y: 3, grundy: 3 }
            - { id: "3", x: 2.5, y: 5.5, grundy: 1 }
            - { id: "4", x: 4, y: 8, grundy: 0, color: 1 }
            - { id: "5", x: 6, y: 5.5, grundy: 2 }
            - { id: "6", x: 9, y: 8, grundy: 1 }
            - { id: "7", x: 9.5, y: 1, grundy: 0, color: 1 }
          edges:
            - { from: "1", to: "2" }
            - { from: "1", to: "3" }
            - { from: "1", to: "7" }
            - { from: "2", to: "3" }
            - { from: "2", to: "5" }
            - { from: "2", to: "7" }
            - { from: "3", to: "4" }
            - { from: "4", to: "5" }
            - { from: "4", to: "6" }
            - { from: "5", to: "6" }
            - { from: "5", to: "7" }
            - { from: "6", to: "7" }
    visualization: kernel
    related: [thm-6-8-acyklicky-graf-ma-jadro, def-grundyho-funkce, def-acyklicky-graf]
    source: "skripta str. 43–44 (důkaz Věty 6.8, příklad, poznámka „myšlenky důkazů dávají algoritmy“); pseudokód a složitost doplněny"
    supplemented: false

  - id: thm-6-9-graf-bez-lichych-cyklu-ma-jadro
    kind: theorem
    label: "Věta 6.9"
    section: "6.2"
    title: Graf bez cyklů liché délky má jádro
    terms: [jádro grafu bez lichých cyklů, Richardsonova věta, orientovaný graf bez lichých cyklů, kernel no odd cycles]
    statement: |
      Každý orientovaný graf bez cyklů liché délky má jádro.
    intuition: |
      Zobecnění [Věty 6.8](#thm-6-8-acyklicky-graf-ma-jadro) (acyklický graf
      nemá žádné cykly, tím méně liché). Uvnitř silně souvislé části bez
      lichých cyklů má každý uzel jednoznačnou „paritu vzdálenosti" k pevně
      zvolenému uzlu $x$ – sudé uzly tvoří jádro této části (střídání jako
      na sudé kružnici). Části pak zpracováváme od „konce" kondenzace, tj. od
      výstupních kvazikomponent, podobně jako u acyklických grafů.
      Překážka z [lichého cyklu](#prop-lichy-cyklus-nema-jadro) je tedy
      v jistém smyslu jediná, kterou tato metoda musí obejít.
    proof: |
      Ve skriptech je uvedena jen myšlenka (postup); zde ji doplníme
      o zdůvodnění.

      **Lemma (parita).** Nechť $\vec D$ je silně souvislý graf bez lichých
      cyklů a $x\in U(\vec D)$. Pak pro každý uzel $y$ mají všechny sledy
      z $y$ do $x$ stejnou paritu délky.

      *Důkaz lemmatu.* Uzavřený sled liché délky obsahuje cyklus liché délky
      (není-li sám cyklem, opakuje se v něm uzel a rozpadne se na dva kratší
      uzavřené sledy, z nichž jeden má lichou délku; indukce). Kdyby z $y$
      do $x$ vedl sled sudé délky $W_1$ i liché délky $W_2$, zvolíme sled $Q$
      z $x$ do $y$ (silná souvislost); uzavřené sledy $W_1Q$ a $W_2Q$ mají
      délky různé parity, jeden je lichý a obsahuje lichý cyklus – spor.

      **Krok 1.** Nechť $\vec G_0$ je výstupní
      [kvazikomponenta](#def-kvazikomponenta) grafu $\vec G$ (odpovídá
      výstupnímu uzlu kondenzace, tj. **z ní nevede žádná hrana ven**).
      Zvolme $x\in U(\vec G_0)$ a položme
      $$
      S_0=\{y\in U(\vec G_0);\ z\ y\ \text{do}\ x\ \text{existuje orientovaný sled sudé délky}\}
      $$
      (sled nulové délky je sudý, tedy $x\in S_0$). $S_0$ je jádro $\vec G_0$:

      - *nezávislost:* kdyby $(y,z)\in H$ pro $y,z\in S_0$, pak hrana $(y,z)$
        následovaná sudým sledem ze $z$ do $x$ je lichý sled z $y$ do $x$, ale
        z $y$ vede i sudý sled – spor s lemmatem (smyčka $y=z$ by byla lichý
        cyklus délky 1);
      - *absorpce:* pro $y\in U(\vec G_0)\setminus S_0$ existuje (silná
        souvislost) sled z $y$ do $x$; ten je lichý, tedy má délku $\ge1$.
        Jeho první hrana $(y,z)$ vede do uzlu $z$, ze kterého zbytek sledu má
        sudou délku, tj. $z\in S_0$.

      **Krok 2.** Označme $R_0=S_0\cup\{y\in U(\vec G);\ \exists z\in S_0:\ (y,z)\in H(\vec G)\}$
      (jádro $S_0$ a všichni jeho předchůdci). Podle kroku 1 je
      $U(\vec G_0)\subset R_0$. Graf $\vec G_1=\vec G-R_0$ nemá liché cykly
      (je podgrafem $\vec G$), takže (indukcí podle počtu uzlů) má jádro $S'$
      (pro prázdný graf $S'=\emptyset$).

      **Krok 3.** $S=S_0\cup S'$ je jádro $\vec G$:

      - *nezávislost:* hrana $(t,s)$ s $t\in S'$, $s\in S_0$ by z $t$ dělala
        předchůdce $S_0$, tedy $t\in R_0$ – ale $t\in U(\vec G_1)$. Hrana
        $(s,t)$ by vedla z $\vec G_0$ ven, což u výstupní kvazikomponenty
        nenastává;
      - *absorpce:* uzel z $R_0\setminus S_0$ má hranu do $S_0$ z definice
        $R_0$; uzel z $U(\vec G_1)\setminus S'$ má hranu do $S'$, protože $S'$
        je jádro $\vec G_1$.

      Rozvinutím indukce dostáváme postup ze skript: opakujeme krok 1 pro
      $\vec G_1,\vec G_2,\dots$ a skončí-li postup po $k$ krocích, je jádrem
      $S=S_0\cup S_1\cup\dots\cup S_k$. $\square$
    proof_steps:
      - 'Lemma: v silně souvislém grafu bez lichých cyklů mají všechny sledy z y do x stejnou paritu (jinak by vznikl lichý uzavřený sled, a tedy lichý cyklus).'
      - 'Zvolíme výstupní kvazikomponentu G_0 (nevede z ní hrana ven), uzel x v ní a S_0 = uzly G_0 se sudým sledem do x.'
      - 'S_0 je nezávislá: hrana uvnitř S_0 by dala z jednoho uzlu sudý i lichý sled do x.'
      - 'S_0 pohlcuje G_0: z uzlu mimo S_0 vede lichý sled do x a jeho první hrana končí v S_0.'
      - 'Odstraníme S_0 i všechny předchůdce S_0 (tím celou G_0); zbylý graf G_1 nemá liché cykly a indukcí má jádro S''.'
      - 'S_0 ∪ S'' je nezávislá: hrana do S_0 by vedla z odstraněného předchůdce a z G_0 ven žádná hrana nevede.'
      - 'S_0 ∪ S'' je absorbující: odstranění předchůdci mají hranu do S_0, ostatní uzly hranu do S''; jde tedy o jádro.'
    related: [alg-jadro-grafu-bez-lichych-cyklu, thm-6-8-acyklicky-graf-ma-jadro, prop-lichy-cyklus-nema-jadro, def-kvazikomponenta]
    source: "skripta str. 43, Věta 6.9 s myšlenkou důkazu (zdůvodnění doplněno); folie TGD1-08 s. 5"
    supplemented: false

  - id: alg-jadro-grafu-bez-lichych-cyklu
    kind: algorithm
    section: "6.2"
    title: Nalezení jádra grafu bez lichých cyklů
    terms: [algoritmus jádro bez lichých cyklů, kvazikomponenty, kondenzace, výstupní kvazikomponenta, kernel algorithm]
    statement: |
      Vstup: orientovaný graf $\vec G$ bez cyklů liché délky.
      Výstup: jádro $S$ grafu $\vec G$.
    pseudocode: |
      1. $S := \emptyset$.
      2. Dokud $\vec G$ není prázdný:
         1. Najdi kvazikomponenty a kondenzaci $\vec G$; vyber výstupní
            kvazikomponentu $\vec G_0$ (výstupní uzel kondenzace).
         2. Zvol $x\in U(\vec G_0)$ a prohledáváním do šířky po **obrácených**
            hranách uvnitř $\vec G_0$ spočti vzdálenosti $d(y,x)$;
            polož $S_0 := \{y\in U(\vec G_0);\ d(y,x)\ \text{je sudé}\}$.
         3. $S := S\cup S_0$.
         4. Odstraň z $\vec G$ všechny uzly $S_0$ a všechny uzly $y$, z nichž
            vede hrana do $S_0$.
      3. Vrať $S$.
    complexity: "$O(n\\cdot(n+m))$ – nejvýše $n$ iterací, každá v čase $O(n+m)$"
    intuition: |
      Krok 2.2: díky lemmatu o paritě z důkazu
      [Věty 6.9](#thm-6-9-graf-bez-lichych-cyklu-ma-jadro) mají všechny sledy
      z $y$ do $x$ stejnou paritu, takže stačí parita *nejkratší* vzdálenosti,
      kterou spočítá BFS po obrácených hranách.

      Složitost: kvazikomponenty (např. Tarjanův algoritmus nebo dvojí DFS)
      i BFS trvají $O(n+m)$. V každé iteraci odstraníme aspoň uzel $x$, takže
      iterací je nejvýše $n$; celkem $O(n(n+m))$, tedy polynomiálně.

      Pro acyklický graf je každá kvazikomponenta jednouzlová a algoritmus
      přejde ve zjednodušenou variantu
      [algoritmu pro acyklické grafy](#alg-jadro-acyklickeho-grafu).
    examples:
      - title: Sudý cyklus s přívěsky
        body: |
          Hrany: $a\to b\to c\to d\to a$ (cyklus délky 4), $e\to a$, $f\to e$,
          $g\to f$, $g\to b$.

          *Iterace 1:* výstupní kvazikomponenta je $\{a,b,c,d\}$ (z ní nevede
          hrana ven). Zvolíme $x=a$: $d(a,a)=0$, $d(d,a)=1$, $d(c,a)=2$,
          $d(b,a)=3$, tedy $S_0=\{a,c\}$. Odstraníme $a,c$ a jejich předchůdce
          $d,e$ (do $a$) a $b$ (do $c$); $g$ odstraněno není ($g\to b$, ale
          $b\notin S_0$).

          *Iterace 2:* zbývá $f$, $g$ s hranou $g\to f$. Výstupní kvazikomponenta
          je $\{f\}$, $S_1=\{f\}$; odstraníme $f$ a jeho předchůdce $g$.

          Jádro $S=\{a,c,f\}$: je nezávislé a $b\to c$, $d\to a$, $e\to a$,
          $g\to f$.
        graph:
          directed: true
          nodes:
            - { id: a, x: 5, y: 8, color: 1 }
            - { id: b, x: 8, y: 5 }
            - { id: c, x: 5, y: 2, color: 1 }
            - { id: d, x: 2, y: 5 }
            - { id: e, x: 1, y: 9 }
            - { id: f, x: 0, y: 6, color: 1 }
            - { id: g, x: 5, y: 0 }
          edges:
            - { from: a, to: b }
            - { from: b, to: c }
            - { from: c, to: d }
            - { from: d, to: a }
            - { from: e, to: a }
            - { from: f, to: e }
            - { from: g, to: f }
            - { from: g, to: b }
    visualization: kernel
    related: [thm-6-9-graf-bez-lichych-cyklu-ma-jadro, alg-jadro-acyklickeho-grafu, def-kvazikomponenta]
    source: "skripta str. 43–44 (postup z důkazu Věty 6.9 a poznámka o algoritmech); BFS-implementace a složitost doplněny"
    supplemented: false

  - id: rem-kdy-ma-graf-jadro
    kind: remark
    section: "6.2"
    title: Kdy má orientovaný graf jádro?
    terms: [existence jádra, charakterizace grafů s jádrem, jádro NP-úplné, symetrická orientace, kernel existence NP-complete]
    statement: |
      Lichý cyklus jádro nemá, zatímco každá symetrická orientace
      neorientovaného grafu jádro má. Postačující podmínky dávají Věty 6.8
      (acyklické grafy) a 6.9 (grafy bez lichých cyklů) a myšlenky jejich
      důkazů zároveň poskytují algoritmy pro nalezení jádra v těchto
      speciálních případech.

      **Charakterizační věta orientovaných grafů s jádrem není známa** a otázka
      existence jádra v obecném orientovaném grafu je **NP-úplný** problém.
    intuition: |
      Shrnutí pro zkoušku:

      | graf | jádro | algoritmus |
      |---|---|---|
      | neorientovaný | vždy existuje (max. nezávislá množina) | hladový, $O(n+m)$ |
      | acyklický | vždy, jediné | Grundyho funkce, $O(n+m)$ |
      | bez lichých cyklů | vždy | kvazikomponenty + parita, $O(n(n+m))$ |
      | obecný orientovaný | nemusí existovat | rozhodnutí NP-úplné |

      Pozor: graf, který liché cykly obsahuje, jádro mít může – přidáme-li
      k lichému cyklu nový uzel $s$ a hrany ze všech uzlů cyklu do $s$, je
      $\{s\}$ jádro. Věta 6.9 je tedy jen postačující podmínka.
    related: [def-jadro-orientovaneho-grafu, prop-lichy-cyklus-nema-jadro, thm-6-8-acyklicky-graf-ma-jadro, thm-6-9-graf-bez-lichych-cyklu-ma-jadro]
    source: "skripta str. 43 (Otázka) a str. 44 (poznámka); tabulka shrnutí doplněna"
    supplemented: false

quiz:
  - id: q-nezavislost-01
    question: |
      Které tvrzení o nezávislých množinách je pravdivé?
    options:
      - 'Každá maximální nezávislá množina je největší.'
      - 'Každá největší nezávislá množina je maximální, ale ne naopak.'
      - 'Maximální a největší nezávislá množina jsou synonyma.'
      - 'Největší nezávislá množina nemusí být maximální.'
    correct: 1
    explanation: |
      Největší množinu (s $\alpha(G)$ prvky) nelze rozšířit, je tedy maximální.
      Maximální ale může být i malá – např. $\{m_1,m_3\}$ v trojúhelníkové
      mřížce s $\alpha=4$. Anglicky *maximal* × *maximum*.
    related: [rem-maximalni-vs-nejvetsi]

  - id: q-nezavislost-02
    question: |
      Jakou časovou složitost má hladový algoritmus pro nalezení maximální
      nezávislé množiny (při reprezentaci seznamy sousedů)?
    options:
      - '$O(n+m)$'
      - '$O(2^n)$'
      - '$O(n^3)$'
      - 'Úloha je NP-těžká, polynomiální algoritmus není znám.'
    correct: 0
    explanation: |
      Každý uzel je z množiny kandidátů $Y$ vyřazen jednou a každá hrana se
      projde $O(1)$-krát. NP-těžké je hledání *největší* nezávislé množiny,
      ne maximální.
    related: [alg-maximalni-nezavisla-mnozina, rem-slozitost-nezavisle-mnoziny]

  - id: q-nezavislost-03
    question: |
      Graf $G$ má 12 uzlů a jeho nejmenší uzlové pokrytí má 7 uzlů. Kolik je $\alpha(G)$?
    options:
      - '7'
      - '5'
      - '12'
      - 'Nelze určit bez znalosti hran.'
    correct: 1
    explanation: |
      Podle Důsledku 6.1 je $\alpha(G)+\beta(G)=|U(G)|$, tedy $\alpha(G)=12-7=5$.
      Doplněk nejmenšího pokrytí je největší nezávislá množina.
    related: [cor-6-1-alfa-plus-beta, thm-6-1-nezavisla-doplnek-pokryti]

  - id: q-nezavislost-04
    question: |
      Víme, že doplněk $\bar G$ grafu $G$ obsahuje úplný podgraf $K_5$, ale
      žádný $K_6$. Co z toho plyne?
    options:
      - '$\omega(G)=5$'
      - '$\alpha(G)=5$'
      - '$\gamma(G)=5$'
      - '$\beta(G)=5$'
    correct: 1
    explanation: |
      $\omega(\bar G)=5$ a podle Věty 6.4 je $\alpha(G)=\omega(\bar G)=5$:
      nezávislá množina v $G$ je úplný podgraf v $\bar G$.
    related: [thm-6-4-alfa-omega-doplnku]

  - id: q-nezavislost-05
    question: |
      Které množiny jsou přesně jádry neorientovaného grafu?
    options:
      - 'Největší nezávislé množiny.'
      - 'Nejmenší dominantní množiny.'
      - 'Maximální nezávislé množiny.'
      - 'Minimální dominantní množiny.'
    correct: 2
    explanation: |
      Jádro je nezávislá a dominantní množina; podle Věty 6.5 je nezávislá
      množina dominantní právě když je maximální. Minimální dominantní množina
      nemusí být nezávislá (mřížka $3\times3$), největší nezávislá je jen
      speciální případ.
    related: [def-jadro-neorientovaneho-grafu, thm-6-5-maximalni-nezavisla-je-dominantni]

  - id: q-nezavislost-06
    question: |
      Pro hvězdu $K_{1,n}$ ($n\ge2$) platí:
    options:
      - '$\gamma=1$, $\alpha=n$'
      - '$\gamma=n$, $\alpha=1$'
      - '$\gamma=\alpha=1$'
      - '$\gamma=\alpha=n$'
    correct: 0
    explanation: |
      Střed sám dominuje všem listům ($\gamma=1$), všechny listy tvoří největší
      nezávislou množinu ($\alpha=n$). Ukazuje to, že nerovnost
      $\gamma(G)\le\alpha(G)$ může být libovolně ostrá.
    related: [cor-6-2-gamma-le-alfa]

  - id: q-nezavislost-07
    question: |
      Který z následujících orientovaných grafů **nemá** jádro?
    options:
      - 'Orientovaný cyklus délky 4.'
      - 'Libovolný acyklický graf.'
      - 'Orientovaný cyklus délky 3.'
      - 'Symetrická orientace kružnice $C_5$.'
    correct: 2
    explanation: |
      Na cyklu se příslušnost k jádru musí střídat, což na liché délce nejde.
      Sudý cyklus má dvě jádra, acyklický graf má jádro (Věta 6.8) a symetrická
      orientace se chová jako neorientovaný graf, který jádro má vždy.
    related: [prop-lichy-cyklus-nema-jadro, rem-kdy-ma-graf-jadro]

  - id: q-nezavislost-08
    question: |
      Uzel acyklického grafu má následníky s hodnotami Grundyho funkce
      $\{0, 1, 3, 4\}$. Jaká je jeho hodnota a patří do jádra?
    options:
      - '5, nepatří'
      - '0, patří'
      - '2, nepatří'
      - '2, patří'
    correct: 2
    explanation: |
      Hodnota je nejmenší nezáporné celé číslo, které mezi hodnotami následníků
      chybí (mex), tj. 2. Do jádra patří jen uzly s hodnotou 0; tento uzel má
      následníka s hodnotou 0, tedy hranu do jádra.
    related: [def-grundyho-funkce, thm-6-8-acyklicky-graf-ma-jadro]

  - id: q-nezavislost-09
    question: |
      Jakou složitost má nalezení jádra acyklického grafu pomocí Grundyho funkce?
    options:
      - '$O(n+m)$'
      - '$O(n^2 m)$'
      - '$O(2^n)$'
      - 'Úloha je NP-úplná.'
    correct: 0
    explanation: |
      Topologické uspořádání trvá $O(n+m)$ a hodnotu $f(u)$ spočteme
      v čase $O(\deg^+(u)+1)$ pomocí pole příznaků. NP-úplná je jen otázka
      existence jádra v *obecném* orientovaném grafu.
    related: [alg-jadro-acyklickeho-grafu]

  - id: q-nezavislost-10
    question: |
      Proč musí každý uzel bez výstupních hran (stok) ležet v jádru
      orientovaného grafu?
    options:
      - 'Protože jádro musí být největší nezávislá množina.'
      - 'Protože z uzlu mimo jádro musí vést hrana do jádra, a ze stoku žádná hrana nevede.'
      - 'Protože do stoku vede hrana z každého uzlu jádra.'
      - 'Neplatí to, stok v jádru být nemusí.'
    correct: 1
    explanation: |
      Podmínka (ii) Definice 6.12 vyžaduje pro každý uzel mimo jádro hranu
      *do* jádra. Stok žádnou výstupní hranu nemá, proto mimo jádro být nemůže.
      Proto např. koncové pozice hry leží v jádru.
    related: [def-jadro-orientovaneho-grafu, rem-jadro-a-teorie-her]

  - id: q-nezavislost-11
    question: |
      Graf $K_{k,k+1}$ je $k$-souvislý a není hamiltonovský. Co tento příklad
      ukazuje o Chvátalově–Erdősově větě?
    options:
      - 'Že věta neplatí pro bipartitní grafy.'
      - 'Že předpoklad α(G) ≤ k nelze zeslabit na α(G) ≤ k + 1.'
      - 'Že předpoklad k ≥ 2 je zbytečný.'
      - 'Že k-souvislost implikuje hamiltonovskost.'
    correct: 1
    explanation: |
      $\alpha(K_{k,k+1})=k+1$, tedy o jedna víc, než věta dovoluje, a graf
      hamiltonovský není (nestejně velké partity). Mez $\alpha\le k$ je těsná.
    related: [thm-chvatal-erdos]

  - id: q-nezavislost-12
    question: |
      Které tvrzení o složitosti je správné?
    options:
      - 'Najít minimální dominantní množinu je NP-těžké.'
      - 'Najít maximální kliku je NP-těžké.'
      - 'Rozhodnout, zda existuje nezávislá množina s aspoň k prvky, je NP-úplné.'
      - 'Spočítat β(G) lze v čase O(n + m) pro každý graf.'
    correct: 2
    explanation: |
      Úloha IND je NP-úplná (kap. 9). Maximální kliku a minimální dominantní
      množinu najdeme hladově polynomiálně; $\beta(G)=n-\alpha(G)$ je NP-těžké
      obecně (polynomiální je např. pro bipartitní grafy).
    related: [rem-np-uplnost-nezavislosti, thm-ind-npc]

  - id: q-nezavislost-13
    question: |
      V algoritmu pro jádro grafu bez lichých cyklů volíme v každém kroku
      **výstupní** kvazikomponentu $\vec G_0$. Proč?
    options:
      - 'Protože je vždy nejmenší.'
      - 'Protože z ní nevede žádná hrana ven, takže její jádro S_0 nemůže mít hranu do později vybraných uzlů jádra.'
      - 'Protože jen výstupní kvazikomponenta neobsahuje cykly.'
      - 'Protože do ní nevede žádná hrana zvenku.'
    correct: 1
    explanation: |
      Hrany mezi $S_0$ a pozdějšími částmi jádra jsou vyloučeny ve dvou směrech:
      hrany *do* $S_0$ vedou z předchůdců, které odstraníme, a hrany *ze* $S_0$
      ven neexistují, protože $\vec G_0$ je výstupní.
    related: [thm-6-9-graf-bez-lichych-cyklu-ma-jadro, alg-jadro-grafu-bez-lichych-cyklu]

  - id: q-nezavislost-14
    question: |
      Kolik jader má orientovaný cyklus délky 6?
    options:
      - 'Žádné'
      - 'Jedno'
      - 'Dvě'
      - 'Šest'
    correct: 2
    explanation: |
      Příslušnost k jádru se po cyklu střídá; zvolíme-li, zda $u_1$ do jádra
      patří, je zbytek určen. Jádra jsou uzly s lichými indexy a uzly se sudými
      indexy.
    related: [prop-lichy-cyklus-nema-jadro]

  - id: q-nezavislost-15
    question: |
      Hladový algoritmus pro maximální nezávislou množinu vrátil množinu
      s 6 prvky. Co lze s jistotou říci o $\alpha(G)$?
    options:
      - '$\alpha(G)=6$'
      - '$\alpha(G)\ge 6$'
      - '$\alpha(G)\le 6$'
      - 'Nic, výsledek nemusí být ani nezávislý.'
    correct: 1
    explanation: |
      Výsledek je nezávislá (a maximální) množina, tedy dolní odhad nezávislosti.
      Největší nezávislá množina může být větší – výsledek hladového algoritmu
      závisí na pořadí volby uzlů.
    related: [alg-maximalni-nezavisla-mnozina]
