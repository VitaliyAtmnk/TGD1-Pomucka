  - id: def-nezavisla-mnozina-orientovaneho-grafu
    kind: definition
    label: "Definice 6.11"
    section: "6.2"
    title: Nezávislá množina orientovaného grafu
    terms: [nezávislá množina orientovaného grafu, independent set digraph]
    statement: |
      Buď $\vec G$ orientovaný graf. Říkáme, že množina $A \subset U(\vec G)$
      je **nezávislá**, jestliže žádné dva její uzly nejsou spojeny hranou.
    intuition: |
      Definice je shodná pro orientované i neorientované grafy – orientace
      hran nehraje roli, zakázána je hrana v libovolném směru.
    related: [def-nezavisla-mnozina, def-jadro-orientovaneho-grafu]
    source: "skripta str. 42, Definice 6.11 + poznámka; folie TGD1-08 s. 5"
