id: nezavislost-jadro
number: 7
title: Nezávislost, dominance, klikovost a jádro grafu
source: "TGD1 skripta kap. 6 (str. 36–44); přednáška TGD1-08 (folie 1–5)"
exam_questions: [11, 12]
summary: |
  Kapitola zkoumá množiny uzlů s extremálními vlastnostmi: nezávislé množiny
  a nezávislost $\alpha(G)$, uzlová pokrytí a pokrývací číslo $\beta(G)$, kliky
  a klikovost $\omega(G)$, dominantní množiny a číslo dominance $\gamma(G)$.
  Ukážeme vztahy $\alpha(G)+\beta(G)=|U(G)|$, $\alpha(G)=\omega(\bar G)$ a
  $\gamma(G)\le\alpha(G)$. Zásadní je rozdíl mezi *maximální* množinou (nelze ji
  rozšířit – najdeme hladově v polynomiálním čase) a *největší* množinou
  (NP-těžká úloha). Druhá část je věnována jádru – nezávislé a zároveň
  dominantní (absorbující) množině: v neorientovaném grafu existuje vždy,
  v orientovaném ne (lichý cyklus), ale acyklické grafy a grafy bez lichých
  cyklů jádro mají a umíme ho efektivně najít (Grundyho funkce).
sections:
  - number: "6.1"
    title: Neorientované grafy
  - number: "6.2"
    title: Jádro orientovaného grafu
items:
  # ------------------------------------------------------------------ 6.1
  - id: def-nezavisla-mnozina
    kind: definition
    label: "Definice 6.1"
    section: "6.1"
    title: Nezávislá množina
    terms: [nezávislá množina, vnitřně stabilní množina, stabilní množina, independent set, stable set, antiklika]
    statement: |
      Množina $A \subset U(G)$ se nazývá **nezávislá množina** grafu $G$
      (někdy též *vnitřně stabilní*), jestliže žádné dva uzly množiny $A$
      nejsou spojeny hranou.
    intuition: |
      Nezávislá množina je skupina uzlů, které si navzájem „nepřekážejí" –
      mezi žádnými dvěma z nich nevede hrana. Prázdná množina i každá
      jednoprvková množina jsou nezávislé triviálně.

      Vlastnost je **dědičná směrem dolů**: odebereme-li z nezávislé množiny
      libovolné uzly, zůstane nezávislá. Proto nemá smysl hledat malé nezávislé
      množiny, ale naopak co **největší** (viz [nezávislost grafu](#def-nezavislost-grafu)).

      Typická aplikace – *úloha o vysílačích*: uzly jsou televizní vysílače,
      hrana spojuje dva vysílače, které by se při vysílání na stejném kanálu
      rušily. Nezávislá množina = vysílače, které mohou sdílet jeden kanál;
      chceme jich na jeden kanál dostat co nejvíc.
    examples:
      - title: Nezávislé množiny v kružnici $C_6$
        body: |
          Uzly kružnice $C_6$ označme $1,2,\dots,6$ (hrany $\{i,i+1\}$ a $\{6,1\}$).
          Množiny $\{1,3,5\}$ a $\{2,4,6\}$ jsou nezávislé, množina $\{1,4\}$
          také. Množina $\{1,2,4\}$ nezávislá není, protože obsahuje hranu $\{1,2\}$.
        graph:
          directed: false
          nodes:
            - { id: "1", x: 5, y: 9, color: 1 }
            - { id: "2", x: 8.5, y: 7 }
            - { id: "3", x: 8.5, y: 3, color: 1 }
            - { id: "4", x: 5, y: 1 }
            - { id: "5", x: 1.5, y: 3, color: 1 }
            - { id: "6", x: 1.5, y: 7 }
          edges:
            - { from: "1", to: "2" }
            - { from: "2", to: "3" }
            - { from: "3", to: "4" }
            - { from: "4", to: "5" }
            - { from: "5", to: "6" }
            - { from: "6", to: "1" }
    related: [def-nezavislost-grafu, def-pokryti, def-klika, def-nezavisla-mnozina-orientovaneho-grafu]
    illustrations:
      - title: Nezávislé a závislé množiny v kružnici $C_6$
        for: statement
        property: independent-set
        graph:
          directed: false
          nodes:
            - { id: a, x: 5, y: 9.5 }
            - { id: b, x: 9, y: 7.25 }
            - { id: c, x: 9, y: 2.75 }
            - { id: d, x: 5, y: 0.5 }
            - { id: e, x: 1, y: 2.75 }
            - { id: f, x: 1, y: 7.25 }
          edges:
            - { from: a, to: b }
            - { from: b, to: c }
            - { from: c, to: d }
            - { from: d, to: e }
            - { from: e, to: f }
            - { from: f, to: a }
        steps:
          - caption: |
              Vybereme každý druhý uzel kružnice: $\{a, c, e\}$. Mezi vybranými uzly nevede žádná hrana, množina je **nezávislá**.
            set: [a, c, e]
          - caption: |
              Množina $\{a, b, d\}$ nezávislá **není** – stačí jediná hrana $ab$ mezi dvěma vybranými uzly.
            set: [a, b, d]
          - caption: |
              Nezávislá je i dvojice protilehlých uzlů $\{a, d\}$. Nezávislých množin je obvykle mnoho a mají různé velikosti.
            set: [a, d]
          - caption: |
              Přidáme do grafu tětivu $ac$. Množina $\{a, c, e\}$ teď obsahuje hranu, takže přestala být nezávislá.
            add: [[a, c]]
            set: [a, c, e]
          - caption: |
              Odebereme z množiny uzel $a$: $\{c, e\}$ je opět nezávislá. Vlastnost je **dědičná směrem dolů** – podmnožina nezávislé množiny je nezávislá.
            set: [c, e]
    source: "skripta str. 36, Definice 6.1 + příklad a poznámka; folie TGD1-08 s. 1"
    supplemented: false

  - id: def-nezavislost-grafu
    kind: definition
    label: "Definice 6.2"
    section: "6.1"
    title: Nezávislost grafu
    terms: [nezávislost grafu, číslo nezávislosti, nezávislostní číslo, "α(G)", alfa, independence number, největší nezávislá množina, maximum independent set]
    statement: |
      **Nezávislost** grafu $G$, značíme $\alpha(G)$, je největší počet prvků
      nezávislé množiny grafu $G$.
    intuition: |
      $\alpha(G)$ odpovídá na otázku „kolik nejvíce uzlů mohu vybrat tak, aby
      žádné dva nesousedily". Několik základních hodnot:
      $\alpha(K_n)=1$, $\alpha(C_n)=\lfloor n/2\rfloor$,
      $\alpha(K_{m,n})=\max\{m,n\}$, pro graf bez hran $\alpha=|U(G)|$.

      Pozor na rozdíl *největší* × *maximální* – viz
      [poznámku](#rem-maximalni-vs-nejvetsi). Výpočet $\alpha(G)$ je NP-těžký
      (rozhodovací verze je NP-úplná, [viz kap. 9](#thm-ind-npc)).
    examples:
      - title: Trojúhelníková mřížka s $\alpha(G)=4$
        body: |
          Graf má tři řady uzlů: horní $t_1,t_2,t_3$, prostřední $m_1,\dots,m_4$
          a dolní $b_1,b_2,b_3$; uzly tvoří trojúhelníkovou síť (10 trojúhelníků).
          Množina $\{t_1,t_3,b_1,b_3\}$ (barva 1) je nezávislá, tedy $\alpha(G)\ge 4$.

          Horní odhad: uzly lze rozdělit do čtyř úplných podgrafů
          $\{t_1,m_1,m_2\}$, $\{t_2,t_3,m_3\}$, $\{m_4,b_3\}$, $\{b_1,b_2\}$.
          Nezávislá množina může z každého úplného podgrafu obsahovat nejvýše
          jeden uzel, proto $\alpha(G)\le 4$. Celkem $\alpha(G)=4$.
        graph:
          directed: false
          nodes:
            - { id: t1, x: 3, y: 8, color: 1 }
            - { id: t2, x: 5, y: 8 }
            - { id: t3, x: 7, y: 8, color: 1 }
            - { id: m1, x: 2, y: 5 }
            - { id: m2, x: 4, y: 5 }
            - { id: m3, x: 6, y: 5 }
            - { id: m4, x: 8, y: 5 }
            - { id: b1, x: 3, y: 2, color: 1 }
            - { id: b2, x: 5, y: 2 }
            - { id: b3, x: 7, y: 2, color: 1 }
          edges: &mrizka
            - { from: t1, to: t2 }
            - { from: t2, to: t3 }
            - { from: m1, to: m2 }
            - { from: m2, to: m3 }
            - { from: m3, to: m4 }
            - { from: b1, to: b2 }
            - { from: b2, to: b3 }
            - { from: t1, to: m1 }
            - { from: t1, to: m2 }
            - { from: t2, to: m2 }
            - { from: t2, to: m3 }
            - { from: t3, to: m3 }
            - { from: t3, to: m4 }
            - { from: b1, to: m1 }
            - { from: b1, to: m2 }
            - { from: b2, to: m2 }
            - { from: b2, to: m3 }
            - { from: b3, to: m3 }
            - { from: b3, to: m4 }
    related: [def-nezavisla-mnozina, rem-maximalni-vs-nejvetsi, cor-6-1-alfa-plus-beta, thm-6-4-alfa-omega-doplnku, thm-ind-npc]
    source: "skripta str. 36–37, Definice 6.2 + příklad; folie TGD1-08 s. 1"
    supplemented: false

  - id: rem-maximalni-vs-nejvetsi
    kind: remark
    section: "6.1"
    title: Maximální × největší nezávislá množina
    terms: [maximální nezávislá množina, největší nezávislá množina, maximal independent set, maximum independent set, maximal vs maximum, inkluzně maximální]
    statement: |
      Je třeba přísně rozlišovat:

      - **maximální** nezávislá množina = nezávislá množina, kterou už nelze
        rozšířit o žádný další uzel (je maximální vzhledem k inkluzi);
      - **největší** nezávislá množina = nezávislá množina s největším možným
        počtem prvků, tj. s $\alpha(G)$ prvky.

      Každá největší nezávislá množina je maximální, opak obecně neplatí.
      V anglické literatuře se rozlišuje *maximal* × *maximum*
      („největší nezávislá množina" = *a maximum independent set*).
      Totéž rozlišení platí pro kliky (maximální = klika, největší má
      $\omega(G)$ uzlů), pro pokrytí a dominantní množiny (minimální × nejmenší).
    intuition: |
      Maximální množina je „lokální optimum": z ní už nevede žádný krok
      přidáním uzlu. Největší je „globální optimum". Hladový postup se vždy
      zastaví v nějakém lokálním optimu, ale nemusí to být globální optimum –
      v tom je celý rozdíl mezi polynomiální a NP-těžkou úlohou.
    examples:
      - title: Tři maximální nezávislé množiny různé velikosti
        body: |
          V trojúhelníkové mřížce z [Definice 6.2](#def-nezavislost-grafu)
          jsou maximální například množiny

          - $\{m_1,m_3\}$ (2 prvky) – každý další uzel sousedí s $m_1$ nebo $m_3$,
          - $\{m_2,t_3,b_3\}$ (3 prvky),
          - $\{t_1,t_3,b_1,b_3\}$ (4 prvky) – jediná z nich je největší.

          Na obrázku je vyznačena maximální, ale ne největší množina $\{m_1,m_3\}$.
        graph:
          directed: false
          nodes:
            - { id: t1, x: 3, y: 8 }
            - { id: t2, x: 5, y: 8 }
            - { id: t3, x: 7, y: 8 }
            - { id: m1, x: 2, y: 5, color: 1 }
            - { id: m2, x: 4, y: 5 }
            - { id: m3, x: 6, y: 5, color: 1 }
            - { id: m4, x: 8, y: 5 }
            - { id: b1, x: 3, y: 2 }
            - { id: b2, x: 5, y: 2 }
            - { id: b3, x: 7, y: 2 }
          edges: *mrizka
    related: [def-nezavislost-grafu, rem-slozitost-nezavisle-mnoziny, thm-6-5-maximalni-nezavisla-je-dominantni]
    illustrations:
      - title: Nerozšiřitelná neznamená největší
        for: statement
        property: independent-set
        graph:
          directed: false
          nodes:
            - { id: t1, x: 3, y: 8 }
            - { id: t2, x: 5, y: 8 }
            - { id: t3, x: 7, y: 8 }
            - { id: m1, x: 2, y: 5 }
            - { id: m2, x: 4, y: 5 }
            - { id: m3, x: 6, y: 5 }
            - { id: m4, x: 8, y: 5 }
            - { id: b1, x: 3, y: 2 }
            - { id: b2, x: 5, y: 2 }
            - { id: b3, x: 7, y: 2 }
          edges: *mrizka
        steps:
          - caption: |
              $\{m_1, m_3\}$ je nezávislá a **maximální**: každý další uzel sousedí s $m_1$ nebo s $m_3$, takže ji nelze rozšířit. Má ale jen 2 prvky.
            set: [m1, m3]
          - caption: |
              Zkusíme přidat třeba $t_3$ – hned vznikne hrana uvnitř množiny. Stejně dopadne každý jiný uzel; „lokální optimum“ je dosaženo.
            set: [m1, m3, t3]
          - caption: |
              Jiná maximální množina $\{m_2, t_3, b_3\}$ má už 3 prvky. Hladový postup skončí v té či oné podle toho, které uzly vybere dřív.
            set: [m2, t3, b3]
          - caption: |
              $\{t_1, t_3, b_1, b_3\}$ je **největší** nezávislá množina, $\alpha(G) = 4$. Najít ji obecně znamená prozkoumat exponenciálně mnoho možností.
            set: [t1, t3, b1, b3]
    source: "skripta str. 37, poznámky a příklad za Definicí 6.2"
    supplemented: false

  - id: rem-slozitost-nezavisle-mnoziny
    kind: remark
    section: "6.1"
    title: Složitost hledání největší a maximální nezávislé množiny
    terms: [složitost nezávislé množiny, NP-těžký problém, hrubá síla, hladový algoritmus, maximum independent set complexity]
    statement: |
      Algoritmicky je mezi největší a maximální nezávislou množinou zásadní rozdíl:

      - nalezení **největší** nezávislé množiny (tj. výpočet $\alpha(G)$) je
        **NP-těžký** problém; známe jen postupy typu „hrubá síla" se
        složitostí řádu $O(2^n)$ (krát polynom);
      - nalezení **maximální** nezávislé množiny je **polynomiální** problém,
        řešitelný jednoduchým [hladovým algoritmem](#alg-maximalni-nezavisla-mnozina).
    intuition: |
      Pro maximální množinu stačí přidávat uzly, dokud to jde – nikdy se
      nemusíme vracet. Pro největší množinu ale „špatná" raná volba (třeba
      uzel s mnoha sousedy) zablokuje mnoho jiných uzlů a nic lepšího než
      prozkoumat (v nejhorším případě) exponenciálně mnoho možností neznáme.
    related: [rem-maximalni-vs-nejvetsi, alg-maximalni-nezavisla-mnozina, alg-nejvetsi-nezavisla-mnozina-hrubou-silou, thm-ind-npc]
    source: "skripta str. 37, poznámka o algoritmické složitosti"
    supplemented: false

  - id: def-pokryti
    kind: definition
    label: "Definice 6.3"
    section: "6.1"
    title: Uzlové pokrytí
    terms: [pokrytí, uzlové pokrytí, vrcholové pokrytí, pokrytí hran uzly, vertex cover, node cover]
    statement: |
      Množina $B \subset U(G)$ se nazývá (**uzlové**) **pokrytí** grafu $G$,
      jestliže pro každou hranu $\{x,y\} \in H(G)$ je $x \in B$ nebo $y \in B$
      (mohou být i oba).
    intuition: |
      Pokrytí „hlídá" všechny hrany: každá hrana musí mít aspoň jeden konec
      v $B$. Vlastnost je **dědičná směrem nahoru** – přidáme-li k pokrytí
      další uzly, zůstane pokrytím (celá $U(G)$ je vždy pokrytí). Proto má
      smysl hledat co **nejmenší** pokrytí.

      Příklad z dopravy: na křižovatky (uzly) chceme rozmístit co nejméně
      policistů tak, aby každá ulice (hrana) byla hlídaná z některého svého konce.
    related: [def-pokryvaci-cislo, thm-6-1-nezavisla-doplnek-pokryti, def-nezavisla-mnozina, thm-cov-npc]
    illustrations:
      - title: Minimální × nejmenší pokrytí
        for: statement
        property: vertex-cover
        graph:
          directed: false
          nodes:
            - { id: s, x: 5, y: 5 }
            - { id: a, x: 2, y: 8.5 }
            - { id: b, x: 8, y: 8.5 }
            - { id: c, x: 8, y: 1.5 }
            - { id: d, x: 2, y: 1.5 }
          edges:
            - { from: s, to: a }
            - { from: s, to: b }
            - { from: s, to: c }
            - { from: s, to: d }
            - { from: a, to: b }
        steps:
          - caption: |
              Střed $s$ hlídá všechny čtyři „paprsky“, ale hrana $ab$ nemá konec v $\{s\}$ – samotné $s$ pokrytím **není**.
            set: [s]
          - caption: |
              Přidáme $a$: teď má každá hrana aspoň jeden konec v $\{s, a\}$. Menší pokrytí neexistuje, proto $\beta(G) = 2$.
            set: [s, a]
          - caption: |
              Přidáme-li další uzel, pokrytí zůstane pokrytím – vlastnost je **dědičná směrem nahoru**. Proto hledáme co nejmenší pokrytí.
            set: [s, a, c]
          - caption: |
              $\{a, b, c, d\}$ je také pokrytí a je **minimální**: po odebrání libovolného uzlu $x$ zůstane hrana $sx$ nepokrytá. Nejmenší ale není – má 4 prvky místo 2.
            set: [a, b, c, d]
          - caption: |
              Opravdu: bez uzlu $a$ zůstane hrana $sa$ bez hlídače.
            set: [b, c, d]
    source: "skripta str. 37, Definice 6.3 + poznámka; folie TGD1-08 s. 1"
    supplemented: false

  - id: def-pokryvaci-cislo
    kind: definition
    label: "Definice 6.4"
    section: "6.1"
    title: Pokrývací číslo
    terms: [pokrývací číslo, "β(G)", beta, vertex cover number, nejmenší pokrytí, minimum vertex cover]
    statement: |
      **Pokrývací číslo** grafu $G$, značíme $\beta(G)$, je počet prvků
      nejmenšího pokrytí grafu $G$.
    intuition: |
      $\beta(G)$ = minimální počet „hlídačů" hran. Například
      $\beta(K_n)=n-1$, $\beta(C_n)=\lceil n/2\rceil$, $\beta(K_{1,n})=1$
      (stačí střed hvězdy). Díky [Důsledku 6.1](#cor-6-1-alfa-plus-beta) je
      $\beta(G)=|U(G)|-\alpha(G)$, takže výpočet $\beta$ je stejně těžký
      jako výpočet $\alpha$.
    examples:
      - title: Doplňky nezávislých množin jsou pokrytí
        body: |
          V trojúhelníkové mřížce s 10 uzly (viz [Definice 6.2](#def-nezavislost-grafu))
          je $\{t_1,t_3,b_1,b_3\}$ největší nezávislá množina, takže její doplněk
          $\{t_2,m_1,m_2,m_3,m_4,b_2\}$ je nejmenší pokrytí a $\beta(G)=10-4=6$.
          Doplněk maximální množiny $\{m_1,m_3\}$ je pokrytí s 8 prvky, které
          je minimální (nelze z něj nic odebrat), ale ne nejmenší.
    related: [def-pokryti, cor-6-1-alfa-plus-beta, thm-cov-npc]
    source: "skripta str. 37, Definice 6.4 + příklad; folie TGD1-08 s. 1"
    supplemented: false

  - id: thm-6-1-nezavisla-doplnek-pokryti
    kind: theorem
    label: "Věta 6.1"
    section: "6.1"
    title: Nezávislá množina a pokrytí jsou doplňky
    terms: [nezávislá množina a pokrytí, doplněk nezávislé množiny, complement of independent set is vertex cover]
    statement: |
      Množina $A \subset U(G)$ je nezávislá právě když $B = U(G) \setminus A$
      je pokrytí grafu $G$.
    intuition: |
      Hrana „porušuje" nezávislost $A$, právě když má oba konce v $A$ – tedy
      právě když nemá žádný konec v doplňku $B$, tj. když ji $B$ nepokrývá.
      Obě vlastnosti tedy hlídají totéž, jen z opačné strany.
    proof: |
      Pro libovolnou hranu $\{x,y\}\in H(G)$ platí: „oba konce leží v $A$"
      je totéž jako „žádný konec neleží v $B=U(G)\setminus A$". Proto:

      $A$ je nezávislá
      $\iff$ žádná hrana nemá oba konce v $A$
      $\iff$ každá hrana má alespoň jeden konec v $B$
      $\iff$ $B$ je pokrytí. $\square$
    proof_steps:
      - 'Pro hranu {x,y} je tvrzení „oba konce jsou v A" ekvivalentní s „žádný konec není v B = U(G) \ A".'
      - 'A je nezávislá právě tehdy, když žádná hrana nemá oba konce v A.'
      - 'To nastává právě tehdy, když každá hrana má alespoň jeden konec v B.'
      - 'To je přesně definice pokrytí, tedy B je pokrytí.'
    related: [def-nezavisla-mnozina, def-pokryti, cor-6-1-alfa-plus-beta]
    illustrations:
      - title: Nezávislá množina $A$
        for: statement
        property: independent-set
        graph:
          directed: false
          nodes: &zebrik-uzly
            - { id: a, x: 1, y: 8 }
            - { id: b, x: 5, y: 8 }
            - { id: c, x: 9, y: 8 }
            - { id: d, x: 1, y: 2 }
            - { id: e, x: 5, y: 2 }
            - { id: f, x: 9, y: 2 }
          edges: &zebrik-hrany
            - { from: a, to: b }
            - { from: b, to: c }
            - { from: a, to: d }
            - { from: b, to: e }
            - { from: c, to: f }
            - { from: d, to: e }
            - { from: e, to: f }
        steps:
          - caption: |
              $A = \{a, c, e\}$ je nezávislá. Ve vedlejší ilustraci je na stejném grafu vybrán její doplněk $B = \{b, d, f\}$ – a ten je pokrytím.
            set: [a, c, e]
          - caption: |
              Přidáme do $A$ uzel $f$. Hrany $cf$ a $ef$ mají teď **oba** konce v $A$ – tedy žádný konec v doplňku $\{b, d\}$. Nezávislost $A$ i pokrytí doplňkem se rozbijí současně.
            set: [a, c, e, f]
          - caption: |
              Role lze prohodit: i $\{b, d, f\}$ je nezávislá, a proto je její doplněk $\{a, c, e\}$ pokrytí.
            set: [b, d, f]
      - title: Doplněk $B = U(G) \setminus A$ je pokrytí
        for: proof
        property: vertex-cover
        graph:
          directed: false
          nodes: *zebrik-uzly
          edges: *zebrik-hrany
        steps:
          - caption: |
              $B = \{b, d, f\}$ je doplněk nezávislé množiny $\{a, c, e\}$. Hrana by nebyla pokrytá, jen kdyby měla oba konce v $A$ – a takovou nezávislost zakazuje. $B$ **je** pokrytí.
            set: [b, d, f]
          - caption: |
              Doplněk množiny $\{a, c, e, f\}$, která nezávislá není, je $\{b, d\}$. Přesně „vadné“ hrany $cf$ a $ef$ s oběma konci v $A$ zůstanou nepokryté.
            set: [b, d]
          - caption: |
              A naopak: $\{a, c, e\}$ je pokrytí, protože doplněk $\{b, d, f\}$ je nezávislý. Obě velikosti dávají dohromady $|U(G)| = 6$.
            set: [a, c, e]
    source: "skripta str. 37, Věta 6.1 s důkazem; folie TGD1-08 s. 1"
    supplemented: false

  - id: cor-6-1-alfa-plus-beta
    kind: corollary
    label: "Důsledek 6.1"
    section: "6.1"
    title: "α(G) + β(G) = |U(G)|"
    terms: [alfa plus beta, vztah nezávislosti a pokrývacího čísla, Gallaiova identita]
    statement: |
      Pro každý graf $G$ platí
      $$
      \alpha(G) + \beta(G) = |U(G)|.
      $$
    intuition: |
      Podle [Věty 6.1](#thm-6-1-nezavisla-doplnek-pokryti) se nezávislé množiny
      a pokrytí přesně „párují" doplňkem. Čím větší nezávislá množina, tím
      menší její doplňkové pokrytí – největší nezávislá množina tedy odpovídá
      nejmenšímu pokrytí. Prakticky: kdo umí spočítat $\alpha$, umí spočítat
      i $\beta$ a naopak.
    proof: |
      Označme $n=|U(G)|$.

      - Je-li $A$ největší nezávislá množina ($|A|=\alpha(G)$), pak podle
        Věty 6.1 je $U(G)\setminus A$ pokrytí s $n-\alpha(G)$ prvky, tedy
        $\beta(G)\le n-\alpha(G)$.
      - Je-li $B$ nejmenší pokrytí ($|B|=\beta(G)$), pak podle Věty 6.1 je
        $U(G)\setminus B$ nezávislá množina s $n-\beta(G)$ prvky, tedy
        $\alpha(G)\ge n-\beta(G)$, neboli $\alpha(G)+\beta(G)\ge n$.

      Obě nerovnosti dohromady dávají $\alpha(G)+\beta(G)=n$; zároveň vidíme,
      že doplněk největší nezávislé množiny je nejmenší pokrytí. $\square$
    proof_steps:
      - 'Vezmeme největší nezávislou množinu A; její doplněk je podle Věty 6.1 pokrytí, proto β(G) ≤ n − α(G).'
      - 'Vezmeme nejmenší pokrytí B; jeho doplněk je podle Věty 6.1 nezávislá množina, proto α(G) ≥ n − β(G).'
      - 'Spojením obou nerovností dostaneme α(G) + β(G) = n.'
    examples:
      - title: Rychlý výpočet
        body: |
          Graf má 10 uzlů a $\alpha(G)=4$. Pak $\beta(G)=10-4=6$ bez dalšího
          počítání. Pro hvězdu $K_{1,n}$ je $\alpha=n$, a tedy $\beta=1$.
    related: [thm-6-1-nezavisla-doplnek-pokryti, def-nezavislost-grafu, def-pokryvaci-cislo]
    source: "skripta str. 37, Důsledek 6.1 (důkaz ve skriptech jednořádkový, zde rozepsán); folie TGD1-08 s. 1"
    supplemented: false

  - id: thm-chvatal-erdos
    kind: theorem
    label: "Věta 6.2 (Chvátal, Erdős)"
    section: "6.1"
    title: Chvátalova–Erdősova věta
    terms: [Chvátal, Erdős, Chvátalova-Erdősova věta, hamiltonovský graf a nezávislost, k-souvislost a nezávislost, Chvátal–Erdős theorem]
    statement: |
      Nechť $G$ je $k$-souvislý graf ($k \ge 2$) s $\alpha(G) \le k$.
      Pak je $G$ hamiltonovský.
    intuition: |
      Vysoká souvislost znamená, že se k libovolné kružnici dá „dostat" mnoha
      disjunktními cestami. Malá nezávislost znamená, že graf je „hustý" –
      nelze v něm najít mnoho navzájem nesousedních uzlů. Kdyby nejdelší
      kružnice nebyla hamiltonovská, umíme z ní a z $k$ cest k ní vyrobit
      $k+1$ nezávislých uzlů – a to je víc, než dovoluje $\alpha(G)\le k$.

      Mez je těsná: $K_{k,k+1}$ je $k$-souvislý, má $\alpha=k+1$ a hamiltonovský
      není (bipartitní graf s nestejně velkými partitami nemá hamiltonovskou
      kružnici).
    proof: |
      Postupujeme sporem jako ve skriptech, jen cesty k nejdelší kružnici vedeme
      z jediného uzlu (tzv. vějíř), což argumentaci zjednoduší.

      Nechť $G$ není hamiltonovský. Protože je $2$-souvislý, obsahuje kružnici;
      zvolme **nejdelší kružnici** $C$ a pevně zvolme směr jejího oběhu.

      *Délka $C$.* V $k$-souvislém grafu má každý uzel stupeň aspoň $k$.
      Vezmeme-li nejdelší cestu $v_0v_1\dots v_r$, leží všichni sousedé $v_0$
      na ní (jinak by šla prodloužit); nejvzdálenější soused $v_j$ má $j\ge k$
      a úsek $v_0\dots v_j$ s hranou $v_jv_0$ je kružnice s aspoň $k+1$ uzly.
      Tedy $|U(C)|\ge k+1$.

      *Vějíř.* Protože $C$ není hamiltonovská, existuje uzel $v\notin U(C)$.
      Podle zobecněné (vějířové) Mengerovy věty existuje $k$ cest
      $P_1,\dots,P_k$ z $v$ do $C$, které mají společný jen uzel $v$ a každá
      má s $C$ společný jen svůj koncový uzel $y_i$; uzly $y_1,\dots,y_k$ jsou
      navzájem různé. Označme $z_i$ následníka uzlu $y_i$ na $C$ (při zvoleném
      směru oběhu). Uzly $z_1,\dots,z_k$ jsou různé a různé od $v$.

      *Tvrzení:* $M=\{v,z_1,\dots,z_k\}$ je nezávislá množina.

      - Kdyby $\{v,z_i\}\in H(G)$, nahradíme na $C$ hranu $y_iz_i$ cestou
        $y_i \xrightarrow{P_i} v \to z_i$. Vznikne kružnice obsahující všechny
        uzly $C$ a navíc $v$ – delší než $C$, spor.
      - Kdyby $\{z_i,z_j\}\in H(G)$ pro $i\ne j$, sestrojíme kružnici:
        z $y_i$ po $P_i$ do $v$, po $P_j$ do $y_j$, pak po $C$ **proti** směru
        oběhu z $y_j$ do $z_i$, hranou $z_iz_j$ a po $C$ **po** směru z $z_j$
        zpět do $y_i$. Ta prochází všemi uzly $C$ a navíc uzlem $v$ – opět
        delší než $C$, spor.

      $M$ je tedy nezávislá množina s $k+1$ prvky, což je ve sporu
      s předpokladem $\alpha(G)\le k$. Proto je $G$ hamiltonovský. $\square$
    proof_steps:
      - 'Sporem: G není hamiltonovský; zvolíme nejdelší kružnici C a pevný směr jejího oběhu.'
      - 'Protože minimální stupeň je aspoň k, má nejdelší kružnice aspoň k + 1 uzlů.'
      - 'Zvolíme uzel v mimo C a podle Mengerovy věty (vějíř) k cest z v do C s různými koncovými uzly y_1, …, y_k, disjunktních mimo v.'
      - 'Označíme z_i následníka y_i na C a uvažujeme množinu M = {v, z_1, …, z_k}.'
      - 'Hrana v z_i by umožnila nahradit hranu y_i z_i cestou přes v, a tím prodloužit C – spor.'
      - 'Hrana z_i z_j by dala kružnici přes P_i, P_j a oba oblouky C, která obsahuje celé C a navíc v – spor.'
      - 'M je tedy nezávislá s k + 1 prvky, což odporuje α(G) ≤ k.'
    examples:
      - title: Těsnost meze
        body: |
          - $K_n$ ($n\ge3$): je $(n-1)$-souvislý a $\alpha=1$, věta dává hamiltonovskost.
          - $K_{k,k}$: je $k$-souvislý a $\alpha=k$ – hamiltonovský.
          - $K_{k,k+1}$: je $k$-souvislý, ale $\alpha=k+1>k$, a hamiltonovský není.
            Předpoklad $\alpha(G)\le k$ tedy nelze zeslabit na $\alpha(G)\le k+1$.
    related: [thm-dirac-kruznice-pres-k-uzlu, def-nezavislost-grafu]
    source: "skripta str. 38, Věta 6.2 s důkazem (zde mírně upraven); folie TGD1-08 s. 2"
    supplemented: false

  - id: thm-dirac-kruznice-pres-k-uzlu
    kind: theorem
    label: "Věta 6.3 (Dirac)"
    section: "6.1"
    title: Kružnice přes libovolných k uzlů
    terms: [Dirac, Diracova věta o kružnicích, k-souvislý graf kružnice, kružnice procházející danými uzly, Dirac theorem k-connected cycle]
    statement: |
      Nechť $G$ je $k$-souvislý graf ($k \ge 2$). Pak pro každou množinu
      $M \subset U(G)$, $|M| \le k$, existuje v grafu $G$ kružnice $C$ taková,
      že $M \subset U(C)$.
    intuition: |
      Zobecnění známého faktu, že ve $2$-souvislém grafu leží každé dva uzly
      na společné kružnici. Čím vyšší souvislost, tím víc předepsaných uzlů
      dokážeme „navléknout" na jednu kružnici. Technika důkazu je stejná jako
      u [Chvátalovy–Erdősovy věty](#thm-chvatal-erdos): vezmeme extremální
      kružnici a vějíř cest k ní.
    proof: |
      Ve skriptech je důkaz jen naznačen; zde ho provádíme úplně, s vějířem
      cest z chybějícího uzlu (tím je zaručeno, že nová kružnice tento uzel
      opravdu obsahuje).

      $G$ je $2$-souvislý, takže kružnice existují. Zvolme kružnici $C$, která
      obsahuje **co nejvíce** uzlů množiny $M$, a předpokládejme sporem, že
      existuje $z\in M\setminus U(C)$. Pak $s=|M\cap U(C)|\le k-1$.

      Podle vějířové verze Mengerovy věty existuje $r=\min\{k,|U(C)|\}$ cest
      $P_1,\dots,P_r$ ze $z$ do $C$, které mají společný jen uzel $z$ a s $C$
      mají společný jen svůj koncový uzel $y_i$ (uzly $y_i$ jsou různé).

      Najdeme dva koncové uzly $y_i\ne y_j$ a oblouk kružnice $C$ mezi nimi,
      v jehož **vnitřku** neleží žádný uzel z $M$:

      - Je-li $r=|U(C)|$, končí cesty ve všech uzlech $C$; zvolíme dva
        sousední uzly kružnice – oblouk mezi nimi nemá žádné vnitřní uzly.
      - Je-li $r=k$, rozdělí uzly z $M\cap U(C)$ kružnici na $s\le k-1$
        polootevřených oblouků (od jednoho uzlu z $M$, bez něj, po další
        uzel z $M$ včetně; pro $s=0$ je celá $C$ jedním obloukem). Koncových
        uzlů je $k>s$, podle Dirichletova principu tedy dva z nich, $y_i$
        a $y_j$, leží ve stejném oblouku a úsek $C$ mezi nimi uvnitř tohoto
        oblouku nemá ve vnitřku žádný uzel z $M$.

      Nahradíme tento úsek cestou $y_i \xrightarrow{P_i} z \xrightarrow{P_j} y_j$.
      Vzniklá kružnice $C'$ obsahuje všechny uzly z $M\cap U(C)$ (žádný jsme
      neodstranili) a navíc uzel $z$, tedy
      $(U(C)\cap M)\cup\{z\}\subset U(C')$ – spor s volbou $C$. $\square$
    proof_steps:
      - 'Zvolíme kružnici C obsahující co nejvíce uzlů z M a sporem předpokládáme, že nějaký z ∈ M na ní neleží; pak |M ∩ U(C)| ≤ k − 1.'
      - 'Podle vějířové Mengerovy věty vedeme ze z do C min{k, |U(C)|} cest, disjunktních mimo z, s různými koncovými uzly na C.'
      - 'Uzly M ∩ U(C) dělí C na nejvýše k − 1 oblouků; podle Dirichletova principu (nebo volbou dvou sousedních uzlů C) najdeme dva koncové uzly y_i, y_j, mezi nimiž není uvnitř oblouku žádný uzel z M.'
      - 'Úsek C mezi y_i a y_j nahradíme cestou y_i → z → y_j složenou z P_i a P_j.'
      - 'Nová kružnice obsahuje všechny původní uzly z M a navíc z, což je spor s volbou C.'
    related: [thm-chvatal-erdos]
    source: "skripta str. 38, Věta 6.3 s náznakem důkazu (zde doplněn); folie TGD1-08 s. 2"
    supplemented: false

  - id: def-klika
    kind: definition
    label: "Definice 6.5"
    section: "6.1"
    title: Klika
    terms: [klika, maximální úplný podgraf, clique, maximal clique, úplný podgraf]
    statement: |
      Podgraf $K \subset G$ se nazývá **klika** grafu $G$, jestliže

      a) $K$ je úplný podgraf,

      b) jestliže $K \subset K' \subset G$ a $K'$ je úplný podgraf, pak $K = K'$.

      Jinak řečeno, klika je **maximální** (vzhledem k inkluzi) úplný podgraf.
    intuition: |
      Klika je „parta, kde se zná každý s každým" a ke které už nelze přibrat
      nikoho dalšího, kdo by znal všechny. Je to v jistém smyslu opak nezávislé
      množiny: tam nesmí být žádná hrana, tady musí být všechny.

      Pozor: v části literatury (a v úloze CLIQUE) se klikou rozumí libovolný
      úplný podgraf; v TGD1 je klika vždy *maximální* úplný podgraf.
      Klika nemusí být největší – viz příklad.
    examples:
      - title: Klika, která není největší
        body: |
          Graf tvoří úplný graf na uzlech $a,b,c,d$, uzel $e$ spojený s $c$
          a $d$ a uzel $f$ spojený jen s $e$.

          - $\{a,b,c,d\}$ je klika ($K_4$, největší).
          - $\{c,d,e\}$ je klika: je úplná a nelze ji rozšířit ($a,b$ nesousedí s $e$).
          - $\{e,f\}$ je klika ($K_2$).
          - $\{a,b,c\}$ klika **není** – je to úplný podgraf, ale lze ho rozšířit o $d$.

          Tedy $\omega(G)=4$.
        graph:
          directed: false
          nodes:
            - { id: a, x: 1, y: 8, color: 1 }
            - { id: b, x: 1, y: 2, color: 1 }
            - { id: c, x: 4.5, y: 8, color: 1 }
            - { id: d, x: 4.5, y: 2, color: 1 }
            - { id: e, x: 7, y: 5 }
            - { id: f, x: 9.5, y: 5 }
          edges:
            - { from: a, to: b }
            - { from: a, to: c }
            - { from: a, to: d }
            - { from: b, to: c }
            - { from: b, to: d }
            - { from: c, to: d }
            - { from: c, to: e }
            - { from: d, to: e }
            - { from: e, to: f }
    related: [def-klikovost, thm-6-4-alfa-omega-doplnku, def-nezavisla-mnozina, thm-clique-npc]
    illustrations:
      - title: Kliky různých velikostí
        for: statement
        property: clique
        graph:
          directed: false
          nodes:
            - { id: a, x: 1, y: 8 }
            - { id: b, x: 1, y: 2 }
            - { id: c, x: 4.5, y: 8 }
            - { id: d, x: 4.5, y: 2 }
            - { id: e, x: 7, y: 5 }
            - { id: f, x: 9.5, y: 5 }
          edges:
            - { from: a, to: b }
            - { from: a, to: c }
            - { from: a, to: d }
            - { from: b, to: c }
            - { from: b, to: d }
            - { from: c, to: d }
            - { from: c, to: e }
            - { from: d, to: e }
            - { from: e, to: f }
        steps:
          - caption: |
              $\{a, b, c, d\}$ je úplný podgraf $K_4$ – každý se zná s každým. Je to největší klika, $\omega(G) = 4$.
            set: [a, b, c, d]
          - caption: |
              $\{c, d, e\}$ je také úplný podgraf. Klikou (v TGD1 = maximálním úplným podgrafem) je proto, že ho nelze rozšířit – viz další krok.
            set: [c, d, e]
          - caption: |
              Pokus přibrat $a$ selže: $a$ a $e$ nesousedí (stejně tak $b$ a $e$). Klika $\{c, d, e\}$ je tedy maximální, i když není největší.
            set: [a, c, d, e]
          - caption: |
              I dvojice $\{e, f\}$ je klika: $f$ nemá jiného souseda než $e$, takže ji nelze zvětšit.
            set: [e, f]
          - caption: |
              Malá změna: přidáme hranu $be$. Z $\{c, d, e\}$ se stane druhá čtyřprvková klika $\{b, c, d, e\}$; $K_5$ ale nevznikne, protože $a$ a $e$ stále nesousedí.
            add: [[b, e]]
            set: [b, c, d, e]
    source: "skripta str. 38, Definice 6.5 + příklad; folie TGD1-08 s. 2"
    supplemented: false

  - id: def-klikovost
    kind: definition
    label: "Definice 6.6"
    section: "6.1"
    title: Klikovost grafu
    terms: [klikovost, klikové číslo, "ω(G)", omega, clique number, největší klika, maximum clique]
    statement: |
      **Klikovost** grafu $G$, značíme $\omega(G)$, je největší počet uzlů
      kliky grafu $G$.
    intuition: |
      $\omega(G)$ je velikost největšího úplného podgrafu (největší úplný
      podgraf je automaticky klikou). Platí $\omega(K_n)=n$, $\omega(C_n)=2$
      pro $n\ge4$, $\omega(C_3)=3$, pro bipartitní graf s aspoň jednou hranou
      $\omega=2$. Klikovost je dolní mez chromatického čísla:
      $\chi(G)\ge\omega(G)$ (viz [Tvrzení 7.1](#prop-7-1-klika-dolni-odhad)).
    related: [def-klika, thm-6-4-alfa-omega-doplnku, prop-7-1-klika-dolni-odhad, thm-clique-npc]
    source: "skripta str. 38–39, Definice 6.6 + příklad ($\\omega(G)=4$); folie TGD1-08 s. 2"
    supplemented: false

  - id: def-doplnek-grafu
    kind: definition
    label: "Definice 6.7"
    section: "6.1"
    title: Doplněk grafu
    terms: [doplněk grafu, komplement grafu, complement graph, "Ḡ", doplňkový graf]
    statement: |
      Nechť $G$ je graf. Potom graf
      $$
      \bar G = \left(U(G),\ \binom{U(G)}{2} \setminus H(G)\right)
      $$
      se nazývá **doplněk** grafu $G$.
      (Zde $\binom{U(G)}{2}$ je množina všech dvouprvkových podmnožin $U(G)$.)
    intuition: |
      Doplněk má stejné uzly a hrany přesně tam, kde je v $G$ **nemá**.
      $G$ a $\bar G$ dohromady dají úplný graf $K_n$. Doplněk převádí
      „nesousedí" na „sousedí", a proto převádí nezávislé množiny na kliky
      ([Věta 6.4](#thm-6-4-alfa-omega-doplnku)).
    examples:
      - title: Doplňky malých grafů
        body: |
          (Ve skriptech značí $P_k$ cestu délky $k$, tj. s $k$ hranami.)

          1. „Domeček" na 5 uzlech (čtverec $a,b,d,c$ se střechou $t$, hrany
             $ta,tb,ab,ac,bd,cd$) má 6 hran; jeho doplněk má $10-6=4$ hrany
             $tc,td,ad,bc$ a je to cesta $b\,c\,t\,d\,a$, tj. $P_4$.
          2. Doplněk cesty se 3 hranami na 4 uzlech je opět cesta se 3 hranami
             – graf je izomorfní se svým doplňkem.
          3. Doplněk kružnice $C_5$ je opět $C_5$ (pentagram).
    related: [thm-6-4-alfa-omega-doplnku, rem-autokomplementarni-graf]
    source: "skripta str. 39, Definice 6.7 + příklady; folie TGD1-08 s. 2"
    supplemented: false

  - id: rem-autokomplementarni-graf
    kind: remark
    section: "6.1"
    title: Autokomplementární graf
    terms: [autokomplementární graf, samodoplňkový graf, self-complementary graph]
    statement: |
      Je-li graf izomorfní se svým doplňkem, hovoříme o **autokomplementárním**
      grafu (např. cesta se 3 hranami, $C_5$). Na šesti uzlech žádný
      autokomplementární graf neexistuje: graf na šesti uzlech má spolu se svým
      doplňkem $\binom{6}{2}=15$ hran, což je liché číslo, a nemůže se tedy
      rozdělit na dvě stejně velké poloviny.
    intuition: |
      Izomorfní grafy mají stejný počet hran, takže autokomplementární graf
      na $n$ uzlech má přesně $\frac12\binom n2$ hran. To vyžaduje, aby
      $\binom n2$ bylo sudé, tj. $n\equiv 0$ nebo $1 \pmod 4$
      (obecnější podmínka – doplněno).
    related: [def-doplnek-grafu]
    source: "skripta str. 39, poznámka za Definicí 6.7"
    supplemented: false

  - id: thm-6-4-alfa-omega-doplnku
    kind: theorem
    label: "Věta 6.4"
    section: "6.1"
    title: "α(G) = ω(Ḡ)"
    terms: [nezávislost a klikovost doplňku, alfa rovná se omega doplňku, independent set clique complement]
    statement: |
      Nechť $G$ je graf. Pak
      $$
      \alpha(G) = \omega(\bar G).
      $$
    intuition: |
      Přechod k doplňku vymění hrany za „nehrany". Množina bez vnitřních hran
      v $G$ je tedy množina se všemi vnitřními hranami v $\bar G$. Důsledek
      pro algoritmy: úlohy o největší nezávislé množině a o největší klice jsou
      stejně těžké – jednu převedeme na druhou sestrojením doplňku v čase
      $O(n^2)$. Spolu s [Důsledkem 6.1](#cor-6-1-alfa-plus-beta) dostáváme
      i $\beta(G)=|U(G)|-\omega(\bar G)$.
    proof: |
      Nechť $A\subset U(G)$. Množina $A$ je nezávislá v $G$, právě když žádné
      dva její uzly nejsou v $G$ spojeny hranou, tj. právě když jsou každé dva
      její uzly spojeny hranou v $\bar G$ – neboli právě když $A$ indukuje
      v $\bar G$ úplný podgraf.

      Velikosti nezávislých množin v $G$ jsou tedy přesně velikosti úplných
      podgrafů v $\bar G$. Největší úplný podgraf nelze rozšířit, je to tedy
      klika; naopak každá klika je úplný podgraf. Proto největší nezávislá
      množina v $G$ má stejně prvků jako největší klika v $\bar G$, tj.
      $\alpha(G)=\omega(\bar G)$. $\square$
    proof_steps:
      - 'Množina A je nezávislá v G, právě když žádné dva její uzly nejsou v G sousední.'
      - 'To je totéž, jako že každé dva uzly A jsou sousední v doplňku Ḡ, tj. A indukuje v Ḡ úplný podgraf.'
      - 'Velikosti nezávislých množin v G jsou proto přesně velikosti úplných podgrafů v Ḡ.'
      - 'Největší úplný podgraf je nerozšiřitelný, tedy je to klika; proto α(G) = ω(Ḡ).'
    examples:
      - title: Graf s $\omega(G)=4$ a jeho doplněk
        body: |
          Pro graf z [příkladu ke klice](#def-klika) ($K_4$ na $a,b,c,d$, $e$
          spojené s $c,d$, $f$ spojené s $e$) je $\omega(G)=4$. V doplňku $\bar G$
          tvoří $\{a,b,c,d\}$ nezávislou množinu a $\alpha(\bar G)=4$
          (větší nezávislá množina v $\bar G$ by byla klikou v $G$ s více než 4 uzly).
    related: [def-nezavislost-grafu, def-klikovost, def-doplnek-grafu, thm-clique-npc]
    illustrations:
      - title: Nezávislé množiny v $G$
        for: statement
        property: independent-set
        graph:
          directed: false
          nodes: &sestiuhelnik-uzly
            - { id: a, x: 5, y: 9.5 }
            - { id: b, x: 9, y: 7.25 }
            - { id: c, x: 9, y: 2.75 }
            - { id: d, x: 5, y: 0.5 }
            - { id: e, x: 1, y: 2.75 }
            - { id: f, x: 1, y: 7.25 }
          edges:
            - { from: a, to: b }
            - { from: b, to: c }
            - { from: c, to: d }
            - { from: d, to: e }
            - { from: e, to: f }
            - { from: f, to: a }
            - { from: b, to: e }
        steps:
          - caption: |
              Graf $G$ je kružnice $C_6$ s tětivou $be$. Množina $\{a, c, e\}$ je nezávislá – ve vedlejší ilustraci (doplněk $\bar G$) tvoří tytéž uzly trojúhelník.
            set: [a, c, e]
          - caption: |
              Čtyřprvková nezávislá množina neexistuje, třeba přidání $b$ vytvoří hranu $ab$. Proto $\alpha(G) = 3$.
            set: [a, b, c, e]
          - caption: |
              Druhá největší nezávislá množina $\{b, d, f\}$ – v $\bar G$ je to druhý trojúhelník.
            set: [b, d, f]
          - caption: |
              Dvojice $\{b, e\}$ nezávislá není kvůli tětivě $be$ – a právě proto v $\bar G$ hrana $be$ chybí.
            set: [b, e]
      - title: Kliky v doplňku $\bar G$
        for: proof
        property: clique
        graph:
          directed: false
          nodes: *sestiuhelnik-uzly
          edges:
            - { from: a, to: c }
            - { from: c, to: e }
            - { from: e, to: a }
            - { from: b, to: d }
            - { from: d, to: f }
            - { from: f, to: b }
            - { from: a, to: d }
            - { from: c, to: f }
        steps:
          - caption: |
              Doplněk $\bar G$ má hranu přesně tam, kde ji $G$ nemá. Nezávislá množina $\{a, c, e\}$ z $G$ je v $\bar G$ **klika** – „nesousedí“ se změnilo na „sousedí“.
            set: [a, c, e]
          - caption: |
              Totéž pro $\{b, d, f\}$: nezávislá v $G$, úplná v $\bar G$.
            set: [b, d, f]
          - caption: |
              Rozšíření o $d$ selže, protože $cd$ je hrana v $G$, a tedy v $\bar G$ chybí. Větší klika v $\bar G$ by byla větší nezávislou množinou v $G$ – proto $\omega(\bar G) = \alpha(G) = 3$.
            set: [a, c, d, e]
          - caption: |
              Dvojice $\{b, e\}$ v $\bar G$ úplná není – v $G$ je $be$ hrana. Zkus v režimu *Vyzkoušej sám* najít další dvojice.
            set: [b, e]
    source: "skripta str. 39, Věta 6.4 s důkazem + příklad; folie TGD1-08 s. 2"
    supplemented: false

  - id: def-dominantni-mnozina
    kind: definition
    label: "Definice 6.8"
    section: "6.1"
    title: Dominantní množina
    terms: [dominantní množina, dominující množina, vnějškově stabilní množina, dominating set, externally stable set]
    statement: |
      Množina $B \subset U(G)$ se nazývá **dominantní množina** (též
      *vnějškově stabilní*) grafu $G$, jestliže pro každý uzel $x \notin B$
      existuje uzel $y \in B$ takový, že $\{x,y\} \in H(G)$.

      Jinak řečeno, $B$ je dominantní, jestliže každý uzel leží v $B$, nebo
      v ní má souseda.
    intuition: |
      Dominantní množina „dohlíží" na všechny uzly: každý uzel je buď sám
      v $B$, nebo sousedí s někým z $B$ (srovnej s [pokrytím](#def-pokryti),
      které dohlíží na *hrany*). Příklad: rozmístění hasičských stanic do
      obcí tak, aby každá obec měla stanici u sebe nebo v sousední obci.

      Vlastnost je **dědičná směrem nahoru** (nadmnožina dominantní množiny je
      dominantní), proto se ptáme na **minimální** (nelze nic odebrat)
      a **nejmenší** (nejméně prvků) dominantní množinu.
    related: [def-cislo-dominance, thm-6-5-maximalni-nezavisla-je-dominantni, def-jadro-neorientovaneho-grafu]
    illustrations:
      - title: Kdo na koho dohlíží
        for: statement
        property: dominating-set
        graph:
          directed: false
          nodes:
            - { id: a, x: 0.5, y: 5 }
            - { id: b, x: 2.75, y: 5 }
            - { id: c, x: 5, y: 5 }
            - { id: d, x: 7.25, y: 5 }
            - { id: e, x: 9.5, y: 5 }
            - { id: f, x: 2.75, y: 8.5 }
            - { id: g, x: 7.25, y: 1.5 }
          edges:
            - { from: a, to: b }
            - { from: b, to: c }
            - { from: c, to: d }
            - { from: d, to: e }
            - { from: b, to: f }
            - { from: d, to: g }
        steps:
          - caption: |
              Hasičské stanice v $b$ a $d$: $b$ dohlíží na $a, c, f$, $d$ na $c, e, g$. Každý uzel je ve množině nebo má v ní souseda – $\{b, d\}$ **je** dominantní.
            set: [b, d]
          - caption: |
              Samotné $b$ nestačí: uzly $d$, $e$, $g$ nemají souseda v množině.
            set: [b]
          - caption: |
              Přidáním uzlu dominance nezmizí (dědičnost **nahoru**), ale $e$ je tu zbytečné. Proto se ptáme na co nejmenší dominantní množiny.
            set: [b, d, e]
          - caption: |
              $\{a, c, e, f, g\}$ je dominantní a nelze z ní nic odebrat (odebraný uzel by neměl souseda v množině) – je **minimální**. Nejmenší ale není, $\gamma(G) = 2$.
            set: [a, c, e, f, g]
    source: "skripta str. 39–40, Definice 6.8 + poznámka; folie TGD1-08 s. 3"
    supplemented: false

  - id: def-cislo-dominance
    kind: definition
    label: "Definice 6.9"
    section: "6.1"
    title: Číslo dominance
    terms: [číslo dominance, dominance grafu, "γ(G)", gama, domination number, nejmenší dominantní množina, minimální dominantní množina, minimum dominating set]
    statement: |
      Počet prvků nejmenší dominantní množiny grafu $G$ se nazývá
      **číslo dominance** grafu $G$ a značí se $\gamma(G)$.
    intuition: |
      Opět je nutné důsledně rozlišovat *minimální* (nelze odebrat žádný uzel)
      a *nejmenší* (má $\gamma(G)$ prvků) dominantní množinu. Základní hodnoty:
      $\gamma(K_n)=1$, $\gamma(K_{1,n})=1$, $\gamma(C_n)=\lceil n/3\rceil$.
      Výpočet $\gamma(G)$ je NP-těžký, minimální dominantní množinu ale najdeme
      snadno (začneme s $U(G)$ a odebíráme uzly, dokud množina zůstává dominantní).
    examples:
      - title: Minimální × nejmenší dominantní množina
        body: |
          Graf tvoří šestiúhelník $l,t_1,t_2,t_3,r,b_3,b_2,b_1$ se středem $c$
          spojeným se všemi ostatními uzly a s „příčkami" $t_1t_2t_3$, $b_1b_2b_3$.

          - $\{t_1,t_3,b_1,b_3\}$ je minimální dominantní množina (po odebrání
            např. $t_1$ zůstane $t_1$ bez souseda v množině).
          - $\{t_2,b_1,b_3\}$ je také minimální.
          - $\{c\}$ je nejmenší dominantní množina, tedy $\gamma(G)=1$ (vyznačeno).
        graph:
          directed: false
          nodes:
            - { id: t1, x: 3, y: 8 }
            - { id: t2, x: 5, y: 8 }
            - { id: t3, x: 7, y: 8 }
            - { id: l, x: 1, y: 5 }
            - { id: c, x: 5, y: 5, color: 1 }
            - { id: r, x: 9, y: 5 }
            - { id: b1, x: 3, y: 2 }
            - { id: b2, x: 5, y: 2 }
            - { id: b3, x: 7, y: 2 }
          edges:
            - { from: t1, to: t2 }
            - { from: t2, to: t3 }
            - { from: b1, to: b2 }
            - { from: b2, to: b3 }
            - { from: l, to: t1 }
            - { from: l, to: b1 }
            - { from: r, to: t3 }
            - { from: r, to: b3 }
            - { from: c, to: t1 }
            - { from: c, to: t2 }
            - { from: c, to: t3 }
            - { from: c, to: l }
            - { from: c, to: r }
            - { from: c, to: b1 }
            - { from: c, to: b2 }
            - { from: c, to: b3 }
    related: [def-dominantni-mnozina, cor-6-2-gamma-le-alfa, thm-6-6-maximalni-nezavisla-minimalni-dominantni]
    source: "skripta str. 40, Definice 6.9 + příklad; folie TGD1-08 s. 3"
    supplemented: false

  - id: thm-6-5-maximalni-nezavisla-je-dominantni
    kind: theorem
    label: "Věta 6.5"
    section: "6.1"
    title: Maximální nezávislá množina = nezávislá dominantní množina
    terms: [maximální nezávislá množina je dominantní, nezávislá dominantní množina, maximal independent set dominating]
    statement: |
      Nechť $A \subset U(G)$ je nezávislá množina grafu $G$. Pak $A$ je
      maximální nezávislá množina právě když $A$ je dominantní.
    intuition: |
      Nezávislou množinu nelze rozšířit, právě když každý uzel mimo ni už má
      v množině souseda (a jeho přidání by vytvořilo hranu). „Nelze přidat"
      a „každý má souseda uvnitř" jsou dvě strany téže mince.
    proof: |
      Nechť $A$ je nezávislá.

      1. Je-li $A$ dominantní, má každý uzel $x\notin A$ v $A$ souseda, takže
         $A\cup\{x\}$ obsahuje hranu a není nezávislá. Žádný uzel tedy nelze
         přidat a $A$ je maximální.
      2. Je-li $A$ maximální, pak pro každý $x\notin A$ není $A\cup\{x\}$
         nezávislá. Protože $A$ sama nezávislá je, musí „vadná" hrana obsahovat
         uzel $x$ – tj. $x$ má souseda v $A$. Tedy $A$ je dominantní. $\square$
    proof_steps:
      - 'Předpokládáme, že A je nezávislá.'
      - '(⇐) Je-li A dominantní, každý uzel x mimo A má v A souseda, takže přidáním x vznikne hrana uvnitř množiny; A tedy nelze rozšířit.'
      - '(⇒) Je-li A maximální, pro každé x mimo A není A ∪ {x} nezávislá.'
      - 'Protože A je nezávislá, musí hrana uvnitř A ∪ {x} obsahovat x, tedy x má souseda v A a A je dominantní.'
    related: [thm-6-6-maximalni-nezavisla-minimalni-dominantni, def-jadro-neorientovaneho-grafu, rem-maximalni-vs-nejvetsi, def-dominantni-mnozina]
    illustrations:
      - title: Nedominovaný uzel = uzel, který lze přidat
        for: proof
        property: dominating-set
        graph:
          directed: false
          nodes:
            - { id: a, x: 0.5, y: 3 }
            - { id: b, x: 2.3, y: 7 }
            - { id: c, x: 4.1, y: 3 }
            - { id: d, x: 5.9, y: 7 }
            - { id: e, x: 7.7, y: 3 }
            - { id: f, x: 9.5, y: 7 }
          edges:
            - { from: a, to: b }
            - { from: b, to: c }
            - { from: c, to: d }
            - { from: d, to: e }
            - { from: e, to: f }
        steps:
          - caption: |
              $A = \{a, d\}$ je nezávislá, ale ne dominantní: $f$ nemá souseda v $A$. Právě proto ho lze do $A$ přidat, aniž vznikne hrana – $A$ **není maximální**.
            set: [a, d]
          - caption: |
              Po přidání $f$ má každý uzel mimo $A$ souseda v $A$. Teď by každý přidaný uzel vytvořil hranu: $\{a, d, f\}$ je maximální nezávislá **a** dominantní.
            set: [a, d, f]
          - caption: |
              Menší maximální nezávislá množina $\{b, e\}$ je také dominantní – věta platí pro každou maximální, nejen pro největší.
            set: [b, e]
          - caption: |
              Předpoklad nezávislosti je podstatný: $\{b, c, e\}$ je dominantní, ale obsahuje hranu $bc$, takže maximální nezávislou množinou není.
            set: [b, c, e]
    source: "skripta str. 40, Věta 6.5 s důkazem; folie TGD1-08 s. 3"
    supplemented: false

  - id: thm-6-6-maximalni-nezavisla-minimalni-dominantni
    kind: theorem
    label: "Věta 6.6"
    section: "6.1"
    title: Maximální nezávislá množina je minimální dominantní
    terms: [maximální nezávislá je minimální dominantní, minimal dominating set, maximal independent set]
    statement: |
      Každá maximální nezávislá množina je minimální dominantní množina
      grafu $G$.
    intuition: |
      Maximální nezávislá množina dominuje (Věta 6.5). Nelze z ní nic ubrat,
      protože odebraný uzel by musel mít souseda ve zbytku množiny – a to
      nezávislost zakazuje. Opačná implikace neplatí:
      [minimální dominantní množina nemusí být nezávislá](#rem-minimalni-dominantni-nemusi-byt-nezavisla).
    proof: |
      Nechť $A$ je maximální nezávislá množina. Podle
      [Věty 6.5](#thm-6-5-maximalni-nezavisla-je-dominantni) je dominantní.

      Minimalita: předpokládejme sporem, že pro nějaké $x\in A$ je
      $A\setminus\{x\}$ dominantní. Uzel $x$ do ní nepatří, musí tedy mít
      souseda v $A\setminus\{x\}\subset A$. Pak ale $A$ obsahuje hranu, což
      je spor s nezávislostí.

      Odebrání jednoho uzlu tedy vždy poruší dominanci. Protože nadmnožina
      dominantní množiny je dominantní, nemůže být dominantní ani žádná jiná
      vlastní podmnožina $B\subsetneq A$ (byla by obsažena v nějakém
      $A\setminus\{x\}$). $A$ je tedy minimální dominantní množina. $\square$
    proof_steps:
      - 'Maximální nezávislá množina A je podle Věty 6.5 dominantní.'
      - 'Sporem předpokládáme, že A \ {x} je dominantní pro nějaké x ∈ A.'
      - 'Pak x musí mít souseda v A \ {x}, takže A obsahuje hranu – spor s nezávislostí.'
      - 'Protože nadmnožina dominantní množiny je dominantní, není dominantní žádná vlastní podmnožina A, tedy A je minimální dominantní.'
    related: [thm-6-5-maximalni-nezavisla-je-dominantni, rem-minimalni-dominantni-nemusi-byt-nezavisla, cor-6-2-gamma-le-alfa]
    illustrations:
      - title: Z maximální nezávislé nelze nic ubrat
        for: proof
        property: dominating-set
        graph:
          directed: false
          nodes:
            - { id: a, x: 5, y: 9.5 }
            - { id: b, x: 9, y: 7.25 }
            - { id: c, x: 9, y: 2.75 }
            - { id: d, x: 5, y: 0.5 }
            - { id: e, x: 1, y: 2.75 }
            - { id: f, x: 1, y: 7.25 }
          edges:
            - { from: a, to: b }
            - { from: b, to: c }
            - { from: c, to: d }
            - { from: d, to: e }
            - { from: e, to: f }
            - { from: f, to: a }
        steps:
          - caption: |
              $A = \{a, d\}$ je maximální nezávislá množina kružnice $C_6$, podle Věty 6.5 je tedy dominantní.
            set: [a, d]
          - caption: |
              Odebereme $a$. Aby $\{d\}$ zůstala dominantní, musel by mít $a$ souseda v $\{d\}$ – to by ale byla hrana uvnitř $A$. Dominance se proto rozbije přímo na uzlu $a$.
            set: [d]
          - caption: |
              Totéž pro jinou maximální nezávislou množinu $\{a, c, e\}$ – je dominantní …
            set: [a, c, e]
          - caption: |
              … a po odebrání $e$ zůstane nedominovaný právě uzel $e$: jeho sousedé $d, f$ v $A$ nebyli. $A$ je tedy **minimální** dominantní množina.
            set: [a, c]
    source: "skripta str. 40, Věta 6.6 s důkazem; folie TGD1-08 s. 3"
    supplemented: false

