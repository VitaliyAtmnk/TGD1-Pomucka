            - { from: "9", to: "7" }
            - { from: "8", to: "7" }
            - { from: "8", to: "6" }
            - { from: "7", to: "6" }
            - { from: "7", to: "5" }
            - { from: "6", to: "5" }
            - { from: "6", to: "4" }
            - { from: "5", to: "4" }
            - { from: "5", to: "3" }
            - { from: "4", to: "3" }
