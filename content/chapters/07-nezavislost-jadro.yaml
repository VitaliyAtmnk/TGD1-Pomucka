  - id: thm-6-8-acyklicky-graf-ma-jadro
    kind: theorem
    label: "Věta 6.8"
    section: "6.2"
    title: Každý acyklický graf má jádro
    terms: [jádro acyklického grafu, acyklický graf má jádro, kernel DAG, Grundyho funkce]
    statement: |
      Každý acyklický (orientovaný) graf má jádro.
    intuition: |
      V acyklickém grafu lze o příslušnosti k jádru rozhodovat „od konce":
      stoky do jádra patřit musí, a jakmile víme o všech následnících uzlu,
      je jeho osud jednoznačný – patří do jádra právě tehdy, když žádný jeho
      následník v jádru není. Grundyho funkce tento postup zobecňuje a nulové
      hodnoty tvoří jádro. Jako vedlejší produkt (doplněno): jádro acyklického
      grafu je **jediné**, protože v každém kroku je volba vynucená.
    proof: |
      Podle věty o acyklických grafech (viz [acyklický graf](#def-acyklicky-graf))
      lze uzly očíslovat $u_1,\dots,u_n$ tak, že pro každou hranu
      $(u_i,u_j)\in H(\vec G)$ je $i<j$. Definujme
      [Grundyho funkci](#def-grundyho-funkce) $f:U(\vec G)\to\mathbb N_0$
      odzadu:
      $$
      f(u_n)=0,\qquad f(u_i)=\min\{k\in\mathbb N_0;\ k\notin\{f(v_j);\ (u_i,v_j)\in H(\vec G)\}\},\quad i=n-1,\dots,1.
      $$
      Definice je korektní: všichni následníci $u_i$ mají větší index, takže
      jejich hodnoty už známe. Položme $C=\{x\in U(\vec G);\ f(x)=0\}$.

      *(i) Nezávislost.* Pro každou hranu $(x,y)$ je $f(y)$ jednou z hodnot
      následníků uzlu $x$, kdežto $f(x)$ je číslo mezi hodnotami následníků
      **chybějící**. Tedy $f(x)\ne f(y)$ pro každou hranu – speciálně žádná
      hrana nespojuje dva uzly s hodnotou $0$.

      *(ii) Absorpce.* Je-li $x\notin C$, je $f(x)\ge1$. Kdyby žádný následník
      $x$ neměl hodnotu $0$, bylo by $0$ nejmenší chybějící číslo a $f(x)=0$.
      Existuje tedy následník $y$ s $f(y)=0$, tj. hrana $(x,y)$ s $y\in C$.

      $C$ je proto jádro. $\square$
    proof_steps:
      - 'Uzly acyklického grafu očíslujeme topologicky: každá hrana vede z menšího indexu do většího.'
      - 'Odzadu definujeme Grundyho funkci: f(u_i) je nejmenší nezáporné celé číslo, které není hodnotou žádného následníka (f(u_n) = 0).'
      - 'Položíme C = množina uzlů s hodnotou f = 0.'
      - 'Pro každou hranu (x, y) je f(x) ≠ f(y), protože f(y) mezi hodnotami následníků x je, kdežto f(x) ne; proto je C nezávislá.'
      - 'Má-li x hodnotu f(x) ≥ 1, musí mít následníka s hodnotou 0, jinak by f(x) = 0; proto z každého uzlu mimo C vede hrana do C.'
      - 'C je nezávislá a absorbující, tedy jádro.'
    related: [def-grundyho-funkce, alg-jadro-acyklickeho-grafu, def-acyklicky-graf, thm-6-9-graf-bez-lichych-cyklu-ma-jadro]
    illustrations:
      - title: Rozhodujeme od výstupních uzlů
        for: proof
        property: kernel
        graph:
          directed: true
          nodes:
            - { id: a, x: 0.5, y: 5 }
            - { id: b, x: 3, y: 1.5 }
            - { id: c, x: 3, y: 8.5 }
            - { id: d, x: 6.5, y: 1.5 }
            - { id: e, x: 6.5, y: 8.5 }
            - { id: f, x: 9.5, y: 5 }
          edges:
            - { from: a, to: b }
            - { from: a, to: c }
            - { from: b, to: d }
            - { from: c, to: d }
            - { from: c, to: e }
            - { from: d, to: f }
            - { from: e, to: f }
        steps:
          - caption: |
              Výstupní uzel $f$ nemá následníky, takže hranou do jádra být pohlcen nemůže – patří do $C$. O ostatních uzlech zatím nevíme, jádro to ještě není.
            set: [f]
            labels: { f: "∈ C" }
          - caption: |
              $d$ i $e$ mají hranu do $f \in C$: do $C$ nesmějí (nezávislost) a zároveň už jsou pohlceny.
            set: [f]
            labels: { f: "∈ C", d: "∉", e: "∉" }
          - caption: |
              Jediný následník $b$ je $d \notin C$. Kdyby $b$ zůstal mimo, nebyl by ničím pohlcen – musí tedy do $C$. Zbývá rozhodnout $c$ a $a$.
            set: [b, f]
            labels: { f: "∈ C", d: "∉", e: "∉", b: "∈ C" }
          - caption: |
              Oba následníci $c$ ($d$, $e$) leží mimo $C$, proto $c \in C$. Množina $\{b, c, f\}$ je nezávislá i absorbující.
            set: [b, c, f]
            labels: { f: "∈ C", d: "∉", e: "∉", b: "∈ C", c: "∈ C" }
          - caption: |
              Nakonec $a$ má hranu do $b \in C$, takže $a \notin C$. Jádro $\{b, c, f\}$ – a protože každé rozhodnutí bylo vynucené, je to **jediné** jádro tohoto grafu.
            set: [b, c, f]
            labels: { f: "∈ C", d: "∉", e: "∉", b: "∈ C", c: "∈ C", a: "∉" }
    source: "skripta str. 43, Věta 6.8 s důkazem (ověření, že C je jádro, doplněno); folie TGD1-08 s. 5"
    supplemented: false

  - id: def-grundyho-funkce
    kind: definition
    label: "Grundyho funkce (důkaz Věty 6.8)"
    section: "6.2"
    title: Grundyho funkce
    terms: [Grundyho funkce, Grundyho číslo, Sprague-Grundy, mex, minimum excludant, Grundy function]
    statement: |
      Nechť $\vec G$ je acyklický graf s uzly očíslovanými $u_1,\dots,u_n$ tak,
      že každá hrana vede z uzlu s menším indexem do uzlu s větším indexem.
      **Grundyho funkce** je ohodnocení $f:U(\vec G)\to\mathbb N_0$ dané
      předpisem
      $$
      f(u_n)=0,\qquad f(u_i)=\min\{k\in\mathbb N_0;\ k\notin\{f(v_j);\ (u_i,v_j)\in H(\vec G)\}\},\quad i=n-1,\dots,1.
      $$
    intuition: |
      Hodnota uzlu je nejmenší nezáporné celé číslo, které se **nevyskytuje**
      mezi hodnotami jeho následníků (tzv. *mex* – minimum excludant).
      Každý stok má hodnotu $0$ (mex prázdné množiny). Uzly s hodnotou $0$
      tvoří jádro ([Věta 6.8](#thm-6-8-acyklicky-graf-ma-jadro)); v teorii
      her jsou to „prohrávající pozice pro hráče na tahu". Například u hry
      s odebíráním 1 nebo 2 zápalek je $f(i)=i \bmod 3$.
    examples:
      - title: Výpočet mex
        body: |
          Má-li uzel následníky s hodnotami $\{0,1,3\}$, je jeho hodnota $2$.
          S hodnotami $\{1,2\}$ je hodnota $0$ (uzel patří do jádra). Bez
          následníků je hodnota $0$.
