  - id: cor-6-2-gamma-le-alfa
    kind: corollary
    label: "Důsledek 6.2"
    section: "6.1"
    title: "γ(G) ≤ α(G)"
    terms: [gama menší než alfa, číslo dominance a nezávislost, domination number independence number]
    statement: |
      Pro každý graf $G$ platí $\gamma(G) \le \alpha(G)$.
    intuition: |
      Největší nezávislá množina je zároveň dominantní, takže nejmenší
      dominantní množina nemůže být větší. Nerovnost může být rovností
      ($C_5$) i hodně ostrá (hvězda: $\gamma=1$, $\alpha=n$).
    proof: |
      Nechť $A$ je největší nezávislá množina, $|A|=\alpha(G)$. Největší
      nezávislá množina je zřejmě i maximální, a proto je podle
      [Věty 6.5](#thm-6-5-maximalni-nezavisla-je-dominantni) dominantní.
      Nejmenší dominantní množina má tedy nejvýše $|A|$ prvků:
      $\gamma(G)\le|A|=\alpha(G)$. $\square$
    proof_steps:
      - 'Vezmeme největší nezávislou množinu A, |A| = α(G).'
      - 'A je i maximální nezávislá, a tedy podle Věty 6.5 dominantní.'
      - 'Nejmenší dominantní množina nemá více prvků než A, proto γ(G) ≤ α(G).'
    examples:
      - title: Rovnost i ostrá nerovnost
        body: |
          1. $C_5$: $\alpha=\gamma=2$ (např. dva nesousední uzly dominují vše).
          2. $C_6$: $\alpha=3$ (každý druhý uzel), ale $\gamma=2$ (dva protilehlé uzly).
          3. Hvězda $K_{1,n}$: $\alpha=n$ (všechny listy), $\gamma=1$ (střed).
    related: [thm-6-5-maximalni-nezavisla-je-dominantni, def-cislo-dominance, def-nezavislost-grafu]
    source: "skripta str. 40–41, Důsledek 6.2 + příklady; folie TGD1-08 s. 3"
    supplemented: false

  - id: def-jadro-neorientovaneho-grafu
    kind: definition
    label: "Definice 6.10"
    section: "6.1"
    title: Jádro (neorientovaného) grafu
    terms: [jádro grafu, jádro neorientovaného grafu, kernel, nezávislá dominantní množina, independent dominating set]
    statement: |
      Množina uzlů $C \subset U(G)$, která je současně nezávislá i dominantní,
      se nazývá **jádro** grafu $G$.
    intuition: |
      Jádro spojuje dvě protichůdné požadavky: uzlů nesmí být „moc"
      (nezávislost – žádné dva nesousedí) ani „málo" (dominance – každý
      ostatní má souseda v jádru). Podle
      [Věty 6.5](#thm-6-5-maximalni-nezavisla-je-dominantni) jsou jádra
      neorientovaného grafu **přesně maximální nezávislé množiny**. Jádro
      obvykle není jediné (např. v $C_6$ je jádrem $\{1,3,5\}$ i $\{1,4\}$).
    related: [thm-6-7-kazdy-neorientovany-graf-ma-jadro, thm-6-5-maximalni-nezavisla-je-dominantni, def-jadro-orientovaneho-grafu]
    illustrations:
      - title: Ani moc, ani málo
        for: statement
        property: kernel
        graph:
          directed: false
          nodes:
            - { id: t, x: 5, y: 9.5 }
            - { id: a, x: 2, y: 6.5 }
            - { id: b, x: 8, y: 6.5 }
            - { id: c, x: 2, y: 1 }
            - { id: d, x: 8, y: 1 }
          edges:
            - { from: t, to: a }
            - { from: t, to: b }
            - { from: a, to: b }
            - { from: a, to: c }
            - { from: b, to: d }
            - { from: c, to: d }
        steps:
          - caption: |
              V „domečku“ je $\{t, c\}$ nezávislá ($t$ a $c$ nesousedí) i dominantní ($t$ hlídá $a, b$, uzel $c$ hlídá $d$) – je to **jádro**.
            set: [t, c]
          - caption: |
              Jádro není jediné: $\{a, d\}$ je také nezávislá a dominantní. Jádra neorientovaného grafu jsou přesně jeho maximální nezávislé množiny.
            set: [a, d]
          - caption: |
              Uzlů je **málo**: samotné $\{t\}$ je nezávislé, ale $c$ ani $d$ nemají souseda v množině.
            set: [t]
          - caption: |
              Uzlů je **moc**: $\{t, c, d\}$ už dominuje všem, ale hrana $cd$ porušuje nezávislost.
            set: [t, c, d]
    source: "skripta str. 41, Definice 6.10; folie TGD1-08 s. 3"
    supplemented: false

  - id: thm-6-7-kazdy-neorientovany-graf-ma-jadro
    kind: theorem
    label: "Věta 6.7"
    section: "6.1"
    title: Každý neorientovaný graf má jádro
    terms: [existence jádra neorientovaného grafu, každý graf má jádro]
    statement: |
      Každý neorientovaný graf má jádro.
    intuition: |
      Stačí vzít libovolnou maximální nezávislou množinu – ta vždy existuje
      (hladově přidáváme uzly, dokud to jde) a je automaticky dominantní.
      U orientovaných grafů to tak snadné není – orientace hran rozbije
      symetrii a [lichý cyklus jádro nemá](#prop-lichy-cyklus-nema-jadro).
    proof: |
      Prázdná množina je nezávislá a graf je konečný, takže ji lze rozšiřovat
      o další uzly, dokud to jde; postup skončí v nějaké maximální nezávislé
      množině $A$ (prakticky ji najde
      [hladový algoritmus](#alg-maximalni-nezavisla-mnozina)). Podle
      [Věty 6.6](#thm-6-6-maximalni-nezavisla-minimalni-dominantni)
      (resp. 6.5) je $A$ dominantní. $A$ je tedy nezávislá i dominantní, tj.
      jádro. $\square$
    proof_steps:
      - 'Začneme prázdnou (nezávislou) množinou a přidáváme uzly, dokud zůstává nezávislá.'
      - 'Graf je konečný, proto skončíme u maximální nezávislé množiny A.'
      - 'Podle Věty 6.5/6.6 je A dominantní.'
      - 'A je nezávislá i dominantní, tedy jádro.'
    related: [def-jadro-neorientovaneho-grafu, alg-maximalni-nezavisla-mnozina, thm-6-6-maximalni-nezavisla-minimalni-dominantni]
    source: "skripta str. 41, Věta 6.7 s důkazem; folie TGD1-08 s. 3"
    supplemented: false

  - id: alg-maximalni-nezavisla-mnozina
    kind: algorithm
    label: "Algoritmus (maximální nezávislá množina)"
    section: "6.1"
    title: Hladový algoritmus pro maximální nezávislou množinu (jádro)
    terms: [hladový algoritmus nezávislá množina, maximální nezávislá množina algoritmus, nalezení jádra neorientovaného grafu, greedy maximal independent set, heuristika pro alfa]
    statement: |
      Vstup: neorientovaný graf $G$. Výstup: maximální nezávislá množina $X$
      (tj. jádro grafu $G$).
    pseudocode: |
      1. $X := \emptyset$, $Y := U(G)$.
      2. Dokud je $Y \ne \emptyset$, prováděj krok 3.
      3. Zvol $x \in Y$, polož $X := X \cup \{x\}$ a z $Y$ vynech $x$ a všechny
         uzly s ním sousední.
      4. Vrať $X$.
    complexity: "$O(n+m)$ při reprezentaci seznamy sousedů ($O(n^2)$ s maticí sousednosti)"
    intuition: |
      $Y$ jsou uzly, které lze ještě přidat bez porušení nezávislosti. Po výběru
      $x$ vyřadíme jeho sousedy – ti už do $X$ nesmí. Na konci byl každý uzel
      mimo $X$ vyřazen jako soused nějakého vybraného uzlu, takže $X$ je
      dominantní, a podle Věty 6.5 tedy maximální nezávislá (jádro).

      **Korektnost:** invariant „$X$ je nezávislá a žádný uzel z $Y$ nesousedí
      s $X$" platí na začátku a krok 3 ho zachovává.

      **Složitost:** každý uzel je z $Y$ vyřazen právě jednou; při výběru $x$
      projdeme jeho seznam sousedů, takže každá hrana se zpracuje $O(1)$-krát.
      Celkem $O(n+m)$.

      **Jako heuristika** pro $\alpha(G)$ dává dolní odhad $\alpha(G)\ge|X|$;
      výsledek ale silně závisí na volbě $x$. Osvědčená varianta (doplněno):
      volit uzel s nejmenším stupněm v aktuálním zbytku grafu – vyřadí nejméně
      dalších kandidátů.
    examples:
      - title: Dva běhy na trojúhelníkové mřížce
        body: |
          Graf je trojúhelníková mřížka z [Definice 6.2](#def-nezavislost-grafu).

          *Běh 1:* zvolíme $m_1$ → vyřadíme $m_1,m_2,t_1,b_1$. Zvolíme $m_3$
          → vyřadíme $m_3,m_4,t_2,t_3,b_2,b_3$. $Y=\emptyset$, výsledek
          $X=\{m_1,m_3\}$ – maximální, ale jen 2 prvky.

          *Běh 2:* zvolíme $t_1$ (stupeň 3) → vyřadíme $t_1,t_2,m_1,m_2$.
          Zvolíme $t_3$ → vyřadíme $t_3,m_3,m_4$. Zvolíme $b_1$ → vyřadíme
          $b_1,b_2$. Zvolíme $b_3$. Výsledek $X=\{t_1,t_3,b_1,b_3\}$ –
          největší, $|X|=\alpha(G)=4$ (vyznačeno).
        graph:
          directed: false
          nodes:
            - { id: t1, x: 3, y: 8, color: 1 }
            - { id: t2, x: 5, y: 8 }
            - { id: t3, x: 7, y: 8, color: 1 }
            - { id: m1, x: 2, y: 5 }
            - { id: m2, x: 4, y: 5 }
            - { id: m3, x: 6, y: 5 }
            - { id: m4, x: 8, y: 5 }
            - { id: b1, x: 3, y: 2, color: 1 }
            - { id: b2, x: 5, y: 2 }
            - { id: b3, x: 7, y: 2, color: 1 }
          edges: *mrizka
    visualization: independent-set
    related: [thm-6-7-kazdy-neorientovany-graf-ma-jadro, thm-6-5-maximalni-nezavisla-je-dominantni, rem-np-uplnost-nezavislosti, alg-nejvetsi-nezavisla-mnozina-hrubou-silou]
    source: "folie TGD1-08 s. 4 (algoritmus); skripta str. 41, poznámka za Větou 6.7"
    supplemented: false

  - id: rem-np-uplnost-nezavislosti
    kind: remark
    section: "6.1"
    title: NP-úplnost nezávislosti, klikovosti, pokrytí a dominance
    terms: [NP-úplnost nezávislé množiny, IND, CLIQUE, vertex cover NP, dominance NP-těžká, heuristika]
    statement: |
      Rozhodnout, zda v daném grafu $G$ existuje nezávislá množina předepsané
      velikosti, je klasický **NP-úplný** problém (podrobně v kapitole 9,
      [NP-úplnost IND](#thm-ind-npc)); nejsou proto známy efektivní algoritmy
      pro výpočet $\alpha(G)$. Naproti tomu nalezení **maximální** nezávislé
      množiny je snadné [hladovým algoritmem](#alg-maximalni-nezavisla-mnozina).
      Ten je zároveň polynomiálním algoritmem pro nalezení jádra
      neorientovaného grafu a heuristikou dávající dolní odhad $\alpha(G)$.

      Obdobná je situace s klikovostí, dominancí a pokrývacím číslem: vždy lze
      snadno v polynomiálním čase najít maximální (klika), resp. minimální
      (pokrytí, dominantní množina) množinu, zatímco příslušná otázka pro
      největší, resp. nejmenší množinu je NP-těžká.
    intuition: |
      Polynomiální „lokální" postupy (doplněno):

      - *maximální klika*: hladově přidávej uzel sousedící se všemi dosud
        vybranými (= hladový algoritmus pro nezávislou množinu v $\bar G$);
      - *minimální pokrytí*: začni s $U(G)$ a odebírej uzly, dokud zbytek
        pokrývá všechny hrany (= doplněk maximální nezávislé množiny);
      - *minimální dominantní množina*: začni s $U(G)$ a odebírej uzly, dokud
        zůstává dominantní.

      Všechny běží v čase $O(n\cdot(n+m))$ nebo lépe. Pro bipartitní grafy je
      dokonce $\beta(G)$ (a tedy i $\alpha(G)$) polynomiální – podle Kőnigovy
      věty se rovná velikosti největšího párování (doplněno).
    related: [thm-ind-npc, thm-clique-npc, thm-cov-npc, alg-maximalni-nezavisla-mnozina, rem-slozitost-nezavisle-mnoziny]
    source: "skripta str. 41, poznámka za Větou 6.7; folie TGD1-08 s. 4"
    supplemented: false

  - id: alg-nejvetsi-nezavisla-mnozina-hrubou-silou
    kind: algorithm
    section: "6.1"
    title: Výpočet α(G) hrubou silou a větvením
    terms: [největší nezávislá množina algoritmus, výpočet alfa, hrubá síla, exponenciální algoritmus, maximum independent set exact algorithm, větvení]
    statement: |
      Vstup: graf $G$ s $n$ uzly. Výstup: největší nezávislá množina, tedy
      $\alpha(G)$; z ní pak $\beta(G)=n-\alpha(G)$ a $\omega(G)=\alpha(\bar G)$.
    pseudocode: |
      **Varianta A – hrubá síla:**

      1. Pro $k = n, n-1, \dots, 1$:
      2. &nbsp;&nbsp;pro každou $k$-prvkovou množinu $A\subset U(G)$ ověř, zda je
         nezávislá (projdi všechny dvojice, $O(k^2)$);
      3. &nbsp;&nbsp;první nalezená nezávislá $A$ je největší → vrať $A$ ($\alpha(G)=k$).

      **Varianta B – větvení podle uzlu:**

      1. Je-li $H(G)=\emptyset$, vrať $U(G)$.
      2. Zvol uzel $v$ s aspoň jedním sousedem.
      3. Rekurzivně spočti $A_1$ pro $G-v$ (uzel $v$ do množiny nedáme)
         a $A_2=\{v\}\cup$ výsledek pro $G-N[v]$ ($v$ dáme, jeho uzavřené
         okolí $N[v]$ odstraníme).
      4. Vrať větší z $A_1$, $A_2$.
    complexity: "$O(2^n\\cdot n^2)$ (exponenciální); polynomiální algoritmus není znám (NP-těžké)"
    intuition: |
      Varianta A zkouší všech $2^n$ podmnožin – to je „hrubá síla", o které
      mluví skripta. Varianta B využívá rekurenci
      $\alpha(G)=\max\{\alpha(G-v),\ 1+\alpha(G-N[v])\}$: buď $v$ v optimu není,
      nebo je a pak tam nesmí být žádný jeho soused. Volíme-li $v$ s velkým
      stupněm, druhá větev odstraní mnoho uzlů a strom rekurze je výrazně menší
      než $2^n$ – stále ale exponenciální. Jde o přirozený protějšek NP-úplnosti
      problému IND ([kap. 9](#thm-ind-npc)).
    related: [rem-slozitost-nezavisle-mnoziny, rem-np-uplnost-nezavislosti, cor-6-1-alfa-plus-beta, thm-6-4-alfa-omega-doplnku, thm-ind-npc]
    source: "skripta str. 37 (poznámka o hrubé síle $O(2^n)$); pseudokód doplněn"
    supplemented: true

