      - title: Hra s cyklem a dvěma jádry
        body: |
          $Z$ je začátek, $K$ konec hry, vyhrává ten, kdo první táhne do $K$.
          Hrany: $Z\to b$, $b\to a$, $b\to d$, $a\to c$, $a\to d$, $c\to d$,
