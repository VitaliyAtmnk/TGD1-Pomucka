              Strom DFS ze $s$ (čísla = pořadí objevení, sousedé abecedně). DFS jde pořád hlouběji, takže strom je tu dokonce cesta. Chordy $b\,s$, $c\,a$, $f\,d$ vedou všechny do **předka**.
