          - caption: |
              DFS z kořene $a$ (sousedé abecedně); čísla jsou pořadí $p(x)$. Chordy $c\,a$ a $f\,d$ vedou do předků.
            edges: { a-b: tree, b-c: tree, c-d: tree, d-e: tree, e-f: tree, a-g: tree, a-c: back, d-f: back }
