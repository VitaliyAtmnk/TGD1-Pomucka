  - id: def-strom-prohledavani
    kind: definition
    section: "5.1"
    title: Strom prohledávání, chordy, zpětný krok
    terms:
      - strom prohledávání
      - les prohledávání
      - DFS strom
      - chorda
      - zpětná hrana
      - back edge
      - tree edge
      - zpětný krok
      - objevení nového uzlu
    statement: |
      Kroky prohledávání do hloubky jsou trojího typu:

      a) **objevení nového uzlu**,
      b) **nalezení hrany do již existujícího uzlu**,
      c) **zpětný krok**.

      Hrany prohledávané v krocích a) tvoří strom zvaný **strom prohledávání** (pro
      nesouvislé grafy les prohledávání). Hrany prohledávané v krocích b) se nazývají
      **chordy**. Obvykle se oba druhy hran chápou jako orientované ve směru prohledávání;
      zpětné kroky pak jdou vždy po hranách stromu proti jejich orientaci.
    intuition: |
      Strom prohledávání je kostra (každé komponenty), kterou si DFS „vyšlape“. Chordy jsou
      zbylé hrany – každá z nich uzavírá s cestou ve stromu kružnici. V DFS na neorientovaném
      grafu vede každá chorda z uzlu do některého jeho **předka**: když DFS objeví uzel $y$,
      projde celý podstrom pod $y$ dřív, než se vrátí, takže všechny hrany z podstromu
      buď vedou do podstromu, nebo do uzlů na aktuální cestě (předků).

      Na této vlastnosti stojí Tarjanův algoritmus pro artikulace a bloky.
    examples:
      - title: Strom a chordy z příkladu DFS
        body: |
          Orientované hrany stromu (z otce do syna): $1\to2$, $2\to3$, $3\to5$, $5\to4$,
          $5\to6$, $6\to7$, $1\to8$, $8\to9$, $9\to10$, $8\to11$, $12\to13$.
          Chordy (z potomka do předka): $3\to1$, $5\to2$, $4\to2$, $7\to5$, $9\to1$,
          $10\to8$.
    visualization: graph-search
    related: [alg-dfs, alg-artikulace-tarjan, prop-kriterium-artikulace, prop-test-acyklicnosti]
    illustrations:
