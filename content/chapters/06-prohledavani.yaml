  - number: "5.4"
    title: Backtracking pro generování hamiltonovských cest a cyklů
  - number: "5.5"
    title: Heuristiky pro hledání hamiltonovské kružnice
items:
  # ------------------------------------------------------------------ 5.1
  - id: alg-prohledavani
    kind: algorithm
    label: "Algoritmus 5.1"
    section: "5.1"
    title: Obecný algoritmus prohledávání grafu
    terms:
      - prohledávání grafu
      - procházení grafu
      - graph search
      - graph traversal
      - množiny N, M, D
    statement: |
      Úkolem je systematicky probrat všechny uzly a hrany (neorientovaného) grafu $G$
      a případně na nich provést nějaký úkol. Algoritmus udržuje tři množiny:

      * $N$ – uzly, které ještě nebyly probrány (nedosažené),
      * $M$ – hrany, které ještě nebyly probrány,
      * $D$ – uzly, kterých již bylo dosaženo, ale ze kterých ještě mohou vést
        neprobrané hrany („aktivní“ uzly).
    intuition: |
      Představte si průzkum bludiště s křídou: $D$ jsou rozcestí, odkud ještě vedou
      neprošlé chodby. Pokaždé vyberete jedno takové rozcestí, projdete z něj jednu novou
      chodbu, a pokud vede na nové místo, přidáte ho k aktivním. Rozcestí bez neprošlých
      chodeb vyškrtnete. Když už aktivní nic není, ale v grafu zbyly neobjevené uzly,
      začnete znovu v nové komponentě.

      Algoritmus je záměrně **nedeterministický** v kroku 4 (volba $w \in D$) – konkrétní
      volbou z něj vznikne BFS ($D$ jako fronta) nebo DFS ($D$ jako zásobník).
    pseudocode: |
      1. **Inicializace:** $N := U(G)$, $M := H(G)$, $D := \emptyset$.
      2. **Test ukončení:** je-li $N = \emptyset$, výpočet končí.
      3. **Volba prvního uzlu v komponentě:** zvol $v \in N$ a polož $N := N \setminus \{v\}$, $D := \{v\}$.
      4. **Volba počátečního uzlu hrany:** zvol libovolně $w \in D$.
      5. **Test použitelnosti $w$:** hledej hranu v $M$ obsahující $w$.
         * neexistuje: $D := D \setminus \{w\}$; je-li $D = \emptyset$, jdi na 2, jinak jdi na 4;
         * existuje: jdi na 6.
      6. Zvol takovou hranu $h = \{w, z\} \in M$, „projdi“ ji (proveď na ní určený úkol)
         a polož $M := M \setminus \{h\}$; je-li $z \in N$, polož $N := N \setminus \{z\}$,
         $D := D \cup \{z\}$. Jdi na 4.
    complexity: |
      $O(n + m)$ při reprezentaci grafu seznamy sousedů (viz [Věta 5.1](#thm-prohledavani-linearni)).
      Každý uzel vstoupí do $D$ a opustí ho jen jednou, každá hrana se z $M$ odebere jen
      jednou. S maticí sousednosti by hledání hran v kroku 5 stálo celkem $O(n^2)$.
    examples:
      - title: Co znamená „projít hranu“
        body: |
          Úkol v kroku 6 je libovolný: označit hranu jako stromovou / chordu, zapsat uzlu
          $z$ číslo komponenty, vzdálenost od počátku, pořadové číslo $p(z)$, aktualizovat
          dolní čísla $r(\cdot)$ apod. Tak vznikají všechny algoritmy této kapitoly.
    visualization: graph-search
    related: [thm-prohledavani-linearni, rem-prohledavani-implementace, alg-bfs, alg-dfs, prop-komponenty-linearne]
    source: "skripta str. 29; přednáška 7, fólie 1"

  - id: thm-prohledavani-linearni
    kind: theorem
    label: "Věta 5.1"
    section: "5.1"
    title: Prohledávání grafu v lineárním čase
    terms:
      - složitost prohledávání
      - O(n+m)
      - lineární čas
      - časová složitost BFS
      - časová složitost DFS
    statement: |
      Algoritmus 5.1 prohledá graf $G$ v čase $O(n + m)$, kde $n$ je počet uzlů
      a $m$ počet hran grafu $G$.
    intuition: |
      Lineární čas je nejlepší možný – každý uzel a každou hranu se musíme aspoň jednou
      „podívat“. Předpokladem je rozumná reprezentace: seznamy sousedů a u každého uzlu
      ukazatel na první dosud neprozkoumaného souseda, takže krok 5 nikdy neprochází
      tutéž položku seznamu dvakrát.
    proof: |
      *Důkaz ve skriptech není („snadno se ověří“), doplněno.*

      Předpokládejme, že graf je zadán seznamy sousedů, každý uzel má ukazatel na první
      dosud nezkoumanou položku svého seznamu a u hran si pamatujeme příznak „probrána“
      (odebrání z $M$ je $O(1)$).

      * Kroky 2 a 3 se provedou nejvýše $(n + 1)$-krát, protože každé provedení kroku 3
        odebere uzel z $N$.
      * Každý uzel vstoupí do $D$ právě jednou (v kroku 3 nebo 6, a to při odebrání z $N$)
        a právě jednou z něj odejde (v kroku 5). Neúspěšný test v kroku 5 tedy nastane
        nejvýše $n$-krát.
      * Úspěšný test v kroku 5 vede na krok 6, který odebere hranu z $M$; to nastane
        nejvýše $m$-krát.
      * Hledání v kroku 5 posouvá ukazatel v seznamu sousedů uzlu $w$ a přeskakuje už
        probrané hrany; každá položka seznamu se přeskočí nejvýše jednou. Součet délek
        všech seznamů je $2m$.

      Kroky 4–6 se tedy provedou $O(n + m)$-krát, s celkovou prací na hledání $O(n + m)$,
      a celkový čas je $O(n + m)$.
    proof_steps:
      - Graf reprezentujeme seznamy sousedů s ukazatelem na první nezkoumaného souseda u každého uzlu.
      - Krok 3 odebírá uzel z $N$, takže kroky 2–3 proběhnou nejvýše $n+1$-krát.
      - Každý uzel do $D$ vstoupí i z něj odejde jen jednou, takže neúspěšných testů v kroku 5 je nejvýše $n$.
      - Každý úspěšný test vede ke kroku 6, který odebere hranu z $M$, takže úspěšných testů je nejvýše $m$.
      - Ukazatele v seznamech sousedů se jen posouvají vpřed, celkem o nejvýše $2m$ položek, a celkový čas je $O(n+m)$.
    related: [alg-prohledavani, prop-komponenty-linearne]
    source: "skripta str. 29 (bez důkazu); přednáška 7, fólie 2"

  - id: rem-prohledavani-implementace
    kind: remark
    label: "Poznámka (str. 29)"
    section: "5.1"
    title: Ukončení a možné implementace volby uzlu
    terms:
      - fronta
      - zásobník
      - queue
      - stack
      - volba uzlu z D
    statement: |
      1. Krok 2 je skutečně testem ukončení: v tomto bodě je vždy $D = \emptyset$, takže
         není co dál prohledávat.
      2. V kroku 4 jsou v zásadě tři možné implementace volby $w \in D$:
         * volit náhodně,
         * brát uzel, který je v $D$ **nejdéle** – $D$ je **fronta**; vznikne
           **prohledávání do šířky**,
         * brát uzel, který je v $D$ **nejkratší dobu** – $D$ je **zásobník**; vznikne
           **prohledávání do hloubky**.
    intuition: |
      Fronta = „kdo dřív přijde, ten dřív mele“ – prohledávání se šíří ve vlnách od
      počátku. Zásobník = „naposledy objevený jde první na řadu“ – prohledávání se noří
      co nejhlouběji a vrací se, až když nemůže dál. Oba postupy dávají o grafu mnoho
      informací (vzdálenosti, resp. artikulace a bloky).
    related: [alg-prohledavani, alg-bfs, alg-dfs]
    source: "skripta str. 29"

  - id: alg-bfs
    kind: algorithm
    section: "5.1"
    title: Prohledávání do šířky (BFS)
    terms:
      - prohledávání do šířky
      - BFS
      - breadth-first search
      - fronta
      - vlna
      - vzdálenost od počátečního uzlu
    statement: |
      Prohledávání do šířky je Algoritmus 5.1, v němž je množina $D$ realizována jako
      **fronta**: v kroku 4 se vždy volí uzel, který je v $D$ nejdéle, a nově dosažené
      uzly se zařazují na konec. (Jsou-li možnosti volby, budeme pro jednoznačnost volit
      uzel s nejmenším číslem.)
    intuition: |
      BFS probírá uzly postupně **podle vzdálenosti** od počátečního uzlu: nejprve všechny
      uzly ve vzdálenosti 1, pak ve vzdálenosti 2 atd. Proto se hodí na hledání nejkratších
      cest v neohodnoceném grafu (počet hran) – vzdálenost uzlu $z$ je o 1 větší než
      vzdálenost uzlu $w$, z něhož byl objeven. Hrany, po nichž byly uzly objeveny, tvoří
      strom nejkratších cest.
    pseudocode: |
      1. Všechny uzly jsou neobjevené; fronta $D$ je prázdná.
      2. Pokud neobjevený uzel neexistuje, konec. Jinak vezmi neobjevený uzel $v$, označ ho jako objevený a vlož do $D$.
      3. Dokud $D \ne \emptyset$: nechť $w$ je **první** uzel fronty.
         * Má-li $w$ neprobranou hranu $\{w, z\}$: projdi ji, označ jako probranou; je-li $z$ neobjevený, označ ho a **zařaď na konec** fronty.
         * Jinak $w$ z fronty odeber.
      4. Jdi na 2 (další komponenta).
    complexity: |
      $O(n + m)$ – je to speciální případ Algoritmu 5.1 (fronta má operace v čase $O(1)$).
    examples:
      - title: BFS na grafu se 13 uzly
        body: |
          Začínáme v uzlu 1, při více možnostech volíme nejmenší číslo. Stav fronty $D$,
          zpracovávaný uzel $w$ a procházená hrana:

          | $D$ | $w$ | hrana |
          |---|---|---|
          | 1 | 1 | 12 |
          | 1, 2 | 1 | 13 |
          | 1, 2, 3 | 1 | 18 |
          | 1, 2, 3, 8 | 1 | 19 |
          | 1, 2, 3, 8, 9 | 1 | – (odeber 1) |
          | 2, 3, 8, 9 | 2 | 23, 24, 25 |
          | 2, 3, 8, 9, 4, 5 | 2 | – |
          | 3, 8, 9, 4, 5 | 3 | 35, pak – |
          | 8, 9, 4, 5 | 8 | 89, 8 10, 8 11, pak – |
          | 9, 4, 5, 10, 11 | 9 | 9 10, pak – |
          | 4, 5, 10, 11 | 4 | 45, pak – |
          | 5, 10, 11 | 5 | 56, 57, pak – |
          | 10, 11, 6, 7 | 10, 11 | – |
          | 6, 7 | 6 | 67, pak – |
          | 7 | 7 | – |
          | $\emptyset$ | | |

          Fronta je prázdná, ale uzly 12 a 13 nebyly probrány: krok 2 zvolí uzel 12,
          projde se hrana 12 13 a výpočet skončí. Pořadí objevení
          $1, 2, 3, 8, 9, 4, 5, 10, 11, 6, 7$ odpovídá vzdálenostem od uzlu 1:
          vzdálenost 1 mají $2, 3, 8, 9$, vzdálenost 2 mají $4, 5, 10, 11$,
          vzdálenost 3 mají $6, 7$.
