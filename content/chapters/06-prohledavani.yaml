  - id: prop-komponenty-linearne
    kind: proposition
    label: "Tvrzení 5.1"
    section: "5.1"
    title: Komponenty v lineárním čase
    terms:
      - nalezení komponent
      - komponenty souvislosti
      - connected components
      - test souvislosti
    statement: |
      Komponenty grafu lze nalézt v čase $O(m + n)$.
    intuition: |
      Každý průchod krokem 3 Algoritmu 5.1 zahajuje novou komponentu – stačí uzlům při
      objevení zapisovat číslo aktuální komponenty. Speciálně lze v čase $O(n + m)$
      rozhodnout, zda je graf souvislý (krok 3 proběhne právě jednou).
    proof: |
      Spustíme Algoritmus 5.1 s čítačem $c := 0$; při každém provedení kroku 3 zvýšíme
      $c$ o 1 a uzlu $v$ přiřadíme číslo $c$; při zařazení uzlu $z$ do $D$ v kroku 6 mu
      přiřadíme aktuální $c$.

      Mezi dvěma provedeními kroku 3 algoritmus prochází jen hrany z uzlů v $D$, takže
      objeví přesně uzly dosažitelné z $v$, tj. celou komponentu uzlu $v$ (každý dosažitelný
      uzel je objeven, protože $D$ se vyprázdní až po probrání všech hran z dosažených uzlů;
      nedosažitelný uzel objeven být nemůže, protože se jde jen po hranách). Uzly se stejným
      číslem tedy tvoří komponentu. Přidaná práce je $O(1)$ na uzel, takže podle
      [Věty 5.1](#thm-prohledavani-linearni) je celkový čas $O(m + n)$.
    proof_steps:
      - V Algoritmu 5.1 přiřazujeme objeveným uzlům číslo komponenty, které zvyšujeme při každém kroku 3.
      - Mezi dvěma kroky 3 se objeví právě uzly dosažitelné z uzlu $v$ zvoleného v kroku 3.
      - Každý dosažitelný uzel je objeven, protože $D$ se vyprázdní až po probrání všech hran z dosažených uzlů.
      - Uzly se stejným číslem tvoří tedy komponentu a celkový čas je podle Věty 5.1 $O(m+n)$.
    related: [alg-prohledavani, thm-prohledavani-linearni]
    source: "skripta str. 32; přednáška 7, fólie 2"

  - id: prop-test-acyklicnosti
    kind: proposition
    section: "5.1"
    title: Test acykličnosti (les) prohledáváním
    terms:
      - test acykličnosti
      - je graf les
      - je graf strom
      - hledání kružnice
      - cycle detection
    statement: |
      Graf $G$ neobsahuje kružnici (je lesem), právě když Algoritmus 5.1 (např. DFS
      nebo BFS) nenalezne žádnou chordu, tj. každá procházená hrana vede do dosud
      nedosaženého uzlu. Ekvivalentně $m = n - c$, kde $c$ je počet komponent.
      Test lze provést v čase $O(n + m)$ (dokonce $O(n)$, pokud se zastavíme u první
      chordy), a je-li chorda nalezena, poskytne i konkrétní kružnici.
    intuition: |
      Hrany, po nichž se objevují nové uzly, tvoří kostru každé komponenty. Jakákoli další
      hrana (chorda) spojuje dva uzly, mezi nimiž už ve stromu vede cesta – a tím uzavírá
      kružnici. Graf bez chord je tedy roven svému lesu prohledávání.
    proof: |
      *Ve skriptech není, doplněno.*

      Hrany, po nichž algoritmus objeví nový uzel, tvoří les $T$: každá taková hrana
      přidá nový uzel, a každá komponenta začíná jedním uzlem z kroku 3, takže $T$ má
      $n - c$ hran a je acyklický.

      Najde-li algoritmus chordu $\{w, z\}$, je $z$ už dosažen ve stejné komponentě; ve
      stromu $T$ vede cesta z $w$ do $z$, která chordu neobsahuje, a spolu s ní tvoří
      kružnici. Nenajde-li žádnou chordu, jsou všechny hrany grafu v $T$, tedy $G = T$ je
      les a $m = n - c$.

      Časová složitost plyne z [Věty 5.1](#thm-prohledavani-linearni); zastavíme-li se
      u první chordy, prošli jsme předtím nejvýše $n - 1$ stromových hran, takže stačí
      čas $O(n)$.
    proof_steps:
      - Hrany, po nichž se objevují nové uzly, tvoří les $T$ s $n - c$ hranami.
      - Chorda $\{w,z\}$ spojuje dva uzly téže komponenty, mezi nimiž v $T$ vede cesta, takže spolu s ní uzavírá kružnici.
      - Bez chord jsou všechny hrany grafu v $T$, takže $G$ je les a $m = n - c$.
      - Před nalezením první chordy se projde nejvýše $n-1$ hran, takže test trvá $O(n)$.
    related: [alg-prohledavani, def-strom-prohledavani, prop-komponenty-linearne]
    illustrations:
      - title: Chorda = kružnice
        property: acyclic
        graph:
          directed: false
          nodes:
            - { id: s, x: 0, y: 5 }
            - { id: a, x: 3, y: 8.5 }
            - { id: b, x: 3, y: 1.5 }
            - { id: c, x: 6.5, y: 8.5 }
            - { id: d, x: 6.5, y: 1.5 }
            - { id: e, x: 10, y: 8.5 }
            - { id: f, x: 10, y: 1.5 }
          edges:
            - { from: s, to: a }
            - { from: a, to: b }
            - { from: b, to: d }
            - { from: d, to: c }
            - { from: c, to: e }
            - { from: e, to: f }
        steps:
          - caption: |
              Prohledávání ze $s$ nenašlo žádnou chordu: všech 6 hran vedlo do nového uzlu, $m = n - c = 7 - 1$. Graf je roven svému stromu prohledávání – je to strom (les).
          - caption: |
              Přidáme hranu $\{b, s\}$. Prohledávání z $b$ narazí na už objevený uzel $s$ – chorda. Spolu s cestou $s\,a\,b$ ve stromu uzavírá kružnici.
            add: [[b, s]]
          - caption: |
              Každá další chorda dává další kružnici (např. $\{f, d\}$ s cestou $d\,c\,e\,f$). Teď $m = 8 > n - c = 6$: co hrana navíc, to chorda.
            add: [[f, d]]
    source: "doplněno (použití prohledávání)"
    supplemented: true

  # ------------------------------------------------------------------ 5.2
  - id: def-vetev-grafu
    kind: definition
    section: "5.2"
    title: Větev grafu při artikulaci
    terms:
      - větev grafu
      - větev u artikulace
      - podstrom DFS
    statement: |
      Je-li uzel $v$ artikulace grafu $G$, pak **větev grafu $G$** (u uzlu $v$) je
      maximální souvislá část grafu $G$, v níž uzel $v$ není artikulací.
    intuition: |
      Větev je tvořena uzlem $v$ a jednou komponentou grafu $G - v$ (spolu s hranami
      do $v$). Backtracking má důležitou vlastnost: jakmile do větve vstoupí (přes $v$),
      projde ji celou a teprve pak ji opustí – opustit ji jinudy než přes artikulaci $v$
      ani nejde. Speciálně: vstoupí-li do koncového bloku, neopustí ho, dokud ho celý
      neprozkoumá. Otázkou je jen, jak při zpětném kroku poznat, že jsme v artikulaci –
      to řeší Tarjanova dolní čísla.
    related: [def-artikulace, alg-artikulace-tarjan, alg-dfs]
    source: "skripta str. 32"

  - id: prop-kriterium-artikulace
    kind: proposition
    section: "5.2"
    title: Dolní čísla a Tarjanovo kritérium artikulace
    terms:
      - dolní číslo
      - low point
      - lowpoint
      - p(x)
      - r(x)
      - kritérium artikulace
      - Tarjanovo kritérium
    statement: |
      Proveďme na souvislém grafu $G$ prohledávání do hloubky; uzly očíslujme pořadím,
      v němž byly zařazeny do stromu prohledávání ($p(x)$), a dolní čísla $r(x)$ počítejme
      pravidly:

      a) při objevení nového uzlu $x$ položíme $r(x) = p(x)$,

      b) při nalezení chordy $xy$ položíme $r(x) = \min\{p(y), r(x)\}$,

      c) při zpětném kroku z $x$ do $y$ položíme $r(y) = \min\{r(y), r(x)\}$.

      Pak:

      1. $r(x)$ je nejmenší pořadové číslo uzlu, do něhož se lze z uzlu $x$ dostat
         orientovanou cestou složenou z hran stromu a případně (na konci) z právě jedné
         chordy.
      2. Uzel $x$ s $p(x) > 1$ je artikulací, právě když existuje jeho následník (syn) $y$
         ve stromu prohledávání takový, že $r(y) \ge p(x)$.
      3. *(Doplněno.)* Kořen ($p(x) = 1$) je artikulací, právě když má ve stromu
         prohledávání alespoň dva syny.
    intuition: |
      Bod 2 lidsky: $x$ je artikulace, pokud má syna $y$, z jehož podstromu se **nelze
      dostat chordou výš než do $x$** – podstrom pod $y$ je pak k zbytku grafu „přivázán“
      jen přes $x$. Kořen je speciální, protože nad ním nic není: je artikulací, právě když
      se pod ním strom větví (dva podstromy nemohou být propojeny chordou, chordy vedou jen
      do předků).

      Skripta kritérium pro kořen neuvádějí; bez něj by algoritmus kořen nikdy neoznačil.
      Např. v cestě $a - b - c$ prohledávané z $b$ je kořen $b$ artikulace.
    proof: |
      *Skripta uvádějí tvrzení bez důkazu („snadno je vidět“), doplněno.*

      **Pomocné pozorování (vlastnost DFS).** Každá chorda spojuje uzel s jeho předkem ve
      stromu a je nalezena z potomka: když je uzel $z$ objeven, jeho předci leží v zásobníku
      pod ním a $z$ i všichni jeho potomci jsou zpracováni (a odebráni) dřív, než se
      algoritmus vrátí k předkům. Všechny hrany ze $z$ se tedy probírají v době, kdy jsou
      v zásobníku jen předci $z$ a uzly z podstromu $z$; nedosažený uzel se stane potomkem.

      **Bod 1.** Uzel $x$ je dokončen (zpětný krok z něj) až po dokončení všech synů. V tu
      chvíli podle pravidel platí
      $r(x) = \min\bigl(\{p(x)\} \cup \{p(y) : xy \text{ chorda z } x\} \cup \{r(s) : s \text{ syn } x\}\bigr)$,
      což indukcí podle pořadí dokončení dává popsané minimum přes cesty „dolů po stromu,
      pak nejvýše jedna chorda“.

      Označme $T_y$ podstrom se synem $y$. Uzly v $T_y$ mají $p \ge p(y) > p(x)$; chordy
      z $T_y$ vedou do předků, tj. do $T_y$, do $x$ nebo do předků $x$ (ti mají $p < p(x)$).

      **Bod 2, ($\Leftarrow$).** Nechť $r(y) \ge p(x)$. Pak z $T_y$ nevede chorda do žádného
      předka $x$, takže všechny hrany z $T_y$ ven vedou do $x$. Po odebrání $x$ je $T_y$
      oddělen od kořene (kořen $\ne x$, neboť $p(x) > 1$), graf $G - x$ je nesouvislý
      a $x$ je artikulace ([viz](#prop-artikulace-rozpojuje)).

      **Bod 2, ($\Rightarrow$).** Nechť $x$ je artikulace, $K$ komponenta grafu $G - x$
      neobsahující kořen a $y$ první objevený uzel z $K$. Všichni sousedé $y$ leží
      v $K \cup \{x\}$ a žádný uzel z $K$ nebyl objeven dřív, takže otcem $y$ je $x$.
      Podstrom $T_y$ leží v $K$ (cesta ve stromu z $y$ dolů neprochází $x$) a předci $y$
      kromě $x$ v $K$ neleží (do $K$ se z kořene dostaneme jen přes $x$). Chordy z $T_y$
      tedy vedou jen do $T_y$ nebo do $x$, a proto $r(y) \ge p(x)$.

      **Bod 3.** Chordy vedou jen do předků, takže mezi podstromy dvou různých synů kořene
      není žádná hrana: má-li kořen aspoň dva syny, jeho odebrání graf rozpojí. Má-li jediného
      syna, je po odebrání kořene zbytek stromu prohledávání (podstrom syna) souvislý, a tedy
      i $G - \text{kořen}$.
    proof_steps:
      - V DFS vede každá chorda z uzlu do jeho předka, protože podstrom uzlu se celý zpracuje před návratem k předkům.
      - Pravidla a)–c) dávají při dokončení $x$ minimum z $p(x)$, z $p$ konců chord z $x$ a z dolních čísel synů, což je popsané minimum přes cesty.
      - "Je-li $r(y) \\ge p(x)$, nevede z podstromu $T_y$ chorda nad $x$, takže odebráním $x$ se $T_y$ oddělí od kořene."
      - "Je-li $x$ artikulace, je první objevený uzel $y$ komponenty $G-x$ bez kořene synem $x$ a chordy z $T_y$ vedou nejvýše do $x$, tedy $r(y) \\ge p(x)$."
      - Mezi podstromy různých synů kořene nevede hrana, takže kořen je artikulací, právě když má aspoň dva syny.
    related: [def-strom-prohledavani, alg-artikulace-tarjan, def-artikulace, prop-artikulace-rozpojuje, prop-kriterium-mostu]
    illustrations:
      - title: Artikulace podle dolních čísel
        property: separating-set
        graph:
          directed: false
          nodes:
            - { id: g, x: 1.5, y: 9.5 }
            - { id: a, x: 1.5, y: 6 }
            - { id: b, x: 0, y: 2 }
            - { id: c, x: 3.8, y: 2.5 }
            - { id: d, x: 6.3, y: 2.5 }
            - { id: e, x: 10, y: 1.5 }
            - { id: f, x: 9, y: 6 }
          edges:
