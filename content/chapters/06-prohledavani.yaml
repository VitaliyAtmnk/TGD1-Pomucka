            - { from: e, to: a }
            - { from: a, to: c }
        steps:
          - caption: |
              $C_5$ s tětivou $\{a, c\}$, $n = 5$, pod uzly jsou stupně. Hledáme nesousední dvojice se součtem stupňů $\ge 5$.
            labels: { a: "3", b: "2", c: "3", d: "2", e: "2" }
          - caption: |
              $d(a) + d(d) = 3 + 2 = 5$, přidáme $\{a, d\}$. Stupně $a$ a $d$ vzrostly, což pomůže dalším dvojicím.
            add: [[a, d]]
