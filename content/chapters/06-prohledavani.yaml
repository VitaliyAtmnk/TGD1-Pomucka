  - id: def-uzaver-grafu
    kind: definition
    label: "Definice 5.1"
    section: "5.5"
    title: Uzávěr grafu (Bondy, Chvátal)
    terms:
      - uzávěr grafu
      - cl(G)
      - closure
      - Bondy-Chvátalův uzávěr
      - Hamiltonian closure
    statement: |
      **Uzávěrem** grafu $G$ nazveme graf $\mathrm{cl}(G)$, který vznikne z grafu $G$
      postupným rekurentním přidáváním všech hran $\{u, v\}$ splňujících podmínku Oreho
      lemmatu (tj. $u$, $v$ nesousední a $d(u) + d(v) \ge n$, kde $n = |U(G)|$).
    intuition: |
      Důležité: podmínka $d(u) + d(v) \ge n$ se v každém kroku testuje **v aktuálním grafu**
      (s již přidanými hranami), ne v původním $G$. Proto může být uzávěr úplným grafem, i když
      v $G$ podmínku splňuje jen málo dvojic. Podle [Oreho lemmatu](#lemma-ore-5-1) se
      přidáváním hran hamiltonovskost nemění: $G$ je hamiltonovský, právě když
      $\mathrm{cl}(G)$ je hamiltonovský.
    examples:
      - title: Uzávěr kružnice C5 s jednou tětivou
        body: |
          $G = C_5 + h$: kružnice $1\,2\,3\,4\,5$ s tětivou $\{1, 3\}$, $n = 5$. Stupně:
          $d(1) = d(3) = 3$, $d(2) = d(4) = d(5) = 2$. Tři uzly mají stupeň 2, přesto:

          1. $\{1, 4\}$: $3 + 2 = 5 \ge 5$, přidáme; teď $d(1) = 4$, $d(4) = 3$.
          2. $\{3, 5\}$: $3 + 2 = 5$, přidáme; $d(3) = 4$, $d(5) = 3$.
          3. $\{2, 4\}$: $2 + 3 = 5$, přidáme; $d(2) = 3$, $d(4) = 4$.
          4. $\{2, 5\}$: $3 + 3 = 6$, přidáme.

          Výsledkem je $K_5$, tedy $\mathrm{cl}(G)$ je úplný a $G$ je hamiltonovský
          (což tu vidíme i přímo – $C_5$).
        graph:
          directed: false
          nodes:
            - { id: 1, x: 5, y: 9.5 }
            - { id: 2, x: 9.5, y: 6 }
            - { id: 3, x: 8, y: 1 }
            - { id: 4, x: 2, y: 1 }
            - { id: 5, x: 0.5, y: 6 }
          edges:
            - { from: 1, to: 2 }
            - { from: 2, to: 3 }
            - { from: 3, to: 4 }
            - { from: 4, to: 5 }
            - { from: 5, to: 1 }
            - { from: 1, to: 3 }
    visualization: bondy-chvatal
    related: [lemma-ore-5-1, prop-uzaver-jednoznacny, thm-bondy-chvatal, alg-hamilton-uzaver]
    illustrations:
      - title: Uzávěr krok za krokem
        property: complete
        graph:
          directed: false
          nodes:
            - { id: a, x: 5, y: 9.5 }
            - { id: b, x: 9.5, y: 6 }
