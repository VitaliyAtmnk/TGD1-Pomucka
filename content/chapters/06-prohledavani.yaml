  - id: prop-uzaver-jednoznacny
    kind: proposition
    label: "Tvrzení 5.2"
    section: "5.5"
    title: Jednoznačnost uzávěru
    terms:
      - jednoznačnost uzávěru
      - uzávěr nezávisí na pořadí
    statement: |
      Pro každý graf $G$ je jeho uzávěr $\mathrm{cl}(G)$ určen jednoznačně.
    intuition: |
      Definice uzávěru nepředepisuje pořadí, v jakém hrany přidáváme. Tvrzení říká, že
      na pořadí nezáleží: přidání hrany může podmínku pro jiné dvojice jen „zlepšit“
      (stupně rostou), nikdy ne zkazit. Hrana, kterou šlo přidat v jednom pořadí, proto
      půjde přidat i v každém jiném.
    proof: |
      Nechť má graf $G$ dva uzávěry $G_1$ a $G_2$; $G_1$ vznikl přidáním hran
      $e_1, e_2, \dots, e_m$ (v tomto pořadí) a $G_2$ přidáním hran $f_1, f_2, \dots, f_r$.
      Ukážeme, že každá hrana $e_i$ je obsažena v $G_2$ (a symetricky každá $f_j$ v $G_1$).

      Sporem: nechť $e_{k+1} = \{u, v\}$ je první hrana posloupnosti $e_i$, která v $G_2$
      není, a označme $H = G \cup \{e_1, \dots, e_k\}$. Podle definice (hrana $e_{k+1}$ byla
      přidána do $H$) je $d_H(u) + d_H(v) \ge n$. Podle volby $e_{k+1}$ jsou všechny hrany
      $e_1, \dots, e_k$ v $G_2$, takže $H$ je podgrafem $G_2$ a $d_{G_2}(u) + d_{G_2}(v)
      \ge d_H(u) + d_H(v) \ge n$. Uzly $u$, $v$ jsou v $G_2$ nesousední a splňují podmínku,
      takže proces vytváření $G_2$ by hranu $\{u, v\}$ ještě přidal – $G_2$ by nebyl
      uzávěrem (proces končí, až když žádná taková hrana neexistuje). Spor.

      Stejně se ukáže, že každá hrana $f_j$ je v $G_1$; proto $G_1 = G_2$.
    proof_steps:
      - Předpokládáme dva uzávěry $G_1$ (hrany $e_1,\dots,e_m$) a $G_2$ (hrany $f_1,\dots,f_r$).
      - Pro spor vezmeme první hranu $e_{k+1} = \{u,v\}$, která v $G_2$ chybí, a graf $H = G \cup \{e_1,\dots,e_k\}$.
      - V $H$ platí $d_H(u) + d_H(v) \ge n$ a $H$ je podgrafem $G_2$, takže i $d_{G_2}(u) + d_{G_2}(v) \ge n$.
      - Pak by hrana $\{u,v\}$ byla do $G_2$ přidána, a to je spor s tím, že $G_2$ je uzávěr.
      - Symetricky je každá hrana $f_j$ v $G_1$, a tedy $G_1 = G_2$.
    related: [def-uzaver-grafu, thm-bondy-chvatal]
    source: "skripta str. 36; přednáška 7, fólie 5"

  - id: thm-bondy-chvatal
    kind: theorem
    label: "Věta 5.4"
    section: "5.5"
    title: Bondyho–Chvátalova věta
    terms:
      - Bondy-Chvátalova věta
      - Bondy
      - Chvátal
      - úplný uzávěr
      - Bondy-Chvátal theorem
    statement: |
      (Bondy, Chvátal) Nechť $G$ je graf s alespoň třemi uzly. Je-li $\mathrm{cl}(G)$
      úplný graf, potom je graf $G$ hamiltonovský.
    intuition: |
      Silnější než Oreho i Diracova věta: místo aby podmínku splňovaly všechny nesousední
      dvojice najednou, stačí, aby se graf postupným přidáváním „povolených“ hran dal
      doplnit na úplný graf. Obrácení **neplatí**: kružnice $C_n$ pro $n \ge 5$ je
      hamiltonovská, ale žádná nesousední dvojice nemá součet stupňů $\ge n$ ($2 + 2 < n$),
      takže $\mathrm{cl}(C_n) = C_n$ není úplný.

      Obecně platí ekvivalence: $G$ je hamiltonovský $\iff$ $\mathrm{cl}(G)$ je
      hamiltonovský.
    proof: |
      *Důkaz ve skriptech není, doplněno (přímý důsledek Oreho lemmatu).*

      Nechť $\mathrm{cl}(G)$ vznikl z $G$ přidáním hran $e_1, \dots, e_r$ a označme
      $G_0 = G$, $G_i = G_{i-1} + e_i$, takže $G_r = \mathrm{cl}(G)$. Podle definice
      uzávěru má hrana $e_i = \{u, v\}$ nesousední konce v $G_{i-1}$ a
      $d_{G_{i-1}}(u) + d_{G_{i-1}}(v) \ge n$.

      Graf $G_r = K_n$ je pro $n \ge 3$ hamiltonovský. Podle [Oreho lemmatu](#lemma-ore-5-1)
      aplikovaného na graf $G_{i-1}$ a hranu $e_i$ platí: je-li $G_i$ hamiltonovský, je
      hamiltonovský i $G_{i-1}$. Postupně pro $i = r, r-1, \dots, 1$ dostaneme, že
      hamiltonovský je $G_0 = G$.
    proof_steps:
      - Uzávěr vzniká posloupností grafů $G = G_0 \subset G_1 \subset \dots \subset G_r = \mathrm{cl}(G)$, kde $G_i = G_{i-1} + e_i$.
      - Každá přidaná hrana $e_i$ splňuje v grafu $G_{i-1}$ podmínku Oreho lemmatu.
      - Graf $G_r = K_n$ je pro $n \ge 3$ hamiltonovský.
      - Oreho lemma přenáší hamiltonovskost z $G_i$ na $G_{i-1}$, indukcí směrem dolů až na $G_0 = G$.
    related: [def-uzaver-grafu, lemma-ore-5-1, thm-ore-5-3, thm-dirac-5-2, alg-hamilton-uzaver]
    illustrations:
      - title: Obrácení neplatí
        property: hamiltonian
        graph:
          directed: false
          nodes:
            - { id: a, x: 2.5, y: 9 }
            - { id: b, x: 7.5, y: 9 }
            - { id: c, x: 10, y: 5 }
            - { id: d, x: 7.5, y: 1 }
            - { id: e, x: 2.5, y: 1 }
            - { id: f, x: 0, y: 5 }
          edges:
            - { from: a, to: b }
            - { from: b, to: c }
            - { from: c, to: d }
            - { from: d, to: e }
            - { from: e, to: f }
            - { from: f, to: a }
        steps:
          - caption: |
              $C_6$ je hamiltonovský, ale každá nesousední dvojice má součet stupňů $2 + 2 = 4 < 6$. Žádnou hranu nepřidáme, $\mathrm{cl}(C_6) = C_6$ není úplný – obrácení věty tedy **neplatí**.
          - caption: |
              Přidáme tři hlavní úhlopříčky. Graf je 3-regulární a každá nesousední dvojice má součet $3 + 3 = 6 \ge n$, takže uzávěr je $K_6$ a věta hamiltonovskost zaručuje.
            add: [[a, d], [b, e], [c, f]]
    source: "skripta str. 36; přednáška 7, fólie 5"

  - id: alg-hamilton-uzaver
    kind: algorithm
    label: "Poznámka (str. 36)"
    section: "5.5"
    title: Nalezení hamiltonovské kružnice přes uzávěr
    terms:
      - heuristika založená na uzávěru
      - výpočet uzávěru
      - polynomiální algoritmus hamiltonovská kružnice
      - konstrukce hamiltonovské kružnice
    statement: |
      Myšlenka důkazu Oreho lemmatu poskytuje **polynomiální algoritmus** na nalezení
      hamiltonovské kružnice v grafu $G$, jehož uzávěrem je úplný graf. (Obecně je problém
      existence hamiltonovské kružnice NP-úplný.)
    intuition: |
      Uzávěr spočítáme a zapamatujeme si pořadí přidaných hran. V úplném grafu je
      hamiltonovská kružnice zadarmo; pak přidané hrany odebíráme v opačném pořadí a pokaždé,
      když kružnice odebíranou hranu používá, ji „přepojíme“ konstrukcí z důkazu Oreho
      lemmatu. Pokud uzávěr úplný není, heuristika odpoví „nevím“.
    pseudocode: |
      1. **Uzávěr:** dokud existují nesousední $u$, $v$ s $d(u) + d(v) \ge n$ (v aktuálním grafu), přidej hranu $\{u, v\}$; zapamatuj pořadí $e_1, \dots, e_r$.
      2. Není-li $\mathrm{cl}(G)$ úplný graf, odpověz „nevím“ a skonči.
      3. Zvol hamiltonovskou kružnici $C$ v $K_n$ (např. $1, 2, \dots, n, 1$).
      4. Pro $j = r, r-1, \dots, 1$: je-li $e_j = \{u, v\} \in H(C)$, odeber ji (cesta $u = x_1, \dots, x_n = v$), najdi $i$ s $\{u, x_{i+1}\}$ i $\{x_i, v\}$ v grafu $G + e_1 + \dots + e_{j-1}$ a polož $C := x_1 \dots x_i\, x_n x_{n-1} \dots x_{i+1}\, x_1$.
      5. Vrať $C$ – hamiltonovskou kružnici v $G$.
    complexity: |
      Polynomiální. Přímočarý výpočet uzávěru: nejvýše $O(n^2)$ přidaných hran a před každou
      prohledání $O(n^2)$ dvojic, tedy $O(n^4)$ (s chytřejší evidencí kandidátů méně).
      Zpětná fáze: nejvýše $O(n^2)$ přepojení po $O(n)$, tj. $O(n^3)$.
    examples:
      - title: Kdy heuristika neví
        body: |
          Pro kružnici $C_6$ je $\mathrm{cl}(C_6) = C_6$ (každá nesousední dvojice má součet
          stupňů $4 < 6$), takže algoritmus odpoví „nevím“, přestože $C_6$ hamiltonovská je.
    visualization: bondy-chvatal
    related: [def-uzaver-grafu, thm-bondy-chvatal, lemma-ore-5-1, def-heuristika, rem-hamilton-np]
    illustrations:
      - title: Petersenův graf – heuristika neví, a právem
        property: hamiltonian
        graph:
          directed: false
          nodes:
            - { id: o1, x: 5, y: 9.8 }
            - { id: o2, x: 9.6, y: 6.5 }
            - { id: o3, x: 7.8, y: 1.1 }
            - { id: o4, x: 2.2, y: 1.1 }
            - { id: o5, x: 0.4, y: 6.5 }
            - { id: i1, x: 5, y: 7.2 }
            - { id: i2, x: 7.1, y: 5.7 }
            - { id: i3, x: 6.3, y: 3.2 }
            - { id: i4, x: 3.7, y: 3.2 }
            - { id: i5, x: 2.9, y: 5.7 }
          edges:
            - { from: o1, to: o2 }
            - { from: o2, to: o3 }
            - { from: o3, to: o4 }
            - { from: o4, to: o5 }
            - { from: o5, to: o1 }
            - { from: o1, to: i1 }
            - { from: o2, to: i2 }
            - { from: o3, to: i3 }
            - { from: o4, to: i4 }
            - { from: o5, to: i5 }
            - { from: i1, to: i3 }
            - { from: i3, to: i5 }
            - { from: i5, to: i2 }
            - { from: i2, to: i4 }
            - { from: i4, to: i1 }
        steps:
          - caption: |
              Petersenův graf: 3-regulární, $n = 10$. Každá nesousední dvojice má součet $3 + 3 = 6 < 10$, uzávěr je $G$ sám a heuristika odpoví „nevím“. Tady oprávněně – Petersenův graf hamiltonovský **není**.
          - caption: |
              Hamiltonovskou **cestu** ale má: $o_1\,i_1\,i_3\,i_5\,o_5\,o_4\,i_4\,i_2\,o_2\,o_3$. Uzavřít ji nejde, konce $o_1$ a $o_3$ nesousedí – a žádná jiná hamiltonovská cesta to nespraví.
            edges: { o1-i1: path, i1-i3: path, i3-i5: path, i5-o5: path, o5-o4: path, o4-i4: path, i4-i2: path, i2-o2: path, o2-o3: path }
            nodes: { o1: active, o3: active }
          - caption: |
              Stačí přidat jedinou hranu $\{o_1, o_3\}$ a graf hamiltonovský je. Uzávěr ale ani teď nic nepřidá (součty stupňů jsou nejvýš $4 + 4 < 10$), heuristika by zase odpověděla „nevím“ – rozdíl mezi oběma grafy pozná jen úplné prohledání.
            add: [[o1, o3]]
    source: "skripta str. 36 (poznámka; konkrétní postup a složitost doplněny)"

  - id: rem-hamilton-np
    kind: remark
    section: "5.5"
    title: Hamiltonovskost je NP-úplný problém
    terms:
      - NP-úplnost hamiltonovské kružnice
      - HAM
      - Hamiltonian cycle problem
      - obchodní cestující
    statement: |
      Problém existence hamiltonovské kružnice v grafu je obecně **NP-úplný**. Pro jeho
      řešení proto známe jen exponenciální algoritmy (backtracking) a polynomiální
      heuristiky nebo postačující podmínky (Dirac, Ore, Bondy–Chvátal), které dávají
      odpověď jen v některých případech.
    intuition: |
      Kontrast s eulerovskými grafy: existenci uzavřeného eulerovského tahu rozhodneme
      triviálně (souvislost + sudé stupně) v lineárním čase, kdežto pro hamiltonovskou
      kružnici žádná taková „lokální“ charakterizace není známa – a pokud P ≠ NP,
      ani neexistuje.
    related: [alg-hamilton-backtracking, alg-hamilton-uzaver, def-hamiltonovsky-graf, def-eulerovsky-graf]
    source: "skripta str. 36"

quiz:
  - id: q-prohl-01
    question: |
      Jakou časovou složitost má Algoritmus 5.1 (prohledávání grafu) při reprezentaci
      seznamy sousedů?
    options:
      - '$O(n)$'
      - '$O(n + m)$'
      - '$O(n \cdot m)$'
      - '$O(n^2)$'
    correct: 1
    explanation: |
      Každý uzel do $D$ vstoupí a odejde jednou a každá hrana se z $M$ odebere jednou
      (Věta 5.1). Se seznamy sousedů je tedy celkový čas $O(n + m)$. S maticí sousednosti
      by hledání hran stálo $O(n^2)$.
    related: [thm-prohledavani-linearni, alg-prohledavani]

  - id: q-prohl-02
    question: |
      Množina $D$ v Algoritmu 5.1 je realizována jako **fronta**. Jaký postup vznikne?
    options:
      - Prohledávání do hloubky (DFS)
      - Prohledávání do šířky (BFS)
      - Dijkstrův algoritmus
      - Náhodné prohledávání
    correct: 1
    explanation: |
      Fronta = vždy se bere uzel, který je v $D$ nejdéle, takže prohledávání se šíří po
      vrstvách podle vzdálenosti – je to BFS. Zásobník (uzel v $D$ nejkratší dobu) dává DFS.
    related: [rem-prohledavani-implementace, alg-bfs, alg-dfs]

  - id: q-prohl-03
    question: |
      Kterou úlohu řeší prohledávání **do šířky** přímo, bez dalších úprav?
    options:
      - Nalezení všech artikulací
      - Nalezení nejkratších cest (počtem hran) z počátečního uzlu
      - Nalezení hamiltonovské kružnice
      - Výpočet uzlové souvislosti
    correct: 1
    explanation: |
      BFS probírá uzly v pořadí podle vzdálenosti od počátku; strom prohledávání je stromem
      nejkratších cest v neohodnoceném grafu. Artikulace se hledají backtrackingem (DFS).
    related: [alg-bfs]

  - id: q-prohl-04
    question: |
      Kam může vést chorda nalezená při prohledávání **do hloubky** neorientovaného grafu?
    options:
      - Do libovolného již objeveného uzlu
      - Jen do předka aktuálního uzlu ve stromu prohledávání
      - Jen do sourozence aktuálního uzlu
      - Do dosud neobjeveného uzlu
    correct: 1
    explanation: |
      DFS projde celý podstrom uzlu dřív, než se vrátí k jeho předkům, takže všechny
      již objevené uzly, které jsou ještě aktivní, leží na cestě z kořene – chorda tedy vede
      do předka. Na tom stojí Tarjanův algoritmus. Hrana do neobjeveného uzlu je hrana stromu.
    related: [def-strom-prohledavani, alg-dfs]

  - id: q-prohl-05
    question: |
      V Tarjanově algoritmu má uzel $x$ pořadové číslo $p(x) = 5$ a jeho synové $y_1$, $y_2$
      mají $r(y_1) = 3$, $r(y_2) = 5$. Co platí?
    options:
      - $x$ není artikulace, protože $r(y_1) < p(x)$.
      - $x$ je artikulace, protože $r(y_2) \ge p(x)$.
      - $x$ je artikulace, právě když je kořenem.
      - Z těchto údajů to nelze rozhodnout.
    correct: 1
    explanation: |
      Stačí jediný syn $y$ s $r(y) \ge p(x)$: z podstromu $y_2$ se chordou nelze dostat výš
      než do $x$, takže odebráním $x$ se podstrom oddělí. ($p(x) = 5 > 1$, $x$ tedy není
      kořen.)
    related: [prop-kriterium-artikulace, alg-artikulace-tarjan]

  - id: q-prohl-06
    question: |
      Kdy je **kořen** stromu prohledávání do hloubky artikulací?
    options:
      - Vždy
      - Nikdy
      - Právě když má ve stromu alespoň dva syny
      - Právě když z něj vede aspoň jedna chorda
    correct: 2
    explanation: |
      Chordy vedou jen do předků, takže mezi podstromy různých synů kořene není hrana.
      Má-li kořen dva syny, jeho odebrání graf rozpojí, s jediným synem ne. (Skripta toto
      pravidlo výslovně neuvádějí, kritérium $r(y) \ge p(x)$ formulují jen pro $p(x) > 1$.)
    related: [prop-kriterium-artikulace]

  - id: q-prohl-07
    question: |
      Jakou složitost má naivní hledání artikulací („odeber uzel a zjisti, zda vzrostl
      počet komponent“) a jakou Tarjanův algoritmus?
    options:
      - '$O(n + m)$ a $O(n + m)$'
      - '$O(n(n + m))$ a $O(n + m)$'
      - '$O(n^3)$ a $O(n^2)$'
      - '$O(2^n)$ a $O(n(n + m))$'
    correct: 1
    explanation: |
      Naivní postup provede $n$-krát prohledávání v čase $O(n + m)$. Tarjan vystačí
      s jediným průchodem backtrackingu, při němž počítá čísla $p(x)$ a $r(x)$.
    related: [alg-artikulace-tarjan]

  - id: q-prohl-08
    question: |
      Proč backtracking pro generování hamiltonovských cest není efektivní, přestože
      „backtracking pracuje v čase $O(m + n)$“?
    options:
      - Protože musí počítat distanční matici.
      - Protože $m$ a $n$ jsou zde rozměry rozhodovacího stromu, který roste exponenciálně s počtem uzlů grafu.
      - Protože chordy se musí procházet opakovaně.
      - Ve skutečnosti je efektivní, běží v čase $O(m + n)$ grafu $G$.
    correct: 1
    explanation: |
      Uzly se po zpětném kroku opět uvolní, takže algoritmus prochází strom všech cest
      z počátečního uzlu. Ten má obecně exponenciálně mnoho uzlů (v $K_n$ je
      $(n-1)!$ hamiltonovských cest z jednoho uzlu).
    related: [alg-hamilton-backtracking, rem-hamilton-casova-narocnost]

  - id: q-prohl-09
    question: |
      Který graf na 7 uzlech splňuje podmínku Oreho věty, ale **ne** podmínku Diracovy věty?
    options:
      - Kružnice $C_7$
      - Úplný bipartitní graf $K_{3,4}$
      - '$K_6$ a jeden další uzel spojený se třemi uzly $K_6$'
      - Strom se 7 uzly
    correct: 2
    explanation: |
      Nový uzel $w$ má stupeň 3, uzly $K_6$ mají stupeň 6 (sousedé $w$) nebo 5. Jediné
      nesousední dvojice jsou $w$ a uzel $K_6$ stupně 5: $3 + 5 = 8 \ge 7$, Oreho podmínka
      platí. Ale $\delta = 3 < 7/2$, takže Diracova podmínka neplatí. $C_7$ a strom nesplňují
      ani Oreho podmínku ($2 + 2 < 7$, resp. listy), $K_{3,4}$ také ne: dva uzly stupně 3
      ve větší části dávají $3 + 3 = 6 < 7$ (a $K_{3,4}$ ani hamiltonovský není).
    related: [thm-ore-5-3, thm-dirac-5-2]

  - id: q-prohl-10
    question: |
      Co tvrdí Oreho lemma pro nesousední uzly $u$, $v$ s $d(u) + d(v) \ge n$?
    options:
      - '$G$ je vždy hamiltonovský.'
      - '$G$ je hamiltonovský, právě když $G + \{u, v\}$ je hamiltonovský.'
      - '$G + \{u, v\}$ je vždy úplný graf.'
      - '$G$ má hamiltonovskou cestu z $u$ do $v$.'
    correct: 1
    explanation: |
      Přidání takové hrany nemění hamiltonovskost. Netriviální směr: kružnici v
      $G + \{u, v\}$ přes hranu $\{u, v\}$ lze přepojit pomocí indexu $x_i \in M \cap N$,
      jehož existenci zaručí počítání ($|M| + |N| \ge n$, $|M \cup N| \le n - 1$).
    related: [lemma-ore-5-1]

  - id: q-prohl-11
    question: |
      Při konstrukci uzávěru $\mathrm{cl}(G)$ se podmínka $d(u) + d(v) \ge n$ testuje:
    options:
      - v původním grafu $G$
      - v aktuálním grafu s již přidanými hranami
      - v doplňku grafu $G$
      - jen pro uzly minimálního stupně
    correct: 1
    explanation: |
      Stupně se počítají v aktuálním grafu, proto může uzávěr být úplný, i když v $G$
      podmínku splňuje jen málo dvojic (např. $C_5$ s jednou tětivou má $\mathrm{cl} = K_5$).
      Výsledek přitom nezávisí na pořadí přidávání (Tvrzení 5.2).
    related: [def-uzaver-grafu, prop-uzaver-jednoznacny]

  - id: q-prohl-12
    question: |
      Graf $G$ s $n \ge 3$ uzly má uzávěr $\mathrm{cl}(G)$, který **není** úplný. Co z toho
      plyne?
    options:
      - '$G$ není hamiltonovský.'
      - '$G$ nemá hamiltonovskou cestu.'
      - O hamiltonovskosti $G$ to samo o sobě nic neříká.
      - '$G$ je nesouvislý.'
    correct: 2
    explanation: |
      Bondy–Chvátalova věta je jen postačující podmínka. Např. $C_6$ je hamiltonovská,
      ale $\mathrm{cl}(C_6) = C_6$. Platí ovšem, že $G$ je hamiltonovský, právě když
      $\mathrm{cl}(G)$ je hamiltonovský.
    related: [thm-bondy-chvatal, def-uzaver-grafu]

  - id: q-prohl-13
    question: |
      Jakou složitost má výpočet hranové souvislosti $h(G)$ celého grafu přes maximální
      toky pro všechny dvojice uzlů (Dinicův algoritmus) a jaké je nejlepší známé vylepšení?
    options:
      - '$O(n^3)$, resp. $O(n^2)$'
      - '$O(n^5)$, resp. $O(m^2\sqrt{n}) \subseteq O(n^{4{,}5})$'
      - '$O(n + m)$, resp. $O(n)$'
      - '$O(2^n)$, resp. $O(n^5)$'
    correct: 1
    explanation: |
      $O(n^2)$ dvojic krát $O(n^3)$ na jeden tok dává $O(n^5)$; Even, Hopcroft a Tarjan
      dosáhli $O(m^2\sqrt{n})$, což je při $m \sim n^2$ nejvýše $O(n^{4{,}5})$. Stejné odhady
      platí pro uzlovou souvislost (štěpení uzlů).
    related: [alg-hranova-souvislost, alg-uzlova-souvislost]

  - id: q-prohl-14
    question: |
      Pósova heuristika skončila odpovědí „nevím“. Co to znamená?
    options:
      - Graf není hamiltonovský.
      - Graf je nesouvislý.
      - Heuristika kružnici nenašla, ale hamiltonovská kružnice přesto může existovat.
      - Graf má artikulaci.
    correct: 2
    explanation: |
      Heuristika zpravidla neumí dát zápornou odpověď – neprobírá všechny možnosti.
      Jistotu dává jen kladná odpověď (nalezená kružnice).
    related: [def-heuristika, alg-posova-heuristika]

  - id: q-prohl-15
    question: |
      Jak rozhodnout v čase $O(n + m)$, zda je graf lesem (neobsahuje kružnici)?
    options:
      - Spočítat distanční matici a hledat nuly mimo diagonálu.
      - Prohledat graf a zjistit, zda byla nalezena nějaká chorda.
      - Ověřit, že všechny stupně jsou nejvýše 2.
      - Spustit backtracking pro hamiltonovské cesty.
    correct: 1
    explanation: |
      Hrany objevující nové uzly tvoří les prohledávání; každá chorda s ním uzavírá kružnici.
      Graf je lesem, právě když chorda neexistuje, tj. $m = n - c$ ($c$ = počet komponent).
    related: [prop-test-acyklicnosti]
