id: prohledavani
number: 6
title: Prohledávání grafů a algoritmy k-souvislosti
source: "TGD1 skripta kap. 5 (str. 29–36); přednáška 7 (TGD1-07-folie)"
exam_questions: [9, 10]
summary: |
  Obecný algoritmus prohledávání grafu projde všechny uzly a hrany v lineárním čase
  $O(n + m)$; podle toho, jak volí další zpracovávaný uzel, dostaneme prohledávání
  do šířky (BFS) nebo do hloubky (DFS, backtracking). Na prohledávání stojí řada
  dalších algoritmů: komponenty, artikulace a bloky (Tarjan), mosty, test acykličnosti.
  Pro vyšší souvislost se používají toky v sítích. Druhá část se věnuje hamiltonovským
  kružnicím: exponenciálnímu backtrackingu, heuristikám a postačujícím podmínkám
  (Dirac, Ore, uzávěr grafu podle Bondyho a Chvátala). U zkoušky je důraz na algoritmy
  a jejich složitost.
sections:
