  - id: alg-dfs
    kind: algorithm
    section: "5.1"
    title: Prohledávání do hloubky (DFS, backtracking)
    terms:
      - prohledávání do hloubky
      - DFS
      - depth-first search
      - backtracking
      - zásobník
      - zpětný krok
    statement: |
      Prohledávání do hloubky je Algoritmus 5.1, v němž je množina $D$ realizována jako
      **zásobník**: v kroku 4 se vždy volí uzel, který je v $D$ nejkratší dobu (naposledy
      přidaný). Prohledávání do hloubky se také říká **backtracking** (podle zpětných
      kroků).
    intuition: |
      DFS jde „pořád dál“ do nových uzlů, a když už z aktuálního uzlu žádná neprobraná hrana
      nevede, vrátí se o krok zpět (zpětný krok) a zkouší jinou možnost. Obsah zásobníku
      $D$ je vždy cesta ve stromu prohledávání z kořene do aktuálního uzlu.

      Klíčová vlastnost pro další algoritmy: **každá chorda spojuje uzel s jeho předkem**
      ve stromu prohledávání (v neorientovaném DFS nejsou „příčné“ hrany). A když DFS
      vstoupí do nějaké větve, projde ji celou, než ji opustí.
    pseudocode: |
      1. Všechny uzly jsou neobjevené; zásobník $D$ je prázdný.
      2. Pokud neobjevený uzel neexistuje, konec. Jinak vezmi neobjevený uzel $v$ (kořen), označ ho a vlož do $D$.
      3. Dokud $D \ne \emptyset$: nechť $w$ je uzel na **vrcholu** zásobníku.
         * Má-li $w$ neprobranou hranu $\{w, z\}$: projdi ji, označ jako probranou;
           je-li $z$ neobjevený, označ ho a **vlož na vrchol** zásobníku
           (objevení nového uzlu, hrana stromu); jinak je $\{w, z\}$ chorda.
         * Jinak $w$ ze zásobníku odeber (zpětný krok do uzlu pod ním).
      4. Jdi na 2 (další komponenta).
    complexity: |
      $O(n + m)$ – speciální případ Algoritmu 5.1. Lze jej psát i rekurzivně; zásobník pak
      nahrazuje zásobník volání.
    examples:
      - title: DFS na grafu se 13 uzly
        body: |
          Stejný graf jako u [BFS](#alg-bfs), začínáme v uzlu 1, volíme nejmenší čísla.
          Posloupnost kroků (→ objevení nového uzlu, ⇢ chorda, ← zpětný krok):

          * $1 \to 2 \to 3$; ze 3: chorda $3$⇢$1$; $3 \to 5$; z 5: chorda $5$⇢$2$;
            $5 \to 4$; ze 4: chorda $4$⇢$2$; zpět $4 \leftarrow$ do 5.
          * $5 \to 6 \to 7$; ze 7: chorda $7$⇢$5$; zpět do 6, 5, 3, 2, 1.
          * $1 \to 8 \to 9$; z 9: chorda $9$⇢$1$; $9 \to 10$; z 10: chorda $10$⇢$8$;
            zpět do 9, 8; $8 \to 11$; zpět do 8, 1. Zásobník je prázdný.
          * Nová komponenta: $12 \to 13$, zpět do 12, konec.

          Hrany stromu: $12, 23, 35, 54, 56, 67, 18, 89, 9\,10, 8\,11, 12\,13$;
          chordy: $31, 52, 42, 75, 91, 10\,8$. Každá chorda vede do předka.
