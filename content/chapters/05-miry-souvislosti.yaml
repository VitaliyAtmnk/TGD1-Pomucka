  - id: thm-blokovy-graf-strom
    kind: theorem
    label: "Věta 4.3"
    section: "4.1"
    title: Blokový graf je strom
    terms:
      - blokový graf je strom
      - koncový blok
      - list blokového grafu
    statement: |
      Pro každý souvislý graf $G$ je blokový graf $B(G)$ stromem.
    intuition: |
      Kdyby v $B(G)$ byl cyklus, bloky na tomto cyklu by byly „spojené dokola“ a jejich
      sjednocení by bylo větší souvislý podgraf bez artikulace – to odporuje maximalitě
      bloků. Důsledek: každý souvislý graf, který není sám blokem, má aspoň dva
      **koncové bloky** (listy stromu $B(G)$), tj. bloky obsahující jedinou artikulaci.
      Na této stromové struktuře je založeno i hledání bloků backtrackingem – algoritmus,
      který vstoupí do koncového bloku, ho celý prozkoumá, než se vrátí.
    proof: |
      *Důkaz ve skriptech není, doplněno.*

      Nejprve dvě pomocná pozorování (plynou z [Věty 4.2](#thm-bloky-hranove-disjunktni)):

      * (a) **Hrany ležící na společné kružnici patří do stejného bloku.** Kružnice je
        souvislý graf bez artikulace, leží tedy v nějakém bloku; protože jsou bloky hranově
        disjunktní, je to blok každé její hrany.
      * (b) **Uzel ležící ve dvou různých blocích je artikulace.** Má-li $x$ hranu $e$
        v bloku $B$ a hranu $f$ v bloku $B' \ne B$, nemohou $e, f$ podle (a) ležet na
        společné kružnici, takže $x$ je artikulace.

      *Souvislost $B(G)$.* Vezměme dva bloky $B, B'$ a cestu v $G$ z uzlu bloku $B$ do uzlu
      bloku $B'$. Hrany cesty postupně procházejí bloky; kde cesta přechází z jednoho bloku
      do jiného, děje se to ve společném uzlu, který je podle (b) artikulací, a ta je
      v $B(G)$ sousední s oběma bloky. Tak dostaneme sled z $B$ do $B'$ v $B(G)$. Každá
      artikulace je v $B(G)$ sousední s nějakým blokem, takže $B(G)$ je souvislý.

      *Acykličnost.* $B(G)$ je bipartitní (hrany vedou jen mezi artikulacemi a bloky).
      Předpokládejme pro spor, že obsahuje kružnici, a zvolme nejkratší:
      $x_1 B_1 x_2 B_2 \dots x_k B_k x_1$, $k \ge 2$. V každém bloku $B_i$ zvolme cestu
      $P_i$ z $x_i$ do $x_{i+1}$ (indexy modulo $k$). Díky minimalitě kružnice leží $x_2$
      z bloků $B_1, \dots, B_k$ jen v $B_1$ a $B_2$ (jinak by šlo kružnici zkrátit), takže
      cesty $P_3, \dots, P_k$ uzlem $x_2$ neprocházejí. Nechť $e$ je poslední hrana cesty
      $P_1$ (vede do $x_2$, leží v $B_1$) a $f$ první hrana cesty $P_2$ (vychází z $x_2$,
      leží v $B_2$). Sled $P_2, P_3, \dots, P_k, P_1$ vede z $x_2$ zpět do $x_2$ a uvnitř
      uzlem $x_2$ neprochází; vynecháme-li $x_2$, obsahuje cestu mezi druhými konci hran
      $f$ a $e$ vyhýbající se $x_2$. Ta spolu s $e$ a $f$ tvoří kružnici obsahující $e$
      i $f$. Podle (a) pak $B_1 = B_2$ – spor.

      Souvislý graf bez kružnic je strom.
    proof_steps:
      - Pomocné tvrzení – hrany na společné kružnici leží ve stejném bloku (kružnice je bez artikulace a bloky jsou hranově disjunktní).
      - Pomocné tvrzení – uzel ležící ve dvou blocích je artikulace.
      - Souvislost – cesta v $G$ mezi dvěma bloky přechází mezi bloky jen přes artikulace, takže dává sled v $B(G)$.
      - Pro spor vezmeme nejkratší kružnici $x_1 B_1 x_2 B_2 \dots x_k B_k x_1$ v $B(G)$ a v každém $B_i$ cestu z $x_i$ do $x_{i+1}$.
      - Z těchto cest složíme kružnici v $G$, která obsahuje hranu z $B_1$ i hranu z $B_2$ u uzlu $x_2$.
      - Podle prvního pomocného tvrzení je pak $B_1 = B_2$, což je spor; $B(G)$ je tedy strom.
    related: [def-blokovy-graf, thm-bloky-hranove-disjunktni, def-blok]
    illustrations:
      - title: Proč v blokovém grafu nemůže být kružnice
        for: proof
        property: tree
        graph:
          directed: false
          nodes:
            - { id: B1, x: 0, y: 5 }
            - { id: x1, x: 2, y: 5 }
            - { id: B2, x: 2, y: 8 }
            - { id: B3, x: 2, y: 2 }
            - { id: B4, x: 4, y: 5 }
            - { id: x2, x: 6, y: 5 }
            - { id: B5, x: 6, y: 2 }
            - { id: B6, x: 7.5, y: 7 }
            - { id: x3, x: 9, y: 5 }
            - { id: B7, x: 10, y: 3 }
          edges:
            - { from: x1, to: B1 }
            - { from: x1, to: B2 }
            - { from: x1, to: B3 }
            - { from: x1, to: B4 }
            - { from: x2, to: B4 }
            - { from: x2, to: B5 }
            - { from: x2, to: B6 }
            - { from: x3, to: B6 }
            - { from: x3, to: B7 }
        steps:
          - caption: |
              Blokový graf z příkladu u definice je souvislý a bez kružnic – strom.
          - caption: |
              Co kdyby $B(G)$ kružnici měl – třeba kdyby $x_2$ ležel i v bloku $B_7$? Kružnice $x_2\,B_6\,x_3\,B_7\,x_2$ by znamenala, že z $x_2$ do $x_3$ vede cesta uvnitř $B_6$ i jiná cesta uvnitř $B_7$.
            add: [[x2, B7]]
          - caption: |
              Obě cesty dohromady by v $G$ daly kružnici, na níž leží hrana z $B_6$ i hrana z $B_7$. Hrany na společné kružnici ale patří do **téhož** bloku, takže $B_6 = B_7$ – spor. Taková kružnice v $B(G)$ tedy nastat nemůže.
            nodes: { B6: active, B7: active, x2: path, x3: path }
            witness: true
          - caption: |
              Bez nemožné hrany je $B(G)$ zase souvislý graf bez kružnic, tedy strom. Souvislost plyne z toho, že cesta v $G$ přechází mezi bloky jen přes artikulace.
            remove: [[x2, B7]]
    source: "skripta str. 25 (bez důkazu); přednáška 6, fólie 2"

  # ------------------------------------------------------------------ 4.2
  - id: def-hranovy-rez
    kind: definition
    label: "Definice 4.5"
    section: "4.2"
    title: Hranový řez mezi dvěma uzly
    terms:
      - hranový řez
      - řez mezi uzly
      - edge cut
      - separující množina hran
      - minimální hranový řez
    statement: |
      Buď $G$ souvislý graf a $x, y \in U(G)$, $x \ne y$. Množina $B \subset H(G)$
      taková, že

      1. každá cesta z uzlu $x$ do uzlu $y$ obsahuje alespoň jednu hranu množiny $B$,
      2. žádná vlastní podmnožina množiny $B$ nemá vlastnost 1,

      se nazývá **hranový řez** grafu $G$ mezi uzly $x$ a $y$.
    intuition: |
      Hranový řez je „nejúspornější“ množina hran, jejímž přestřižením oddělíme $x$ od $y$.
      Podmínka 2 je **minimalita vzhledem k inkluzi** – neznamená, že řez má nejmenší možný
      počet hran (takový řez je minimum, z něhož počítáme $h_G(x, y)$), ale že z něj nelze
      žádnou hranu vynechat. Most je přesně jednoprvkový hranový řez.
    related: [rem-hranovy-rez, def-hranovy-stupen-mezi-uzly, def-most, def-uzlovy-rez]
    illustrations:
      - title: Hranové řezy v šestiúhelníku
        property: disconnecting-edges
        graph:
          directed: false
          nodes:
            - { id: x, x: 0, y: 5 }
            - { id: p, x: 2.5, y: 9 }
            - { id: q, x: 7.5, y: 9 }
            - { id: "y", x: 10, y: 5 }
            - { id: r, x: 7.5, y: 1 }
            - { id: s, x: 2.5, y: 1 }
          edges:
            - { from: x, to: p }
            - { from: p, to: q }
            - { from: q, to: "y" }
            - { from: "y", to: r }
            - { from: r, to: s }
            - { from: s, to: x }
        steps:
          - caption: |
              Jediná hrana nestačí: z $x$ do $y$ vedou dvě cesty ($x\,p\,q\,y$ a $x\,s\,r\,y$) a po přestřižení $\{x, p\}$ zůstane ta druhá.
            edge_set: [x-p]
          - caption: |
              Hrany $\{x, p\}$ a $\{y, r\}$ zasáhnou každou cestu z $x$ do $y$ a žádnou z nich nelze vynechat – je to **hranový řez** mezi $x$ a $y$.
            edge_set: [x-p, y-r]
          - caption: |
              Řezů bývá víc: $x$ od $y$ odděluje i dvojice $\{p, q\}$, $\{r, s\}$, která se $x$ ani $y$ nedotýká. Menší řez neexistuje, proto $h_G(x, y) = 2$.
            edge_set: [p-q, r-s]
          - caption: |
              Přidáme tětivu $\{p, s\}$. Dvojice $\{x, p\}$, $\{y, r\}$ už řezem není – cesta $x\,s\,p\,q\,y$ ji obejde.
            add: [[p, s]]
            edge_set: [x-p, y-r]
          - caption: |
              Řez teď tvoří např. obě hrany u $x$. Stále $h_G(x, y) = 2$ – a nikdy nemůže být víc než $\min\{d(x), d(y)\}$.
            edge_set: [x-p, x-s]
    source: "skripta str. 25; přednáška 6, fólie 3"

  - id: rem-hranovy-rez
    kind: remark
    label: "Poznámka (str. 25–26)"
    section: "4.2"
    title: Vlastnosti hranového řezu
    terms:
      - odstranění řezu
      - minimalita řezu
    statement: |
      1. Odstraněním hranového řezu $B$ mezi $x$ a $y$ se přeruší všechny cesty mezi $x$
         a $y$: graf $G - B$ je nesouvislý a $x$, $y$ leží v různých komponentách.
      2. Most je jednoprvkový hranový řez.
      3. V definici řezu se požaduje minimalita: např. v šestiúhelníku $C_6$ tvoří řez mezi
         dvěma protějšími uzly dvojice hran, z nichž jedna leží na každé z obou cest;
         přidáme-li k ní třetí hranu, množina sice stále přerušuje všechny cesty, ale
         řezem už není (není minimální).
    intuition: |
      Minimalita má praktický smysl: díky ní odebrání řezu rozdělí graf právě na
      **dvě** komponenty (jedna obsahuje $x$, druhá $y$) a každá hrana řezu vede mezi nimi.
    related: [def-hranovy-rez]
    source: "skripta str. 25–26"

  - id: def-hranovy-stupen-mezi-uzly
    kind: definition
    label: "Definice 4.6"
    section: "4.2"
    title: Hranový stupeň souvislosti mezi uzly, matice hranové souvislosti
    terms:
      - hranový stupeň souvislosti mezi uzly
      - h_G(x,y)
      - lokální hranová souvislost
      - matice hranové souvislosti
      - local edge connectivity
    statement: |
      Nejmenší počet prvků hranového řezu mezi uzly $x$ a $y$ se nazývá **hranový stupeň
      souvislosti** grafu $G$ mezi uzly $x$ a $y$ a značí se $h_G(x, y)$.

      Očíslujeme-li uzly čísly $1, \dots, n$ a položíme $h_{i,j} = h_G(i, j)$, popisuje
      hranovou souvislost grafu **matice hranové souvislosti**
      $H_G = [h_{i,j}]_{i,j=1}^{n}$.
    intuition: |
      $h_G(x, y)$ říká, kolik hran musí „selhat“, aby se $x$ a $y$ ocitly v různých
      komponentách. Podle [Věty 4.6](#thm-ford-fulkerson-hranova-souvislost) je to zároveň
      maximální počet hranově disjunktních cest mezi $x$ a $y$. Zjevně
      $h_G(x, y) \le \min\{d(x), d(y)\}$ (stačí odříznout všechny hrany u $x$).
    examples:
      - title: Matice hranové souvislosti
        body: |
          Graf na uzlech $1, \dots, 5$ s hranami $12, 14, 24, 23, 34, 45$:

          $$
          H_G = \begin{bmatrix}
          - & 2 & 2 & 2 & 1 \\
          2 & - & 2 & 3 & 1 \\
          2 & 2 & - & 2 & 1 \\
          2 & 3 & 2 & - & 1 \\
          1 & 1 & 1 & 1 & -
          \end{bmatrix}
          $$

          Např. $h_G(2, 4) = 3$: uzly $2$ a $4$ spojují tři hranově disjunktní cesty
          ($2\,4$; $2\,1\,4$; $2\,3\,4$) a $d(2) = 3$. Uzel $5$ je listem, proto
          $h_G(5, \cdot) = 1$ (hrana $45$ je most).
        graph:
          directed: false
          nodes:
            - { id: 1, x: 0, y: 8 }
            - { id: 4, x: 5, y: 8 }
            - { id: 2, x: 0, y: 2 }
            - { id: 3, x: 5, y: 2 }
            - { id: 5, x: 7.5, y: 5 }
          edges:
            - { from: 1, to: 2 }
            - { from: 1, to: 4 }
            - { from: 2, to: 4 }
            - { from: 2, to: 3 }
            - { from: 3, to: 4 }
            - { from: 4, to: 5 }
    related: [def-hranovy-rez, def-stupen-souvislosti-grafu, thm-ford-fulkerson-hranova-souvislost, def-uzlovy-stupen-mezi-uzly]
    source: "skripta str. 26; přednáška 6, fólie 3"

  - id: def-uzlovy-rez
    kind: definition
    label: "Definice 4.7"
    section: "4.2"
    title: Uzlový řez mezi dvěma uzly
    terms:
      - uzlový řez
      - vertex cut
      - separátor
      - separating set
      - oddělující množina uzlů
    statement: |
      Buď $G$ souvislý graf a $x, y \in U(G)$ jeho uzly, $x \ne y$. Neprázdná množina
      $A \subset U(G)$ taková, že

      1. každá cesta z $x$ do $y$ obsahuje alespoň jeden uzel z množiny $A$,
      2. žádná vlastní podmnožina množiny $A$ nemá vlastnost 1,

      se nazývá **uzlový řez** grafu $G$ mezi uzly $x$ a $y$.
    intuition: |
      Uzlová obdoba hranového řezu: minimální množina uzlů (různých od $x$, $y$ – jinak by
      stačilo vzít $\{x\}$), jejímž odebráním oddělíme $x$ od $y$. Pozor: jsou-li $x$ a $y$
      **sousední**, žádný uzlový řez mezi nimi neexistuje – hrana $\{x, y\}$ je cesta, kterou
      odebíráním jiných uzlů nepřerušíme. Proto Definice 4.8 tento případ ošetřuje zvlášť
      a Mengerova věta mluví o nesousedních uzlech.

      Slovo „neprázdná“ je ve fóliích; ve skriptech chybí.
    related: [rem-uzlovy-rez, def-uzlovy-stupen-mezi-uzly, def-artikulace, def-hranovy-rez]
    illustrations:
      - title: Uzlové řezy mezi x a y
        property: separating-set
        graph:
          directed: false
          nodes:
            - { id: x, x: 0, y: 5 }
            - { id: p, x: 3, y: 8.5 }
            - { id: q, x: 3, y: 1.5 }
            - { id: r, x: 7, y: 8.5 }
            - { id: s, x: 7, y: 1.5 }
            - { id: "y", x: 10, y: 5 }
          edges:
            - { from: x, to: p }
            - { from: x, to: q }
            - { from: p, to: r }
            - { from: q, to: s }
            - { from: p, to: s }
            - { from: r, to: "y" }
            - { from: s, to: "y" }
        steps:
          - caption: |
              Každá cesta z $x$ do $y$ prochází uzlem $p$ nebo $q$ a žádný z nich sám nestačí – $\{p, q\}$ je **uzlový řez** mezi $x$ a $y$.
            set: [p, q]
          - caption: |
              Řez nemusí ležet u $x$: odděluje i $\{r, s\}$. Jednoprvkový řez (artikulace) tu není, proto $u_G(x, y) = 2$.
            set: [r, s]
          - caption: |
              Dvojice $\{q, r\}$ řezem není – cesta $x\,p\,s\,y$ se jí vyhne.
            set: [q, r]
          - caption: |
              Přidáme hranu $\{x, y\}$. Teď žádný uzlový řez mezi $x$ a $y$ neexistuje: hranu mezi nimi odebráním **jiných** uzlů nepřerušíme. Proto se pro sousední uzly klade $u_G(x, y) = n - 1$.
            add: [[x, "y"]]
            set: [p, q]
