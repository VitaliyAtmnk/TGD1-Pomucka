            edge_set: [b3-b1, b3-b2, b3-b4]
      - title: "u(G) = 1 < h(G) = 2"
        for: proof
        property: separating-set
        graph:
          directed: false
          nodes:
            - { id: a2, x: 1, y: 8.5 }
            - { id: a3, x: 1, y: 1.5 }
