  - id: rem-blok
    kind: remark
    label: "Poznámka (str. 24)"
    section: "4.1"
    title: Blok jako maximální podgraf bez artikulace; mosty jsou bloky
    terms:
      - most je blok
    statement: |
      1. Blok je maximální (vzhledem k inkluzi) souvislý podgraf bez artikulace.
      2. Je-li $\{x, y\}$ most, pak podgraf tvořený jedinou hranou $\{x, y\}$ (s jejími
         konci) je blok grafu $G$ – každý most je blokem grafu.
    intuition: |
      Bod 2: jednohranový podgraf artikulaci nemá. Kdyby ho šlo rozšířit na větší
      souvislý podgraf bez artikulace (s aspoň dvěma hranami), ležel by most podle
      [Tvrzení 4.2](#prop-bez-artikulace-kruznice) na kružnici – spor s definicí mostu.
      Naopak jednohranový blok je vždy most: hrana na kružnici leží v bloku obsahujícím
      celou kružnici.
    related: [def-blok, def-most]
    source: "skripta str. 24"

  - id: prop-bez-artikulace-kruznice
    kind: proposition
    label: "Tvrzení 4.2"
    section: "4.1"
    title: Graf bez artikulace – každé dvě hrany na společné kružnici
    terms:
      - graf bez artikulace
      - dvě hrany na kružnici
      - 2-souvislý graf
      - charakterizace grafů bez artikulace
    statement: |
      Buď $G$ souvislý graf s alespoň dvěma hranami. Pak $G$ nemá artikulaci, právě když
      pro každé dvě jeho hrany existuje kružnice, na níž obě leží.
    intuition: |
      Definice artikulace mluví jen o dvojicích hran se **společným** uzlem. Tvrzení říká,
      že lokální podmínka (sousední hrany leží na společné kružnici) se „rozšíří“ na
      libovolné dvě hrany grafu – i hodně vzdálené. Klíčový trik: z kružnice přes $h_1$
      a $e$ a z kružnice přes $e$ a $h_2$ lze vždy poskládat kružnici přes $h_1$ a $h_2$.

      Předpoklad „alespoň dvě hrany“ je ve fóliích (ve skriptech chybí); pro jedinou hranu
      by pravá strana platila jen formálně. Pro $K_2$ i pro graf s mostem a třemi uzly
      ($P_3$) tvrzení dává správný výsledek: $P_3$ má artikulaci a jeho dvě hrany neleží
      na kružnici.
    proof: |
      ($\Leftarrow$) Má-li $G$ artikulaci $x$, pak podle definice existují hrany
      $\{x, y_1\}$, $\{x, y_2\}$, které neleží na žádné společné kružnici – podmínka
      „každé dvě hrany na společné kružnici“ tedy neplatí.

      ($\Rightarrow$) Nechť $G$ nemá artikulaci a předpokládejme pro spor, že existují hrany,
      které na společné kružnici neleží. Mezi všemi takovými dvojicemi zvolme $h_1, h_2$
      s nejmenší vzdáleností (vzdálenost hran = nejmenší vzdálenost jejich koncových uzlů).

      * Kdyby $h_1, h_2$ měly společný uzel $x$, byl by $x$ podle definice artikulací – spor.
        Tedy vzdálenost je $d \ge 1$.
      * Nechť $P = u_1 u_2 \dots u_k$ ($k = d + 1 \ge 2$) je nejkratší cesta mezi nimi,
        $h_1 = \{u_1, v_1\}$, $h_2 = \{u_k, v_2\}$, a označme $e = \{u_{k-1}, u_k\}$.
        Hrany $h_1$ a $e$ mají vzdálenost nejvýše $d - 1$, a jsou různé, takže podle volby
        $h_1, h_2$ leží na společné kružnici $C_1$.
      * Uzel $u_k$ není artikulace, proto sousední hrany $e$ a $h_2$ leží na společné
        kružnici $C_2$. Kružnice $C_2$ neobsahuje $h_1$ a $C_1$ neobsahuje $h_2$
        (jinak by $h_1, h_2$ ležely na společné kružnici).

      Zbývá z $C_1$ a $C_2$ složit kružnici přes $h_1$ i $h_2$. Odebráním hrany $e$
      z $C_2$ vznikne cesta $Q$ z $u_{k-1}$ do $u_k$ obsahující $h_2$; oba její konce leží
      na $C_1$. Jděme po $Q$ od hrany $h_2$ oběma směry, dokud poprvé nenarazíme na uzel
      kružnice $C_1$; dostaneme uzly $p \ne q$ a úsek $Q'$ cesty $Q$ mezi nimi, který
      obsahuje $h_2$ a s $C_1$ má společné jen $p$, $q$. Uzly $p$, $q$ rozdělí $C_1$ na dva
      oblouky, $h_1$ leží na jednom z nich. Tento oblouk spolu s $Q'$ tvoří kružnici
      obsahující $h_1$ i $h_2$ – spor. (Ve skriptech je tento poslední krok shrnut slovy,
      že $H(C_1) \cup H(C_2)$ obsahuje uzavřený tah, z něhož lze kružnici „zřejmým
      způsobem“ vybrat.)
    proof_steps:
      - "(⇐) Artikulace $x$ dává dvě hrany $\\{x,y_1\\}$, $\\{x,y_2\\}$ bez společné kružnice, takže podmínka neplatí."
      - "(⇒) Pro spor zvolíme dvojici hran $h_1, h_2$ bez společné kružnice s nejmenší vzdáleností."
      - Hrany $h_1, h_2$ nemají společný uzel, jinak by to byla artikulace; vezmeme nejkratší cestu $u_1 \dots u_k$ mezi nimi.
      - "Hrana $e = \\{u_{k-1}, u_k\\}$ je k $h_1$ blíž, proto $h_1$ a $e$ leží na společné kružnici $C_1$."
      - Protože $u_k$ není artikulace, leží sousední hrany $e$ a $h_2$ na společné kružnici $C_2$.
      - Z oblouku $C_1$ obsahujícího $h_1$ a z úseku $C_2 - e$ obsahujícího $h_2$ složíme kružnici přes $h_1$ i $h_2$ – spor.
    related: [def-artikulace, cor-blok-kruznice, thm-bloky-hranove-disjunktni]
    source: "skripta str. 24; přednáška 6, fólie 2"

  - id: cor-blok-kruznice
    kind: corollary
    label: "Důsledek 4.1"
    section: "4.1"
    title: Dvě hrany bloku leží na společné kružnici
    terms:
      - hrany bloku na kružnici
    statement: |
      Pro každé dvě hrany bloku, který není mostem, existuje kružnice, na níž obě leží.
    intuition: |
      Blok je souvislý graf bez artikulace, takže na něj stačí použít
      [Tvrzení 4.2](#prop-bez-artikulace-kruznice). Výjimkou jsou jen jednohranové bloky
      (mosty), kde žádné „dvě hrany“ nejsou.
    proof: |
      Blok $B$, který není mostem, má alespoň dvě hrany (jednohranový blok je most,
      viz [poznámku](#rem-blok)). Je to souvislý graf bez artikulace, takže podle
      [Tvrzení 4.2](#prop-bez-artikulace-kruznice) aplikovaného na graf $B$ leží každé dvě
      jeho hrany na společné kružnici grafu $B$. Ta je zároveň kružnicí v $G$.
    proof_steps:
      - Blok, který není mostem, má aspoň dvě hrany.
      - Blok je souvislý graf bez artikulace.
      - Podle Tvrzení 4.2 použitého na samotný blok leží každé dvě jeho hrany na společné kružnici.
    related: [prop-bez-artikulace-kruznice, def-blok, rem-blok]
    source: "skripta str. 24; přednáška 6, fólie 2"

  - id: thm-bloky-hranove-disjunktni
    kind: theorem
    label: "Věta 4.2"
    section: "4.1"
    title: Bloky jsou hranově disjunktní
    terms:
      - bloky hranově disjunktní
      - rozklad hran na bloky
      - společná hrana bloků
    statement: |
      Buďte $G_1$, $G_2$ dva bloky grafu $G$. Pak buďto $G_1 = G_2$, nebo $G_1$ a $G_2$
      nemají žádnou společnou hranu.
    intuition: |
      Množina hran grafu se tak rozpadá na bloky – každá hrana patří do právě jednoho bloku
      (most tvoří blok sám, hrana na kružnici patří do bloku obsahujícího tuto kružnici).
      Uzly se ale sdílet mohou: společným uzlem bloků je vždy artikulace.

      Užitečná „pracovní“ podoba: **dvě hrany leží ve stejném bloku, právě když jsou
      totožné, nebo leží na společné kružnici.**
    proof: |
      Nechť $h$ je společná hrana bloků $G_1$, $G_2$.

      *Je-li $h$ most*, pak blok obsahující $h$ nemůže mít další hranu (jinak by podle
      [Tvrzení 4.2](#prop-bez-artikulace-kruznice) $h$ ležela na kružnici), takže
      $G_1 = G_2 = h$.

      *Leží-li $h$ na nějaké kružnici*, označme $G_h$ podgraf tvořený hranou $h$ a všemi
      hranami, které leží s $h$ na společné kružnici. Blok $G_1$ obsahuje $h$, není mostem,
      a tedy podle [Důsledku 4.1](#cor-blok-kruznice) leží každá jeho hrana s $h$ na
      kružnici: $G_1 \subset G_h$. Stejně $G_2 \subset G_h$.

      Graf $G_h$ je souvislý (každá jeho hrana je s $h$ spojena kružnicí). Pro libovolné
      dvě jeho hrany $f_1, f_2$ máme kružnici přes $f_1, h$ a kružnici přes $h, f_2$;
      stejnou konstrukcí jako v důkazu [Tvrzení 4.2](#prop-bez-artikulace-kruznice) z nich
      složíme kružnici přes $f_1$ a $f_2$. Celá tato kružnice leží v $G_h$ (každá její hrana
      leží na kružnici s $f_1$, a tedy – opět složením – s $h$). Podle Tvrzení 4.2 tedy
      $G_h$ nemá artikulaci.

      $G_h$ je tedy souvislý podgraf bez artikulace obsahující $G_1$ i $G_2$; z maximality
      bloků plyne $G_1 = G_h = G_2$.
    proof_steps:
      - Nechť $h$ je společná hrana bloků $G_1$ a $G_2$; je-li $h$ most, je jediným blokem, který ji obsahuje.
      - Jinak definujeme $G_h$ jako podgraf hran ležících s $h$ na společné kružnici (včetně $h$).
      - Podle Důsledku 4.1 leží každá hrana bloku $G_1$ (i $G_2$) s $h$ na kružnici, tedy $G_1, G_2 \subset G_h$.
      - Složením kružnic přes $h$ se ukáže, že každé dvě hrany $G_h$ leží na společné kružnici, takže $G_h$ nemá artikulaci.
      - Z maximality bloků plyne $G_1 = G_h = G_2$.
    related: [def-blok, cor-blok-kruznice, prop-bez-artikulace-kruznice, rem-bloky-vs-komponenty, def-blokovy-graf]
    source: "skripta str. 24; přednáška 6, fólie 2"

  - id: rem-bloky-vs-komponenty
    kind: remark
    label: "Poznámka (str. 24)"
    section: "4.1"
    title: Bloky versus komponenty
    terms:
      - bloky a komponenty
      - bloky nejsou uzlově disjunktní
    statement: |
      Rozklad grafu na bloky se podobá rozkladu na komponenty s tím rozdílem, že bloky
      **nemusí být uzlově disjunktní**, musí však být **hranově disjunktní**.
    intuition: |
      Komponenty jsou třídy ekvivalence na uzlech („spojeny cestou“), bloky jsou třídy
      ekvivalence na hranách („totožné nebo na společné kružnici“). Uzel, který patří do
      více bloků, je právě artikulace.
    related: [thm-bloky-hranove-disjunktni, def-blok]
    source: "skripta str. 24"

  - id: def-blokovy-graf
    kind: definition
    label: "Definice 4.4"
    section: "4.1"
    title: Blokový graf
    terms:
      - blokový graf
      - B(G)
      - block graph
      - block-cutpoint tree
      - strom bloků a artikulací
    statement: |
      Buď $G$ souvislý graf, $B_1, \dots, B_r$ všechny jeho bloky a $x_1, \dots, x_s$
      všechny jeho artikulace. Graf $B(G)$ definovaný předpisem

      $$
      U(B(G)) = \{x_1, \dots, x_s, B_1, \dots, B_r\},
      $$

      $$
      H(B(G)) = \bigl\{\{a, b\} \mid \exists\, i, j \text{ tak, že } a = x_i,\ b = B_j \text{ a } x_i \in U(B_j)\bigr\},
      $$

      se nazývá **blokový graf** grafu $G$.
    intuition: |
      Každý blok „smrskneme“ do jednoho uzlu a ponecháme artikulace; artikulaci spojíme
      s každým blokem, do něhož patří. Vznikne bipartitní graf (bloky × artikulace), který
      je podle [Věty 4.3](#thm-blokovy-graf-strom) vždy strom. Obrázek $B(G)$ tak shrnuje
