              Teď vedou tři vnitřně disjunktní cesty ($a\,p_1\,b$, $a\,p_2\,r_1\,b$, $a\,p_3\,r_2\,b$) a nejmenší řez $\{p_1, r_1, r_2\}$ má tři uzly: $u_G(a, b) = 3$. Maximum cest se vždy rovná minimu řezu.
            set: [p1, r1, r2]
