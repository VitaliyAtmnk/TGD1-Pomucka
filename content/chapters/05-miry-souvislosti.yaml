            - { id: c, x: 10, y: 8 }
            - { id: d, x: 10, y: 2 }
          edges:
            - { from: a, to: b }
            - { from: a, to: v }
            - { from: b, to: v }
            - { from: v, to: c }
            - { from: v, to: d }
            - { from: c, to: d }
        steps:
          - caption: |
              Motýlek: všechny stupně jsou sudé (2 a 4), a přesto je $v$ artikulace. Artikulace na paritu stupňů žádný vliv nemá – na rozdíl od mostu.
            set: [v]
          - caption: |
              Odebereme hranu $\{b, v\}$: hrana $\{a, b\}$ je teď most. Její konec $a$ má stupeň 2, a proto je artikulací – jeho odebrání odřízne $b$.
            remove: [[b, v]]
