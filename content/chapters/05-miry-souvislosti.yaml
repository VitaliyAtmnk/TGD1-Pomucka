  - id: def-blok
    kind: definition
    label: "Definice 4.3"
    section: "4.1"
    title: Blok grafu
    terms:
      - blok
      - blok grafu
      - block
      - biconnected component
      - 2-souvislá komponenta
      - maximální souvislý podgraf bez artikulace
    statement: |
      Buď $G$ graf, $G' \subset G$ jeho souvislý podgraf. Řekneme, že $G'$ je **blok**
      grafu $G$, jestliže:

      a) $G'$ nemá artikulaci,

      b) jestliže $G''$ je souvislý graf bez artikulace takový, že
         $G' \subset G'' \subset G$, pak $G'' = G'$.
    intuition: |
      Blok je **maximální souvislý podgraf bez artikulace** – kus grafu, který „drží
      pohromadě“ i po odebrání libovolného jednoho uzlu. Bloky hrají pro artikulace
      podobnou roli jako komponenty pro souvislost: graf se na ně jednoznačně rozpadá.
      Rozdíl je v tom, že bloky se mohou dotýkat v uzlech (v artikulacích), ale nesdílejí
      hrany ([Věta 4.2](#thm-bloky-hranove-disjunktni)).

      **Pozor:** podgraf s jedinou hranou artikulaci nemá, proto je každý most samostatným
      blokem.
    examples:
      - title: Bloky stromu a motýlku
        body: |
          * Ve stromu je blokem každá hrana (každá hrana je most).
          * „Motýlek“ (dva trojúhelníky se společným uzlem $v$) má dva bloky – oba
            trojúhelníky; artikulace $v$ patří do obou.
          * Kružnice $C_n$ i úplný graf $K_n$ jsou samy jediným blokem.
    visualization: blocks
    related: [def-artikulace, rem-blok, prop-bez-artikulace-kruznice, thm-bloky-hranove-disjunktni, def-blokovy-graf]
