            - { from: r2, to: b }
        steps:
          - caption: |
              Uzly $a$, $b$ nesousedí. Cesty $a\,p_1\,r_1\,b$ a $a\,p_3\,r_2\,b$ mají společné jen konce, takže každý uzlový řez musí z každé odebrat jiný uzel: $u_G(a, b) \ge 2$.
            edges: { a-p1: path, p1-r1: path, r1-b: path, a-p3: tree, p3-r2: tree, r2-b: tree }
          - caption: |
              Řez $\{r_1, r_2\}$ má dva uzly, tedy $u_G(a, b) = 2$ – přesně tolik, kolik je disjunktních cest. Třetí cesta neexistuje, každá musí projít $r_1$ nebo $r_2$.
            set: [r1, r2]
