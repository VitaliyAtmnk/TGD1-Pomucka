            - { from: a1, to: a4 }
            - { from: a2, to: a3 }
            - { from: a2, to: a4 }
            - { from: a3, to: a4 }
            - { from: b1, to: b2 }
            - { from: b1, to: b3 }
            - { from: b1, to: b4 }
            - { from: b2, to: b3 }
            - { from: b2, to: b4 }
            - { from: b3, to: b4 }
            - { from: a1, to: b1 }
            - { from: a1, to: b2 }
        steps:
          - caption: |
              Uzly jsou „silnější zbraň“ než hrany: odebráním $a_1$ zmizí obě spojovací hrany najednou. Tedy $u(G) = 1 < h(G) = 2 < \delta(G) = 3$ – všechny tři hodnoty jsou různé.
            set: [a1]
          - caption: |
              Myšlenka důkazu $u \le h$: z každé hrany minimálního hranového řezu $\{a_1 b_1, a_1 b_2\}$ vezmeme jeden konec. Množina $\{b_1, b_2\}$ má nejvýš tolik uzlů, kolik má řez hran, a graf rozpojí.
            set: [b1, b2]
          - caption: |
              Libovolná dvojice uzlů to ale není: po odebrání $a_2, a_3$ drží $a_4$ se zbytkem přes $a_1$. Důkaz proto konce vybírá pečlivě – z hran řezu, a tak, aby nezbyl jen jediný uzel.
            set: [a2, a3]
    source: "skripta str. 27; přednáška 6, fólie 4"

  - id: thm-h-odhad-hran
    kind: theorem
    label: "Věta 4.5"
    section: "4.2"
    title: Horní odhad hranové souvislosti počtem hran
    terms:
      - odhad h(G)
      - h(G) ≤ 2m/n
      - průměrný stupeň
    statement: |
      V každém grafu $G$ s alespoň 2 uzly platí

      $$
      h(G) \le \frac{2|H(G)|}{|U(G)|}.
      $$
    intuition: |
      Pravá strana je **průměrný stupeň** grafu. Minimální stupeň nemůže být větší než
      průměrný, a hranová souvislost nemůže být větší než minimální stupeň. Důsledek:
      chceme-li $k$-souvislou síť na $n$ uzlech, potřebujeme aspoň $\lceil kn/2 \rceil$
      hran (např. 3-souvislý graf na 10 uzlech má aspoň 15 hran).
    proof: |
      Podle známé rovnosti (princip sudosti) je $\sum_{x \in U(G)} d_G(x) = 2|H(G)|$.
      Protože $d(x) \ge \delta(G)$ pro každý uzel $x$, je
      $\sum_x d_G(x) \ge |U(G)| \cdot \delta(G)$, a tedy
      $\delta(G) \le \dfrac{2|H(G)|}{|U(G)|}$. Podle [Věty 4.4](#thm-u-h-delta) je
      $h(G) \le \delta(G)$, což dává tvrzení.
    proof_steps:
      - Součet stupňů všech uzlů je roven $2|H(G)|$.
      - Každý stupeň je alespoň $\delta(G)$, takže součet stupňů je alespoň $|U(G)|\,\delta(G)$.
      - Odtud $\delta(G) \le 2|H(G)|/|U(G)|$.
      - Podle Věty 4.4 je $h(G) \le \delta(G)$, a tím je odhad dokázán.
    related: [thm-u-h-delta, def-stupen-souvislosti-grafu]
    source: "skripta str. 27; přednáška 6, fólie 4"

