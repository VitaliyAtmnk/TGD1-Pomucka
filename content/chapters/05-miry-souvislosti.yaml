    related: [def-stupen-souvislosti-grafu, thm-h-odhad-hran, def-hranovy-rez, def-uzlovy-rez]
    illustrations:
      - title: "h(G) = 2 < δ(G) = 3"
        property: disconnecting-edges
        graph:
          directed: false
          nodes:
            - { id: a2, x: 1, y: 8.5 }
            - { id: a3, x: 1, y: 1.5 }
            - { id: a4, x: 2, y: 5 }
