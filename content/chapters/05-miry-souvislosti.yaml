            - { from: d, to: f }
        steps:
          - caption: |
              Souvislý graf $G$ s mostem $\{a, d\}$; pod uzly jsou stupně v $G$.
            edges: { a-d: active }
            labels: { a: "4", b: "2", c: "3", g: "2", d: "4", e: "2", f: "3", h: "2" }
          - caption: |
              Odebráním mostu vzniknou **právě dvě** komponenty a stupeň $a$ i $d$ klesne o 1. Každá komponenta je samostatný graf, takže má **sudý** počet lichých uzlů (vlevo $a, c$, vpravo $d, f$).
            remove: [[a, d]]
            labels: { a: "3", b: "2", c: "3", g: "2", d: "3", e: "2", f: "3", h: "2" }
          - caption: |
              Kdyby v $G$ měly všechny uzly sudý stupeň, byl by v levé komponentě lichý jen uzel $a$ – jediný lichý uzel, což princip sudosti nedovoluje. Spor, takže $G$ má lichý uzel, a dokonce na každé straně mostu aspoň jeden (zde $c$ a $f$).
            nodes: { a: active, d: active, c: path, f: path }
            labels: { a: "3", b: "2", c: "3", g: "2", d: "3", e: "2", f: "3", h: "2" }
            witness: true
