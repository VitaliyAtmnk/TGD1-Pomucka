  - id: rem-puleni-uzlu
    kind: remark
    label: "Poznámka (str. 28)"
    section: "4.3"
    title: Důkazy vět 4.6 a 4.7 jako algoritmy; půlení uzlů
    terms:
      - půlení uzlů
      - štěpení uzlů
      - vstupní polouzel
      - výstupní polouzel
      - node splitting
      - vertex splitting
    statement: |
      Myšlenky důkazů vět 4.6 a 4.7 mají samostatnou důležitost: dávají **algoritmy** pro
      určení hranové, resp. uzlové souvislosti grafu (pomocí maximálního toku).
      Konstrukce z důkazu Věty 4.7 („půlení uzlů“) je standardní metoda, která převádí
      uzlovou souvislost na hranovou, a umožňuje tak použít aparát toků v sítích i na
      uzlovou souvislost. Vzniklým „půlkám uzlů“ se říká **vstupní polouzel** a
      **výstupní polouzel**.
    intuition: |
      Stejný trik se hodí všude, kde má omezenou kapacitu **uzel** (křižovatka, server):
      uzel nahradíme hranou s danou propustností. Algoritmy a jejich složitost jsou
      v kapitole o prohledávání ([hranová](#alg-hranova-souvislost) a
      [uzlová souvislost](#alg-uzlova-souvislost)).
    related: [thm-menger, thm-ford-fulkerson-hranova-souvislost, alg-hranova-souvislost, alg-uzlova-souvislost]
    source: "skripta str. 28"

  - id: cor-whitney-globalni
    kind: corollary
    section: "4.3"
    title: "Globální charakterizace k-souvislých grafů (Whitney)"
    terms:
      - Whitneyho věta
      - Whitney
      - charakterizace k-souvislých grafů
      - globální Mengerova věta
      - k disjunktních cest mezi každými dvěma uzly
    statement: |
      Nechť $G$ je graf na $n$ uzlech a $k \ge 1$.

      1. $h(G) \ge k$, právě když každé dva různé uzly grafu $G$ spojuje $k$ hranově
         disjunktních cest.
      2. Je-li $n \ge k + 1$, pak $u(G) \ge k$, právě když každé dva nesousední uzly grafu
         $G$ spojuje $k$ uzlově (vnitřně) disjunktních cest.
    intuition: |
      Toto je obvyklá „učebnicová“ podoba charakterizace $k$-souvislých grafů
      (H. Whitney, 1932): $k$-souvislost není jen o tom, že graf nejde snadno rozpojit,
      ale také o tom, že mezi libovolnými dvěma uzly vede $k$ nezávislých tras – redundance
      sítě. Ve skriptech je obsažena implicitně ve větách 4.6, 4.7 a Definici 4.9.

      Předpoklad $n \ge k + 1$ v bodě 2 je potřeba kvůli konvenci
      $u_G(x, y) = n - 1$ pro sousední uzly (úplný graf $K_n$ má $u = n - 1$, ne víc).
    proof: |
      *Ve skriptech není jako samostatné tvrzení, doplněno.*

      1. $h(G) = \min_{x \ne y} h_G(x, y) \ge k$ platí, právě když $h_G(x, y) \ge k$ pro
         všechny dvojice, což je podle [Věty 4.6](#thm-ford-fulkerson-hranova-souvislost)
         totéž jako existence $k$ hranově disjunktních cest mezi každými dvěma uzly.
      2. $u(G) = \min_{x \ne y} u_G(x, y)$. Pro sousední dvojice je $u_G(x, y) = n - 1 \ge k$
         díky předpokladu $n \ge k + 1$. Podmínka $u(G) \ge k$ je tedy ekvivalentní
         s $u_G(x, y) \ge k$ pro všechny **nesousední** dvojice, což je podle
         [Mengerovy věty](#thm-menger) totéž jako existence $k$ uzlově disjunktních cest
         mezi nimi.
    proof_steps:
      - Hranová souvislost $h(G)$ je minimum lokálních hodnot $h_G(x,y)$ přes všechny dvojice uzlů.
      - Podle Věty 4.6 je $h_G(x,y) \ge k$ ekvivalentní s existencí $k$ hranově disjunktních cest mezi $x$ a $y$.
      - U uzlové souvislosti mají sousední dvojice $u_G(x,y) = n-1 \ge k$, takže rozhodují jen nesousední dvojice.
      - Pro nesousední dvojice použijeme Mengerovu větu.
    related: [thm-menger, thm-ford-fulkerson-hranova-souvislost, def-stupen-souvislosti-grafu]
    source: "doplněno (důsledek vět 4.6, 4.7 a Definice 4.9)"
    supplemented: true

quiz:
  - id: q-miry-01
    question: |
      Které tvrzení o mostu $\{x, y\}$ souvislého grafu $G$ platí **vždy**?
    options:
      - Oba uzly $x$ a $y$ jsou artikulacemi grafu $G$.
      - 'Graf $G - \{x, y\}$ je nesouvislý.'
      - Uzly $x$ a $y$ mají lichý stupeň.
      - Graf $G$ nemá žádnou kružnici.
    correct: 1
    explanation: |
      Most neleží na žádné kružnici, takže jeho odebráním se graf rozpojí (Tvrzení 4.1).
      Konce mostu nemusí být artikulacemi – v grafu $K_2$ i u listu stromu je koncem mostu
      uzel stupně 1. Liché stupně má graf s mostem někde (Věta 4.1), ne nutně v koncích
      mostu. A graf s mostem jinde kružnice mít může.
    related: [prop-most-rozpojuje, rem-artikulace-a-mosty, thm-most-liche-stupne]

  - id: q-miry-02
    question: |
      Souvislý graf $G$ má všechny uzly sudého stupně. Co lze říci o jeho mostech?
    options:
      - Má právě jeden most.
      - Nemá žádný most.
      - Má sudý počet mostů.
      - Nelze nic říci.
    correct: 1
    explanation: |
      Podle Věty 4.1 má souvislý graf s mostem aspoň dva uzly lichého stupně. Má-li všechny
      stupně sudé, most mít nemůže. (Důkaz: po odebrání mostu by každá ze dvou komponent
      měla jediný lichý uzel, což odporuje principu sudosti.)
    related: [thm-most-liche-stupne]

  - id: q-miry-03
    question: |
      Kolik bloků má strom s $n \ge 2$ uzly?
    options:
      - '$1$'
      - '$n - 1$'
      - '$n$'
      - Tolik, kolik má listů.
    correct: 1
    explanation: |
      Každá hrana stromu je most a každý most je samostatným blokem. Strom má $n - 1$ hran,
      tedy $n - 1$ bloků. Artikulacemi jsou nekoncové uzly.
    related: [def-blok, rem-blok]

  - id: q-miry-04
    question: |
      Které tvrzení o dvou různých blocích $B_1 \ne B_2$ téhož grafu platí?
    options:
      - Nemají žádný společný uzel.
      - Nemají žádnou společnou hranu, ale mohou mít společný uzel – artikulaci.
      - Mají právě jednu společnou hranu.
      - Jeden je vždy podgrafem druhého.
    correct: 1
    explanation: |
      Bloky jsou hranově disjunktní (Věta 4.2), ale mohou sdílet uzel; společný uzel dvou
      bloků je vždy artikulací. Tím se liší od komponent, které jsou uzlově disjunktní.
    related: [thm-bloky-hranove-disjunktni, rem-bloky-vs-komponenty]

  - id: q-miry-05
    question: |
      Souvislý graf má 4 bloky a 3 artikulace. Kolik hran má jeho blokový graf $B(G)$?
    options:
      - '$3$'
      - '$4$'
      - '$6$'
      - '$7$'
    correct: 2
    explanation: |
      $B(G)$ má $4 + 3 = 7$ uzlů a podle Věty 4.3 je to strom, má tedy $7 - 1 = 6$ hran.
    related: [def-blokovy-graf, thm-blokovy-graf-strom]

  - id: q-miry-06
    question: |
      Která trojice hodnot $(u(G), h(G), \delta(G))$ **nemůže** nastat pro žádný graf?
    options:
      - '$(2, 3, 4)$'
      - '$(3, 3, 3)$'
      - '$(3, 2, 4)$'
      - '$(1, 1, 5)$'
    correct: 2
    explanation: |
      Podle Věty 4.4 vždy $u(G) \le h(G) \le \delta(G)$, takže $u = 3 > h = 2$ je
      nemožné. Trojice $(2,3,4)$ nastává pro dvě kopie $K_5$ spojené třemi hranami,
      $(3,3,3)$ pro krychli a $(1,1,5)$ např. pro dvě kopie $K_6$ spojené mostem.
    related: [thm-u-h-delta]

  - id: q-miry-07
    question: |
      Graf má 10 uzlů a 14 hran. Jaká je největší možná hodnota $h(G)$?
    options:
      - '$1$'
      - '$2$'
      - '$3$'
      - '$4$'
    correct: 1
    explanation: |
      Podle Věty 4.5 je $h(G) \le 2|H|/|U| = 28/10 = 2{,}8$, a protože $h(G)$ je celé
      číslo, je $h(G) \le 2$. Hodnota 2 je dosažitelná (např. kružnice $C_{10}$
      se čtyřmi tětivami).
    related: [thm-h-odhad-hran]

  - id: q-miry-08
    question: |
      Jakou hodnotu má podle definice $u_G(x, y)$, jsou-li $x$ a $y$ **sousední** uzly
      grafu na $n$ uzlech?
    options:
      - '$0$'
      - '$1$'
      - '$n - 2$'
      - '$n - 1$'
    correct: 3
    explanation: |
      Sousední uzly nelze oddělit odebráním jiných uzlů (hrana mezi nimi zůstane), uzlový
      řez neexistuje a klade se $u_G(x, y) = |U(G)| - 1$. Díky tomu vyjde $u(K_n) = n - 1$.
    related: [def-uzlovy-stupen-mezi-uzly]

  - id: q-miry-09
    question: |
      Proč je v Mengerově větě předpoklad, že uzly $a$, $b$ jsou **nesousední**?
    options:
      - Protože pro sousední uzly neexistuje žádná cesta z $a$ do $b$.
      - Protože sousední uzly nelze oddělit odebráním jiných uzlů – v síti by hrana $\{a,b\}$ dala nekonečný tok.
      - Protože pro sousední uzly vždy existuje jen jedna cesta.
      - Předpoklad je zbytečný, věta platí pro libovolné dva uzly.
    correct: 1
    explanation: |
      Je-li $\{a, b\}$ hrana, žádný uzlový řez mezi $a$ a $b$ neexistuje. V síti
      s půlenými uzly by vedla hrana $((a,2),(b,1))$ s nekonečnou propustností, takže by
      neexistoval konečný řez a tvrzení by nedávalo smysl.
    related: [thm-menger, def-uzlovy-rez]

  - id: q-miry-10
    question: |
      V konstrukci sítě z důkazu Mengerovy věty (půlení uzlů) mají propustnost 1:
    options:
      - 'hrany $((x,2),(y,1))$ odpovídající hranám grafu'
      - 'hrany $((x,1),(x,2))$ spojující polouzly téhož uzlu'
      - všechny hrany sítě
      - jen hrany vycházející ze zdroje
    correct: 1
    explanation: |
      Jednotková propustnost na hraně mezi vstupním a výstupním polouzlem zajistí, že
      každým uzlem projde nejvýše jedna cesta. Hrany odpovídající hranám grafu mají
      propustnost $\infty$, aby je minimální řez nikdy neobsahoval – řez se tak skládá jen
      z „uzlů“.
    related: [thm-menger, rem-puleni-uzlu]

  - id: q-miry-11
    question: |
      Jak se podle důkazu Věty 4.6 určí $h_G(a, b)$?
    options:
      - Jako počet uzlů na nejkratší cestě z $a$ do $b$.
      - Jako maximální tok ze zdroje $a$ do stoku $b$ v symetrické orientaci $G$ s jednotkovými propustnostmi.
      - Jako $\min\{d(a), d(b)\}$.
      - Jako maximální tok v síti s půlenými uzly.
    correct: 1
    explanation: |
      Každou hranu nahradíme dvojicí opačných orientovaných hran s propustností 1;
      minimální řez sítě odpovídá minimálnímu hranovému řezu, takže velikost maximálního
      toku je $h_G(a, b)$. Hodnota $\min\{d(a), d(b)\}$ je jen horní odhad. Síť s půlenými
      uzly slouží k určení uzlové souvislosti.
    related: [thm-ford-fulkerson-hranova-souvislost, alg-hranova-souvislost]

  - id: q-miry-12
    question: |
      Graf vznikne ze dvou kopií $K_5$, které mají společný právě jeden uzel. Jaké jsou
      hodnoty $u(G)$, $h(G)$, $\delta(G)$?
    options:
      - '$u = 1$, $h = 1$, $\delta = 4$'
      - '$u = 1$, $h = 4$, $\delta = 4$'
      - '$u = 4$, $h = 4$, $\delta = 4$'
      - '$u = 2$, $h = 4$, $\delta = 4$'
    correct: 1
    explanation: |
      Společný uzel je artikulace, takže $u = 1$. Most v grafu není – každá hrana leží
      v nějakém $K_5$ – a k oddělení uzlu jedné kopie od uzlu druhé je potřeba přestřihnout
      4 hrany (všechny hrany u uzlu jedné kopie nebo u společného uzlu „na jedné straně“),
      tedy $h = 4 = \delta$. Hezký příklad, že $u$ může být mnohem menší než $h$.
    related: [thm-u-h-delta, def-artikulace]

  - id: q-miry-13
    question: |
      V šestiúhelníku $C_6$ zvolíme dva protější uzly $x$, $y$. Která množina hran **je**
      hranovým řezem mezi $x$ a $y$?
    options:
      - Jedna libovolná hrana.
      - Dvě hrany ležící na téže z obou cest mezi $x$ a $y$.
      - Dvě hrany, z nichž každá leží na jiné z obou cest mezi $x$ a $y$.
      - Tři hrany, z nichž dvě leží na jedné cestě a jedna na druhé.
    correct: 2
    explanation: |
      Mezi $x$ a $y$ vedou v $C_6$ právě dvě cesty; řez musí zasáhnout obě. Dvě hrany na
      různých cestách to splňují a žádnou nelze vynechat. Tři hrany cesty také přeruší,
      ale nejsou minimální (podmínka 2 definice), takže řezem nejsou.
    related: [def-hranovy-rez, rem-hranovy-rez]

  - id: q-miry-14
    question: |
      Jakou časovou složitost má určení hranového stupně souvislosti $h(G)$ celého grafu
      postupem „maximální tok pro všechny dvojice uzlů“ (Dinicův algoritmus, $O(n^3)$ na
      jeden tok)?
    options:
      - '$O(n + m)$'
      - '$O(n^3)$'
      - '$O(n^5)$'
      - Exponenciální.
    correct: 2
    explanation: |
      Dvojic uzlů je $O(n^2)$ a pro každou počítáme tok v čase $O(n^3)$, celkem $O(n^5)$.
      Vylepšení (Even, Hopcroft, Tarjan) dává $O(m^2\sqrt{n}) \subseteq O(n^{4{,}5})$.
      V čase $O(n + m)$ jde jen zjistit 1-, 2- a 3-souvislost (backtracking).
    related: [alg-hranova-souvislost, thm-ford-fulkerson-hranova-souvislost]
