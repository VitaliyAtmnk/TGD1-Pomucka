            - { id: a5, x: 2.5, y: 3 }
            - { id: b1, x: 8.5, y: 9 }
            - { id: b2, x: 7, y: 6 }
            - { id: b3, x: 10, y: 6 }
            - { id: b4, x: 7.5, y: 3 }
            - { id: b5, x: 9.5, y: 3 }
          edges:
            - { from: a1, to: a2 }
            - { from: a1, to: a3 }
            - { from: a1, to: a4 }
            - { from: a1, to: a5 }
            - { from: a2, to: a3 }
            - { from: a2, to: a4 }
            - { from: a2, to: a5 }
