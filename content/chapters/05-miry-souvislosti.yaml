  - id: def-artikulace
    kind: definition
    label: "Definice 4.2"
    section: "4.1"
    title: Artikulace grafu
    terms:
      - artikulace
      - artikulační uzel
      - articulation point
      - cut vertex
      - cut-vertex
      - separating vertex
    statement: |
      Uzel $x \in U(G)$ je **artikulace** grafu $G$, jestliže existují hrany
      $\{x, y_1\}$ a $\{x, y_2\}$, které nepatří současně téže kružnici grafu $G$.
    intuition: |
      Artikulace je uzlová obdoba mostu: uzel, přes který „vede jediná spojka“ mezi dvěma
      částmi grafu. Pro souvislý graf je definice ekvivalentní s tím, že po odebrání uzlu
      $x$ (i s jeho hranami) graf přestane být souvislý – viz
      [doplněné tvrzení](#prop-artikulace-rozpojuje).

      **Příklady:** každý nekoncový uzel stromu (stupně aspoň 2) je artikulací, listy
      artikulacemi nejsou. Uzel, v němž se „dotýkají“ dvě kružnice (motýlek), je artikulace.
      Kružnice $C_n$ ani úplný graf $K_n$ artikulaci nemají.
    examples:
      - title: Uzel společný trojúhelníku, visuté hraně a čtyřúhelníku
        body: |
          Uzel $x$ leží na trojúhelníku $x, a, b$, na čtyřúhelníku $x, c, d, e$ a je k němu
          připojen list $f$. Hrany $\{x, a\}$ a $\{x, c\}$ neleží na společné kružnici
          (každá kružnice přes $x$ zůstává buď v trojúhelníku, nebo ve čtyřúhelníku),
          takže $x$ je artikulace. Žádný jiný uzel artikulací není.
        graph:
          directed: false
          nodes:
            - { id: a, x: 0, y: 8 }
            - { id: b, x: 0, y: 2 }
            - { id: f, x: 3, y: 9 }
            - { id: x, x: 3, y: 5 }
            - { id: c, x: 6, y: 8 }
            - { id: e, x: 6, y: 2 }
            - { id: d, x: 9, y: 5 }
          edges:
            - { from: a, to: b }
            - { from: a, to: x }
            - { from: b, to: x }
            - { from: x, to: f }
            - { from: x, to: c }
            - { from: c, to: d }
            - { from: d, to: e }
            - { from: e, to: x }
    visualization: blocks
    related: [def-most, prop-artikulace-rozpojuje, rem-artikulace-a-mosty, def-blok, def-uzlovy-rez]
    illustrations:
      - title: Který uzel graf rozpojí
        property: separating-set
        graph:
          directed: false
          nodes:
            - { id: a, x: 0, y: 8 }
            - { id: b, x: 0, y: 2 }
            - { id: f, x: 3, y: 9.5 }
            - { id: x, x: 3, y: 5 }
            - { id: c, x: 6, y: 8 }
            - { id: e, x: 6, y: 2 }
            - { id: d, x: 9, y: 5 }
          edges:
            - { from: a, to: b }
            - { from: a, to: x }
            - { from: b, to: x }
            - { from: x, to: f }
            - { from: x, to: c }
            - { from: c, to: d }
            - { from: d, to: e }
            - { from: e, to: x }
        steps:
          - caption: |
              Odebráním $x$ se graf rozpadne na tři části (trojúhelník, list $f$ a zbytek čtyřúhelníku) – $x$ je **artikulace**. Hrany $\{x, a\}$ a $\{x, c\}$ opravdu neleží na společné kružnici.
            set: [x]
          - caption: |
              Uzel $c$ leží na čtyřúhelníku $x, c, d, e$. Po jeho odebrání drží $d$ s ostatními dál přes $e$ a $x$, takže artikulací není.
            set: [c]
          - caption: |
              List $f$ artikulací není: jeho odebrání zbytek grafu nerozpojí (u $f$ ani nejsou dvě hrany, které by mohly „neležet na společné kružnici“).
            set: [f]
          - caption: |
              Přidáme hranu $\{b, e\}$: hrany $\{x, a\}$ a $\{x, e\}$ teď leží na společné kružnici $x, a, b, e$. Přesto je $x$ stále artikulace – list $f$ je k ostatku připojen jen přes $x$.
            add: [[b, e]]
            set: [x]
          - caption: |
              Připojíme i list $f$ hranou $\{f, c\}$. Teď leží každé dvě hrany u $x$ na společné kružnici a odebrání $x$ graf nerozpojí – artikulace zmizela.
            add: [[f, c]]
            set: [x]
    source: "skripta str. 23; přednáška 6, fólie 1"

  - id: prop-artikulace-rozpojuje
    kind: proposition
    section: "4.1"
    title: Artikulace jako uzel, jehož odebráním se graf rozpadne
    terms:
      - artikulace rozpojuje graf
      - odebrání uzlu
      - G minus uzel
    statement: |
      Nechť $G$ je souvislý graf a $x \in U(G)$. Pak $x$ je artikulace grafu $G$, právě
      když graf $G - x$ (vzniklý odebráním uzlu $x$ a všech hran s ním incidentních)
      je nesouvislý.
    intuition: |
      Tato ekvivalence se ve skriptech používá mlčky – např. u naivního algoritmu
      na hledání artikulací („odeber uzel a zjisti, zda vzrostl počet komponent“)
      i u Tarjanova algoritmu. Spojuje „kružnicovou“ definici artikulace s intuitivní
      představou uzlu, který graf rozpojuje.
    proof: |
      *Důkaz ve skriptech není, doplněno.*

      ($\Rightarrow$) Nechť hrany $\{x, y_1\}$, $\{x, y_2\}$ neleží na společné kružnici.
      Kdyby byl $G - x$ souvislý, existovala by v něm cesta $Q$ z $y_1$ do $y_2$ (neprochází
      uzlem $x$). Cesta $Q$ spolu s hranami $\{y_2, x\}$, $\{x, y_1\}$ by byla kružnice
      obsahující obě hrany – spor. Tedy $G - x$ je nesouvislý.

      ($\Leftarrow$) Nechť $G - x$ je nesouvislý. Protože $G$ je souvislý, každá komponenta
      grafu $G - x$ obsahuje nějakého souseda uzlu $x$. Zvolme sousedy $y_1$, $y_2$ ležící
      v různých komponentách $G - x$. Kdyby hrany $\{x, y_1\}$, $\{x, y_2\}$ ležely na
      společné kružnici, zbytek této kružnice by byla cesta z $y_1$ do $y_2$ vyhýbající se
      uzlu $x$, tj. cesta v $G - x$ – spor s tím, že $y_1$, $y_2$ jsou v různých
      komponentách. Uzel $x$ je tedy artikulace.
    proof_steps:
      - "(⇒) Hrany $\\{x,y_1\\}$, $\\{x,y_2\\}$ neleží na společné kružnici; předpokládáme pro spor, že $G-x$ je souvislý."
      - "Cesta z $y_1$ do $y_2$ v $G-x$ by spolu s oběma hranami tvořila kružnici přes obě hrany – spor."
      - "(⇐) Je-li $G-x$ nesouvislý, má každá jeho komponenta souseda uzlu $x$, protože $G$ je souvislý."
      - "Zvolíme sousedy $y_1$, $y_2$ v různých komponentách $G-x$."
      - "Společná kružnice přes $\\{x,y_1\\}$ a $\\{x,y_2\\}$ by dala cestu $y_1 \\to y_2$ v $G-x$, což nejde; $x$ je artikulace."
    related: [def-artikulace, prop-most-rozpojuje, def-uzlovy-rez]
    source: "doplněno (používá se ve skriptech str. 32)"
    supplemented: true

  - id: rem-artikulace-a-mosty
    kind: remark
    label: "Poznámka (str. 24)"
    section: "4.1"
    title: Artikulace, parita stupňů a vztah k mostům
    terms:
      - artikulace a parita
      - konce mostu jsou artikulace
    statement: |
      1. Existence artikulace (na rozdíl od mostu) **nemá žádný vliv na paritu stupňů**:
         existují grafy s artikulací, kde mají všechny uzly sudý stupeň (dva trojúhelníky
         se společným uzlem), i grafy s artikulací, kde mají všechny uzly lichý stupeň.
      2. Je-li hrana $\{x, y\}$ mostem, pak každý její konec, který má stupeň alespoň 2,
         je artikulací. Speciálně **souvislý graf s alespoň třemi uzly, který nemá
         artikulaci, nemá ani most.**
    intuition: |
      Ve skriptech je bod 2 formulován bez omezení („oba uzly $x$, $y$ jsou artikulacemi“,
      „nemá-li graf artikulaci, nemůže mít ani most“). To neplatí pro konce stupně 1:
      v grafu $K_2$ (jediná hrana) je tato hrana mostem, ale žádná artikulace neexistuje;
      list stromu je koncem mostu, a přesto není artikulací. Proto je zde formulace
      zpřesněna.

      Proč to platí: má-li $x$ kromě mostu $\{x, y\}$ ještě hranu $\{x, z\}$, pak
      $\{x, y\}$ a $\{x, z\}$ nemohou ležet na společné kružnici (most neleží na žádné),
      takže $x$ je podle definice artikulace. V souvislém grafu s aspoň 3 uzly má aspoň
      jeden konec mostu stupeň $\ge 2$.
    related: [def-artikulace, def-most, thm-most-liche-stupne]
    illustrations:
