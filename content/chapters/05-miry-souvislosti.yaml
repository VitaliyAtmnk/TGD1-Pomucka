  - id: rem-uzlovy-rez
    kind: remark
    label: "Poznámka (str. 26)"
    section: "4.2"
    title: Vlastnosti uzlového řezu
    terms:
      - artikulace je jednoprvkový uzlový řez
    statement: |
      1. Odstraněním uzlového řezu dostaneme opět nesouvislý graf.
      2. Artikulace je jednoprvkový uzlový řez.
    intuition: |
      Bod 2 je přesně [doplněné tvrzení](#prop-artikulace-rozpojuje): uzel je artikulací,
      právě když jeho odebrání rozpojí graf, tj. když $\{x\}$ odděluje nějakou dvojici uzlů.
    related: [def-uzlovy-rez, def-artikulace, prop-artikulace-rozpojuje]
    source: "skripta str. 26"

  - id: def-uzlovy-stupen-mezi-uzly
    kind: definition
    label: "Definice 4.8"
    section: "4.2"
    title: Uzlový stupeň souvislosti mezi uzly, matice uzlové souvislosti
    terms:
      - uzlový stupeň souvislosti mezi uzly
      - u_G(x,y)
      - lokální uzlová souvislost
      - matice uzlové souvislosti
      - local vertex connectivity
    statement: |
      Nejmenší počet prvků uzlového řezu oddělujícího uzly $x$ a $y$ se nazývá **uzlový
      stupeň souvislosti** grafu $G$ mezi uzly $x$ a $y$ a značí se $u_G(x, y)$.
      Neexistuje-li uzlový řez mezi $x$ a $y$, tj. jsou-li uzly $x$ a $y$ sousední,
      klademe $u_G(x, y) = |U(G)| - 1$.

      Z hodnot $u_G(x, y)$ sestavíme analogicky **matici uzlové souvislosti** $U_G$.
    intuition: |
      Konvence $|U(G)| - 1$ pro sousední uzly je volena tak, aby vyšlo $u(K_n) = n - 1$
      a aby sousední dvojice „nekazily“ minimum v definici $u(G)$: oddělující množina uzlů
      různých od $x, y$ má nejvýše $n - 2$ prvků, takže sousední dvojice nikdy nejsou
      „nejslabším místem“, pokud graf není úplný.
    examples:
      - title: Matice uzlové souvislosti
        body: |
          Pro graf z příkladu u [matice hranové souvislosti](#def-hranovy-stupen-mezi-uzly)
          (hrany $12, 14, 24, 23, 34, 45$, $n = 5$):

          $$
          U_G = \begin{bmatrix}
          - & 4 & 2 & 4 & 1 \\
          4 & - & 4 & 4 & 1 \\
          2 & 4 & - & 4 & 1 \\
          4 & 4 & 4 & - & 4 \\
          1 & 1 & 1 & 4 & -
          \end{bmatrix}
          $$

          Sousední dvojice mají hodnotu $n - 1 = 4$; $u_G(1, 3) = 2$ (řez $\{2, 4\}$),
          $u_G(x, 5) = 1$ pro $x \ne 4$ (řez $\{4\}$, uzel $4$ je artikulace).
    related: [def-uzlovy-rez, def-stupen-souvislosti-grafu, thm-menger, def-hranovy-stupen-mezi-uzly]
    source: "skripta str. 26; přednáška 6, fólie 3"

  - id: def-stupen-souvislosti-grafu
    kind: definition
    label: "Definice 4.9"
    section: "4.2"
    title: Uzlový a hranový stupeň souvislosti grafu, k-souvislost
    terms:
      - k-souvislost
      - k-souvislý graf
      - uzlová souvislost
      - hranová souvislost
      - uzlově k-souvislý
      - hranově k-souvislý
      - u(G)
      - h(G)
      - kappa(G)
      - lambda(G)
      - vertex connectivity
      - edge connectivity
      - k-connected graph
      - 2-souvislý graf
    statement: |
      Nejmenší z čísel $u_G(x, y)$ (přes všechny dvojice různých uzlů) nazveme **uzlový
      stupeň souvislosti** grafu $G$ a značíme jej $u(G)$. Nejmenší z čísel $h_G(x, y)$
      nazveme **hranový stupeň souvislosti** grafu $G$ a značíme jej $h(G)$.

      Řekneme, že graf $G$ je **uzlově (hranově) $k$-souvislý**, jestliže
      $u(G) \ge k$ ($h(G) \ge k$).
    intuition: |
      $u(G)$ je nejmenší počet uzlů, jejichž odebráním graf rozpojíme (u úplného grafu
      $n - 1$), $h(G)$ nejmenší počet hran, jejichž odebráním graf rozpojíme. V literatuře
      se značí $\kappa(G)$ a $\lambda(G)$.

      **Příklady:** strom s aspoň 3 uzly: $u = h = 1$; kružnice $C_n$: $u = h = 2$;
      $K_n$: $u = h = n - 1$; krychle $Q_3$: $u = h = 3$. Graf je 1-souvislý, právě když
      je souvislý; je 2-souvislý, právě když je souvislý, má aspoň 3 uzly a nemá
      artikulaci.

      Pozor na rozlišení: „$G$ je $k$-souvislý“ znamená $u(G) \ge k$, ne $u(G) = k$.
      Každý 3-souvislý graf je tedy i 2-souvislý.
    related: [def-uzlovy-stupen-mezi-uzly, def-hranovy-stupen-mezi-uzly, rem-k-souvislost, thm-u-h-delta, cor-whitney-globalni]
    source: "skripta str. 26; přednáška 6, fólie 4"

  - id: rem-k-souvislost
    kind: remark
    label: "Poznámka (str. 27)"
    section: "4.2"
    title: Konvence ke k-souvislosti
    terms:
      - k-souvislost znamená uzlovou
      - nesouvislý graf souvislost 0
    statement: |
      1. Často se pro jednoduchost používá pojem **$k$-souvislost** ve významu uzlové
         $k$-souvislosti. Hranová $k$-souvislost se vždy uvádí explicitně.
      2. Pro nesouvislé grafy klademe $u(G) = h(G) = 0$ (příslušné řezy jsou pak prázdné
         množiny).
    intuition: |
      Bod 2 je přirozený: nesouvislý graf je „rozpojen“ už bez odebrání čehokoli.
    related: [def-stupen-souvislosti-grafu]
    source: "skripta str. 27"

  - id: thm-u-h-delta
    kind: theorem
    label: "Věta 4.4"
    section: "4.2"
    title: "Nerovnost u(G) ≤ h(G) ≤ δ(G)"
    terms:
      - Whitneyho nerovnost
      - u(G) ≤ h(G) ≤ δ(G)
      - minimální stupeň
      - delta(G)
      - kappa lambda delta
    statement: |
      Pro každý graf $G$ platí

      $$
      u(G) \le h(G) \le \delta(G),
      $$

      kde $\delta(G) = \min\{d(x) \mid x \in U(G)\}$ je minimální stupeň grafu $G$.
    intuition: |
      *Druhá nerovnost:* odříznutím všech hran u uzlu nejmenšího stupně ho izolujeme.
      *První nerovnost:* z každé hrany minimálního hranového řezu stačí „sebrat“ jeden
      konec – tak dostaneme uzlovou množinu stejné velikosti, která graf rozpojí (s malou
      opatrností u posledního kroku). Uzly jsou tedy „silnější zbraň“ než hrany: odebrání
      uzlu odstraní najednou všechny jeho hrany.

      Nerovnosti mohou být ostré: dva grafy $K_5$ spojené třemi hranami, jejichž konce
      v jedné z kopií jsou jen dva uzly, mají $u = 2$, $h = 3$, $\delta = 4$. Krychle $Q_3$
      má $u = h = \delta = 3$.
    proof: |
      **Druhá nerovnost.** Nechť $x$ je uzel stupně $\delta(G)$ (a $G$ má aspoň 2 uzly).
      Množina všech hran incidentních s $x$ odděluje $x$ od ostatních uzlů a obsahuje
      hranový řez; proto $h(G) \le \delta(G)$. (Pro nesouvislý $G$ je $h(G) = 0$.)

      **První nerovnost.** Je-li $h(G) = 0$, je $G$ nesouvislý a $u(G) = 0$. Je-li
      $h(G) = 1$, je $u(G) \le 1$: buď je $G = K_2$ ($u = 1$), nebo má $G$ most s koncem
      stupně aspoň 2, a ten je artikulací.

      Nechť tedy $h(G) = k \ge 2$ a $B$ je hranový řez o $k$ hranách. Odebereme z $G$
      libovolných $k - 1$ hran řezu $B$; vznikne graf, v němž zbylá hrana $\{u, v\}$ řezu
      je mostem. Pro každou odebranou hranu vybereme jeden její konec různý od $u$ i $v$;
      vznikne množina uzlů $A$, $|A| \le k - 1$.

      * Je-li $G - A$ nesouvislý, je $u(G) \le |A| \le k - 1$.
      * Je-li $G - A$ souvislý, je $\{u, v\}$ jeho mostem (všechny ostatní hrany řezu
        zmizely spolu s uzly z $A$). Graf $G$ má alespoň $k + 2$ uzlů: kdyby jich měl jen
        $k + 1$, plyne z $\delta(G) \ge h(G) = k$, že $G = K_{k+1}$, a pak $u(G) = k$ a
        tvrzení platí. Graf $G - A$ má tedy aspoň 3 uzly, takže jeden z uzlů $u$, $v$ má
        v $G - A$ ještě jiného souseda a jeho odebráním se $G - A$ rozpadne. Dostáváme
        $k$-prvkovou (nebo menší) množinu uzlů rozpojující $G$, tedy $u(G) \le k$.

      V každém případě $u(G) \le k = h(G)$.
    proof_steps:
      - Hrany u uzlu minimálního stupně oddělí tento uzel od zbytku grafu, takže $h(G) \le \delta(G)$.
      - Případy $h(G) = 0$ (nesouvislý graf) a $h(G) = 1$ (most, jehož konec je artikulací, nebo $K_2$) jsou snadné.
      - Pro $h(G) = k \ge 2$ vezmeme minimální řez $B$ a odebereme z něj $k-1$ hran; zbylá hrana $\{u,v\}$ je most.
      - Z každé odebrané hrany vezmeme konec různý od $u, v$ a dostaneme množinu $A$ s nejvýše $k-1$ uzly.
      - Je-li $G - A$ nesouvislý, je $u(G) \le k - 1$.
      - Jinak má $G - A$ most $\{u,v\}$ a aspoň 3 uzly (případ $G = K_{k+1}$ zvlášť), takže odebrání $u$ nebo $v$ graf rozpojí a $u(G) \le k$.
    examples:
      - title: Ostré nerovnosti – dvě kopie K5
        body: |
          Dvě kopie $K_5$ (uzly $a_1, \dots, a_5$ a $b_1, \dots, b_5$) spojíme hranami
          $a_3 b_2$, $a_5 b_4$, $a_5 b_2$. Každý uzel má stupeň aspoň 4, tedy
          $\delta = 4$. Tři spojovací hrany tvoří hranový řez a menší neexistuje
          (každé dva uzly uvnitř kopie $K_5$ spojují 4 hranově disjunktní cesty), takže
          $h = 3$. Odebráním dvou uzlů $a_3, a_5$ se graf rozpadne, artikulace neexistuje,
          tedy $u = 2$.
        graph:
          directed: false
          nodes:
            - { id: a1, x: 1.5, y: 9 }
            - { id: a2, x: 0, y: 6 }
            - { id: a3, x: 3, y: 6 }
