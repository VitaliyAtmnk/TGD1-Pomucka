      - title: Rovnosti – krychle Q3
        body: |
          Graf krychle (vnější a vnitřní čtyřúhelník propojené čtyřmi „příčkami“) je
          3-regulární, $\delta = 3$, a nelze ho rozpojit odebráním dvou uzlů ani dvou hran:
          $u = h = \delta = 3$.
        graph:
          directed: false
