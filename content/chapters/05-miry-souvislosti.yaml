id: miry-souvislosti
number: 5
title: Míry souvislosti grafu
source: "TGD1 skripta kap. 4 (str. 23–28); přednáška 6 (TGD1-06-folie)"
exam_questions: [8]
summary: |
  Kapitola zpřesňuje otázku „jak moc“ je graf souvislý. Začíná nejjednoduššími
  slabými místy – mosty a artikulacemi – a rozkladem grafu na bloky, které tvoří
  stromovou strukturu (blokový graf). Pak zobecňuje most a artikulaci na hranové
  a uzlové řezy a zavádí hranový a uzlový stupeň souvislosti $h(G)$, $u(G)$.
  Vrcholem jsou charakterizační věty (Ford–Fulkerson pro hranovou souvislost
  a Mengerova věta), které převádějí výpočet souvislosti na úlohu o maximálním toku,
  a tím dávají polynomiální algoritmy. V celé kapitole je „graf“ neorientovaný.
sections:
  - number: "4.1"
    title: Mosty, artikulace, bloky grafu
  - number: "4.2"
    title: Hranový a uzlový stupeň souvislosti grafu
  - number: "4.3"
    title: Charakterizační věty k-souvislých grafů
items:
  # ------------------------------------------------------------------ 4.1
  - id: def-most
    kind: definition
    label: "Definice 4.1"
    section: "4.1"
    title: Most grafu
    terms:
      - most
      - most grafu
      - bridge
      - cut edge
      - isthmus
      - kritická hrana
    statement: |
      Hrana $\{x, y\} \in H(G)$ se nazývá **most** grafu $G$, jestliže v grafu $G$
      neexistuje žádná kružnice, která ji obsahuje.
    intuition: |
      Most je hrana, kterou „nelze obejít“: neleží na žádném cyklu, takže mezi jejími
      konci neexistuje jiná cesta než ona sama. Odstraněním mostu se graf rozpadne
      (viz [Tvrzení 4.1](#prop-most-rozpojuje)). Představte si skutečný most přes řeku,
      když je jediný – jeho stržení odřízne jeden břeh od druhého.

      **Typické případy:** v každém stromu je mostem každá hrana (strom nemá kružnice).
      Naopak v kružnici $C_n$ ani v úplném grafu $K_n$ ($n \ge 3$) žádný most není.
    examples:
      - title: Most mezi trojúhelníkem a K4
        body: |
          Trojúhelník $a, b, x$ je hranou $\{x, y\}$ připojen k úplnému grafu $K_4$
          na uzlech $y, c, d, e$. Každá hrana trojúhelníku i každá hrana $K_4$ leží na
          nějaké kružnici, hrana $\{x, y\}$ však ne – jakákoli kružnice přes ni by se
          musela z „pravé“ části vrátit do „levé“ jinou cestou, a ta neexistuje.
          Hrana $\{x, y\}$ je tedy jediným mostem grafu.
        graph:
          directed: false
          nodes:
            - { id: a, x: 0, y: 8 }
            - { id: b, x: 0, y: 2 }
            - { id: x, x: 3, y: 5 }
            - { id: "y", x: 5.5, y: 5 }
            - { id: c, x: 7.5, y: 8 }
            - { id: d, x: 7.5, y: 2 }
            - { id: e, x: 10, y: 5 }
          edges:
            - { from: a, to: b }
            - { from: a, to: x }
            - { from: b, to: x }
            - { from: x, to: "y" }
            - { from: "y", to: c }
            - { from: "y", to: d }
            - { from: "y", to: e }
            - { from: c, to: d }
            - { from: c, to: e }
            - { from: d, to: e }
    visualization: blocks
    related: [prop-most-rozpojuje, thm-most-liche-stupne, def-artikulace, def-hranovy-rez]
    illustrations:
      - title: Most versus hrana na kružnici
        property: disconnecting-edges
        graph:
          directed: false
          nodes:
            - { id: a, x: 0, y: 8 }
            - { id: b, x: 0, y: 2 }
            - { id: x, x: 2.8, y: 5 }
            - { id: z, x: 5.5, y: 5 }
            - { id: c, x: 7.8, y: 8 }
            - { id: e, x: 7.8, y: 2 }
            - { id: d, x: 10, y: 5 }
          edges:
            - { from: a, to: b }
            - { from: a, to: x }
            - { from: b, to: x }
            - { from: x, to: z }
            - { from: z, to: c }
            - { from: c, to: d }
            - { from: d, to: e }
            - { from: e, to: z }
        steps:
          - caption: |
              Hrana $\{x, z\}$ neleží na žádné kružnici – je to **most**. Proto její odebrání graf rozpojí: trojúhelník vlevo a čtyřúhelník vpravo už nic jiného nespojuje.
            edge_set: [x-z]
          - caption: |
              Hrana $\{a, b\}$ leží na trojúhelníku $a, b, x$, mostem tedy není: po jejím odebrání spojuje $a$ s $b$ dál zbytek kružnice, cesta $a, x, b$.
            edge_set: [a-b]
          - caption: |
              Přidáme hranu $\{a, c\}$. Hrana $\{x, z\}$ teď leží na kružnici $a, x, z, c$ a mostem být přestala – po jejím odebrání drží graf pohromadě přes $\{a, c\}$.
            add: [[a, c]]
            edge_set: [x-z]
          - caption: |
              Rozpojit graf jde teď až dvojicí hran, např. $\{x, z\}$ a $\{a, c\}$. To je hranový řez, ale žádná z obou hran sama mostem není.
            edge_set: [x-z, a-c]
    source: "skripta str. 23; přednáška 6, fólie 1"

  - id: prop-most-rozpojuje
    kind: proposition
    label: "Tvrzení 4.1"
    section: "4.1"
    title: Odstranění mostu rozpojí graf
    terms:
      - most rozpojuje graf
      - odstranění mostu
      - G minus hrana
    statement: |
      Je-li graf $G$ souvislý a hrana $\{x, y\}$ jeho most, pak graf $G - \{x, y\}$,
      vzniklý odstraněním hrany $\{x, y\}$ z $G$, je nesouvislý.
    intuition: |
      Kdyby po odstranění hrany zůstaly $x$ a $y$ propojené jinou cestou, tato cesta
      spolu s hranou by uzavřela kružnici – a to most podle definice nedovoluje.
      Platí i obrácení: hrana souvislého grafu, jejímž odebráním graf přestane být
      souvislý, je most (kdyby ležela na kružnici, zbytek kružnice by její konce dál
      spojoval). Most je tedy přesně „jednoprvkový hranový řez“.
    proof: |
      Sporem. Předpokládejme, že $G - \{x, y\}$ je souvislý. Pak v něm existuje cesta
      $P$ z uzlu $x$ do uzlu $y$; ta hranu $\{x, y\}$ neobsahuje (v grafu
      $G - \{x, y\}$ už není). Přidáme-li k cestě $P$ hranu $\{x, y\}$, dostaneme v $G$
      kružnici, která hranu $\{x, y\}$ obsahuje. To je ve sporu s tím, že
      $\{x, y\}$ je most. Graf $G - \{x, y\}$ tedy souvislý není.
    proof_steps:
      - Předpokládáme pro spor, že graf $G - \{x, y\}$ je souvislý.
      - Pak v $G - \{x, y\}$ existuje cesta $P$ z $x$ do $y$, která hranu $\{x, y\}$ nepoužívá.
      - Cesta $P$ doplněná o hranu $\{x, y\}$ tvoří v $G$ kružnici obsahující $\{x, y\}$.
      - To odporuje definici mostu, takže $G - \{x, y\}$ je nesouvislý.
    related: [def-most, thm-most-liche-stupne]
    source: "skripta str. 23; přednáška 6, fólie 1"

  - id: thm-most-liche-stupne
    kind: theorem
    label: "Věta 4.1"
    section: "4.1"
    title: Graf s mostem má uzly lichého stupně
    terms:
      - most a lichý stupeň
      - uzly lichého stupně
      - parita stupňů
    statement: |
      Má-li souvislý graf $G$ most, pak má alespoň dva uzly lichého stupně.
    intuition: |
      Ekvivalentně: **souvislý graf, jehož všechny uzly mají sudý stupeň, nemá most.**
      To je užitečné např. u eulerovských grafů – v nich žádná hrana není mostem.
      Uzly lichého stupně přitom nemusí být konci mostu: mohou to být úplně jiné uzly
      grafu (viz příklad).
    proof: |
      Nechť $\{x, y\}$ je most a $G' = G - \{x, y\}$. Podle
      [Tvrzení 4.1](#prop-most-rozpojuje) je $G'$ nesouvislý; protože jsme odebrali jedinou
      hranu ze souvislého grafu, má $G'$ právě dvě komponenty a $x$, $y$ leží v různých
      z nich.

      Předpokládejme pro spor, že všechny uzly grafu $G$ mají sudý stupeň. V $G'$ klesne
      stupeň uzlů $x$ a $y$ o jedničku (stanou se lichými), ostatní stupně se nezmění
      (zůstanou sudé). Každá z obou komponent grafu $G'$ by tak obsahovala **právě jeden**
      uzel lichého stupně. V každém grafu (tedy i v komponentě chápané jako samostatný graf)
      je ale počet uzlů lichého stupně sudý, protože součet stupňů je $2|H|$. Spor.

      Graf $G$ má tedy aspoň jeden uzel lichého stupně, a protože jejich počet je sudý,
      má jich alespoň dva.
    proof_steps:
      - Odebráním mostu $\{x, y\}$ vznikne graf $G'$ s právě dvěma komponentami, v nichž leží $x$ a $y$ zvlášť.
      - Předpokládáme pro spor, že všechny stupně v $G$ jsou sudé.
      - V $G'$ mají $x$ a $y$ lichý stupeň a ostatní uzly sudý, takže každá komponenta $G'$ má právě jeden lichý uzel.
      - To odporuje tomu, že každý graf má sudý počet uzlů lichého stupně (součet stupňů je $2|H|$).
      - Tedy $G$ má lichý uzel, a protože jejich počet je sudý, má jich aspoň dva.
    examples:
      - title: Liché uzly nemusí ležet na mostu
        body: |
          Dva trojúhelníky spojené mostem mají liché stupně právě v koncích mostu (stupeň 3),
          ostatní uzly mají stupeň 2. Vezmeme-li ale místo trojúhelníků větší části, např.
          „kosočtverec s úhlopříčkou“ připojený mostem k jinému grafu, mohou mít konce mostu
          sudý stupeň a liché stupně se objeví jinde. Věta zaručuje jen to, že nějaké dva
          liché uzly v grafu existují.
    related: [def-most, prop-most-rozpojuje]
    illustrations:
      - title: Liché uzly nemusí ležet na mostu
        property: eulerian
        graph:
          directed: false
          nodes:
            - { id: b, x: 0.5, y: 7.5 }
            - { id: a, x: 4, y: 6 }
            - { id: g, x: 3.5, y: 2.5 }
            - { id: c, x: 0.5, y: 1 }
            - { id: d, x: 6, y: 6 }
            - { id: e, x: 9.5, y: 7.5 }
            - { id: h, x: 6.5, y: 2.5 }
            - { id: f, x: 9.5, y: 1 }
          edges:
            - { from: a, to: b }
            - { from: b, to: c }
            - { from: c, to: g }
            - { from: g, to: a }
            - { from: a, to: c }
            - { from: a, to: d }
            - { from: d, to: e }
            - { from: e, to: f }
            - { from: f, to: h }
            - { from: h, to: d }
            - { from: d, to: f }
        steps:
          - caption: |
              Hrana $\{a, d\}$ je most. Její konce mají **sudý** stupeň 4, liché stupně mají uzly $c$ a $f$. Věta slibuje jen to, že nějaké dva liché uzly v grafu existují – ne že leží na mostu.
            labels: { a: "4", b: "2", c: "3", g: "2", d: "4", e: "2", f: "3", h: "2" }
          - caption: |
              Přidáme hranu $\{c, f\}$: všechny stupně jsou teď sudé a graf je eulerovský. A most zmizel – hrana $\{a, d\}$ leží na kružnici $a, c, f, d$. Souvislý graf se sudými stupni most mít nemůže.
            add: [[c, f]]
            labels: { a: "4", b: "2", c: "4", g: "2", d: "4", e: "2", f: "4", h: "2" }
          - caption: |
              Odebereme naopak hranu $\{a, d\}$. Mostem je teď $\{c, f\}$ a liché stupně se objevily u $a$ a $d$ – most a liché uzly jdou ruku v ruce.
            remove: [[a, d]]
            labels: { a: "3", b: "2", c: "4", g: "2", d: "3", e: "2", f: "4", h: "2" }
      - title: Proč most vynutí liché stupně
        for: proof
        property: connected
        graph:
          directed: false
          nodes:
            - { id: b, x: 0.5, y: 7.5 }
            - { id: a, x: 4, y: 6 }
            - { id: g, x: 3.5, y: 2.5 }
            - { id: c, x: 0.5, y: 1 }
            - { id: d, x: 6, y: 6 }
            - { id: e, x: 9.5, y: 7.5 }
            - { id: h, x: 6.5, y: 2.5 }
            - { id: f, x: 9.5, y: 1 }
          edges:
            - { from: a, to: b }
            - { from: b, to: c }
            - { from: c, to: g }
            - { from: g, to: a }
            - { from: a, to: c }
            - { from: a, to: d }
