            - { from: a1, to: b2 }
        steps:
          - caption: |
              Dvě kopie $K_4$ spojené hranami $a_1 b_1$, $a_1 b_2$. Žádná hrana není most (každá leží na kružnici), takže $h(G) \ge 2$.
            edge_set: [a1-b1]
          - caption: |
              Dvě spojovací hrany graf rozpojí: $h(G) = 2$.
            edge_set: [a1-b1, a1-b2]
