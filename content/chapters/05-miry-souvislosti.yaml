  - id: thm-menger
    kind: theorem
    label: "Věta 4.7"
    section: "4.3"
    title: Mengerova věta
    terms:
      - Mengerova věta
      - Menger
      - uzlově disjunktní cesty
      - vnitřně disjunktní cesty
      - internally disjoint paths
      - vertex-disjoint paths
      - Menger's theorem
    statement: |
      Graf $G$ je uzlově $k$-souvislý mezi **nesousedními** uzly $a$ a $b$ (tj.
      $u_G(a, b) \ge k$), právě když v něm existuje $k$ uzlově disjunktních cest
      vedoucích z $a$ do $b$.

      (Uzlově disjunktní cesty z $a$ do $b$ mají společné jen koncové uzly $a$, $b$.)
    intuition: |
      Uzlová obdoba Věty 4.6: nejmenší počet uzlů oddělujících $a$ od $b$ = největší počet
      cest z $a$ do $b$, které se „nepotkávají“ ve vnitřních uzlech. Předpoklad
      nesousednosti je nutný – sousední uzly odebráním jiných uzlů oddělit nejde a hrana
      $\{a, b\}$ by v síti dala nekonečný tok.

      **Trik „půlení uzlů“:** uzlová omezení převedeme na hranová tak, že každý uzel $x$
      rozdělíme na vstupní polouzel $(x, 1)$ a výstupní polouzel $(x, 2)$ spojené hranou
      propustnosti 1 – uzlem pak může projít nejvýše jedna jednotka toku, tj. nejvýše
      jedna cesta.
    proof: |
      *Náčrt úplného důkazu (skripta uvádějí jen konstrukci a odkaz na analogii
      s Větou 4.6).*

      Zavedeme síť $\vec{G}$:

      $$
      U(\vec{G}) = \{(x, i) \mid x \in U(G),\ i = 1, 2\},
      $$

      $$
      H(\vec{G}) = \{((x, 1), (x, 2)) \mid x \in U(G)\} \cup \{((x, 2), (y, 1)) \mid \{x, y\} \in H(G)\}.
      $$

      Hrany typu $((x, 1), (x, 2))$ mají propustnost 1, hrany typu $((x, 2), (y, 1))$
      (každá hrana $G$ dává dvě, pro obě orientace) propustnost $\infty$. Zdrojem je
      $(a, 2)$, stokem $(b, 1)$.

      *Konečné řezy odpovídají uzlovým množinám oddělujícím $a$ od $b$.* Protože $a, b$
      nejsou sousední, neexistuje hrana $((a, 2), (b, 1))$ a konečné řezy existují. Řez
      konečné propustnosti (množina $S \ni (a, 2)$, $(b, 1) \notin S$) nesmí opouštět žádná
      hrana s propustností $\infty$, takže ho opouštějí jen hrany $((x, 1), (x, 2))$ pro
      uzly $x$ z jisté množiny $A \subset U(G) \setminus \{a, b\}$. Každá cesta
      $a, v_1, \dots, v_m, b$ v $G$ odpovídá cestě
      $(a,2), (v_1,1), (v_1,2), \dots, (v_m,2), (b,1)$ v síti, která musí $S$ opustit, tedy
      některé $v_i \in A$: množina $A$ odděluje $a$ od $b$ a propustnost řezu je
      $|A| \ge u_G(a, b)$. Naopak pro uzlový řez $A$ s $u_G(a, b)$ prvky položíme
      $S = \{(x, 1), (x, 2) \mid x \text{ dosažitelný z } a \text{ v } G - A\} \cup \{(x, 1) \mid x \in A\}$;
      ze $S$ vycházejí jen hrany $((x, 1), (x, 2))$, $x \in A$, takže řez má propustnost
      $u_G(a, b)$. Minimální řez má tedy propustnost $u_G(a, b)$.

      *Toky odpovídají vnitřně disjunktním cestám.* Celočíselný tok velikosti $k$ se
      rozloží na $k$ cest ze $(a, 2)$ do $(b, 1)$; každá prochází uzlem $x \ne a, b$ přes
      hranu $((x, 1), (x, 2))$ s propustností 1, takže žádné dvě cesty nesdílejí vnitřní
      uzel – v $G$ jsou to uzlově disjunktní cesty. Obráceně $k$ uzlově disjunktních cest
      v $G$ dává tok velikosti $k$.

      Podle věty o maximálním toku a minimálním řezu
      ([Ford–Fulkerson](#thm-ford-fulkerson)) tedy: $u_G(a, b) \ge k$ $\iff$ max. tok
      $\ge k$ $\iff$ existuje $k$ uzlově disjunktních cest.
    proof_steps:
      - Každý uzel $x$ rozpůlíme na $(x,1)$ a $(x,2)$ s hranou propustnosti 1; hraně $\{x,y\}$ odpovídají hrany $((x,2),(y,1))$ a $((y,2),(x,1))$ s propustností $\infty$.
      - Zdrojem je $(a,2)$, stokem $(b,1)$; díky nesousednosti $a, b$ existují řezy konečné propustnosti.
      - Konečný řez mohou opouštět jen hrany $((x,1),(x,2))$ a příslušné uzly $x$ tvoří množinu oddělující $a$ od $b$.
      - Naopak z minimálního uzlového řezu sestrojíme řez sítě stejné propustnosti, takže min. řez = $u_G(a,b)$.
      - Celočíselný maximální tok se rozloží na cesty, které díky propustnosti 1 na „půlicích“ hranách nesdílejí vnitřní uzly.
      - Podle věty max. tok = min. řez dostaneme $u_G(a,b) \ge k$, právě když existuje $k$ uzlově disjunktních cest.
    examples:
      - title: Konstrukce sítě půlením uzlů
        body: |
          Graf $G$ s uzly $a, x, y, b$ a hranami $ax$, $ay$, $xy$, $xb$, $yb$.
          Uzly $a$ a $b$ jsou nesousední a $u_G(a, b) = 2$ (řez $\{x, y\}$); odpovídající
          dvě uzlově disjunktní cesty jsou $a\,x\,b$ a $a\,y\,b$.

          V síti (níže) mají hrany $(v, 1) \to (v, 2)$ propustnost 1 a ostatní hrany
          propustnost $\infty$ (atribut `cap`). Maximální tok ze $(a, 2)$ do $(b, 1)$
          má velikost 2 a minimální řez tvoří hrany $(x,1)\to(x,2)$ a $(y,1)\to(y,2)$.
        graph:
          directed: true
          nodes:
            - { id: a1, x: 0, y: 5 }
            - { id: a2, x: 2, y: 5 }
            - { id: x1, x: 4, y: 9 }
            - { id: x2, x: 6, y: 9 }
            - { id: y1, x: 4, y: 1 }
            - { id: y2, x: 6, y: 1 }
            - { id: b1, x: 8, y: 5 }
            - { id: b2, x: 10, y: 5 }
          edges:
            - { from: a1, to: a2, w: 1 }
            - { from: x1, to: x2, w: 1 }
            - { from: y1, to: y2, w: 1 }
            - { from: b1, to: b2, w: 1 }
            - { from: a2, to: x1, cap: "∞" }
            - { from: x2, to: a1, cap: "∞" }
            - { from: a2, to: y1, cap: "∞" }
            - { from: y2, to: a1, cap: "∞" }
            - { from: x2, to: y1, cap: "∞" }
            - { from: y2, to: x1, cap: "∞" }
            - { from: x2, to: b1, cap: "∞" }
            - { from: b2, to: x1, cap: "∞" }
            - { from: y2, to: b1, cap: "∞" }
            - { from: b2, to: y1, cap: "∞" }
    related: [thm-ford-fulkerson-hranova-souvislost, thm-ford-fulkerson, def-uzlovy-stupen-mezi-uzly, rem-puleni-uzlu, alg-uzlova-souvislost, cor-whitney-globalni]
    illustrations:
      - title: Vnitřně disjunktní cesty = nejmenší uzlový řez
        property: separating-set
        graph:
          directed: false
          nodes:
            - { id: a, x: 0, y: 5 }
            - { id: p1, x: 3, y: 9 }
            - { id: p2, x: 3, y: 5 }
            - { id: p3, x: 3, y: 1 }
            - { id: r1, x: 7, y: 7.5 }
            - { id: r2, x: 7, y: 2.5 }
            - { id: b, x: 10, y: 5 }
          edges:
            - { from: a, to: p1 }
            - { from: a, to: p2 }
            - { from: a, to: p3 }
            - { from: p1, to: r1 }
            - { from: p2, to: r1 }
