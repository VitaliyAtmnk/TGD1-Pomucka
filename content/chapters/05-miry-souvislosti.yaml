  - id: thm-ford-fulkerson-hranova-souvislost
    kind: theorem
    label: "Věta 4.6"
    section: "4.3"
    title: "Ford–Fulkersonova věta pro hranovou souvislost"
    terms:
      - Ford-Fulkersonova věta pro hranovou souvislost
      - hranově disjunktní cesty
      - edge-disjoint paths
      - Mengerova věta hranová verze
      - hranová souvislost a toky
    statement: |
      Graf $G$ je hranově $k$-souvislý mezi uzly $a$ a $b$, $a \ne b$ (tj.
      $h_G(a, b) \ge k$), právě když v něm existuje $k$ hranově disjunktních cest
      vedoucích z $a$ do $b$.
    intuition: |
      Dvě „duální“ veličiny se rovnají: **nejmenší počet hran, které oddělí $a$ od $b$** =
      **největší počet cest z $a$ do $b$, které nesdílejí hranu**. Snadný směr: má-li
      $k$ cest společné jen uzly, musí řez přestřihnout každou zvlášť, tedy má aspoň $k$
      hran. Těžký směr (existence cest) dává věta o maximálním toku a minimálním řezu.

      Důkaz je zároveň **algoritmus**: $h_G(a, b)$ je velikost maximálního toku v síti
      vzniklé symetrickou orientací $G$ s jednotkovými propustnostmi
      ([algoritmus](#alg-hranova-souvislost)).
    proof: |
      Převedeme úlohu na maximální tok. Sestrojme síť $\vec{G}$: každou hranu $\{x, y\}$
      grafu $G$ nahradíme dvojicí opačně orientovaných hran $(x, y)$ a $(y, x)$ (symetrická
      orientace), všechny propustnosti položíme rovny 1; $a$ je zdroj, $b$ stok.

      *Minimální řez sítě má velikost $h_G(a, b)$.* Řez v síti je určen množinou uzlů $S$
      s $a \in S$, $b \notin S$; jeho propustnost je počet hran $G$ mezi $S$ a
      $U \setminus S$. Ty přerušují všechny cesty z $a$ do $b$, obsahují tedy hranový řez,
      takže propustnost je aspoň $h_G(a, b)$. Naopak pro hranový řez $B$ o $h_G(a, b)$
      hranách vezmeme za $S$ množinu uzlů dosažitelných z $a$ v $G - B$; z minimality $B$
      vedou mezi $S$ a doplňkem právě hrany $B$, takže řez má propustnost $h_G(a, b)$.

      1. Nechť $h_G(a, b) \ge k$. Podle [Ford–Fulkersonovy věty](#thm-ford-fulkerson)
         (max. tok = min. řez) má maximální tok velikost aspoň $k$, a protože propustnosti
         jsou celočíselné, existuje celočíselný maximální tok – na každé hraně 0 nebo 1.
         (Nese-li tok obě hrany $(x, y)$ i $(y, x)$, můžeme ho na obou vynulovat, velikost
         se nezmění.) Hrany s tokem 1 se rozkládají na aspoň $k$ orientovaných cest z $a$
         do $b$, které nesdílejí hranu; v $G$ jsou to hranově disjunktní cesty.
      2. Nechť naopak v $G$ existuje $k$ hranově disjunktních cest z $a$ do $b$. Pošleme po
         každé tok 1 (v příslušné orientaci); dostaneme přípustný tok velikosti $k$. Proto
         má každý řez v síti propustnost aspoň $k$, a podle předchozího odstavce
         $h_G(a, b) \ge k$. (Přímo: každý hranový řez musí obsahovat aspoň jednu hranu
         z každé z $k$ hranově disjunktních cest.)
    proof_steps:
      - Sestrojíme síť $\vec{G}$ symetrickou orientací grafu $G$, všechny propustnosti 1, zdroj $a$, stok $b$.
      - Ukážeme, že minimální řez v $\vec{G}$ má propustnost právě $h_G(a,b)$ (řezy v síti odpovídají množinám hran oddělujícím $a$ od $b$).
      - Je-li $h_G(a,b) \ge k$, má podle Ford–Fulkersonovy věty maximální tok velikost aspoň $k$ a lze ho zvolit celočíselný (0/1 na hranách).
      - Hrany s tokem 1 se rozloží na aspoň $k$ cest z $a$ do $b$ bez společných hran.
      - Obráceně $k$ hranově disjunktních cest dává tok velikosti $k$, takže každý řez má aspoň $k$ hran a $h_G(a,b) \ge k$.
    related: [thm-ford-fulkerson, alg-ford-fulkerson, def-hranovy-stupen-mezi-uzly, thm-menger, alg-hranova-souvislost, cor-whitney-globalni]
    illustrations:
      - title: Disjunktní cesty a minimální řez
        property: disconnecting-edges
        graph:
          directed: false
          nodes:
            - { id: a, x: 0, y: 5 }
            - { id: p, x: 2.5, y: 8.5 }
            - { id: q, x: 2.5, y: 1.5 }
            - { id: m, x: 5, y: 5 }
            - { id: r, x: 7.5, y: 8.5 }
            - { id: s, x: 7.5, y: 1.5 }
            - { id: b, x: 10, y: 5 }
          edges:
            - { from: a, to: p }
            - { from: a, to: q }
            - { from: p, to: m }
            - { from: q, to: m }
            - { from: m, to: r }
            - { from: m, to: s }
            - { from: r, to: b }
            - { from: s, to: b }
        steps:
          - caption: |
              Dvě cesty z $a$ do $b$ bez společné hrany: $a\,p\,m\,r\,b$ a $a\,q\,m\,s\,b$ (uzel $m$ sdílet smějí). V síti s jednotkovými propustnostmi je to tok velikosti 2.
            edges: { a-p: path, p-m: path, m-r: path, r-b: path, a-q: tree, q-m: tree, m-s: tree, s-b: tree }
            edge_labels: { a-p: "1/1", p-m: "1/1", m-r: "1/1", r-b: "1/1", a-q: "1/1", q-m: "1/1", m-s: "1/1", s-b: "1/1" }
          - caption: |
              Snadný směr věty: každý hranový řez musí přestřihnout **každou** z disjunktních cest zvlášť. Jedna hrana proto nestačí – druhá cesta zůstane.
            edge_set: [a-p]
          - caption: |
              Dvě hrany $\{p, m\}$, $\{q, m\}$ už $a$ od $b$ oddělí. Minimální řez má 2 hrany = maximální počet hranově disjunktních cest, tedy $h_G(a, b) = 2$.
            edge_set: [p-m, q-m]
          - caption: |
              Uzlově disjunktní ty cesty nejsou – obě procházejí $m$, který je artikulací. Uzlová souvislost mezi $a$ a $b$ je jen 1; tu popisuje Mengerova věta.
            nodes: { m: active }
